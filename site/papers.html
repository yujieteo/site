s of spectral algebraic geometry seminar notes (KTH/SU): spectra as $S$-modules","note":"facets of spectral algebraic geometry seminar notes (KTH/SU): spectra as $S$-modules, $THH(A)=A\\otimes^*_S A$, $TC^t$ the $S^1$-equivariant refinement, and $MP$ (the 2-periodization of $MU$) as an affine chart for the moduli stack of oriented spectral formal groups. Key computation: $\\pi_*MU\\cong L$, the Lazard ring, so formal groups over $R$ are classified by $L\\to R$, and $E^*(X)=MU^*(X)\\otimes_{MU^*(*)}E^*(*)$ defines a cohomology theory iff $(p,v_1^{(p)},...,v_n^{(p)})$ is regular in $E^*(*)$ for all $p,n$ (Landweber), equivalently $\\mathrm{Spec}\\,R\\to M_{fg}$ flat, classifying Landweber-exact theories as flat families over the moduli stack of formal groups.","date":""},{"tags":["umich.edu"],"category":"umich.edu","url":"https://public.websites.umich.edu/~bhattb/teaching/mat679w17/lectures.pdf","title":"Bhargav Bhatt","note":"Bhargav Bhatt, perfectoid spaces via inversions/tilting, developing the tilting correspondence and almost purity in dimension 0 and in characteristic $p$. Key computation: Theorem 3.2.8 — for a perfectoid field $K$, the tilt $L\\mapsto L^\\flat$ induces an equivalence of finite-étale categories $\\hat{K}_{\\text{ét}}\\simeq \\hat{K}^\\flat_{\\text{ét}}$, i.e. finite extensions of $K$ are classified by finite extensions of $K^\\flat$; concretely $\\mathbb{Z}_p^\\flat\\cong\\mathbb{F}_p((t^{1/p^\\infty}))$, with the chain $\\mathrm{Perf}_K\\simeq\\mathrm{Perf}_{K^{\\circ a}}\\simeq\\mathrm{Perf}_{K^{\\circ a}/\\pi}$ implemented by $R\\mapsto R^{\\circ a}$, $A\\mapsto A^*/[1/t]$, $A\\mapsto A/\\pi$.","date":""},{"tags":["ku.dk"],"category":"ku.dk","url":"https://www.math.ku.dk/english/calendar/events/zeta-values/slides--abstracts/talks_Krauze.pdf","title":"Krauze","note":"Krauze, prismatic envelopes and an explicit algorithm computing $\\mathbb{Z}_p(i)(O_K/\\varpi^n)$. Key computation: for $A=W(k)[[z]]$, $R=O_K/\\varpi^n=A/(E(z),z^n)$, the prismatic envelope $\\Delta_{R/A}=(A\\{a\\}/(da-r)_\\delta)^\\wedge_{p,d}$ is free over $R$ on monomials $\\prod(\\delta^u a)^{e_u}$ with $e_u<p$, and $\\mathbb{Z}_p(i)(R)$ is the fiber of $\\mathrm{can}-\\varphi$ on the double complex over $\\Delta_{R/\\mathbb{Z}_p[[z_0,z_1]]}$; using the staircase bases $z^kd^c\\prod f_u^{e_u}$ ($c+p^ue_u\\ge i$) and a comparison lemma for differing differentials, Theorem 5.1 gives $|H^1(\\mathbb{Z}_p(i)(O_K/\\varpi^n))|/|H^2(\\mathbb{Z}_p(i)(O_K/\\varpi^n))|=q^{(n-1)i}$, hence $|K_{2i-1}(O_K/\\varpi^n)|/|K_{2i-2}(O_K/\\varpi^n)|=q^{(n-1)i}(q^i-1)$, and Theorem 5.2 gives even vanishing $K_{2i-2}(O_K/\\varpi^n)=0$ for $i\\gg0$.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/DAG2022/DAG13%2B14.pdf","title":"Dominic Joyce","note":"Dominic Joyce, obstruction theories, virtual classes, and invariants: constructs virtual fundamental classes for quasi-smooth derived schemes. Key computation: for $X=s^{-1}(0)$ the derived zero locus of a section $s:V\\to E$ with $V$ smooth and $E$ a vector bundle, $L_X\\simeq[E^*|_X\\xrightarrow{Ds}T^*V|_X]$, $\\mathrm{vdim}(X)=\\dim(V)-\\mathrm{rank}(E)$, and $[X]^{\\mathrm{virt}}=[V]\\cap c_{\\mathrm{rank}(E)}(E)$; for plane curves $C,D\\subset\\mathbb{CP}^2$ of degrees $m,n$ this gives the virtual intersection number $mn$ even when $C\\cap D$ is not transverse.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://jiantongliu.github.io/files/Categorifying_Spectra.pdf","title":"Jiantong Liu","note":"Jiantong Liu, categorifying spectra: explains the Ramzi–Sosnilo–Winges construction showing every spectrum occurs as nonconnective $K$-theory of a small idempotent-complete stable $\\infty$-category. Key computation: the Dundas–McCarthy linearization is $M\\simeq\\mathrm{colim}_n\\Omega^n\\widetilde{K}(\\mathrm{Sp}^\\omega;\\Sigma^nM)$; identifying this colimit as $K(C_M)$ yields $K(C_M)\\simeq M$ functorially, and the resulting examples show the nonconnective theorem-of-the-heart map $K(E^\\heartsuit)\\to K(E)$ can fail without the Noetherian hypothesis.","date":""},{"tags":["mit.edu"],"category":"mit.edu","url":"https://math.mit.edu/~hrm/papers/notes-905.pdf","title":"algebraic topology lecture notes","note":"algebraic topology lecture notes, an explicit Tor calculation extracting torsion. Key computation: for $R=\\mathbb{Z}$ and $M=\\mathbb{Z}/n$, the free resolution $0\\to\\mathbb{Z}\\xrightarrow{n}\\mathbb{Z}\\to\\mathbb{Z}/n\\to0$ gives $\\mathbb{Z}/n\\otimes N\\cong N/nN$ and $\\mathrm{Tor}_1^{\\mathbb{Z}}(\\mathbb{Z}/n,N)\\cong\\ker(n:N\\to N)$, so $\\mathrm{Tor}_1$ extracts exactly the $n$-torsion of $N$.","date":""},{"tags":["uni-bonn.de"],"category":"uni-bonn.de","url":"https://www.math.uni-bonn.de/~schwede/universal_symmetries-9ecm.pdf","title":"Stefan Schwede","note":"Stefan Schwede, universal symmetries: global equivariant homotopy theory packages compatible equivariant homotopy theories for all compact Lie groups into global spectra and global Mackey functors. Key computation: $\\pi_0^G(\\mathbb{S})$ is the Burnside ring $A(G)$, freely generated by transfers $\\mathrm{tr}_H^G(1)$ over conjugacy classes of closed $H\\le G$ with finite Weyl group; the unit $\\mathbb{S}\\to KU$ sends a finite $G$-set to its permutation representation, giving the homomorphism $A(G)\\to R(G)$.","date":""},{"tags":["mit.edu"],"category":"mit.edu","url":"https://math.mit.edu/research/highschool/primes/materials/2024/October/12-4%20Jang.pdf","title":"Jiwu Jang","note":"Jiwu Jang, vertex functions of type D Nakajima quiver varieties: proves a product expression for type-$D$ vertex functions in terms of $q$-binomial factors indexed by roots. Key computation: for the $D_4$ quiver with dimension vector $v=(1,2,1,1)$ and framing $w=(0,0,0,1)$, the vertex function factors into $q$-binomial-series terms associated to specific $D_4$ roots; in the $D_1$ case $V(z)=\\sum_{k\\ge0}(\\hbar)_k/(q)_k\\cdot z^k$, the ordinary $q$-binomial series.","date":""},{"tags":["amazonaws.com"],"category":"amazonaws.com","url":"https://sf-web-assets-prod.s3.amazonaws.com/wp-content/uploads/2024/08/05104057/Dimitrov-Vesselin-Dimitrov.pdf","title":"Vesselin Dimitrov (joint with Frank Calegari and Yunqing Tang)","note":"Vesselin Dimitrov (joint with Frank Calegari and Yunqing Tang), arithmetic holonomy bounds and special values of $L$-functions: proves $\\mathbb{Q}$-linear independence results for $1,\\zeta(2)$, and $L(2,\\chi_{-3})$ using Apéry-style $G$-functions and modular periods. Key computation: with the Picard–Fuchs operator $L=x(1-x)(1-9x)d^2/dx^2+(1-20x+27x^2)d/dx+(9x-3)$, the chosen functions satisfy $L(A)=0$, $L(AB)=1$, and $L(AC)=1/(1-x)$; the Apéry limits identify $L(2,\\chi_{-3})/2$ and $\\zeta(2)/4$ as $w_6$-periods, producing simultaneous rational approximants.","date":""},{"tags":["umich.edu"],"category":"umich.edu","url":"https://public.websites.umich.edu/~kaletha/slides/Dospinescu.pdf","title":"Gabriel Dospinescu","note":"Gabriel Dospinescu, overview of the Fargues–Fontaine curve presenting the classification of vector bundles and its diamond-theoretic construction. Key computation: for $S=\\mathrm{Spa}(C)$ geometric, every rank-$n$ vector bundle on $X_C$ is uniquely classified by a nonincreasing slope sequence $\\lambda_1\\ge\\cdots\\ge\\lambda_n\\in\\mathbb{Q}$ through $\\mathcal{E}\\simeq\\bigoplus_i\\mathcal{O}(\\lambda_i)$, equivalently by $B(\\mathrm{GL}_n)$; this follows from $X_S=Y_S/\\varphi^{\\mathbb{Z}}$ and, for the pullback $\\mathcal{F}$ to the Stein space $Y_S$, the two-term computation $R\\Gamma(X_S,\\mathcal{E})\\simeq[\\mathcal{F}(Y_S)\\xrightarrow{1-\\varphi}\\mathcal{F}(Y_S)]$, so $H^i(X_S,\\mathcal{E})=0$ for $i>1$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/44/59/slides.pdf","title":"Alain Connes (joint with Caterina Consani)","note":"Alain Connes (joint with Caterina Consani), from noncommutative geometry to tropical geometry: develops the arithmetic site and a tropical Riemann–Roch theory for the scaling quotient $C_p=\\mathbb{R}_+^*/p^{\\mathbb{Z}}$. Key computation: for $p>2$, principal divisors lie in the kernel of degree and the pair $(\\deg,\\chi)$ gives $\\mathrm{Div}(C_p)/\\mathcal{P}\\xrightarrow{\\sim}\\mathbb{R}\\times\\mathbb{Z}/(p-1)\\mathbb{Z}$; with $H^0(D)_\\rho=\\{f\\in H^0(D):\\lVert f\\rVert_p\\le\\rho\\}$ and $\\mathrm{Dim}_{\\mathbb{R}}H^0(D)=\\lim_{n\\to\\infty}p^{-n}\\dim_{\\mathrm{top}}H^0(D)^{p^n}$, the slides compute $\\mathrm{Dim}_{\\mathbb{R}}H^0(D)-\\mathrm{Dim}_{\\mathbb{R}}H^0(-D)=\\deg D$.","date":""},{"tags":["univ-toulouse.fr"],"category":"univ-toulouse.fr","url":"https://www.math.univ-toulouse.fr/~btoen/ICM-2014-slides.pdf","title":"Bertrand Toën","note":"Bertrand Toën, derived algebraic geometry and deformation quantization: explains the canonical $(2-d)$-quantization of the derived stack $\\mathrm{Bun}_G(X)$ for a compact oriented $d$-manifold (or Calabi–Yau variety). Key computation: at a $G$-bundle $E$, $T_{\\mathrm{Bun}_G(X),E}\\simeq C^*(X,\\mathrm{ad}(E))[1]$; cup product followed by the invariant pairing on $\\mathfrak{g}$ and integration over $X$ produces a nondegenerate closed 2-form of degree $2-d$, hence a $(2-d)$-shifted Poisson structure, while higher formality identifies deformations of $D_{\\mathrm{qcoh}}(Z)$ as an $E_n$-monoidal dg-category with the dg Lie algebra $R\\Gamma(Z,\\mathrm{Sym}_{\\mathcal{O}_Z}(T_Z[-1-n]))[n+1]$, yielding the quantization.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/DAG2022/DAG7+8.pdf","title":"Dominic Joyce","note":"Dominic Joyce, triangulated categories and derived categories: culminates in the Fourier–Mukai classification of exact functors between derived categories of smooth projective schemes. Key computation: a kernel $\\mathcal{E}^\\bullet\\in D^b\\mathrm{coh}(X\\times Y)$ defines $\\Phi_{\\mathcal{E}}(\\mathcal{G}^\\bullet)=R(\\pi_Y)_*(L\\pi_X^*\\mathcal{G}^\\bullet\\otimes^L\\mathcal{E}^\\bullet)$; Mukai's formulas give its adjoints using $D_{X\\times Y}(\\mathcal{E}^\\bullet)\\otimes^L\\pi_Y^*K_Y[\\dim Y]$ and $D_{X\\times Y}(\\mathcal{E}^\\bullet)\\otimes^L\\pi_X^*K_X[\\dim X]$, and Orlov's theorem identifies every exact functor $D^b\\mathrm{coh}(X)\\to D^b\\mathrm{coh}(Y)$ with left and right adjoints with a unique such kernel up to isomorphism.","date":""},{"tags":["cirm-math.fr"],"category":"cirm-math.fr","url":"https://www.cirm-math.fr/RepOrga/2154/Slides/WangJonathan_nopause.pdf","title":"Jonathan Wang (joint with Tony Feng)","note":"Jonathan Wang (joint with Tony Feng), geometric periods: categorifies the $\\mathrm{GL}_2$ period formula and proves matching filtrations on its spectral and automorphic objects under geometric Langlands. Key computation: for $\\check{X}=\\mathrm{std}=\\mathbb{A}^2$ and $X=\\mathbb{G}_m\\backslash\\mathrm{GL}_2$, the two $\\check{G}$-orbits $\\{0\\}$ and $\\mathbb{A}^2\\setminus\\{0\\}=\\check{G}/\\check{\\mathrm{Mir}}_2$ yield the distinguished triangle $\\mathcal{L}_{\\mathrm{std}}\\to\\Pi^{\\mathrm{spec}}_*(\\omega_{\\mathrm{LocSys}_{\\check{X}/\\check{G}}})\\to\\mathrm{Eis}^{\\mathrm{spec}}_{\\check{\\mathrm{Mir}}_2}(\\omega_{\\mathrm{LocSys}_{\\mathbb{G}_m}})\\xrightarrow{[1]}$, whose first term has !-stalk $\\mathrm{Sym}\\,H^\\bullet_{\\mathrm{dR}}(C,E)$; unfolding produces the matching automorphic triangle with $T_{\\mathrm{Sym}(\\mathrm{std})}(\\mathrm{Whit})$, $\\Pi_!(\\mathbb{C}_{\\mathrm{Bun}_X})$, and $\\mathrm{Eis}_{\\mathrm{Mir}_2,!}(\\mathbb{C}_{\\mathrm{Bun}_{\\mathbb{G}_m}})$.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://sanathdevalapurkar.github.io/files/princeton-fall-23-talk.pdf","title":"Sanath K","note":"Sanath K. Devalapurkar, equivariant homotopy theory and geometric Langlands: proves generalized derived Satake equivalences with periodic and elliptic cohomology coefficients. Key computation: for simply connected, simply laced semisimple $G$, $\\mathrm{Shv}_G^c(\\Omega G;KU)\\otimes\\mathbb{Q}\\simeq\\mathrm{QCoh}(\\check{G}_{\\mathrm{sc}}/\\check{G})_{\\text{2-per}}$, replacing the rational equivalence $\\mathrm{Shv}_G^c(\\Omega G;\\mathbb{Q})\\simeq\\mathrm{QCoh}(\\check{\\mathfrak{g}}^*/\\check{G})$; for an elliptic theory $A$ with curve $E$, this becomes $\\mathrm{Shv}_{G/Z(G)}^c(\\Omega G;A)\\otimes\\mathbb{Q}\\simeq\\mathrm{QCoh}(\\mathrm{Bun}^{\\mathrm{ss},0}_{\\check{G}}(E))\\otimes_{\\pi_0A}\\pi_*(A_{\\mathbb{Q}})$, identifying the spectral moduli object from the coefficient theory's formal group.","date":""},{"tags":["rochester.edu"],"category":"rochester.edu","url":"https://www.sas.rochester.edu/mth/sites/doug-ravenel/otherpapers/carmelli-slides.pdf","title":"Shachar Carmeli","note":"Shachar Carmeli, cyclotomic redshift: presents chromatic cyclotomic extensions and their height-raising behavior under algebraic $K$-theory. Key computation: the splitting $S_{T(n)}[B^nC_{p^k}]\\simeq S_{T(n)}[B^nC_{p^{k-1}}]\\times S_{T(n)}[\\omega_{p^k}^{(n)}]$ defines a $(\\mathbb{Z}/p^k)^\\times$-Galois extension, and for every commutative $T(n)$-local ring spectrum $R$ the redshift equivalence $L_{T(n+1)}K(R[\\omega_{p^k}^{(n)}])\\simeq L_{T(n+1)}K(R)[\\omega_{p^k}^{(n+1)}]$ raises its chromatic height; passing to the tower gives cyclotomic hyperdescent $L_{K(n+1)}K(R[\\omega_{p^\\infty}^{(n)}])^{h\\mathbb{Z}}\\simeq L_{K(n+1)}K(R)$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/programs/scientific/12-13/quantumgroups/slides/Luef.pdf","title":"Franz Luef","note":"Franz Luef, noncommutative geometry and time-frequency analysis: identifies well-localized Gabor frames with projective modules and explicit projections over noncommutative tori. Key computation: the Feichtinger module $M_s^1(\\mathbb{R}^d)$ is an equivalence bimodule between $A_s^1(\\alpha\\mathbb{Z}\\times\\beta\\mathbb{Z},c)$ and $A_s^1(\\alpha^{-1}\\mathbb{Z}\\times\\beta^{-1}\\mathbb{Z},c)$ via the associativity identity ${}_\\Lambda\\langle f,g\\rangle h=f\\langle g,h\\rangle_{\\Lambda^\\circ}$; a Gabor atom satisfies $p_g={}_\\Lambda\\langle g,g\\rangle$, with $p_g^2=p_g=p_g^*$ exactly when $g\\langle g,g\\rangle_{\\Lambda^\\circ}=g$, and the canonical tight atom $h_0=S_{g,g}^{-1/2}g$ yields such a projection, existing for rectangular $\\Lambda=\\alpha\\mathbb{Z}\\times\\beta\\mathbb{Z}$ precisely when $\\alpha\\beta<1$.","date":""},{"tags":["princeton.edu"],"category":"princeton.edu","url":"https://web.math.princeton.edu/~lhamann/Compatibility_Presentation.pdf","title":"Linus Hamann","note":"Linus Hamann, compatibility of the Fargues–Scholze and Gan–Takeda local Langlands parameters for $\\mathrm{GSp}_4$ and its inner form in the stated unramified $p>2$ cases. Key computation: for a stable supercuspidal parameter $\\phi$ with packets $\\Pi_\\phi(G)=\\{\\pi\\}$ and $\\Pi_\\phi(J)=\\{\\rho\\}$, local-shtuka cohomology is $R\\Gamma_c(G,b,\\mu)[\\pi]\\simeq\\rho\\otimes(\\mathrm{std}\\circ\\phi)^\\vee\\otimes|\\cdot|^{-3/2}[-3]$ and $R\\Gamma_c(G,b,\\mu)[\\rho]\\simeq\\pi\\otimes(\\mathrm{std}\\circ\\phi)\\otimes|\\cdot|^{-3/2}[-3]$; for endoscopic $\\mathrm{std}\\circ\\phi\\simeq\\phi_1\\oplus\\phi_2$, the two packet members pair with the corresponding $\\phi_i$ summands.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://pouiyter.github.io/CIslides.pdf","title":"Guozhen Wang (joint with Ruochuan Liu)","note":"Guozhen Wang (joint with Ruochuan Liu), topological cyclic homology of local fields: computes the descent spectral sequences for $THH$, $TP$, and $TC$ of a local field's integers. Key computation: for $K/\\mathbb{Q}_p$ with ramification index $e$ and $d=[K(\\zeta_p):K]$, the slides obtain a Bott class $\\beta\\in E_2^{0,2d}(TC(\\mathcal{O}_K);\\mathbb{F}_p)$ and $E_2^{0,*}\\cong\\mathbb{F}_p[\\beta]$, $E_2^{1,*}\\cong\\mathbb{F}_p[\\beta]\\{\\lambda,\\gamma\\}\\oplus k[\\beta]\\{\\alpha_i^{(j)}\\mid1\\le i\\le e,1\\le j\\le d\\}$, $E_2^{2,*}\\cong\\mathbb{F}_p[\\beta]\\{\\lambda\\gamma\\}$, and $E_2^{i,*}=0$ for $i\\ge3$, forcing the descent spectral sequence to collapse.\nhttps://raphaelponge.org/wp-content/uploads/2019/10/berkeley_ncg4.pdf, Raphaël Ponge, the Connes–Chern character of a finitely summable spectral triple pairs with projective-module $K$-theory to recover the Fredholm index, and for the noncommutative torus is represented by its fundamental cyclic $2$-cocycle. Key computation: for $E=eA^q$ and $k\\geq p/2$, $\\operatorname{ind}D_{\\nabla^E}=\\frac12\\operatorname{Str}(D^{-1}[D,e])^{2k+1}=\\langle\\operatorname{Ch}(D),\\operatorname{Ch}(E)\\rangle$; for $A_\\theta$, $HP_0(A_\\theta)=\\langle\\tau_0,\\tau_2\\rangle$ with $\\tau_2(a^0,a^1,a^2)=\\tau_0(a^0(\\delta_1(a^1)\\delta_2(a^2)-\\delta_2(a^1)\\delta_1(a^2)))$, giving the index pairing explicitly.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/programs/scientific/13-14/COSY2014/slides/Ponge.pdf","title":"Raphaël Ponge (joint with Hang Wang)","note":"Raphaël Ponge (joint with Hang Wang), conformal deformation produces a twisted spectral triple whose Connes–Chern character is conformally invariant and is computed by a fixed-point local index cocycle. Key computation: $\\widehat g=k^{-2}g$ gives $(C^\\infty(M),L^2_{\\widehat g}(M,S),D_{\\widehat g})\\simeq(C^\\infty(M),L^2_g(M,S),\\sqrt{k}D_g\\sqrt{k})$ and, for the crossed product $C^\\infty(M)\\rtimes G$, $\\sigma_g(fu_\\phi)=k_\\phi^{-1}fu_\\phi$; for a $G$-invariant $g$, $\\operatorname{Ch}(D_g)_{\\sigma_g}$ is represented by $\\varphi_{2m}(f^0u_{\\phi_0},\\ldots,f^{2m}u_{\\phi_{2m}})=\\frac{(-i)^{n/2}}{(2m)!}\\sum_a(2\\pi)^{-a/2}\\int_{M_a^\\phi}\\widehat A(R^{TM_a^\\phi})\\wedge\\nu_\\phi(R^{N^\\phi})\\wedge f^0d\\widehat f^1\\wedge\\cdots\\wedge d\\widehat f^{2m}$.","date":""},{"tags":["au.dk"],"category":"au.dk","url":"https://qgm.au.dk/fileadmin/www.qgm.au.dk/Events/2014/Slides_Nitin.pdf","title":"Nitin Nitsure","note":"Nitin Nitsure, cotangent-complex Ext groups classify square-zero deformation problems for schemes, morphisms, and coherent sheaves and supply Artin-style tangent–obstruction data for algebraic moduli stacks. Key computation: for a flat $f:Y\\to X$ and a square-zero extension $X\\hookrightarrow X'$ with ideal $I$, the transitivity triangle $f^*L_{X/X'}\\to L_{Y/X'}\\to L_{Y/X}\\xrightarrow{[1]}$ yields $0\\to\\operatorname{Ext}^1(L_{Y/X},f^*I)\\to\\operatorname{Exal}(Y/X',f^*I)\\to\\operatorname{End}(f^*I)\\xrightarrow{\\partial}\\operatorname{Ext}^2(L_{Y/X},f^*I)$; the obstruction is $\\partial(\\operatorname{id}_{f^*I})$, lifts form a torsor under $\\operatorname{Ext}^1$, and infinitesimal automorphisms are $\\operatorname{Ext}^0$.","date":""},{"tags":["berkeley.edu"],"category":"berkeley.edu","url":"https://math.berkeley.edu/~avizeff/seminars/other/prismatic.pdf","title":"Avi Zeff","note":"Avi Zeff, prisms deperfect perfectoid geometry while prismatic cohomology recovers crystalline cohomology and equips quasiregular semiperfectoid rings with an explicit Nygaard filtration. Key computation: $R\\mapsto(A_{\\inf}(R),\\ker\\theta)$ and $(A,I)\\mapsto A/I$ give inverse equivalences between perfectoid rings and perfect prisms; for a crystalline prism $(A,I)$, $R\\Gamma_{\\mathrm{crys}}(R/A)\\simeq\\varphi^*\\Delta_{R/A}=\\Delta_{R/A}\\widehat\\otimes^L_{A,\\varphi_A}A$, while for quasiregular semiperfectoid $R$ the site has initial prism $(\\Delta_R^{\\mathrm{init}},(d))$, so $\\Delta_R=\\Delta_R^{\\mathrm{init}}$ is concentrated in degree $0$ and $N^{\\geq i}\\Delta_R=\\varphi^{-1}(d^i\\Delta_R)$.","date":""},{"tags":["raphaelponge.org"],"category":"raphaelponge.org","url":"https://raphaelponge.org/wp-content/uploads/2019/10/berkeley_ncg1.pdf","title":"Raphaël Ponge","note":"Raphaël Ponge, Connes' trace theorem identifies the Dixmier-trace noncommutative integral of an order-$-n$ pseudodifferential operator with its Wodzicki residue, recovering Riemannian volume spectrally. Key computation: Weyl's law gives $\\lambda_k(\\Delta_g)\\sim(k/(c_n\\operatorname{Vol}_gM))^{2/n}$, hence $\\Delta_g^{-n/2}$ is measurable and $\\operatorname{Tr}_\\omega(\\Delta_g^{-n/2})=c_n\\operatorname{Vol}_g(M)$; more generally, for $P\\in\\Psi^{-n}(M)$, $\\operatorname{Tr}_\\omega(P)=\\frac1n\\operatorname{Res}(P)$, so $\\operatorname{Tr}_\\omega(f\\Delta_g^{-n/2})=c_n\\int_M f(x)\\sqrt{g(x)}\\,d^nx$.","date":""},{"tags":["raphaelponge.org"],"category":"raphaelponge.org","url":"https://raphaelponge.org/wp-content/uploads/2019/10/berkeley_ncg2.pdf","title":"Raphaël Ponge","note":"Raphaël Ponge, the irrational noncommutative torus admits an explicit Dirac spectral triple, while conformal weights produce twisted spectral triples and a conformally invariant zeta value. Key computation: $A_\\theta=\\{\\sum_{m,n}a_{m,n}U^mV^n:(a_{m,n})\\in\\mathcal{S}(\\mathbb{Z}^2)\\}$ with $VU=e^{-2\\pi i\\theta}UV$, $\\partial=\\delta_1+i\\delta_2$, and $D=\\begin{psmallmatrix}0&\\partial^*\\\\ \\partial&0\\end{psmallmatrix}$ is isospectral to $\\partial+\\partial^*$ on $\\mathbb{T}^2$; a Weyl factor $k>0$ gives $\\sigma(a)=k^{-1}ak$ and the twisted triple $(A_\\theta^{\\mathrm{op}},H_\\varphi,D_\\varphi)_\\sigma$, for which $\\zeta(\\Delta_\\varphi;0)$ is independent of $\\varphi(a)=\\tau_0(ak^{-2})$.","date":""},{"tags":["raphaelponge.org"],"category":"raphaelponge.org","url":"https://raphaelponge.org/wp-content/uploads/2019/10/berkeley_ncg3.pdf","title":"Raphaël Ponge","note":"Raphaël Ponge, the $(b,B)$ mixed complex identifies periodic cyclic homology of smooth functions with de Rham cohomology and gives an explicit cyclic-homology Chern character for projective modules. Key computation: the HKR map $\\alpha(f^0\\otimes\\cdots\\otimes f^m)=\\frac1{m!}f^0df^1\\wedge\\cdots\\wedge df^m$ intertwines $(b,B)$ with $(0,d)$, yielding $HP_0(C^\\infty(M))\\simeq H^{\\mathrm{ev}}(M)$ and $HP_1(C^\\infty(M))\\simeq H^{\\mathrm{odd}}(M)$; for $E\\simeq eA^q$, $\\operatorname{Ch}_{2k}(e)=(-1)^k\\frac{(2k)!}{k!}\\operatorname{Tr}((e-\\frac12)\\otimes e^{\\otimes 2k})$ satisfies $(b+B)\\operatorname{Ch}(e)=0$ and depends only on $E$.","date":""},{"tags":["uni-muenster.de"],"category":"uni-muenster.de","url":"https://www.uni-muenster.de/IVV5WS/WebHop/user/nikolaus/Files/ICM_Slides.pdf","title":"Thomas Nikolaus","note":"Thomas Nikolaus, Frobenius maps in higher algebra turn topological Hochschild homology into a computable cyclotomic object and identify prismatic graded pieces of relative $\\mathrm{THH}$ and $\\mathrm{TC}$. Key computation: the Tate diagonal and multiplication give $\\varphi_p:R\\to(R^{\\otimes_S p})^{tC_p}\\to R^{tC_p}$ and $\\varphi_p:\\mathrm{THH}(R)\\to\\mathrm{THH}(R)^{tC_p}$; for connective $R$, $\\mathrm{TC}(R)\\simeq\\operatorname{map}_{\\mathrm{CycSp}}(\\mathbbm{1},\\mathrm{THH}(R))$, while for a prism $(A,I)$ and $R=A/I$ ultimate Bökstedt periodicity computes $\\mathrm{THH}_*(R/S_A)\\cong I^n/I^{n+1}$ in degree $2n$ and $0$ in odd degrees, and the complete filtration on $\\mathrm{TC}(R/S_A)$ has graded pieces $\\mathbb{Z}_p(i)(R/A)[2i]$.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://aritopo.github.io/2022-12/Yoon.pdf","title":"Seokbeom Yoon (joint with Stavros Garoufalidis)","note":"Seokbeom Yoon (joint with Stavros Garoufalidis), twisted Neumann–Zagier matrices compute twisted loop invariants of finite cyclic covers and force higher-loop asymptotic multiplicativity. Key computation: from $A(t)=G(t)-G'(t)$ and $B(t)=G''(t)-G(t)$ one has $A(t)B(1/t)^T=B(t)A(1/t)^T$; the twisted one-loop invariant is $\\Phi_{1,M}(t)=\\frac12\\det(A(t)\\operatorname{diag}(z_1'',\\ldots,z_N'')+B(t)\\operatorname{diag}(z_1^{-1},\\ldots,z_N^{-1}))$, and for the $n$-cyclic cover $\\Phi_{1,M^{(n)}}=\\prod_{\\omega^n=1}\\Phi_{1,M}(\\omega)$; for $M=S^3\\setminus4_1$, $\\Phi_{2,M^{(n)}}=\\frac{55\\sqrt3}{1512}n-\\frac{8\\sqrt3\\,n}{63(1-\\lambda^n)}+\\frac{8\\sqrt3\\,n}{63(1-\\lambda^n)^2}\\sim\\frac{55\\sqrt3}{1512}n$, where $\\lambda=(7+3\\sqrt5)/2$ is a root of $\\Phi_{1,M}(t)$.","date":""},{"tags":["wpmucdn.com"],"category":"wpmucdn.com","url":"https://bpb-us-e1.wpmucdn.com/s.wayne.edu/dist/2/145/files/2022/02/WBalderrama20220224.pdf","title":"William Balderrama","note":"William Balderrama, Borel-completed Morava theory supplies an equivariant $K(n)$-local sphere whose localization agrees with the explicit cofree construction, with a descent route to $RO(G)$-graded computations. Key computation: for a finite $p$-group the Segal conjecture gives $S_G^{\\wedge_p}\\simeq b_G(S)$ and $b_G(S_{K(n)})=b_G(E_n)^{h\\mathbb{G}_n}$, with $H_c^*(K;\\pi_?b_G(E_n))\\Longrightarrow\\pi_?b_G(E_n^{hK})$ and $\\pi_\\alpha b_G(E_n)=E_n^0\\operatorname{Th}(\\alpha)$; taking $K(n)_G=b_G(K(n))$ yields $L_{b_G(K(n))}S_G\\simeq b_G(S_{K(n)})$, while at height one $KU_G/(p)\\simeq b_G(KU/(p))$ and the explicit $C_2$ calculation has $KO_{C_2}/(\\eta_{C_2})\\simeq KR$.","date":""},{"tags":["uoregon.edu"],"category":"uoregon.edu","url":"https://pages.uoregon.edu/ncp/Courses/KThyReading_W24_Web/IntroLectureSlides/Talk_slides.pdf","title":"N","note":"N. Christopher Phillips, algebraic, topological, and operator-algebraic $K$-theory share the projective-module construction, which becomes a periodic cohomology theory for Banach algebras. Key computation: Swan's equivalence $\\operatorname{Vect}_{\\mathbb{C}}(X)\\simeq\\operatorname{Proj}_{\\mathrm{fg}}(C(X))$ identifies $K^0(X)=K_0(C(X))=G(V(X))$; concretely $V(A)$ is the monoid of stable Murray--von Neumann classes of idempotents in $M_\\infty(A)$, and for $A=\\mathcal{L}(\\ell^2)$ one has $V(A)\\cong\\{0,1,2,\\ldots,\\infty\\}$ with $n+\\infty=\\infty$, hence $K_0(A)=0$; Bott periodicity $K_0(SA)\\cong K_1(A)$ and $K_1(SA)\\cong K_0(A)$ then converts an extension $0\\to J\\to A\\to A/J\\to0$ into the six-term exact sequence in $K$-theory.","date":""},{"tags":["raphaelponge.org"],"category":"raphaelponge.org","url":"https://raphaelponge.org/wp-content/uploads/2019/10/tsinghua2.pdf","title":"Raphaël Ponge","note":"Raphaël Ponge, the Atiyah--Singer formula becomes the $K$-theoretic index pairing of the Dirac spectral triple, extending verbatim to finitely generated projective modules over a noncommutative algebra. Key computation: for a compact even-dimensional spin manifold and a bundle $E$, the twisted Dirac operator satisfies $\\operatorname{ind}D_E=(2\\pi i)^{-n/2}\\int_M\\widehat A(R^M)\\wedge\\operatorname{Ch}(F^E)$; Serre--Swan writes $E=eC^\\infty(M)^q$ and identifies $D_E$ with $e(D\\otimes1)e$, so the spectral triple $(A,H,D)$ sends $eA^q$ to the Fredholm operator $D_E=e(D\\otimes1)e$ and defines $\\operatorname{ind}_D:K_0(A)\\to\\mathbb{Z}$, recovering $\\operatorname{ind}_D[E]=(2\\pi i)^{-n/2}\\langle\\widehat A(R^M)^\\vee,E\\rangle$ when $A=C^\\infty(M)$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/45/34/slides.pdf","title":"Eva Viehmann (joint with Kieu Hieu Nguyen)","note":"Eva Viehmann (joint with Kieu Hieu Nguyen), modifications of the trivial $G$-bundle on the Fargues--Fontaine curve admit a canonical Harder--Narasimhan reduction, stratifying the $B_{\\mathrm{dR}}^+$-Grassmannian and relating weak admissibility to Newton strata. Key computation: Beauville--Laszlo gluing gives $\\mathrm{BL}:\\mathrm{Gr}_G\\to\\mathrm{Bun}_G$, and for $x\\in\\mathrm{Gr}_G(C)$ the unique parabolic $P\\subset G$ has a $P$-dominant slope vector $v_P$ with semistable Levi modification; this defines the lower semicontinuous map $\\mathrm{HN}:|\\mathrm{Gr}_{G,\\mu}|\\to B(G,\\mu)$, satisfying $\\mathrm{HN}(x)\\le[(b')^{-1}]$ on the Newton stratum where $\\mathcal{E}_{1,x}\\simeq\\mathcal{E}_{b'}$, while for classical $x\\in\\mathrm{Gr}_{G,\\mu}(K)$ equality $\\mathrm{HN}(x)=[(b')^{-1}]=\\mathrm{HN}_{\\mathrm{DOR}}(\\mathrm{BB}_\\mu(x))$ identifies the classical semistable and basic loci.","date":""},{"tags":["hku.hk"],"category":"hku.hk","url":"https://hkumath.hku.hk/~imr/event/SRC/files/slides_Xu_Shen.pdf","title":"Xu Shen (joint with Miaofen Chen and Laurent Fargues)","note":"Xu Shen (joint with Miaofen Chen and Laurent Fargues), the Fargues--Rapoport conjecture classifies exactly when the admissible and weakly admissible $p$-adic period domains coincide. Key computation: a point $x\\in\\mathcal{F}(G,\\mu)(C)$ modifies the Fargues bundle $\\mathcal{E}_b$ at $\\infty$ to $\\mathcal{E}_{b,x}$, giving $\\mathcal{F}(G,\\mu,b)^a(C)=\\{x\\mid\\mathcal{E}_{b,x}\\simeq\\mathcal{E}_1\\}$; for basic $[b_0]\\in B(G,\\mu)$, one proves $\\mathcal{F}(G,\\mu,b_0)^a=\\mathcal{F}(G,\\mu,b_0)^{wa}$ iff $(G,\\{\\mu\\})$ is fully Hodge--Newton decomposable, meaning each nonbasic $[b']\\in B(G,\\mu)$ has a Newton--Hodge contact point that is a break of the Newton polygon and reduces the datum to a proper Levi, with examples including $(\\mathrm{GL}_h,(1,0,\\ldots,0))$ and $(\\mathrm{GSp}_4,(1,1,0,0))$.","date":""},{"tags":["kskedlaya.org"],"category":"kskedlaya.org","url":"https://kskedlaya.org/slides/hopkins2011.pdf","title":"Kiran S","note":"Kiran S. Kedlaya, the Fargues--Fontaine curve converts $p$-adic Galois representations and relative étale local systems into semistable degree-zero vector bundles from which étale and de Rham realizations can be recovered. Key computation: with $P=\\bigoplus_{n\\ge0}B^{\\varphi=p^n}$, $X_{FF}=\\operatorname{Proj}(P)$ is regular, connected, noetherian, and one-dimensional, and $\\operatorname{Rep}_{\\mathbb{Q}_p}^{\\mathrm{cont}}(G_{\\mathbb{Q}_p})\\simeq\\operatorname{Bun}^{\\Gamma,\\mathrm{ss},\\mu=0}(X_{FF})$; for a perfect Banach $\\mathbb{F}_p$-algebra $R$, the relative construction $P_R=\\bigoplus_{n\\ge0}B_R^{\\varphi=p^n}$ yields natural equivalences between étale $\\mathbb{Q}_p$-local systems on $\\mathcal{M}(R)$, those on $\\mathcal{M}(\\widetilde R)$, and fibrewise semistable degree-zero bundles on $\\operatorname{Proj}(P_R)$, while the global $\\Gamma$-fixed sections and the completed local fraction field at the de Rham point recover étale and de Rham cohomology respectively.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://webhomes.maths.ed.ac.uk/~jpridham/Kslide.pdf","title":"J","note":"J. P. Pridham, smooth pro-Banach completion of algebraic $K$-theory is computed by real Deligne cohomology, refining the gap between discrete algebraic and topological $K$-theory. Key computation: differentiable cohomology gives $\\operatorname{Hom}(K^{\\mathrm{Ban}}(A),V)\\simeq P\\,R\\Gamma_{\\mathrm{diff}}(B\\mathrm{GL}(A),V)$; for $A=\\mathcal{O}_X(U)$ on a polydisc, $U_n(\\mathbb{C})\\backslash\\mathrm{GL}_n(A)$ is contractible, so this becomes relative continuous Lie algebra cohomology, whose primitive chains reduce by Loday--Quillen and Fréchet HKR to $\\widehat C_\\bullet(A)\\simeq\\bigoplus_{p>0}(\\Omega_A^{2p-\\bullet}/F^{p+1})$; adjoining the $\\mathfrak u$-contribution $(2\\pi i)^p\\mathbb{R}$ and sheafifying yields $K^{\\mathrm{Ban}}(X)\\simeq\\bigoplus_{p\\ge0}R\\Gamma_D(X,\\mathbb{R}(p))[2p]$ for compact complex $X$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/26/82/slides.pdf","title":"Rick Jardine","note":"Rick Jardine, persistent homotopy admits a controlled homotopy theory in which Rips stability is preserved quantitatively by homotopy-theoretic gluing. Key computation: a finite metric sample $X$ defines the system $V_*(X):s\\mapsto B P_s(X)$, and $d_H(X,Y)<r$ produces a homotopy interleaving $V_s(X)\\to V_s(Y)\\to V_{s+2r}(X)$, hence a $2r$-equivalence on every $\\pi_n$; if a sectionwise cofibration $A\\to B$ is an $r$-equivalence, every pushout $C\\to B\\cup_A C$ is a $2r$-equivalence, so for $X\\subset Y$ and $X\\subset W$ the comparison $V_*(W)\\cup_{V_*(X)}V_*(Y)\\to V_*(W\\cup Y)$ is a $6r$-equivalence, giving a quantitative excision theorem for the Vietoris--Rips functor.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/40/55/slides.pdf","title":"Michael Harris (joint with Wee Teck Gan and Will Sawin)","note":"Michael Harris (joint with Wee Teck Gan and Will Sawin), purity and globalization force ramification of Genestier--Lafforgue parameters of supercuspidal representations over local function fields. Key computation: for $F=k((t))$, a pure supercuspidal $\\pi$ compactly induced from $U=G(\\mathcal{O}_F)$ is globalized over $K=k(t)$ by the Poincaré series $P_\\phi(g)=\\sum_{\\gamma\\in G(K)}\\phi(\\gamma g)$ with $\\phi_z=\\phi_\\pi$ for $z\\in\\mathbb{G}_m(k)$, $\\phi_x=1_{G(\\mathcal{O}_x)}$ off $|\\mathbb{P}^1(k)|$, $\\phi_\\infty=1_{I_{\\infty,+}}$, and $\\phi_0=\\chi_k$, whose support gives $P_\\phi(1)=1$; if $L(\\pi)$ were unramified, purity would extend $L(\\Pi)_\\sigma$ to a punctually pure tame local system on $\\mathbb{G}_m$, hence a sum of finite-order tame characters, contradicting variation of $\\chi_k$, so $L(\\pi)$ is ramified and, for induction from a sufficiently small compact, wildly ramified.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/45/43/slides.pdf","title":"Kęstutis Česnavičius","note":"Kęstutis Česnavičius, the perfectoid approach proves purity for the Brauer group and for flat cohomology with finite flat coefficients. Key computation: for a perfectoid ring $A$ and a closed $Z\\subset\\operatorname{Spec}(A[1/p])$ of codimension at least $2$, prismatic Dieudonné theory sends a finite locally free commutative $p$-power-order group $G$ to $M(G)=\\operatorname{Ext}^1(G,\\mathcal{O}_{\\Prism})$ equipped with semilinear $F,V$ satisfying $FV=p$; $p$-complete arc hyperdescent reduces the resulting purity comparison to rank-one valuation rings, yielding $R\\Gamma(A,G)\\simeq R\\Gamma(\\operatorname{Spec}(A[1/p])\\setminus Z,G)$ and, for a regular local ring $(R,\\mathfrak m)$, $H^i_{\\mathfrak m}(R,G)=0$ for $i<\\dim R$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/45/35/slides.pdf","title":"Yves André","note":"Yves André, every finite covering of a regular scheme is an fpqc covering, equivalently every finite extension of a regular ring is dominated by a faithfully flat algebra. Key computation: for $R=\\mathbb{Z}_p[[x_2,\\ldots,x_n]]$ and finite reduced $R\\subset S$, adjoining all $p$-power roots gives the perfectoid algebra $R_\\infty=\\mathbb{Z}_p[p^{1/p^\\infty}][[x_2^{1/p^\\infty},\\ldots,x_n^{1/p^\\infty}]]^{\\wedge}$; after choosing $g$ with $S[1/pg]$ étale over $R[1/pg]$, perfectoid Abhyankar makes $S_\\infty^\\infty$ $(pg)^{1/p^\\infty}$-almost finite étale over $R_\\infty^\\infty$, and $T=\\Sigma^{-1}(\\prod_{\\mathbb N}S_\\infty^\\infty/\\bigoplus_{\\mathbb N}S_\\infty^\\infty)$ removes almostness to produce a perfectoid $S$-algebra faithfully flat over $R$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/45/41/slides.pdf","title":"Jessica Fintzen","note":"Jessica Fintzen, explicitly constructed omni-supercuspidal types force arbitrary algebraic automorphic forms to be congruent modulo $p^m$ to forms supercuspidal at $p$. Key computation: when $p$ exceeds the Coxeter number of $G$, there are nested compact opens $U_{p,1}\\supset U_{p,2}\\supset\\cdots$ and maps $\\lambda_m:U_{p,m}\\twoheadrightarrow\\mathbb{Z}/p^m\\mathbb{Z}$ such that $(U_{p,m},\\psi\\circ\\lambda_m)$ is a supercuspidal type for every nontrivial $\\psi$; consequently $M(U_{p,m}U^p,\\mathbb{Z}_p)/p^m\\simeq M(U_{p,m}U^p,A_m)$ Hecke-equivariantly, and every automorphic representation contributing to $M(U_{p,m}U^p,A_m)\\otimes_{\\mathbb{Z}_p}\\mathbb{Q}_p$ has supercuspidal local factor at $p$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/65/23/slides.pdf","title":"David Vogan","note":"David Vogan, real parabolic induction, cohomological induction, and weakly unipotent representations reduce the construction of large portions of the unitary dual to unitary data on Levi subgroups. Key computation: for a $\\theta$-stable $P=LU$ and an $(\\mathfrak l,L\\cap K)$-module $\\pi_L$ of infinitesimal character $\\gamma=\\gamma_z+\\gamma_d$, Zuckerman's functors satisfy $R^i(\\pi_L)=0$ for $i<s$ and $R^s(\\pi_L)$ is unitary when $\\pi_L$ is weakly unipotent unitary and $\\gamma_z$ is weakly antidominant on coroots of $U$; for $G=\\mathrm{GL}(2n)$, $L=\\mathrm{GL}(n)\\times\\mathrm{GL}(n)$, and $\\pi_L=(1\\otimes|\\det|^a)\\otimes(1\\otimes|\\det|^b)$, one has $\\gamma_z=[(a,\\ldots,a)(b,\\ldots,b)]$ and the required central condition is exactly $a-b\\ge0$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/46/44/slides.pdf","title":"Mark Goresky (with Robert MacPherson","note":"Mark Goresky (with Robert MacPherson, Günter Harder, and Robert Kottwitz), weighted cohomology turns Arthur's topological trace formula into a Lefschetz fixed-point formula for Hecke correspondences on arithmetic locally symmetric spaces. Key computation: the middle-weight truncation on the reductive Borel--Serre compactification satisfies $R\\pi_*W^\\mu H^*(X^{\\mathrm{RBS}})\\simeq IH^*(X^{\\mathrm{BB}})\\simeq H_{(2)}^*(X)$; for a hyperbolic fixed component $F$, its local term is $\\operatorname{lc}(F)=\\sum_i(-1)^i\\operatorname{Tr}(C^*\\mid H^i_{\\{\\mathrm{expanding}\\}}(U,A^\\bullet))$, and summing these boundary-stratum contributions recovers Arthur's $L^2$ Lefschetz number $L(C(h))=\\sum_i(-1)^i\\operatorname{Tr}(q_*p^*\\mid H^i_{(2)}(X;E_\\rho))$ and the discrete-series character factor.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://pouiyter.github.io/prismslice-4.pdf","title":"Guozhen Wang (joint with Ruochuan Liu)","note":"Guozhen Wang (joint with Ruochuan Liu), prismatic descent computes the mod-$p$ topological cyclic homology of $\\mathbb{Z}_p$ from a perfectoid resolution. Key computation: for $R=\\mathbb{Z}_p[p^{1/p^\\infty}]^{\\wedge}$, the descent Hopf algebroid gives $E_2^{*,*,*}=\\mathbb{F}_p[f,g,\\sigma^{\\pm1}]/(g^2)$, and with $\\psi(k)=(p^k-1)/(p-1)$ its Tate differentials are $d_{p\\psi(k)}(f^{p^{k-1}})=g f^{p^{k-1}+\\psi(k)-1}$; the survivors recover $(\\mathrm{TC}/p)_*(\\mathbb{Z}_p)$ as a free $\\mathbb{F}_p[v_1]$-module on $\\{1,\\gamma,a_0\\gamma,a_m\\mid0\\le m\\le p-1\\}$, in stems $0,-1,2p-2$, and $2p-2m-1$ respectively.","date":""},{"tags":["strickland1.org"],"category":"strickland1.org","url":"https://strickland1.org/talks/chromatic_talk.pdf","title":"Neil Strickland","note":"Neil Strickland, Morava $K$-theories classify the thick subcategories of finite spectra and organize stable homotopy into chromatic layers. Key computation: a finite $p$-local spectrum $X$ has type $n$ when $K(p,n)_*(X)\\ne0$ but $K(p,m)_*(X)=0$ for $m<n$, defining $\\mathcal{F}(p,n)$; every thick subcategory is one of the $\\mathcal{F}(p,n)$, while periodicity supplies $v:\\Sigma^dX\\to X$ inducing an isomorphism on $K(p,n)_*(X)$, and chromatic convergence decomposes $\\pi_*X$ into layers controlled by $K(p,n)$ with eventual periods $2(p^n-1)p^k$.","date":""},{"tags":["ulaval.ca"],"category":"ulaval.ca","url":"https://maine-quebec.mat.ulaval.ca/20/slides/Gautier_Ponsinet.pdf","title":"Gautier Ponsinet","note":"Gautier Ponsinet, universal norms of de Rham representations over perfectoid extensions are controlled by the positive Hodge--Tate part via the Fargues--Fontaine curve. Key computation: if $V$ is de Rham with Hodge--Tate weights at most $1$ and $V_0\\subset V$ is minimal such that $V/V_0$ has weights at most $0$, then for $T_0=T\\cap V_0$ and perfectoid $\\widehat L$, $H_e^1(L,V/T)=\\operatorname{Im}(H^1(L,V_0/T_0)\\to H^1(L,V/T))$; for an abelian variety, $\\widetilde{\\widehat A}=\\varprojlim_{[p]}\\widehat A\\simeq\\Gamma(X_{FF},\\mathcal{E}(\\widetilde{\\widehat A}))$ with all Harder--Narasimhan slopes positive, so the bundle classification gives $H^1(L,\\widetilde{\\widehat A})=0$ and recovers the Coates--Greenberg description of the Kummer image.","date":""},{"tags":["dwarn.se"],"category":"dwarn.se","url":"https://dwarn.se/slides/7wftop.pdf","title":"Christian Sattler and David Wärn","note":"Christian Sattler and David Wärn, a short proposition-valued axiom system inside homotopy type theory reconstructs the basic calculus of univalent $\\infty$-categories. Key computation: defining $[0]=\\mathbf{1}$ and $[n+1]=\\operatorname{Fun}([n],I)$, the Segal pushout $[2]\\simeq I\\amalg_{\\mathbf{1}}I$ makes $\\operatorname{Map}([2],C)\\simeq\\operatorname{Map}(I,C)\\times_{\\operatorname{Ob}(C)}\\operatorname{Map}(I,C)$ and hence defines composition; inductively $[n]$ is the colimit of its spine, giving $\\operatorname{Map}([n],C)\\simeq\\sum_{a:\\operatorname{Fin}(n+1)\\to\\operatorname{Ob}(C)}\\prod_{i:\\operatorname{Fin}(n)}C(a_i,a_{i+1})$, while the Rezk axiom identifies $(x\\simeq y)\\simeq(x=y)$.","date":""},{"tags":["cnrs.fr"],"category":"cnrs.fr","url":"https://indico.math.cnrs.fr/event/2518/attachments/754/844/09102013a.pdf","title":"Gabriele Vezzosi","note":"Gabriele Vezzosi, derived algebraic geometry realizes the reduced obstruction theory for stable maps to a K3 surface as the cotangent complex of a quasi-smooth derived Deligne--Mumford stack. Key computation: for a stable map $f:C\\to S$, the standard obstruction space fits into $H^1(C,T_C)\\to H^1(C,f^*T_S)\\to\\operatorname{Obs}_f\\to0$, and the symplectic identification $T_S\\simeq\\Omega_S^1$ followed by $df$ gives a surjection $a:\\operatorname{Obs}_f\\to H^1(C,\\omega_C)\\simeq\\mathbb{C}$, forcing $[\\overline{M}_g(S;\\beta)]_{\\mathrm{std}}^{\\mathrm{vir}}=0$; removing this factor produces a quasi-smooth $R\\overline{M}_g^{\\mathrm{red}}(S;\\beta)$ with obstruction space $\\ker a$ and the nontrivial reduced virtual class.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://swc-math.github.io/aws/2017/2017WeinsteinLecture4Slides.pdf","title":"Jared Weinstein","note":"Jared Weinstein, diamonds turn analytic adic spaces over $\\mathbb{Z}_p$ into pro-étale sheaves and identify perfectoid spaces over $\\mathbb{Q}_p$ with characteristic-$p$ perfectoid spaces over the diamond $\\operatorname{Spd}\\mathbb{Q}_p$. Key computation: $\\operatorname{Spd}\\mathbb{Q}_p=(\\operatorname{Spd}\\mathbb{Q}_p^{\\mathrm{cycl}})/\\mathbb{Z}_p^*$ and $(\\operatorname{Spd}\\mathbb{Q}_p)(S)=\\{S^\\sharp\\to\\operatorname{Spa}\\mathbb{Q}_p:(S^\\sharp)^\\flat\\simeq S\\}$; for $R$ a $\\mathbb{Q}_p$-vector space the associated diamond $\\widetilde H_C^\\diamond(R)=H^0(X_{R^\\flat},\\mathcal O(1))$ fits into $0\\to\\mathbb{Q}_p(1)\\to\\widetilde H_C^\\diamond\\to\\mathbb A_C^{1,\\diamond}\\to0$, and the construction yields $\\{\\text{perfectoid spaces}/\\mathbb{Q}_p\\}\\simeq\\{X/\\mathbb F_p\\text{ perfectoid}:X\\to\\operatorname{Spd}\\mathbb{Q}_p\\}$.","date":""},{"tags":["illinois.edu"],"category":"illinois.edu","url":"https://rezk.web.illinois.edu/baltimore-2010-power-ops-handout.pdf","title":"Charles Rezk","note":"Charles Rezk, height-$2$ Morava $E$-theory at $p=2$ gives an explicit twisted bialgebra of power operations, making $\\pi_0$ of every $K(2)$-local commutative $E$-algebra an amplified $\\Gamma$-ring. Key computation: for $E_0=\\mathbb Z_2[[a]]$, additive operations $Q_0,Q_1,Q_2$ satisfy $Q_1Q_0=2Q_2Q_1-2Q_0Q_2$, $Q_2Q_0=Q_0Q_1+aQ_0Q_2-2Q_1Q_2$, and $Q_0(x)=x^2+2\\theta(x)$; their Cartan formulas are encoded by $\\Delta(Q_0)=Q_0\\otimes Q_0+2Q_1\\otimes Q_2+2Q_2\\otimes Q_1$ and analogous displayed formulas for $\\Delta(Q_1),\\Delta(Q_2)$, while $\\Gamma$ has left $\\mathbb Z_2[[a]]$-basis $Q_0^iQ_{j_1}\\cdots Q_{j_r}$ with $j_k\\in\\{1,2\\}$, yielding $\\pi_0L_{K(2)}\\mathbb P_E(E)\\simeq \\widehat F_{(2,a)}$ for the free amplified $\\Gamma$-ring $F$.","date":""},{"tags":["wpmucdn.com"],"category":"wpmucdn.com","url":"https://cpb-us-e1.wpmucdn.com/s.wayne.edu/dist/0/60/files/2019/11/Beaudry-PartIV.pdf","title":"Agnès Beaudry","note":"Agnès Beaudry, the extended Morava stabilizer group realizes the $K(n)$-local sphere as homotopy fixed points of Morava $E$-theory and turns the local Adams--Novikov spectral sequence into continuous group cohomology. Key computation: Lubin--Tate deformation theory gives $(E_n)_0=\\mathbb Z_{p^n}[[u_1,\\ldots,u_{n-1}]]$ representing deformations of the height-$n$ Honda formal group and $\\mathbb G_n=\\{(f,i):i\\in\\operatorname{Gal}(\\mathbb F_{p^n}/\\mathbb F_p),\\ f:i^*\\Gamma_n\\xrightarrow\\sim\\Gamma_n\\}$; Goerss--Hopkins--Miller lifts its action to $E_n$, and $(E_n)_*E_n\\simeq\\operatorname{Hom}_c(\\mathbb G_n,(E_n)_*)$ promotes to $L_{K(n)}E_n^{\\bullet+1}\\simeq F_c((\\mathbb G_n)^{\\bullet+},E_n)$, hence $L_{K(n)}S^0\\simeq E_n^{h\\mathbb G_n}$ with $H_c^*(\\mathbb G_n,(E_n)_*)\\Longrightarrow\\pi_*L_{K(n)}S^0$.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/DAG2022/DAG1+2.pdf","title":"Dominic Joyce","note":"Dominic Joyce, Koszul cdgas retain relations among defining equations and make derived intersections quasi-smooth with the expected virtual dimension, recovering Bézout counts without transversality. Key computation: for $p_1,\\ldots,p_n\\in\\mathbb C[x_1,\\ldots,x_m]$, the cdga $A^*=\\mathbb C[x_1,\\ldots,x_m;y_1,\\ldots,y_n]$ with $|y_i|=-1$ and $dy_i=p_i$ has $H^0(A^*)=\\mathbb C[x_1,\\ldots,x_m]/(p_1,\\ldots,p_n)$ but its $H^{-1}$ distinguishes dependent presentations such as $(x^2,y^2)$ and $(x^2,y^2,x^2+y^2)$; thus $\\operatorname{Spec}A^*$ has $\\operatorname{vdim}=m-n$, and for plane curves $C,D\\subset\\mathbb{CP}^2$ of degrees $m,n$, the derived intersection $C\\times^R_{\\mathbb{CP}^2}D$ is proper quasi-smooth of virtual dimension $0$ with $[C\\times^R_{\\mathbb{CP}^2}D]^{\\mathrm{virt}}=mn$ even when the classical intersection has dimension $1$.","date":""},{"tags":["wordpress.com"],"category":"wordpress.com","url":"https://gdenittis.wordpress.com/wp-content/uploads/2016/08/chile-i-2016-2.pdf","title":"Giovanni Landi","note":"Giovanni Landi, Connes's reconstruction theorem characterizes compact oriented spin$^c$ manifolds spectrally, with the Dirac operator recovering dimension, distance, and measure from the commutative algebra. Key computation: an $n$-dimensional spectral triple has resolvent singular values $\\mu_k(|D|)\\sim2\\pi\\bigl(k/(\\Omega_n\\operatorname{vol}M)\\bigr)^{1/n}$ and Connes's distance formula $d(p,q)=\\sup\\{|f(p)-f(q)|:f\\in C^\\infty(M),\\ \\|[D,f]\\|\\le1\\}$, while integration is the Dixmier trace $\\int_M f\\,d\\mu_g\\sim\\mathop{\\rlap{-}\\!\\int}f|D|^{-n}$; imposing the first-order and orientability relations together with the spectral conditions and multiplicity $2^{n/2}$ reconstructs $A=C^\\infty(M)$ and $D$ as a Dirac operator, whereas the noncommutative example $(A(SU_q(2)),H,D)$ is regular, $3^+$-summable, and has dimension spectrum $\\{1,2,3\\}$ and $KO$-dimension $3$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/40/69/slides.pdf","title":"Hal Schenck (joint with R","note":"Hal Schenck (joint with R. Di Gennaro, G. Ilardi, R. M. Miró-Roig, and J. Vallès), finite eigenschemes classify free plane curves annihilated by a fixed derivation and control singular members of pencils. Key computation: for $\\delta=P_1\\partial_x+P_2\\partial_y+P_3\\partial_z$ of degree $a$ with finite eigenscheme $\\Gamma_\\delta$ cut out by the $2\\times2$ minors of $\\begin{psmallmatrix}x&P_1\\\\y&P_2\\\\z&P_3\\end{psmallmatrix}$, the resolution $0\\to\\mathcal O_{\\mathbb P^2}(-1)\\oplus\\mathcal O_{\\mathbb P^2}(-a)\\to\\mathcal O_{\\mathbb P^2}^3\\to\\mathcal J_{\\Gamma_\\delta}(a+1)\\to0$ gives $\\operatorname{length}(\\Gamma_\\delta)=1+a+a^2$; if $f\\in R_d$, $d\\ge a+1$, and $\\delta(f)=0$, then $V(f)$ is free with exponents $(a,d-a-1)$ exactly when $f\\in I_{\\Gamma_\\delta}$, while for a pencil generated by reduced $f\\in R_n,g\\in R_m$, the canonical derivation $\\delta_{f,g}=\\det(\\nabla f,\\nabla g,\\nabla)$ bounds singular members away from the base locus by $(n-1)^2+(n-1)(m-1)+(m-1)^2$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/68/slides.pdf","title":"Nathan Pagliaroli (joint with Hamed Hessam","note":"Nathan Pagliaroli (joint with Hamed Hessam, Masoud Khalkhali, and Luuk Verhoeven), quartic random fuzzy spectral triples reduce to explicit bi-tracial matrix models whose equilibrium measure computes a one-cut/two-cut spectral phase transition and identifies a double-scaling gravity class. Key computation: for the type $(1,0)$ triple $(M_N(\\mathbb C),M_N(\\mathbb C),D=\\{H,\\cdot\\})$, $\\int e^{-g\\operatorname{Tr}D^2-\\operatorname{Tr}D^4}\\,dD$ becomes $\\int e^{-[2Ng\\operatorname{Tr}H^2+2g(\\operatorname{Tr}H)^2+2N\\operatorname{Tr}H^4+8\\operatorname{Tr}H\\operatorname{Tr}H^3+6(\\operatorname{Tr}H^2)^2]}\\,dH$; the one-cut density $\\Psi(x)=\\pi^{-1}(-4a^2+\\tfrac1{2a^2}+4x^2)\\sqrt{4a^2-x^2}_+$ reaches zero at $a_c=1/\\sqrt[4]{8}$, giving $g_c=-4\\sqrt2$, after which $\\Psi(x)=\\tfrac2\\pi|x|\\sqrt{(x^2-a^2)(b^2-x^2)}_+$ has two-cut support; the double-scaling limit is the $(3,2)$ pure-gravity minimal model.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/21/slides.pdf","title":"Matthew Kennedy (joint results with Eli Shamovich and with Laurent Marcoux and Mikael…","note":"Matthew Kennedy (joint results with Eli Shamovich and with Laurent Marcoux and Mikael Rørdam Skoufranis), noncommutative Choquet theory classifies matrix-convex simplices and turns majorization of operator tuples into existence of a doubly stochastic completely positive map. Key computation: a compact noncommutative convex set $K$ is an nc simplex precisely when each $x\\in K$ has a unique maximal representing nc state, equivalently $A(K)^{**}$ is a von Neumann algebra; the nc Choquet order is the dilation order $\\mu\\prec_{\\mathrm{nc}}\\nu$ iff a Stinespring representation satisfies $\\pi_\\nu|_{A(K)}=\\begin{psmallmatrix}\\pi_\\mu|_{A(K)}&*\\\\ *&*\\end{psmallmatrix}$. Consequently, for self-adjoint tuples $a=(a_i),b=(b_i)$ in a finite von Neumann algebra $(M,\\tau)$, the inequalities $f(a)\\le f(b)$ for every continuous convex nc function $f$ are equivalent to $a_i=\\varphi(b_i)$ for all $i$ under one normal unital completely positive trace-preserving map $\\varphi:M\\to M$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/44/87/slides.pdf","title":"Markus J","note":"Markus J. Pflaum (joint with Hessel Posthuma and Xiang Tang), Hochschild homology of a proper Lie-groupoid convolution algebra localizes to its orbit space and, for compact actions, is computed from differential forms on fixed-point loci and the inertia space. Key computation: for the convolution sheaf $\\mathcal A$ on $X=M/G$, diagonal cutoff chain maps $\\Psi_{k,\\varepsilon}(x_0,\\ldots,x_k)=\\prod_{j=0}^k\\rho_\\varepsilon(d^2(x_j,x_{j+1}))$ admit homotopies $bH_{k,\\varepsilon}+H_{k-1,\\varepsilon}b=1-\\Psi_\\varepsilon$, proving $HH_*(\\mathcal A(X))\\simeq\\Gamma(X;\\mathcal{HH}_*(\\mathcal A))$; each stalk reduces to $C^\\infty(G_x\\ltimes N_x\\mathcal O)$, and the twisted Connes--HKR complex $(\\Omega^*(V),\\iota_{Y_h})$ for $Y_h(v)=v-hv$ is quasi-isomorphic via restriction and projection to $(\\Omega^*(V^h),0)$, hence $H_k(C^\\infty(V),{}_hC^\\infty(V))\\simeq\\Omega^k(V^h)$ and verifies Brylinski's inertia-form model for circle actions.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/57/18/slides.pdf","title":"Jamie Mingo","note":"Jamie Mingo, noncrossing-partition cumulants characterize free independence and convert the moment sequence of a noncommutative random variable into Voiculescu's compositional-transform equation. Key computation: Möbius inversion on $NC(n)$ gives $\\kappa_n(a_1,\\ldots,a_n)=\\sum_{\\pi\\in NC(n)}\\mu_{NC(n)}(\\pi,1_n)\\varphi_\\pi(a_1,\\ldots,a_n)$ and $\\varphi(a_1\\cdots a_n)=\\sum_{\\pi\\in NC(n)}\\kappa_\\pi(a_1,\\ldots,a_n)$; unital subalgebras $A_1,\\ldots,A_s$ are freely independent iff every mixed cumulant vanishes, namely $\\kappa_n(a_1,\\ldots,a_n)=0$ whenever $a_i\\in A_{j_i}$ and $\\ker(j)\\ne1_n$. Decomposing a noncrossing partition by the block containing $1$ yields $m_n=\\sum_{s=1}^n\\kappa_s\\sum_{i_1+\\cdots+i_s+s=n}m_{i_1}\\cdots m_{i_s}$, hence $C(zM(z))=M(z)$ and $R(z)=G^{\\langle-1\\rangle}(z)-z^{-1}$.","date":""},{"tags":["utexas.edu"],"category":"utexas.edu","url":"https://web.ma.utexas.edu/users/blumberg/stanford-slides-latest.pdf","title":"Andrew J","note":"Andrew J. Blumberg, trace methods identify topological Hochschild homology by the Hill--Hopkins--Ravenel norm and recover $TR$ and $TC$ from curves in algebraic $K$-theory. Key computation: for a ring spectrum $R$, the slides model $\\mathrm{THH}(R)$ as $N_e^{S^1}R$ and state that the equivariant homotopy type of $\\mathrm{THH}$ of a Thom spectrum is again an equivariant Thom spectrum; the cyclotomic restriction and Frobenius maps assemble $\\widetilde K(R[x]/x^n)$ over the indexing category $I$, and the completed limits $\\varprojlim_I\\Omega\\widetilde K(R[x]/x^n)$ recover $\\mathrm{TR}(R)$ and $\\mathrm{TC}(R)$, while $K\\operatorname{End}(\\mathcal C)\\simeq R\\operatorname{Hom}_{\\mathrm{Mot}}(S[t],\\mathcal C)$ identifies the trace motivically.","date":""},{"tags":["mit.edu"],"category":"mit.edu","url":"https://math.mit.edu/topology/notes/yakerson-slides.pdf","title":"Maria Yakerson","note":"Maria Yakerson, finite-flat transfers give a universal framed model for connective motivic algebraic $K$-theory and a Hilbert-scheme presentation over a perfect field. Key computation: the slides identify the motivic spectrum $\\mathrm{kgl}$ with the framed suspension spectrum generated by the presheaf $\\mathrm{Vect}$ of vector bundles, using the $\\mathbb A^1$-equivalence obtained from the Rees algebra of the canonical filtration on a finite flat algebra; group completion then turns the forgetful map from finite-flat Hilbert schemes to $\\mathrm{Vect}$ into an $\\mathbb A^1$-equivalence, producing $\\Omega_T^\\infty\\mathrm{kgl}\\simeq L_{\\mathrm{mot}}\\operatorname{Hilb}^{\\mathrm{fl}}(\\mathbb A^\\infty)$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/49/40/slides.pdf","title":"Maxence Mayrand (joint with Peter Crooks)","note":"Maxence Mayrand (joint with Peter Crooks), shifted symplectic geometry proves the regular Moore--Tachikawa construction of a two-dimensional TQFT from a complex semisimple group. Key computation: composition of $1$-shifted Lagrangian correspondences is the derived fibre product $L_1\\times_{G_2}L_2$, and Hamiltonian composition is symplectic reduction $(M\\times N)//H$; Kostant's slice $S\\subset\\mathfrak g^*_{\\mathrm{reg}}$ and abelian regular stabilizers give a Morita equivalence $T^*G|_{\\mathfrak g^*_{\\mathrm{reg}}}\\simeq T^*G|_S$, so the resulting abelian quasi-symplectic groupoid is a commutative Frobenius object and hence defines $\\eta_G:\\operatorname{Cob}_2\\to\\mathrm{Weinstein}^{1\\text{-}\\mathrm{symp}}$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/26/40/slides.pdf","title":"Iva Halacheva","note":"Iva Halacheva, Rickard complexes in categorical $\\mathfrak g$-representations yield perverse equivalences whose action on simple objects is the crystal cactus-group action. Key computation: for a categorical $\\mathfrak{sl}_2$-action, $\\Theta_n=(\\cdots\\to E^{(n+2)}F^{(2)}\\to E^{(n+1)}F^{(1)}\\to E^{(n)})$ induces $D^b(\\mathcal C_{-n})\\simeq D^b(\\mathcal C_n)$ and decategorifies to $s|_{V_{-n}}=\\sum_k(-1)^ke^{(n+k)}f^{(k)}$; composing these complexes along a reduced word for $w_0^J$ gives bijections $\\theta_J$ on $\\operatorname{Irr}(\\mathcal C)$ satisfying $\\theta_J^2=1$, $\\theta_J\\theta_K=\\theta_K\\theta_J$, and $\\theta_J\\theta_K=\\theta_{J^*(K)}\\theta_J$, hence $c_J\\mapsto\\theta_J$ realizes the cactus group and agrees with Schützenberger involutions on crystals.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/37/25/slides.pdf","title":"Michael Rosbotham (joint with Martin Mathieu)","note":"Michael Rosbotham (joint with Martin Mathieu), relative homological algebra classifies unital operator algebras of completely bounded global dimension zero as finite direct sums of full matrix algebras. Key computation: the forgetful functor $F:\\operatorname{OMod}_A^\\infty\\to\\operatorname{Op}^\\infty$ defines the exact structure $\\mathcal E_{\\mathrm{rel}}=\\{(\\mu,\\pi)\\in\\mathcal E_{\\max}:(F\\mu,F\\pi)\\in\\mathcal E_{\\min}\\}$; $E$ is relatively projective exactly when there are completely bounded $A$-module maps $s:E\\to E\\otimes_hA$ and $r:E\\otimes_hA\\to E$ with $rs=\\operatorname{id}_E$, so all operator $A$-modules are relatively projective iff $A$ is classically semisimple, and Artin--Wedderburn plus Gelfand--Mazur yields $d_{gcb}(A)=0\\Longleftrightarrow A\\cong\\bigoplus_iM_{n_i}(\\mathbb C)$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/63/18/slides.pdf","title":"Emily Riehl","note":"Emily Riehl, univalent foundations encode higher-categorical composition by contractibility and support a machine computation of $\\pi_4(S^3)$. Key computation: univalence makes $\\operatorname{id\\text{-}to\\text{-}equiv}:(A=_{\\mathcal U}B)\\to(A\\simeq B)$ an equivalence, while the composite space $\\operatorname{Comp}(f,g)$ of two paths is a pullback of $\\operatorname{Map}(\\Delta,X)\\to\\operatorname{Map}(\\Lambda,X)$ and is contractible because $D^n\\times\\Delta$ deformation-retracts onto $S^{n-1}\\times\\Delta\\cup_{S^{n-1}\\times\\Lambda}D^n\\times\\Lambda$; this contractible-choice principle supplies composition in synthetic $\\infty$-categories, and the constructive Hopf-fibration/Freudenthal/Blakers--Massey calculation normalizes in Cubical Agda to the Brunerie number $n=-2$, hence $\\pi_4(S^3)\\cong\\mathbb Z/2\\mathbb Z$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/83/slides.pdf","title":"Pádraig Daly","note":"Pádraig Daly, operator-system methods classify quantum superchannels, prove every channel-space supermap extends to a superchannel, and characterize extreme constrained completely positive extensions. Key computation: the Choi map identifies $S_{\\mathrm{CPTP}}(d,r)$ completely order isomorphically with $S(d,r)=\\{(P_{ij}):\\operatorname{Tr}P_{ii}=\\operatorname{Tr}P_{jj},\\ \\operatorname{Tr}P_{ij}=0\\ (i\\ne j)\\}$; a CPTP-preserving $\\Gamma$ is a quantum superchannel exactly when the induced $\\widetilde\\Gamma:S(d_1,r_1)\\to S(d_2,r_2)$ is completely positive, so Arveson's extension theorem and Choi's theorem produce $S(\\varphi)=\\psi_{\\mathrm{post}}\\circ(\\operatorname{id}_e\\otimes\\varphi)\\circ\\psi_{\\mathrm{pre}}$, with minimal $e=\\operatorname{rank}(\\operatorname{Tr}_{r_1}\\operatorname{Tr}_{r_2}C_{\\widetilde S})$; two extensions induce the same action precisely subject to $\\operatorname{Tr}_{d_1}(C_{\\widetilde S_1}-C_{\\widetilde S_2})=0$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/49/30/slides.pdf","title":"Reyer Sjamaar (joint work with Florian Dorsch","note":"Reyer Sjamaar (joint work with Florian Dorsch, Miguel Cueca, and Chenchang Zhu), derived higher Lie groupoids encode singular symplectic reduction as a shifted symplectic groupoid Morita equivalent to a derived Lagrangian intersection. Key computation: a derived manifold $\\mathcal M=(M,E_\\bullet,X_\\bullet)$ has tangent complex $T_mM\\to E_{1,m}\\to\\cdots$, and weak equivalences are bijective on classical loci and quasi-isomorphisms on these complexes; for a Hamiltonian $G$-manifold $(M,\\omega,\\mu)$, the derived action groupoid $G\\times(\\mathfrak g^*\\times M)\\rightrightarrows(\\mathfrak g^*\\times M)$ has tangent total complex $0\\to\\mathfrak g\\to T_mM\\to\\mathfrak g^*\\to0$, while $(\\omega,\\mu)$ is closed in the de Rham triple complex because $d\\omega=0$ and $\\delta\\omega=d\\mu$, and its induced pairing is a quasi-isomorphism $T\\simeq T^\\vee$, giving the $0$-shifted symplectic derived quotient $M//G$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/38/slides.pdf","title":"Adam Humeniuk","note":"Adam Humeniuk, the $C^*$-covers of a nonselfadjoint operator algebra form a complete lattice, and explicit constructions separate five natural notions of equality of cover data. Key computation: ordering covers by $(C,\\iota)\\geq(D,\\eta)$ when a surjective $*$-homomorphism $C\\twoheadrightarrow D$ intertwines $\\iota$ and $\\eta$ makes $C^*\\!\\operatorname{-Lat}(A)$ a complete lattice with extrema $C^*_{\\max}(A)$ and $C^*_{\\mathrm{env}}(A)$; the formulas $C^*\\!\\operatorname{-Lat}(A\\oplus B)\\cong C^*\\!\\operatorname{-Lat}(A)\\times C^*\\!\\operatorname{-Lat}(B)$ and, for nuclear simple $B$, $C^*\\!\\operatorname{-Lat}(A\\otimes B)\\cong C^*\\!\\operatorname{-Lat}(A)\\otimes B$ yield examples such as $T_2$ and $T_2\\otimes M_2\\cong M_2(T_2)$ that are lattice-isomorphic but not lattice-intertwined, proving that isomorphism, intertwining, lattice $*$-isomorphism, lattice isomorphism, and cover equivalence are genuinely distinct.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/25/18/slides.pdf","title":"Michael Brannan (joint with Kari Eifler","note":"Michael Brannan (joint with Kari Eifler, Christian Voigt, and Moritz Weber), quantum graphs admit universal quantum Cuntz--Krieger algebras that recover the classical construction for commutative vertex algebras and exhibit new nonnuclear examples. Key computation: for $\\mathcal G=(B,\\psi,A)$ with $B=\\bigoplus_{k=1}^mM_{n(k)}(\\mathbb C)$, writing $S^{(k)}=(\\dim B/n(k))[S(e_{ij}^{(k)})]$ turns the defining relation $\\mu(1\\otimes\\mu)(S\\otimes S^*\\otimes S)(1\\otimes m^*)m^*=S$ into $S^{(k)}S^{(k)*}S^{(k)}=S^{(k)}$, while $\\mu(S^*\\otimes S)m^*=\\mu(S\\otimes S^*)m^*A$ becomes $S^{(k)*}S^{(k)}=(S^{(1)}S^{(1)*},\\ldots,S^{(m)}S^{(m)*})\\widetilde A$; these relations define $\\mathcal O_{\\mathcal G}$, give $\\mathcal O_{\\mathcal G}$ equal to the usual Cuntz--Krieger algebra when $B$ is abelian, and for the complete quantum graph yield the explicit quotient $\\mathcal O_{K(M_n)}\\twoheadrightarrow\\mathcal O_{n^2}$ by $S_{ij}\\mapsto n^{-1/2}\\widehat S_{ij}$.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/DAG2022/DAG3+4.pdf","title":"Dominic Joyce","note":"Dominic Joyce, global quotient stacks form a $(2,1)$-category in which classifying stacks retain automorphisms of principal bundles and $2$-fibre products differ essentially from fibre products in the homotopy category. Key computation: morphisms $U\\to[*/\\Gamma]$ classify principal $\\Gamma$-bundles $P\\to U$, and the fibre product of $[U/\\Gamma]\\to[W/K]\\leftarrow[V/\\Delta]$ is $[\\{(u,v,k):f(u)=kg(v)\\}/(\\Gamma\\times\\Delta)]$ with $(\\gamma,\\delta)(u,v,k)=(\\gamma u,\\delta v,\\rho(\\gamma)k\\sigma(\\delta)^{-1})$; in particular $*\\times_{[*/\\Gamma]}*\\simeq\\Gamma$, so pulling back the tautological $*\\to[*/\\Gamma]$ along the classifying map recovers $P\\to U$.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/DAG2022/DAG5+6.pdf","title":"Dominic Joyce","note":"Dominic Joyce, coherent sheaves on $\\mathbb{CP}^1$ are classified by line bundles and finite-length skyscraper sheaves, and torsion-free sheaves compactify moduli of vector bundles by admitting singular limits. Key computation: the exact sequence $0\\to\\mathcal O_{\\mathbb{CP}^1}\\xrightarrow{s^{\\otimes k}}\\mathcal O_{\\mathbb{CP}^1}(k)\\to\\mathcal O_{[x,y]}^{(k)}\\to0$ constructs the length-$k$ torsion summands, and every $E\\in\\operatorname{coh}(\\mathbb{CP}^1)$ decomposes uniquely as a finite direct sum of $\\mathcal O_{\\mathbb{CP}^1}(n)$ and $\\mathcal O_{[x,y]}^{(k)}$; on $\\mathbb{CP}^2$, the cokernel of $(y,z,\\delta\\operatorname{id}):\\mathcal O\\to\\mathcal O(1)^{\\oplus2}\\oplus\\mathcal O$ is $\\mathcal O(1)^{\\oplus2}$ for $\\delta\\ne0$ but specializes at $\\delta=0$ to $(I_{[1,0,0]}\\otimes\\mathcal O(2))\\oplus\\mathcal O$, an explicit non-locally-free torsion-free limit.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/DAG2022/DAG9+10.pdf","title":"Dominic Joyce","note":"Dominic Joyce, Dwyer--Kan hammock localization upgrades inversion of weak equivalences from an ordinary homotopy category to a simplicial model for the associated $\\infty$-category, while horn filling distinguishes categories, groupoids, and quasicategories. Key computation: for a model category $\\mathcal M$, the mapping simplicial set $\\operatorname{Hom}_{\\mathrm{DK}}(X,Y)$ is built from rows of zigzags $X\\leftarrow^{\\sim}K_1\\leftarrow^{\\sim}L_1\\to K_2\\leftarrow^{\\sim}\\cdots\\to Y$, and $\\pi_0\\operatorname{Hom}_{\\mathrm{DK}}(X,Y)=\\operatorname{Hom}_{\\mathcal M[W^{-1}]}(X,Y)$; moreover a simplicial set is $N(\\mathcal C)$ exactly when every inner horn has a unique filler, and $N(\\mathcal C)$ is Kan exactly when $\\mathcal C$ is a groupoid, identifying Kan complexes as models for $\\infty$-groupoids and weak Kan complexes as quasicategories.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/DAG2022/DAG13+14.pdf","title":"Dominic Joyce","note":"Dominic Joyce, PTVV shifted symplectic structures turn Calabi--Yau moduli into explicit local critical-locus geometry and lower the shift under derived Lagrangian intersection. Key computation: for the derived moduli stack $\\mathcal M$ of coherent complexes on a Calabi--Yau $m$-fold, $h^i(T_{\\mathcal M}|_E)\\cong\\operatorname{Ext}^{i+1}(E,E)$ and Serre duality $\\operatorname{Ext}^i(E,E)\\cong\\operatorname{Ext}^{m-i}(E,E)^*$ induce the nondegenerate quasi-isomorphism $T_{\\mathcal M}\\xrightarrow{\\sim}L_{\\mathcal M}[2-m]$, hence a $(2-m)$-shifted symplectic form; if $L,M\\to(X,\\omega_k)$ are Lagrangian then $L\\times_XM$ is $(k-1)$-shifted symplectic, and for $k=-1$ the shifted Darboux theorem gives $(X,\\omega)\\simeq\\operatorname{Crit}(H:U\\to\\mathbb A^1)$ Zariski locally, so Calabi--Yau $3$-fold sheaf moduli are locally classical critical loci.","date":""},{"tags":["bu.edu"],"category":"bu.edu","url":"https://math.bu.edu/people/jsweinst/Tate_conference_slides.pdf","title":"Jared Weinstein","note":"Jared Weinstein, Faltings's two-towers theorem identifies the Lubin--Tate and Drinfeld towers as quotient $v$-stacks and converts Morava-stabilizer cohomology into $p$-adic Lie-group cohomology. Key computation: the isomorphism $[\\mathrm{LT}_{n,\\eta}^{\\diamond}/\\mathbb G_n]\\cong[\\mathcal H_{n-1}^{\\diamond}/\\mathrm{GL}_n(\\mathbb Z_p)]$ arises because a height-$n$, dimension-$1$ $p$-divisible group $G/\\mathcal O_C$ has Hodge--Tate sequence $0\\to\\operatorname{Lie}G\\otimes C(1)\\to T_pG\\otimes C\\to(\\operatorname{Lie}G^*)^*\\otimes C\\to0$, determining a line in $T_pG\\otimes C$, with the formal-group locus exactly Drinfeld's $\\mathcal H_{n-1}$; taking $\\mathcal O^+$-cohomology yields $H^*(\\mathbb G_n,W(\\mathbb F_p))\\to H^*(\\mathbb G_n,W(\\mathbb F_p)[[u_1,\\ldots,u_{n-1}]])$ as an isomorphism after inverting $p$ and $H^*(\\mathbb G_n,E_n^0)[1/p]\\cong\\mathbb Q_p[x_1,x_3,\\ldots,x_{2n-1}]$ with $|x_i|=i$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/65/34/slides.pdf","title":"Dihua Jiang","note":"Dihua Jiang, consecutive local descents of enhanced Langlands parameters classify the arithmetic wavefront set of generic representations of classical groups by rational nilpotent orbits. Key computation: local Gan--Gross--Prasad gives $\\dim_{\\mathbb C}\\operatorname{Hom}_{M_{\\ell,X}}(J_X(V_\\pi)\\otimes\\widehat\\sigma^\\vee,1)=1$ exactly when the component-group characters satisfy $(\\chi,\\chi')=(\\chi^z_{\\phi,\\varphi},\\chi^z_{\\varphi,\\phi})$; defining $D_\\ell(\\phi,\\chi)=\\bigcup_{z\\in F^\\times/F^{\\times2}}D_\\ell^z(\\phi,\\chi)$ and $\\ell_0=\\max\\{\\ell:D_\\ell(\\phi,\\chi)\\ne\\varnothing\\}$, first descent is discrete and $\\ell_0(\\pi)=\\ell_0(\\phi,\\chi)$, so iteration produces signed Young-tableau data $(\\ell_j,q(\\ell_j))$ and a canonical orbit set $\\mathrm{WF}_{\\mathrm{ari}}(\\pi)$; over $\\mathbb R$, if $S_\\phi\\ne1$ then $\\mathrm{WF}_{\\mathrm{ari}}(\\pi)_{\\max}=\\{\\mathcal O_a(\\phi,\\chi)\\}$, a unique rational nilpotent orbit determining a stable orbit.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/65/19/slides.pdf","title":"Wee Teck Gan","note":"Wee Teck Gan, the endoscopic classification of the metaplectic group $\\operatorname{Mp}_{2n}$ decomposes its discrete automorphic spectrum into packets indexed by elliptic Arthur parameters, with multiplicities controlled by component-group characters and central epsilon factors. Key computation: for $\\Psi=\\boxplus_i\\Pi_i\\boxtimes S_{d_i}$ the local packet is $\\widetilde\\Pi_{\\Psi_v,\\psi_v}=\\bigoplus_{\\eta_v\\in\\operatorname{Irr}(S_{\\Psi_v})}\\eta_v\\otimes\\widetilde\\pi_{\\eta_v}$ and $\\widetilde A_{n,\\mathrm{disc}}=\\bigoplus_\\Psi\\widetilde A_{\\Psi,\\psi}$ with $\\widetilde A_{\\Psi,\\psi}=\\langle\\widetilde\\epsilon_\\Psi,\\Delta^*(\\widetilde\\Pi_{\\Psi,\\psi})\\rangle_{S_\\Psi}$, where $\\widetilde\\epsilon_\\Psi=\\epsilon_\\Psi\\widetilde\\eta_\\Psi$ and $\\widetilde\\eta_\\Psi(e_i)=\\epsilon(1/2,\\Pi_i)$ for symplectic $\\Pi_i$ and $1$ for orthogonal $\\Pi_i$; locally, endoscopic transfer satisfies $t_{a,b}^*(\\Theta_\\Psi)=\\epsilon(1/2,\\Psi_b)\\sum_\\eta\\eta(s_{a,b})\\Theta_{\\widetilde\\pi_\\eta}$ for $s_{a,b}=(1_{2a},-1_{2b})$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/65/31/slides.pdf","title":"Yiannis Sakellaridis (joint with Chen Wan)","note":"Yiannis Sakellaridis (joint with Chen Wan), comparison of the Jacquet--Zagier and Kuznetsov trace formulas separates the residual spectrum of $\\mathrm{GL}_n$ into boundary terms indexed by generic length. Key computation: after partially compactifying Whittaker test functions there is an isomorphism $U:\\mathcal S(G/G)\\xrightarrow{\\sim}\\mathcal S^+((N,\\psi)\\backslash G/(N,\\psi))$ pulling stable characters back to relative characters and satisfying $\\mathrm{STF}(f)=\\mathrm{KTF}(Uf)+\\sum_{j=1}^{n-1}B_j(f)$; the Kuznetsov main term has spectral expansion over generic automorphic representations, whereas $B_j$ has expansion over representations of generic length $n-j$, and meromorphic comparison in a parameter $s$ pairs the divergence of the naive trace formula with the pole of $L(\\pi,\\operatorname{Ad},s)$, so taking $\\operatorname{Res}_{s=1}$ yields the noninvariant trace-formula identity with all residual boundary contributions separated.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/65/37/slides.pdf","title":"Bill Casselman","note":"Bill Casselman, the inverse Satake transform gives an explicit basic Schwartz function for every irreducible finite-dimensional representation of $\\widehat{\\mathrm{GL}}_2$, reducing the construction to symmetric-power multiplicities and vector partition functions. Key computation: for $F_{m,n}=\\mathbf1_{K\\varpi^{(m,n)}K}$, $\\mathcal S^{-1}(\\det^nq^{(m-n)/2}\\chi_{m-n})=\\Phi_{m,n}=\\sum_{i:m-i\\ge n+i}F_{m-i,n+i}$, while $\\det(I-At)^{-1}=\\sum_{m\\ge0}\\operatorname{tr}S^m(A)t^m$ and $S^m(\\sigma_k)=\\sum_{i\\le km/2}\\delta_{km}(i)\\det^i\\sigma_{km-2i}$ imply that the $L$-function's basic function is $\\sum_{i\\le km/2}q^i\\delta_{km}(i)\\Phi_{km-i,i}$; writing the weight multiplicity piecewise as $\\omega_{km}(n)=\\sum_{j=0}^i(-1)^jD_{\\alpha_j}(n-m_j)$ on $m_i\\le n\\le m_{i+1}$ proves it is quasi-polynomial on each Sturmfels cone and yields the displayed Sylvester asymptotics for $\\omega_{km}$ and $\\delta_{km}$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/65/26/slides.pdf","title":"Malors Espinosa (joint with Melissa Emory","note":"Malors Espinosa (joint with Melissa Emory, Debanjana Kundu, and Tian An Wong), interpolation and Poisson summation isolate the trivial and special-representation traces inside the regular elliptic trace formula for $\\mathrm{GL}_2$ over a totally real number field. Key computation: contributing elliptic classes are exactly $(\\tau,u)\\in\\mathcal O_K\\times\\mathcal O_K^\\times$ with $\\tau^2-4u\\epsilon$ nonsquare, and $(\\tau^2-4u\\epsilon)=\\mathfrak S_\\gamma^2\\Delta_\\gamma$ defines $O(z,\\gamma)=N(\\mathfrak S_\\gamma)^z\\sum_{\\mathfrak d\\mid\\mathfrak S_\\gamma}N(\\mathfrak d)^{1-2z}\\prod_{\\mathfrak q\\mid\\mathfrak d'}(1-\\chi_\\gamma(\\mathfrak q)N(\\mathfrak q)^{-z})$; then $O(1,\\gamma)=\\prod_{\\mathfrak q}O(\\gamma,f_\\mathfrak q)$ and $\\Lambda(z,\\chi_\\gamma)O(z,\\gamma)=\\Lambda(1-z,\\chi_\\gamma)O(1-z,\\gamma)$, while Poisson summation gives $\\operatorname{Tr}(1(f))=p^{-k/2}(1-p^{-(k+1)})(1-p^{-1})^{-1}\\sum_\\pm\\int_{\\mathbb R^{2n-1}}\\theta_\\pm(x,y)\\,dx\\,dy$ and identifies the second residue as $-2$ times the special-representation trace.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/37/07/slides.pdf","title":"Andrew Dean (joint with Luis Santiago)","note":"Andrew Dean (joint with Luis Santiago), triples of real, complexified, and quaternionified Cuntz semigroups classify unital real AI algebras and their homomorphisms up to approximate unitary equivalence. Key computation: $\\operatorname{Inv}(A)$ is the diagram $(\\operatorname{Cu}(A),[1])\\to(\\operatorname{Cu}(A\\otimes_{\\mathbb R}\\mathbb C),[1])\\to(\\operatorname{Cu}(A\\otimes_{\\mathbb R}\\mathbb H),[1])$; every morphism $\\eta=(\\eta_r,\\eta_c,\\eta_h):\\operatorname{Inv}(A)\\to\\operatorname{Inv}(B)$ is realized by a unital $*$-homomorphism $\\varphi:A\\to B$ with $(\\operatorname{Cu}(\\varphi),\\operatorname{Cu}(\\varphi\\otimes_{\\mathbb R}\\operatorname{id}_{\\mathbb C}),\\operatorname{Cu}(\\varphi\\otimes_{\\mathbb R}\\operatorname{id}_{\\mathbb H}))=(\\eta_r,\\eta_c,\\eta_h)$, and equality $\\operatorname{Inv}(\\varphi)=\\operatorname{Inv}(\\psi)$ implies $\\varphi\\sim_{\\mathrm{a.u.}}\\psi$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/75/slides.pdf","title":"Joachim Zacharias (joint with Joan Bosa","note":"Joachim Zacharias (joint with Joan Bosa, Francesc Perera, and Jianchao Wu), almost elementary actions have $\\mathcal Z$-stable crossed products and unify almost finite dynamics with $\\mathcal Z$-stability of simple nuclear algebras. Key computation: a noncommutative tower is a c.p.c. order-zero map $\\lambda:M_n\\otimes C(S)\\to A$ satisfying $\\lambda(\\,\\cdot\\,\\otimes\\delta_g)=\\alpha_{gh^{-1}}\\lambda(\\,\\cdot\\,\\otimes\\delta_h)$; castles approximating finite sets with $1-\\lambda(h)\\precsim_G b$ and $\\|h-g\\cdot h\\|<\\varepsilon$ define almost elementariness, for which $\\alpha:G\\curvearrowright A\\Rightarrow A\\rtimes_\\alpha G$ is almost elementary and hence $\\mathcal Z$-stable, while for $A=C(X)$ and amenable $G$ the condition is equivalent to almost finiteness of $G\\curvearrowright X$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/31/slides.pdf","title":"Marcelo Laca (joint with Camila F","note":"Marcelo Laca (joint with Camila F. Sehnem), constructible right ideals and foundation-set relations give the full boundary quotient of a semigroup Toeplitz algebra and a criterion for its reduced quotient to be purely infinite simple. Key computation: for $P\\subseteq G$, neutral words $\\alpha$ produce projections $L_{\\dot\\alpha}=1_{K(\\alpha)}$, and adjoining $\\prod_{\\beta\\in F}(w_{\\dot\\alpha}-w_{\\dot\\beta})=0$ for every foundation cover $\\bigcup_{\\beta\\in F}K(\\beta)\\subseteq K(\\alpha)$ yields canonical isomorphisms $\\mathcal C\\rtimes_{\\mathcal C P}P\\cong C^*(w_p\\mid\\mathrm{(T1)-(T5)})\\cong C(\\partial\\Omega_P)\\rtimes_u G$; boundary topological freeness, equivalently condition $\\mathrm{(BTF)}$, then makes $C(\\partial\\Omega_P)\\rtimes_rG$ purely infinite simple, recovering this for $P=R\\rtimes R^\\times$ by explicitly choosing $s=(0,ac)$ or $s=(0,ac\\bar x r)$ so that $psP\\cap qsP=\\varnothing$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/39/66/slides.pdf","title":"Gelu Popescu","note":"Gelu Popescu, noncommutative Berezin kernels give a unique Wold decomposition and classify pure representations of the $C^*$-algebra of a noncommutative variety by multiplicity. Key computation: for $V_i=\\pi(B_i)$ and $\\Phi_{f,V}(Y)=\\sum_{|\\alpha|\\ge1}a_\\alpha V_\\alpha YV_\\alpha^*$, the projections $P_{\\mathcal K_1}=\\operatorname*{SOT-lim}_{s\\to\\infty}\\Phi_{f,V}^s(I)$ and $P_{\\mathcal K_0}=I-P_{\\mathcal K_1}$ split $\\mathcal K=\\mathcal K_0\\oplus\\mathcal K_1$ into pure and Cuntz tuples; on $\\mathcal K_0$, the constrained Berezin kernel is unitary and $V_i=K_{f,V,Q}^*(B_i\\otimes I_{\\mathcal D})K_{f,V,Q}$ with $\\mathcal D=\\operatorname{ran}(I-\\Phi_{f,V})^m(I)^{1/2}$, so pure representations are unitarily equivalent exactly when $\\dim\\mathcal D$ agrees.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/25/20/slides.pdf","title":"Leonel Robert","note":"Leonel Robert, commutator subgroups of connected invertibles and unitaries in a unital $C^*$-algebra admit explicit exponential generators and strong simplicity properties. Key computation: the local Campbell--Baker--Hausdorff/Kashiwara--Vergne identities $e^xe^y=e^{x+y+[x,a]+[y,b]}$ and $e^{x+y}=(e^Re^xe^{-R})(e^Se^ye^{-S})$ show $e^{x+y}$ is commutator-equivalent to $e^xe^y$; consequently $D\\mathrm{GL}_0(A)=\\langle e^{[c,d]}:c,d\\in A\\rangle$ and $D\\mathrm U_0(A)=\\langle e^{i[x^*,x]}:x\\in A\\rangle$, and if $A$ has no one-dimensional representations then these groups are perfect, with $D\\mathrm{GL}_0(A)$ generated by $1+x$ for $x^2=0$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/61/slides.pdf","title":"Camila F","note":"Camila F. Sehnem (joint with Zahra Afsar, Marcelo Laca, and Jacqui Ramagge), the KMS$_\\beta$ simplex of a Toeplitz noncommutative torus is classified by probability measures on a torus determined by the degeneracy of its zero-energy block. Key computation: for $r=(r_1,\\ldots,r_k,0_d)$, every KMS state satisfies $\\varphi(L_pL_xL_y^*L_q^*)=\\delta_{p,q}e^{-\\beta\\langle p,r\\rangle}\\varphi(L_xL_y^*)$ and is obtained from a trace $\\omega$ on $Q\\mathcal T_r(\\mathbb N^n,\\sigma_\\Theta)Q$ by $T_\\beta(\\omega)(X)=Z(\\beta)^{-1}\\sum_{l\\in\\mathbb N^k\\times0_d}e^{-\\beta\\langle l,r\\rangle}\\omega(QL_l^*XL_lQ)$, where $Q=\\prod_{j=1}^k(1-L_{e_j}L_{e_j}^*)$ and $Z(\\beta)=\\sum_pe^{-\\beta\\langle p,r\\rangle}$; since traces on $A_{\\Theta_d}$ are states on $Z(A_{\\Theta_d})\\cong C(\\mathbb T^m)$, this gives $\\operatorname{KMS}_\\beta\\cong\\mathcal M_1(\\mathbb T^m)$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca",
