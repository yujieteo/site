tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/51/38/slides.pdf","title":"Tiago J","note":"Tiago J. Fonseca (joint with Nils Matthes), the universal vector extension gives an algebraic classification of all relatively unipotent integrable connections on a punctured elliptic curve and recovers Brown--Levin elliptic multiple polylogarithms. Key computation: for $0\\to V(R^1f_*\\mathcal O_E)\\to E^\\natural\\xrightarrow{\\pi}E\\to0$ and $D=\\pi^{-1}(O)$, Laumon's vanishing $g_*\\mathcal O_{E^\\natural}\\simeq\\mathcal O_S$, $R^ng_*\\mathcal O_{E^\\natural}=0$ combines with $g_*\\Omega^1_{E^\\natural/S}(\\log D)=g_*\\Omega^1_{E^\\natural/S}\\oplus\\bigoplus_{n\\ge1}K(n)$, where $d\\omega^{(n)}=\\nu\\wedge\\omega^{(n-1)}$ and $\\operatorname{Res}_D\\omega^{(n)}=t^{n-1}/(n-1)!$. Every such connection is therefore canonically $d+A\\otimes\\nu+B_0\\otimes\\omega^{(0)}+\\sum_{n\\ge1}\\operatorname{ad}_A^n(B_0)\\otimes\\omega^{(n)}$, and $\\pi_1^{\\mathrm{dR}}(E\\setminus\\{O\\},x)\\simeq\\operatorname{Spec}(\\bigoplus_{n\\ge0}H^1_{\\mathrm{dR}}(E/k)^{\\otimes n})$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/33/67/slides.pdf","title":"Arul Shankar (joint with Manjul Bhargava and Jonathan Hanke)","note":"Arul Shankar (joint with Manjul Bhargava and Jonathan Hanke), local ramification densities determine the average $2$-torsion in class groups of fixed-index monogenic cubic fields. Key computation: pairs of ternary quadratic forms $V=\\mathbb Z^2\\otimes\\operatorname{Sym}^2(\\mathbb Z^3)$ have resolvent $\\operatorname{Res}(A,B)=4\\det(Ax+B)$, and Bhargava's bijection identifies $\\operatorname{SL}_3(\\mathbb Z)$-orbits in $\\operatorname{Res}^{-1}(f)$ with index-$2$ subgroups of $\\operatorname{Cl}(K)$ when $f$ defines $\\mathcal O_K$. Fixing leading coefficient $n$ imposes $\\det A=n/4$; counting the resulting $\\operatorname{SO}_A(\\mathbb Z)$-orbits and evaluating $\\operatorname{Mass}_p(f)=\\sum_{(A,B)}|\\operatorname{Stab}(A,B)|^{-1}=1$ gives, for $n=m^2k$ and $\\rho(\\mathcal F)=\\prod_{p\\mid k}\\rho_p(\\mathcal F)$, the exact averages $\\operatorname{Avg}_{\\mathcal F,\\mathrm{real}}|\\operatorname{Cl}_2(K)|=5/4+\\rho(\\mathcal F)/4$ and $\\operatorname{Avg}_{\\mathcal F,\\mathrm{complex}}|\\operatorname{Cl}_2(K)|=3/2+\\rho(\\mathcal F)/2$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/26/06/slides.pdf","title":"Taras Panov","note":"Taras Panov, polyhedral products classify when graph-product classifying spaces are aspherical and when commutator subgroups of right-angled Coxeter groups are free or one-relator. Key computation: the fibration $(EG,G)_K\\to(BG)_K\\to\\prod_{i=1}^mBG_i$ gives $1\\to\\pi_1((EG,G)_K)\\to G_K\\to\\prod_iG_i\\to1$; a missing face $J$ of size $k\\ge3$ has fat-wedge fibre $\\Sigma^{k-1}G_{j_1}\\wedge\\cdots\\wedge G_{j_k}$ and hence nonzero $\\pi_{k-1}$, proving asphericity exactly when $K$ is flag. For $G_i=\\mathbb Z/2$, $\\pi_1((D^1,S^0)_K)=RC_K'$; it is free exactly when $K^1$ is chordal, and it is one-relator exactly when $K=C_p$ or $C_p*\\Delta^q$, equivalently $H_2((D^1,S^0)_K)=\\mathbb Z$; for $K=C_m$ the space is the orientable surface of genus $(m-4)2^{m-3}+1$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/26/02/slides.pdf","title":"Nima Hoda","note":"Nima Hoda, bisimplices give a canonical higher-dimensional completion of complete bipartite subgraphs, and filling every $K_{m+1,n+1}$ in a locally finite quadric complex produces a contractible complex with unchanged $2$-skeleton. Key computation: the $(m,n)$-bisimplex $\\nabla\\!\\Delta^{m,n}$ is built inductively by placing one $\\nabla\\!\\Delta^{m',n'}$ on each proper $K_{m'+1,n'+1}$ and then attaching an $(m+n)$-cell to $\\partial\\nabla\\!\\Delta^{m,n}$. An explicit discrete Morse matching on this boundary has exactly two critical cells, so $\\partial\\nabla\\!\\Delta^{m,n}\\simeq S^{m+n-1}$; the link of every cell has the same two-critical-cell matching, hence induction makes every link a sphere, and the generalized Poincar\\'e theorem upgrades the homotopy equivalence to $\\partial\\nabla\\!\\Delta^{m,n}\\cong S^{m+n-1}$, proving $\\nabla\\!\\Delta^{m,n}\\cong B^{m+n}$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/24/62/slides.pdf","title":"Victor Buchstaber","note":"Victor Buchstaber, partially framed manifolds give explicit generators and characteristic numbers for complex bordism and compute the complex cobordism of $\\Omega SU(2)\\simeq\\Omega S^3$. Key computation: the hypersurface $M_{2n}\\subset(\\mathbb{CP}^{1}_{*})^{n+1}$ Poincar\\'e dual to $\\eta_1\\otimes\\cdots\\otimes\\eta_{n+1}$ generates $(\\mathrm{fr}(1),U)_{2n}\\cong\\mathbb Z$ and has $\\operatorname{Td}(M_{2n})=(-1)^n$, $c_n(M_{2n})=(-1)^n(n+1)!$, and $\\tau(M_{2n})=4^{n+1}(4^{n+1}-1)B_{2n+2}/(2n+2)$. The James equivalence $J(S^2)\\simeq\\Omega S^3$ then yields $U_*(\\Omega S^3)\\cong\\Omega_U[w]$ and $U^*(\\Omega S^3)\\cong\\Omega_U[[b_2,b_4,\\ldots]]/(b_2^n-n!b_{2n})_{n\\ge2}$, with $b_{2i}b_{2j}=\\binom{i+j}{i}b_{2(i+j)}$ and $\\varphi_U^*u=b_2+\\sum_{n\\ge1}[M_{2n}]b_{2n+2}$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/26/87/slides.pdf","title":"Luis Scoccola","note":"Luis Scoccola, the Gromov--Hausdorff distance is universally characterized as a quotient interleaving distance, making homotopy and density filtrations stable functors of metric data. Key computation: for pseudometric spaces, let $d_I(P,Q)$ be the infimum of $\\delta$ admitting inverse set maps that increase distances by at most $\\delta$, and quotient by zigzags of surjective distance-preserving maps; the slides prove $(d_I)/{\\simeq}=2d_{\\mathrm{GH}}$. Consequently the Vietoris--Rips functor is $2$-Lipschitz into homotopy interleaving distance, while the bifiltration $\\operatorname{KDF}(X)(s,k)=\\{x\\in X:\\int_XK(d_X(x,x')/s)\\,d\\mu_X(x')\\ge k\\}$ is uniformly continuous from Gromov--Hausdorff--Prokhorov distance to Gromov--Hausdorff interleaving distance; for full-support $X$ and iid samples $X_n$, $\\operatorname{KDF}(X_n)\\to\\operatorname{KDF}(X)$ in probability.","date":""},{"tags":["databricks.com"],"category":"databricks.com","url":"https://www.databricks.com/sites/default/files/2023-08/a-cloud-compatible-bioinformatics-pipeline-for-ultrarapid-pathogen-identification-from-next-generation-sequencing-of-clinical-samples.pdf","title":"A Cloud-Compatible Bioinformatics Pipeline for Ultrarapid Pathogen Identification From Next-Generation Sequencing of Clinical Samples","note":"Databricks Research publication in Applications.","date":""},{"tags":["databricks.com"],"category":"databricks.com","url":"https://www.databricks.com/sites/default/files/2023-08/above-the-clouds-a-view-of-cloud-computing.pdf","title":"Above the Clouds: A View of Cloud Computing","note":"Databricks Research publication in Distributed Systems.","date":""},{"tags":["databricks.com"],"category":"databricks.com","url":"https://www.databricks.com/sites/default/files/2023-08/accelerating-the-machine-learning-lifecycle-with-mlflow.pdf","title":"Accelerating the Machine Learning Lifecycle With MLflow","note":"Databricks Research publication in AI and ML.","date":""},{"tags":["databricks.com"],"category":"databricks.com","url":"https://www.databricks.com/sites/default/files/2023-08/adam-genomics-formats-and-processing-patterns-for-cloud-scale-computing.pdf","title":"ADAM: Genomics Formats and Processing Patterns for Cloud Scale Computing","note":"Databricks Research publication in Applications.","date":""},{"tags":["databricks.com"],"category":"databricks.com","url":"https://www.databricks.com/research/apache-spark-a-unified-engine-for-big-data-processing","title":"Apache
