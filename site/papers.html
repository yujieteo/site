"url":"https://www.fields.utoronto.ca/talk-media/1/73/49/slides.pdf","title":"Sarah Reznikoff (joint with Jonathan Brown","note":"Sarah Reznikoff (joint with Jonathan Brown, Adam Fuller, and David Pitts), regular ideals of a $C^*$-algebra are classified by invariant regular ideals of a regular subalgebra, and regular graph-algebra quotients preserve Condition (L). Key computation: for a regular inclusion $B\\subseteq A$ with faithful invariant expectation $E:A\\to B$ and regular ideal intersection property, $J\\mapsto J\\cap B$ and $K\\mapsto J_K=\\{a\\in A:E(a^*a)\\in K^{\\perp\\perp}\\}$ are inverse Boolean-algebra isomorphisms between regular ideals of $A$ and invariant regular ideals of $B$; for graph algebras, $J=J^{\\perp\\perp}$ is equivalent to $p_w\\in J\\Longleftrightarrow(\\forall v\\in T(w))(\\exists u\\in T(v))\\,p_u\\in H(J)$, which forces every cycle of $E/J$ to retain an entrance and hence preserves Condition (L).","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/36/slides.pdf","title":"Paul Skoufranis","note":"Paul Skoufranis, tracial inequalities completely characterize convex hulls of unitary orbits of self-adjoint elements in arbitrary unital $C^*$-algebras and extend to joint majorization of commuting tuples. Key computation: for self-adjoint $S,T\\in A$, one has $S\\in\\overline{\\operatorname{conv}}(\\mathcal U(T))$ exactly when $\\tau((S-\\alpha)_+)\\le\\tau((T-\\alpha)_+)$ and $\\tau((-S-\\alpha)_+)\\le\\tau((-T-\\alpha)_+)$ for every lower-semicontinuous trace $\\tau$ and $\\alpha\\in\\mathbb R$; in $M_n$, this is equivalent to $\\sum_{k=1}^ma_k\\le\\sum_{k=1}^mb_k$ for ordered eigenvalues (equality at $m=n$), to $a=Xb$ for a doubly stochastic $X$, and to a unital trace-preserving completely positive map $\\Psi$ with $\\Psi(T)=S$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/80/slides.pdf","title":"Dan Ursu (joint with Shirly Geffen)","note":"Dan Ursu (joint with Shirly Geffen), simplicity of reduced crossed products by FC-hypercentral groups is characterized by the absence of a central corner on which a finite-conjugacy element acts inner with centralizer-invariant implementer. Key computation: for a minimal action $\\alpha:G\\curvearrowright A$ with $G$ FC-hypercentral, $A\\rtimes_rG$ is not simple exactly when there exist $t\\in\\mathrm{FC}(G)\\setminus\\{e\\}$, a nonzero $t$-invariant $p\\in Z(I(A))$, and $u\\in\\mathcal U(I(A)p)$ such that $\\alpha_t|_{I(A)p}=\\operatorname{Ad}(u)$ and $\\alpha_s(p)=p,\\ \\alpha_s(u)=u$ for every $s\\in C_G(t)$; this refines proper outerness on the injective envelope and is equivalent, for separable $A$, to an intrinsic obstruction on an essential $t$-invariant ideal $J\\triangleleft A$ with an implementing unitary in $M(J)$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/39/77/slides.pdf","title":"Matthew Kennedy","note":"Matthew Kennedy, noncommutative Choquet theory classifies operator systems by compact matrix-convex state spaces and characterizes those arising from $C^*$-algebras as noncommutative Bauer simplices. Key computation: matrix convexity closes $K=\\coprod_nK_n$ under $\\sum_i\\alpha_i^*x_i\\alpha_i$ whenever $\\sum_i\\alpha_i^*\\alpha_i=I$, and evaluation gives the dual equivalence $S\\cong A(K)$; every $x\\in K_n$ has a maximal representing nc state $\\mu:C(K)\\to M_n$ with $a(x)=\\int_Ka\\,d\\lambda$ supported on $\\partial K$, while uniqueness of this maximal state is equivalent to $A(K)^{**}$ being a von Neumann algebra and to $A(K)\\otimes_cT=A(K)\\otimes_{\\max}T$ for every operator system $T$; adding closed $\\partial K$ characterizes precisely nc state spaces of unital $C^*$-algebras.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/42/07/slides.pdf","title":"Kenneth R","note":"Kenneth R. Davidson, free semigroup algebras admit a Lebesgue--von Neumann--Wold decomposition and are uniformly hyperreflexive. Key computation: on Fock space $\\mathcal F_n^2=\\ell^2(\\mathbb F_n^+)$ the left shifts satisfy $L_i^*L_j=\\delta_{ij}I$ and $\\sum_iL_iL_i^*=I-\\xi_\\varnothing\\xi_\\varnothing^*$, while $\\mathcal L_n'=\\mathcal R_n$ and every $A\\in\\mathcal L_n$ has Ces\\`aro-summed Fourier expansion $A\\sim\\sum_wa_wL_w$; the structure projection $P$ determined by $\\bigcap_{k\\ge1}\\mathcal S_0^k=\\mathcal WP$ splits an arbitrary free semigroup algebra into von Neumann and type-$L$ corners, and Kennedy's wandering-vector theorem for absolutely continuous representations yields $\\mathcal S\\simeq\\mathcal L^{(\\alpha)}\\oplus\\mathcal S_a\\oplus\\mathcal S_{vN}\\oplus\\mathcal S_d$, with every free semigroup algebra hyperreflexive with constant at most $6$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/36/99/slides.pdf","title":"Michael Brannan","note":"Michael Brannan, complete quantum graphs have no finite classical coloring but have quantum chromatic number exactly $n^2$, and their coloring algebras possess strongly solid noninjective factor representations. Key computation: the algebra $\\mathcal A(\\operatorname{Hom}(QK_n,K_{n^2}))$ is generated by $p_{ij}^{(a)}$ with $p_{ij}^{(a)}p_{kl}^{(a)}=\\delta_{jk}n^{-1}p_{il}^{(a)}$, $\\sum_jp_{ij}^{(a)}p_{jk}^{(b)}=\\delta_{ab}p_{ik}^{(a)}$, $\\sum_ip_{ii}^{(a)}=n^{-1}1$, and $\\sum_ap_{ij}^{(a)}=\\delta_{ij}1$; any unitary error basis $\\{u_a\\}_{a=1}^{n^2}\\subset U(M_n)$ gives the representation $p_{ij}^{(a)}\\mapsto n^{-1}u_a^*e_{ij}u_a$, while the quantum Hoffman bound supplies the reverse inequality, proving $\\chi_q(QK_n)=n^2$ whereas $\\chi_{\\mathrm{loc}}(QK_n)=\\infty$; for $n\\ge3$ the same universal algebra has a faithful trace whose GNS algebra is a strongly solid noninjective $\\mathrm{II}_1$ factor.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/39/29/slides.pdf","title":"Ra\\'ul E","note":"Ra\\'ul E. Curto (joint with In Sung Hwang and Woo Young Lee), Potapov's factorization theorem extends from matrices to rational two-sided inner operator-valued functions. Key computation: rationality is defined by the Hankel-kernel condition $\\theta H^2(\\mathbb T,E)\\subseteq\\ker H_{\\Phi^*}$ for a finite Blaschke product $\\theta$; if an inner $\\Delta$ divides $\\Theta=\\theta I_E$, then $\\Delta$ is a finite product of Blaschke--Potapov factors $b_\\alpha P_M+(I_E-P_M)$, and the Beurling--Lax--Halmos identity $\\ker H_{\\Phi^*}=\\Delta H^2$ yields the coprime factorization $\\Phi=\\Delta A^*$; consequently a two-sided inner $\\Phi\\in H^\\infty(\\mathbb T,B(E))$ is rational exactly when it is a finite Blaschke--Potapov product.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/45/66/slides.pdf","title":"Ryan O'Loughlin","note":"Ryan O'Loughlin, compact truncated Toeplitz operators on a model space have continuous inner-multiple symbols exactly under the same conditions that give bounded symbols for all bounded truncated Toeplitz operators. Key computation: for $K_I^2=H^2\\ominus IH^2$ and $A_g^I f=P_I(gf)$, the projective product space $X=\\{\\sum_kx_ky_k:\\sum_k\\|x_k\\|_2\\|y_k\\|_2<\\infty\\}$ satisfies $X^*=\\mathcal T(I)$ and ${}^*X=\\mathcal T_c(I)$; the maps $S:X\\to zH^1\\cap K_{I^2}^1$, $f\\mapsto If$, ${}^*S:C(\\mathbb T)/(F_{I^2}\\cap C(\\mathbb T))\\to\\mathcal T_c(I)$, $[f]\\mapsto A_{If}^I$, and $S^*:L^\\infty/Q\\to\\mathcal T(I)$ identify their images with compact operators having symbols in $I C(\\mathbb T)$ and bounded-symbol operators, so duality gives $\\mathcal T_c(I)=\\{A_{Ih}^I:h\\in C(\\mathbb T)\\}$ if and only if every bounded $A_g^I$ has a bounded symbol.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/80/15/slides.pdf","title":"Alfons Van Daele","note":"Alfons Van Daele, the polar decomposition of the antipode determines the modular structure of a locally compact quantum group and proves uniqueness of Haar weights. Key computation: regular representations satisfy $\\Delta(x)=W^*(1\\otimes x)W$ and $(\\Delta\\otimes\\iota)W=W_{13}W_{23}$, while the closed antipode has $S((\\iota\\otimes\\omega)W)=(\\iota\\otimes\\omega)W^*$ and polar decomposition $S=R\\tau_{-i/2}$; for two left Haar weights, $(K\\otimes T_r)W_1=W_2^*(K\\otimes T_r)$ implies $(1\\otimes u_t)W_1(1\\otimes u_t^*)=W_1$, hence $\\Delta(u_t)=1\\otimes u_t$ and $u_t$ is scalar, proving uniqueness up to scale; relative modular theory then produces the affiliated modular element $\\delta$ with $\\psi=\\varphi(\\delta^{1/2}\\,\\cdot\\,\\delta^{1/2})$, $\\Delta(\\delta)=\\delta\\otimes\\delta$, and $\\sigma_t'(x)=\\delta^{it}\\sigma_t(x)\\delta^{-it}$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/39/73/slides.pdf","title":"Jingbo Xia","note":"Jingbo Xia, the Drury--Arveson space is the universal dilation space for commuting row contractions and its multiplier norm gives the correct multivariable von Neumann inequality. Key computation: for a strict commuting row contraction $A=(A_1,\\ldots,A_n)$, the identity $\\sum_{\\alpha\\in\\mathbb Z_+^n}\\frac{|\\alpha|!}{\\alpha!}A^\\alpha(I-\\sum_iA_iA_i^*)A^{*\\alpha}=I$ makes $Zx=\\sum_\\alpha\\frac{|\\alpha|!}{\\alpha!}(I-\\sum_iA_iA_i^*)^{1/2}A^{*\\alpha}x\\,\\zeta^\\alpha$ an isometry into $H_n^2\\otimes H$ satisfying $Zp(A^*)=(p(M_\\zeta^*)\\otimes I)Z$; hence $\\|p(A)\\|\\leq\\|p\\|_{\\operatorname{Mult}(H_n^2)}$, while for $\\theta(\\zeta)=\\zeta_1\\cdots\\zeta_n$ one has $\\|\\theta^k\\|_\\infty=n^{-kn/2}$ but $\\|\\theta^k\\|_{H_n^2}=((k!)^n/(nk)!)^{1/2}\\asymp k^{(n-1)/4}n^{-kn/2}$, explicitly showing why the supremum norm cannot replace the multiplier norm for $n\\ge2$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/33/03/slides.pdf","title":"Ilijas Farah","note":"Ilijas Farah, set-theoretic saturation sharply classifies ultrapowers of separable $C^*$-algebras: CH makes all nonprincipal ultrapowers isomorphic, while failure of CH yields the maximal number of isomorphism types. Key computation: countably saturated elementarily equivalent structures $C,D$ of density $\\aleph_1$ are written as continuous chains $C=\\bigcup_{\\alpha<\\omega_1}C_\\alpha$ and $D=\\bigcup_{\\alpha<\\omega_1}D_\\alpha$; a transfinite back-and-forth constructs compatible elementary embeddings whose unions are inverse isomorphisms, so under CH, $A^{\\mathcal U}\\cong A^{\\mathcal V}$ commuting with the diagonal copy of every separable $A$ and $A'\\cap A^{\\mathcal U}\\cong A'\\cap A^{\\mathcal V}$; conversely, if CH fails, every separable infinite-dimensional $A$ has $2^{2^{\\aleph_0}}$ nonisomorphic ultrapowers and as many nonisomorphic relative commutants.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/44/64/slides.pdf","title":"Guoliang Yu","note":"Guoliang Yu, localization-algebra representatives refine higher indices to secondary rho invariants whose delocalized cyclic pairings recover Lott eta invariants. Key computation: partitions of unity on covers with mesh $<1/n$ localize $F=D(1+D^2)^{-1/2}$ to $F_n=\\sum_k\\sqrt{\\phi_k^{(n)}}F\\sqrt{\\phi_k^{(n)}}$, and interpolation gives $\\operatorname{propagation}(F_t)\\to0$, defining $\\operatorname{Index}_L(D)=[\\exp(2\\pi i(F_\\bullet+1)/2)]\\in K_1(C_L^*(\\widetilde X)^G)$ with $e_*\\operatorname{Index}_L(D)=\\operatorname{Index}(D)$; when $D$ is invertible, splicing a trivialization to this path gives $\\rho(D)\\in K_*(C_{L,0}^*(\\widetilde X)^G)$, and for a polynomial-growth conjugacy class $\\langle h\\rangle$, the explicit pairing $\\tau_h(u)=(2\\pi i)^{-1}\\int_0^\\infty\\operatorname{tr}_h(\\dot u(t)u(t)^{-1})dt$ satisfies $\\tau_h(\\rho(D))=\\tfrac12\\eta_{\\langle h\\rangle}(D)$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/44/79/slides.pdf","title":"Paolo Piazza (joint work with Hessel Posthuma","note":"Paolo Piazza (joint work with Hessel Posthuma, Yanli Song, and Xiang Tang), cyclic cocycles on Harish--Chandra Schwartz algebras give delocalized Atiyah--Patodi--Singer formulas for cocompact proper actions of real reductive groups. Key computation: the Connes--Moscovici heat projector $V(D)$ has entries in $\\mathcal A_G^\\infty(Y)$ and defines $\\operatorname{Ind}_\\infty(D)$; extending the semisimple orbital integral $\\tau_g(f)=\\int_{G/Z_G(g)}f(xgx^{-1})d(xZ_G(g))$ and applying Melrose's defect formula ${}^b\\!\\operatorname{Tr}[R,T]=(i/2\\pi)\\int_{\\mathbb R}\\operatorname{Tr}(\\partial_\\lambda I(R,\\lambda)I(T,\\lambda))d\\lambda$ produces a relative cyclic cocycle, whose pairing yields $\\langle\\operatorname{Ind}_\\infty(D),\\tau_g^Y\\rangle=\\int_{Y_0^g}c^g\\operatorname{AS}_g(Y_0)-\\tfrac12\\eta_g(D_{\\partial Y})$ with $\\eta_g(D)=(1/\\sqrt\\pi)\\int_0^\\infty\\tau_g(D e^{-tD^2})dt/\\sqrt t$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/44/85/slides.pdf","title":"Masoud Khalkhali","note":"Masoud Khalkhali, stable anti-Yetter--Drinfeld modules supply the coefficient objects that turn Hopf symmetries into cyclic modules and recover the Connes--Moscovici theory. Key computation: for a left $H$-module coalgebra $C$ and a right-left SAYD module $M$, the complex $C^n(C,M)=M\\otimes_HC^{\\otimes(n+1)}$ has cyclic operator $\\tau_n(m\\otimes c_0\\otimes\\cdots\\otimes c_n)=m_{(0)}\\otimes c_1\\otimes\\cdots\\otimes c_n\\otimes m_{(-1)}c_0$; the anti-Yetter--Drinfeld condition makes this operator descend through $\\otimes_H$, and stability gives $\\tau_n^{n+1}=\\operatorname{id}$, hence a cocyclic module; modular pairs in involution $(\\delta,\\sigma)$ are exactly one-dimensional SAYD modules ${}^\\sigma\\mathbb C_\\delta$, so taking $C=H$ recovers Connes--Moscovici Hopf cyclic cohomology and its characteristic map $\\chi_\\tau(h_1\\otimes\\cdots\\otimes h_n)(a_0,\\ldots,a_n)=\\tau(a_0h_1(a_1)\\cdots h_n(a_n))$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/45/37/slides.pdf","title":"Cong Xue","note":"Cong Xue, the compactly supported relative cohomology of shtuka stacks is ind-smooth and carries an unramified product Weil action. Key computation: geometric Satake defines $\\mathcal H^j_{N,I,W}=R^jp_!\\mathcal F_{N,I,W}$ on $(X\\setminus N)^I$; the partial Frobenius maps $F_{\\{i\\}}:\\operatorname{Frob}_{\\{i\\}}^*\\mathcal H^j_{N,I,W}\\xrightarrow{\\sim}\\mathcal H^j_{N,I,W}$ compose to total Frobenius, so Drinfeld's lemma gives a $\\operatorname{Weil}(\\eta)^I$-action on the generic fiber, while Eichler--Shimura relations, constancy on mixed loci $(\\eta)^{I_1}\\times(v)^{I_2}$, and creation--annihilation (Zorro) operators make every specialization map $(\\mathcal H^j_{N,I,W})_y\\to(\\mathcal H^j_{N,I,W})_x$ an isomorphism; hence $\\mathcal H^j_{N,I,W}$ is ind-smooth and the action factors through $\\operatorname{Weil}(X\\setminus N)^I$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/27/56/slides.pdf","title":"Clifton Cunningham (joint with Andrew Fiori and Qing Zhang)","note":"Clifton Cunningham (joint with Andrew Fiori and Qing Zhang), microlocal geometry classifies the ABV packets of all six irreducible unipotent representations of $G_2(F)$ with subregular infinitesimal parameter and produces stable character combinations. Key computation: the parameter space is $X_{\\mathrm{sub}}=(\\widehat G_2\\times V_{\\mathrm{sub}})/H_{\\mathrm{sub}}$ with $H_{\\mathrm{sub}}\\cong\\mathrm{GL}_2$ and $V_{\\mathrm{sub}}\\cong\\det^{-1}\\otimes\\operatorname{Sym}^3$, so $\\operatorname{Per}_{\\widehat G_2}(X_{\\mathrm{sub}})\\simeq\\operatorname{Per}_{\\mathrm{GL}_2}(\\det^{-1}\\otimes\\operatorname{Sym}^3)$; the four binary-cubic orbits $C_0<C_1<C_2<C_3$ have microlocal groups $S_3,S_2,S_2,S_3$, and normalized microlocal vanishing cycles yield $\\Pi^{\\mathrm{ABV}}_{\\phi_0}=\\{\\pi_0,\\pi_1,\\pi_3^\\varepsilon\\}$, $\\Pi^{\\mathrm{ABV}}_{\\phi_1}=\\{\\pi_1,\\pi_2,\\pi_3^\\varepsilon\\}$, $\\Pi^{\\mathrm{ABV}}_{\\phi_2}=\\{\\pi_2,\\pi_3^\\rho,\\pi_3^\\varepsilon\\}$, and $\\Pi^{\\mathrm{ABV}}_{\\phi_3}=\\{\\pi_3,\\pi_3^\\rho,\\pi_3^\\varepsilon\\}$, with stable distributions including $\\Theta_{\\phi_3}=\\Theta_{\\pi_3}+2\\Theta_{\\pi_3^\\rho}+\\Theta_{\\pi_3^\\varepsilon}$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/44/83/slides.pdf","title":"Joachim Cuntz (joint with Guillermo Corti\\~nas","note":"Joachim Cuntz (joint with Guillermo Corti\\~nas, Ralf Meyer, and Georg Tamme), the Feigin--Tsygan theorem identifies periodic cyclic homology of any finite-type commutative algebra in characteristic zero with the de Rham cohomology of a smooth formal presentation. Key computation: for a smooth surjection $P\\twoheadrightarrow A=P/J$ and the $J$-adic completion $P_J=\\varprojlim_nP/J^n$, flatness of $P_J$ over the Noetherian ring $P$ and two completed bar resolutions give a quasi-isomorphism $P_J\\otimes_P(C(P),b)\\to(C(P_J),b)$ and therefore $HH_*(P_J)\\cong P_J\\otimes_PHH_*(P)\\cong P_J\\otimes_P\\Omega_P^*$ by HKR; under this identification Connes' $B$ becomes $d$, while nilpotent invariance gives $HP_*(A)\\cong HP_*(P_J)$, hence $HP_*(A)\\cong HP_*(P_J)\\cong H^*_{\\mathrm{dR}}(P_J)=H^*_{\\mathrm{inf}}(A)$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/44/84/slides.pdf","title":"Victor Nistor","note":"Victor Nistor, localization at conjugacy classes computes cyclic invariants of crossed products and reduces the periodic cyclic homology of a real algebraic group action to its maximal compact subgroup. Key computation: for a discrete action, the condition $\\gamma_0\\cdots\\gamma_k\\in\\langle\\gamma\\rangle$ is preserved by Hochschild faces and cyclic permutation, giving $HH_k(A\\rtimes\\Gamma)\\cong\\bigoplus_{\\langle\\gamma\\rangle}HH_k(A\\rtimes\\Gamma)_\\gamma$ and $HH_*(A\\rtimes\\Gamma)_\\gamma\\cong HH_*(A\\rtimes\\Gamma)_{\\mathfrak m_\\gamma}$ for $\\mathfrak m_\\gamma=\\{f\\in C^\\infty(\\Gamma)^\\Gamma:f(\\gamma)=0\\}$; for a connected real algebraic $G$ with maximal compact $K$ and $q=\\dim(G/K)$, localization of the smooth convolution algebra then gives $HP_*(A\\rtimes G)_{\\mathfrak m}\\cong HP_{*+q}(A\\rtimes K)_{\\mathfrak m}$, so every non-elliptic localization vanishes, while $HH_*(C^\\infty(K))=C^\\infty(K)^K$ and $HP_*(C^\\infty(K))\\cong C^\\infty(K)^K\\otimes\\mathbb C[\\sigma]$ with $|\\sigma|=2$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/44/61/slides.pdf","title":"Katia Consani (joint with Alain Connes)","note":"Katia Consani (joint with Alain Connes), Witt theory realizes the integral Bost--Connes algebra uniformly at finite and absolute arithmetic places. Key computation: $\\mathcal A_{\\mathbb Z}=\\mathbb Z[\\mathbb Q/\\mathbb Z]\\rtimes_\\rho\\mathbb N$ is generated by $e(\\gamma),\\widetilde\\mu_n,\\mu_n^*$ with $\\rho_n(e(\\gamma))=\\sum_{n\\gamma'=\\gamma}e(\\gamma')$ and $\\mu_n^*\\widetilde\\mu_n=n$; for an embedding $\\sigma:\\overline{\\mathbb F}_p^\\times\\hookrightarrow\\mathbb C^\\times$, the eigenvalue-divisor isomorphism $W_0(\\overline{\\mathbb F}_p)\\xrightarrow{\\sim}\\mathbb Z[\\overline{\\mathbb F}_p^\\times]$ intertwines $(F_n,V_n)$ with $(\\sigma_n,\\rho_n)$, yielding $\\pi_\\sigma(\\mu_n^*)=F_n$ and $\\pi_\\sigma(\\widetilde\\mu_n)=V_n$ and extending continuously to $W(\\overline{\\mathbb F}_p)$; globally the Fourier-trace invariant gives $W_0(\\mathbb S)\\cong\\mathbb Z[\\mathbb Q/\\mathbb Z]^{\\widehat{\\mathbb Z}^{\\times}}$ via $\\widehat\\tau(E,T)(n)=\\operatorname{tr}(T^n|_{T^\\infty(E(1_+))})$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/46/29/slides.pdf","title":"Deepak Kumar Pradhan (joint with K","note":"Deepak Kumar Pradhan (joint with K. D. Deepak and Jaydeb Sarkar), partially isometric Toeplitz operators on the Hardy space of a polydisc are classified up to unitary equivalence as shifts, co-shifts, or direct sums of truncated shifts. Key computation: the Brown--Halmos relations $T_{z_i}^*TT_{z_i}=T$ force a partial-isometry symbol to depend on at most one of $z_i,\\bar z_i$ for every $i$, and one obtains $T_\\varphi=T_{\\varphi_1}^*T_{\\varphi_2}$ for inner $\\varphi_1,\\varphi_2\\in H^\\infty(\\mathbb T^n)$ depending on disjoint variable sets; thus $D(T_\\varphi)=\\varphi_1H^2(\\mathbb T^n)$, $R(T_\\varphi)=\\varphi_2H^2(\\mathbb T^n)$, every $T_\\varphi^m$ is again a partial isometry, and the Halmos--Wallen decomposition gives precisely the stated classification; moreover $[T_\\varphi^*,T_\\varphi]\\ge0$ holds exactly when $\\varphi$ is inner.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/39/74/slides.pdf","title":"Orr Shalit","note":"Orr Shalit, quotients of the Drury--Arveson multiplier algebra are classified by the complex geometry of their multiplier varieties. Key computation: for $k(z,w)=(1-\\langle z,w\\rangle)^{-1}$ and $H_V=\\overline{\\operatorname{span}}\\{k_\\lambda:\\lambda\\in V\\}$, one has $\\mathcal M_V=\\operatorname{Mult}(H_V)\\cong\\mathcal M_d/J_V$; an isometric algebra isomorphism induces $\\alpha=(\\varphi(z_1),\\ldots,\\varphi(z_d))\\in\\operatorname{Aut}(\\mathbb B_d)$ through $\\varphi^*(\\rho_\\lambda)=\\rho_{\\alpha(\\lambda)}$, while conversely $Uk_\\lambda=c_\\lambda k_{\\alpha(\\lambda)}$ implements the algebra isomorphism, proving $\\mathcal M_V\\cong_{\\mathrm{c.i.}}\\mathcal M_W$ exactly when an automorphism of $\\mathbb B_d$ maps $W$ onto $V$; for homogeneous varieties, algebraic isomorphism, similarity, biholomorphic equivalence, and equivalence under an invertible linear map of $\\mathbb C^d$ are all equivalent.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/56/slides.pdf","title":"Branimir \\v{C}a\\'ci\\'c","note":"Branimir \\v{C}a\\'ci\\'c, quantum principal $U(1)$-bundles with connection are reconstructed from Hermitian line bimodules with connection, explicitly recovering the quantum Hopf fibration and its $q$-monopole. Key computation: the grading $\\mathcal O_q(S^3)=\\bigoplus_{m\\in\\mathbb Z}L_m$ has $L_m=\\mathcal O_q(S^3)_m$ and $L_1$ a Hermitian line $\\mathcal O_q(\\mathbb{CP}^1)$-bimodule; with $\\Omega_q^1(\\mathbb{CP}^1)=L_{-2}\\oplus L_2$, $\\partial_+=\\partial_{q^{1/2}EK}$, and $\\partial_-=\\partial_{q^{-1/2}FK}$, multiplication isomorphisms $\\mu_{j,k}:L_j\\otimes L_k\\xrightarrow{\\sim}L_{j+k}$ define $\\nabla_m^{(0)}=-i(\\mu_{m,-2}^{-1}\\partial_+,\\mu_{m,2}^{-1}\\partial_-)^T$, the unique left $\\mathcal O_q(SU(2))$-covariant connection; its curvature and vertical deformation are $F_{[L_m,\\nabla_m]}=[m]_{q^{-2}}q^2\\operatorname{vol}$ and $\\kappa_{[L_m,\\nabla_m]}=q^{2m}$, and the differential Pimsner construction lifts $(L_1,\\nabla_1)$ uniquely to $(\\mathcal O_q(S^3),\\Omega_q(S^3),d_q,\\Pi_q)$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/39/65/slides.pdf","title":"Robert T","note":"Robert T. W. Martin, noncommutative rational functions in the free Hardy space are exactly rational Szeg\\H{o} kernels with stable minimal realizations, leading to finite free Blaschke products and finitely correlated Clark measures. Key computation: a minimal descriptor realization $r(Z)=(I_n\\otimes b^*)(I_n\\otimes I_N-\\sum_jZ_j\\otimes A_j)^{-1}(I_n\\otimes c)$ belongs to $H_d^2$ exactly when $\\operatorname{spr}(A)<1$, equivalently when $A$ is jointly similar to a strict row contraction $W$ and $r=K\\{W,y,v\\}$, equivalently $\\mathbb B_d^{\\mathrm{nc}}\\subseteq\\operatorname{Dom}r$; rational inner--outer factorization stays rational, every rational inner is a finite product of irreducible free Blaschke factors, and a contractive $b$ is rational exactly when its Clark functional $\\mu_b$ is finitely correlated, with $b$ inner exactly when the compressed tuple $T_{\\mu_b}=(\\Pi_{\\mu_b}^*|_{H_{\\mu_b}})^*$ is a finite row co-isometry.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/37/34/slides.pdf","title":"Rapha\\'el Ponge","note":"Rapha\\'el Ponge, measurable weak-trace-class operators are exactly Tauberian operators, giving a purely spectral formula for Connes' noncommutative integral and a semiclassical Weyl law for $L\\log L$ potentials. Key computation: for $T\\in\\mathcal L_{1,\\infty}$, $\\tau(T)=[\\{(\\log N)^{-1}\\sum_{k<N}\\lambda_k(T)\\}_N]\\in\\ell_\\infty/c_0$ and every Dixmier trace is $\\operatorname{Tr}_\\omega=\\omega\\circ\\tau$; independence of $\\omega$ is equivalent to existence of $\\lim_{N\\to\\infty}(\\log N)^{-1}\\sum_{k<N}\\lambda_k(T)$, which equals $\\mathop{\\rlap{-}\\!\\int}T$; if $\\int_M|V|\\log(1+|V|)\\,d\\operatorname{vol}_g<\\infty$, then $\\Delta_g^{-n/4}V\\Delta_g^{-n/4}\\in\\mathcal L_{1,\\infty}$ and $\\lim_{k\\to\\infty}k\\lambda_k^\\pm=c_n\\int_MV_\\pm\\,d\\operatorname{vol}_g$, hence $\\mathop{\\rlap{-}\\!\\int}\\Delta_g^{-n/4}V\\Delta_g^{-n/4}=c_n\\int_MV\\,d\\operatorname{vol}_g$ and $\\lim_{h\\to0^+}h^nN^-(h^n\\Delta_g+V)=c_n\\int_MV_-\\,d\\operatorname{vol}_g$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/49/53/slides.pdf","title":"Steven Amelotte (joint with Ben Briggs)","note":"Steven Amelotte (joint with Ben Briggs), componentwise almost-linear Stanley--Reisner resolutions classify a family of moment-angle manifolds as connected sums of sphere products. Key computation: for $S=\\Bbbk[v_1,\\ldots,v_m]$, the torus sweep operations assemble to $\\delta=\\sum_{U\\subseteq[m]}v_U\\otimes\\delta_U$ on $S\\otimes H^*(\\mathcal Z_K)$, giving the minimal free resolution of $\\Bbbk[K]$, while $H^*(\\mathcal Z_K)\\cong\\operatorname{Tor}_S^*(\\Bbbk[K],\\Bbbk)$ and $H_i(\\operatorname{lin}F_\\bullet)=0$ for $1<i<\\operatorname{projdim}\\Bbbk[K]$ define the CAL condition; if $K$ is Gorenstein and CAL, then $\\mathcal Z_K\\simeq\\mathbin{\\#}$ sphere products and $\\Omega\\mathcal Z_K\\simeq$ a product of loop spaces of spheres.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/26/34/slides.pdf","title":"Reyer Sjamaar (joint with Yi Lin","note":"Reyer Sjamaar (joint with Yi Lin, Yiannis Loizides, and Yanli Song), Euler-like Lie-algebroid retractions extend Darboux--Moser--Weinstein normal forms and Marsden--Weinstein reduction to symplectic Lie algebroids. Key computation: an Euler-like section along a clean intersection $j:N\\hookrightarrow M$ produces a deformation retraction $\\varrho:T[0,1]\\times A\\to A$ onto $j^!A$ and hence a homotopy equivalence $j_\\sharp^*:\\Omega_A^\\bullet(U)\\simeq\\Omega_{j^!A}^\\bullet(N)$; this supplies the Moser primitive giving $\\varphi^*\\omega_1=\\omega_0$ near $N$, while for $N=\\mu^{-1}(\\mathcal O)$ the reduced form on $C\\to Q=N/G$ is determined by $q_\\sharp^*\\omega_C=j_\\sharp^*\\omega-\\operatorname{an}^*\\mu_N^*\\sigma_{\\mathcal O}$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/26/slides.pdf","title":"Valentin Deaconu","note":"Valentin Deaconu, pseudo-free self-similar groupoid actions produce ample groupoids whose Higman--Thompson groups are their topological full groups and satisfy Matui's AH exact sequence under pure infiniteness and minimality. Key computation: germs $[\\alpha,g,\\beta;\\xi]$ form $\\mathcal G(G,E)$ with cocycle $\\rho([\\alpha,g,\\beta;\\xi])=|\\alpha|-|\\beta|$ and kernel $\\mathcal N(G,E)=\\bigcup_k\\mathcal N_k(G,E)$, where $\\mathcal N_k(G,E)\\cong(E^\\infty\\rtimes G)\\times R_k$; the resulting long exact sequence with map $1-\\rho_*$ computes $H_*(\\mathcal G(G,E))$, and $V_E(G)\\cong[[\\mathcal G(G,E)]]$ fits into $H_0(\\mathcal G)\\otimes\\mathbb Z_2\\to[[\\mathcal G]]_{\\mathrm{ab}}\\xrightarrow{I}H_1(\\mathcal G)\\to0$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/39/50/slides.pdf","title":"Asuman G\\'uven Aksoy (joint with Yunied Puig)","note":"Asuman G\\'uven Aksoy (joint with Yunied Puig), backward weighted shifts characterize a nuclear operator ideal by an exact factorization theorem. Key computation: $T\\in BN_{(w,p,q)}(X,Y)$ precisely when $T=RB_wS$ for $S:X\\to\\ell^{q'}$ and $R:\\ell^p\\to Y$, with $Sx=(a_i(x))_i$, $R((\\nu_i))=\\sum_i\\nu_i y_i$, and $B_w=\\sum_{i\\ge2}w_i e_i^*\\otimes e_{i-1}$; the representation $T=\\sum_{i\\ge2}w_i a_i\\otimes y_{i-1}$ gives $\\|T\\|_{(w,p,q)}=\\inf\\|R\\|\\,\\|B_w\\|\\,\\|S\\|$, and $1/s=1/p'+1/q'$ makes $(BN_{(w,p,q)},\\|\\cdot\\|_{(w,p,q)})$ an $s$-Banach operator ideal.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/45/65/slides.pdf","title":"Nathan Wagner (joint with Cody Stockdale)","note":"Nathan Wagner (joint with Cody Stockdale), Berezin-transform boundary decay classifies compact Toeplitz operators on broad weighted Bergman spaces. Key computation: for $T_u f=P(uf)$ and normalized kernels $k_z(w)=(1-|z|^2)^{(n+1)/2}/(1-z\\overline w)^{n+1}$, the Berezin transform $\\widetilde T_u(z)=\\langle T_uk_z,k_z\\rangle$ satisfies $\\widetilde T_u(z)\\to0$ as $|z|\\to1^-$ iff $T_u$ is compact on $A_\\sigma^p$ when $\\sigma\\in B_p\\cap RH_r$ and $\\sigma^{1-p'}\\in RH_r$; the underlying weighted Riesz--Kolmogorov criterion is $\\lim_{r\\to1^-}\\sup_{f\\in\\mathcal F}\\int_{r\\mathbb B_n^c}|f|^p\\sigma\\,dV=0$, and sparse domination $|T_uf(z)|\\lesssim\\sum_{K\\in\\mathcal D}\\langle|uf|\\rangle_{\\widehat K}\\chi_{\\widehat K}(z)$ yields boundedness for the larger $uB_p$ classes.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/39/45/slides.pdf","title":"Pascal Lef\\`evre (joint with Tonie Far\\`es)","note":"Pascal Lef\\`evre (joint with Tonie Far\\`es), an explicit integral condition completely classifies absolutely summing composition operators between Bloch-type spaces and produces nuclear inner-symbol examples. Key computation: for $\\varphi:\\mathbb D\\to\\mathbb D$, $C_\\varphi:\\mathcal B^\\mu\\to\\mathcal B^\\beta$ is $p$-summing exactly when $\\int_{\\mathbb D}\\sup_{z\\in\\mathbb D}\\left(\\frac{(1-|w|^2)^2}{|1-\\overline w\\varphi(z)|^2}\\right)^p\\left(\\frac{(1-|z|^2)^\\beta|\\varphi'(z)|}{|1-\\overline w\\varphi(z)|^\\mu}\\right)^p\\frac{dA(w)}{(1-|w|^2)^2}<\\infty$; for lens maps $\\varphi_\\theta$, this gives $C_{\\varphi_\\theta}$ $p$-summing when $p>\\theta/((\\beta-1)(1-\\theta))$ and nuclear when $\\theta<1-1/\\beta$, while suitable Blaschke products yield nuclear $C_\\varphi$ on $\\mathcal B^\\beta$ for $\\beta\\ge1$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/36/51/slides.pdf","title":"Hugo J","note":"Hugo J. Woerdeman, positive structured completions of multilevel Toeplitz matrices classify stable multivariable autoregressive filters. Key computation: in two variables, Fourier data $c_k=\\overline{c_{-k}}$ on $\\mathbf n=\\{0,\\ldots,n_1\\}\\times\\{0,\\ldots,n_2\\}$ come from a stable spectral density $|p(z_1,z_2)|^{-2}$ exactly when the missing coefficients can be chosen so that $T_{\\mathbf n}=(c_{k-\\ell})_{k,\\ell\\in\\mathbf n}>0$ and $\\operatorname{rank}(c_{k-\\ell})_{k\\in\\{1,\\ldots,n_1\\}\\times\\{0,\\ldots,n_2\\},\\,\\ell\\in\\{0,\\ldots,n_1\\}\\times\\{1,\\ldots,n_2\\}}=n_1n_2$; for $c_{00}=1$ and $c_{01}=c_{10}=c_{11}=0.9$, the completion is explicitly $c_{1,-1}=0.81$, making the Toeplitz matrix positive definite and producing the stable filter.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/38/65/slides.pdf","title":"Herv\\'e Queff\\'elec (joint with Pascal Lef\\`evre","note":"Herv\\'e Queff\\'elec (joint with Pascal Lef\\`evre, Daniel Li, and Luis Rodr\\'iguez-Piazza), conditional multipliers of admissible weighted Hardy spaces classify symbols by strict range contraction and finite Blaschke products. Key computation: for $H=H^2(\\beta)$ and $M(H,\\varphi)=\\{w:w(f\\circ\\varphi)\\in H\\ \\forall f\\in H\\}$, one has $M(H^2,\\varphi)\\subseteq M(H,\\varphi)$ and the sharp equivalences $M(H,\\varphi)=H\\Longleftrightarrow\\|\\varphi\\|_\\infty<1$ and $M(H,\\varphi)=H^\\infty\\Longleftrightarrow\\varphi$ is a finite Blaschke product; for $H^2$, the kernel estimate $\\|K_a\\|_{\\mathrm{op}}\\le\\sqrt{(1+|\\varphi(a)|)/(1-|\\varphi(a)|)}(1-|a|^2)^{-1/2}$ turns $M(H^2,\\varphi)=H^\\infty$ into $\\sup_a(1-|\\varphi(a)|)/(1-|a|)<\\infty$, which is precisely the finite-Blaschke condition.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/45/12/slides.pdf","title":"P","note":"P. Muthukumar, a Schur-class divisibility condition classifies exactly which Beurling subspaces are invariant under a composition operator. Key computation: for inner $\\theta$ and analytic $\\varphi:\\mathbb D\\to\\mathbb D$, the conditions $C_\\varphi(\\theta H^2)\\subseteq\\theta H^2$ and $(\\theta\\circ\\varphi)/\\theta\\in\\mathcal S(\\mathbb D)$ are equivalent; Douglas range inclusion rewrites this as $C_\\varphi M_\\theta=M_\\theta X$, and evaluation of $X^*M_\\theta^*=M_\\theta^*C_\\varphi^*$ on $K_w(z)=(1-\\overline wz)^{-1}$ yields $X^*(\\overline{\\theta(w)}K_w)=\\overline{\\theta(\\varphi(w))}K_{\\varphi(w)}$, giving an equivalent bounded-kernel criterion and, for Blaschke $B$, the zero-multiplicity test $\\operatorname{mult}_B(w)\\le\\operatorname{mult}_{B\\circ\\varphi}(w)$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/39/32/slides.pdf","title":"Dragan Vukoti\\'c (joint work with Alexandru Aleman and Aristomenis Siskakis)","note":"Dragan Vukoti\\'c (joint work with Alexandru Aleman and Aristomenis Siskakis), the conformal-invariance index of an analytic Banach space determines the complete spectrum of its Hilbert matrix operator. Key computation: the weighted automorphisms $W_a^{1/2}f=(\\varphi_a')^{1/2}(f\\circ\\varphi_a)$ have generator $Df(z)=(1-z^2)f'(z)-zf(z)$ with $\\sigma(D)=S_\\alpha=\\{\\lambda:|\\operatorname{Re}\\lambda|\\le|1-2\\alpha|\\}$, and $Kf(z)=\\int_{-1}^1f(r)/(1-rz)\\,dr=\\int_{-1}^1W_a^{1/2}f(z)\\,da/\\sqrt{1-a^2}$; spectral mapping gives $\\sigma(H)=\\sigma(K)=\\{0\\}\\cup\\{\\pi/\\cos(\\pi\\lambda/2):\\lambda\\in S_\\alpha\\}$ and $r(H)=\\pi/\\cos(\\pi|\\alpha-1/2|)$, recovering $\\sigma(H)=[0,\\pi]$ when $\\alpha=1/2$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/57/71/slides.pdf","title":"Francesco Fournier-Facio (joint with Bharatram Rangarajan)","note":"Francesco Fournier-Facio (joint with Bharatram Rangarajan), every lamplighter $\\Gamma\\wr\\mathbb Z$ is Ulam stable with a linear estimate, which implies the same for Thompson's groups $F',F,T$ and embeds every countable group in a three-generated linearly Ulam-stable group. Key computation: an asymptotic homomorphism $\\varphi_n:\\Gamma\\to U(k_n)$ defines $W=\\prod_{n\\to\\omega}\\mathfrak u(k_n)$ and an Ulam class $\\alpha_\\varphi\\in H_a^2(\\Gamma,W)$, with $\\alpha_\\varphi=0$ equivalent to a defect-diminishing correction $\\operatorname{dist}(\\varphi_n,\\psi_n)=O_\\omega(\\operatorname{def}(\\varphi_n))$ and $\\operatorname{def}(\\psi_n)=o_\\omega(\\operatorname{def}(\\varphi_n))$; the highly ergodic Zimmer-amenable model for $\\Gamma\\wr\\mathbb Z$ makes the relevant invariant cochain complex alternate $\\operatorname{id}$ and $0$, killing every Ulam class, while the coamenable inclusion $F[a,b]\\cong F< F'$ injects restriction on $H_a^2$ and transfers the vanishing to $F',F,T$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/26/61/slides.pdf","title":"Stephen S","note":"Stephen S. Kudla, the numerical ring of special cycles on an orthogonal Shimura variety is determined by Fourier coefficients of pullbacks of Hilbert--Siegel Eisenstein series and depends only on the finite quadratic space. Key computation: the theta-form identity $[\\theta(g_\\tau';\\varphi)]=\\phi_n(\\tau;\\varphi)=\\sum_{T\\ge0}Z(T,\\varphi)q^T$ and wedge compatibility $\\varphi_\\infty^{(n_1+n_2)}=\\varphi_\\infty^{(n_1)}\\wedge\\varphi_\\infty^{(n_2)}$, followed by Siegel--Weil, give $\\langle z(T_1,\\varphi_1),z(T_2,\\varphi_2)\\rangle=A(T_1,T_2;\\lambda_{V_f}(\\varphi_1\\otimes\\varphi_2))$ for $n_1+n_2=m$ and $\\langle z(T_1,\\varphi_1)z(T_2,\\varphi_2),z(T_3,\\varphi_3)\\rangle=A(T_1,T_2,T_3;\\lambda_{V_f}(\\varphi_1\\otimes\\varphi_2\\otimes\\varphi_3))$ for $n_1+n_2+n_3=m$; nondegeneracy determines multiplication, and matching Schwartz functions for $V(\\mathbb A_f)\\simeq V'(\\mathbb A_f)$ yield an isometric graded-ring isomorphism $SC^\\bullet(V)\\simeq SC^\\bullet(V')$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/23/12/slides.pdf","title":"Iskander A","note":"Iskander A. Taimanov, the generalized Kummer resolution gives an explicit intersection-ring classification for a simply connected Joyce $G_2$-manifold and shows that it has no nontrivial Massey products. Key computation: for the commuting involutions $\\alpha,\\beta,\\gamma$ on $T^7$ with $\\Gamma\\cong(\\mathbb Z/2)^3$, one computes $b_1(T^7/\\Gamma)=b_2(T^7/\\Gamma)=0$ and $b_3(T^7/\\Gamma)=b_4(T^7/\\Gamma)=7$; resolving the twelve singular $T^3\\times(D/\\{\\pm1\\})$ strata adds classes giving $b_2(M)=12$ and $b_3(M)=43$, and the nonzero products in the homology intersection ring are $c_{\\delta i}\\cap c'_{\\delta i}=-2$, $c_{\\delta ij}\\cap c'_{\\delta ij}=-2$, $t_\\delta\\cap t'_\\delta=4$, $t_i\\cap t'_i=8$, $c'_{\\delta i}\\cap c'_{\\delta i}=-2t_\\delta$, and $t'_\\delta\\cap c'_{\\delta i}=4c_{\\delta i}$, which by Poincar\\'e duality determines $H^*(M;\\mathbb Q)$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/41/26/slides.pdf","title":"Herbert Gangl","note":"Herbert Gangl, explicit polylogarithmic functional equations realize Zagier's polylogarithm conjecture through weight four and construct higher-weight analogues of the decisive motivic relation. Key computation: Bloch's map $\\delta_2^F:\\mathbb Z[F]\\to\\bigwedge^2F^\\times$, $[x]\\mapsto x\\wedge(1-x)$, together with the exact sequence $0\\to T(F)\\to K_3(F)/K_3^M(F)\\to B_2(F)\\to0$, turns the single-valued dilogarithm into the regulator formula $\\pi^{r_2}\\zeta_F^*(-1)=q\\det(\\mathcal L_2(\\xi_i^\\sigma))_{i,\\sigma}$; at weight four an explicit 122-term reduction $I_{3,1}(z,V(x,y))\\equiv\\sum_{i=1}^{122}c_i\\operatorname{Li}_4(f_i(x,y,z))$ modulo lower-weight products supplies the $Q_4$ relation used by Goncharov--Rudenko to prove the conjecture for $m=4$, while the explicit quadruple ratio is a 368-orbit combination on eight points in $\\mathbb P^3$ representing a nonzero class in $H^7(GL_4(\\mathbb C),\\mathbb R)$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/51/02/slides.pdf","title":"Jongbaek Song (joint with Xin Fu and Tseleung So)","note":"Jongbaek Song (joint with Xin Fu and Tseleung So), the fan vectors of a compact toric surface determine its integral cohomology ring through an explicit cup-product matrix. Key computation: for rays $(-1,0),(0,-1),(a_1,b_1),\\ldots,(a_n,b_n)$, a cellular cofibration $S^3\\to\\bigvee_{i=1}^nS_i^2\\to X_\\Sigma$ yields bases $H^2(X_\\Sigma;\\mathbb Z)=\\mathbb Z\\langle u_1,\\ldots,u_n\\rangle$ and $H^4(X_\\Sigma;\\mathbb Z)=\\mathbb Z\\langle v\\rangle$; the weighted Stanley--Reisner model and the morphisms $X_\\Sigma\\to\\mathbb{CP}_{1,a_i,b_i}^2$ send $[a_ib_ix_1]$ to $\\sum_{k<i}a_kb_i y_k+a_ib_i y_i+\\sum_{k>i}a_ib_k y_k$ and $[x_2x_3]$ to $[y_{n+1}y_{n+2}]$, so $u_i\\smile u_j=a_{\\min(i,j)}b_{\\max(i,j)}v$ and $M(X_\\Sigma)_{ij}=a_{\\min(i,j)}b_{\\max(i,j)}$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/26/31/slides.pdf","title":"Lisa Jeffrey (joint with Nan-Kuo Ho","note":"Lisa Jeffrey (joint with Nan-Kuo Ho, Paul Selick, and Eugene Xia), Mayer--Vietoris decompositions compute the integral cohomology ring of the genus-two $SU(2)$ character variety with puncture monodromy $-I$ and identify its connected-sum type. Key computation: with $M=\\mu^{-1}(-I)$ and $A=M/SU(2)$, the commutator trace stratification gives $A\\simeq T\\cup_{\\mathbb{RP}^3\\times S^2}T$, where $T=\\{(g,h):[g,h]=I\\}\\simeq S^3\\vee S^3\\vee S^2\\vee\\Sigma^2\\mathbb{RP}^2$; the prequantum bundle Mayer--Vietoris sequence $0\\to\\mathbb Z/2\\to H^4(L;\\mathbb Z)\\to\\mathbb Z/2\\to0$ and $H^4(L;\\mathbb Z/2)=\\mathbb Z/2$ force $H^4(L;\\mathbb Z)=\\mathbb Z/4$, and yield $H^*(A)=\\langle1,x,s_1,s_2,s_3,s_4,y,z\\rangle$ with $|x|=2$, $|s_i|=3$, $|y|=4$, $|z|=6$, $x^2=4y$, and $xy=s_1s_3=s_2s_4=z$; Wall's theorem then gives $A\\cong A^0\\#(S^3\\times S^3)\\#(S^3\\times S^3)$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/42/29/slides.pdf","title":"Ron Donagi","note":"Ron Donagi, supermoduli is non-split and non-projected in genus at least five, while the super Mumford isomorphism constructs natural measures that extend across the vanishing-theta-null locus and, with Ramond punctures, across codimension at least two. Key computation: a supermanifold $S=(M,\\mathcal O_S)$ has splitting obstruction $\\omega\\in H^1(M,T_M\\otimes\\bigwedge^2V^*)$, appearing as the third component of its super Atiyah class alongside the Atiyah classes of $T_+S$ and $T_-S$; for $\\mathfrak M_g$, $\\dim\\mathfrak M_g=(3g-3\\mid2g-2)$ with $T_+|_{[S]}=H^1(T_M)$ and $T_-|_{[S]}=H^1(T_M^{1/2})$, and restricting $\\omega$ to a lifted family of odd-branched covers gives $\\omega\\ne0$ for $g\\ge5$; the identity $\\mathcal L_{3/2}\\simeq\\mathcal L_{1/2}^{5}$ defines the superstring measure, and a codimension-$\\ge2$ Hartogs extension gives a natural measure on $\\mathfrak M_{g,0,r}$ for $r\\ge2$ Ramond punctures.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/33/73/slides.pdf","title":"Meng Fai Lim","note":"Meng Fai Lim, the growth of \\'etale wild kernels in multi-false-Tate towers is controlled by an Iwasawa-module rank, and its smaller-order growth is equivalent to the noncommutative Greenberg conjecture. Key computation: Poitou--Tate duality identifies $R_i(F)=WK_{2i}^{\\mathrm{\\acute et}}(F)^\\vee$ with the kernel of $H^1(G_S(F),\\mathbb Q_p/\\mathbb Z_p(-i))\\to\\bigoplus_{v\\in S}H^1(F_v,\\mathbb Q_p/\\mathbb Z_p(-i))$; Hochschild--Serre gives $\\ker h_n=H^1(G_n,\\mathbb Q_p/\\mathbb Z_p(-i)(F_\\infty))$ and $\\operatorname{coker}h_n\\subseteq H^2(G_n,\\mathbb Q_p/\\mathbb Z_p(-i)(F_\\infty))$, yielding $e(R_i(F_\\infty)^{G_n})-e(R_i(F_n))=O(np^{(d-2)n})$; if the cyclotomic $\\mu$-conjecture holds, then $e(WK_{2i}^{\\mathrm{\\acute et}}(F_n))=\\operatorname{rank}_{\\mathbb Z_p[[H]]}Y_i(F_\\infty)\\,np^{(d-1)n}+O(p^{(d-1)n})$, and vanishing of this rank is equivalent to $\\operatorname{Gal}(K(F_\\infty)/F_\\infty)$ being pseudo-null.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/50/96/slides.pdf","title":"Soumen Sarkar","note":"Soumen Sarkar, weighted Grassmann orbifolds have torsion-free integral cohomology concentrated in even degrees, and their integral equivariant cohomology is completely encoded by an orbifold GKM graph. Key computation: for $W=(w_1,\\ldots,w_n)$ and $a\\ge1$, $WGr(d,n)=M_d(n,d;\\mathbb C)/{\\sim_W}$ with $(a_1,\\ldots,a_n)^t\\sim_W(t^{w_1}a_1,\\ldots,t^{w_n}a_n)^tT$ whenever $t^a=\\det T$; its finite-quotient strata satisfy that $H_j(U(L)/G;\\mathbb Z)$ has no $p$-torsion for $p\\nmid|G|$, producing a torsion-free even-dimensional cellular filtration; each $WGr(d,n)$ is consequently a GKM orbifold and $H_{T^n}^*(WGr(d,n);\\mathbb Z)\\cong\\{f:V(\\Gamma)\\to H^*(BT^n;\\mathbb Z)\\mid r_e\\alpha(e)\\text{ divides }f(s(e))-f(t(e))\\}=H_{T^n}^*(\\Gamma,\\alpha,\\theta)$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/27/43/slides.pdf","title":"Payman Eskandari (joint with Kumar Murty)","note":"Payman Eskandari (joint with Kumar Murty), the Ceresa cycle of every Fermat curve $F(p)$ of prime degree $p>7$ has infinite order modulo rational equivalence, for every base point. Key computation: quadratic iterated integrals give $E_e^\\infty\\in\\operatorname{Ext}((H^1)^{\\otimes3},\\mathbb Q(-1))$, and for a correspondence $Z$ the Darmon--Rotger--Sols formula is $\\xi_Z^{-1}(E_e^\\infty)=(\\int_\\Delta\\xi_Z)(\\infty-e)-P_Z$; taking $Z$ as the graph of $(x,y,z)\\mapsto(-y,z,x)$ on $F(p)$ gives fixed points $Q=(\\eta,\\eta^{-1},1)$ and $\\bar Q=(\\eta^{-1},\\eta,1)$ and hence $P_Z=Q+\\bar Q-2e$, which Gross--Rohrlich proves has infinite order while $\\infty-e$ is torsion; thus $E_e^\\infty\\ne0$, its $H^1\\otimes\\xi_\\Delta$ component $-2g\\infty+2e+K$ is torsion, and Harris--Pulte identifies the remaining component with $\\tfrac12AJ(F(p)_e-F(p)_e^-)$, forcing the Abel--Jacobi image, and therefore the Ceresa cycle, to be nonzero.","date":""},{"tags":["columbia.edu"],"category":"columbia.edu","url":"https://www.math.columbia.edu/~avizeff/seminars/other/prismatic.pdf","title":"Avi Zeff","note":"Avi Zeff, prismatic cohomology of quasiregular semiperfectoid rings is computed in degree zero and its Nygaard completion recovers the even homotopy of $\\mathrm{THH}$, $\\mathrm{TC}^-$, and $\\mathrm{TP}$. Key computation: the initial prism $(\\Delta_R^{\\mathrm{init}},(d))$ gives $\\Delta_{R/A}=\\Delta_R=\\Delta_R^{\\mathrm{init}}$ and $N^{\\ge i}\\Delta_R=\\varphi^{-1}(d^i\\Delta_R)$; after Nygaard completion, $\\pi_{2*}\\mathrm{THH}(R)=N^*\\widehat\\Delta_R\\{*\\}$, $\\pi_{2*}\\mathrm{TC}^-(R)=N^{\\ge *}\\widehat\\Delta_R\\{*\\}$, and $\\pi_{2*}\\mathrm{TP}(R)=\\widehat\\Delta_R\\{*\\}$, with all odd homotopy groups vanishing.","date":""},{"tags":["uvigo.gal"],"category":"uvigo.gal","url":"http://xabier.garcia.martinez.webs.uvigo.gal/CT2024/files/Slides/Mart%C3%ADnez-Carpena_Slides.pdf","title":"David Mart\\'inez-Carpena (with Carles Casacuberta and Javier J","note":"David Mart\\'inez-Carpena (with Carles Casacuberta and Javier J. Guti\\'errez), presentable $\\infty$-categories are exactly the categories of models of limit $\\infty$-sketches. Key computation: for a limit $\\infty$-sketch $\\Sigma=(A,L)$, $\\operatorname{Mod}(\\Sigma)=\\{F:A\\to\\mathcal S\\mid F(\\alpha)\\text{ is limiting for every }\\alpha\\in L\\}$ is presentable, and conversely every presentable $\\infty$-category $\\mathcal C$ admits a normal $\\Sigma$ with $\\mathcal C\\simeq\\operatorname{Mod}(\\Sigma)$; concretely, the cones $\\alpha_n$ on $\\Delta^{\\mathrm{op}}$ impose $F_n\\simeq F_1\\times_{F_0}\\cdots\\times_{F_0}F_1$, so their models are Segal spaces, while adjoining the univalence cone produces complete Segal spaces.","date":""},{"tags":["uvigo.gal"],"category":"uvigo.gal","url":"http://xabier.garcia.martinez.webs.uvigo.gal/CT2024/files/Slides/Joyal_Slides.pdf","title":"Andr\\'e Joyal","note":"Andr\\'e Joyal, the free bicompletion of a locally small category is characterized intrinsically by softness together with atomic and co-atomic generators. Key computation: softness requires the canonical square from $\\operatorname*{colim}_I\\operatorname*{lim}_J\\mathcal E(A_i,B_j)$ to $\\mathcal E(\\operatorname*{lim}_I A_i,\\operatorname*{colim}_J B_j)$ to be a pushout; hence every $f:\\prod_{i\\in I}A_i\\to\\coprod_{j\\in J}B_j$ factors through some projection $\\prod_iA_i\\to A_i$, some inclusion $B_j\\to\\coprod_jB_j$, or both, and $\\eta:K\\to\\Lambda(K)$ is the free bicompletion precisely when $\\Lambda(K)$ is bicomplete and soft, $\\eta$ is fully faithful and generating, and each $\\eta(A)$ is atomic and co-atomic.","date":""},{"tags":["uvigo.gal"],"category":"uvigo.gal","url":"http://xabier.garcia.martinez.webs.uvigo.gal/CT2024/files/Slides/Arkor_Slides.pdf","title":"Nathanael Arkor and Dylan McDermott","note":"Nathanael Arkor and Dylan McDermott, the algebras of any relative monad rooted at a dense functor are reconstructed as a pullback along the corresponding nerve, subsuming standard nerve theorems. Key computation: for $j:A\\to E$ dense and a $j$-relative monad $T$ with $\\operatorname{Kl}(T)(x,y)=E(jx,ty)$, the square $\\operatorname{Alg}(T)\\to\\widehat{\\operatorname{Kl}(T)}$ over $E\\xrightarrow{n_j}\\widehat A$, where $n_j(e)=E(j-,e)$, is a pullback in $\\operatorname{Cat}$; thus $\\operatorname{Kl}(T)\\hookrightarrow\\operatorname{Alg}(T)$ is dense, and for an ordinary monad the analogous square is a pullback exactly when $T$ is $j$-ary, recovering algebraic theories and the Segal-nerve classification of categories.","date":""},{"tags":["uvigo.gal"],"category":"uvigo.gal","url":"http://xabier.garcia.martinez.webs.uvigo.gal/CT2024/files/Slides/Ko_Slides.pdf","title":"Joanna Ko","note":"Joanna Ko, enhanced simplicial categories of $(\\infty,1)$-categories with specified limits and lax morphisms admit the higher limit constructions needed for Eilenberg--Moore objects. Key computation: $J\\text{-}\\operatorname{Lim}$ admits rigged $n$-inserters, so in particular comma objects whose projections preserve and jointly reflect $J$-shaped limits; since a loose homotopy-coherent monad's Eilenberg--Moore object is assembled from simplicial powers, rigged $n$-inserters, and limits of countable chains of tight isofibrations, $\\operatorname{Lali}(\\mathcal K)$ admits such Eilenberg--Moore objects and its forgetful functor is exact and detects exactness, recovering that $U:T\\text{-}\\operatorname{Alg}\\to A$ lifts $J$-limits even when $T$ does not preserve them.","date":""},{"tags":["uvigo.gal"],"category":"uvigo.gal","url":"http://xabier.garcia.martinez.webs.uvigo.gal/CT2024/files/Slides/Koudenburg_Slides.pdf","title":"Seerp Roald Koudenburg","note":"Seerp Roald Koudenburg, formal Day convolution lifts Yoneda morphisms and yields a monoidal double Grothendieck correspondence. Key computation: a lax $T$-algebra $(A,\\alpha)$ and Yoneda morphism $y:A\\to\\widehat A$ lift, when the pointwise weak composite $\\alpha_*\\odot Ty_*$ exists, to a lax $T$-algebra structure on $\\widehat A$ for which $y$ is pseudo-$T$, giving $\\widehat A(y,-):(\\operatorname{Lax}\\text{-}T\\text{-}\\operatorname{Mor}(B,\\widehat A))\\simeq(T\\text{-}\\operatorname{Mor}(A,B))$; for $y:A\\to\\operatorname{Set}^{A^{\\mathrm{op}}}$ this constructs Day convolution, while for $Y:1\\to\\operatorname{Span}(\\operatorname{Cat})$ it identifies lax monoidal lax double functors $G:(B,\\otimes)\\to(\\operatorname{Span}(\\operatorname{Cat}),\\times)$ with lax monoidal double split opfibrations $\\int G\\to B$.","date":""},{"tags":["uvigo.gal"],"category":"uvigo.gal","url":"http://xabier.garcia.martinez.webs.uvigo.gal/CT2024/files/Slides/Loregian_Slides.pdf","title":"Fosco Loregian","note":"Fosco Loregian, bicategorical Moore machines are models of a finite weighted-limit sketch and their universal machine is computed by a right Kan extension. Key computation: classical machines arise from pullbacks $\\operatorname{Mly}(F,B)=\\operatorname{Alg}(F)\\times_K(F/B)$ and $\\operatorname{Mre}(F,B)=\\operatorname{Alg}(F)\\times_K(K/B)$; in a bicategory, a fixed-input/output biMoore machine fills the $2$-cells $\\delta:e\\circ i\\Rightarrow e$ and $\\sigma:e\\Rightarrow o$, and its terminal object is $\\operatorname{Ran}_{i^\\sharp}(o)$ along the free monad $i^\\sharp:A\\to A$, recovering $[A^*,B]$ in the one-object closed-monoidal case and extending the construction to $(T,V)$-profunctors.","date":""},{"tags":["uvigo.gal"],"category":"uvigo.gal","url":"http://xabier.garcia.martinez.webs.uvigo.gal/CT2024/files/Slides/Mertens_Slides.pdf","title":"Arne Mertens (joint with Wendy Lowen)","note":"Arne Mertens (joint with Wendy Lowen), necklace-parametrized templicial objects define quasi-categories enriched in a non-cartesian monoidal category and explicitly compute left adjoints to enriched nerve functors. Key computation: the nerve has $N_V(C)_n=C_1\\otimes_{C_0}\\cdots\\otimes_{C_0}C_1$ and comultiplications $\\mu_{k,l}:X_{k+l}\\to X_k\\otimes_{X_0}X_l$ indexed by inclusions $\\Delta^k\\vee\\Delta^l\\hookrightarrow\\Delta^{k+l}$; if $\\pi D\\simeq\\operatorname{Lan}_\\iota D'$, then $\\pi(L_DX(a,b))\\simeq\\coprod_{T\\in\\operatorname{Nec}}F(X_T^{\\mathrm{nd}}(a,b))\\otimes D'(T)$, yielding for Lurie's dg nerve $L_{\\mathrm{dg}}(X)_n(a,b)\\simeq\\bigoplus_{\\dim T=n}k\\!\\cdot\\!X_T^{\\mathrm{nd}}(a,b)$.","date":""},{"tags":["uvigo.gal"],"category":"uvigo.gal","url":"http://xabier.garcia.martinez.webs.uvigo.gal/CT2024/files/Slides/Ray_Slides.pdf","title":"Samarpita Ray (joint with Abhishek Banerjee and Mamta Balodi)","note":"Samarpita Ray (joint with Abhishek Banerjee and Mamta Balodi), representations of coalgebras have Grothendieck categories of cis- and trans-comodules, with cartesian subcategories serving as coalgebraic analogues of quasi-coherent sheaves. Key computation: for $C:X\\to\\operatorname{Coalg}$ with right-semiperfect values, a map $V\\to M_x$ from a finite-dimensional projective generates $N_y=\\operatorname{Im}(\\bigoplus_{\\beta:x\\to y}\\beta_*V\\to M_y)$ with $|N|\\le\\kappa=\\sup\\{\\aleph_0,|\\operatorname{Mor}X|,|K|\\}$, and every $M$ is a sum of such $N$, proving $\\operatorname{Com}^{\\mathrm{cs}}\\!\\text{-}C$ is Grothendieck; if $C$ is quasi-finite then $\\alpha_!=H_{C_y}(C_x,-)\\dashv\\alpha^*$ gives the corresponding Grothendieck classification for $\\operatorname{Com}^{\\mathrm{tr}}\\!\\text{-}C$, while semiperfect $C$ makes $\\operatorname{Com}^{\\mathrm{cs}}\\!\\text{-}C$ a hereditary torsion class in $C^*\\text{-}\\operatorname{Mod}^{\\mathrm{tr}}$.","date":""},{"tags":["uvigo.gal"],"category":"uvigo.gal","url":"http://xabier.garcia.martinez.webs.uvigo.gal/CT2024/files/Slides/RamosP%C3%A9rez_Slides.pdf","title":"Brais Ramos P\\'erez","note":"Brais Ramos P\\'erez, modules over invertible Hopf-algebra $1$-cocycles are equivalent to modules over the associated Hopf braces. Key computation: an invertible $1$-cocycle is a coalgebra isomorphism $\\pi:A\\to H$ satisfying $\\pi\\circ\\mu_A=\\mu_H\\circ(\\pi\\otimes\\varphi_H)\\circ(\\delta_A\\otimes\\pi)$; it produces the brace $H_\\pi=Q(\\pi,\\varphi_H)$, and the functor $H_\\pi:(\\pi,\\varphi_H)\\text{-}\\operatorname{Mod}\\to H_\\pi\\text{-}\\operatorname{Mod}$ sends $(M,N,\\varphi_M,\\phi_M,\\varphi_N,\\gamma)$ to $(M,\\phi_M,\\gamma\\circ\\varphi_N\\circ(\\pi^{-1}\\otimes\\gamma^{-1}))$, with inverse $M_{(\\pi,\\operatorname{id}_H)}\\circ G_{H_\\pi}$, so the composites are $\\operatorname{id}_{H_\\pi\\text{-}\\operatorname{Mod}}$ and naturally isomorphic to $\\operatorname{id}_{(\\pi,\\varphi_H)\\text{-}\\operatorname{Mod}}$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/49/55/slides.pdf","title":"Ivan Limonchenko (joint with Rade \\v{Z}ivaljevi\\'c and Matvey Sergeev)","note":"Ivan Limonchenko (joint with Rade \\v{Z}ivaljevi\\'c and Matvey Sergeev), flag Bier spheres are classified by four families of simple polytopes, and every Bier sphere canonically determines smooth moment-angle and toric manifolds. Key computation: every flag $\\operatorname{Bier}(K)$ is the nerve of $I^n$, $I^n\\times Q_5$, $I^n\\times Q_6$, or $I^n\\times P_4$; moreover $s_{\\mathbb R}(\\operatorname{Bier}(K))=s(\\operatorname{Bier}(K))=m+1$, and the cones $C(\\sigma,\\tau)=\\mathbb R_{\\ge0}\\langle-e_p,e_q\\mid p\\in\\sigma,\\ q'\\in\\tau\\rangle$ form a complete regular fan $\\Sigma(K)\\subset\\mathbb R^{m-1}$, producing the smooth manifolds $Z_{\\operatorname{Bier}(K)}^{3m-1}$ and $X_{\\Sigma(K)}^{2(m-1)}$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/49/64/slides.pdf","title":"Daisuke Kishimoto (joint with Kouyemon Iriye)","note":"Daisuke Kishimoto (joint with Kouyemon Iriye), a triangulation of an $\\mathbb F$-orientable manifold is $\\mathbb F$-Golod if and only if it is $\\mathbb F$-tight. Key computation: the dga $C^*(K)$ with $C^p(K)=\\bigoplus_{\\varnothing\\ne I\\subset[m]}\\widetilde C^{p-|I|-1}(K_I)$ is homotopy equivalent to the Koszul complex of $\\mathbb F[K]$; tightness lifts cocycles from $\\widetilde C^*(K_I)$ to $\\widetilde C^*(K)$, and higher prism operators $P_H$ obey $\\partial P_H+(-1)^{q-1}P_H\\partial=\\sum_{i=0}^q(-1)^iP_{H\\circ(1\\otimes d^i)}$, furnishing the higher homotopies that kill every product and Massey product in $H^*(C^*(K))\\cong\\operatorname{Tor}^S(\\mathbb F[K],\\mathbb F)$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/49/66/slides.pdf","title":"Alexandru Suciu (joint work with Aprodu","note":"Alexandru Suciu (joint work with Aprodu, Farkas, Raicu, and Sama), the support resonance schemes of every simplicial complex are reduced coordinate-subspace arrangements, and their Koszul modules are computed from induced-subcomplex cohomology. Key computation: for $\\Delta$ on $V=[n]$, $\\mathcal R^i(\\Delta)=\\bigcup_{W\\subseteq V\\,\\mathrm{maximal},\\,\\widetilde H^{i-1}(\\Delta_W;k)\\ne0}k^W$ is the irreducible-component decomposition of the reduced support scheme, while for every square-free multi-index $\\mathbf b$ there are natural isomorphisms $[W_i(\\Delta)]_{\\mathbf b}\\cong\\operatorname{Tor}^{S}_{|\\mathbf b|-i}(k,k[\\Delta])_{\\mathbf b}\\cong\\widetilde H^{i-1}(\\Delta_{\\mathbf b};k)^\\vee$, yielding its multigraded Hilbert series by summing these cohomology dimensions.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/49/76/slides.pdf","title":"Xin Fu (joint with Tseleung So","note":"Xin Fu (joint with Tseleung So, Jongbaek Song, and Stephen Theriault), the integral cohomology ring determines the away-from-small-primes homotopy type of quasitoric manifolds over products of equal-dimensional simplices. Key computation: if $M,N$ are $2n$-manifolds over $\\prod_{i=1}^{\\ell}\\Delta^d$ and $H^*(M)\\cong H^*(N)$, the fibration $\\prod_{i=1}^{\\ell}S^{2d+1}\\to M\\to BT^{m-n}$ gives $\\operatorname{skel}_{2d}(M)\\simeq\\operatorname{skel}_{2d}(BT^{m-n})\\simeq\\operatorname{skel}_{2d}(N)$; for $k>d$, the attaching map homomorphism $g_M:H_{2k+2}(M)\\to\\pi_{2k+1}(\\operatorname{skel}_{2k}M)$ is an isomorphism after inverting all primes $p\\le n/d+1$, so induction over even skeleta yields $M\\simeq N$ with those primes inverted.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/50/97/slides.pdf","title":"Shintar\\^o Kuroki (joint with Yael Karshon)","note":"Shintar\\^o Kuroki (joint with Yael Karshon), locally standard torus actions are classified up to equivariant diffeomorphism by an orbit manifold, its unimodular facet labeling, and a Chern class. Key computation: to $T^d\\curvearrowright M$ one assigns $Q=M/T$, $\\widehat\\lambda:\\partial_1^\\circ Q\\to(t_{\\mathbb Z})_{\\mathrm{primitive}}/\\{\\pm1\\}$, and $c\\in H^2(Q;t_{\\mathbb Z})$; the exact sequence $0\\to t_{\\mathbb Z}\\to\\mathbb R^d\\to T^d\\to0$, together with $H^q(\\mathring Q;\\mathbb R^d)=0$ and $Q\\simeq\\mathring Q$, identifies $H^1(\\mathring Q;T^d)\\cong H^2(Q;t_{\\mathbb Z})$, so the free principal bundle $M_{\\mathrm{free}}\\to\\mathring Q$ is recovered from $c$, and the functor $\\mathrm{Cl}(M)=(Q,\\widehat\\lambda,c)$ is full and essentially surjective.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/51/05/slides.pdf","title":"Tao Gong","note":"Tao Gong, the quotient of a toric variety attached to a Weyl polytope is homotopy equivalent to the toric variety attached to the quotient polytope, for every Lie type and every parabolic subgroup. Key computation: writing $X_P/W\\cong(S_N\\times(P\\cap C))/\\!\\sim_{\\mathrm{ed}}$ and $X_{P/W}\\cong(S_N\\times(P\\cap C))/\\!\\sim$, the identity on representatives induces $\\Phi:X_P/W\\to X_{P/W}$; if $p\\in\\operatorname{relint}(H_I\\cap F_J\\cap C)$, then $\\Phi^{-1}([t,p])\\cong\\bigl(S_N(\\sigma_{[n],p})/S_N(\\sigma_p)\\bigr)/W_I\\cong\\bigl(\\operatorname{Span}\\{\\alpha_i:i\\in I\\}/S_{P^\\vee_{I,J}}\\bigr)/W_I$, a locally contractible finite-affine quotient, so Smale's theorem gives $\\Phi\\simeq$ a homotopy equivalence; the same argument yields $X_P/W_K\\simeq X_{P/W_K}$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/51/20/slides.pdf","title":"Seonghyeon Yu (joint with Suyoung Choi and Younghan Yoon)","note":"Seonghyeon Yu (joint with Suyoung Choi and Younghan Yoon), the rational homology of the real toric varieties associated with the exceptional Weyl groups $E_7$ and $E_8$ is computed explicitly. Key computation: the Weyl-equivariant decomposition $H^*(X_R^{\\mathbb R})\\cong\\bigoplus_{S\\in\\operatorname{Row}(\\Lambda_R)}\\widetilde H^{*-1}(K_S)$ reduces the problem to orbit representatives of induced subcomplexes; their computed reduced Betti numbers give $(\\beta_0,\\ldots,\\beta_4)(X_{E_7}^{\\mathbb R};\\mathbb Q)=(1,63,8127,131041,122976)$ and $(\\beta_0,\\ldots,\\beta_4)(X_{E_8}^{\\mathbb R};\\mathbb Q)=(1,120,103815,6925200,23932800)$, with all other $\\beta_k$ equal to zero.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/42/slides.pdf","title":"Tyler Schulz (joint with Marcelo Laca)","note":"Tyler Schulz (joint with Marcelo Laca), for $0<\\beta\\le1$ the right $ax+b$ system has a simplex of KMS$_\\beta$ states parametrized by probability measures on $\\mathbb N^\\times\\cup\\{\\infty\\}$, whose finite-point extremals generate type $\\mathrm{III}_1$ factors. Key computation: every KMS$_\\beta$ state factors through $C(X)$ with $X\\cong\\varprojlim_{a\\mid b}X_a$, $X_a=\\mathbb T\\times\\Delta_a$, and transition maps $f_{a,b}(z,d)=(z^{d/\\gcd(a,d)},\\gcd(a,d))$; the extremal $\\psi_{n,\\beta}$ further factors through equivariant $*$-homomorphisms $\\mathcal T(\\mathbb N^\\times\\ltimes\\mathbb Z)\\to\\mathcal T(\\mathbb N^\\times\\ltimes(\\mathbb Z/n\\mathbb Z))\\to C_{\\mathbb Q}$, where the intermediate quotient imposes $U^n=1$, producing the Dirac parameter $\\delta_n$ and its type $\\mathrm{III}_1$ GNS factor.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/65/slides.pdf","title":"Roberto Hern\\'andez Palomares (joint with Brent Nelson)","note":"Roberto Hern\\'andez Palomares (joint with Brent Nelson), irreducible $C^*$-discrete inclusions are precisely reduced crossed products by outer unitary tensor-category actions and therefore admit a categorical standard invariant. Key computation: for a faithful expectation $E:A\\subset B$, the canonical correspondence has $\\langle b_1\\mid b_2\\rangle_A=E(b_1^*b_2)$ and the algebraic discrete part decomposes as $B_\\diamond\\cong\\bigoplus_{K\\in\\operatorname{Irr}(\\operatorname{Bim}_{\\mathrm{fgp}}(A))}K\\otimes\\operatorname{Hom}_{A-A}(K,B\\Omega)$; the condition $\\overline{B_\\diamond}^{\\|\\cdot\\|_B}=B$ and $A'\\cap B=\\mathbb C$ is equivalent to data $F:\\mathcal C\\curvearrowright A$, $\\mathbf B\\in C^*\\!\\operatorname{Alg}(\\mathcal C)$ with $A\\subset B\\cong A\\subset A\\rtimes_{F,r}\\mathbf B$, as illustrated by $\\mathcal O_n\\cong\\operatorname{UHF}_{n^\\infty}\\rtimes_{F_1,r}\\mathbb C[\\mathbb Z]$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/65/22/slides.pdf","title":"Marie-France Vign\\'eras (joint with Guy Henniart)","note":"Marie-France Vign\\'eras (joint with Guy Henniart), an admissible representation of $\\operatorname{GL}_n(D)$ is, near the identity, an integral combination of parabolically induced trivial representations, making the growth of Moy--Prasad invariants polynomial and identifying its Gelfand--Kirillov dimension. Key computation: for $\\operatorname{char}C\\ne p$, $\\pi\\sim\\sum_{\\lambda\\vdash n}c_\\lambda(\\pi)\\operatorname{ind}_{P_\\lambda}^{G}\\mathbf1$ on a sufficiently small open subgroup; nilpotent orbits correspond to partitions with $\\dim_F\\mathcal O_\\lambda=2d^2\\sum_{i<j}\\lambda_i\\lambda_j$, and hence $\\dim_CV^{G_{x,r+i/d}}=Q_{\\pi,x,r}(p^i)$ where $Q_{\\pi,x,r}(X)=\\sum_{\\lambda\\vdash n}c_\\lambda(\\pi)|P_\\lambda\\backslash G/G_{x,r}|X^{fd\\,d(\\lambda)}$, yielding $\\dim_{\\mathrm{GK}}\\pi=fd\\max\\{d(\\lambda):c_\\lambda(\\pi)\\ne0\\}$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/32/slides.pdf","title":"Zhizhang Xie (joint work with Jinmin Wang and Guoliang Yu)","note":"Zhizhang Xie (joint work with Jinmin Wang and Guoliang Yu), a Fredholm index theorem for a twisted Dirac operator on a polyhedron proves Gromov's flat-corner domination theorem and hence Stoker's conjecture in every dimension. Key computation: for the boundary condition induced by $(\\omega\\otimes\\omega)(c(e_n)\\otimes c(e_n))$ and $0<\\theta_{ij}(g)\\le\\theta_{ij}(g_0)<\\pi$, the operator $D_B$ is essentially self-adjoint Fredholm with $\\operatorname{Ind}(D_B)=\\chi(P)=1$; locally the link operator has spectrum $\\{-\\tfrac12+k\\pi/\\alpha:k\\in\\mathbb Z\\}$ and $|P_B|\\ge\\tfrac12$, while the integrated estimate $0=\\int_P|D\\phi|^2\\ge\\int_P|\\nabla\\phi|^2+\\int_P\\tfrac{\\operatorname{Sc}_g}{4}|\\phi|^2+\\sum_i\\int_{F_i}\\tfrac{H_g}{2}|\\phi|^2+\\tfrac12\\sum_{i,j}\\int_{F_i\\cap F_j}(\\theta_{ij}(g_0)-\\theta_{ij}(g))|\\phi|^2$ forces flatness and equality of face and dihedral data.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/41/slides.pdf","title":"Damien Tageddine","note":"Damien Tageddine, matrix spectral triples attached to finer triangulations converge to the classical Dirac and Laplace operators on a compact Riemannian manifold. Key computation: the inductive-limit algebra satisfies $\\varprojlim\\operatorname{Spec}(A_i)\\simeq\\operatorname{Spec}(\\varinjlim A_i)$ and $Z(A_\\infty)\\simeq C(M)$, while for the lattice Dirac operator $D_n=\\sum_{k=1}^d1\\otimes\\cdots\\otimes D_n^{(k)}\\otimes\\cdots\\otimes1$ one has $\\sigma_{A_\\infty}([D_\\infty,a])=\\bigcup_i\\sigma_{A_i}([D_i,a_i])$ and $\\|[D_\\infty,a]\\|=\\|d_ca\\|_\\infty$; with sampled points and $\\hbar_n=n^{-\\alpha}$, the explicit averages $\\widehat S_{n\\hbar_n}(a)=n^{-1}\\sum_{k=1}^n e_k[D_{X_k},a_k]e_k^*$ and $\\Omega_{\\hbar_n}^n(a)$ converge in probability to $[D,a]$ and $\\Delta_Ma$, respectively.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/44/slides.pdf","title":"Judith Packer (joint work with Carla Farsi","note":"Judith Packer (joint work with Carla Farsi, Therese-Marie Landry, Nadia Larsen, and Fr\\'ed\\'eric Latr\\'emoli\\`ere), spectral triples on noncommutative solenoids arise as inductive limits of rotation-algebra triples and converge in spectral propinquity. Key computation: for $\\Gamma=\\mathbb Z[1/p]^2$, the proper bounded-doubling length $L_p(r_1,r_2)=\\max\\{\\|(r_1,r_2)\\|_2,p^{\\operatorname{scale}(r_1,r_2)}\\}$ defines the metric triple $(C^*(\\Gamma,\\sigma_\\theta),\\ell^2(\\Gamma),D_{L_p})$; moreover $A_\\theta\\cong\\varinjlim(A_{\\theta_{2n}},\\varphi_n)$ with $\\varphi_n(U_{2n})=U_{2n+2}^p$ and $\\varphi_n(V_{2n})=V_{2n+2}^p$, and for $D=M_{L_H}\\otimes\\gamma_1+M_F\\otimes\\gamma_2$ the finite-stage triples satisfy $\\lim_{n\\to\\infty}\\Lambda^{\\mathrm{spec}}((C^*(\\Gamma_n,\\sigma),\\ell^2(\\Gamma_n)\\otimes\\mathbb C^2,D_n),(C^*(\\Gamma,\\sigma),\\ell^2(\\Gamma)\\otimes\\mathbb C^2,D))=0$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/45/slides.pdf","title":"Piotr M","note":"Piotr M. Hajac (joint work with Mariusz Tobolski), suitable graph and path homomorphisms make Leavitt path algebras contravariant and graph $C^*$-algebras covariant, yielding pushout-to-pullback theorems for quantum spaces. Key computation: for a proper target-bijective graph map $f:E\\to F$, the induced map $\\bar f^*:L_k(F)\\to L_k(E)$ is explicitly $[\\chi_p]\\mapsto\\sum_{q\\in\\bar f^{-1}(p)}[\\chi_q]$, defining a contravariant functor; dually, for a path homomorphism satisfying the three regular-monomorphism conditions, $f_*:C^*(E)\\to C^*(F)$ is $[\\chi_p]\\mapsto[\\chi_{\\bar f(p)}]$, defining a covariant $*$-functor and specializing to the stated pullback constructions for graph models of the equatorial Podle\\'s quantum sphere and quantum $\\mathbb{CP}^1$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/80/13/slides.pdf","title":"Alfons Van Daele","note":"Alfons Van Daele, a locally compact quantum group defined by central Haar weights on a $C^*$-algebra canonically yields a faithful von Neumann algebraic locally compact quantum group. Key computation: a lower-semicontinuous semifinite weight extends by $\\widetilde\\varphi(x)=\\sup_{\\omega\\le\\varphi}\\omega(x)$ to a normal weight on $A^{**}$, and Haar invariance $\\varphi((\\omega\\otimes\\iota)\\Delta(a))=\\omega(1)\\varphi(a)$ implies that the support projections $e$ and $f$ of the extended left and right weights satisfy $\\widetilde\\Delta(1-e)(1\\otimes(1-e))=0$, hence $f(1-e)=e(1-f)=0$ and $e=f$; cutting down to $M=A^{**}e$ gives $\\Delta_0(x)=\\widetilde\\Delta(x)(e\\otimes e)$ with faithful invariant restrictions $\\varphi_0,\\psi_0$, so $(M,\\Delta_0)$ is the associated von Neumann algebraic quantum group.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/69/88/slides.pdf","title":"Stevo Todorcevic","note":"Stevo Todorcevic, the Ne\\v{s}et\\v{r}il--R\\'odl ordered expansion canonizes finite-arity relations on the random graph and identifies the universal minimal flow of its automorphism group. Key computation: for a finite graph $A$ on $\\{0,\\ldots,k-1\\}$, $C_A=\\operatorname{Emb}(A,R)=\\{\\bar x\\in\\mathbb N^{(k)}:(i,j)\\in E_A\\Longleftrightarrow(x_i,x_j)\\in R\\}$ splits under a homogeneous order $<^*$ into $C_A^\\sigma=\\{\\bar x\\in C_A:x_{\\sigma(0)}<^*\\cdots<^*x_{\\sigma(k-1)}\\}$; every $S\\subseteq\\mathbb N^{(k)}$ is constant on each $C_A^\\sigma$ after restriction to an arbitrarily large finite induced subgraph, all $k!$ classes remain essential, and this Ramsey-plus-ordering computation makes the natural action $\\operatorname{Aut}(R)\\curvearrowright\\operatorname{LO}(\\mathbb N)$ minimal and universal.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/41/70/slides.pdf","title":"Morris Ang","note":"Morris Ang, Gaussian multiplicative chaos constructs Liouville quantum gravity surfaces and the DOZZ three-point function computes the universal critical-percolation three-point connectivity constant. Key computation: for $0<\\gamma<2$, $A_h^\\gamma(dz)=\\lim_{\\varepsilon\\to0}\\varepsilon^{\\gamma^2/2}e^{\\gamma h_\\varepsilon(z)}dz$ obeys $A_{h+f}^\\gamma=e^{\\gamma f}A_h^\\gamma$ and $f_*A_h^\\gamma=A_{\\widetilde h}^\\gamma$ under $h=\\widetilde h\\circ f+(2/\\gamma+\\gamma/2)\\log|f'|$; the resulting DOZZ correlation proves the Delfino--Viti formula $P_3(z_1,z_2,z_3)/\\sqrt{P_2(z_1,z_2)P_2(z_2,z_3)P_2(z_3,z_1)}=\\bigl[C_{\\sqrt{8/3}}^{\\mathrm{DOZZ}}(7\\sqrt6/12,7\\sqrt6/12,7\\sqrt6/12)\\bigr]^{-1}\\times(\\text{explicit Gamma factors})\\approx1.022$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/2/49/31/slides.pdf","title":"Liat Kessler (joint work with Pranav Chakravarthy","note":"Liat Kessler (joint work with Pranav Chakravarthy, River Chiang, and Martin Pinsonnault), equivariant symplectic blowups of a Hamiltonian circle four-manifold at a fixed component are connected from deformation to isotopy using decorated-graph classification and inflation. Key computation: an embedded $J$-holomorphic surface $Z$ produces $J$-taming forms in the classes $[\\omega_t]=[\\omega]+t\\lambda\\operatorname{PD}[Z]$ for $0\\le\\lambda<T$, where $T=\\infty$ if $Z\\cdot Z\\ge0$ and $T=\\omega(Z)/(-Z\\cdot Z)$ otherwise; applying this family inflation to two $S^1$-equivariant blowups of equal size, whose Karshon decorated graphs coincide, changes the invariant deformation to a cohomologous path, and equivariant Moser then writes $\\omega_t=\\phi_t^*\\omega_0$, giving equivariant isotopy.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/23/15/slides.pdf","title":"Zhi L\\'u (joint work with Wei Wang)","note":"Zhi L\\'u (joint work with Wei Wang), equivariant cohomology Chern numbers form a complete system of invariants for unitary $T^k$-bordism, and mixed equivariant characteristic numbers separate equivariant Hamiltonian bordism. Key computation: the universal toric genus $\\Phi:\\Omega_*^{U,T^k}\\to MU^*(BT^k)$ is tested by the Kronecker pairing $\\langle\\Phi([M]_{T^k}),[f:N\\to BT^k]\\rangle=[\\widetilde f^*(ET^k\\times_{T^k}M)]\\in MU_*=\\Omega_*^U$; the stable tangent splitting $T\\widetilde f^*(ET^k\\times_{T^k}M)\\cong\\pi'^*TN\\oplus\\widetilde f^*(ET^k\\times_{T^k}TM)$ expresses every Chern number through equivariant Chern numbers of $M$, so their vanishing kills every pairing, gives $\\Phi([M]_{T^k})=0$, and injectivity of $\\Phi$ yields $[M]_{T^k}=0$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/69/90/slides.pdf","title":"Stevo Todorcevic","note":"Stevo Todorcevic, analytic $n^*$-gaps have a finite basis of minimal equivalence types, obtained by canonizing their tree presentations. Key computation: for gaps $\\Gamma$ on $N$ and $\\Delta$ on $M$, $\\Gamma\\le\\Delta$ is witnessed by an injection $\\phi:N\\to M$ carrying $\\Gamma_i$ into $\\Delta_i$ and $\\Gamma_i^\\perp$ into $\\Delta_i^\\perp$; the tree partition theorem produces, from any non-separated analytic family $\\Gamma=\\{\\Gamma_i:i<n\\}$, a permutation $\\varepsilon:n\\to n$ and injection $u:n^{<\\omega}\\to N$ with $u[X]\\in\\Gamma_{\\varepsilon(i)}$ for every chain $X$ of type $[i]$, reducing every analytic gap to one of finitely many minimal types--exactly five for $n=2$ up to permutation--and yielding the sharp intersection numbers $J(1),\\ldots,J(7)=1,8,61,480,3881,31976,266981$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/34/25/slides.pdf","title":"Jeff Achter","note":"Jeff Achter, cyclic covers turn moduli of genus-$4$ curves, plane quartics, and five marked points on $\\mathbb P^1$ into arithmetic period maps to unitary Shimura varieties. Key computation: for a canonical genus-$4$ curve $C=Q\\cap S\\subset\\mathbb P^3$, the triple cover $v:Z\\to Q$ branched along $C$ is a K3 surface; the inverse images $N_i=v^{-1}(M_i)$ of the two rulings satisfy $(N_1,N_2)=3$, so $U(3)=\\mathbb ZN_1+\\mathbb ZN_2\\hookrightarrow\\operatorname{Pic}(Z)$ and the deck $\\mu_3$-action produces $(Z,\\alpha,\\rho)\\in\\mathcal R_{(L_4,\\chi_4)}$. Over $\\mathbb Z[\\zeta_3,1/6]$, $\\kappa_4:\\mathcal R_{(L_4,\\chi_4)}\\to\\mathcal N_4$ induces an isomorphism on coarse moduli spaces and $\\tau_4$ is an open immersion into $\\operatorname{Sh}(L_4,\\chi_4)$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/41/43/slides.pdf","title":"Yousheng Shi","note":"Yousheng Shi, derived intersections of Kudla--Rapoport divisors on ramified unitary Rapoport--Zink spaces equal a corrected derivative of local representation densities in ranks $n\\le3$. Key computation: blowing up the isolated singularities of $\\mathcal N_n^{\\mathrm{Pap}}$ gives the regular semistable Kr\\'amer model $\\mathcal N_n^{\\mathrm{Kra}}$, and for $L=\\langle x_1,\\ldots,x_n\\rangle$ the intersection is $\\operatorname{Int}(L)=\\chi(\\mathcal N_n,\\mathcal O_{\\mathcal Z(x_1)}\\otimes^{\\mathbf L}\\cdots\\otimes^{\\mathbf L}\\mathcal O_{\\mathcal Z(x_n)})$. Solving the triangular system $2\\alpha'(M_j,M)/\\alpha(M,M)+\\sum_{i=1}^{n-1}c_i\\alpha(M_j,M_i)=0$ produces the correction terms and the formula $\\operatorname{Int}(L)=2\\alpha'(L,M)/\\alpha(M,M)+\\sum_{i=1}^{n-1}c_i\\alpha(L,M_i)$; for $n=3$, the difference-cycle identity $\\mathbb L D^{\\mathrm{Kra}}(L)\\cdot\\mathcal Z^{\\mathrm{Kra}}(x)=\\beta(L\\oplus\\{x\\},M)(2)$ reduces the proof inductively to $n=2$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/30/69/slides.pdf","title":"Somnath Jha","note":"Somnath Jha, Pontryagin dual Selmer groups over noncommutative $p$-adic Lie extensions satisfy an algebraic functional equation, including the local Euler-factor error term. Key computation: twisting by a continuous character $\\theta:\\Gamma_{\\mathrm{cyc}}\\to\\mathbb Z_p^\\times$ makes the control maps $r_{U,A}^{\\theta}$ have finite kernels and cokernels; under the stated $\\mathfrak M_H(G)$ and Ext-vanishing hypotheses this yields $[S(A/K_\\infty)^\\vee]+[E_0^{A^*(1)}]=[S(A^*(1)/K_\\infty)^\\vee]$ in $K_0(\\mathfrak M_H(G))$. For the false-Tate extension and a squarefree-level ordinary newform of weight $k$ at the central twist, the correction is $[E_0^A]=[\\bigoplus_{q\\in P_1\\cup P_2}\\operatorname{Ind}_{G_q}^G T(-1)]$ and evaluates at an Artin representation $\\eta$ as $\\eta(\\xi_{E_0^A})=\\prod_{q\\in P_1\\cup P_2}P_q(f,\\eta,q^{-k/2})/P_q(f,\\eta^*,q^{-k/2})$ modulo $p$-adic units.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/26/64/slides.pdf","title":"Mahesh Kakde (joint with Samit Dasgupta)","note":"Mahesh Kakde (joint with Samit Dasgupta), the integral Gross--Stark theorem proves the strong Brumer conjecture and gives a $p$-adic class-field construction from Brumer--Stark units. Key computation: the Stickelberger element satisfies $\\chi(\\Theta_q^{H/F})=L_R(\\chi^{-1},0)(1-\\chi^{-1}(q)Nq)$ and $\\Theta_q^{H/F}\\in\\operatorname{Fitt}_{\\mathbb Z[G]}(\\operatorname{Cl}_q(H)^{\\vee,-})$; hence for a split prime $\\mathfrak p$ its class is principalized by the unique unit $u$ with $\\sum_{\\sigma\\in G}[\\sigma^{-1}]\\operatorname{ord}_{\\mathfrak P}(\\sigma u)=\\Theta_q^{H/F}$. For $S=\\{\\mathfrak p_i:\\chi(\\mathfrak p_i)=1\\}$, the proved Gross--Stark formula computes the leading term $L_p^{(r)}(\\chi\\omega,0)/(r!L(\\chi,0)\\prod_{\\chi(\\mathfrak p)\\ne1}(1-\\chi(\\mathfrak p)))=\\det(\\log_pN_{F_{\\mathfrak p_i}/\\mathbb Q_p}u_j)/\\det(\\operatorname{ord}_{\\mathfrak P_i}u_j)$, while in rank one $\\chi(\\Theta_q^{H_{\\mathrm{cyc}}/F})=\\sum_{\\sigma\\in G}\\chi(\\sigma^{-1})(\\operatorname{rec}(\\sigma u)-1)$ in $I/I^2$.","date":""},{"
