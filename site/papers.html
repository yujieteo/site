    <script type="application/json" data-entry-data>[{"tags":["stanford.edu"],"category":"stanford.edu","url":"https://math.stanford.edu/~vakil/greatwriting.html","title":"Ravi Vakil on Mathematical Writing","note":"Ravi Vakil on Mathematical Writing. Advice, reflections, and guidance on writing clearly and effectively in mathematics.","date":""},{"tags":["uchicago.edu"],"category":"uchicago.edu","url":"https://math.uchicago.edu/~emerton/gl2.pdf","title":"Adelic and Classical Modular Forms for GL(2)","note":"Adelic and Classical Modular Forms for GL(2). An exposition of the translation between classical modular forms and automorphic forms on the adelic group $\\mathrm{GL}_2(\\mathbb{A}_{\\mathbb{Q}})$. Provides a geometric interpretation of modular forms as sections of line bundles over modular curves, along with minimal ad hoc constructions of Eisenstein series. Details the Lie algebra $\\mathfrak{gl}_2(\\mathbb{R})$ with basis elements $Z, H, Y_+, Y_-$, where the center $\\mathcal{Z}(\\mathfrak{gl}_2)$ of the universal enveloping algebra is isomorphic to a polynomial ring in two generators. Explores the space of bases $B$ of $\\mathbb{C}$ as a real vector space, identifying it as an open subset of $\\mathbb{C}^2$ with commuting left and right actions by $\\mathrm{GL}_2(\\mathbb{R})$ and $\\mathrm{GL}_1(\\mathbb{C})$. The right action of $\\mathrm{GL}_2(\\mathbb{R})$ is complex analytic and gives an identification with the upper half-plane $\\mathcal{H}^{\\pm} \\times \\mathbb{C}^\\times$ via $(\\tau, z) \\mapsto \\left(\\frac{a\\tau+c}{b\\tau+d}, (b\\tau+d)z\\right)$. Examines the complexified Lie algebra tangent space decomposition into holomorphic and anti-holomorphic subspaces, the subspace $V_i \\subset \\mathfrak{gl}_2$, and the bijection $B/\\mathrm{GL}_2(\\mathbb{Z}) \\cong \\mathcal{L}$ with the moduli of discrete rank-2 lattices. Covers moderate growth conditions, smooth adelic automorphic forms, and representations invariant under right translation by $\\mathrm{GL}_2(\\mathbb{A}_f)$.","date":""},{"tags":["ias.edu"],"category":"ias.edu","url":"https://publications.ias.edu/sites/default/files/5_FormesModulaires.pdf","title":"Deligne on Modular Forms","note":"Deligne on Modular Forms. Foundational notes by Pierre Deligne on the algebraic and geometric theory of modular forms, referenced in Emerton's notes.","date":""},{"tags":["wordpress.com"],"category":"wordpress.com","url":"https://ayoucis.wordpress.com/2015/09/17/shimura-varieties-motivation/","title":"Alex Youcis","note":"Alex Youcis, Motivation behind Shimura Varieties. This will be the first in a series of posts discussing Shimura varieties. In particular, we will focus here on a sort of broad motivation for the subject—why Shimura varieties are a natural thing to study and, in particular, what they give us.","date":""},{"tags":["intlpress.com"],"category":"intlpress.com","url":"https://www.intlpress.com/site/pub/files/_fulltext/journals/cdm/1997/1997/0001/CDM-1997-1997-0001-a001.pdf","title":"Algebraic Geometry and Arithmetic Duality","note":"Algebraic Geometry and Arithmetic Duality. Connects the eigenvalues of the Frobenius action on étale cohomology $H_{\\text{ét}}^*(X, \\mathbb{Q}_\\ell)$ to the zeros and poles of zeta functions, completing the arithmetic dictionary via the adèle class space.","date":""},{"tags":["cnrs.fr"],"category":"cnrs.fr","url":"https://indico.math.cnrs.fr/event/10843/contributions/12868/","title":"Class Field Theory and Noncommutative Geometry","note":"Class Field Theory and Noncommutative Geometry. An exposition by Alain Connes on class field theory through the lens of the adèle class space $X_{\\mathbb{Q}} = \\mathbb{Q}^\\times \\backslash \\mathbb{A}_{\\mathbb{Q}}$. Abelian extensions of a number field $K$ are encoded internally by its idele class group $C_K = \\mathbb{A}_K^\\times / K^\\times$, acting as a Galois group of the maximal abelian extension via Artin reciprocity. Galois actions on roots are realized through group actions on spaces. The quotient space $X_K = K^\\times \\backslash \\mathbb{A}_K$ is ergodic with respect to the Haar measure, serving as a prototype noncommutative space (leaf space of a foliation). Translates local-to-global class field theory via the inclusion of local isotropy groups $K_v^\\times \\hookrightarrow C_K$. Connects the Riemann–Weil explicit formulas $\\sum_v \\int f(u)/|1-u|\\,d^*u$ to a trace formula for the scaling operator on the adèle class space. Introduces the scaling site $X_{\\mathbb{Q}} = \\mathbb{Q}^\\times \\backslash \\mathbb{A}_{\\mathbb{Q}} / \\widehat{\\mathbb{Z}}^\\times$, modeled as a noncommutative space of rank-1 subgroups of $\\mathbb{R}$, where periodic orbits of length $\\log p$ correspond to prime numbers $p$, realizing the Frobenius endomorphism as a mapping torus. Relates this construction to Grothendieck's étale fundamental group $\\pi_1^{\\text{ét}}$ and the 3D topology of $\\operatorname{Spec} \\mathbb{Z}$.","date":""},{"tags":["berkeley.edu"],"category":"berkeley.edu","url":"https://math.berkeley.edu/~scanlon/papers/O-min-midrasha.pdf","title":"Overview of O-Minimality","note":"Overview of O-Minimality. Scanlon's survey on o-minimal structures, tame topology, and their applications in model theory and arithmetic geometry.","date":""},{"tags":["stackexchange.com"],"category":"stackexchange.com","url":"https://math.stackexchange.com/questions/1897078/maximal-abelian-extension-unramified-outside-a-set-of-primes","title":"Maximal Abelian Extensions Unramified Outside S","note":"Maximal Abelian Extensions Unramified Outside S. Discussion and computation of the maximal abelian extension $K_S^{\\text{ab}}$ of a number field $K$ unramified outside a finite set of places $S$. For a singleton prime $S = \\{p\\}$, $K_S^{\\text{ab}}$ is given by the direct limit of ray class fields modulo $\\mathfrak{p}^n \\mathcal{O}_K$. Explains ramification at infinite places and the Galois group $G_S(K)^{\\text{ab}} = G_S(K) / \\overline{[G_S(K), G_S(K)]}$. Details the connection to class field theory, Poitou–Tate duality, and the Kronecker–Weber theorem for $K = \\mathbb{Q}$.","date":""},{"tags":["kskedlaya.org"],"category":"kskedlaya.org","url":"https://kskedlaya.org/18.786/ps10.pdf","title":"Direct Proof of the Kronecker-Weber Theorem","note":"Direct Proof of the Kronecker-Weber Theorem. Lemmermeyer's direct proof showing that every finite abelian extension of $\\mathbb{Q}$ is contained in a cyclotomic field $\\mathbb{Q}(\\zeta_m)$.","date":""},{"tags":["arxiv.org"],"category":"arxiv.org","url":"https://arxiv.org/pdf/1211.3256","title":"Ergodicity of Global Fields on Adeles","note":"Ergodicity of Global Fields on Adeles. Rigorous proof of the ergodicity of the action of $K^\\times$ on the adèle ring $\\mathbb{A}_K$ for global fields in both the number field and function field settings.","date":""},{"tags":["uchicago.edu"],"category":"uchicago.edu","url":"https://www.math.uchicago.edu/~emerton/pdffiles/reciprocity.pdf","title":"Perspectives on Reciprocity Laws","note":"Perspectives on Reciprocity Laws. Emerton's survey on reciprocity from Gauss's quadratic reciprocity to Langlands functoriality. Compares Dirichlet's analytic class number formula for $L(1, \\chi)$ (automorphic side) with Dedekind's class number formula (motivic side) and discusses the Sato–Tate conjecture.","date":""},{"tags":["arxiv.org"],"category":"arxiv.org","url":"https://arxiv.org/pdf/2210.01404","title":"Categorical p-Adic Langlands Correspondence","note":"Categorical p-Adic Langlands Correspondence. Comprehensive 252-page treatise by Emerton and Helm formulating the categorical $p$-adic Langlands program in both Banach and rigid analytic settings.","date":""},{"tags":["stanford.edu"],"category":"stanford.edu","url":"https://math.stanford.edu/~conrad/papers/luminysga3.pdf","title":"Reductive Group Schemes after SGA3","note":"Reductive Group Schemes after SGA3. Brian Conrad's foundational notes on the theory and classification of reductive group schemes over general bases.","date":""},{"tags":["uchicago.edu"],"category":"uchicago.edu","url":"https://math.uchicago.edu/~emerton/research.html","title":"Research Remarks by Matthew Emerton","note":"Research Remarks by Matthew Emerton. Collection of notes, papers, and essays by Matthew Emerton on automorphic forms, Galois representations, and the Langlands program.","date":""},{"tags":["mathoverflow.net"],"category":"mathoverflow.net","url":"https://mathoverflow.net/questions/37021/is-fourier-analysis-a-special-case-of-representation-theory-or-an-analogue/37189#37189","title":"Fourier Analysis vs Representation Theory","note":"Fourier Analysis vs Representation Theory. Discussion on the relationship between harmonic analysis and group representations. Highlights the Peter–Weyl theorem for compact groups $G$, decomposing $L^2(G) \\cong \\widehat{\\bigoplus}_{\\pi} V_\\pi \\otimes V_\\pi^*$, and the Plancherel decomposition for non-compact type I groups via Harish-Chandra's work.","date":""},{"tags":["stackexchange.com"],"category":"stackexchange.com","url":"https://math.stackexchange.com/questions/58515/what-is-fourier-analysis-on-groups-and-does-it-have-applications-to-physics/58591#58591","title":"Harmonic Analysis and Physics","note":"Harmonic Analysis and Physics. Survey of Plancherel decompositions on reductive Lie groups and Bargmann's classification of irreducible unitary representations of $\\mathrm{SL}_2(\\mathbb{R})$ with physical applications.","date":""},{"tags":["mathoverflow.net"],"category":"mathoverflow.net","url":"https://mathoverflow.net/questions/14849/what-would-a-moral-proof-of-the-weil-conjectures-require/14852#14852","title":"Conceptual Meaning of the Weil Conjectures","note":"Conceptual Meaning of the Weil Conjectures. Discussion on the philosophical and geometric requirements for proving the Weil conjectures via Weil cohomology theories, standard conjectures, and motives.","date":""},{"tags":["mathoverflow.net"],"category":"mathoverflow.net","url":"https://mathoverflow.net/questions/10201/a-problem-of-shimura-and-its-relation-to-class-field-theory/10217#10217","title":"Shimura's Problem and Class Field Theory","note":"Shimura's Problem and Class Field Theory. Explores the connection between polynomial splitting fields, ray class groups, and complex multiplication. Example: splitting of polynomials generating abelian extensions inside cyclotomic fields like $\\mathbb{Q}(\\zeta_7)$.","date":""},{"tags":["mathoverflow.net"],"category":"mathoverflow.net","url":"https://mathoverflow.net/questions/62155/how-to-find-the-varieties-whose-cohomology-realizes-certain-representations/62211#62211","title":"Geometric Realization of Galois Representations","note":"Geometric Realization of Galois Representations. Realizing 2-dimensional Galois representations attached to modular forms inside the étale cohomology $H^1_{\\text{ét}}(X_0(N)_{\\overline{\\mathbb{Q}}}, \\mathbb{Q}_\\ell)$ of modular curves, leading to Shimura varieties.","date":""},{"tags":["stonybrook.edu"],"category":"stonybrook.edu","url":"https://www.math.stonybrook.edu/~mmovshev/MAT570Spring2008/BOOKS/atiyahbott_moment.pdf","title":"The Moment Map and Equivariant Cohomology","note":"The Moment Map and Equivariant Cohomology. Atiyah and Bott's foundational paper on the de Rham localization theorem in equivariant cohomology $H_G^*(M)$. Links Hamiltonian group actions, moment maps $\\mu: M \\to \\mathfrak{g}^*$, symplectic reduction, and the Duistermaat–Heckman exact stationary phase formula. Connects equivariant localization to moduli spaces of bundles on Riemann surfaces and Yang–Mills theory.","date":""},{"tags":["uchicago.edu"],"category":"uchicago.edu","url":"https://math.uchicago.edu/~may/REU2019/REUPapers/Lee%2CJaeHee.pdf","title":"Atiyah-Bott Localization in Geometry","note":"Atiyah-Bott Localization in Geometry. Jae Hee Lee's expository REU paper detailing the Atiyah–Bott localization theorem, equivariant characteristic classes, and topological invariants of quotient manifolds.","date":""},{"tags":["bogomolov-lab.ru"],"category":"bogomolov-lab.ru","url":"http://bogomolov-lab.ru/G-sem/AJM-3-1-001-016.pdf","title":"Moment Maps and Diffeomorphisms in Gauge Theory","note":"Moment Maps and Diffeomorphisms in Gauge Theory. Donaldson's paper interpreting the curvature of a connection on a surface principal bundle as a moment map for the gauge group action, applied to Yang–Mills equations.","date":""},{"tags":["uchicago.edu"],"category":"uchicago.edu","url":"https://math.uchicago.edu/~shmuel/AAT-readings/Combinatorial%20Geometry%2C%20Concentration%2C%20Real%20Algebraic%20Geometry/ball.pdf","title":"Convex Body Geometry by Keith Ball","note":"Convex Body Geometry by Keith Ball. Comprehensive introduction to convex geometry, volume computation of Euclidean balls, the Hahn–Banach separation theorem, and extremal properties of polytopes and cubes.","date":""},{"tags":["arxiv.org"],"category":"arxiv.org","url":"https://arxiv.org/pdf/2307.15106","title":"Non-Perturbative BV Theory via Derived Geometry","note":"Non-Perturbative BV Theory via Derived Geometry. Formulating non-perturbative Batalin–Vilkovisky (BV) quantization within derived differential geometry and shifted symplectic structures.","date":""},{"tags":["mcgill.ca"],"category":"mcgill.ca","url":"https://www.math.mcgill.ca/barr/papers/gk.pdf","title":"Grothendieck's Tohoku Paper","note":"Grothendieck's Tohoku Paper. Michael Barr's commentary on Grothendieck's landmark 1957 paper introducing abelian categories, derived functors $R^i F$, injective resolutions, sheaf cohomology, and the Grothendieck spectral sequence. Establishes the foundations for Serre duality and Ext functors of sheaves.","date":""},{"tags":["wstein.org"],"category":"wstein.org","url":"https://wstein.org/edu/Fall2003/252/references/ribet-stein-serre/ribet-stein.pdf","title":"Lectures on Serre's Modular Invariance Conjectures","note":"Lectures on Serre's Modular Invariance Conjectures. Ribet and Stein's exposition on Serre's modularity conjecture linking odd, irreducible Galois representations $\\rho: \\operatorname{Gal}(\\overline{\\mathbb{Q}}/\\mathbb{Q}) \\to \\mathrm{GL}_2(\\mathbb{F}_p)$ to modular forms of specific weight and level.","date":""},{"tags":["mathoverflow.net"],"category":"mathoverflow.net","url":"https://mathoverflow.net/questions/1151/sheaf-cohomology-and-injective-resolutions","title":"Injective Resolutions in Sheaf Cohomology","note":"Injective Resolutions in Sheaf Cohomology. Comparison between computing sheaf cohomology using acyclic resolutions (e.g., flasque, soft, fine, or Čech on affine covers) and universal injective resolutions.","date":""},{"tags":["numdam.org"],"category":"numdam.org","url":"https://www.numdam.org/item/10.1007/BF02684688.pdf","title":"Nilpotent Connections and Picard-Fuchs Equations","note":"Nilpotent Connections and Picard-Fuchs Equations. Nick Katz's classic paper on regular singular differential equations, Gauss–Manin connections, and $p$-adic nilpotence.","date":""},{"tags":["impan.pl"],"category":"impan.pl","url":"https://achinger.impan.pl/fac/fac.pdf","title":"Serre's Faisceaux Algébriques Cohérents (FAC)","note":"Serre's Faisceaux Algébriques Cohérents (FAC). Annotated translation of Serre's 1955 paper developing coherent sheaves $\\mathcal{O}_X$-modules and Čech cohomology on algebraic varieties under the Zariski topology.","date":""},{"tags":["numdam.org"],"category":"numdam.org","url":"https://www.numdam.org/item/CM_1974__28_3_287_0.pdf","title":"Transversality of a General Translate","note":"Transversality of a General Translate. Kleiman's 12-page paper on the transversality of general translates in Schubert calculus and enumerative geometry over algebraically closed fields in characteristic zero.","date":""},{"tags":["princeton.edu"],"category":"princeton.edu","url":"https://web.math.princeton.edu/~seri/papers/gowers-Aug4-2006.pdf","title":"Introduction to Nonlinear PDEs","note":"Introduction to Nonlinear PDEs. Sergiu Klainerman's comprehensive 72-page introduction to modern nonlinear wave equations and evolutionary PDEs.","date":""},{"tags":["stonybrook.edu"],"category":"stonybrook.edu","url":"https://www.math.stonybrook.edu/robert.lazarsfeld/Reprints/Lazarsfeld.BNP.pdf","title":"Brill-Noether Theory on K3 Surfaces","note":"Brill-Noether Theory on K3 Surfaces. Robert Lazarsfeld's 10-page proof of the Brill–Noether theorem and Gieseker's theorem using vector bundles on $K3$ surfaces with $\\operatorname{Pic}(X) \\cong \\mathbb{Z}$.","date":""},{"tags":["brown.edu"],"category":"brown.edu","url":"https://www.dam.brown.edu/people/mumford/alg_geom/papers/1983b--EnumGeomModuli-NC.pdf","title":"Enumerative Geometry of Moduli Spaces of Curves","note":"Enumerative Geometry of Moduli Spaces of Curves. David Mumford's 58-page paper constructing the Chow ring $A^*(\\overline{\\mathcal{M}}_g)$ of the moduli space of stable curves, defining tautological classes $\\kappa_i, \\psi_i, \\lambda_i$, and applying Grothendieck–Riemann–Roch.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://thomaskwaring.github.io/gaga.pdf","title":"Serre's GAGA Translation","note":"Serre's GAGA Translation. English translation of Serre's 1956 paper Géométrie Algébrique et Géométrie Analytique establishing the equivalence between algebraic coherent sheaves and analytic coherent sheaves on projective complex varieties.","date":""},{"tags":["ucla.edu"],"category":"ucla.edu","url":"https://www.math.ucla.edu/~tao/247a.1.06f/","title":"Terence Tao's Harmonic Analysis Notes","note":"Terence Tao's Harmonic Analysis Notes. Course materials covering Calderón–Zygmund theory, interpolation, singular integrals, and oscillatory integrals.","date":""},{"tags":["ucla.edu"],"category":"ucla.edu","url":"https://www.math.ucla.edu/~tao/247a.1.06f/notes1.pdf","title":"Calderon-Zygmund-Stein Theory","note":"Calderon-Zygmund-Stein Theory. Tao's notes on classical Calderón–Zygmund t d for Tate's Thesis","note":"Number Theoretic Background for Tate's Thesis. Claus Sorensen's notes on local fields, Haar measures, and Tate's Fourier-analytic reformulation of zeta functions.","date":""},{"tags":["projecteuclid.org"],"category":"projecteuclid.org","url":"https://projecteuclid.org/journals/journal-of-differential-geometry/volume-17/issue-4/Supersymmetry-and-Morse-theory/10.4310/jdg/1214437492.pdf","title":"Supersymmetry and Morse Theory","note":"Supersymmetry and Morse Theory. Edward Witten's paper deriving the Morse inequalities through perturbations $d_t = e^{-th} d e^{th}$ of the de Rham complex and supersymmetric quantum mechanics.","date":""},{"tags":["edu.cn"],"category":"edu.cn","url":"https://archive.ymsc.tsinghua.edu.cn/pacm_download/355/9118-bogomolov.pdf","title":"Equidistribution and the Bogomolov Conjecture","note":"Equidistribution and the Bogomolov Conjecture. Shou-Wu Zhang's paper proving the Bogomolov conjecture for curves via arithmetic intersection theory and Arakelov heights.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://webhomes.maths.ed.ac.uk/~v1ranick/papers/milnstas.pdf","title":"Characteristic Classes by Milnor and Stasheff","note":"Characteristic Classes by Milnor and Stasheff. Classic textbook on vector bundles, Stiefel–Whitney classes, Chern classes, Pontryagin classes, and the Euler class.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://webhomes.maths.ed.ac.uk/~v1ranick/papers/milnmors.pdf","title":"Morse Theory by John Milnor","note":"Morse Theory by John Milnor. Classic text on critical point theory, handlebody attachments, and the topology of smooth manifolds.","date":""},{"tags":["eiu.edu"],"category":"eiu.edu","url":"https://www.ux1.eiu.edu/~cidelman/Classes/4855%20and%205220/Supplementary%20Texts/MilnorTopDiffVpt.pdf","title":"Topology from the Differentiable Viewpoint","note":"Topology from the Differentiable Viewpoint. Milnor's text covering smooth maps, regular values, Sard's theorem, Brouwer degree, and the Hopf degree theorem.","date":""},{"tags":["purdue.edu"],"category":"purdue.edu","url":"https://www.math.purdue.edu/~jlipman/MA598/Serre-Course%20in%20Arithmetic.pdf","title":"Serre's A Course in Arithmetic","note":"Serre's A Course in Arithmetic. Classic introduction to finite fields, $p$-adic fields, quadratic forms, the Hasse–Minkowski theorem, Dirichlet $L$-series, and modular forms for $\\mathrm{SL}_2(\\mathbb{Z})$.","date":""},{"tags":["ac.nz"],"category":"ac.nz","url":"https://www.math.auckland.ac.nz/~hekmati/Books/BottTu.pdf","title":"Differential Forms in Algebraic Topology","note":"Differential Forms in Algebraic Topology. Bott and Tu's book covering de Rham cohomology, Mayer–Vietoris sequences, Poincaré duality, the Thom isomorphism, and spectral sequences.","date":""},{"tags":["squarespace.com"],"category":"squarespace.com","url":"https://static1.squarespace.com/static/57bf2a6de3df281593b7f57d/t/600db4f1676f6519410f71e9/1611511026377/serre_1972_translation.pdf","title":"Galois Representations of Elliptic Curves","note":"Galois Representations of Elliptic Curves. English translation of Serre's 1972 paper on the open image theorem for $\\ell$-adic representations $\\operatorname{Gal}(\\overline{\\mathbb{Q}}/\\mathbb{Q}) \\to \\mathrm{GL}_2(\\mathbb{Z}_\\ell)$ of non-CM elliptic curves.","date":""},{"tags":["college-de-france.fr"],"category":"college-de-france.fr","url":"https://www.college-de-france.fr/media/jean-pierre-serre/UPL9140953003901187132_14___Lectures_on_N_X.pdf","title":"Lectures on N(X)","note":"Lectures on N(X). Serre's lectures on counting rational points on algebraic varieties over finite fields, exponential sums, and Chebyshev-type bounds.","date":""},{"tags":["arxiv.org"],"category":"arxiv.org","url":"https://arxiv.org/pdf/2510.26269","title":"The Six-Functor Formalism on Infinity-Categories","note":"The Six-Functor Formalism on Infinity-Categories. Scholze's paper establishing the six-functor formalism as a lax symmetric monoidal functor from a category of correspondences $\\operatorname{Corr}(\\mathcal{C}, E)$ to $\\operatorname{Cat}_\\infty$. Formulates pushforward $f_*$, proper pushforward $f_!$, pullback $f^*$, exceptional pullback $f^!$, tensor product $\\otimes$, and internal $\\operatorname{\\mathcal{R}Hom}$. Deduces proper base change and the projection formula $f_!(A \\otimes f^*B) \\cong f_!(A) \\otimes B$ using Lurie's straightening/unstraightening for Cartesian fibrations over $\\operatorname{Fin}_*$. Discusses cohomological smoothness, local Verdier duality, and base change for rigid-analytic and perfectoid spaces.","date":""},{"tags":["arxiv.org"],"category":"arxiv.org","url":"https://arxiv.org/pdf/2105.13028","title":"De Rham Cohomology on the Fargues-Fontaine Curve","note":"De Rham Cohomology on the Fargues-Fontaine Curve. Studies the de Rham period map and vector bundles on the Fargues–Fontaine curve in $p$-adic Hodge theory.","date":""},{"tags":["nieuwarchief.nl"],"category":"nieuwarchief.nl","url":"https://www.nieuwarchief.nl/serie5/pdf/naw5-2010-11-4-250.pdf","title":"Interview with Alain Connes","note":"Interview with Alain Connes. Reflections on noncommutative geometry, quantum mechanics, and mathematical research philosophy.","date":""},{"tags":["free.fr"],"category":"free.fr","url":"http://denise.vella.chemla.free.fr/interview-EMS-2008.pdf","title":"Connes EMS Interview","note":"Connes EMS Interview. Discussion of noncommutative geometry, the Riemann hypothesis, the Triangle of Thoughts, and the culture of contemporary mathematics.","date":""},{"tags":["kssarkaria.org"],"category":"kssarkaria.org","url":"https://kssarkaria.org/Quotations%20Sources/ConnesInteng.pdf","title":"Connes on Mathematical Discovery","note":"Connes on Mathematical Discovery. Alain Connes on the importance of grounding concepts in computation, exploring non-invariant structures, and organizing mathematical ideas conceptually.","date":""},{"tags":["denisevellachemla.eu"],"ca tion theory in Floer homology.","date":""},{"tags":["illinois.edu"],"category":"illinois.edu","url":"https://jpascale.web.illinois.edu/lecture2.pdf","title":"Fukaya Categories: Lecture 2","note":"Fukaya Categories: Lecture 2. Moduli spaces of pseudo-holomorphic discs, Gromov compactness, and the definition of Floer cohomology.","date":""},{"tags":["illinois.edu"],"category":"illinois.edu","url":"https://jpascale.web.illinois.edu/lecture3.pdf","title":"Fukaya Categories: Lecture 3","note":"Fukaya Categories: Lecture 3. Construction of the $A_\\infty$-algebra structure on Lagrangian Floer complexes and higher composition operations $m_k$.","date":""},{"tags":["illinois.edu"],"category":"illinois.edu","url":"https://jpascale.web.illinois.edu/courses/2018/595/","title":"Homological Mirror Symmetry Course","note":"Homological Mirror Symmetry Course. Introduction to Kontsevich's Homological Mirror Symmetry conjecture relating $D^b \\operatorname{Coh}(X)$ and the Fukaya category $\\operatorname{Fuk}(X^\\vee)$.","date":""},{"tags":["arxiv.org"],"category":"arxiv.org","url":"https://arxiv.org/pdf/math/9910179","title":"Introduction to A-Infinity Algebras","note":"Introduction to A-Infinity Algebras. Bernhard Keller's 30-page introduction to $A_\\infty$-algebras, $A_\\infty$-categories, modules, and their derived categories.","date":""},{"tags":["categorified.net"],"category":"categorified.net","url":"https://categorified.net/ASQC4.pdf","title":"Symmetry-Protected Topological Phases","note":"Symmetry-Protected Topological Phases. Generalized cohomology theories, cobordism classifications, and topological phases of matter.","date":""},{"tags":["arxiv.org"],"category":"arxiv.org","url":"https://arxiv.org/pdf/hep-th/0205002","title":"Gerbes and Electromagnetic Duality","note":"Gerbes and Electromagnetic Duality. Formulating abelian gauge theory and electric-magnetic duality using bundle gerbes and Deligne cohomology.","date":""},{"tags":["washington.edu"],"category":"washington.edu","url":"https://sites.math.washington.edu//~julia/Slides/Evans08.pdf","title":"Cohomological Support Varieties","note":"Cohomological Support Varieties. Julia Pevtsova's slides on support varieties, rank varieties, and modular representation theory of finite groups.","date":""},{"tags":["berkeley.edu"],"category":"berkeley.edu","url":"https://math.berkeley.edu/~ltomczak/notes/Lent2023/GrpCohom_Notes.pdf","title":"Notes on Group Cohomology","note":"Notes on Group Cohomology. 38-page lecture notes covering group rings $\\mathbb{Z}[G]$, projective resolutions, chain complexes, derived functors $\\operatorname{Ext}_{\\mathbb{Z}[G]}^*(\\mathbb{Z}, M)$, and low-degree cohomology.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://sudo-rushil.github.io/chroma2022/assets/slides/talk5.pdf","title":"The Steenrod Algebra and Hopf Algebras","note":"The Steenrod Algebra and Hopf Algebras. Stable cohomology operations, the Steenrod squares $\\text{Sq}^k$, and the dual Steenrod algebra as a Hopf algebra.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://eprints.maths.manchester.ac.uk/1709/1/PRESENTATION.pdf","title":"Computations in the Steenrod Algebra","note":"Computations in the Steenrod Algebra. 14-page presentation detailing the Adem relations, Milnor basis, and Cartan formula.","date":""},{"tags":["arxiv.org"],"category":"arxiv.org","url":"https://arxiv.org/pdf/0903.4997","title":"Non-Technical Introduction to the Steenrod Algebra","note":"Non-Technical Introduction to the Steenrod Algebra. Conceptual explanation of the total Steenrod operation as a perturbation of the Frobenius map in topology.","date":""},{"tags":["gmu.edu"],"category":"gmu.edu","url":"https://math.gmu.edu/~rallen2/slides/gmu/Multiplication%20Operators%20on%20the%20Bloch%20Space%20of%20the%20Unit%20Disk.pdf","title":"Operators on the Bloch Space","note":"Operators on the Bloch Space. Boundedness and isometries of multiplication and composition operators on Hardy space ra Varieties. J.S. Milne's classification of Riemannian and Hermitian symmetric domains and arithmetic quotients.","date":""},{"tags":["purdue.edu"],"category":"purdue.edu","url":"https://www.math.purdue.edu/~arapura/preprints/diffforms.pdf","title":"Notes on Differential Forms","note":"Notes on Differential Forms. Donu Arapura's 53-page introduction to differential forms, exterior derivatives, Stokes' theorem, and de Rham cohomology.","date":""},{"tags":["arxiv.org"],"category":"arxiv.org","url":"https://arxiv.org/pdf/0903.0517","title":"Spreading Out and the Ax-Grothendieck Theorem","note":"Spreading Out and the Ax-Grothendieck Theorem. Serre's note on the Ax–Grothendieck theorem: any injective polynomial endomorphism of $\\mathbb{C}^n$ is surjective by reduction to finite fields $\\mathbb{F}_p$ via Nullstellensatz techniques.","date":""},{"tags":["arxiv.org"],"category":"arxiv.org","url":"https://arxiv.org/pdf/1805.07172","title":"Mod-2 Cohomological Invariants of Weyl Groups","note":"Mod-2 Cohomological Invariants of Weyl Groups. Serre's computation of the ring of mod-2 cohomological invariants for symmetric groups and Weyl groups.","date":""},{"tags":["arxiv.org"],"category":"arxiv.org","url":"https://arxiv.org/pdf/1708.00046","title":"Mod-p Reduction of Orthogonal Representations","note":"Mod-p Reduction of Orthogonal Representations. Serre's paper showing that the mod-$p$ reduction of characteristic-zero orthogonal and symplectic representations remains orthogonal/symplectic for $p > 2$.","date":""},{"tags":["arxiv.org"],"category":"arxiv.org","url":"https://arxiv.org/pdf/math/0305257","title":"Subgroups of SO(3) and Platonic Symmetries","note":"Subgroups of SO(3) and Platonic Symmetries. Serre's paper on finite subgroup embeddings $A_4 \\cong \\operatorname{PSL}_2(\\mathbb{F}_3), S_4 \\cong \\operatorname{PGL}_2(\\mathbb{F}_3), A_5 \\cong \\operatorname{PSL}_2(\\mathbb{F}_5)$ in $\\mathrm{SO}_3(\\mathbb{R})$ and their applications.","date":""},{"tags":["epfl s":["quasicoherent.io"],"category":"quasicoherent.io","url":"https://rawgit.quasicoherent.io/iblech/internal-methods/master/notes.pdf","title":"Internal Methods in Algebraic Geometry","note":"Internal Methods in Algebraic Geometry. Ingo Blechschmidt's PhD thesis exploring the internal language of sheaf topoi (specifically the petit and gros Zariski topoi) to rephrase and prove theorems in algebraic geometry using intuitionistic commutative algebra. Details the dictionary between internal ring-theoretic statements and external geometric properties of schemes.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://c-keyes.github.io/files/definitions.pdf","title":"Comprehensive Glossary of Algebraic Geometry","note":"Comprehensive Glossary of Algebraic Geometry. A 46-page reference dictionary compiling core definitions and theorems:\n- **Abelian Categories & Additivity:** Categories equipped with biproducts $\\bigoplus$, kernels, cokernels, and the first isomorphism theorem $\\operatorname{Coim}(f) \\cong \\operatorname{Im}(f)$. Semiadditive categories satisfy $\\coprod \\cong \\prod$, yielding semiring structures on endomorphism sets $\\operatorname{End}(X)$.\n- **Ampleness & Positivity:** A line bundle $\\mathcal{L}$ on a projective scheme $X$ is very ample if it admits a closed immersion $X \\hookrightarrow \\mathbb{P}_A^n$ defined by global sections; ample if $\\mathcal{L}^{\\otimes m}$ is very ample for some $m > 0$. Base-point freeness means global sections generate the stalks $\\mathcal{L}_x$ everywhere.\n- **Divisors & Canonical Sheaves:** Cartier divisors are global sections of $\\mathcal{K}_X^\\times / \\mathcal{O}_X^\\times$. Weil divisors $\\sum n_i Y_i$ are formal integer linear combinations of codimension-1 prime subvarieties. The canonical bundle $\\omega_X = \\det(\\Omega_{X/k}^1)$ is the top exterior power of Kähler differentials, acting as the dualizing sheaf in Serre duality.\n- **Morphisms & Flatness:** Flat morphisms preserve exact sequences under tensor products $\\mathcal{F} \\otimes_{\\mathcal{O}_Y} \\mathcal{O}_X$, ensuring constant Hilbert polynomials across fibers. Étale morphisms are smooth of relative dimension 0 (flat and unramified). Proper morphisms are separated, finite type, and universally closed.\n- **Cohomology & Derived Functors:** Sheaf cohomology groups $H^i(X, \\mathcal{F}) = R^i\\Gamma(X, \\mathcal{F})$ quantify obstructions to gluing local sections into global ones. Flasque and soft sheaves are acyclic, computing Čech cohomology without higher derived corrections.","date":""},{"tags":["cantabgold.net"],"category":"cantabgold.net","url":"https://www.cantabgold.net/users/s.sasaki.03/Hida-Coleman.pdf","title":"Hida and Coleman Families of Modular Forms","note":"Hida and Coleman Families of Modular Forms. Kevin Buzzard's lecture notes on $p$-adic modular forms, ordinary families, Hida families, and the Coleman eigencurve.","date":""},{"tags":["ncatlab.org"],"category":"ncatlab.org","url":"https://ncatlab.org/nlab/show/Mitchell-B%C3%A9nabou+language","title":"The Mitchell-Benabou Language","note":"The Mitchell-Benabou Language. Category-theoretic logic interpreting higher-order intuitionistic predicate logic inside elementary topoi using subobject classifiers $\\Omega$, power objects, and Heyting algebras.","date":""},{"tags":["hal.science"],"category":"hal.science","url":"https://hal.science/hal-03606892v1/file/EnrichCat_pour_HAL.pdf","title":"Short Introduction to Enriched Categories","note":"Short Introduction to Enriched Categories. Francis Borceux's 21-page primer covering categories enriched over monoidal categories $\\mathcal{V}$, $\\mathcal{V}$-functors, and $\\mathcal{V}$-natural transformations.","date":""},{"tags":["uu.nl"],"category":"uu.nl","url":"http://www.staff.science.uu.nl/~ooste110/syllabi/toposmoeder.pdf","title":"Topos Theory and Presheaf Logic","note":"Topos Theory and Presheaf Logic. Ieke Moerdijk's 16-page lecture notes on presheaves, sites, Grothendieck topoi, and intuitionistic logic.","date":""},{"tags":["cantabgold.net"],"category":"cantabgold.net","url":"https://www.cantabgold.net/users/s.sasaki.03/LNTG_zoom_10_06_2020_B.pdf","title":"Modularity Conjectures and Galois Representations","note":"Modularity Conjectures and Galois Representations. Slides on modularity conjectures, deformation rings $R = T$, and Galois representations.","date":""},{"tags":["ncatlab.org"],"category":"ncatlab.org","url":"https://ncatlab.org/nlab/files/FinsterTypesAndOpetopes2012.pdf","title":"Type Theory and Opetopic Categories","note":"Type Theory and Opetopic Categories. Eric Finster's notes on opetopes, multitopes, and the formalization of higher-dimensional categories in type theory.","date":""},{"tags":["columbia.edu"],"category":"columbia.edu","url":"https://www.math.columbia.edu/~goldfeld/TraceFormulae-4-12-2020.pdf","title":"Explicit Trace Formulas for SL(2","note":"Explicit Trace Formulas for SL(2, R). Dorian Goldfeld's lecture notes providing a catalog of Kuznetsov, Petersson, and Selberg trace formulas on $\\mathrm{SL}_2(\\mathbb{R})$.","date":""},{"tags":["github.com"],"category":"github.com","url":"https://github.com/dmzb/dmzb.github.io/tree/main/slides","title":"David Zureick-Brown's Arithmetic Geometry Slides","note":"David Zureick-Brown's Arithmetic Geometry Slides. Archive of lecture slides covering Chabauty–Coleman methods, rational points on curves, and Diophantine geometry.","date":""},{"tags":["bu.edu"],"category":"bu.edu","url":"https://math.bu.edu/people/xyz6/intersection.pdf","title":"The Splitting Principle and Chern Classes","note":"The Splitting Principle and Chern Classes. Notes on the splitting principle: reducing calculations of Chern classes of higher-rank vector bundles to formal sums of line bundle classes.","date":""},{"tags":["youtube.com"],"category":"youtube.com","url":"https://www.youtube.com/watch?v=VUzCOnZgtvI","title":"Artin Reciprocity via Spheres","note":"Artin Reciprocity via Spheres. Dust ification of Type I, II, and III von Neumann factors. Type II factors exhibit continuous dimensions.\n- **Time Evolution & the KMS Condition:** The Tomita–Takesaki theorem and the canonical homomorphism $\\delta: \\mathbb{R} \\to \\operatorname{Out}(M) = \\operatorname{Aut}(M)/\\operatorname{Inn}(M)$ showing that noncommutativity naturally generates time evolution.\n- **Foliations & Cyclic Cohomology:** Leaf spaces as noncommutative spaces, longitudinal index theorems, cyclic cohomology $HC^*(A)$, and noncommutative de Rham homology.\n- **Quantum Mechanics & Uncertainty:** Noncommuting variables $[P, Q] = i\\hbar$, spectral geometry, Dirac operators as square roots of Laplacians, and Dixmier traces.","date":""},{"tags":["mathoverflow.net"],"category":"mathoverflow.net","url":"https://mathoverflow.net/questions/386464/making-sense-of-every-non-commutative-algebra-has-its-own-internal-time-evoluti","title":"Internal Time Evolution in Operator Algebras","note":"Internal Time Evolution in Operator Algebras. Dmitri Pavlov's explanation of the modular automorphism group in Tomita–Takesaki theory as a canonical 1-parameter group of outer automorphisms.","date":""},{"tags":["edu.cn"],"category":"edu.cn","url":"https://archive.ymsc.tsinghua.edu.cn/pacm_download/343/11610-Zhengwei_Liu_4.pdf","title":"The Noncommutative Uncertainty Principle","note":"The Noncommutative Uncertainty Principle. Zhengwei Liu's slides on subfactor theory, planar algebras, and quantum uncertainty relations.","date":""},{"tags":["alainconnes.org"],"category":"alainconnes.org","url":"https://alainconnes.org/wp-content/uploads/walkNCGgarden.pdf","title":"A Walk in the Noncommutative Garden","note":"A Walk in the Noncommutative Garden. Alain Connes' expository overview of spectral triples, quantum spaces, and the Riemann hypothesis.","date":""},{"tags":["alainconnes.org"],"category":"alainconnes.org","url":"https://alainconnes.org/wp-content/uploads/char1absolutepoint.pdf","title":"Mathematics in Characteristic One","note":"Mathematics in Characteristic One. Connes and Consani on idempotent analysis over the tropical semifield $\\mathbb{R}_+^{\\max}$, Frobenius automorphisms $x \\mapsto x^\\lambda$, and the geometry of the absolute point $\\operatorname{Spec} \\mathbb{F}_1$.","date":""},{"tags":["alainconnes.org"],"category":"alainconnes.org","url":"https://alainconnes.org/wp-content/uploads/cmr0.pdf","title":"KMS States and Complex Multiplication","note":"KMS States and Complex Multiplication. Connes, Marcolli, and Ramachandran on the Bost–Connes system for imaginary quadratic fields and class field theory via modular functions.","date":""},{"tags":["alainconnes.org"],"category":"alainconnes.org","url":"https://alainconnes.org/wp-content/uploads/arithmeticsite.pdf","title":"The Arithmetic Site","note":"The Arithmetic Site. Connes and Consani on the presheaf topos of $\\mathbb{N}^\\times$ endowed with the structure sheaf of tropical integers $\\mathbb{Z}_{\\max}$.","date":""},{"tags":["alainconnes.org"],"category":"alainconnes.org","url":"https://alainconnes.org/wp-content/uploads/scalingsite.pdf","title":"The Scaling Site and Zeta Zeros","note":"The Scaling Site and Zeta Zeros. Monograph on the scaling site, rank-1 subgroups of $\\mathbb{R}$, and the geometric realization of the Frobenius flow.","date":""},{"tags":["rptu.de"],"category":"rptu.de","url":"https://agag-gathmann.math.rptu.de/class/alggeom-2021/alggeom-2021-c16.pdf","title":"Computations in Sheaf Cohomology","note":"Computations in Sheaf Cohomology. Andreas Gathmann's lecture notes on computing cohomology of projective spaces $\\mathbb{P}^n$ and Serre's vanishing theorems.","date":""},{"tags":["seohong.me"],"category":"seohong.me","url":"https://seohong.me/notes/Serre_Duality.pdf","title":"Serre Duality in 6 Pages","note":"Serre Duality in 6 Pages. Concise proof of Serre duality $H^i(X, \\mathcal{F}) \\cong H^{n-i}(X, \\omega_X \\otimes \\mathcal{F}^*)^\\vee$ for smooth projective varieties.","date":" e":""},{"tags":["youtube.com"],"category":"youtube.com","url":"https://www.youtube.com/watch?v=XPVfElqM264","title":"Geometry of the Adele Class Space: Part II","note":"Geometry of the Adele Class Space: Part II. Alain Connes' second lecture:\n- **Adèles & Global Fields:** Global fields sit discretely and cocompactly in their locally compact adèle rings $\\mathbb{A}_K$.\n- **Trace Formulas & Absorption Spectra:** The scaling action on $K_v$ has Schwartz kernel $\\delta(y - \\lambda x)$ with trace $\\int \\delta(x - \\lambda x)\\,dx = 1/|1-\\lambda|$. Zeros of $L$-functions emerge as an absorption spectrum, explaining the minus sign in explicit formulas.\n- **The Arithmetic Site:** The topos $(\\mathbb{N}^\\times, \\mathbb{Z}_{\\max})$ over the tropical semifield $\\mathbb{R}_{\\max}$ exhibits Frobenius automorphisms $\\operatorname{Fr}_\\lambda(x) = x^\\lambda$, establishing an explicit Riemann–Roch theorem for number fields.","date":""},{"tags":["denisevellachemla.eu"],"category":"denisevellachemla.eu","url":"https://denisevellachemla.eu/transc-AC-topo2-en.pdf","title":"A Topo on Topos by Alain Connes","note":"A Topo on Topos by Alain Connes. 21-page transcript on the origin of topos theory in Grothendieck's Tohoku paper, derived functors, and diagram categories.","date":""},{"tags":["denisevellachemla.eu"],"category":"denisevellachemla.eu","url":"https://denisevellachemla.eu/transc-AC-Harvard-spectral.pdf","title":"The Spectral Viewpoint Transcript","note":"The Spectral Viewpoint Transcript. Alain Connes' Harvard lectures on spectral geometry, Dirac operators, and noncommutative geometry.","date":""},{"tags":["denisevellachemla.eu"],"category":"denisevellachemla.eu","url":"https://denisevellachemla.eu/transc-AC-dualite-en.pdf","title":"Duality Between Shapes and Spectra","note":"Duality Between Shapes and Spectra. Connes on quasicrystals, noncommutative spheres, and the duality between spatial shapes and frequency spectra.","date":""},{"tags":["denisevellachemla.e },{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/ToulouseHandout1.pdf","title":"Derived Differential Geometry I","note":"Derived Differential Geometry I. Dominic Joyce on $C^\\infty$-rings, $C^\\infty$-schemes, and derived manifolds (d-manifolds).","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/ToulouseHandout2.pdf","title":"Derived Differential Geometry II","note":"Derived Differential Geometry II. Square-zero extensions, $m$-Kuranishi neighborhoods, and virtual dimensions.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/ToulouseHandout3.pdf","title":"Derived Differential Geometry III","note":"Derived Differential Geometry III. Virtual fundamental classes and bordism formulations of derived counting invariants.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/DAG2022/DAG1+2.pdf","title":"Derived Algebraic Geometry Slides 1-2","note":"Derived Algebraic Geometry Slides 1-2. Moduli problems, why fine moduli schemes fail, Artin/Deligne–Mumford stacks, and derived intersections without transversality.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/DAG2022/DAG3+4.pdf","title":"Derived Algebraic Geometry Slides 3-4","note":"Derived Algebraic Geometry Slides 3-4. 2-categories of stacks, quotient stacks $[U/G]$, classifying stacks $[*/G] \\cong BG$, and smooth atlases.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/DAG2022/DAG5+6.pdf","title":"Derived Algebraic Geometry Slides 5-6","note":"Derived Algebraic Geometry Slides 5-6. Coarse vs fine moduli spaces, Gieseker stability, compactifications of moduli of vector bundles via torsion-free sheaves, and skyscraper sheaves.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/DAG2022/DAG7+8.pdf","title":"Derived Algebraic Geometry Slides 7-8","note":"Derived Algebraic Geometry Slides 7-8. Triangulated categories, bounded derived categories $\\mathcal{D}^b(\\operatorname{Coh} X)$, and quasi-isomorphisms.","date":""},{"tags":["ncatlab.org"],"category":"ncatlab.org","url":"https://ncatlab.org/nlab/show/Kan+extension","title":"Definition of Kan Extensions","note":"Definition of Kan Extensions. Rapid reference defining left and right Kan extensions $\\operatorname{Lan}_K F$ and $\\operatorname{Ran}_K F$ via universal arrows and comma categories.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/DAG2022/DAG9+10.pdf","title":"Derived Algebraic Geometry Slides 9-10","note":"Derived Algebraic Geometry Slides 9-10. Simplicial $K$-algebras, model categories, and derived commutative rings.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/DAG2022/DAG11+12.pdf","title":"Derived Algebraic Geometry Slides 11-12","note":"Derived Algebraic Geometry Slides 11-12. Cotangent complexes $\\mathbb{L}_X$ and obstruction theory in derived geometry.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/DAG2022/DAG13+14.pdf","title":"Derived Algebraic Geometry Slides 13-14","note":"Derived Algebraic Geometry Slides 13-14. Virtual fundamental classes $[M]^{\\text{vir}}$, Behrend-Fantechi obstruction theories, and Donaldson–Thomas invariants on Calabi–Yau 3-folds.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/VertexAlgebras2021/VA1+2.pdf","title":"Vertex Algebras Course 1-2","note":"Vertex Algebras Course 1-2. Dominic Joyce on the formal definition of vertex algebras, state-field correspondences $Y(v, z)$, and Borcherds identity.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/VertexAlgebras2021/VA3+4.pdf","title":"Vertex Algebras Course 3-4","note":"Vertex Algebras Course 3-4. Conformal vertex algebras, Virasoro actions, and vertex operator modules.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/VertexAlgebras2021/VA5+6.pdf","title":"Vertex Algebras Course 5-6","note":"Vertex Algebras Course 5-6. Lattice vertex algebras and the Monster vertex algebra $V^\\natural$.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/VertexAlgebras2021/VA7+8.pdf","title":"Vertex Algebras Course 7-8","note":"Vertex Algebras Course 7-8. Wall-crossing structures and vertex Lie algebras in Donaldson–Thomas","date":""},{"tags":["dartmouth.edu"],"category":"dartmouth.edu","url":"https://math.dartmouth.edu/~lesen/notes/General_Shimura_Varieties_talk.pdf","title":"Eran Assaf","note":"Eran Assaf, General Shimura Varieties. Introduction to the category of abelian motives. Classification of Shimura varieties based on abelian type.","date":""},{"tags":["dartmouth.edu"],"category":"dartmouth.edu","url":"https://math.dartmouth.edu/~lesen/notes/talk_slides_Aug17.pdf","title":"Ben Breen","note":"Ben Breen, Shimura Varieties. Algebras with involutions. Hermitian forms. Introduction to Shimura datum.","date":""},{"tags":["dartmouth.edu"],"category":"dartmouth.edu","url":"https://math.dartmouth.edu/~lesen/notes/ShimuraVarietiesCMBen.pdf","title":"Ben Breen","note":"Ben Breen, Complex Multiplication in Shimura Varieties. Introduction to the main theorem of Shimura varieties.","date":""},{"tags":["dartmouth.edu"],"category":"dartmouth.edu","url":"https://math.dartmouth.edu/~lesen/notes/talk_slides_May29.pdf","title":"Avi Kulkarni","note":"Avi Kulkarni, PEL Shimura Varieties. Introduction to PEL Shimura Varieties. Introduction to PEL Shimura datum. Endomorphisms of elliptic curves.","date":""},{"tags":["dartmouth.edu"],"category":"dartmouth.edu","url":"https://math.dartmouth.edu/~lesen/notes/talk_slides_Aug17.pdf","title":"Avi Kulkarni","note":"Avi Kulkarni, Uniqueness of Canonical Models. Shimura reciprocity and relation to complex multiplication. Transcendental Galois theory.","date":""},{"tags":["wdfiles.com"],"category":"wdfiles.com","url":"http://numr.wdfiles.com/local--files/differential-cohomology/cheeger-simons.pdf","title":"Jeff Cheeger","note":"Jeff Cheeger, James Simons, Differential characters and geometric invariants. A classical non-sheaf theoretic approach to differential cohomology.","date":""},{"tags":["arxiv.org"],"category":"arxiv.org","url":"https://arxiv.org/pdf/1310.7930.pdf","title":"Urs Schreiber","note":"Urs Schreiber, Differential cohomology in a cohesive infinity-topos. Higher stack model of differential cohomology (similar to Brylinski's gerbes, but generalized to higher dimensions).","date":""},{"tags":["arxiv.org"],"category":"arxiv.org","url":"https://arxiv.org/pdf/1208.3961","title":"Ulrich Bunke","note":"Ulrich Bunke, Differential cohomology. These course note first provide an introduction to secondary characteristic classes and differential cohomology. They continue with a presentation of a stable homotopy theoretic approach to the theory of differential extensions of generalized cohomology theories including products and Umkehr maps.","date":""},{"tags":["arxiv.org"],"category":"arxiv.org","url":"https://arxiv.org/pdf/1605.03444.pdf","title":"Hisham Sati","note":"Hisham Sati, Spectral sequences in smooth generalized cohomology. Brief summary of Bunke's model for differential cohomology theories.","date":""},{"tags":["mit.edu"],"category":"mit.edu","url":"https://math.mit.edu/juvitop/pastseminars/2019_Fall.html","title":"Juvitop Seminar for differential cohomology","note":"Juvitop Seminar for differential cohomology. In Fall 2019, Juvitop was about Differential Cohomology. This seminar was organized by Araminta Amabel and Peter Haine.","date":""},{"tags":["mit.edu"],"category":"mit.edu","url":"https://math.mit.edu/juvitop/pastseminars/notes_2019_Fall/Park.pdf","title":"Yi Yu Zhang","note":"Yi Yu Zhang, Introduction to equivariant cohomology and the equivariant first Chern class. The goal of this paper to provide a relatively accessible and integrated introduction to the algebraic topology of spaces with Lie group actions, in both the smooth and the holomorphic category. We present detailed treatment of the basic constructions in equivariant de Rham theory and Dolbeault theory. We also discuss equivariant connections and curvature on vector bundles equipped with infinitesimal lifts, as well as the equivariant first Chern class of line bundles with inﬁnitesimal lifts. A novel feature of this presentation is the deﬁnition of infinitesimal lift via differential operators on the vector bundles.","date":""},{"tags":["pirsa.org"],"category":"pirsa.org","url":"https://pdf.pirsa.org/files/08040019.pdf","title":"Wilsonian renormalisation Perimeter Institute slides","note":"Wilsonian renormalisation Perimeter Institute slides, blocking dynamics and linearization onto IR fixed points giving universal critical exponents. Ferromagnet example. Proof that nonperturbative renormalisable theory in 4D is trivial.","date":""},{"tags":["ihes.fr"],"category":"ihes.fr","url":"https://www.ihes.fr/~abbes/SGA/Slides_Lebras.pdf","title":"Arthur-César Le Bras","note":"Arthur-César Le Bras, prismatic Dieudonné theory classifies $p$-divisible groups via filtered prismatic Dieudonné crystals. Key computation: specializing to perfectoid rings recovers the Scholze–Weinstein classification via minuscule Breuil–Kisin–Fargues modules (where the filtration is redundant); specializing to characteristic $p$ recovers Berthelot–Breen–Messing crystalline Dieudonné theory and de Jong's/Lau's classification; and evaluating on $(\\mathfrak{S}, (E))$ for $R = \\mathcal{O}_K$ recovers Breuil–Kisin classification of $p$-divisible groups.","date":""},{"tags":["helsinki.fi"],"category":"helsinki.fi","url":"https://www.mv.helsinki.fi/home/jvaanane/arctic/2025/Slides/lambie-hanson_arctic25.pdf","title":"Jeffrey Lambie-Hanson (joint with Chris Lambie-Hanson)","note":"Jeffrey Lambie-Hanson (joint with Chris Lambie-Hanson), infinitary combinatorics in condensed mathematics and strong homology. Key computation: for $X^{n,\\lambda}$ the one-point compactification of a disjoint sum of $\\lambda$ copies of the open $n$-ball, $\\bar H_p(\\bigvee_\\omega X^{n,\\lambda})=\\bigoplus_\\omega \\bar H_p(X^{n,\\lambda})$ iff $\\lim^{n-p} A^{\\omega}_\\lambda=0$, where $A^\\kappa_\\lambda=\\langle\\prod_{I(f)}\\mathbb Z\\rangle$ is the inverse system attached to $f:\\kappa\\to[\\lambda]^{<\\omega}$, generalizing Mardešić–Prasolov's criterion; forcing with Hechler or $\\beth_\\omega$-many Laver reals kills all $\\lim^n A[H]$ (yielding $2^{\\aleph_0}>\\aleph_\\omega$ via Casarosa–Lambie-Hanson), making strong homology additive on locally compact separable metric spaces and embedding separable pro-abelian groups fully faithfully in $\\mathrm{Cond}(\\mathrm{Ab})$; in ZFC the uncountable earring space and $\\prod_\\omega\\prod_{\\omega_1}\\mathbb{Z}$ give counterexamples, so nonseparable condensed behavior is provably bad.","date":""},{"tags":["mit.edu"],"category":"mit.edu","url":"https://math.mit.edu/topology/notes/wang-slides.pdf","title":"Guozhen Wang","note":"Guozhen Wang, topological cyclic homology of local fields via a descent spectral sequence built from a prismatic/Dieudonné-type $\\delta$-ring structure. Key computation: for a local field $K$ with ring of integers $O_K$ and uniformizer $\\varpi$, computes relative $THH(O_K/S\\langle z\\rangle)$ for $S\\langle z\\rangle=\\mathbb{Z}_p[z]$, $z\\mapsto\\varpi$; the filtration by the fiber of $\\mathrm{can}-\\varphi$ gives $E_1^{i,j}\\Rightarrow TC_{i+j}(O_K)$, and the $E_2$-term of the descent spectral sequence for $TP(O_K)$ is computed as $\\mathrm{Ext}$ of the Hopf algebroid $(TP_0(O_K/S[z_0,z_1]), TP_0(O_K/S[z_0,z_0,z_1]))$, with $TP_0(O_K/S[z_0,z_1])$ the Nygaard-completion of a $\\delta$-ring generated by $h=\\varphi(E)^{-1}\\sigma$-type elements.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://kclo3-naoh.github.io/files/TC_of_local_fields.pdf","title":"Albert Jinghui Yang","note":"Albert Jinghui Yang, topological cyclic homology of local fields via secondary spectral sequences on the Nygaard filtration. Key computation: the descent spectral sequence for $TC(O_K)$ is obtained by filtering by the fiber of $\\mathrm{can}-\\varphi$ levelwise, $E_1^{i,j}\\Rightarrow TC_{i+j}(O_K\\otimes\\mathbb{Z}_p^t\\text{-terms})$; the Nygaard filtration $N^{\\geq j}$ on the $E_1$-terms of the descent spectral sequence for $TC^-$ and $TP$ produces secondary spectral sequences, e.g. $E_2^{1}(TC^-)=H^i(\\mathrm{gr}^{2k}_{TC^-(O_K/S\\otimes[n])})\\Rightarrow E_2^2(TC^-)$, connecting Nygaard-complete $\\delta$-ring data to explicit $TC$-groups.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://chry-santhemum.github.io/website/PrismIntro.pdf","title":"Chrysanthemum (Chang)","note":"Chrysanthemum (Chang), introduction to prismatic cohomology identifying it with derived de Rham cohomology. Key computation: for a quasi-syntomic ring $R$, after $p$-completion there is a canonical quasi-isomorphism $q\\Omega^*_{R/\\mathbb{Z}_p}\\simeq \\Delta_R$ over the base prism $(\\mathbb{Z}_p,p)$, resolving a conjecture; the Hodge–Tate comparison gives $\\mathrm{gr}^i\\bar\\Delta_R \\cong \\bar\\Omega^i_R[i]$, and the Nygaard filtration on $TC^-$ recovers the motivic filtration.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://aritopo.github.io/2022-12/Huan.pdf","title":"Huan–Young","note":"Huan–Young, twisted Real quasi-elliptic cohomology realized as a twist of Tate K-theory. Key computation: twisted Real quasi-elliptic cohomology $QEll_H^*(X)$ comes with explicit restriction $K_G^*(X)\\to QEll_H^*(X)$, induction $QEll_H^*(X)\\to K_H^*(X)$, and Künneth $QEll_G^*(X)\\hat\\otimes_{\\mathbb{Z}[q^{\\pm}]} QEll_H^*(Y)\\to QEll_{G\\times H}^*(X\\times Y)$ maps; a change-of-group isomorphism $QEll_G^*(Y\\times_H G)\\cong QEll_H^*(Y)$ and a transfer map $K_{\\Sigma_N}^*(pt)\\to K^*(pt)/I_{tr}$ with explicit transfer ideal $I_{tr}^{\\mathrm{Tate}}$ complete the picture.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://aritopo.github.io/2022-12/Zhao.pdf","title":"Bin Zhao","note":"Bin Zhao, slopes of modular forms and the ghost conjecture. Key computation: for normalized $f\\in S_k(\\Gamma_1(N))$ with $p\\mid N$, the slope of $f$ is $v_p(a_p)$ for the $U_p$-eigenvalue $a_p$; a ghost map built from the ghost components of a Witt-vector-like ring on the space of modular forms gives an algorithm computing the Newton slopes of $U_p$, and the ghost conjecture (Buzzard) states this ghost map computes slopes exactly, verified in explicit slope tables for small $p,N$.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://aritopo.github.io/2022-12/Zhang.pdf","title":"Zhang","note":"Zhang, a Quillen–Lichtenbaum conjecture for Dirichlet $L$-functions. Key computation: reformulates Dirichlet's unit theorem $\\mathcal{O}_F^\\times\\cong\\mu(F)\\times\\mathbb{Z}^{\\oplus r_1+r_2-1}$ (so $\\dim_\\mathbb{Q}\\mathcal{O}_F^\\times\\otimes\\mathbb{Q}=\\mathrm{ord}_{s=0}\\zeta_F(s)$) and the class number formula $\\zeta_F^*(0)=-\\frac{|cl(F)|}{|\\mu(F)|}R(F)$ via $K_0(\\mathcal{O}_F)\\cong\\mathbb{Z}\\oplus cl(F)$ and $K_1(\\mathcal{O}_F)\\cong\\mathcal{O}_F^\\times$, then states/proves a Quillen–Lichtenbaum-type statement identifying rational equivariant algebraic K-groups of number fields with values of Dirichlet $L$-functions at nonpositive integers.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://aritopo.github.io/2022-12/Gu.pdf","title":"Xintong Gu","note":"Xintong Gu, ordinary and motivic cohomology of $BPGL_n(\\mathbb{C})$. Key computation: motivic cohomology satisfies $\\tilde{H}M^{s,s}(\\mathrm{spec}(k),A)\\cong K_M^s(k)\\otimes A$ (Milnor K-theory) and $\\mathbb{A}^1$-homotopy invariance $H_M^{*,*}(X\\times\\mathbb{A}^1)\\cong H_M^{*,*}(X)$; computes the motivic cohomology of the classifying stack $BPGL_n$ via the sites $\\mathrm{Torsor}_{Nis}(-)\\to H_M^{*,*}(-,B_{Nis}G)$ and $\\mathrm{Torsor}_{\\acute{e}t}(-)\\to H_M^{*,*}(-,B_{\\acute{e}t}G)$, classifying $G$-torsors and giving explicit $H^{*,*}(BPGL_n)$-calculations.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://Est-wald.github.io/notes-of-talks/courses/LSY-prismatic.pdf","title":"Si-Ying Lee","note":"Si-Ying Lee, prismatic Dieudonné theory generalizing Breuil–Kisin's classification of $p$-divisible groups. Key computation: reduces good reduction of $p$-divisible groups $G=A_{\\mathbb{Z}}[p^\\infty]$ to $T_pG$ being crystalline (the proved Fontaine conjecture), via Breuil–Kisin's fully faithful functor $\\mathrm{Rep}_{\\mathcal{O}_K^{ur}}(\\mathrm{Gal}_k)\\to\\{\\text{Breuil–Kisin modules}\\}$ and $BT/\\mathcal{O}_K\\simeq\\{\\text{subcat. of BK-modules}\\}$, generalized by Bhatt–Scholze's prismatic F-crystals; for a $p$-divisible group $G/X$, $\\mathrm{Ext}^2_{X/S}(\\underline{G},0)=0$ and $\\mathrm{Ext}^1_{X/S}(\\underline{G},0)\\simeq\\mathrm{Im}(\\mathrm{Ext}^1(\\underline{G}_{n+m},0)\\to\\mathrm{Ext}^1(\\underline{G}_n,0))$ is locally free of rank $2kh/\\mathcal{O}_T$, computed via the snake lemma on $0\\to\\underline{G}_n\\to\\underline{G}\\xrightarrow{p^n}\\underline{G}\\to0$.","date":""},{"tags":["berkeley.edu"],"category":"berkeley.edu","url":"https://math.berkeley.edu/~avizeff/seminars/prismatic-overview.pdf","title":"Avi Zeff","note":"Avi Zeff, overview of prismatic cohomology and its comparison theorems. Key computation: for a perfect prism $(A,(d))$ with $R=A/d$ perfectoid, the étale comparison identifies nearby cycles $R\\mu_*\\mathbb{Z}/p^n \\simeq (\\Delta_{X/A}[1/d]/p^n)^{\\varphi=1}$; the Hodge–Tate comparison shows $\\Delta_{X/A}$ is a perfect complex with $\\mathrm{gr}^i \\simeq \\Omega^i_{X/(A/I)}[-i]$ via reduction to characteristic $p$ and the Cartier isomorphism; and the Nygaard filtration $\\mathrm{Fil}_i^N A := \\{x\\in A : \\varphi(x)\\in d^i A\\}$ lifts the Hodge filtration via $d^{\\varphi(i)}$-twisted maps.","date":""},{"tags":["umich.edu"],"category":"umich.edu","url":"https://public.websites.umich.edu/~bhattb/teaching/prismatic-columbia/lecture7-derived-prismatic.pdf","title":"Bhargav Bhatt","note":"Bhargav Bhatt, derived prismatic cohomology extended to arbitrary $p$-complete $A/I$-algebras via non-abelian derived functors. Key computation: for a regular semiperfect $k$-algebra $S=R/I$ with $R$ perfect over $k$ and $I$ generated by a regular sequence, $L_{S/R} \\simeq I/I^2[1]$ and $\\wedge^i L_{S/R} \\simeq \\Gamma_i^R(I/I^2)[i]$; the conjugate filtration forces $dR_{S/k}^\\infty$ to be concentrated in degree $0$ and equal $D_I^\\infty(R)$ — e.g. $S=k[x^{1/p^\\infty}]/(x)$ gives $dR_{S/k}^\\infty \\simeq \\bigoplus_{i\\in\\mathbb{N}[1/p]} k\\cdot x^i/\\lfloor i\\rfloor!$ — and descending along the Čech nerve of $R\\to R_{perf}$ computes $dR_{R/k}$ for smooth $R$.","date":""},{"tags":["umich.edu"],"category":"umich.edu","url":"https://public.websites.umich.edu/~bhattb/teaching/prismatic-columbia/lecture5-prismatic-site.pdf","title":"Bhargav Bhatt","note":"Bhargav Bhatt, the prismatic site $(R/A)_\\Delta$ and the Hodge–Tate comparison theorem. Key computation: for the torus $R=(\\mathcal{O}_K[X^{\\pm1}])^\\wedge$ over the base prism $(A,I)=(\\mathbb{Z}_p\\langle q-1\\rangle,([p]_q))$ with $[i]_q=(q^i-1)/(q-1)$, $\\bar\\Delta_{R/A}$ is computed by the two-term $q$-de Rham complex $A\\langle X^{\\pm1}\\rangle \\xrightarrow{[i]_q\\frac{dX}{X}} A\\langle X^{\\pm1}\\rangle$; since $[i]_q$ is invertible mod $[p]_q$ for $p\\nmid i$ and $[kp]_q=0$, reduction mod $[p]_q$ yields the graded pieces $H^0=\\bigoplus_i (A/I)X^{kp}$, $H^1=\\bigoplus_i (A/I)X^{kp}\\frac{dX}{X}$, explicitly verifying the Hodge–Tate isomorphism $\\Omega^*_{R/(A/I)}\\cong H^*(\\bar\\Delta_{R/A})$ and perfectness of $\\bar\\Delta_{R/A}$.","date":""},{"tags":["columbia.edu"],"category":"columbia.edu","url":"https://blogs.cuit.columbia.edu/jr4460/files/2024/12/IntroCondensedMathChile.pdf","title":"Rizzo","note":"Rizzo, condensed mathematics and analytic geometry classifying classical topological categories by separatedness conditions on condensed sets. Key computation: Theorem 1.1.15 shows the category $\\mathrm{Top}^\\omega$ of compactly generated topological spaces is equivalent to quasi-separated condensed sets; light profinite sets are exactly quotients of the Cantor set $\\{0,1\\}^{\\mathbb{N}}$, and extremally disconnected profinite sets give internally projective $\\mathbb{Z}[S]$, proving $\\mathrm{Cond}(\\mathrm{Ab})$ is abelian with enough projectives.","date":""},{"tags":["bu.edu"],"category":"bu.edu","url":"https://math.bu.edu/people/xyz6/prism_lec1.pdf","title":"Xinyu Zhou","note":"Xinyu Zhou, prismatic cohomology as cohomology of the structure sheaf on the relative prismatic site, comparing to classical $p$-adic cohomology theories without smoothness/properness. Key computation: for a bounded prism $(A,I)$ and smooth $p$-adic formal $X/\\mathrm{Spf}\\,A/I$, the crystalline case $I=(p)$ gives $R\\Gamma_{\\mathrm{crys}}(X/A)\\simeq R\\Gamma_\\Delta(X/A)\\otimes^L_{A,\\varphi_A}A$; the de Rham comparison gives $H^i(R\\Gamma_\\Delta(X/A)\\otimes^L_A A/I)\\simeq\\Omega^i_{R/(A/I)}\\{-i\\}$ with Nygaard twist $\\{-i\\}=-(I/I^2)^{\\otimes i}$; the étale comparison for perfect $A$ gives $R\\Gamma_{\\mathrm{\\acute et}}(X_\\eta,\\mathbb{Z}/p^n)\\simeq R\\Gamma_\\Delta(X/A)\\otimes^L_A(A/p)[1/I]$; and the functor $R\\mapsto(A_{\\mathrm{inf}}(R),\\ker\\theta)$ gives an equivalence perfect prisms $\\simeq$ perfectoid rings.","date":""},{"tags":["uni-bonn.de"],"category":"uni-bonn.de","url":"https://www.math.uni-bonn.de/people/scholze/PerfectoidSpaces.pdf","title":"Peter Scholze","note":"Peter Scholze, perfectoid spaces as a framework for almost purity and weight-monodromy via tilting between mixed and equal characteristic. Key computation: classification of points of the adic space $\\mathrm{Spa}(R,R^+)$ over $k=\\langle T\\rangle$: the functor $r:X\\mapsto X^{ad}$ induces an equivalence $\\{$qs rigid-analytic varieties$/k\\}\\cong\\{$qs adic spaces locally of finite type$/k\\}$, and the five types of points are classified — closed rank-1 points, branching points of type 2 with the Gauß point, type-3 points from a disc $D(x,r)$, dead ends from nested discs $D_1\\supset D_2\\supset\\cdots$ with empty intersection (existing iff $k$ is not spherically complete), and rank-2 points with value group $\\Gamma=\\mathbb{R}_{>0}\\times\\gamma^{\\mathbb{Z}}$.","date":""},{"tags":["uni-bonn.de"],"category":"uni-bonn.de","url":"https://www.math.uni-bonn.de/people/scholze/ICM.pdf","title":"Peter Scholze","note":"Peter Scholze, perfectoid spaces and their applications: tilting/untilting and the Fargues–Fontaine curve. Key computation: Theorem 3.3 — for a perfectoid field $K$ with tilt $K^\\flat$, $L\\mapsto L^\\flat$ gives an equivalence between finite extensions of $K$ and of $K^\\flat$, hence an isomorphism $G_K\\cong G_{K^\\flat}$; Theorem 4.1 (Fargues–Fontaine) — for a perfectoid field $L$ of characteristic $p$ there is a regular noetherian scheme $X_L$ of Krull dimension 1 over $\\mathbb{Q}_p$ whose closed points are in bijection with equivalence classes of untilts $(K,\\iota:L\\to K^\\flat)$ up to $\\iota\\circ\\Phi^n$, of degree $[K^\\flat:L]$.","date":""},{"tags":["ias.edu"],"category":"ias.edu","url":"https://www.math.ias.edu/~bhatt/teaching/prismatic-columbia/lecture1-overview.pdf","title":"Bhargav Bhatt","note":"Bhargav Bhatt, overview lecture on prismatic cohomology unifying integral $p$-adic cohomology theories. Key computation: Theorem 3.3 attaches to $R$ a $(p,u)$-adically complete complex $\\Delta_{R/A}$ with Frobenius $\\varphi_{R/A}:\\varphi^*\\Delta_{R/A}\\to\\Delta_{R/A}$ satisfying $\\varphi^*\\Delta_{R/A}\\otimes^L_A \\mathbb{F}_p \\simeq \\Omega^*_{R_{\\mathbb{F}_p}/\\mathbb{F}_p}$ (crystalline comparison), $\\Delta_{R/A}\\otimes^L_A \\mathbb{F}_p((u))$ with $\\varphi=1$ fixed points $\\simeq R\\Gamma_{\\text{ét}}(\\mathrm{Spec}\\,R_C,\\mathbb{F}_p)$ (étale comparison), and $H^i(\\Delta_{R/A}\\otimes^L_A \\mathbb{Z}_p)\\simeq\\Omega^i_{R/\\mathbb{Z}_p}$ (de Rham comparison); for $R$ the completion of $\\mathbb{Z}[x,x^{-1}]$, $\\Omega^*_{R/\\mathbb{Z}_p}=\\bigoplus_{i\\in\\mathbb{Z}}\\mathbb{Z}_p\\cdot x^i(dx/x)\\to \\mathbb{Z}_p\\cdot x^i$ computes the torus example.","date":""},{"tags":["uni-bonn.de"],"category":"uni-bonn.de","url":"https://www.math.uni-bonn.de/people/scholze/prisms.pdf","title":"Peter Scholze","note":"Peter Scholze, prisms and prismatic cohomology. Key computation: Theorem 1.8 — for a bounded prism $(A,I)$ and smooth $p$-adic formal $X/\\mathrm{Spf}(A/I)$, $\\mathrm{can}\\otimes\\varphi: \\varphi^*R\\Gamma_\\Delta(X/A)\\otimes^L_A A[1/I]\\simeq R\\Gamma_{\\mathrm{crys}}(X/A)$, and the Hodge–Tate comparison gives $\\Omega^i_{R/(A/I)}\\{-i\\}\\simeq H^i(R\\Gamma_\\Delta(X/A)\\otimes^L_A A/I)$ with Tate twist $\\{-i\\}=(I/I^2)^{\\otimes i}$; over the $q$-prism $(\\mathbb{Z}_p\\langle q-1\\rangle,([p]_q))$ with $[p]_q=(q^p-1)/(q-1)$, prismatic cohomology recovers the $q$-de Rham complexes, and the Nygaard filtration is $F^iA=\\{x\\in A:\\varphi(x)\\in d^iA\\}$.","date":""},{"tags":["ias.edu"],"category":"ias.edu","url":"https://www.math.ias.edu/~lurie/ffcurve/Lecture6-8-Perfectoid.pdf","title":"Jacob Lurie","note":"Jacob Lurie, foundations of perfectoid spaces and the tilting correspondence for integral perfectoid rings. Key computation: Theorem 1.7 — for integral perfectoid $A$, $B\\mapsto B^\\flat$ is an equivalence $\\{$integral perfectoid $A$-algebras$\\}\\cong\\{$integral perfectoid $A^\\flat$-algebras$\\}$ with inverse $C\\mapsto C^\\#=W(C)\\otimes_{W(A^\\flat),\\theta}A$, compatible with almost isomorphisms; Proposition 1.6 constructs $\\theta:W(A^\\flat)\\to A$ with kernel generated by $\\xi=p+[\\pi^\\flat]^px$, and the divisibility computation $\\pi^{p^l}a^p\\in\\pi^pA\\Rightarrow\\pi^la\\in\\pi A$ shows $\\xi$ is a non-zero-divisor.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://bheuer.github.io/PerfectoidNotes.pdf","title":"B","note":"B. Heuer, perfectoid spaces via inverse perfection and tilting. Key computation: Theorem 1.1.13 (Fontaine–Wintenberger) — the natural isomorphism $\\mathrm{Gal}(\\mathbb{Q}_p\\langle p^{1/p^\\infty}\\rangle \\mid \\mathbb{Q}_p\\langle p^{1/p}\\rangle)\\cong \\mathrm{Gal}(\\mathbb{F}_p((t^{1/p^\\infty}))\\mid \\mathbb{F}_p((t^{1/p})))$, obtained by matching finite ramified extensions such as $X^n-X-p$ over $\\mathbb{Q}_p\\langle p^{1/p^\\infty}\\rangle$ to $X^n-X-t$ over $\\mathbb{F}_p((t^{1/p^\\infty}))$; Definition 1.1.26 — the tilting functor $A\\mapsto A^\\flat=\\varprojlim_{x\\mapsto x^p}(A/\\pi)[(\\pi^\\flat)^{-1}]$ classifies perfectoid algebras up to untilting.","date":""},{"tags":["kskedlaya.org"],"category":"kskedlaya.org","url":"https://kskedlaya.org/slides/ams-sf-2014.pdf","title":"Kiran Kedlaya","note":"Kiran Kedlaya, a brief history of perfectoid spaces. Key computation: the Fontaine–Wintenberger field-of-norms isomorphism between the absolute Galois groups of $\\mathbb{Q}_p(\\zeta_{p^\\infty})$ and $\\mathbb{F}_p((\\pi))$ is, in retrospect, the first tilting equivalence between perfectoid spaces; the slides trace the period ring construction $B^+(L)$ as the completion of $W(O_L)[1/p]$ and its role in parametrizing untilts.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://swc-math.github.io/aws/2017/2017WeinsteinNotes.pdf","title":"Jared Weinstein","note":"Jared Weinstein, adic spaces for perfectoid geometry. Key computation: Theorem 2.3.2 — the map $I\\mapsto(W(K^\\circ)/I)[1/p]$ is a bijection between degree-1 primitive ideals of $W(K^\\circ)$ and isomorphism classes of untilts of the perfectoid field $K$ ($I=(p)$ giving the trivial untilt); Theorem 2.3.5 (FF11) — for algebraically closed $C$ the closed maximal ideals of $B_C$ parametrize untilts, and $X_K=Y_K/\\varphi^{\\mathbb{Z}}$ with $Y_K=\\mathrm{Spa}(W(K^\\circ))\\setminus\\{|p[\\omega]|=0\\}$ is the Fargues–Fontaine curve.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/DAG2022/lecture2.pdf","title":"Dominic Joyce","note":"Dominic Joyce, derived algebraic geometry background lectures. Key computation: derived Bézout — for projective curves $C,D\\subset\\mathbb{CP}^2$ of degrees $m,n$, the derived intersection $C\\cap D$ is a proper quasi-smooth derived scheme with $\\mathrm{vdim}=0$ and virtual count $[X]^{\\mathrm{virt}}=mn$ even when $\\dim X=1$; the cdga model $A^*=\\mathbb{C}[x_1..x_m;y_1..y_n]$ with $dy_i=p_i$ gives $H^0=\\mathbb{C}[x]/(p_i)$, $H^{-1}=$ dependencies, so $x^2=y^2=0$ and $x^2=y^2=x^2+y^2=0$ are distinct derived schemes.","date":""},{"tags":["rochester.edu"],"category":"rochester.edu","url":"https://www.sas.rochester.edu/mth/sites/doug-ravenel/otherpapers/uio-chromatic.pdf","title":"John Rognes","note":"John Rognes, chromatic homotopy theory course notes. Key computation: the thick subcategory theorem (Hopkins–Smith) states every thick subcategory $T\\subset \\mathrm{Ho}(\\mathrm{Sp}^\\omega_p)$ of finite $p$-local spectra equals $\\mathrm{Ho}(\\mathrm{Sp}^\\omega_{\\ge n})$ for some $0\\le n\\le\\infty$; Mitchell's $F(n)$ has $H^*(F(n);\\mathbb{F}_p)$ free over $A(n-1)$ with $K(m)_*(F(n))=0$ for $m<n$ and $K(n)_*(F(n))\\neq0$, so $\\mathrm{type}(F(n))=n$, and Ravenel's result gives $\\dim K(n)_*(F)\\le\\dim K(n+1)_*(F)$, i.e. $K(n+1)_*(F)=0\\Rightarrow K(n)_*(F)=0$.","date":""},{"tags":["uchicago.edu"],"category":"uchicago.edu","url":"https://math.uchicago.edu/~amathew/notes.pdf","title":"Akhil Mathew","note":"Akhil Mathew, perfectoid spaces course notes. Key computation: Theorem 157 (Scholze) — over the perfectoid valuation ring $V=K^\\circ$ of a perfectoid field, any almost finitely generated $V$-module $M$ satisfies $M\\approx V/I_{\\gamma_1}\\oplus V/I_{\\gamma_2}\\oplus\\cdots$ for a unique nondecreasing sequence $\\gamma_i\\in\\mathbb{R}_{\\ge0}$ with $\\gamma_i\\to1$, where $I_\\gamma=\\{x\\in V:|x|\\le\\gamma\\}$ (or $<\\gamma$), and every almost finitely generated projective module is $M\\approx V^n$ for a unique $n\\ge0$.","date":""},{"tags":["commelin.net"],"category":"commelin.net","url":"https://math.commelin.net/files/condmath.pdf","title":"Johan Commelin","note":"Johan Commelin, condensed mathematics seminar: condensed abelian groups form an abelian category satisfying AB4*/AB6 with a fully faithful embedding $D^b(\\mathrm{LCA})\\to D(\\mathrm{Cond}(\\mathrm{Ab}))$ preserving Pontryagin duality. Key computation: for two completions $\\mathbb{Q}_v,\\mathbb{Q}_v'$ of $\\mathbb{Q}$, derived solidification computes $\\mathbb{Q}_v\\otimes^L\\mathbb{Q}_v'$; the structure theorem $0\\to\\mathbb{R}^n\\oplus C\\to A\\to D\\to0$ for $A\\in\\mathrm{LCA}$ yields $R\\mathrm{Hom}(A,B)$ via the compact-open topology compatible with internal Hom, so condensed cohomology of a compact Hausdorff $S$ with $\\mathbb{Z}$-coefficients equals sheaf cohomology while higher real coefficients vanish.","date":""},{"tags":["strickland1.org"],"category":"strickland1.org","url":"https://strickland1.org/talks/survey_talk.pdf","title":"Neil Strickland","note":"Neil Strickland, recent progress in chromatic homotopy theory: reports the disproof of Ravenel's Telescope Conjecture (Burklund–Hahn–Levy–Schlank 2023). Key computation: the telescope conjecture fails for height $n>1$ while being true for $n=0,1$; equivalently $K(p,\\le n)_*(X)=0$ does not force $X$ to be a filtered colimit of finite spectra $X_\\alpha$ with $K(p,\\le n)_*(X_\\alpha)=0$.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://mariusnielsen.github.io/FormalGroups.pdf","title":"Marius Nielsen","note":"Marius Nielsen, chromatic homotopy theory from the perspective of formal groups. Key computation: Quillen's theorem $L\\cong MU_*$ identifies $FGL=\\mathrm{Spec}(L)$ with $MU$, giving $\\mathrm{Comod}_{MU_*MU}\\cong\\mathrm{QCoh}(M_{fg})$ and $E_2^{s,2t}=H^s(M_{fg},\\omega^t)$ in the Adams spectral sequence; the thick subcategory theorem states $C\\subset \\mathrm{Sp}^\\omega_{(p)}$ is thick iff $C$ consists of spectra of height $\\le n$ for some $n$, via the height filtration $M_{fg}^{\\ge n}\\subset M_{fg}$ with $[p]$-multiplication factoring through $\\mathrm{Frob}^n$.","date":""},{"tags":["duke.edu"],"category":"duke.edu","url":"https://sites.math.duke.edu/~kgw/8803_Stable/L1_Introduction.pdf","title":"C","note":"C. Westerland, introduction to stable homotopy theory. Key computation: the EHP fibration $S^n\\to\\Omega S^{n+1}\\to\\Omega S^{2n+1}$ with the James construction gives the split $S^{2n-1}\\to\\Omega\\Sigma S^n$, so the EHP spectral sequence $E^1_k=\\pi_k(S^{2n+1})\\Rightarrow\\pi_*(S^{n+1})$ computes the 2-primary stable stems; concretely the $e$-invariant element $\\pi_{4n-1}(S)\\otimes\\mathbb{Z}\\cong\\mathbb{Z}_{e(n)}$ is classified by the degree of the induced map on $S^{4n-1}$.","date":""},{"tags":["uchicago.edu"],"category":"uchicago.edu","url":"https://math.uchicago.edu/~amathew/256y.pdf","title":"A","note":"A. Mathew, stable homotopy theory course notes. Key computation: classification of the number $r(n)$ of linearly independent vector fields on $S^{n-1}$ by the Radon–Hurwitz number $\\rho(n)-1$: writing $n=(2a+1)\\cdot2^{4b+c}$ with $c=0,1,2,3$, then $\\rho(n)=2^c+8b$, and $\\beta(n)=\\rho(n)-1$ independent nowhere-vanishing fields exist, equality holding up to the $J$-image; concretely $\\widetilde{KO}(\\mathbb{RP}^n)=\\mathbb{Z}/2^c\\oplus\\mathbb{Z}/2^{\\lceil n/2\\rceil}$ computed from $KO(\\mathbb{CP}^n)=\\mathbb{Z}[u]/(u^{n+1})$.","date":""},{"tags":["columbia.edu"],"category":"columbia.edu","url":"https://www.math.columbia.edu/~calebji/stable-notes.pdf","title":"Caleb Ji","note":"Caleb Ji, spectra and the stable homotopy category. Key computation: the homotopy groups of a spectrum $X$ are $\\pi_k(X)=\\mathrm{colim}_n\\pi_{k+n}(X_n)$, and the smash product $X\\wedge Y$ with latching structure $(X\\wedge Y)_n=(X\\wedge Y)_n^{\\mathrm{lat}}\\cup\\cdots$ shows $S^0\\wedge S^0=S^0$ gives $\\pi_*(S)$ as the initial stable homotopy ring.","date":""},{"tags":["ac.uk"],"category":"ac.uk","url":"https://people.maths.ox.ac.uk/joyce/DAG2022/DAG11+12.pdf","title":"Dominic Joyce","note":"Dominic Joyce, derived algebraic geometry foundations and higher stacks. Key computation: for the derived zero locus $X=s^{-1}(0)$ of a section $s$ of a vector bundle $E\\to V$, $L_X\\simeq[E^*|_X\\xrightarrow{Ds}T^*V|_X]$, perfect in degrees $[-1,0]$; explicitly $A^*=K[z_1..z_n,y_1..y_m,x_1..x_l]$ with $\\deg z=0,\\deg y=-1,\\deg x=-2$, $dy_j=f_j(z)$, $dx_i=\\sum_j g_{ij}(z)y_j$, $d^2=0$ forcing $\\sum_j g_{ij}(z)f_j(z)=0$, so $H^0(A^*)=K[z]/(f_1=0,..,f_m=0)$ classifies the classical truncation $X=t_0(X)\\subset\\mathbb{A}^n$, with $L_X\\simeq[\\mathcal{O}_X^m\\xrightarrow{\\partial f_j/\\partial z_k}\\mathcal{O}_X^n]$ in degrees $[-1,0]$.","date":""},{"tags":["utoronto.ca"],"category":"utoronto.ca","url":"https://www.fields.utoronto.ca/talk-media/1/73/57/slides.pdf","title":"Raphaël Ponge","note":"Raphaël Ponge, semiclassical analysis on spectral triples extending the semiclassical Weyl law and Connes' integration formula to $p$-summable spectral triples without Hölder-regularity. Key computation: the semiclassical Weyl law $\\lim_{h\\to0^+}h^n N^-(h^2\\Delta_g+V)=\\int_M V_-(x)^{n/2}\\,d\\nu_g(x)$ (and $\\lim h^n N^-(h^{2q}\\Delta_g^q+V)=\\int V_-^{n/2q}$); the main theorem — if for all $a\\in A$, $a>0$, $\\lim_{j\\to\\infty}j^{-2/p}\\lambda_j(aD^2a)=\\tau(a^{-p/2})$, then $\\lim_{j}j^{-2/p}\\lambda_j(|D|^{-q/2}a|D|^{-q/2})=\\tau(a^{q/p})$ for all $q>0$, and for $V^*=V\\in A$, $\\lim_{h\\to0^+}h^p N^-(h^2D^2+V)=\\mathrm{Res}_{z=p}\\,\\mathrm{Tr}(V_-)^{z/2}|D|^{-z}$, recovering Connes' integration formula $\\int f=\\mathrm{Res}_{z=p}\\mathrm{Tr}(f|D|^{-z})$.","date":""},{"tags":["shaybm.com"],"category":"shaybm.com","url":"https://shaybm.com/chromatic-seminar/notes/chromatic-homotopy-nilpotence-thick-subcategories.pdf","title":"chromatic homotopy seminar notes","note":"chromatic homotopy seminar notes, the nilpotence theorem and the thick subcategory theorem (Devinatz–Hopkins–Smith). Key computation: Theorem 9 (Hopkins–Smith) classifies thick subcategories of finite $p$-local spectra as exactly the $\\mathcal{C}_{\\ge n}=\\{X:K(m)_*(X)=0\\text{ for }m<n\\}$; the Nilpotence theorem states $MU$ detects nilpotence ($x\\in\\pi_*(R)$ nilpotent iff $MU_*x$ nilpotent iff $MU_*x=0$ in $MU_*R$), so a self-map $f$ vanishing on $K(n)_0R$ forces $f$ nilpotent, and the enumeration proceeds by showing $C_{n+1}\\subsetneq C_n$ is proper via Morava $K$-acyclicity.","date":""},{"tags":["chromotopy.org"],"category":"chromotopy.org","url":"https://chromotopy.org/teaching/Fall2012/seminar/constantin-seminar.pdf","title":"Constantin Teleman","note":"Constantin Teleman, chromatic spectral sequence and stable homotopy of the spheres seminar notes: develops the $MU$-Adams (chromatic) spectral sequence $E_2=H^*(M_{fg},\\omega^*)$ and computes $\\pi_*L_{K(1)}S$. Key computation: for $S_1=\\mathbb{G}_m(\\mathbb{Z}_p^\\wedge)$, $(E_1)_*=\\mathbb{Z}_p^\\wedge[u^{\\pm1}]$; splitting $S_1=C_{p-1}\\times\\mathbb{Z}_p^\\wedge$ ($p$ odd), $H^*(C_{p-1};\\mathbb{Z}_p^\\wedge[u^{\\pm1}])=\\mathbb{Z}_p^\\wedge[u^{\\pm(p-1)}]$, and $H^i(\\mathbb{Z}_p^\\wedge;A)=\\mathbb{Z}_p^\\wedge/(kp)$ for $i=2k(p-1)-1$, $k\\ne0$, else $0$; the truncated chromatic spectral sequence gives the $E(q)$-local sphere agreeing with true stable stems within a finite, monotonically increasing radius (chromatic convergence), with stabilizer group $S_q\\subset O_q=\\mathbb{F}_{p^q}\\langle S\\rangle/(S^q=p,\\,Sw=w^\\varphi S)$ and $L_{K(n)}S\\simeq E_n^{hS_n}$.","date":""},{"tags":["github.io"],"category":"github.io","url":"https://dskern.github.io/Talks/SAG_Overview.pdf","title":"facet
