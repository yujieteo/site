<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<meta name="description" content="Draw scaled free body diagrams in the browser: beams, rods, lines and plates on shared joints, with point forces, moments, distributed loads, self-weight, reactions and supports stored as data in mm, N and N·mm. No solver.">
<title>FBD Drawer</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#6e6e73;--surface:#f5f5f7;--border:#d2d2d7;--focus:#0071e3;--grid:#ededf0;--grid-major:#dadae0;--beam:#d6d6db;--plate:#f0f0f3;--sel:#0071e3;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
--k-body:var(--fg);--k-force:var(--fg);--k-moment:var(--fg);--k-dist:var(--fg);--k-reaction:var(--fg);--k-support:var(--fg);--k-dim:var(--fg);--k-marker:var(--fg);--k-triad:var(--fg);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d1f;--fg:#f5f5f7;--muted:#a1a1a6;--surface:#2c2c2e;--border:#48484a;--focus:#2997ff;--grid:#29292c;--grid-major:#38383c;--beam:#4a4a4f;--plate:#2f2f33;--sel:#2997ff}}
:root[data-theme="dark"]{--bg:#1d1d1f;--fg:#f5f5f7;--muted:#a1a1a6;--surface:#2c2c2e;--border:#48484a;--focus:#2997ff;--grid:#29292c;--grid-major:#38383c;--beam:#4a4a4f;--plate:#2f2f33;--sel:#2997ff;color-scheme:dark}
.colour{--k-force:#c62828;--k-moment:#7b1fa2;--k-dist:#1565c0;--k-reaction:#2e7d32;--k-support:#6d4c41;--k-dim:#00838f;--k-marker:#ef6c00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .colour{--k-force:#ef5350;--k-moment:#ce93d8;--k-dist:#64b5f6;--k-reaction:#81c784;--k-support:#bcaaa4;--k-dim:#4dd0e1;--k-marker:#ffb74d}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#app{display:grid;height:100vh;height:100dvh;grid-template-columns:minmax(0,1fr) 20rem;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"bar bar" "stage panel" "foot foot"}
#bar{grid-area:bar;display:flex;align-items:center;gap:.25rem;padding:.25rem .5rem;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin;min-width:0}
#bar h1{font-size:.95rem;margin:0 .5rem 0 .25rem;white-space:nowrap;letter-spacing:-.01em}
.group{display:flex;gap:2px;padding-right:.35rem;margin-right:.1rem;border-right:1px solid var(--border);flex:none}
.group:last-child{border-right:0}
.tb{min-width:44px;min-height:44px;padding:0 .55rem;border:1px solid transparent;border-radius:.5rem;background:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:.25rem;touch-action:manipulation}
.tb:hover{background:var(--surface)}
.tb[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tb:disabled{opacity:.4;cursor:default;background:none}
.tb svg{width:20px;height:20px;flex:none}
#stage{grid-area:stage;position:relative;min-width:0;min-height:0;overflow:hidden}
#canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
#status{position:absolute;left:.5rem;bottom:.35rem;font:12px/1.3 var(--mono);color:var(--muted);pointer-events:none;background:color-mix(in srgb,var(--bg) 80%,transparent);padding:.1rem .3rem;border-radius:.25rem}
#hint{position:absolute;right:.5rem;top:.5rem;max-width:min(24rem,70%);font-size:12px;color:var(--muted);pointer-events:none;text-align:right;background:color-mix(in srgb,var(--bg) 85%,transparent);padding:.15rem .35rem;border-radius:.25rem}
#hint:empty{display:none}
#panel{grid-area:panel;border-left:1px solid var(--border);overflow-y:auto;overscroll-behavior:contain;padding:.25rem .75rem 1rem;min-width:0}
#panel h2{font-size:.95rem;margin:.6rem 0 .4rem}
#panel h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:.9rem 0 .3rem}
#panel p{margin:.35rem 0;color:var(--muted);font-size:.85rem}
.row{display:grid;grid-template-columns:minmax(0,7rem) minmax(0,1fr);gap:.4rem;align-items:center;margin:.25rem 0}
.row>label,.row>span{font-size:.85rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis}
.row input[type=text],.row select{width:100%;min-height:36px;padding:.25rem .45rem;border:1px solid var(--border);border-radius:.4rem;background:var(--bg);min-width:0}
.row input.bad{border-color:#d32f2f;outline-color:#d32f2f}
.checks{display:flex;flex-wrap:wrap;gap:.25rem .8rem;margin:.3rem 0}
.checks label{display:inline-flex;align-items:center;gap:.3rem;font-size:.85rem;min-height:32px}
.checks input{width:18px;height:18px}
.seg{display:flex;flex-wrap:wrap;gap:2px;margin:.25rem 0}
.seg button{flex:1 1 auto;min-height:36px;border:1px solid var(--border);background:var(--bg);border-radius:.4rem;padding:0 .5rem}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btns{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0}
.btns button{min-height:40px;padding:0 .75rem;border:1px solid var(--border);border-radius:.5rem;background:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.err{color:#d32f2f;font-size:.8rem;min-height:1em;margin:.2rem 0}
#sheet-toggle{display:none}
footer{grid-area:foot;display:flex;flex-wrap:wrap;gap:.2rem 1rem;align-items:center;padding:.3rem .75rem;padding-bottom:max(.3rem,env(safe-area-inset-bottom));border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
footer a{color:inherit}
.menu{position:relative;flex:none}
.menu>summary{list-style:none}
.menu>summary::-webkit-details-marker{display:none}
.menu-pop{position:fixed;z-index:10;background:var(--bg);border:1px solid var(--border);border-radius:.6rem;box-shadow:0 8px 28px rgb(0 0 0/.18);padding:.35rem;display:grid;gap:2px;min-width:14rem;max-height:70vh;overflow:auto}
.menu-pop button,.menu-pop label{min-height:40px;text-align:left;border:0;background:none;border-radius:.4rem;padding:0 .6rem;display:flex;align-items:center;gap:.4rem}
.menu-pop button:hover{background:var(--surface)}
.menu-pop hr{border:0;border-top:1px solid var(--border);margin:.2rem 0}
#toast{position:fixed;left:50%;bottom:4rem;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.45rem .8rem;border-radius:.5rem;font-size:.85rem;max-width:min(90vw,32rem);z-index:20;white-space:pre-wrap}
#toast[hidden]{display:none}
.hit{fill:none;stroke:#000;stroke-opacity:0;pointer-events:stroke}
.hitf{fill:#000;fill-opacity:0;stroke:#000;stroke-opacity:0;pointer-events:all}
.sel-halo{fill:none;stroke:var(--sel);stroke-opacity:.35;pointer-events:none}
.handle{fill:var(--bg);stroke:var(--sel);stroke-width:2}
@media (max-width:760px){
#app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"bar" "stage" "panel" "foot"}
#panel{border-left:0;border-top:1px solid var(--border);max-height:42dvh;padding-top:0}
#panel.collapsed{max-height:3rem;overflow:hidden}
#sheet-toggle{display:flex;width:100%;min-height:44px;align-items:center;justify-content:center;gap:.4rem;border:0;background:none;color:var(--muted);position:sticky;top:0;background:var(--bg);z-index:1}
#sheet-toggle::before{content:"";width:2.5rem;height:4px;border-radius:2px;background:var(--border)}
#bar h1{display:none}
footer{font-size:11px}
}
@media (prefers-reduced-motion:no-preference){.tb,.seg button{transition:background .15s}}
</style>
</head>
<body>
<div id="app">
<div id="bar" role="toolbar" aria-label="Drawing tools">
  <h1>FBD Drawer</h1>
  <div class="group" id="tools"></div>
  <div class="group" id="actions"></div>
</div>
<div id="stage">
  <svg id="canvas" aria-label="Drawing canvas" role="img"><g id="grid"></g><g id="scene"></g><g id="overlay"></g></svg>
  <div id="status" aria-live="off"></div>
  <div id="hint"></div>
</div>
<aside id="panel" aria-label="Properties">
  <button id="sheet-toggle" type="button" aria-expanded="true">Properties</button>
  <div id="panel-body"></div>
</aside>
<footer>
  <span>FBD Drawer <span id="app-version"></span></span>
  <a href="https://github.com/yujieteo/site/tree/main/visuals/fbd">Source</a>
  <span>Stored in mm, N and N·mm. No solver: loads and reactions are drawn, not computed.</span>
</footer>
</div>
<div id="toast" role="status" hidden></div>

<script id="fbd-core" data-core>
/* FBD Drawer core: the drawing model, units, validation, serialisation and
   SVG rendering. It touches no DOM, so the tests run it in Node. Geometry is
   stored in canonical units (mm, N, N·mm, N/mm), y up. */
(function (root) {
"use strict";
const VERSION = "1.0.0";
const FORMAT = "fbd-drawer";
const SCHEMA = 1;
const LBF = 4.4482216152605;

/* ---------- units ---------- */
const UNITS = {
  length: { mm: 1, cm: 10, m: 1000, in: 25.4, ft: 304.8 },
  force: { N: 1, kN: 1000, lbf: LBF, kip: 1000 * LBF },
  moment: { "N·mm": 1, "N·m": 1000, "kN·m": 1e6, "lbf·in": LBF * 25.4, "lbf·ft": LBF * 304.8, "kip·ft": 1000 * LBF * 304.8 },
  distributed: { "N/mm": 1, "N/m": 0.001, "kN/m": 1, "lbf/in": LBF / 25.4, "lbf/ft": LBF / 304.8, "kip/ft": 1000 * LBF / 304.8 },
};
const SYSTEM_UNITS = {
  SI: { length: ["mm", "cm", "m"], force: ["N", "kN"], moment: ["N·mm", "N·m", "kN·m"], distributed: ["N/mm", "N/m", "kN/m"] },
  imperial: { length: ["in", "ft"], force: ["lbf", "kip"], moment: ["lbf·in", "lbf·ft", "kip·ft"], distributed: ["lbf/in", "lbf/ft", "kip/ft"] },
};
const ALIASES = {
  length: { mm: "mm", millimetre: "mm", millimetres: "mm", millimeter: "mm", millimeters: "mm", cm: "cm", m: "m", metre: "m", metres: "m", meter: "m", meters: "m",
    in: "in", inch: "in", inches: "in", '"': "in", "″": "in", ft: "ft", foot: "ft", feet: "ft", "'": "ft", "′": "ft" },
  force: { n: "N", newton: "N", newtons: "N", kn: "kN", lbf: "lbf", lb: "lbf", lbs: "lbf", kip: "kip", kips: "kip" },
  moment: { nmm: "N·mm", nm: "N·m", knm: "kN·m", lbfin: "lbf·in", lbin: "lbf·in", inlb: "lbf·in", inlbf: "lbf·in",
    lbfft: "lbf·ft", lbft: "lbf·ft", ftlb: "lbf·ft", ftlbf: "lbf·ft", kipft: "kip·ft", ftkip: "kip·ft" },
  distributed: { "n/mm": "N/mm", "n/m": "N/m", "kn/m": "kN/m", "lbf/in": "lbf/in", "lb/in": "lbf/in", "lbf/ft": "lbf/ft", "lb/ft": "lbf/ft", plf: "lbf/ft", "kip/ft": "kip/ft", klf: "kip/ft" },
};
const unitKey = (u) => u.toLowerCase().replace(/[\s·⋅.*-]/g, "");

function resolveUnit(kind, text) {
  const table = ALIASES[kind];
  const key = unitKey(text);
  if (table[key]) return table[key];
  if (table[text]) return table[text];
  return null;
}

// Parse "2 m", "3 ft 6 in", `3' 6"` or a bare number (in the display unit)
// into canonical units. Returns { value } or { error }; blank gives null.
function parseQuantity(text, kind, unit) {
  const s = String(text ?? "").trim();
  if (!s) return { value: null };
  const re = /\s*([-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[-+]?\d+)?)\s*([^\s\d+\-.][^\s\d]*)?/iy;
  let i = 0, total = 0, sign = 0, m;
  while (i < s.length) {
    re.lastIndex = i;
    m = re.exec(s);
    if (!m || m[0].length === 0) {
      if (/^\s*$/.test(s.slice(i))) break;
      return { error: `Cannot read "${s.slice(i).trim()}" as a ${kind}` };
    }
    let n = Number(m[1]);
    const u = m[2] ? resolveUnit(kind, m[2]) : unit;
    if (!u || !(u in UNITS[kind])) return { error: `Unknown ${kind} unit "${m[2] || unit}"` };
    if (sign === 0) sign = n < 0 || Object.is(n, -0) ? -1 : 1;
    else if (n < 0) return { error: "Only the first part of a compound value may be negative" };
    total += Math.abs(n) * UNITS[kind][u];
    i = re.lastIndex;
  }
  if (sign === 0) return { error: `Cannot read "${s}" as a ${kind}` };
  return { value: sign * total };
}

function parseAngle(text) {
  const s = String(text ?? "").trim().replace(/°|deg(rees?)?$/gi, "").trim();
  if (!s) return { value: null };
  const n = Number(s);
  if (!Number.isFinite(n)) return { error: `Cannot read "${text}" as an angle in degrees` };
  return { value: n };
}

function fmt(x, digits = 6) {
  if (x === null || x === undefined || !Number.isFinite(x)) return "";
  if (Math.abs(x) < 1e-9) return "0";
  const r = Number(x.toPrecision(digits));
  return String(r);
}

function formatQuantity(value, kind, unit, withUnit = true) {
  if (value === null || value === undefined) return "";
  const s = fmt(value / UNITS[kind][unit]);
  return withUnit ? `${s} ${unit}` : s;
}

/* ---------- angles ---------- */
const rad = (d) => d * Math.PI / 180;
const deg = (r) => r * 180 / Math.PI;
function wrap360(a) { a %= 360; if (a < 0) a += 360; return a === 360 ? 0 : a; }
function wrap180(a) { a = wrap360(a); return a > 180 ? a - 360 : a; }
function clean(a) { const r = Math.round(a * 1e9) / 1e9; return Object.is(r, -0) ? 0 : r; }

// Angles in the triad frame: measured from the triad x-axis, positive
// towards its second axis. Stored directions are world angles (CCW from +x).
function toTriad(view, world) { return clean(wrap180(view.triad.ySense * (world - view.triad.rotation))); }
function fromTriad(view, a) { return clean(wrap360(view.triad.rotation + view.triad.ySense * a)); }

/* ---------- document ---------- */
function defaultView() {
  return {
    units: { system: "SI", length: "mm", force: "N", moment: "N·mm", distributed: "N/mm" },
    triad: { visible: true, x: 0, y: 0, rotation: 0, ySense: 1, labels: ["x", "y"], preset: "engineering", aircraftView: null },
    colourByType: false, grid: true, snap: true, angleSnap: 15,
  };
}
function newDoc(title = "Untitled drawing") {
  return { format: FORMAT, version: SCHEMA, title, geometry: { joints: [], bodies: [], loads: [], supports: [], markers: [] }, view: defaultView() };
}

const BODY_TYPES = ["beam", "rod", "line", "polygon"];
const LINE_ROLES = ["construction", "dimension", "leader"];

// Validation and normalisation in one pass: every object is rebuilt with a
// fixed key order so saving is deterministic, and anything unknown, missing
// or dangling is reported with its path instead of being dropped.
function checker() {
  const errors = [];
  const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
  const c = {
    errors,
    err: (p, m) => errors.push(`${p}: ${m}`),
    obj(v, p, keys) {
      if (!isObj(v)) { c.err(p, "expected an object"); return {}; }
      for (const k of Object.keys(v)) if (!keys.includes(k)) c.err(`${p}.${k}`, "unknown field");
      return v;
    },
    num(v, p, def, o = {}) {
      if (v === undefined) { if (def === undefined) c.err(p, "missing number"); return def ?? 0; }
      if (v === null && o.nullable) return null;
      if (typeof v !== "number" || !Number.isFinite(v)) { c.err(p, "expected a number"); return def ?? 0; }
      if (o.min !== undefined && v < o.min) c.err(p, `must be at least ${o.min}`);
      if (o.gt !== undefined && v <= o.gt) c.err(p, `must be greater than ${o.gt}`);
      if (o.int && !Number.isInteger(v)) c.err(p, "must be a whole number");
      return v;
    },
    str(v, p, def, o = {}) {
      if (v === undefined) { if (def === undefined) c.err(p, "missing text"); return def ?? ""; }
      if (v === null && o.nullable) return null;
      if (typeof v !== "string") { c.err(p, "expected text"); return def ?? ""; }
      if (o.nonEmpty && !v) c.err(p, "must not be empty");
      return v;
    },
    bool(v, p, def) {
      if (v === undefined) return def;
      if (typeof v !== "boolean") { c.err(p, "expected true or false"); return def; }
      return v;
    },
    oneOf(v, p, list, def) {
      if (v === undefined && def !== undefined) return def;
      if (!list.includes(v)) { c.err(p, `expected one of ${list.map((x) => JSON.stringify(x)).join(", ")}`); return def ?? list[0]; }
      return v;
    },
    arr(v, p, o = {}) {
      if (v === undefined && o.optional) return [];
      if (!Array.isArray(v)) { c.err(p, "expected a list"); return []; }
      return v;
    },
  };
  return c;
}

function normAt(c, v, p) {
  const a = c.obj(v, p, ["x", "y", "joint", "body", "edge", "s", "n", "centroid"]);
  if ("joint" in a) { c.obj(v, p, ["joint"]); return { joint: c.str(a.joint, `${p}.joint`) }; }
  if ("body" in a && a.centroid !== undefined) {
    c.obj(v, p, ["body", "centroid"]);
    if (a.centroid !== true) c.err(`${p}.centroid`, "must be true when present");
    return { body: c.str(a.body, `${p}.body`), centroid: true };
  }
  if ("body" in a) {
    c.obj(v, p, ["body", "edge", "s", "n"]);
    return { body: c.str(a.body, `${p}.body`), edge: c.num(a.edge, `${p}.edge`, 0, { int: true, min: 0 }), s: c.num(a.s, `${p}.s`), n: c.num(a.n, `${p}.n`, 0) };
  }
  c.obj(v, p, ["x", "y"]);
  return { x: c.num(a.x, `${p}.x`), y: c.num(a.y, `${p}.y`) };
}

function normJoint(c, v, p) {
  const j = c.obj(v, p, ["id", "x", "y"]);
  return { id: c.str(j.id, `${p}.id`, undefined, { nonEmpty: true }), x: c.num(j.x, `${p}.x`), y: c.num(j.y, `${p}.y`) };
}

function normBody(c, v, p) {
  const b = c.obj(v, p, ["id", "type", "joints", "label", "depth", "role", "offset"]);
  const type = c.oneOf(b.type, `${p}.type`, BODY_TYPES);
  const out = { id: c.str(b.id, `${p}.id`, undefined, { nonEmpty: true }), type, joints: c.arr(b.joints, `${p}.joints`).map((j, i) => c.str(j, `${p}.joints[${i}]`)), label: c.str(b.label, `${p}.label`, null, { nullable: true }) };
  if (type === "beam") out.depth = c.num(b.depth, `${p}.depth`, 100, { gt: 0 });
  else if (b.depth !== undefined) c.err(`${p}.depth`, `only a beam has a depth`);
  if (type === "line") {
    out.role = c.oneOf(b.role, `${p}.role`, LINE_ROLES, "construction");
    out.offset = c.num(b.offset, `${p}.offset`, 30);
  } else {
    if (b.role !== undefined) c.err(`${p}.role`, "only a line has a role");
    if (b.offset !== undefined) c.err(`${p}.offset`, "only a line has an offset");
  }
  const need = type === "polygon" ? 3 : 2;
  if (type === "polygon" ? out.joints.length < 3 : out.joints.length !== 2) c.err(`${p}.joints`, type === "polygon" ? "a polygon needs at least 3 joints" : `a ${type} needs exactly ${need} joints`);
  if (new Set(out.joints).size !== out.joints.length) c.err(`${p}.joints`, "a joint may appear only once");
  return out;
}

function normView(c, v, p) {
  const d = defaultView();
  if (v === undefined) return d;
  const w = c.obj(v, p, ["units", "triad", "colourByType", "grid", "snap", "angleSnap"]);
  const u = w.units === undefined ? d.units : c.obj(w.units, `${p}.units`, ["system", "length", "force", "moment", "distributed"]);
  const system = c.oneOf(u.system, `${p}.units.system`, ["SI", "imperial"], "SI");
  const units = { system };
  for (const kind of ["length", "force", "moment", "distributed"]) units[kind] = c.oneOf(u[kind], `${p}.units.${kind}`, SYSTEM_UNITS[system][kind], SYSTEM_UNITS[system][kind][0]);
  const t = w.triad === undefined ? d.triad : c.obj(w.triad, `${p}.triad`, ["visible", "x", "y", "rotation", "ySense", "labels", "preset", "aircraftView"]);
  const labels = t.labels === undefined ? ["x", "y"] : c.arr(t.labels, `${p}.triad.labels`);
  if (labels.length !== 2) c.err(`${p}.triad.labels`, "expected two axis labels");
  const preset = c.oneOf(t.preset, `${p}.triad.preset`, ["engineering", "aircraft"], "engineering");
  const triad = {
    visible: c.bool(t.visible, `${p}.triad.visible`, true), x: c.num(t.x, `${p}.triad.x`, 0), y: c.num(t.y, `${p}.triad.y`, 0),

/* ---------- keyboard (desktop extra layer) ---------- */
document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName);
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "z") { if (typing) return; e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === "y") { if (typing) return; e.preventDefault(); redo(); return; }
  if (typing) return;
  if (mod && e.key.toLowerCase() === "d") { e.preventDefault(); if (sel.length) mutate(() => { sel = duplicate(sel); }); return; }
