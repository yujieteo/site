<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{title}</title>
  <script>try {{ var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; }} catch (e) {{}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="{root}static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{root}favicon.ico" sizes="16x16">
  <link rel="stylesheet" href="{root}static/css/style.css">
  <meta name="site-corpus" content="{root}corpus.json">
  <meta name="site-corpus-revision" content="{corpus_revision}">
  <script type="module" src="{root}static/js/webmcp.js"></script>
  <script type="module" src="{root}static/js/fade.js"></script>
  <script type="module" src="{root}static/js/site-search.js"></script>
  <script type="module" src="{root}static/js/shell.js"></script>
  <noscript><style>.site-search {{ display: none; }}</style></noscript>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="site-shell{shell_class}">
    <header class="site-header">
      <a class="site-name" href="{root}index.html">{name}</a>
      <div class="site-search" data-site-search>
        <button type="button" class="site-search-trigger" data-site-search-open
                aria-haspopup="dialog" aria-controls="site-search-dialog">
          <svg class="site-search-icon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8.5" cy="8.5" r="5.75" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="m13 13 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
          <span class="site-search-label">Search site</span>
          <kbd class="key-hint site-search-shortcut" data-site-search-shortcut aria-hidden="true">Ctrl K</kbd>
        </button>
        <dialog class="site-search-dialog" id="site-search-dialog" aria-label="Search the site">
          <form class="site-search-form" role="search" data-site-search-form>
            <svg class="site-search-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="8.5" cy="8.5" r="5.75" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="m13 13 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
            <label class="visually-hidden" for="site-search-input">Search the whole site</label>
            <input type="search" id="site-search-input" class="site-search-input"
                   placeholder="Search notes, papers, posts…" autocomplete="off" spellcheck="false"
                   enterkeyhint="go" role="combobox" aria-expanded="false" aria-autocomplete="list"
                   aria-controls="site-search-results">
            <button type="button" class="site-search-close" data-site-search-close>
              <span class="key-hint" aria-hidden="true">esc</span><span class="site-search-close-label">Close</span>
            </button>
          </form>
          <div class="site-search-body">
            <p class="site-search-status" data-site-search-status aria-live="polite" aria-atomic="true">Search notes, paper links, blog posts, resources, visuals and media.</p>
            <ul class="site-search-results" id="site-search-results" role="listbox"
                aria-label="Search results"></ul>
          </div>
          <p class="key-hint site-search-footer" aria-hidden="true"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></p>
        </dialog>
      </div>
      <button type="button" class="nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="site-nav" hidden>
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false"><path d="M3 6h14M3 10h14M3 14h14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
        <span class="nav-toggle-label">Menu</span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Primary">
        <a href="{root}index.html"{aria_home}>Home</a>
        <a href="{root}about.html"{aria_about}>About</a>
        <a href="{root}papers.html"{aria_paper_links}>Paper Links</a>
        <a href="{root}notes.html"{aria_notes}>Notes</a>
        <a href="{root}media/index.html"{aria_media}>Media</a>
        <a href="{root}blog.html"{aria_blog}>Blog</a>
        <a href="{root}visuals.html"{aria_visuals}>Visuals</a>
      </nav>
    </header>
    <main id="main-content" tabindex="-1">{content}</main>
    <footer class="site-footer">
      <p class="footer-links">
        <a href="{root}colophon.html#ai-assistance">Made with the assistance of AI</a>
        <a href="{root}colophon.html">How this site is built</a>
        <a href="https://github.com/yujieteo/site">Source on GitHub</a>
      </p>
      <div class="theme-switch" role="group" aria-label="Colour theme" data-theme-switch hidden>
        <button type="button" data-theme-choice="system" aria-pressed="true">System</button>
        <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
      </div>
    </footer>
  </div>
</body>
</html>
