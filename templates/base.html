<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{title}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{root}static/css/style.css">
  <meta name="site-corpus" content="{root}corpus.json">
  <meta name="site-corpus-revision" content="{corpus_revision}">
  <script type="module" src="{root}static/js/webmcp.js"></script>
  <script type="module" src="{root}static/js/fade.js"></script>
  <script type="module" src="{root}static/js/site-search.js"></script>
  <noscript><style>.site-search {{ display: none; }}</style></noscript>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="site-shell{shell_class}">
    <header class="site-header">
      <a class="site-name" href="{root}index.html">{name}</a>
      <p class="site-tagline">{tagline}</p>
      <nav class="site-nav" aria-label="Primary">
        <a href="{root}index.html"{aria_home}>Home</a>
        <a href="{root}about.html"{aria_about}>About</a>
        <a href="{root}papers.html"{aria_paper_links}>Paper Links</a>
        <a href="{root}notes.html"{aria_notes}>Notes</a>
        <a href="{root}media/index.html"{aria_media}>Media</a>
        <a href="{root}blog.html"{aria_blog}>Blog</a>
        <a href="{root}visuals.html"{aria_visuals}>Visuals</a>
      </nav>
      <form class="site-search" role="search" data-site-search>
        <label class="visually-hidden" for="site-search-input">Search the whole site</label>
        <input type="search" id="site-search-input" class="site-search-input"
               placeholder="Search the site…" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="false" aria-autocomplete="list"
               aria-controls="site-search-results" aria-describedby="site-search-hint">
        <kbd class="site-search-key" aria-hidden="true">/</kbd>
        <span class="visually-hidden" id="site-search-hint">Type to search; use the arrow keys to choose a result and Enter to open it. Press slash to jump here.</span>
        <p class="visually-hidden" data-site-search-live aria-live="polite" aria-atomic="true"></p>
        <div class="site-search-panel" data-site-search-panel hidden>
          <p class="site-search-status" data-site-search-status></p>
          <ul class="site-search-results" id="site-search-results" role="listbox"
              aria-label="Site search results"></ul>
        </div>
      </form>
    </header>
    <main id="main-content" tabindex="-1">{content}</main>
    <footer class="site-footer">
      Made with the assistance of AI. <a href="https://github.com/yujieteo">GitHub</a>
    </footer>
  </div>
</body>
</html>
