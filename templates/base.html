<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{title}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{root}static/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="site-name" href="{root}index.html">{name}</a>
      <p class="site-tagline">{tagline}</p>
      <nav class="site-nav" aria-label="Primary">
        <a href="{root}index.html"{aria_home}>Home</a>
        <a href="{root}about.html"{aria_about}>About</a>
        <a href="{root}papers.html"{aria_paper_links}>Paper Links</a>
        <a href="{root}blog.html"{aria_blog}>Blog</a>
      </nav>
    </header>
    <main id="main-content" tabindex="-1">{content}</main>
    <footer class="site-footer">
      Made with the assistance of AI.
    </footer>
  </div>
</body>
</html>
