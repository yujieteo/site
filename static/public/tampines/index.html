function where(s) { return [s.branch, s.unit].filter(Boolean).join(", ") || s.address || "Tampines"; }
function hay(s) {
  return [s.name, s.branch, s.address, ...s.services, ...s.prices.map(p => p.item + " " + (p.job || ""))].join(" ").toLowerCase();
}
DATA.shops.forEach(s => { s.hay = hay(s); });
DATA.categories.forEach(c => { c.hay = [c.label, ...c.words].join(" ").toLowerCase(); });
function matchesIn(s, c) {
  if (!s.cats.includes(c.id) || (state.cat !== "all" && state.cat !== c.id)) return false;
  return state.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => s.hay.includes(w) || c.hay.includes(w));
}
function matches(s) { return DATA.categories.some(c => matchesIn(s, c)); }
function score(s) { return s.rating ? `${s.rating.value.toFixed(1)} (${s.rating.count.toLocaleString("en-SG")})` : "No rating"; }
function trust(s) { return s.rating ? (s.rating.value * s.rating.count + 4.2 * 20) / (s.rating.count + 20) : -1; }
function rank(a, b) { return trust(b) - trust(a) || a.name.localeCompare(b.name); }
function mapUrl(s) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent([s.name, s.unit, s.address || "Tampines Singapore"].filter(Boolean).join(" ")); }

function panel(s) {
  const facts = [["Address", [s.address, s.unit, s.postal && "S" + s.postal].filter(Boolean).join(", ")], ["Hours", s.hours], ["Phone", s.phone], ["Does", s.services.join(", ")], ["Check", s.note]]
    .filter(f => f[1]).map(f => `<dt>${f[0]}</dt><dd>${esc(f[1])}</dd>`).join("");
  const prices = s.prices.length ? `<div class="block"><h3>Prices found</h3><ul class="plist">${s.prices.map(p => `<li><span>${esc(p.item)}</span><span class="amt">${range(p)}</span><span class="src">${esc(p.unit)}${p.scope === "chain" ? " · chain price, not this branch" : ""}${p.date ? " · " + esc(p.date) : ""} · <a href="${safe(p.url)}" target="_blank" rel="noopener">${esc(host(p.url))} ↗</a></span></li>`).join("")}</ul></div>` : `<p class="muted">No published price found. Ask before you commit.</p>`;
  const reviews = s.rating || s.themes.length ? `<div class="block"><h3>Reviews</h3>${s.rating ? `<p>${s.rating.value.toFixed(1)} from ${s.rating.count} reviews on <a href="${safe(s.rating.url)}" target="_blank" rel="noopener">${esc(s.rating.platform)} ↗</a></p>` : ""}${s.themes.length ? `<ul class="themes">${s.themes.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}</div>` : `<p class="muted">No reviews found.</p>`;
  const links = s.sources.filter(safe).map(u => `<a href="${safe(u)}" target="_blank" rel="noopener">${esc(host(u))} ↗</a>`).join(", ");
  const tel = s.phone ? `<a class="button" href="tel:${esc(s.phone.replace(/[^+\d]/g, ""))}">Call</a>` : "";
  const site = safe(s.website) ? `<a class="button" href="${safe(s.website)}" target="_blank" rel="noopener">Website ↗</a>` : "";
  return `<div class="panel"><div class="actions"><a class="button" href="${mapUrl(s)}" target="_blank" rel="noopener">Map ↗</a>${tel}${site}</div><dl>${facts}</dl>${prices}${reviews}${links ? `<p class="muted">Sources: ${links}</p>` : ""}</div>`;
}
function shopRow(s, c) {
  const key = c.id + ":" + s.id;
  const open = state.open === key;
  return `<li><button class="row" type="button" data-id="${key}" aria-expanded="${open}"><span>${esc(s.name)}</span><span class="score">${score(s)}</span><span class="where">${esc(where(s))}</span></button>${open ? panel(s) : ""}</li>`;
}
function renderShops(list) {
  return DATA.categories.map(c => {
    const items = list.filter(s => matchesIn(s, c)).sort(rank);
    return items.length ? `<section id="s-${c.id}"><h2>${esc(c.label)} <span>${items.length}</span></h2><ul class="shops">${items.map(s => shopRow(s, c)).join("")}</ul></section>` : "";
  }).join("");
}
function renderPrices(list) {
  const jobs = new Map();
  for (const s of list) for (const p of s.prices) if (p.job) {
    if (!jobs.has(p.job)) jobs.set(p.job, { cat: s.cats[0], rows: [] });
    jobs.get(p.job).rows.push({ s, p });
  }
  const parts = DATA.categories.map(c => {
    const here = [...jobs].filter(([, j]) => j.cat === c.id);
    if (!here.length) return "";
    const body = here.sort((a, b) => b[1].rows.length - a[1].rows.length || a[0].localeCompare(b[0])).map(([job, j]) => {
      const rows = j.rows.sort((a, b) => from(a.p) - from(b.p));
      const best = from(rows[0].p);
      return `<div class="job"><h3>${esc(job)}</h3><p class="unit">${rows.length > 1 ? "Lowest first" : "One source"}</p><ul class="cmp">${rows.map(({ s, p }) => `<li><button type="button" data-goto="${s.id}">${esc(s.name)}${s.branch ? " · " + esc(s.branch) : ""}</button><span class="amt ${from(p) === best && rows.length > 1 ? "low" : ""}">${range(p)}</span><span class="src">${esc(p.item)}, ${esc(p.unit)} · ${p.scope === "chain" ? "Chain price, not this branch · " : ""}${p.date ? esc(p.date) + " · " : ""}<a href="${safe(p.url)}" target="_blank" rel="noopener">${esc(host(p.url))} ↗</a></span></li>`).join("")}</ul></div>`;
    }).join("");
    return `<section id="p-${c.id}"><h2>${esc(c.label)}</h2>${body}</section>`;
  }).join("");
  return parts || `<p class="none">No published price matches this search. Open Shops and call the shop.</p>`;
}
function render() {
  const list = DATA.shops.filter(matches);
  $("cats").innerHTML = [{ id: "all", label: "All" }, ...DATA.categories].map(c => `<button class="button" type="button" data-cat="${c.id}" data-active="${state.cat === c.id}">${esc(c.label)}</button>`).join("");
  $("v-shops").dataset.active = state.view === "shops";
  $("v-prices").dataset.active = state.view === "prices";
  $("out").innerHTML = !list.length ? `<p class="none">No shop matches this search. Try fewer words, or choose All.</p>` : state.view === "shops" ? renderShops(list) : renderPrices(list);
}
function setCat(id) {
  state.cat = id; state.open = null;
  try { history.replaceState(null, "", id === "all" ? " " : "#" + id); } catch {}
  render();
  document.querySelector(`[data-cat="${id}"]`)?.scrollIntoView({ inline: "center", block: "nearest" });
}
$("q").addEventListener("input", e => { state.q = e.target.value.trim(); state.open = null; render(); });
$("cats").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (b) setCat(b.dataset.cat); });
$("v-shops").addEventListener("click", () => { state.view = "shops"; render(); });
$("v-prices").addEventListener("click", () => { state.view = "prices"; state.open = null; render(); });
$("out").addEventListener("click", e => {
  const go = e.target.closest("[data-goto]");
  if (go) { const s = DATA.shops.find(x => x.id === go.dataset.goto); const key = s.cats[0] + ":" + s.id; state.view = "shops"; state.open = key; render(); document.querySelector(`[data-id="${key}"]`)?.scrollIntoView({ block: "center" }); return; }
  const row = e.target.closest(".row");
  if (!row) return;
  state.open = state.open === row.dataset.id ? null : row.dataset.id;
  render();
  document.querySelector(`[data-id="${row.dataset.id}"]`)?.focus({ preventScroll: true });
});
const start = location.hash.slice(1);
if (DATA.categories.some(c => c.id === start)) state.cat = start;
const priced = DATA.shops.reduce((n, s) => n + s.prices.length, 0);
const rated = DATA.shops.filter(s => s.rating).length;
$("stats").textContent = `${DATA.shops.length} shops. ${priced} prices. ${rated} rated. Checked ${DATA.checked}.`;
$("foot").innerHTML = DATA.foot;
render();
</script>
</body>
</html>
