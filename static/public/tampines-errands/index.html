<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Service shops in Tampines, Singapore, with phone numbers, maps, Google ratings and sourced prices.">
<link rel="icon" href="data:,">
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<title>Tampines Errands</title>
<link rel="stylesheet" href="/tampines-errands/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <a href="/">Yu Jie Teo</a>
    <h1>Tampines errands</h1>
    <p class="meta" id="stats"></p>
  </header>
</div>
<div class="finder">
  <div class="wrap">
    <label for="q">Find a service, job or shop</label>
    <input id="q" type="search" placeholder="Try heel, hem, photocopy, haircut" autocomplete="off" enterkeyhint="search">
  </div>
</div>
<div class="wrap">
  <div class="seg" role="group" aria-label="View">
    <button class="button" id="v-list" type="button"></button>
    <button class="button" id="v-map" type="button">Map</button>
    <button class="button" id="v-prices" type="button">Prices</button>
  </div>
  <div class="tools" id="tools"></div>
  <main id="out" aria-live="polite"></main>
  <footer id="foot"></footer>
</div>
<script src="/tampines-errands/script.js"></script>
</body>
</html>
