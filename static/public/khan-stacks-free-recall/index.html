<div id="app"></div>
<script>
"use strict";
const SECTIONS=["Overview","∞-categories","Sheaves and stacks","The stack of quasi-coherent sheaves","Quotient stacks","Algebraic spaces and stacks","The resolution property","Derived categories","The cotangent complex","Deformation theory of perfect complexes","Moduli of complexes, sheaves, bundles","Cohomology of stacks"];
const TOPICS=[];
function T(id,sec,cue,pre,units,conf){TOPICS.push({id,sec,cue,pre,units,conf:conf||null})}

T("o1",0,"Why moduli theory needs stacks: the two refinements and the goal",[],[
[`Naive moduli space: {gadgets}/equivalence.`,`Def 0.1, p2`],
[`Refinement 1, functor of points: a k-scheme is determined by X : CAlg_{k} → Set.`,`Thm 0.6, p3`],
[`Refinement 2, better quotients: the groupoid [X/R] or [X/G] remembers how points are identified; π_{0} recovers the set quotient.`,`p3–4`],
[`A stack over k is a functor CAlg_{k} → Grpd satisfying conditions.`,`Def 0.7, p4`],
[`Goal: for C smooth proper and G algebraic, MBun_{G}(C) is a smooth algebraic stack.`,`Thm 0.8, p4`],
[`Set-valued π_{0}Bun_{G} behaves badly. Grpd is 2-categorical, so the course uses ∞-categories.`,`0.9–0.10, p4–5`]]);

T("c1",1,"Simplicial sets: the data, and the standard shapes",[],[
[`Δ has objects [n] = {0,…,n} and order-preserving maps. A simplicial set is a functor Δ^{op} → Set.`,`Def 1.1, p5`],
[`Face maps come from δ^{i}, which skips i. Degeneracies come from σ^{i}, which doubles i.`,`Not 1.3, p5`],
[`Standard simplex: Δ^{n}_{k} = Hom_{Δ}([k],[n]). By Yoneda an n-simplex of X is a map Δ^{n} → X.`,`1.5–1.6, p6`],
[`Horn Λ^{n}_{k}: the union of the faces ∂^{j}Δ^{n} for j ≠ k.`,`Ex 1.8, p6`]]);

T("c2",1,"Nerves: when a simplicial set is a category",["c1"],[
[`N(C)_{n} = Fun([n],C): strings c_{0} → … → c_{n}.`,`1.9–1.10, p6`],
[`N : Cat → SSet is fully faithful, with left adjoint τ.`,`Ex 1.11, p7`],
[`A composable pair is a map Λ^{2}_{1} → X. A composition is an extension to Δ^{2}.`,`Def 1.15, p8`],
[`Grothendieck–Segal: X is a nerve iff Hom(Δ^{n},X) → Hom(Λ^{n}_{k},X) is bijective for n ≥ 2, 0 < k < n.`,`Prop 1.16, p8`]],"horn");

T("c3",1,"Kan complexes: the horn condition and what they model",["c2"],[
[`Groupoids: the restriction map is bijective for all 0 ≤ k ≤ n. The outer horns give inverses.`,`Rem 1.17, p8`],
[`Kan complex: surjective for all n ≠ 0 and 0 ≤ k ≤ n.`,`Def 1.18, p8`],
[`N(C) is Kan iff C is a groupoid.`,`Def 1.18, p8`],
[`Milnor: the homotopy category of CW complexes matches that of Kan complexes, via Sing. Objects are points, morphisms are paths.`,`Thm 1.19, p9`]],"horn");

T("c4",1,"∞-categories as weak Kan complexes",["c3"],[
[`Weak Kan complex: surjective on inner horns only, n ≥ 2 and 0 < k < n.`,`Def 1.20, p9`],
[`Homotopy f ∼ g is a 2-simplex with edges f, g and an identity. h(X) has objects X_{0} and homotopy classes of morphisms; h(X) ≃ τ(X).`,`Con 1.21, p9`],
[`Isomorphism: invertible up to homotopy. ∞-groupoid: every morphism is an isomorphism.`,`Def 1.22, p10`],
[`Joyal: a weak Kan complex is an ∞-groupoid iff it is a Kan complex.`,`Thm 1.23, p10`],
[`Hom(X,Y) acts as the functor category. Maps_{X}(x,y) is a Kan complex, the fibre of Hom(Δ^{1},X) → X × X.`,`Rem 1.24, p10`]],"horn");

T("c5",1,"The ∞-categories Grpd and Kan: how 2-categories and anima enter",["c4"],[
[`Duskin nerve N^{D}(C): objects, 1-morphisms f_{i,j}, and 2-morphisms μ_{i,j,k} : f_{j,k} ∘ f_{i,j} ⇒ f_{i,k}.`,`Con 1.27, p10–11`],
[`Duskin: N^{D}(C) is weak Kan iff C is a (2,1)-category.`,`Thm 1.28, p11`],
[`Grpd is the (2,1)-category of groupoids, viewed as an ∞-category through N^{D}.`,`Ex 1.30, p11`],
[`Kan_{•}: simplices are Kan complexes, maps and coherent homotopies. It is the homotopy coherent nerve, later the ∞-category of anima.`,`1.31–1.32, p11–12`],
[`N(Set) → Kan_{•} is fully faithful onto X with π_{i}(X) = 0 for i > 0.`,`Rem 1.33, p12`]]);

T("s1",2,"The topology generated by a class S",[],[
[`C has fibre products and finite coproducts; coproducts are universal and disjoint.`,`Con 2.1, p12`],
[`S contains isomorphisms and is stable under composition, base change and finite coproducts.`,`Con 2.1, p12`],
[`A sieve on X covers iff it contains a finite family {X_{i} → X} with ∐X_{i} → X in S.`,`Con 2.1, p12`],
[`Big étale site: Sch/X, generated by étale surjections. Small étale site: étale U → X.`,`2.3–2.4, p13`]]);

T("s2",2,"The sheaf condition in an ∞-category, and the definition of a stack",["s1","c5"],[
[`Limit: (V,α) with α : V_{cst} → F such that Maps(V′,V) → Maps_{Fun}(V′_{cst},F) is invertible.`,`Def 2.5, p13`],
[`Sheaf, part (i): F sends finite coproducts to products.`,`Def 2.6, p13`],
[`Sheaf, part (ii): for f : U → X in S, F(X) → lim_{[n]∈Δ} F(U_{n}) is invertible, with U_{•} the Čech nerve.`,`Def 2.6, p13`],
[`Truncation: in a 1-category the limit is the equalizer of V^{0} ⇉ V^{1}; in a (2,1)-category it is the 2-limit through V^{2}.`,`Prop 2.8, p14`],
[`A stack is a sheaf of groupoids on Sch for the étale topology.`,`Def 2.10, p14`]]);

T("s3",2,"Bases: why stacks can be defined on affines",["s2"],[
[`C_{0} ⊆ C is a basis if it is closed under fibre products and finite coproducts, and every X has (Y_{i} → X) with Y_{i} ∈ C_{0} and ∐Y_{i} → X in S.`,`Def 2.13, p15`],
[`Restriction gives Shv(C;V) ≃ Shv(C_{0};V); for example Shv(Sch;V) ≃ Shv(Aff;V).`,`2.11, 2.14, p14–15`],
[`Right Kan extension: F(X) ≃ lim_{(Y,f)} F(Y) over Y ∈ C_{0}, f : i(Y) → X.`,`Def 2.15, p15`],
[`F is a sheaf iff F|C_{0} is a sheaf and F is right Kan extended from C_{0}.`,`Thm 2.16, p15`]]);

T("q1",3,"Why QCoh needs cartesian fibrations",["c5"],[
[`(g∘f)^{*} ≃ f^{*}g^{*} only up to invertible transformation, so QCoh is not a functor to the 1-category of categories.`,`p16`],
[`f̃ : C̃ → D̃ is π-cartesian if Hom(E,C̃) → Hom(E,D̃) ×_{Hom(πE,πD̃)} Hom(πE,πC̃) is bijective: terminal among lifts of f with target D̃.`,`Def 3.1, p16`],
[`Cartesian fibration: every f : C → π(E) has a π-cartesian lift with target E.`,`Def 3.2, p16`],
[`QCohSch → Sch: pairs (X,F); a morphism is f with φ : f^{*}F → F′.`,`Ex 3.3, p16`],
[`Grothendieck: Fun(C^{op},Cat) ≃ Cart(C). The two directions are unstraightening and straightening.`,`3.5–3.6, p17`]]);

T("q2",3,"The descent criterion: hypotheses and conclusion",["s2"],[
[`Tot is the limit over Δ. A split cosimplicial diagram gives a limit diagram.`,`3.11, 3.13, p18`],
[`Hypothesis 1: F : C^{−1} → C^{0} is conservative.`,`Thm 3.14(i), p18`],
[`Hypothesis 2 (Beck–Chevalley): the d^{0} have right adjoints that commute with the vertical arrows.`,`Thm 3.14(ii), p18`],
[`Hypothesis 3: F preserves totalizations of F-split cosimplicial diagrams.`,`Thm 3.14(iii), p19`],
[`Conclusion: C^{−1} → Tot(C^{•}) is an equivalence. It is a form of Barr–Beck–Lurie.`,`Thm 3.14, p19`]]);

T("q3",3,"Faithfully flat descent for modules and for QCoh: the proof steps",["q2","q1"],[
[`R ↦ Mod_{R} is a flat sheaf. Faithful flatness gives conservativity of φ^{*}.`,`Thm 3.16, p19`],
[`Flat base change gives the commuting adjoints.`,`Thm 3.16(ii), p19`],
[`Totalizations in 1-categories are equalizers, and φ^{*} is exact, so it preserves them.`,`Thm 3.16(iii), p20`],
[`Finite products: the zero ring has trivial module category, and Mod_{R1×R2} ≃ Mod_{R1} × Mod_{R2}.`,`p20`],
[`For QCoh use: f faithfully flat quasi-compact ⇒ f^{*} conservative. So QCoh has étale (even fpqc) descent.`,`3.9, 3.17, p17, 20`],
[`QCoh^{≃} is a stack, because (−)^{≃} is a right adjoint and preserves limits.`,`Cor 3.10, p17`]]);

T("q4",3,"Quasi-coherent sheaves on a stack: definition and unpacked data",["q3","s3"],[
[`QCoh(X) ≃ lim_{(R,x)} Mod_{R} for a scheme, since QCoh is right Kan extended from Aff.`,`3.18–3.19, p21`],
[`For a stack, QCoh is defined as the right Kan extension of Spec R ↦ Mod_{R} along Aff ↪ Stk.`,`Def 3.20, p21`],
[`The data: an R-module F(x) for each R-point x.`,`Rem 3.21, p21`],
[`And isomorphisms F(x) ⊗_{R} R′ ≃ F(x′), satisfying a cocycle condition.`,`Rem 3.21, p21`]]);

T("g1",4,"Groupoid objects and effective epimorphisms",["s2"],[
[`Groupoid object: U_{•} with a cartesian square for each partition [n] = S ∪ S′ with S ∩ S′ a single element.`,`Def 4.1, p22`],
[`U_{0} is objects, U_{1} is morphisms. Ordered partitions fill inner horns (composition); unordered ones fill outer horns (inverses).`,`Rem 4.2, p23`],
[`Effective epi: X is the geometric realization of the Čech nerve of U → X.`,`Def 4.7, p24`],
[`Lurie: groupoid objects in Stk_{∞} ≃ effective epis, by U_{•} ↦ (U_{0} ↠ |U_{•}|), with inverse the Čech nerve.`,`Thm 4.9, p24`],
[`In Stk_{∞}, effective epi means étale-locally surjective. For smooth f of schemes it means surjective.`,`4.10–4.11, p24`]],"epi");

T("g2",4,"Group objects and actions, simplicially",["g1"],[
[`Group object: a groupoid object with G_{0} terminal.`,`Def 4.12, p24`],
[`Action on U: groupoid U_{•} with U_{0} ≃ U and U_{•} → G_{•}, with squares cartesian for all [m] → [n] sending 0 ↦ 0.`,`Def 4.14, p25`],
[`Hence U_{n} ≃ G^{×n} × U, giving ⋯ G × G × U ⇉ G × U ⇉ U.`,`Rem 4.15, p25`],
[`d_{0} is the action, d_{1} the projection, s_{0} = (e, id).`,`4.15–4.16, p25`],
[`Trivial action: U^{triv}_{•} = G_{•} ×_{G0} U, where the action map is also the projection.`,`Def 4.17, p25–26`]]);

T("g3",4,"Torsors: the two conditions and triviality",["g2"],[
[`G-torsor: G-equivariant π : U → X with X trivially acted on.`,`Def 4.19, p26`],
[`Condition (i): π is an effective epimorphism.`,`Def 4.19, p26`],
[`Condition (ii): action groupoid → Čech nerve is invertible; equivalently (act,pr) : G × U → U ×_{X} U is invertible.`,`4.19, 4.21, p26`],
[`Consequence: X is the geometric realization of the action groupoid.`,`Rem 4.20, p26`],
[`A torsor is trivial iff it has a section s, via G × X → G × U → U.`,`Def 4.24, p27`]],"epi");

T("g4",4,"Quotient stacks: definition, points, classifying stack",["g3"],[
[`[U/G] := |U_{•}|, with colimit taken in Stk.`,`Def 4.25, p27–28`],
[`The prestack realization is rarely a stack; [U/G] is its sheafification.`,`Rem 4.26, p28`],
[`p : U ↠ [U/G] is a G-torsor.`,`Rem 4.27, p28`],
[`[U/G](T) is diagrams T ← Y → U: a G-torsor Y → T and a G-equivariant map Y → U.`,`Thm 4.28, p28`],
[`BG := [S/G], and S ↠ BG is the universal torsor.`,`Ex 4.29, p29`],
[`A G-map X → Y gives a cartesian square with [X/G] → [Y/G].`,`Lem 4.31, p29`]]);

T("g5",4,"Two worked quotient stacks",["g4"],[
[`E ↦ Isom_{X}(O^{n},E) identifies rank n locally free sheaves with GL_{n}-torsors.`,`Ex 4.32, p29`],
[`So maps X → BGL_{n} are rank n vector bundles.`,`Ex 4.32, p29`],
[`Maps T → [A^{1}/G_{m}] are generalized divisors: L locally free of rank 1 with a section s : O_{T} → L.`,`Ex 4.33, p30`]]);

T("a1",5,"Monomorphisms and schematic morphisms",["g1"],[
[`Monomorphism: the diagonal X → X ×_{Y} X is invertible.`,`Def 5.1, p30`],
[`In Grpd, mono means fully faithful: injective on π_{0} and bijective on automorphism groups.`,`Ex 5.2, p30`],
[`An ∞-groupoid with monomorphic diagonal is discrete. So a stack with mono diagonal takes values in sets.`,`5.3–5.4, p30–31`],
[`Schematic: X ×_{Y} V is a scheme for every scheme V → Y.`,`Def 5.5, p31`],
[`Equivalent: Δ schematic; U ×_{X} V a scheme for all schemes; every U → X schematic.`,`Lem 5.6, p31`]]);

T("a2",5,"Algebraic space: definition",["a1"],[
[`Diagonal is schematic and a monomorphism.`,`Def 5.7(i), p31`],
[`There is a scheme U and an étale surjection U ↠ X.`,`Def 5.7(ii), p31`],
[`Equivalently, a sheaf of sets on Sch with schematic diagonal and an étale atlas.`,`p31`]],"alg");

T("a3",5,"Algebraic stack and Deligne–Mumford stack: definition",["a2"],[
[`f is representable if X ×_{Y} V is an algebraic space for every scheme V.`,`Def 5.8, p32`],
[`Algebraic, (i): the diagonal is representable.`,`Def 5.9, p32`],
[`Algebraic, (ii): there is a scheme U and a smooth surjection U ↠ X, the atlas.`,`5.9–5.10, p32`],
[`Deligne–Mumford: the atlas can be étale.`,`Def 5.9, p32`]],"alg");

T("a4",5,"Algebraicity of [U/G]: statement and both proof halves",["a3","g4"],[
[`G smooth group algebraic space, U algebraic ⇒ [U/G] algebraic.`,`Thm 5.11, p32`],
[`Diagonal: pass to an étale cover T′ ↠ T on which the point lifts through U, then use the torsor and U's representable diagonal.`,`p32`],
[`Atlas: p is smooth surjective since G → S is. Compose an atlas U′ ↠ U with p.`,`p32–33`],
[`Base change of the diagonal of [U/G] along p × p is (act,pr) : G × U → U × U.`,`Rem 5.12, p33`]]);

T("a5",5,"Recognizing DM stacks and algebraic spaces; free and proper actions",["a4"],[
[`DM iff the diagonal is unramified. Algebraic space iff the diagonal is a monomorphism.`,`Thm 5.13, p33`],
[`[U/G] is an algebraic space iff the action is free: (act,pr) is a monomorphism.`,`Prop 5.15, p33`],

[`[U/G] is separated (proper diagonal) iff the action is proper: (act,pr) is proper.`,`Prop 5.17, p34`],

T("a6",5,"Stabilizers",["a5"],[
[`St_{X}(x) = Spec R ×_{X} Spec R; equivalently, the base change of Δ_{X} along x × x.`,`Def 5.19, p34`],

T("r1",6,"The resolution property",["a3"],[
[`Coherent and locally free are tested after a smooth surjection from a scheme.`,`Def 6.1, p35`],

T("r2",6,"Global quotient stacks and the Totaro–Gross theorem",["r1","g4"],[
[`(i) X ≃ [U/GL_{n}] with U quasi-affine.`,`Def/Prop 6.8, p36`],

T("r4",6,"Proof that resolution implies global quotient",["r3"],[
[`Generating: ⊕G_{α} ⊗ f^{*}F ↠ E exists for all E. Universally: after every affine base change.`,`Def 6.16, p37`],

T("d1",7,"Algebraic categories",["c5"],[
[`C is algebraic if C ≃ Fun_{Π}(F_{C}^{op},Set), with F_{C} small and closed under finite coproducts.`,`Def 7.1, p39`],
[`Compact: Hom preserves filtered colimits. Projective: also reflexive coequalizers. F_{C} is the compact projectives.`,`Def 7.2, p39`],

T("d2",7,"Animation",["d1"],[

T("d3",7,"Stable ∞-categories",["c5"],[

T("l4",8,"Quasi-coherent and perfect complexes on stacks",["l1","q4"],[

T("l6",8,"Cotangent complex of a morphism of derived stacks: definition and existence",["l5","l3"],[

T("l7",8,"Globalized triangle, base change, and the absolute criterion",["l6"],[
[`Triangle: Lf^{*}L_{Y/S} → L_{X/S} → L_{X/Y}.`,`Prop 8.33(i), p54`],

T("l9",8,"Smooth, homotopically smooth, quasi-smooth",["l7"],[

T("l10",8,"Why homotopical smoothness matters only in the derived world",["l9"],[

T("m1",9,"The moduli stack of perfect complexes",["l4","l5"],[
[`MPerf : A ↦ D_{perf}(A)^{≃}, a derived stack by descent.`,`Con 9.1, p57`],
[`Universal E^{univ} with x^{*}E^{univ} ≃ E for each A-point x classifying E.`,`Con 9.3, p57`],

T("m2",9,"Cotangent complex of MPerf and its proof",["m1","l6"],[

T("v1",10,"Derived mapping stacks and their cotangent complex",["l7"],[

T("v2",10,"The moduli stacks MPerf(X), MBun, MVect, MCoh",["v1","m1"],[
[`MPerf(X) = Maps(X,MPerf). MBun_{G}(X) = Maps(X,BG).`,`Def 10.7, p61`],
[`MVect(X): perfect complexes connective and flat over X_{R}.`,`Def 10.7(iii), p62`],

T("v3",10,"The formula for L of MPerf(X), and smoothness by dimension",["v2","m2"],[
[`L_{MPerf(X)} = pr_{2,♯}(E_{X} ⊗ E_{X}^{∨}[−1]). The paper prints [1] in Cor 10.15; Thm 9.5 forces [−1].`,`Cor 10.15, p64`],
[`Equivalently pr_{2,*}(E_{X} ⊗ E_{X}^{∨}[−1] ⊗ pr_{1}^{*}ω_{X}).`,`Cor 10.15, p64`],

T("v4",10,"Artin–Lurie representability: all conditions and the application",["v3"],[

T("h1",11,"Sheaf theories D(X;Λ) and their extension to stacks",["s3"],[
[`k = C: Shv(X(C),D(Λ)).`,`p65`],

T("h2",11,"The six operations: the adjunctions and all formulas",["h1"],[

T("h3",11,"Cochains and Borel–Moore chains",["h2"],[
[`C^{•}(X;Λ) = RΓ(f_{*}f^{*}Λ) ≃ RΓ(X;Λ_{X}).`,`p67`],

T("h4",11,"Normal bundle, normal deformation, specialization",["h3","l9"],[

T("h5",11,"Virtual pull-back, fundamental class, duality, Bézout",["h4"],[

T("h6",11,"Equivariant chains and the Borel construction",["h3","g4"],[

T("h7",11,"Concentration and virtual localization",["h5","h6"],[

const closureMemo={};
function closure(id){if(closureMemo[id])return closureMemo[id];const out={},q=BY[id].pre.map(p=>[p,1]);
  while(q.length){const[p,d]=q.shift();if(out[p]&&out[p]<=d)continue;out[p]=d;BY[p].pre.forEach(x=>q.push([x,d+1]))}
  return closureMemo[id]=out}
const interval=r=>r<1?0:DAY*Math.pow(2.4,r-1);
function status(id){const x=db.t[id];if(!x||(!x.r&&!x.tries))return"new";if(x.r>=1)return x.due<=now()?"due":"solid";return"learn"}

/* One recall result updates the topic, then trickles fractional credit to what it encompasses. */
function applyResult(id,score,cold,direct){const x=rec(id),t=now(),pass=score>=PASS;x.tries++;x.last=t;
  if(pass){x.r+=cold?1:.5}else{x.r=Math.max(0,x.r-1);x.lapse=(x.lapse||0)+1}
  x.due=t+interval(x.r);
  if(direct===false)return pass;
  const c=closure(id);
  for(const p in c){const y=rec(p),d=c[p];
    if(pass){const early=y.due>t?.4:1;y.r=Math.min(y.r+score*Math.pow(.5,d)*early,Math.floor(y.r)+1);if(y.r>=1)y.due=Math.max(y.due,t+interval(y.r));}
    else if(d===1){y.r=Math.max(0,y.r-.25)}}
  return pass}

/* ---------- practice scheduler ---------- */
function uncovered(s){return TOPICS.filter(t=>!s.cov[t.id])}
function clash(s,t){const last=s.recent[s.recent.length-1],r3=s.recent.slice(-3);
  return (last&&BY[last].sec===t.sec)||(t.conf&&r3.some(i=>BY[i].conf===t.conf))}
function gated(t,s){return t.pre.every(p=>rec(p).r>0||s.cov[p]==="fail2")}
function prefer(s,list){return list.find(t=>!clash(s,t))||list[0]}
function pick(s){const left=s.endAt-now(),un=uncovered(s),roomy=un.length===0||left/(un.length+1)>=15e3;
  const ready=s.retry.filter(r=>r.wait<=0);
  if(ready.length&&roomy){const r=ready[0];s.retry=s.retry.filter(z=>z!==r);return{id:r.id,kind:"retry",confirm:r.confirm}}
  const dueList=TOPICS.filter(t=>status(t.id)==="due"&&!s.cov[t.id]);
  if(dueList.length){const ranked=dueList.map(t=>({t,n:dueList.filter(o=>closure(t.id)[o.id]).length})).sort((a,b)=>b.n-a.n);
    const best=prefer(s,ranked.filter(z=>z.n===ranked[0].n).map(z=>z.t));return{id:best.id,kind:"review"}}
  if(un.length){let pool;
    if(s.order==="down"){const size=t=>Object.keys(closure(t.id)).filter(p=>!s.cov[p]).length;
      pool=un.slice().sort((a,b)=>size(b)-size(a));pool=pool.filter(t=>size(t)===size(pool[0]))}
    else{pool=un.filter(t=>gated(t,s));if(!pool.length&&s.retry.length){const r=s.retry.shift();return{id:r.id,kind:"retry",confirm:r.confirm}}if(!pool.length)pool=un}
    const best=prefer(s,pool);return{id:best.id,kind:status(best.id)==="new"?"new":"again"}}
  if(s.retry.length){const r=s.retry.shift();return{id:r.id,kind:"retry",confirm:r.confirm}}
  return null}

function startPractice(order){db.sess={mode:"practice",order,endAt:now()+PRACTICE_MS,cov:{},retry:[],recent:[],log:[],attempts:{},phase:"recall",cur:null,kind:"",text:"",studied:false,ticks:[],started:now()};advance()}
function advance(){const s=db.sess;if(s.endAt<=now())return endPractice();const p=pick(s);if(!p)return endPractice();
  s.cur=p.id;s.kind=p.kind;s.confirm=!!p.confirm;s.phase="recall";s.text="";s.studied=false;s.ticks=BY[p.id].units.map(()=>false);
  const left=s.endAt-now(),n=Math.max(1,uncovered(s).length);s.budget=Math.max(20e3,Math.min(120e3,left/n));s.t0=now();save();render()}
function reveal(){db.sess.phase="mark";save();render()}
function submitMark(){const s=db.sess,id=s.cur,t=BY[id],n=s.ticks.filter(Boolean).length,score=n/t.units.length,cold=!s.studied;
  const pass=applyResult(id,score,cold);s.attempts[id]=(s.attempts[id]||0)+1;
  s.log.push({id,score,pass,cold});s.recent.push(id);s.retry.forEach(r=>r.wait--);
  if(pass){s.cov[id]="pass";if(!cold&&!s.confirm)s.retry.push({id,wait:3,confirm:true})}
  else{s.cov[id]=s.attempts[id]>=2?"fail2":"fail";if(s.attempts[id]<3)s.retry.push({id,wait:2});
    if(s.order==="down")t.pre.filter(p=>!s.cov[p]).forEach(p=>s.retry.unshift({id:p,wait:0}))}
  if(s.order==="down"&&pass){const c=closure(id);Object.keys(c).filter(p=>c[p]<=2).forEach(p=>{if(!s.cov[p])s.cov[p]="credit"})}
  advance()}
function endPractice(){const s=db.sess;s.phase="summary";s.cur=null;save();render()}

/* ---------- test ---------- */
function startTest(){db.sess={mode:"test",page:0,pageEnd:now()+PAGE_MS,answers:SECTIONS.map(()=>""),phase:"write",marks:Object.fromEntries(TOPICS.map(t=>[t.id,t.units.map(()=>false)])),markPage:0};save();render()}
function nextPage(){const s=db.sess;if(s.page<SECTIONS.length-1){s.page++;s.pageEnd=now()+PAGE_MS}else s.phase="mark";save();render()}
function finishTest(){const s=db.sess;let got=0,total=0;
  TOPICS.forEach(t=>{const m=s.marks[t.id],n=m.filter(Boolean).length;got+=n;total+=m.length;applyResult(t.id,n/m.length,true,false)});
  db.lastTest={date:now(),pct:Math.round(100*got/total)};s.phase="result";save();render()}

/* ---------- views ---------- */
const app=document.getElementById("app");
const HEAD=`<header class="wrap"><a class="name" href="/">Yu Jie Teo</a><span class="tagline">Mechanical Engineer</span></header>`;
function foot(extra){return`<footer class="wrap"><ul>${extra||""}
<li>This page is a derivative work of Adeel A. Khan, <a href="https://www.preschema.com/lecture-notes/2022-stacks/">A Modern Introduction to Algebraic Stacks ↗</a> (lecture notes, 2022–23). An AI model wrote the cues and ideas, so some can be wrong. Each idea gives the page in the notes.</li>
<li>Email: <a href="mailto:contact@teoyujie.org">contact@teoyujie.org</a> · <a href="/contact.asc">OpenPGP key</a> (fingerprint <code>5E76 96A3 DDD7 6435 07DD 3EB8 F24F 7F0D 78EB E270</code>)</li>
<li>Code: <a href="https://github.com/yujieteo">GitHub ↗</a></li>
<li>Reading: <a href="/reading.html">Latest</a> · <a href="/feed.xml">RSS feed</a></li>
</ul></footer>`}
function page(inner,extra){app.innerHTML=HEAD+`<main class="wrap page"><article>${inner}</article></main>`+foot(extra)}
let confirmReset=false;
function row(a,title,kind,desc){return`<li><a href="#${a}" data-a="${a}"><h3>${title}</h3><span class="kind">${kind}</span><p>${desc}</p></a></li>`}
function home(){const cnt={new:0,learn:0,solid:0,due:0};TOPICS.forEach(t=>cnt[status(t.id)]++);
  const units=TOPICS.reduce((a,t)=>a+t.units.length,0);
  const rows=SECTIONS.map((n,i)=>{const ts=TOPICS.filter(t=>t.sec===i),ok=ts.filter(t=>status(t.id)==="solid").length;
    return`<tr><td>${i}. ${esc(n)}</td><td class="dots">${ts.map(t=>`<span class="d ${status(t.id)}" title="${esc(t.cue)}"></span>`).join("")}</td><td class="num">${ok}/${ts.length}</td></tr>`}).join("");
  page(`<h1>Algebraic stacks from a blank page</h1>
  <p class="meta muted">Adeel A. Khan, <a href="https://www.preschema.com/lecture-notes/2022-stacks/">A Modern Introduction to Algebraic Stacks ↗</a> · ${TOPICS.length} cues · ${units} ideas${db.lastTest?` · Last test ${db.lastTest.pct}%`:""}</p>
  <section class="summary" aria-label="Summary"><h2>Summary</h2><ul>
  <li>You see a cue and write what you remember. Then you mark your answer against the paper.</li>
  <li>Each cue has prerequisites. A new cue opens when its prerequisites pass at 80%.</li>
  <li>Where prerequisites allow, consecutive cues avoid the same section and ideas that are easy to confuse.</li>
  <li>A pass gives fractional credit to the cues under it. The next review comes after 1, 2.4, 5.8 or 14 days, or later.</li></ul></section>
  <h2>Start</h2>
  <ol class="featured">
  ${db.sess?row("resume",`Resume the ${db.sess.mode==="test"?"test":"practice"}`,"Open","The clock kept running while you were away."):""}
  ${row("up","Practice from the foundations","30:00","One cue at a time, in prerequisite order. A cue below 80% returns after two other cues.")}
  ${row("down","Practice from the top theorems down","30:00","Start with the deepest results. A pass covers the nearest prerequisites. Use this when you know most of the paper.")}
  ${row("test","Test","12 × 2:30","Twelve section titles and no feedback. You mark every idea at the end.")}
  </ol>
  <h2>Knowledge graph</h2>
  <p class="muted">${cnt.solid} solid, ${cnt.due} due, ${cnt.learn} learning, ${cnt.new} new.</p>
  <table><thead><tr><th>Section</th><th>Cues</th><th class="num">Solid</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="key"><span><i class="d"></i>New</span><span><i class="d learn"></i>Learning</span><span><i class="d solid"></i>Solid</span><span><i class="d due"></i>Due</span></div>`,
  `<li>${db.sess?`<button class="link" data-a="quit">Discard the open session</button> · `:""}<button class="link" data-a="reset">${confirmReset?"Press again to erase all progress":"Erase progress"}</button></li>`)}

function sessionTop(cue,parts,clockMs,frac){return`<h1>${cue}</h1><p class="meta muted"><button class="link" data-a="home">Home</button> · ${parts} · <span class="clock" id="clock">${mmss(clockMs)}</span></p><span class="track"><i style="width:${frac}%"></i></span>`}
function ideaRows(t,checked,attrs,num){return`<ul class="ideas">${t.units.map((u,i)=>`<li><label class="u"><input type="checkbox" ${attrs(i)} ${checked[i]?"checked":""}><span>${fmt(u[0])}<span class="ref">${num?i+1+" · ":""}${esc(u[1])}</span></span></label></li>`).join("")}</ul>`}
function yours(text,empty){return`<section class="summary"><h2>What you wrote</h2><div class="yours">${esc(text)||`<span class="muted">${empty}</span>`}</div></section>`}
function practiceView(){const s=db.sess,left=s.endAt-now();
  if(s.phase==="summary")return summary();
  const t=BY[s.cur],un=uncovered(s).length,cov=TOPICS.length-un;
  const label={new:"New",review:"Review",retry:s.confirm?"Confirm":"Again",again:"Again"}[s.kind];
  const top=sessionTop(fmt(t.cue),`${label} · §${t.sec} ${esc(SECTIONS[t.sec])} · ${cov} of ${TOPICS.length} covered · <span id="pace">${paceText(s)}</span>`,left,100*cov/TOPICS.length);
  if(s.phase==="study")page(top+`<ul class="study">${t.units.map(u=>`<li>${fmt(u[0])}<span class="ref">${esc(u[1])}</span></li>`).join("")}</ul><div class="row"><button class="button" data-a="hide">Hide it and recall<kbd>Enter</kbd></button></div>`);
  else if(s.phase==="recall"){page(top+`<textarea id="ta" placeholder="Write what you remember. Keywords are enough. You can also say it aloud or use paper." autocomplete="off" spellcheck="false"></textarea><div class="row"><button class="button" data-a="reveal">Compare<kbd>⌘ Enter</kbd></button>${s.kind==="new"&&!s.studied?`<button class="link" data-a="study">I have not learned this. Show it first.</button>`:""}</div>`);const ta=document.getElementById("ta");ta.value=s.text;ta.oninput=()=>{s.text=ta.value;save()};ta.focus()}
  else{const n=s.ticks.filter(Boolean).length,pass=n/t.units.length>=PASS;
    page(top+yours(s.text,"You typed nothing.")+`<h2>Tick each idea that you produced</h2>`+ideaRows(t,s.ticks,i=>`data-i="${i}"`,true)+`<p class="verdict" id="v">${verdict(n,t.units.length,pass,s)}</p><div class="row"><button class="button" data-a="next">Next<kbd>Enter</kbd></button><button class="button" data-a="all">Tick all<kbd>A</kbd></button></div>`);
    app.querySelectorAll("input[data-i]").forEach(c=>c.onchange=()=>{s.ticks[+c.dataset.i]=c.checked;save();updateV()})}}
function verdict(n,total,pass,s){return `${n} of ${total}. ${pass?(s.studied&&!s.confirm?"Pass. One cold recall follows.":"Pass."):"Below 80%. This cue returns."}`}
function updateV(){const s=db.sess,t=BY[s.cur],n=s.ticks.filter(Boolean).length,p=n/t.units.length>=PASS;document.getElementById("v").textContent=verdict(n,t.units.length,p,s)}
function paceText(s){const n=uncovered(s).length,l=s.endAt-now();return n?`${Math.round(l/1e3/n)} s per cue left`:"All covered"}
function summary(){const s=db.sess,log=s.log,pass=log.filter(x=>x.pass).length,cov=TOPICS.filter(t=>s.cov[t.id]).length,miss=[...new Set(log.filter(x=>!x.pass).map(x=>x.id))].filter(id=>s.cov[id]!=="pass");
  const nextDue=TOPICS.map(t=>rec(t.id).due).filter(d=>d>now()).sort((a,b)=>a-b)[0];
  page(`<h1>Session done</h1><p class="meta muted">${cov} of ${TOPICS.length} cues covered · ${pass} of ${log.length} recalls passed · ${s.retry.length} left to recall again${nextDue?` · Next review ${new Date(nextDue).toISOString().slice(0,10)}`:""}</p>
  ${miss.length?`<h2>Still below 80%</h2><table><tbody>${miss.map(id=>`<tr><td>${fmt(BY[id].cue)}</td><td class="num">§${BY[id].sec}</td></tr>`).join("")}</tbody></table>`:""}
  <div class="row"><button class="button" data-a="clearhome">Back to the graph</button></div>`)}
function testView(){const s=db.sess;
  if(s.phase==="write"){page(sessionTop(`§${s.page} ${esc(SECTIONS[s.page])}`,`Page ${s.page+1} of ${SECTIONS.length} · Write this section from memory`,s.pageEnd-now(),100*s.page/SECTIONS.length)+`<textarea id="ta" autocomplete="off" spellcheck="false" placeholder="Definitions, theorems, proof ideas and examples."></textarea><div class="row"><button class="button" data-a="nextpage">${s.page===SECTIONS.length-1?"Finish":"Next page"}<kbd>⌘ Enter</kbd></button></div>`);const ta=document.getElementById("ta");ta.value=s.answers[s.page];ta.oninput=()=>{s.answers[s.page]=ta.value;save()};ta.focus();return}
  if(s.phase==="mark"){const i=s.markPage,ts=TOPICS.filter(t=>t.sec===i);
    page(`<h1>§${i} ${esc(SECTIONS[i])}</h1><p class="meta muted"><button class="link" data-a="home">Home</button> · Marking ${i+1} of ${SECTIONS.length}</p><span class="track"><i style="width:${100*i/SECTIONS.length}%"></i></span>`+yours(s.answers[i],"You wrote nothing.")+ts.map(t=>`<h3>${fmt(t.cue)}</h3>`+ideaRows(t,s.marks[t.id],k=>`data-t="${t.id}" data-k="${k}"`,false)).join("")+`<div class="row" style="margin-top:32px">${i>0?`<button class="button" data-a="markback">Back</button>`:""}<button class="button" data-a="marknext">${i===SECTIONS.length-1?"See the result":"Next section"}</button></div>`);
    app.querySelectorAll("input[data-t]").forEach(c=>c.onchange=()=>{s.marks[c.dataset.t][+c.dataset.k]=c.checked;save()});window.scrollTo(0,0);return}
  const per=SECTIONS.map((n,i)=>{const ts=TOPICS.filter(t=>t.sec===i);let g=0,a=0;ts.forEach(t=>{g+=s.marks[t.id].filter(Boolean).length;a+=t.units.length});return{n,i,g,a}});
  const g=per.reduce((x,y)=>x+y.g,0),a=per.reduce((x,y)=>x+y.a,0),weak=TOPICS.filter(t=>s.marks[t.id].filter(Boolean).length/t.units.length<PASS);
  page(`<h1>${Math.round(100*g/a)}% from memory</h1><p class="meta muted">${g} of ${a} ideas recalled · ${TOPICS.length-weak.length} of ${TOPICS.length} cues at 80% or more · ${weak.length} need practice</p><h2>By section</h2><table><thead><tr><th>Section</th><th class="num">Ideas</th></tr></thead><tbody>${per.map(p=>`<tr><td>§${p.i} ${esc(p.n)}</td><td class="num">${p.g}/${p.a}</td></tr>`).join("")}</tbody></table><div class="row"><button class="button" data-a="clearhome">Back to the graph</button></div>`)}
function render(){window.scrollTo(0,0);if(!db.sess||db.view==="home"){home();return}
  if(db.sess.mode==="practice")practiceView();else testView()}

/* ---------- clock and input ---------- */
setInterval(()=>{const s=db.sess;if(!s||db.view==="home")return;const c=document.getElementById("clock");
  if(s.mode==="test"&&s.phase==="write"){const l=s.pageEnd-now();if(c)c.textContent=mmss(l);if(l<=0)nextPage();return}
  if(s.mode==="practice"&&s.phase!=="summary"){const l=s.endAt-now();if(c)c.textContent=mmss(l);const p=document.getElementById("pace");if(p)p.textContent=paceText(s);
    const b=document.getElementById("b");if(b)b.style.width=Math.max(0,100*(1-(now()-s.t0)/s.budget))+"%";
    if(l<=0&&s.phase!=="mark")endPractice()}
},250);
app.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;e.preventDefault();const a=b.dataset.a,s=db.sess;
  ({up(){db.view=null;startPractice("up")},down(){db.view=null;startPractice("down")},test(){db.view=null;startTest()},
    resume(){db.view=null;render()},home(){db.view="home";confirmReset=false;save();render()},
    quit(){db.sess=null;db.view=null;save();render()},clearhome(){db.sess=null;db.view=null;save();render()},
    reset(){if(confirmReset){db=fresh();confirmReset=false;save()}else confirmReset=true;render()},
    reveal,study(){s.phase="study";s.studied=true;save();render()},hide(){s.phase="recall";save();render()},
    next:submitMark,all(){s.ticks=s.ticks.map(()=>true);save();render()},
    nextpage:nextPage,marknext(){if(s.markPage<SECTIONS.length-1){s.markPage++;save();render()}else finishTest()},markback(){s.markPage--;save();render()}})[a]()});
document.addEventListener("keydown",e=>{const s=db.sess;if(!s||db.view==="home")return;const tag=e.target.tagName,mod=e.metaKey||e.ctrlKey;
  if(e.key==="Enter"&&mod){e.preventDefault();if(s.mode==="practice"&&s.phase==="recall")reveal();else if(s.mode==="test"&&s.phase==="write")nextPage();return}
  if(tag==="TEXTAREA"||s.mode!=="practice")return;
  if(e.key==="Enter"&&tag!=="BUTTON"){if(s.phase==="study"){s.phase="recall";save();render()}else if(s.phase==="mark")submitMark();return}
  if(s.phase==="mark"){if(/^[1-9]$/.test(e.key)){const i=+e.key-1;if(i<s.ticks.length){s.ticks[i]=!s.ticks[i];save();render()}}else if(e.key==="a"||e.key==="A"){s.ticks=s.ticks.map(()=>true);save();render()}}});
db.view=db.sess?"home":null;render();
</script>
