<svg viewBox="0 0 640 170" width="640" fill="none" stroke="var(--ink)" stroke-width="1.5" font-family="Inter, sans-serif" font-size="13">
<g data-label="Phase 0 finds the time step: the smaller of what the bird and the smallest shell allow."><rect x="8" y="40" width="112" height="56" rx="6" fill="var(--chip)"/><text x="64" y="64" text-anchor="middle" fill="var(--ink)" stroke="none" font-weight="600">0 Time step</text><text x="64" y="82" text-anchor="middle" fill="var(--muted)" stroke="none" font-size="11">stable dt</text></g>
<g data-label="Phase 1 moves the bird: smoothed particles push on their neighbours." ><path d="M120 68H136"/><rect x="136" y="40" width="112" height="56" rx="6" fill="var(--chip)" stroke="var(--series-1)"/><text x="192" y="64" text-anchor="middle" fill="var(--ink)" stroke="none" font-weight="600">1 SPH bird</text><text x="192" y="82" text-anchor="middle" fill="var(--muted)" stroke="none" font-size="11">forces on particles</text></g>
<g data-label="Phase 2 loads the shells: strain, plasticity, and erosion of elements that fail."><path d="M248 68H264"/><rect x="264" y="40" width="112" height="56" rx="6" fill="var(--chip)" stroke="var(--series-3)"/><text x="320" y="64" text-anchor="middle" fill="var(--ink)" stroke="none" font-weight="600">2 Shells</text><text x="320" y="82" text-anchor="middle" fill="var(--muted)" stroke="none" font-size="11">plasticity, erosion</text></g>
<g data-label="Phase 3 finds contact: each particle pushes on its nearest shell element."><path d="M376 68H392"/><rect x="392" y="40" width="112" height="56" rx="6" fill="var(--chip)" stroke="var(--series-2)"/><text x="448" y="64" text-anchor="middle" fill="var(--ink)" stroke="none" font-weight="600">3 Contact</text><text x="448" y="82" text-anchor="middle" fill="var(--muted)" stroke="none" font-size="11">penalty forces</text></g>
<g data-label="Phase 4 moves everything forward by one time step. Then the loop starts again, about 1800 to 4700 times for 3 ms."><path d="M504 68H520"/><rect x="520" y="40" width="112" height="56" rx="6" fill="var(--chip)" stroke="var(--series-4)"/><text x="576" y="64" text-anchor="middle" fill="var(--ink)" stroke="none" font-weight="600">4 Integrate</text><text x="576" y="82" text-anchor="middle" fill="var(--muted)" stroke="none" font-size="11">central differences</text><path d="M576 96V140H64V96" stroke-dasharray="4 4"/></g>
</svg>
