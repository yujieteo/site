<svg class="tall" viewBox="0 0 272 616" fill="none" stroke="var(--ink)" stroke-width="1.5" font-family="Inter, sans-serif" font-size="13">
<g data-label=""><rect x="1" y="4" width="270" height="120" rx="6" fill="var(--chip)" stroke="var(--series-1)"/><text x="13" y="26" fill="var(--ink)" stroke="none" font-weight="600">1 The problem</text><text x="13" y="46" fill="var(--ink)" stroke="none" font-size="12">People who ship Emscripten SINGLE_FILE</text><text x="13" y="62" fill="var(--ink)" stroke="none" font-size="12">builds pay about 33% base64 overhead</text><text x="13" y="78" fill="var(--ink)" stroke="none" font-size="12">plus an inline decoder, and gzip or</text><text x="13" y="94" fill="var(--ink)" stroke="none" font-size="12">brotli is the best compression they can</text><text x="13" y="110" fill="var(--ink)" stroke="none" font-size="12">get in a self-contained HTML file.</text></g>
<g data-label=""><rect x="1" y="134" width="270" height="72" rx="6" fill="var(--chip)" stroke="var(--series-3)"/><text x="13" y="156" fill="var(--ink)" stroke="none" font-weight="600">2 The evidence</text><text x="13" y="176" fill="var(--ink)" stroke="none" font-size="12">A write-up on small, fast web builds:</text><text x="13" y="192" fill="var(--ink)" stroke="none" font-size="12">zeux.io/2019/03/11/small-fast-web/</text></g>
<g data-label=""><rect x="1" y="216" width="270" height="88" rx="6" fill="var(--chip)" stroke="var(--series-2)"/><text x="13" y="238" fill="var(--ink)" stroke="none" font-weight="600">3 Today's fix</text><text x="13" y="258" fill="var(--ink)" stroke="none" font-size="12">Emscripten -sSINGLE_FILE (base64), or a</text><text x="13" y="274" fill="var(--ink)" stroke="none" font-size="12">gzip or brotli payload in base64,</text><text x="13" y="290" fill="var(--ink)" stroke="none" font-size="12">decoded with DecompressionStream.</text></g>
<g data-label=""><rect x="1" y="314" width="270" height="152" rx="6" fill="var(--chip)" stroke="var(--series-4)"/><text x="13" y="336" fill="var(--ink)" stroke="none" font-weight="600">4 The gain: file size</text><text x="13" y="356" fill="var(--ink)" stroke="none" font-size="12">Claim that a test can prove false: on a</text><text x="13" y="372" fill="var(--ink)" stroke="none" font-size="12">200 KB wasm-opt -Oz module, the HTML</text><text x="13" y="388" fill="var(--ink)" stroke="none" font-size="12">file is at least 15% smaller than a</text><text x="13" y="404" fill="var(--ink)" stroke="none" font-size="12">gzip-9 plus base64 plus</text><text x="13" y="420" fill="var(--ink)" stroke="none" font-size="12">DecompressionStream file of the same</text><text x="13" y="436" fill="var(--ink)" stroke="none" font-size="12">module, and decodes in under 300 ms on a</text><text x="13" y="452" fill="var(--ink)" stroke="none" font-size="12">2020 laptop.</text></g>
<g data-label=""><rect x="1" y="476" width="270" height="136" rx="6" fill="var(--chip)" stroke="var(--ink)"/><text x="13" y="498" fill="var(--ink)" stroke="none" font-weight="600">What happened: it survived</text><text x="13" y="518" fill="var(--ink)" stroke="none" font-size="12">Closest prior art: Roadroller</text><text x="13" y="534" fill="var(--ink)" stroke="none" font-size="12">(JavaScript only), histos and wasm-</text><text x="13" y="550" fill="var(--ink)" stroke="none" font-size="12">squeeze (brotli or LZ). No tool found</text><text x="13" y="566" fill="var(--ink)" stroke="none" font-size="12">that combines order search and context</text><text x="13" y="582" fill="var(--ink)" stroke="none" font-size="12">mixing for Wasm. The size gain is still</text><text x="13" y="598" fill="var(--ink)" stroke="none" font-size="12">unmeasured, and the decoder is slower.</text></g>
</svg>
