<svg viewBox="0 0 640 190" width="640" fill="none" stroke="var(--ink)" stroke-width="1.5" font-family="Inter, sans-serif" font-size="13">
<g data-label="You write a seed: a pain, a domain, a tool or a paradigm."><rect x="8" y="20" width="112" height="56" rx="6" fill="var(--chip)" stroke="var(--series-1)"/><text x="64.0" y="44" text-anchor="middle" fill="var(--ink)" stroke="none" font-weight="600">Seed</text><text x="64.0" y="62" text-anchor="middle" fill="var(--muted)" stroke="none" font-size="11">a pain or a domain</text></g>
<g data-label="Hunt: Claude searches the web for six real tools and paradigms. It breaks each into parts, with a source link for every part."><path d="M120 48H136"/><rect x="136" y="20" width="112" height="56" rx="6" fill="var(--chip)" stroke="var(--series-3)"/><text x="192.0" y="44" text-anchor="middle" fill="var(--ink)" stroke="none" font-weight="600">Hunt</text><text x="192.0" y="62" text-anchor="middle" fill="var(--muted)" stroke="none" font-size="11">6 real sources</text></g>
<g data-label="Create: Claude combines parts of distant sources into candidates, each with four lines: problem, evidence, today's fix and gain. A candidate that exists, or has no clear gain, goes to the graveyard with the reason."><path d="M248 48H264"/><rect x="264" y="20" width="112" height="56" rx="6" fill="var(--chip)" stroke="var(--series-2)"/><text x="320.0" y="44" text-anchor="middle" fill="var(--ink)" stroke="none" font-weight="600">Create</text><text x="320.0" y="62" text-anchor="middle" fill="var(--muted)" stroke="none" font-size="11">distant parts</text><path d="M320 76V120" stroke-dasharray="4 4"/><rect x="264" y="120" width="112" height="44" rx="6" fill="var(--chip)" stroke="var(--series-2)"/><text x="320" y="147" text-anchor="middle" fill="var(--ink)" stroke="none" font-weight="600">Graveyard</text></g>
<g data-label="Grill: you settle the design in rounds, one tap per decision, until you have a brief or a kill. A kill goes back to the hunt, with the bad part marked."><path d="M376 48H392"/><rect x="392" y="20" width="112" height="56" rx="6" fill="var(--chip)" stroke="var(--series-4)"/><text x="448.0" y="44" text-anchor="middle" fill="var(--ink)" stroke="none" font-weight="600">Grill</text><text x="448.0" y="62" text-anchor="middle" fill="var(--muted)" stroke="none" font-size="11">one tap per decision</text><path d="M448 76V104H192V76" stroke-dasharray="4 4"/></g>
<g data-label="Brief: all the settled decisions in one text that you paste into a coding agent."><path d="M504 48H520"/><rect x="520" y="20" width="112" height="56" rx="6" fill="var(--chip)" stroke="var(--ink)"/><text x="576.0" y="44" text-anchor="middle" fill="var(--ink)" stroke="none" font-weight="600">Brief</text><text x="576.0" y="62" text-anchor="middle" fill="var(--muted)" stroke="none" font-size="11">for a builder</text></g>
</svg>
