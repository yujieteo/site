<svg viewBox="0 0 640 210" width="640" fill="none" stroke="var(--ink)" stroke-width="1.5" font-family="Inter, sans-serif" font-size="13">
<g data-label="Skis come from skiing. They carry a load over snow, and they cannot move it."><rect x="8" y="10" width="144" height="56" rx="6" fill="var(--chip)" stroke="var(--series-1)"/><text x="80.0" y="34" text-anchor="middle" fill="var(--ink)" stroke="none" font-weight="600">Skis</text><text x="80.0" y="52" text-anchor="middle" fill="var(--muted)" stroke="none" font-size="11">from a ski</text></g>
<g data-label="The outboard motor comes from a boat. It makes thrust, and it was built for water."><rect x="168" y="10" width="144" height="56" rx="6" fill="var(--chip)" stroke="var(--series-2)"/><text x="240.0" y="34" text-anchor="middle" fill="var(--ink)" stroke="none" font-weight="600">Outboard motor</text><text x="240.0" y="52" text-anchor="middle" fill="var(--muted)" stroke="none" font-size="11">from a boat</text></g>
<g data-label="Tank treads come from a tank. They grip loose ground and spread the weight."><rect x="328" y="10" width="144" height="56" rx="6" fill="var(--chip)" stroke="var(--series-3)"/><text x="400.0" y="34" text-anchor="middle" fill="var(--ink)" stroke="none" font-weight="600">Tank treads</text><text x="400.0" y="52" text-anchor="middle" fill="var(--muted)" stroke="none" font-size="11">from a tank</text></g>
<g data-label="Handlebars come from a bicycle. They let one rider steer with two hands."><rect x="488" y="10" width="144" height="56" rx="6" fill="var(--chip)" stroke="var(--series-4)"/><text x="560.0" y="34" text-anchor="middle" fill="var(--ink)" stroke="none" font-weight="600">Handlebars</text><text x="560.0" y="52" text-anchor="middle" fill="var(--muted)" stroke="none" font-size="11">from a bicycle</text></g>
<g data-label="Boyd takes each part out of its whole and joins the four. The snowmobile is none of the four wholes. It is a new whole built from their parts."><path d="M80 66V110H320V132" stroke="var(--series-1)"/><path d="M240 66V110H320V132" stroke="var(--series-2)"/><path d="M400 66V110H320V132" stroke="var(--series-3)"/><path d="M560 66V110H320V132" stroke="var(--series-4)"/><rect x="224" y="132" width="192" height="60" rx="6" fill="var(--chip)" stroke="var(--ink)" stroke-width="2"/><text x="320" y="158" text-anchor="middle" fill="var(--ink)" stroke="none" font-weight="600">Snowmobile</text><text x="320" y="176" text-anchor="middle" fill="var(--muted)" stroke="none" font-size="11">a new whole</text></g>
</svg>
