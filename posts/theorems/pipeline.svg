<svg viewBox="0 0 640 330" width="640" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
<defs><marker id="pl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="var(--underline-hover)"/></marker></defs>
<g data-label="Seven sources name 4,375 candidates: Wikidata, nLab, arXiv, mathlib docstrings, survey pages, an undergraduate list and Freek's 100 theorems."><rect x="10" y="20" width="180" height="70" rx="8" fill="var(--chip)" stroke="var(--line)"/><text x="24" y="46" font-size="13" font-weight="600" fill="var(--ink)">Seven sources</text><text x="24" y="70" font-size="12" fill="var(--muted)">4,375 candidate names</text><path d="M190 55 H228" stroke="var(--underline-hover)" stroke-width="1.5" marker-end="url(#pl-arrow)"/></g>
<g data-label="Merging names that mean the same result leaves 3,103 named records."><rect x="230" y="20" width="180" height="70" rx="8" fill="var(--chip)" stroke="var(--line)"/><text x="244" y="46" font-size="13" font-weight="600" fill="var(--ink)">Named records</text><text x="244" y="70" font-size="12" fill="var(--muted)">3,103 after merging</text></g>
<g data-label="363 records are not results: definitions, concepts, physics laws, open conjectures, lists and methods. They get no score."><path d="M320 90 V128" stroke="var(--underline-hover)" stroke-width="1.5" marker-end="url(#pl-arrow)"/><rect x="230" y="130" width="180" height="56" rx="8" fill="var(--card)" stroke="var(--line)" stroke-dasharray="4 3"/><text x="244" y="153" font-size="13" font-weight="600" fill="var(--ink)">Left out</text><text x="244" y="173" font-size="12" fill="var(--muted)">363 are not results</text></g>
<g data-label="mathlib, the Lean library, holds 241,706 formal theorems. Only 1,512 of them link to a named result."><rect x="10" y="130" width="180" height="84" rx="8" fill="var(--chip)" stroke="var(--line)"/><text x="24" y="153" font-size="13" font-weight="600" fill="var(--ink)">mathlib</text><text x="24" y="175" font-size="12" fill="var(--muted)">241,706 formal theorems</text><text x="24" y="195" font-size="12" fill="var(--muted)">1,512 link to a name</text><path d="M190 150 C210 150 215 80 228 72" fill="none" stroke="var(--underline-hover)" stroke-width="1.5" marker-end="url(#pl-arrow)"/></g>
<g data-label="Three language models read the evidence and judged each record: Claude Opus 5.5 judged 2,320, GPT-6.1 Terra 763 and DeepSeek Flash 20."><rect x="450" y="130" width="180" height="96" rx="8" fill="var(--chip)" stroke="var(--line)"/><text x="464" y="153" font-size="13" font-weight="600" fill="var(--ink)">Three model judges</text><text x="464" y="175" font-size="12" fill="var(--muted)">Claude Opus 5.5: 2,320</text><text x="464" y="194" font-size="12" fill="var(--muted)">GPT-6.1 Terra: 763</text><text x="464" y="213" font-size="12" fill="var(--muted)">DeepSeek Flash: 20</text><path d="M540 130 V92" stroke="var(--underline-hover)" stroke-width="1.5" marker-end="url(#pl-arrow)"/></g>
<g data-label="2,740 results get seven dial scores from 0 to 4, a confidence label and an evidence grade. This is the Theorem Explorer."><path d="M410 55 H448" stroke="var(--underline-hover)" stroke-width="1.5" marker-end="url(#pl-arrow)"/><rect x="450" y="20" width="180" height="70" rx="8" fill="color-mix(in srgb, var(--series-1) 10%, var(--card))" stroke="var(--series-1)"/><text x="464" y="46" font-size="13" font-weight="600" fill="var(--series-1)">Theorem Explorer</text><text x="464" y="70" font-size="12" fill="var(--muted)">2,740 scored results</text></g>
<g data-label="The Theorem Learner writes 2,203 proofs of 2,055 theorems as three to seven steps each. None of the prose proofs has been checked against Lean."><path d="M396 90 C432 150 432 220 420 262" fill="none" stroke="var(--underline-hover)" stroke-width="1.5" marker-end="url(#pl-arrow)"/><rect x="170" y="264" width="300" height="56" rx="8" fill="color-mix(in srgb, var(--series-4) 10%, var(--card))" stroke="var(--series-4)"/><text x="184" y="287" font-size="13" font-weight="600" fill="var(--series-4)">Theorem Learner</text><text x="184" y="307" font-size="12" fill="var(--muted)">2,203 proofs in 10,727 steps, 0 checked in Lean</text></g>
</svg>
