name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The visuals change in yujieteo/visuals, not here, and the build reads its main: a daily run (and one on
  # demand) builds and tests the site with the latest visuals.
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-test:
    name: Validate, build, and test
    runs-on: ubuntu-latest
    env:
      # scripts/build.py resolves a sibling visuals checkout, and the
      # visualization tests compare the published site against it.
      VISUALS_REPO: ${{ github.workspace }}/visuals
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          path: site
          # A pull request checks out its merge commit; its first parent is
          # the base branch, so scripts/run_tests.py diffs against HEAD^1.
          fetch-depth: 2

      # The published site embeds every public visualization from the separate
      # public visuals repository: the build reads each viz/<slug>/ of this
      # checkout of its main. Full history lets the tests clone it.
      - name: Check out visuals
        uses: actions/checkout@v4
        with:
          repository: yujieteo/visuals
          fetch-depth: 0
          path: visuals

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            site/requirements.txt
            site/requirements-lint.txt

      - name: Install Python dependencies
        working-directory: site
        run: pip install -r requirements.txt -r requirements-lint.txt

      - name: Validate data
        working-directory: site
        run: python scripts/validate.py

      # Committed build or OS artifacts, a report of tests that assert on code text, and (on a pull
      # request) the review tier; see scripts/repo_check.py.
      - name: Check repository
        working-directory: site
        run: python scripts/repo_check.py ${{ github.event_name == 'pull_request' && '--base HEAD^1' || '' }}

      # Unused imports and variables, redefinitions and undefined names (ruff.toml).
      - name: Lint Python
        working-directory: site
        run: ruff check

      # The build fetches pinned downloads (beamdswitch's Kokoro weights, about
      # 440 MB) into a cache keyed by sha256; keep it between runs.
      - name: Cache pinned downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/teoyujie-site/downloads
          key: downloads-${{ hashFiles('site/visuals/beamdswitch/raw.json') }}
          restore-keys: downloads-

      # site/ is generated and not committed; the tests read this build.
      - name: Build site
        working-directory: site
        run: python scripts/build.py

      # scripts/run_tests.py reports each suite's wall time and slowest
      # tests, fails a suite over its budget in tests/time-budget.json, and on
      # a pull request runs the per-visualisation checks only for the
      # visualisation folders it changes.
      - name: Run Python tests
        working-directory: site
        run: python scripts/run_tests.py python ${{ github.event_name == 'pull_request' && '--base HEAD^1' || '' }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # tsc checks the JSDoc types in the site's JavaScript (tsconfig.json),
      # with the versions package.json and package-lock.json pin.
      - name: Type-check JavaScript
        working-directory: site
        run: npm ci && npm run typecheck

      - name: Run Node tests
        working-directory: site
        run: python scripts/run_tests.py node ${{ github.event_name == 'pull_request' && '--base HEAD^1' || '' }}
