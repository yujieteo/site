name: ci
# A pull request builds once with a cache. A push to main builds twice from a clean state.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show
      - if: github.event_name == 'pull_request'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: github.event_name == 'pull_request'
        run: ./build.sh
      - if: github.event_name != 'pull_request'
        run: scripts/repro.sh
      - run: scripts/loc.sh
