name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-build-test:
    name: Validate, build, and test
    runs-on: ubuntu-latest
    env:
      # scripts/build.py resolves a sibling visuals checkout, and the
      # visualization tests compare the published site against it.
      VISUALS_REPO: ${{ github.workspace }}/visuals
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          path: site

      # The published site embeds HTML and data generated in the separate
      # public visuals repository. Pin the revision whose output matches the
      # committed site; bump it when a visualization is republished.
      - name: Check out visuals
        uses: actions/checkout@v4
        with:
          repository: yujieteo/visuals
          ref: e1077c48d0e5a079a493cacd0ed908492acfb058
          path: visuals

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install Python dependencies
        working-directory: site
        run: pip install -r requirements.txt

      - name: Validate data
        working-directory: site
        run: python scripts/validate.py

      - name: Build site
        working-directory: site
        run: python scripts/build.py

      - name: Check the committed site matches its sources
        working-directory: site
        run: |
          if ! git diff --exit-code -- site; then
            echo "::error::Generated site/ is out of date; run scripts/build.py and commit the result."
            exit 1
          fi

      - name: Run Python tests
        working-directory: site
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Node tests
        working-directory: site
        run: node --test tests/corpus.test.mjs
