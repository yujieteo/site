name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-build-test:
    name: Validate, build, and test
    runs-on: ubuntu-latest
    env:
      # scripts/build.py resolves a sibling visuals checkout, and the
      # visualization tests compare the published site against it.
      VISUALS_REPO: ${{ github.workspace }}/visuals
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          path: site

      # The published site embeds HTML and data generated in the separate
      # public visuals repository. The build reads each visualization at the
      # commit pinned in data/visuals/<slug>.pin, so check out full history.
      - name: Check out visuals
        uses: actions/checkout@v4
        with:
          repository: yujieteo/visuals
          fetch-depth: 0
          path: visuals

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install Python dependencies
        working-directory: site
        run: pip install -r requirements.txt

      - name: Validate data
        working-directory: site
        run: python scripts/validate.py

      # site/ is generated and not committed; the tests read this build.
      - name: Build site
        working-directory: site
        run: python scripts/build.py

      - name: Run Python tests
        working-directory: site
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Node tests
        working-directory: site
        run: node --test 'tests/*.test.{mjs,cjs}'

      # Reviewers see the generated files this pull request changes, the list a
      # deploy of it would upload (skills/playbooks/deploy.md).
      - name: Summarize generated files changed against the base branch
        if: github.event_name == 'pull_request'
        working-directory: site
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          {
            echo "### Generated files changed against the base branch"
            echo
            echo '```text'
            python scripts/site_diff.py "$BASE_SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
