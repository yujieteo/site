  url: "https://www.census.gov/foreign-trade/data/dataproducts.html"
  category: "united-states-trade"
  note: "Analysis: easy-medium. Merchandise trade records include product codes, country, transport mode, quantity, shipping weight, and value. Prefer quantities and shipping weights when studying real flows."

- title: "US Quarterly Census of Employment and Wages"
  url: "https://www.bls.gov/cew/"
  category: "united-states-labour"
  note: "Analysis: easy. Employer-reported employment, establishment counts, and payroll wages based mainly on unemployment-insurance administrative records. For wage analysis, use nominal payroll per worker and compare with concrete prices of specific goods or housing rather than a broad CPI alone."

- title: "US QCEW Open Data"
  url: "https://www.bls.gov/cew/additional-resources/open-data/home.htm"
  category: "united-states-labour"
  note: "Analysis: very easy for scripting. Downloadable and API-accessible establishment, employment, and wage data by geography and industry. Good base for building simple wage-per-worker and employment-growth measures."

- title: "US Daily Treasury Statement"
  url: "https://fiscaldata.treasury.gov/datasets/daily-treasury-statement/"
  category: "united-states-fiscal-cashflow"
  note: "Analysis: medium. Daily actual federal cash receipts and outlays. Tax deposits, customs receipts, benefit payments, and other cash flows can reveal economic activity without relying on national-account estimates."

- title: "US New Residential Construction"
  url: "https://www.census.gov/construction/nrc/data/series.html"
  category: "united-states-construction"
  note: "Analysis: very easy. Counts of housing units started, under construction, and completed. Starts and completions are physical construction activity; completions are generally more concrete than permits."

- title: "UK National Energy System Operator - Historic Demand Data"
  url: "https://www.neso.energy/data-portal/historic-demand-data"
  category: "united-kingdom-energy"
  note: "Analysis: very easy. Historic electricity demand plus wind, solar, interconnector, and other system data in downloadable CSV files. Good for high-frequency physical-activity analysis, with documented retrospective revisions."

- title: "HM Land Registry Price Paid Data"
  url: "https://www.gov.uk/government/statistical-data-sets/price-paid-data-downloads"
  category: "united-kingdom-housing-prices"
  note: "Analysis: very easy. Individual property sale prices in England and Wales lodged for registration, with date, property type, tenure, and location. This is actual transaction-price data rather than a modeled house-price index."

- title: "Australia AEMO Operational Demand Data"
  url: "https://www.aemo.com.au/energy-systems/electricity/national-electricity-market-nem/data-nem/operational-demand-data"
  category: "australia-energy"
  note: "Analysis: very easy. Measured operational electricity demand by National Electricity Market region at half-hourly and five-minute resolution, with downloadable CSV files and documented adjustments."

- title: "Japan MLIT Real Estate Transaction Price Information"
  url: "https://www.mlit.go.jp/en/totikensangyo/totikensangyo_fr5_000014.html"
  category: "japan-housing-prices"
  note: "Analysis: easy-medium. Transaction-price information collected from parties to actual real-estate transactions, including total value, area, building use, structure, and transaction period. Useful for constructing price-per-square-metre distributions directly."

- title: "Inspire - High Energy Physics"
  url: "https://inspirehep.net/"
  category: "physics"
  note: "High energy physics paper search."
