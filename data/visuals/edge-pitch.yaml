slug: edge-pitch
title: Fastener edge margin and pitch visualiser
summary: "Explore how end distance, side edge distance, pitch and row spacing drive a riveted or bolted single-lap or double-shear sheet joint. Strength margins (bearing with Fbru interpolated between your values at e/D 1.5 and 2.0, shear-out, net section between holes, side-edge net section, inter-rivet buckling and maximum pitch) are reported apart from geometric margins (e/D, p/D) against the loads and allowables you enter, with a to-scale joint schematic, margin plots, source tags (Niu to confirm against your copy, NASA RP-1228, classical), Markdown and JSON export and import in SI, and a self-test that also runs your own test vectors. Not for certification."
