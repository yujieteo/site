slug: fastener-cg
title: Fastener Pattern CG Tracker
summary: "Place a bolt or rivet group on a canvas or in a table, with per-fastener area and shear and axial stiffness, and read its shear, axial and area centroids, polar moment J, Ixx, Iyy, Ixy and principal axes. A general 3D load applied at any point is reduced to the group and shared among the fasteners by the elastic method (direct and torsional shear, centroid neutral-axis tension). With keyed shear and tension allowables it checks each fastener against a shear-tension interaction with separate exponents and reports the exact load-scale-factor margin of safety and the critical fastener, with optional T-stub prying and bolt preload (load-sharing factor, clamp force and separation) feeding the bolt tension, bearing and tear-out against up to two plates, a contact-edge (tension-only) method for out-of-plane load, and an instantaneous-centre-of-rotation (ICR) ultimate-strength solve compared side by side with the elastic result. Reports print to PDF or export as Markdown with a worked calculation trace, the annotated diagram exports as a PNG, patterns save as JSON or Markdown, and the page runs offline; for preliminary sizing and hand-calculation cross-checks."
