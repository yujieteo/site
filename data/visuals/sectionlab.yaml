slug: sectionlab
title: Sectionlab
summary: "Build a cross-section from library shapes (solid, hollow, rolled or built-up I/H, channel, angle, tee, Z and cross sections, and cold-formed angles, channels, Zs and top hats, with a radius on any corner, holes and several materials) by dragging, and read its area, centroid, second moments, principal axes, section moduli, radii of gyration and first moments Q. A torsion constant is given only where a formula has been measured against a numerical Prandtl solution, with its accuracy, and a Ramberg–Osgood moment–curvature curve gives the moment at a strain limit, Z_p and the shape factor. Exports a PDF report, PNGs and Markdown with the model as YAML that imports back. Results are checked against independent Python references; verify them independently."
