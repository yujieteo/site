slug: frequency-response
title: Frequency-Response Visualiser
summary: "Explore how poles, zeros, gain, delay and a controller shape a feedback loop's frequency response. Phase 1 covers single-loop continuous-time systems: a Bode plot with straight-line asymptotes and |S| and |T| overlays, every gain and phase crossover with gain, phase and delay margins, Ms, Mt, vector margin, bandwidth and closed-loop poles, with user-set thresholds. Exports Markdown, JSON, CSV and SVG, imports its own JSON, checks itself against analytic cases on every load, and runs offline. Exploration only, not a verified control-design toolchain."
