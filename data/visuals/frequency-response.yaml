slug: frequency-response
title: Frequency-Response Visualiser
summary: "Explore how poles, zeros, gain, delay, sampling and a controller shape a feedback loop's frequency response, in continuous or discrete time. Blocks entered in s can be discretised by zero-order hold, Tustin (with optional prewarp) or forward or backward Euler, with the continuous response overlaid on the discrete one. Bode, Nyquist and Nichols views and a pole-zero map show every gain and phase crossover with gain, phase and delay margins, Ms, Mt, bandwidth and closed-loop poles against user-set thresholds, and a Nyquist encirclement count Z = N + P cross-checked against the closed-loop poles. Exports Markdown, JSON, CSV and SVG, imports its own JSON, checks itself against analytic cases on every load, and runs offline. Exploration only, not a verified control-design toolchain."
