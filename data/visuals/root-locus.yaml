slug: root-locus
title: Root locus design check
summary: "Type a compensator C, plant G and feedback path H in a small Python syntax and see the s-plane or z-plane root locus for K ≥ 0, with ZOH, Tustin or matched discretisation of G and a Padé or whole-sample delay. Pick K on a log slider or by clicking the locus, read the closed-loop poles, critical gain, breakaway points and asymptotes, and check the poles against damping, natural-frequency and settling-time requirements, which returns the passing K intervals or the binding requirement. Cancellations, improper loops and coarse sampling are flagged, the record exports and re-imports as Markdown, and built-in self-tests reproduce textbook cases."
