slug: lug-joint
title: Lug and pin joint calculator
summary: "Preliminary static sizing of a double-shear lug and pin joint, one male lug between two female clevis legs on a solid pin, under axial, transverse or oblique ultimate load. Every failure mode of AFFDL Stress Analysis Manual chapter 9 (lug bearing and net section, bushing, the 1.6-power oblique interaction, pin shear, pin bending with the load-shift refinement, and tangs) gets its allowable, ultimate and yield safety factors and margins, with a calculation trace by equation number, an interaction diagram and an angle sweep. Units switch per quantity, inputs save as JSON or a link, the joint saves as a narrated Markdown deck to open in beamdswitch for slides and a video, and the page checks itself against the chapter's worked example on every load."
