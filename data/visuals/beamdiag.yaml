slug: beamdiag
title: Beam diagram creator
summary: "Build a straight beam with pinned and fixed supports, point forces, couples and distributed loads, and choose its section and material. Reactions, shear force, bending moment and deflection are solved in the browser by the stiffness method, so fixed–fixed, propped and continuous (statically indeterminate) beams work, and every jump at a point load or couple is kept. The same model downloads as an MSC Nastran SOL 101 .bdf deck; results are checked against an independent exact-arithmetic Python solver."
