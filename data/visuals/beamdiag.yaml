slug: beamdiag
title: Beam diagram creator
summary: "Build a straight beam with pinned and fixed supports, point forces, couples and distributed loads, and choose its section and material. Reactions, shear force, bending moment and deflection are solved in the browser by the stiffness method, so fixed–fixed, propped and continuous (statically indeterminate) beams work, and every jump at a point load or couple is kept. Pick a consistent unit convention (N, mm, MPa by default; also kN, m; N, m; lbf, in; kip, in) for inputs, results and the deck, measure x from the left end or from mid-span, and read diagrams with labelled axes. Save the figure as PNG, SVG or PDF, or download the model as a hand-readable MSC Nastran SOL 101 .bdf deck or as a narrated Markdown deck to open in beamdswitch for slides and a video; results are checked against an independent exact-arithmetic Python solver."
