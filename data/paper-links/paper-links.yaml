- title: Comprehensive Glossary of Algebraic Geometry
  url: https://c-keyes.github.io/files/definitions.pdf
  category: github.io
  note: 'Comprehensive Glossary of Algebraic Geometry. A 46-page reference dictionary compiling core definitions
    and theorems:

    - **Abelian Categories & Additivity:** Categories equipped with biproducts $\bigoplus$, kernels, cokernels,
    and the first isomorphism theorem $\operatorname{Coim}(f) \cong \operatorname{Im}(f)$. Semiadditive
    categories satisfy $\coprod \cong \prod$, yielding semiring structures on endomorphism sets $\operatorname{End}(X)$.

    - **Ampleness & Positivity:** A line bundle $\mathcal{L}$ on a projective scheme $X$ is very ample
    if it admits a closed immersion $X \hookrightarrow \mathbb{P}_A^n$ defined by global sections; ample
    if $\mathcal{L}^{\otimes m}$ is very ample for some $m > 0$. Base-point freeness means global sections
    generate the stalks $\mathcal{L}_x$ everywhere.

    - **Divisors & Canonical Sheaves:** Cartier divisors are global sections of $\mathcal{K}_X^\times
    / \mathcal{O}_X^\times$. Weil divisors $\sum n_i Y_i$ are formal integer linear combinations of codimension-1
    prime subvarieties. The canonical bundle $\omega_X = \det(\Omega_{X/k}^1)$ is the top exterior power
    of Kähler differentials, acting as the dualizing sheaf in Serre duality.

    - **Morphisms & Flatness:** Flat morphisms preserve exact sequences under tensor products $\mathcal{F}
    \otimes_{\mathcal{O}_Y} \mathcal{O}_X$, ensuring constant Hilbert polynomials across fibers. Étale
    morphisms are smooth of relative dimension 0 (flat and unramified). Proper morphisms are separated,
    finite type, and universally closed.

    - **Cohomology & Derived Functors:** Sheaf cohomology groups $H^i(X, \mathcal{F}) = R^i\Gamma(X, \mathcal{F})$
    quantify obstructions to gluing local sections into global ones. Flasque and soft sheaves are acyclic,
    computing Čech cohomology without higher derived corrections.'
