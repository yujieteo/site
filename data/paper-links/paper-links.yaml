    Discusses cohomological smoothness, local Verdier duality, and base change for rigid-analytic and
    perfectoid spaces.
- title: De Rham Cohomology on the Fargues-Fontaine Curve
  url: https://arxiv.org/pdf/2105.13028
  category: arxiv.org
  note: De Rham Cohomology on the Fargues-Fontaine Curve. Studies the de Rham period map and vector bundles
    on the Fargues–Fontaine curve in $p$-adic Hodge theory.
- title: Interview with Alain Connes
  url: https://www.nieuwarchief.nl/serie5/pdf/naw5-2010-11-4-250.pdf
  category: nieuwarchief.nl
  note: Interview with Alain Connes. Reflections on noncommutative geometry, quantum mechanics, and mathematical
    research philosophy.
- title: Connes EMS Interview
  url: http://denise.vella.chemla.free.fr/interview-EMS-2008.pdf
  category: free.fr
  note: Connes EMS Interview. Discussion of noncommutative geometry, the Riemann hypothesis, the Triangle
    of Thoughts, and the culture of contemporary mathematics.
- title: Connes on Mathematical Discovery
  url: https://kssarkaria.org/Quotations%20Sources/ConnesInteng.pdf
  category: kssarkaria.org
  note: Connes on Mathematical Discovery. Alain Connes on the importance of grounding concepts in computation,
    exploring non-invariant structures, and organizing mathematical ideas conceptually.
- title: Independent Problem Solving
  url: https://denisevellachemla.eu/mai10.pdf
  category: denisevellachemla.eu
  note: Independent Problem Solving. Alain Connes on learning mathematics independently, deep reflection,
    and challenging existing mathematical dogma.
- title: Plant Analogies and Mental Imagery
  url: http://www.ipm.ac.ir/IPM/news/connes-interview.pdf
  category: ac.ir
  note: Plant Analogies and Mental Imagery. Interview on Kiyoshi Oka's transplantation metaphor for mathematical
    analogies and the role of mental imagery in noncommutative geometry.
- title: Quadratic Forms in Homotopy Theory
  url: https://webhomes.maths.ed.ac.uk/~v1ranick/papers/hopksing.pdf
