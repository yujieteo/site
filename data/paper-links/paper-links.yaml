- title: 'Geometry of the Adele Class Space: Part I'
  url: https://www.youtube.com/watch?v=69-_otYjClg
  category: youtube.com
  note: 'Geometry of the Adele Class Space: Part I. Alain Connes'' lecture exploring:

    - **Number Fields & Schemes:** Unifying number rings $\mathcal{O}_K$, function fields $\mathbb{F}_q(C)$,
    and Riemann surfaces as 1-dimensional regular schemes.

    - **Galois Theory & Etale Topology:** Separable algebras, traces, finite étale morphisms, and why
    $\operatorname{Spec} \mathbb{Z}$ behaves as a simply connected 3-manifold where primes are knots.

    - **Topos Semantics:** Topoi allow groups/monoids to act naturally. The topos $([0, \infty) \rtimes
    \mathbb{N}^\times)$ computes points over the Boolean semifield $\mathbb{B} = \{0,1\}$, recovering
    the adèle class space.'
- title: 'Geometry of the Adele Class Space: Part II'
  url: https://www.youtube.com/watch?v=XPVfElqM264
  category: youtube.com
  note: 'Geometry of the Adele Class Space: Part II. Alain Connes'' second lecture:

    - **Adèles & Global Fields:** Global fields sit discretely and cocompactly in their locally compact
    adèle rings $\mathbb{A}_K$.

    - **Trace Formulas & Absorption Spectra:** The scaling action on $K_v$ has Schwartz kernel $\delta(y
    - \lambda x)$ with trace $\int \delta(x - \lambda x)\,dx = 1/|1-\lambda|$. Zeros of $L$-functions
    emerge as an absorption spectrum, explaining the minus sign in explicit formulas.

    - **The Arithmetic Site:** The topos $(\mathbb{N}^\times, \mathbb{Z}_{\max})$ over the tropical semifield
    $\mathbb{R}_{\max}$ exhibits Frobenius automorphisms $\operatorname{Fr}_\lambda(x) = x^\lambda$, establishing
    an explicit Riemann–Roch theorem for number fields.'
