- title: Ravi Vakil on Mathematical Writing
  url: https://math.stanford.edu/~vakil/greatwriting.html
  category: stanford.edu
  note: Ravi Vakil on Mathematical Writing. Advice, reflections, and guidance on writing clearly and effectively
    in mathematics.
- title: Adelic and Classical Modular Forms for GL(2)
  url: https://math.uchicago.edu/~emerton/gl2.pdf
  category: uchicago.edu
  note: Adelic and Classical Modular Forms for GL(2). An exposition of the translation between classical
    modular forms and automorphic forms on the adelic group $\mathrm{GL}_2(\mathbb{A}_{\mathbb{Q}})$.
    Provides a geometric interpretation of modular forms as sections of line bundles over modular curves,
    along with minimal ad hoc constructions of Eisenstein series. Details the Lie algebra $\mathfrak{gl}_2(\mathbb{R})$
    with basis elements $Z, H, Y_+, Y_-$, where the center $\mathcal{Z}(\mathfrak{gl}_2)$ of the universal
    enveloping algebra is isomorphic to a polynomial ring in two generators. Explores the space of bases
    $B$ of $\mathbb{C}$ as a real vector space, identifying it as an open subset of $\mathbb{C}^2$ with
    commuting left and right actions by $\mathrm{GL}_2(\mathbb{R})$ and $\mathrm{GL}_1(\mathbb{C})$. The
    right action of $\mathrm{GL}_2(\mathbb{R})$ is complex analytic and gives an identification with the
    upper half-plane $\mathcal{H}^{\pm} \times \mathbb{C}^\times$ via $(\tau, z) \mapsto \left(\frac{a\tau+c}{b\tau+d},
    (b\tau+d)z\right)$. Examines the complexified Lie algebra tangent space decomposition into holomorphic
    and anti-holomorphic subspaces, the subspace $V_i \subset \mathfrak{gl}_2$, and the bijection $B/\mathrm{GL}_2(\mathbb{Z})
    \cong \mathcal{L}$ with the moduli of discrete rank-2 lattices. Covers moderate growth conditions,
    smooth adelic automorphic forms, and representations invariant under right translation by $\mathrm{GL}_2(\mathbb{A}_f)$.
- title: Deligne on Modular Forms
  url: https://publications.ias.edu/sites/default/files/5_FormesModulaires.pdf
  category: ias.edu
  note: Deligne on Modular Forms. Foundational notes by Pierre Deligne on the algebraic and geometric
    theory of modular forms, referenced in Emerton's notes.
- title: Alex Youcis
  url: https://ayoucis.wordpress.com/2015/09/17/shimura-varieties-motivation/
  category: wordpress.com
  note: Alex Youcis, Motivation behind Shimura Varieties. This will be the first in a series of posts
    discussing Shimura varieties. In particular, we will focus here on a sort of broad motivation for
    the subject—why Shimura varieties are a natural thing to study and, in particular, what they give
    us.
- title: Algebraic Geometry and Arithmetic Duality
  url: https://www.intlpress.com/site/pub/files/_fulltext/journals/cdm/1997/1997/0001/CDM-1997-1997-0001-a001.pdf
  category: intlpress.com
  note: Algebraic Geometry and Arithmetic Duality. Connects the eigenvalues of the Frobenius action on
    étale cohomology $H_{\text{ét}}^*(X, \mathbb{Q}_\ell)$ to the zeros and poles of zeta functions, completing
    the arithmetic dictionary via the adèle class space.
- title: Class Field Theory and Noncommutative Geometry
  url: https://indico.math.cnrs.fr/event/10843/contributions/12868/
  category: cnrs.fr
  note: Class Field Theory and Noncommutative Geometry. An exposition by Alain Connes on class field theory
    through the lens of the adèle class space $X_{\mathbb{Q}} = \mathbb{Q}^\times \backslash \mathbb{A}_{\mathbb{Q}}$.
    Abelian extensions of a number field $K$ are encoded internally by its idele class group $C_K = \mathbb{A}_K^\times
    / K^\times$, acting as a Galois group of the maximal abelian extension via Artin reciprocity. Galois
    actions on roots are realized through group actions on spaces. The quotient space $X_K = K^\times
    \backslash \mathbb{A}_K$ is ergodic with respect to the Haar measure, serving as a prototype noncommutative
    space (leaf space of a foliation). Translates local-to-global class field theory via the inclusion
    of local isotropy groups $K_v^\times \hookrightarrow C_K$. Connects the Riemann–Weil explicit formulas
    $\sum_v \int f(u)/|1-u|\,d^*u$ to a trace formula for the scaling operator on the adèle class space.
    Introduces the scaling site $X_{\mathbb{Q}} = \mathbb{Q}^\times \backslash \mathbb{A}_{\mathbb{Q}}
    / \widehat{\mathbb{Z}}^\times$, modeled as a noncommutative space of rank-1 subgroups of $\mathbb{R}$,
    where periodic orbits of length $\log p$ correspond to prime numbers $p$, realizing the Frobenius
    endomorphism as a mapping torus. Relates this construction to Grothendieck's étale fundamental group
    $\pi_1^{\text{ét}}$ and the 3D topology of $\operatorname{Spec} \mathbb{Z}$.
- title: Overview of O-Minimality
  url: https://math.berkeley.edu/~scanlon/papers/O-min-midrasha.pdf
  category: berkeley.edu
  note: Overview of O-Minimality. Scanlon's survey on o-minimal structures, tame topology, and their applications
    in model theory and arithmetic geometry.
- title: Maximal Abelian Extensions Unramified Outside S
  url: https://math.stackexchange.com/questions/1897078/maximal-abelian-extension-unramified-outside-a-set-of-primes
  category: stackexchange.com
  note: Maximal Abelian Extensions Unramified Outside S. Discussion and computation of the maximal abelian
    extension $K_S^{\text{ab}}$ of a number field $K$ unramified outside a finite set of places $S$. For
    a singleton prime $S = \{p\}$, $K_S^{\text{ab}}$ is given by the direct limit of ray class fields
    modulo $\mathfrak{p}^n \mathcal{O}_K$. Explains ramification at infinite places and the Galois group
    $G_S(K)^{\text{ab}} = G_S(K) / \overline{[G_S(K), G_S(K)]}$. Details the connection to class field
    theory, Poitou–Tate duality, and the Kronecker–Weber theorem for $K = \mathbb{Q}$.
- title: Direct Proof of the Kronecker-Weber Theorem
  url: https://kskedlaya.org/18.786/ps10.pdf
  category: kskedlaya.org
  note: Direct Proof of the Kronecker-Weber Theorem. Lemmermeyer's direct proof showing that every finite
    abelian extension of $\mathbb{Q}$ is contained in a cyclotomic field $\mathbb{Q}(\zeta_m)$.
- title: Ergodicity of Global Fields on Adeles
  url: https://arxiv.org/pdf/1211.3256
  category: arxiv.org
  note: Ergodicity of Global Fields on Adeles. Rigorous proof of the ergodicity of the action of $K^\times$
    on the adèle ring $\mathbb{A}_K$ for global fields in both the number field and function field settings.
- title: Perspectives on Reciprocity Laws
  url: https://www.math.uchicago.edu/~emerton/pdffiles/reciprocity.pdf
  category: uchicago.edu
  note: Perspectives on Reciprocity Laws. Emerton's survey on reciprocity from Gauss's quadratic reciprocity
    to Langlands functoriality. Compares Dirichlet's analytic class number formula for $L(1, \chi)$ (automorphic
    side) with Dedekind's class number formula (motivic side) and discusses the Sato–Tate conjecture.
- title: Categorical p-Adic Langlands Correspondence
  url: https://arxiv.org/pdf/2210.01404
  category: arxiv.org
  note: Categorical p-Adic Langlands Correspondence. Comprehensive 252-page treatise by Emerton and Helm
    formulating the categorical $p$-adic Langlands program in both Banach and rigid analytic settings.
- title: Reductive Group Schemes after SGA3
  url: https://math.stanford.edu/~conrad/papers/luminysga3.pdf
  category: stanford.edu
  note: Reductive Group Schemes after SGA3. Brian Conrad's foundational notes on the theory and classification
    of reductive group schemes over general bases.
- title: Research Remarks by Matthew Emerton
  url: https://math.uchicago.edu/~emerton/research.html
  category: uchicago.edu
  note: Research Remarks by Matthew Emerton. Collection of notes, papers, and essays by Matthew Emerton
    on automorphic forms, Galois representations, and the Langlands program.
- title: Fourier Analysis vs Representation Theory
  url: https://mathoverflow.net/questions/37021/is-fourier-analysis-a-special-case-of-representation-theory-or-an-analogue/37189#37189
  category: mathoverflow.net
  note: Fourier Analysis vs Representation Theory. Discussion on the relationship between harmonic analysis
    and group representations. Highlights the Peter–Weyl theorem for compact groups $G$, decomposing $L^2(G)
    \cong \widehat{\bigoplus}_{\pi} V_\pi \otimes V_\pi^*$, and the Plancherel decomposition for non-compact
    type I groups via Harish-Chandra's work.
- title: Harmonic Analysis and Physics
  url: https://math.stackexchange.com/questions/58515/what-is-fourier-analysis-on-groups-and-does-it-have-applications-to-physics/58591#58591
  category: stackexchange.com
  note: Harmonic Analysis and Physics. Survey of Plancherel decompositions on reductive Lie groups and
    Bargmann's classification of irreducible unitary representations of $\mathrm{SL}_2(\mathbb{R})$ with
    physical applications.
- title: Conceptual Meaning of the Weil Conjectures
  url: https://mathoverflow.net/questions/14849/what-would-a-moral-proof-of-the-weil-conjectures-require/14852#14852
  category: mathoverflow.net
  note: Conceptual Meaning of the Weil Conjectures. Discussion on the philosophical and geometric requirements
    for proving the Weil conjectures via Weil cohomology theories, standard conjectures, and motives.
- title: Shimura's Problem and Class Field Theory
  url: https://mathoverflow.net/questions/10201/a-problem-of-shimura-and-its-relation-to-class-field-theory/10217#10217
  category: mathoverflow.net
  note: 'Shimura''s Problem and Class Field Theory. Explores the connection between polynomial splitting
    fields, ray class groups, and complex multiplication. Example: splitting of polynomials generating
    abelian extensions inside cyclotomic fields like $\mathbb{Q}(\zeta_7)$.'
- title: Geometric Realization of Galois Representations
  url: https://mathoverflow.net/questions/62155/how-to-find-the-varieties-whose-cohomology-realizes-certain-representations/62211#62211
  category: mathoverflow.net
  note: Geometric Realization of Galois Representations. Realizing 2-dimensional Galois representations
    attached to modular forms inside the étale cohomology $H^1_{\text{ét}}(X_0(N)_{\overline{\mathbb{Q}}},
    \mathbb{Q}_\ell)$ of modular curves, leading to Shimura varieties.
- title: The Moment Map and Equivariant Cohomology
  url: https://www.math.stonybrook.edu/~mmovshev/MAT570Spring2008/BOOKS/atiyahbott_moment.pdf
  category: stonybrook.edu
  note: 'The Moment Map and Equivariant Cohomology. Atiyah and Bott''s foundational paper on the de Rham
    localization theorem in equivariant cohomology $H_G^*(M)$. Links Hamiltonian group actions, moment
    maps $\mu: M \to \mathfrak{g}^*$, symplectic reduction, and the Duistermaat–Heckman exact stationary
    phase formula. Connects equivariant localization to moduli spaces of bundles on Riemann surfaces and
    Yang–Mills theory.'
- title: Atiyah-Bott Localization in Geometry
  url: https://math.uchicago.edu/~may/REU2019/REUPapers/Lee%2CJaeHee.pdf
  category: uchicago.edu
  note: Atiyah-Bott Localization in Geometry. Jae Hee Lee's expository REU paper detailing the Atiyah–Bott
    localization theorem, equivariant characteristic classes, and topological invariants of quotient manifolds.
- title: Moment Maps and Diffeomorphisms in Gauge Theory
  url: http://bogomolov-lab.ru/G-sem/AJM-3-1-001-016.pdf
  category: bogomolov-lab.ru
  note: Moment Maps and Diffeomorphisms in Gauge Theory. Donaldson's paper interpreting the curvature
    of a connection on a surface principal bundle as a moment map for the gauge group action, applied
    to Yang–Mills equations.
- title: Convex Body Geometry by Keith Ball
  url: https://math.uchicago.edu/~shmuel/AAT-readings/Combinatorial%20Geometry%2C%20Concentration%2C%20Real%20Algebraic%20Geometry/ball.pdf
  category: uchicago.edu
  note: Convex Body Geometry by Keith Ball. Comprehensive introduction to convex geometry, volume computation
    of Euclidean balls, the Hahn–Banach separation theorem, and extremal properties of polytopes and cubes.
- title: Non-Perturbative BV Theory via Derived Geometry
  url: https://arxiv.org/pdf/2307.15106
  category: arxiv.org
  note: Non-Perturbative BV Theory via Derived Geometry. Formulating non-perturbative Batalin–Vilkovisky
    (BV) quantization within derived differential geometry and shifted symplectic structures.
- title: Grothendieck's Tohoku Paper
  url: https://www.math.mcgill.ca/barr/papers/gk.pdf
  category: mcgill.ca
  note: Grothendieck's Tohoku Paper. Michael Barr's commentary on Grothendieck's landmark 1957 paper introducing
    abelian categories, derived functors $R^i F$, injective resolutions, sheaf cohomology, and the Grothendieck
    spectral sequence. Establishes the foundations for Serre duality and Ext functors of sheaves.
- title: Lectures on Serre's Modular Invariance Conjectures
  url: https://wstein.org/edu/Fall2003/252/references/ribet-stein-serre/ribet-stein.pdf
  category: wstein.org
  note: 'Lectures on Serre''s Modular Invariance Conjectures. Ribet and Stein''s exposition on Serre''s
    modularity conjecture linking odd, irreducible Galois representations $\rho: \operatorname{Gal}(\overline{\mathbb{Q}}/\mathbb{Q})
    \to \mathrm{GL}_2(\mathbb{F}_p)$ to modular forms of specific weight and level.'
- title: Injective Resolutions in Sheaf Cohomology
  url: https://mathoverflow.net/questions/1151/sheaf-cohomology-and-injective-resolutions
  category: mathoverflow.net
  note: Injective Resolutions in Sheaf Cohomology. Comparison between computing sheaf cohomology using
    acyclic resolutions (e.g., flasque, soft, fine, or Čech on affine covers) and universal injective
    resolutions.
- title: Nilpotent Connections and Picard-Fuchs Equations
  url: https://www.numdam.org/item/10.1007/BF02684688.pdf
  category: numdam.org
  note: Nilpotent Connections and Picard-Fuchs Equations. Nick Katz's classic paper on regular singular
    differential equations, Gauss–Manin connections, and $p$-adic nilpotence.
- title: Serre's Faisceaux Algébriques Cohérents (FAC)
  url: https://achinger.impan.pl/fac/fac.pdf
  category: impan.pl
  note: Serre's Faisceaux Algébriques Cohérents (FAC). Annotated translation of Serre's 1955 paper developing
    coherent sheaves $\mathcal{O}_X$-modules and Čech cohomology on algebraic varieties under the Zariski
    topology.
- title: Transversality of a General Translate
  url: https://www.numdam.org/item/CM_1974__28_3_287_0.pdf
  category: numdam.org
  note: Transversality of a General Translate. Kleiman's 12-page paper on the transversality of general
    translates in Schubert calculus and enumerative geometry over algebraically closed fields in characteristic
    zero.
- title: Introduction to Nonlinear PDEs
  url: https://web.math.princeton.edu/~seri/papers/gowers-Aug4-2006.pdf
  category: princeton.edu
  note: Introduction to Nonlinear PDEs. Sergiu Klainerman's comprehensive 72-page introduction to modern
    nonlinear wave equations and evolutionary PDEs.
- title: Brill-Noether Theory on K3 Surfaces
  url: https://www.math.stonybrook.edu/robert.lazarsfeld/Reprints/Lazarsfeld.BNP.pdf
  category: stonybrook.edu
  note: Brill-Noether Theory on K3 Surfaces. Robert Lazarsfeld's 10-page proof of the Brill–Noether theorem
    and Gieseker's theorem using vector bundles on $K3$ surfaces with $\operatorname{Pic}(X) \cong \mathbb{Z}$.
- title: Enumerative Geometry of Moduli Spaces of Curves
  url: https://www.dam.brown.edu/people/mumford/alg_geom/papers/1983b--EnumGeomModuli-NC.pdf
  category: brown.edu
  note: Enumerative Geometry of Moduli Spaces of Curves. David Mumford's 58-page paper constructing the
    Chow ring $A^*(\overline{\mathcal{M}}_g)$ of the moduli space of stable curves, defining tautological
    classes $\kappa_i, \psi_i, \lambda_i$, and applying Grothendieck–Riemann–Roch.
- title: Serre's GAGA Translation
  url: https://thomaskwaring.github.io/gaga.pdf
  category: github.io
  note: Serre's GAGA Translation. English translation of Serre's 1956 paper Géométrie Algébrique et Géométrie
    Analytique establishing the equivalence between algebraic coherent sheaves and analytic coherent sheaves
    on projective complex varieties.
- title: Terence Tao's Harmonic Analysis Notes
  url: https://www.math.ucla.edu/~tao/247a.1.06f/
  category: ucla.edu
  note: Terence Tao's Harmonic Analysis Notes. Course materials covering Calderón–Zygmund theory, interpolation,
    singular integrals, and oscillatory integrals.
- title: Calderon-Zygmund-Stein Theory
  url: https://www.math.ucla.edu/~tao/247a.1.06f/notes1.pdf
  category: ucla.edu
  note: Calderon-Zygmund-Stein Theory. Tao's notes on classical Calderón–Zygmund theory, kernel estimates,
    and singular integral bounds on $L^p$ spaces.
- title: Complex and Real Interpolation
  url: https://www.math.ucla.edu/~tao/247a.1.06f/notes2.pdf
  category: ucla.edu
  note: Complex and Real Interpolation. Exposition of the Riesz–Thorin complex interpolation theorem,
    Marcinkiewicz real interpolation, and bounds on linear operators.
- title: Hardy-Littlewood Maximal Inequality
  url: https://www.math.ucla.edu/~tao/247a.1.06f/notes3.pdf
  category: ucla.edu
  note: Hardy-Littlewood Maximal Inequality. Detailed treatment of the Hardy–Littlewood maximal operator
    $Mf(x)$, weak $(1,1)$ bounds, and $L^p$ maximal inequalities.
- title: The Hilbert Transform
  url: https://www.math.ucla.edu/~tao/247a.1.06f/notes4.pdf
  category: ucla.edu
  note: The Hilbert Transform. Theory of the Hilbert transform, singular integral operators failing on
    the diagonal, and principal value integrals.
- title: Weighted Norm Inequalities
  url: https://www.math.ucla.edu/~tao/247a.1.06f/notes5.pdf
  category: ucla.edu
  note: Weighted Norm Inequalities. Muckenhoupt $A_p$ weights, weighted $L^p$ estimates, and boundedness
    of maximal operators.
- title: Introduction to Fourier Summation
  url: https://www.math.ucla.edu/~tao/247a.1.06f/notes0.pdf
  category: ucla.edu
  note: Introduction to Fourier Summation. Motivating harmonic analysis through convergence of Fourier
    series and $L^p$ norm interpolation between extreme bounds.
- title: Paraproducts and Bilinear Operators
  url: https://www.math.ucla.edu/%7Etao/247b.1.07w/notes6.pdf
  category: ucla.edu
  note: Paraproducts and Bilinear Operators. Analysis of multilinear operators, Coifman–Meyer paraproducts,
    and pointwise nonlinear estimates.
- title: The T(1) Theorem
  url: https://www.math.ucla.edu/%7Etao/247b.1.07w/notes7.pdf
  category: ucla.edu
  note: The T(1) Theorem. David and Journé's $T(1)$ theorem for $L^2$-boundedness of non-convolution Calderón–Zygmund
    operators via paraproducts and BMO estimates.
- title: Oscillatory Integrals
  url: https://www.math.ucla.edu/%7Etao/247b.1.07w/notes8.pdf
  category: ucla.edu
  note: Oscillatory Integrals. Stationary phase methods, van der Corput lemma, and asymptotic estimation
    of oscillatory integrals.
- title: Harmonic Analysis on Finite Abelian Groups
  url: https://www.math.ucla.edu/%7Etao/247b.1.07w/notes9.pdf
  category: ucla.edu
  note: Harmonic Analysis on Finite Abelian Groups. Discrete Fourier transforms, Pontryagin duality for
    finite groups, and convolution identities without measure-theoretic subtleties.
- title: Representation Theory of Finite Non-Abelian Groups
  url: https://www.math.ucla.edu/%7Etao/247b.1.07w/notes10.pdf
  category: ucla.edu
  note: Representation Theory of Finite Non-Abelian Groups. Noncommutative harmonic analysis, character
    theory, matrix coefficients, and Fourier inversion for finite non-abelian groups.
- title: Advanced Harmonic Analysis
  url: https://www.math.ucla.edu/~tao/247b.1.07w/
  category: ucla.edu
  note: Advanced Harmonic Analysis. Course archive covering Littlewood–Paley theory, BMO spaces, and dispersive
    PDE techniques.
- title: Tate's Arithmetic of Elliptic Curves
  url: https://www.math.mcgill.ca/darmon/courses/16-17/mf/tate.pdf
  category: mcgill.ca
  note: Tate's Arithmetic of Elliptic Curves. Henri Darmon's notes based on Tate's classic lectures on
    elliptic curves, group laws, and formal groups.
- title: Number Theoretic Background for Tate's Thesis
  url: https://mathweb.ucsd.edu/~csorense/teaching/math205/Tate_Weil.pdf
  category: ucsd.edu
  note: Number Theoretic Background for Tate's Thesis. Claus Sorensen's notes on local fields, Haar measures,
    and Tate's Fourier-analytic reformulation of zeta functions.
- title: Supersymmetry and Morse Theory
  url: https://projecteuclid.org/journals/journal-of-differential-geometry/volume-17/issue-4/Supersymmetry-and-Morse-theory/10.4310/jdg/1214437492.pdf
  category: projecteuclid.org
  note: Supersymmetry and Morse Theory. Edward Witten's paper deriving the Morse inequalities through
    perturbations $d_t = e^{-th} d e^{th}$ of the de Rham complex and supersymmetric quantum mechanics.
- title: Equidistribution and the Bogomolov Conjecture
  url: https://archive.ymsc.tsinghua.edu.cn/pacm_download/355/9118-bogomolov.pdf
  category: edu.cn
  note: Equidistribution and the Bogomolov Conjecture. Shou-Wu Zhang's paper proving the Bogomolov conjecture
    for curves via arithmetic intersection theory and Arakelov heights.
- title: Characteristic Classes by Milnor and Stasheff
  url: https://webhomes.maths.ed.ac.uk/~v1ranick/papers/milnstas.pdf
  category: ac.uk
  note: Characteristic Classes by Milnor and Stasheff. Classic textbook on vector bundles, Stiefel–Whitney
    classes, Chern classes, Pontryagin classes, and the Euler class.
- title: Morse Theory by John Milnor
  url: https://webhomes.maths.ed.ac.uk/~v1ranick/papers/milnmors.pdf
  category: ac.uk
  note: Morse Theory by John Milnor. Classic text on critical point theory, handlebody attachments, and
    the topology of smooth manifolds.
- title: Topology from the Differentiable Viewpoint
  url: https://www.ux1.eiu.edu/~cidelman/Classes/4855%20and%205220/Supplementary%20Texts/MilnorTopDiffVpt.pdf
  category: eiu.edu
  note: Topology from the Differentiable Viewpoint. Milnor's text covering smooth maps, regular values,
    Sard's theorem, Brouwer degree, and the Hopf degree theorem.
- title: Serre's A Course in Arithmetic
  url: https://www.math.purdue.edu/~jlipman/MA598/Serre-Course%20in%20Arithmetic.pdf
  category: purdue.edu
  note: Serre's A Course in Arithmetic. Classic introduction to finite fields, $p$-adic fields, quadratic
    forms, the Hasse–Minkowski theorem, Dirichlet $L$-series, and modular forms for $\mathrm{SL}_2(\mathbb{Z})$.
- title: Differential Forms in Algebraic Topology
  url: https://www.math.auckland.ac.nz/~hekmati/Books/BottTu.pdf
  category: ac.nz
  note: Differential Forms in Algebraic Topology. Bott and Tu's book covering de Rham cohomology, Mayer–Vietoris
    sequences, Poincaré duality, the Thom isomorphism, and spectral sequences.
- title: Galois Representations of Elliptic Curves
  url: https://static1.squarespace.com/static/57bf2a6de3df281593b7f57d/t/600db4f1676f6519410f71e9/1611511026377/serre_1972_translation.pdf
  category: squarespace.com
  note: Galois Representations of Elliptic Curves. English translation of Serre's 1972 paper on the open
    image theorem for $\ell$-adic representations $\operatorname{Gal}(\overline{\mathbb{Q}}/\mathbb{Q})
    \to \mathrm{GL}_2(\mathbb{Z}_\ell)$ of non-CM elliptic curves.
- title: Lectures on N(X)
  url: https://www.college-de-france.fr/media/jean-pierre-serre/UPL9140953003901187132_14___Lectures_on_N_X.pdf
  category: college-de-france.fr
  note: Lectures on N(X). Serre's lectures on counting rational points on algebraic varieties over finite
    fields, exponential sums, and Chebyshev-type bounds.
- title: The Six-Functor Formalism on Infinity-Categories
  url: https://arxiv.org/pdf/2510.26269
  category: arxiv.org
  note: The Six-Functor Formalism on Infinity-Categories. Scholze's paper establishing the six-functor
    formalism as a lax symmetric monoidal functor from a category of correspondences $\operatorname{Corr}(\mathcal{C},
    E)$ to $\operatorname{Cat}_\infty$. Formulates pushforward $f_*$, proper pushforward $f_!$, pullback
    $f^*$, exceptional pullback $f^!$, tensor product $\otimes$, and internal $\operatorname{\mathcal{R}Hom}$.
    Deduces proper base change and the projection formula $f_!(A \otimes f^*B) \cong f_!(A) \otimes B$
