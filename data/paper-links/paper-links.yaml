    \to \mathbf{Set}$. The affine line $\mathbb{A}^1$ behaves internally as a commutative field where
    every function $\mathbb{A}^1 \to \mathbb{A}^1$ is a polynomial. Group schemes $\mathbb{G}_a, \mathbb{G}_m,
    \mathrm{GL}_n$ appear internally as standard algebraic groups.'
