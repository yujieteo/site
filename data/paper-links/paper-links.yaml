- title: Category Theory in Context
  url: https://emilyriehl.github.io/files/context.pdf
  category: github.io
  note: 'Category Theory in Context. Emily Riehl''s foundational textbook covering:

    - **Preservation, Reflection, Creation:** Functors preserve limits (limit in domain $\implies$ limit
    in codomain), reflect limits (limit cone in image $\implies$ limit cone in domain), and create limits
    (limit in codomain $\implies$ unique limit lifting).

    - **Kan Extensions:** Left Kan extensions $\operatorname{Lan}_K F$ (generalizing colimits) and right
    Kan extensions $\operatorname{Ran}_K F$ (generalizing limits). Pointwise Kan extensions are computed
    via limit formulas over comma categories: $\operatorname{Ran}_K F(d) \cong \lim (d/K \to \mathcal{C}
    \to \mathcal{E})$.

    - **Yoneda & Density:** The Yoneda lemma as a pointwise Kan extension. The co-Yoneda lemma expresses
    every presheaf as a colimit of representables: $F(c) \cong \operatorname{colim}(\mathcal{C}/c \to
    \mathcal{C} \to \mathbf{Set})$.

    - **Codensity Monads:** The right Kan extension of a functor along itself. The codensity monad of
    $\mathbf{FinSet} \hookrightarrow \mathbf{Set}$ is the ultrafilter monad.'
