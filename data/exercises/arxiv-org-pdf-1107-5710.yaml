- id: arxiv-org-pdf-1107-5710#005
  text: How does one define the Hodge Galois group?
  hint: Take the fibre functor taking a real mixed Hodge structure to a graded vector space. The Hodge
    Galois group is a real algebraic group given by the automorphisms of the fibre functor. This fubre
    functor provides an equivalence of categories.
