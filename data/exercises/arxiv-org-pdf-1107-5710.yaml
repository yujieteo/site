- id: arxiv-org-pdf-1107-5710#012
  text: What is a Hodge correlator for semisimple local systems?
  hint: The action of the Lie algebra of the unipotent radical determined by a collection of numbers.
    The Hodge correlators are called correlators since they can be interpreted as correlators for a Feynman
    integral that is probably responsible for the "Hodge site". This is the basic example of the theory.
    For the trivial local system, this was carried out in a paper of Goncharov. For curves with constant
    sheaves and $\delta$-functions, this was carried out in another paper. For the case where $X$. is
    the universal modular curve i.e. basic examples of Shimura varieties? The Hodge correlators contain
    the special values of $L(f,n)$ of weight $k \geq 2$ modular forms for $GL_2(\mathbb{Q})$ outside of
    the critical strip. The simplest Hodge correlators coincide with Rankin-Selberg integrals.
  locator: null
