- id: arxiv-org-pdf-1107-5710#016
  text: How does one construct a Hodge correlator map?
  hint: Use a decorated plane trivalent tree where the vertices are the harmonic bundles and the oriented
    sides are the graded vector space $\mathrm{Ext}^*(V_i, V_{i+1}). Take a plen trivalent tree dual to
    the tirangulation of the polygon. The complement ot the plane trivalent tree is ta union of connected
    domains parametrised by the vertices of the polygon and thus decorated by the harmonic bundles. The
    corresponding harmonic bundles is such that the cyclic order of the bundles agree with the clockwise
    rotation. One constructes a natural trace map invariant under the cyclic shift. For each edge, choose
    a graded splitting of the de Rham complex, then there is a decomposable class with a harmonic representative.$
  locator: null
