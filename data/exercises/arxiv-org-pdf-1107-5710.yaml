- id: arxiv-org-pdf-1107-5710#015
  text: What is a Hodge correlator map?
  hint: a map from the zeroth cyclic homology of harmonic bundles tensored with a pairing. One has to
    study the cyclic homology of a small $dg$-category. With the pairing one can get a cohomology class.
    One also has a homotopy action of the twistor Galois group by $A_\infty$ class. The restriction to
    the subgroup $\mathbb{C}^*$ is the Simpson action on the category of harmonic bundles. There are restrictions
    to the Lie algebra on the unipotent radical and the action is functorial with respect to the pullbacks.
  locator: null
