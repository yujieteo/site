- id: arxiv-org-pdf-1107-5710#008
  text: How does one define the twistor Galois group?
  hint: denote $\mathbb{C}^*$ to be the real algebraic group with the group of complex points. The extension
    induced by the diagonal embedding into $\mathbb{C}^*_{\mathbb{C}/\mathbb{R}}$ is called the twistor
    Galois group. It is a semidirect product of the groups the unipotent radical $U_\mathrm{Hod}$ and
    $\mathbb{C}^*$
