  text: What is a unipotent radical of a real algebraic group.?
  hint: This consists of all unipotent element where subtract the identity and take $n$-powers give 0,
    or torsion under subtraction of identity inside the radical which is the maximal connected normal
    solvable subgroup. Every affine algebraic group has a unique maximal unipotent radical.
