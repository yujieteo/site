  text: What is a Hodge correlator for semisimple local systems?
  hint: The action of the Lie algebra Lie(U_Hod) on local systems is encoded by a collection of numbers
    called Hodge correlators. They are defined via Feynman amplitudes on Riemann surfaces, generalizing
    Green functions. For modular curves, they yield special values L(f, n) outside the critical strip
    and coincide with Rankin-Selberg integrals.
