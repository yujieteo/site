- id: arxiv-org-pdf-1107-5710#000
  text: What is the analogy between Hodge and étale theories?
  hint: The category of l-adic Galois modules is analogous to the abelian category MH_R of real mixed
    Hodge structures. The absolute Galois group Gal(\bar{Q}/Q) acting on étale cohomology of a variety
    over Q corresponds to the Hodge Galois group acting on real mixed Hodge structures. As Beilinson emphasized,
    we lack a geometric "Hodge site" analogous to the étale site.
  locator: null
