- id: www-its-caltech-edu-matilde-entropyslides2021ma148-pdf#007
  text: '(Information Geometry and the Fisher-Rao Metric) On a statistical manifold $\mathcal{M} = \{P_\theta
    = (p_1(\theta), \dots, p_n(\theta))\}$, define the Fisher–Rao information metric $g_{ij}(\theta) =
    \sum_{k=1}^n \frac{1}{p_k(\theta)} \frac{\partial p_k}{\partial \theta^i} \frac{\partial p_k}{\partial
    \theta^j} = \mathbb{E}_\theta \left[ \frac{\partial \log p}{\partial \theta^i} \frac{\partial \log
    p}{\partial \theta^j} \right]$. Show that the coordinate transformation $X_k = \sqrt{p_k}$ embeds
    $\mathcal{M}$ isometrically into a positive Euclidean sphere $S^{n-1}$ with metric $ds^2 = 4 \sum
    dX_k^2$. (Hint: Show that the Fisher–Rao metric is the Hessian of the Kullback–Leibler divergence:
    $g_{ij}(\theta) = \left. \frac{\partial^2}{\partial \theta_1^i \partial \theta_2^j} D_{\text{KL}}(P_{\theta_1}
    \parallel P_{\theta_2}) \right|_{\theta_1 = \theta_2 = \theta}$)'
