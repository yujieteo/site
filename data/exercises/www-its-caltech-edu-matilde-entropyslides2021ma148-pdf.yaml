  text: '(Categorical Characterization of Entropy: Baez-Fritz-Leinster) Let $\mathbf{FinProb}$ be the
    category of finite probability spaces $(X, P)$, where morphisms $f: (X, P) \to (Y, Q)$ are measure-preserving
    maps ($Q(y) = \sum_{x \in f^{-1}(y)} P(x)$). State the Baez–Fritz–Leinster theorem characterizing
    information loss $L(f) = S(P) - S(Q)$: prove that any functor $L: \mathbf{FinProb} \to (\mathbb{R}_{\ge
    0}, +)$ satisfying convex linearity $L(\lambda f \oplus (1-\lambda) g) = \lambda L(f) + (1-\lambda)
    L(g)$ and continuity is a constant non-negative multiple of the Shannon information loss. (Hint: Adapt
    the axioms to Tsallis entropy by replacing convex linearity with $q$-deformed non-extensive convex
    combinations)'
