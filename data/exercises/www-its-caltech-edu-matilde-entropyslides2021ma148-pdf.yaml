- id: www-its-caltech-edu-matilde-entropyslides2021ma148-pdf#005
  text: '(Finite Logarithms and Finite Polylogarithms) On a finite field $\mathbb{F}_p$, define the finite
    logarithm as a solution to the functional equation $\phi(xy) = \phi(x) + \phi(y)$ for $x, y \in \mathbb{F}_p^\times$.
    Define the finite polylogarithm $\operatorname{Li}_n^{(p)}(x) = \sum_{k=1}^{p-1} \frac{x^k}{k^n} \in
    \mathbb{F}_p[x]$, and compute its mod-$p$ differential and Frobenius periodicity relations. (Hint:
    Regard the functional equation cohomologically as the condition that $\phi$ is an additive 1-cocycle
    in group cohomology $H^1(\mathbb{F}_p^\times, \mathbb{F}_p)$)'
