- id: www-its-caltech-edu-matilde-entropyslides2021ma148-pdf#002
  text: '(Tsallis Entropy and q-Deformations) Define the Tsallis non-extensive entropy $S_q(P) = \frac{1}{q-1}\left(1
    - \sum_{i=1}^n p_i^q\right) = -\sum_{i=1}^n p_i^q \ln_q(p_i)$, where $\ln_q(x) = \frac{x^{1-q}-1}{1-q}$
    is the $q$-logarithm. Show that $\lim_{q \to 1} S_q(P) = S(P)$, and formulate the non-extensive pseudo-additivity
    rule for independent subsystems: $S_q(A \star B) = S_q(A) + S_q(B) + (1-q)S_q(A)S_q(B)$. (Hint: Tsallis
    entropy is inspired by Jackson $q$-derivatives and governs non-extensive statistical mechanics)'
