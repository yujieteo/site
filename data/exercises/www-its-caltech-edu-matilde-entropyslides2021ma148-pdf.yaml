- id: www-its-caltech-edu-matilde-entropyslides2021ma148-pdf#000
  text: '(Information, Shannon Entropy, and Khinchin Axioms) Define Shannon information $I(p_i) = -\log
    p_i$ and the Shannon entropy $S(P) = -\sum_{i=1}^n p_i \log p_i$ for a probability distribution $P
    = (p_1, \dots, p_n)$. State the Khinchin axioms (continuity, maximality at the uniform distribution,
    expandability by zero-probability states, and additivity/extensivity for independent subsystems: $S(P
    \otimes Q) = S(P) + S(Q)$). (Hint: Prove the uniqueness theorem showing that any functional satisfying
    the Khinchin axioms is a positive constant multiple of the Shannon entropy)'
