- id: www-its-caltech-edu-matilde-entropyslides2021ma148-pdf#004
  text: '(Combinatorics over F1 vs. Fq-Geometry) Detail the dictionary comparing classical information
    theory to geometry over the field with one element $\mathbb{F}_1$ and its $q$-deformation over finite
    fields $\mathbb{F}_q$: 1. Messages / Words of length $n \longleftrightarrow$ Basis elements of vector
    spaces over $\mathbb{F}_1$ vs. $\mathbb{F}_q^n$. 2. Number of 1s (Hamming weight) $\longleftrightarrow$
    Vector subspace dimension $k$. 3. Number of messages $\binom{n}{k} \longleftrightarrow$ Gaussian binomial
    coefficients (Grassmannians) $\left[ \begin{matrix} n \\ k \end{matrix} \right]_q = \#\operatorname{Gr}(k,
    n)(\mathbb{F}_q)$, where $\lim_{q \to 1} \left[ \begin{matrix} n \\ k \end{matrix} \right]_q = \binom{n}{k}$.
    4. Projective spaces $\mathbb{P}^{n-1}(\mathbb{F}_1) = \{1, \dots, n\}$ as finite sets of cardinality
    $n$. (Hint: Show how Tsallis $q$-deformed entropy corresponds to counting subspaces in $\mathbb{F}_q$-geometry,
    while Shannon entropy recovers the classical limit as $q \to 1$ over $\mathbb{F}_1$)'
