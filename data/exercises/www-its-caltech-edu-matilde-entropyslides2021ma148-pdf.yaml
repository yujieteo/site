- id: www-its-caltech-edu-matilde-entropyslides2021ma148-pdf#001
  text: '(Rényi Entropy, Escort Distributions, and Thermodynamics) Define the Rényi entropy of order $\alpha
    \ge 0$ ($\alpha \ne 1$) by $S_\alpha(P) = \frac{1}{1-\alpha} \log \left( \sum_{i=1}^n p_i^\alpha \right)$.
    Show that $\lim_{\alpha \to 1} S_\alpha(P) = S(P)$. Define the escort distribution $P^{(\beta)}$ with
    partition function $Z(\beta) = \sum_{i=1}^n p_i^\beta$, and relate Rényi entropy to the thermodynamic
    Helmholtz free energy $F(\beta) = -\frac{1}{\beta} \log Z(\beta)$ and the Gibbs equilibrium relation
    $S = \beta(E - F)$. (Hint: Rényi entropy relaxes strong additivity to additivity for independent subsystems;
    its derivative with respect to $\alpha$ connects to the Kullback–Leibler divergence $D_{\text{KL}}(P^{(\alpha)}
    \parallel P) \ge 0$)'
