- id: www-its-caltech-edu-matilde-entropyslides2021ma148-pdf#003
  text: '(Asymptotics of Multinomial Coefficients and Types) For an alphabet of $N$ symbols and an empirical
    frequency distribution $P = (k_1/n, \dots, k_N/n)$ of words of length $n = \sum k_i$, evaluate the
    asymptotic limit of the multinomial coefficient via Stirling''s approximation: $\lim_{n \to \infty}
    \frac{1}{n} \log \binom{n}{k_1, \dots, k_N} = S(P)$. (Hint: In the method of types, the number of
    sequences of a given type $P$ scales exponentially as $e^{n S(P)}$; maximizing the multinomial coefficient
    corresponds to the maximum entropy principle)'
