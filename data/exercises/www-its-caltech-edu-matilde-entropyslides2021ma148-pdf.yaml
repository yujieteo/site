- id: www-its-caltech-edu-matilde-entropyslides2021ma148-pdf#009
  text: '(Hochschild Cohomology of Information Structures: Vigneaux''s Theorem) Let $\mathcal{S}$ be the
    category of observables (random variables on finite probability spaces) with morphisms given by joint
    measurements / refinements. Define the Hochschild cochain complex $C^n(\mathcal{S}, \mathcal{F}) =
    \operatorname{Hom}(\mathcal{S}^{\otimes n}, \mathcal{F})$ for an information structure. State Pierre
    Baudot and Juan-Pablo Vigneaux''s theorem: 1. The 0-th Hochschild cohomology $H^0(\mathcal{S}, \mathbb{R})
    \cong \mathbb{R}$ when $\alpha = 1$, and vanishes otherwise. 2. The 1-cocycles $Z^1(\mathcal{S}, \mathbb{R})$
    satisfying the cocycle condition $F(X \vee Y) = F(X) + F(Y \mid X)$ (the entropy chain rule) are spanned
    uniquely by the Shannon entropy (for extensive additivity) and by the Tsallis entropy $S_\alpha$ (for
    non-extensive deformations). (Hint: The entropy chain rule is the 1-cocycle condition in the Hochschild
    complex of the information algebra)'
