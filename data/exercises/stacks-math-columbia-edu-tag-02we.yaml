- id: stacks-math-columbia-edu-tag-02we#002
  text: What is Meta-Rule 3 (Quantified Geometric Fibers vs. Base Change Failures)?
  hint: Properties of fibers depending on the base field not splitting (irreducible, connected, reduced
    in characteristic $p$, normal) fail under base change along non-separable or non-closed fields (e.g.,
    $\mathbb{C} \otimes_\mathbb{R} \mathbb{C} \cong \mathbb{C} \times \mathbb{C}$ splits into two points);
    stability under base change and fpqc descent is restored by quantifying universally as "geometrically
    $P$" (holding after base change to $\overline{k}$).
  locator: null
