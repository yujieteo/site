  text: Why is an open immersion stable under base change, stable under composition, and effective under
    fpqc descent?
  hint: '6FF: $f^* \cong f^!$ preserves all limits and colimits, and $f_!$ is exact extension-by-zero;
    Base change: pulling back an open subscheme $U \subset Y$ along $g \colon Y'' \to Y$ is the topological
    open preimage $g^{-1}(U) \subset Y''$; Composition: open subschemes of open subschemes are open; fpqc
    descent: an open subscheme is an open sieve, and open subfunctors satisfy fpqc descent.'
  locator: null
