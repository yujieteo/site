- id: stacks-math-columbia-edu-tag-02we#000
  text: What is Meta-Rule 1 (Module and Tensorial Properties) for testing stability under base change
    and fpqc descent?
  hint: Any property $P$ defined by linear-algebraic module data on the structure sheaf $f_*\mathcal{O}_X$
    or differentials $\Omega_{X/Y}^1$ (flat, finite, integral, affine, finite locally free, unramified
    via $\Omega=0$, smooth/étale) is unconditionally stable under all base changes by the right-exactness
    and associativity of $\otimes$, and satisfies effective fpqc/fppf descent by Grothendieck's faithfully
    flat descent for modules.
  locator: null
