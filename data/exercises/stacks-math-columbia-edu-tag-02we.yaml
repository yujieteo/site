  text: How does Rule 4 encode the Projection Formula as an enriched module action?
  hint: For any morphism $f \colon X \to Y$, $A \in \mathcal{D}(X)$, and $B \in \mathcal{D}(Y)$, the natural
    isomorphism $f_!(A \otimes f^* B) \xrightarrow{\sim} f_!(A) \otimes B$ states that $f_!$ is an enriched
    $\mathcal{D}(Y)$-module functor; when $f$ is proper ($f_! \cong f_*$), it becomes $f_*(A \otimes f^*
    B) \cong f_*(A) \otimes B$.
