  text: How does Rule 4 derive the Localization Distinguished Triangle for open/closed complements?
  hint: Let $i \colon Z \hookrightarrow X$ be a closed immersion and $j \colon U \hookrightarrow X$ the
    open complement; by Rule 4, $j_! \cong j_! j^*$, $i_* \cong i_!$, and the unit/counit maps assemble
    into the canonical fiber sequence of functors $j_! j^! \to \mathrm{id}_{\mathcal{D}(X)} \to i_* i^*$,
    which on dualizing objects yields $i_* \omega_Z \to \omega_X \to j_* \omega_U \xrightarrow{+1}$.
