  text: Why is a closed immersion stable under base change, stable under composition, and effective under
    fpqc descent?
  hint: '6FF: $f_* \cong f_!$ is fully faithful; Rule 1: $\mathrm{Spec}(A/I) \times_{\mathrm{Spec}(A)}
