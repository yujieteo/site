- id: stacks-math-columbia-edu-tag-02we#009
  text: Why is a quasi-compact morphism stable under base change, stable under composition, and effective
    under fpqc descent?
  hint: 'Mental trick: affine covers pull back to affine covers; Base change: if $f^{-1}(\mathrm{Spec}(B))
    = \bigcup_{i=1}^n \mathrm{Spec}(A_i)$ is a finite union, pulling back to $\mathrm{Spec}(B'')$ gives
    $\bigcup_{i=1}^n \mathrm{Spec}(A_i \otimes_B B'')$, which remains a finite union; Composition: a finite
    union of finite unions is finite; fpqc descent: an fpqc cover of a target allows reducing a covering
    to a finite subcover.'
