- id: stacks-math-columbia-edu-tag-02we#003
  text: What is Meta-Rule 4 (Six-Functor Operator Encodings for Morphisms)?
  hint: 'Morphism types correspond to six-functor degenerations: $f$ is proper $\iff f_! \cong f_*$ (pushforward
    preserves compact supports); $f$ is étale $\iff f^! \cong f^*$ (no dualizing twist or dimension shift);
    $f$ is cohomologically smooth $\iff f^!(-) \cong f^*(-) \otimes \omega_{X/Y}[d]$ with $\omega_{X/Y}$
    $\otimes$-invertible; $f$ is an open immersion $\iff f^* \cong f^!$ and $f_!$ is exact extension-by-zero;
    $f$ is a closed immersion $\iff f_* \cong f_!$ is fully faithful with counit $f^* f_* \twoheadrightarrow
    \mathrm{id}$.'
