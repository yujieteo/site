  text: How does Rule 4 encode the Proper Base Change Theorem for Cartesian squares?
  hint: For any Cartesian square with $f \colon X \to Y$ proper and $g \colon Y' \to Y$, Rule 4 sets $f_!
    \cong f_*$ and $(f')_! \cong (f')_*$, transforming the general base change isomorphism $g^* f_! \xrightarrow{\sim}
    (f')_! (g')^*$ into the classical proper base change isomorphism $g^* f_* \xrightarrow{\sim} (f')_*
    (g')^*$.
