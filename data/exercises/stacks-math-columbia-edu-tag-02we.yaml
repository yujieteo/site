- id: stacks-math-columbia-edu-tag-02we#001
  text: What is Meta-Rule 2 (Diagonal and Fiber-Product Invariants) for testing separation properties?
  hint: 'Any property defined by "the diagonal $\Delta_f \colon X \to X \times_Y X$ has property $Q$"
    inherits stability and descent directly from $Q$ via $\Delta_{f''} \cong (\Delta_f)_{Y''}$; this generates
    the strict hierarchy: Monomorphism ($\Delta$ is an isomorphism) $\implies$ Separated ($\Delta$ is
    a closed immersion) $\implies$ Semi-separated ($\Delta$ is affine) $\implies$ Quasi-separated ($\Delta$
    is quasi-compact).'
  locator: null
  sub_index: null
  search_text: 'what is meta-rule 2 (diagonal and fiber-product invariants) for testing separation properties?
