- id: stacks-math-columbia-edu-tag-02we#004
  text: Why is an isomorphism of schemes stable under base change, stable under composition, and effective
    under fpqc descent?
  hint: '6FF: $f^*, f_*, f_!, f^!$ are equivalences; Base change: pullbacks of identity maps are identity
    maps; Composition: composites of isomorphisms are isomorphisms; fpqc descent: an isomorphism is a
    trivial descent datum.'
