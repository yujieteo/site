  search_text: 'compute the tate cohomology of $c_2$ acting on $\mathbb{c}^\times$ by complex conjugation:
    $\widehat{h}^0(c_2, \mathbb{c}^\times) = \mathbb{r}^\times / \operatorname{nm}(\mathbb{c}^\times)
    \cong \mathbb{r}^\times / \mathbb{r}_{>0} \cong \mathbb{z}/2\mathbb{z}$, and $\widehat{h}^1(c_2, \mathbb{c}^\times)
    = 0$ by hilbert''s theorem 90'
