- id: websites-umich-edu-viktorb-etale-summer2020-notes-cohomology-of-number-fields-pd#001
  text: 'Compute the Tate cohomology of $C_2$ acting on $\mathbb{C}^\times$ by complex conjugation: $\widehat{H}^0(C_2,
    \mathbb{C}^\times) = \mathbb{R}^\times / \operatorname{Nm}(\mathbb{C}^\times) \cong \mathbb{R}^\times
    / \mathbb{R}_{>0} \cong \mathbb{Z}/2\mathbb{Z}$, and $\widehat{H}^1(C_2, \mathbb{C}^\times) = 0$ by
    Hilbert''s Theorem 90'
  hint: null
  locator:
