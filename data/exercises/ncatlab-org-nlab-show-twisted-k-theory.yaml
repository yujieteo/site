- id: ncatlab-org-nlab-show-twisted-k-theory#001
  text: What is the most famous twist in K-theory?
  hint: The most famous twist is by a class in degree 3 ordinary cohomology. Geometrically a $U(1)$-bundle
    gerbe. Or a circle 2-group princiapl 2 bundle. This failure to glue cleanly is tracked by a 3D grid
    of data where one has $g_{ab} g_{bc} g_{ca} = C_{abc} I$ to be off by a phase factor where $C_{abc}$
    is off by absolute value $1$.
  locator: null
