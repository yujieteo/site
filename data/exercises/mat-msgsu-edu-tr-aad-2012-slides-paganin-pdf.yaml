- id: mat-msgsu-edu-tr-aad-2012-slides-paganin-pdf#005
  text: What is the geometry significance of Hilbert's Theorem 90 and what is the purpose of the first
    Galois cohomology?
  hint: vector spaces descend uniquely from the finite Galois extension $K$ to the field $k$, and there
    are no nontrivial $k$-forms of $K^n$. Note that this changes for other algebraic groups. For example,   the
    projective linear group which classifies central simple algebras via the first Galois cohomology.
    The orthogonal group classifies the quadratic forms. The unitary group classifies the hermitian forms.
    Therefore, the first Galois cohomology is used to classify forms.
