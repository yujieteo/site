- id: en-wikipedia-org-wiki-chromatic-homotopy-theory#002
  text: Why does Morava $K$-theory act as a field object in stable homotopy theory?
  hint: Because $\pi_*(K(n)) \cong \mathbb{F}_p[v_n^{\pm 1}]$ is a graded field where every non-zero homogeneous
    element is invertible; consequently, every $K(n)_*$-module is free, $K(n)$ satisfies a Künneth isomorphism
    $K(n)_*(X \times Y) \cong K(n)_*(X) \otimes_{K(n)_*} K(n)_*(Y)$, and it defines a minimal/prime element
    in the Bousfield lattice.
  locator: null
  sub_index: null
  search_text: why does morava $k$-theory act as a field object in stable homotopy theory? because $\pi_*(k(n))
    \cong \mathbb{f}_p[v_n^{\pm 1}]$ is a graded field where every non-zero homogeneous element is invertible;
    consequently, every $k(n)_*$-module is free, $k(n)$ satisfies a künneth isomorphism $k(n)_*(x \times
    y) \cong k(n)_*(x) \otimes_{k(n)_*} k(n)_*(y)$, and it defines a minimal/prime element in the bousfield
    lattice.
- id: en-wikipedia-org-wiki-chromatic-homotopy-theory#003
  text: What is the Johnson-Wilson spectrum $E(n)$ and how is it used to define the chromatic tower?
  hint: The Landweber exact spectrum with coefficients $\pi_*(E(n)) \cong \mathbb{Z}_{(p)}[v_1, \dots,
    v_n, v_n^{-1}]$; the chromatic tower of a spectrum $X$ is the projective tower of successive Bousfield
    localizations $\dots \to L_{E(n)} X \to L_{E(n-1)} X \to \dots \to L_{E(0)} X = L_{H\mathbb{Q}} X$,
    which reassembles $X$ by the Chromatic Convergence Theorem.
  locator: null
  sub_index: null
  search_text: what is the johnson-wilson spectrum $e(n)$ and how is it used to define the chromatic tower?
    the landweber exact spectrum with coefficients $\pi_*(e(n)) \cong \mathbb{z}_{(p)}[v_1, \dots, v_n,
    v_n^{-1}]$; the chromatic tower of a spectrum $x$ is the projective tower of successive bousfield
