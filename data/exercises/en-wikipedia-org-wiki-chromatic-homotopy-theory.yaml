  text: Why do we care about thick subcategories?
  hint: Thick subcategories formalize the notion of "support" and prime ideals in triangulated categories;
    classifying them via the Hopkins-Smith Thick Subcategory Theorem proves that chromatic height filtration
    is the intrinsic, universal classification of all finite $p$-local spectra.
