- id: en-wikipedia-org-wiki-chromatic-homotopy-theory#006
  text: How is Bousfield localization defined as an initial map and what is its relation to acyclic commutators?
  hint: The localization $L_E X$ is the initial terminal-target map $\eta \colon X \to L_E X$ in the homotopy
    category such that $\eta$ is an $E$-equivalence and $L_E X$ is $E$-local; $E$-local means $[Z, L_E
    X]_* = 0$ for all $E$-acyclic spectra $Z$, so acyclic mapping commutators vanish identically.
  locator: null
  sub_index: null
  search_text: how is bousfield localization defined as an initial map and what is its relation to acyclic
    commutators? the localization $l_e x$ is the initial terminal-target map $\eta \colon x \to l_e x$
    in the homotopy category such that $\eta$ is an $e$-equivalence and $l_e x$ is $e$-local; $e$-local
    means $[z, l_e x]_* = 0$ for all $e$-acyclic spectra $z$, so acyclic mapping commutators vanish identically.
- id: en-wikipedia-org-wiki-chromatic-homotopy-theory#007
  text: What is a Hopf algebroid and what is its purpose in stable homotopy theory?
  hint: A cogroupoid object in commutative rings $(A, \Gamma)$ representing affine groupoid schemes; its
    purpose is to classify formal group laws and their coordinate isomorphisms (e.g., $(M U_*, M U_* M
    U)$ and $(B P_*, B P_* B P)$), allowing Adams-Novikov $E_2$-pages to be computed as algebraic $\mathrm{Ext}_{\Gamma}^*(A,
    A)$ groups.
