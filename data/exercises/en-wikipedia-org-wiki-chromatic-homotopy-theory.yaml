  text: What is the Kervaire invariant and what is the Kervaire invariant 1 phenomenon?
  hint: A $\mathbb{Z}/2\mathbb{Z}$-valued invariant measuring the quadratic refinement of the intersection
    pairing on the middle homology of a $(4k+2)$-dimensional framed manifold; the Kervaire invariant 1
    problem asked in which dimensions such manifolds exist with non-zero invariant, solved by Hill-Hopkins-Ravenel
    who proved they exist only in dimensions $2, 6, 14, 30, 62$, and possibly $126$.
