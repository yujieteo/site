- id: en-wikipedia-org-wiki-chromatic-homotopy-theory#004
  text: Why do we care about the Honda formal group $\Gamma_n$?
  hint: Because over an algebraically closed field of characteristic $p$, every formal group of height
    $n$ is isomorphic to $\Gamma_n$ (defined by $[p]_{\Gamma_n}(x) = x^{p^n}$), making it the single canonical
    basepoint whose deformation space defines Morava $E$-theory and whose automorphism group defines the
    Morava stabilizer group.
