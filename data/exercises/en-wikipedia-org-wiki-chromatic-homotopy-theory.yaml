  text: What is Anderson duality $I_{\mathbb{Z}}$ and how does it relate to Brown-Comenetz duality?
  hint: $I_{\mathbb{Z}}$ is the spectrum representing integer-valued duals via the exact sequence $0 \to
    \mathrm{Ext}^1(\pi_{-(n+1)} X, \mathbb{Z}) \to I_{\mathbb{Z}}^n(X) \to \mathrm{Hom}(\pi_{-n} X, \mathbb{Z})
    \to 0$; it is the integral refinement of Brown-Comenetz duality $I_{\mathbb{Q}/\mathbb{Z}}$, which
    represents Pontryagin duality $[X, I_{\mathbb{Q}/\mathbb{Z}}] \cong \mathrm{Hom}(\pi_0 X, \mathbb{Q}/\mathbb{Z})$.
  locator: null
