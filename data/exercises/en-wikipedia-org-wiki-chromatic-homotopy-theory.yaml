  text: Why do we care about chromatic filtrations?
  hint: Chromatic filtration organizes the impossibly complicated, chaotic stable homotopy groups of spheres
    $\pi_*^s$ into a systematic, stratified sequence of periodic layers governed by the geometry of 1-dimensional
    formal groups of heights $n = 0, 1, 2, \dots, \infty$.
