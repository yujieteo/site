  hint: The equivalence of $K O$-module spectra $K O \wedge \mathbb{C}\mathbb{P}^2 \simeq \Sigma^2 K U$
    (or $K O \wedge C(\eta) \simeq K U$ where $C(\eta) = S^0 \cup_\eta e^2$); it shows that complex $K$-theory
    is obtained from real $K$-theory by attaching a single cell along the first Hopf map $\eta \in \pi_1^s$.
