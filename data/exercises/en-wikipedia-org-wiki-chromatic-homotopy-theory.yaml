  text: Why do we care about the Adams Conjecture?
  hint: Proved by Quillen and Sullivan, it states that the spherical fibrations associated to vector bundles
    $V$ and $\psi^k(V)$ become fiber-homotopically equivalent after sufficient fiberwise suspension, which
    completely computed the image of the $J$-homomorphism $\mathrm{im}(J) \subset \pi_*^s$ in terms of
    Bernoulli numbers.
