  text: Why do we care about cofiber and fiber sequences in stable categories?
  hint: In a stable $\infty$-category, cofiber (pushout) squares coincide with fiber (pullback) squares;
    this equivalence produces functorial long exact sequences on homotopy groups and allows spaces and
    spectra to be decomposed into elementary cell attachments without dimension shifts.
