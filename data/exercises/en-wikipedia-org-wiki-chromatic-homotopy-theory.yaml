  text: Why do we care about topological modular forms ($TMF$)?
  hint: $TMF = \mathbf{R}\Gamma(\mathcal{M}_{\mathrm{ell}}, \mathcal{O}^{\mathrm{top}})$ is the universal
    $\mathbb{E}_\infty$-ring spectrum of derived elliptic curves; it captures chromatic height $\le 2$
    phenomena, provides the target for the String orientation / Witten genus in string theory, and inverting
    $\Delta$ yields $TMF[\Delta^{-1}]$, which represents the moduli of smooth elliptic curves.
