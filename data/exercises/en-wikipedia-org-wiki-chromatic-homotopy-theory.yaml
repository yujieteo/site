  text: Why does a generalized cohomology theory require suspension isomorphisms and wedge axioms?
  hint: The suspension isomorphism $E^{n+1}(\Sigma X) \cong E^n(X)$ ensures compatibility with dimension
    shifts and loop spaces, while the wedge axiom $E^n(\bigvee X_i) \cong \prod E^n(X_i)$ guarantees that
    cohomology turns topological coproducts into algebraic direct products, ensuring representability
    by spectra.
