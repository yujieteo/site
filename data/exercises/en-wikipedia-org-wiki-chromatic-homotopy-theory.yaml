  text: What is Brown-Comenetz duality and why does every generalized cohomology functor admit a spectrum
    representation?
  hint: By Brown representability, every contravariant additive functor to abelian groups is representable
    by a spectrum; Brown-Comenetz duality applies this to the Pontryagin dual of homotopy groups $\pi_n(X)^\vee
    = \mathrm{Hom}(\pi_n X, \mathbb{Q}/\mathbb{Z})$, providing an indispensable tool for analyzing the
    monochromatic layers of the sphere.
