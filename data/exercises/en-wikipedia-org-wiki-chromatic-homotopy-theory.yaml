  text: What is the Brown-Peterson ($B P$) spectrum?
  hint: The $p$-local direct summand spectrum of $M U_{(p)}$ whose coefficient ring is $\pi_*(B P) \cong
    \mathbb{Z}_{(p)}[v_1, v_2, \dots]$ with $|v_n| = 2(p^n - 1)$, representing the universal $p$-typical
    1-dimensional formal group law.
