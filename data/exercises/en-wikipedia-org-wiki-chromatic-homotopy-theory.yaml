  text: What is the relation of the Toda-Smith spectrum $V(n)$ to the $B P$ spectrum?
  hint: $V(n)$ is a finite spectrum realizing the quotient of $B P_*$ by its invariant Landweber regular
    sequence, $B P_*(V(n)) \cong B P_*/(p, v_1, \dots, v_n) = B P_*/I_{n+1}$; they provide explicit finite
    geometric test objects of pure chromatic type $n+1$.
