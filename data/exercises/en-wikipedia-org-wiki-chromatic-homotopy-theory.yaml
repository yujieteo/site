  text: Why do we care about the Ravenel Conjectures?
  hint: Formulated by Douglas Ravenel in 1984 and largely solved by Devinatz, Hopkins, and Smith, they
    established that complex cobordism $M U$ completely controls nilpotence, periodicity, and localization
    across the entire stable homotopy category.
