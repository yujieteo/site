  text: What is Spanier-Whitehead duality and why do we care about it on spectra?
  hint: The duality functor $X^\vee = \underline{\mathrm{Map}}(X, \mathbb{S})$ on finite spectra satisfying
    $[X \wedge Y, Z] \cong [Y, X^\vee \wedge Z]$; it provides an exact algebraic duality between homology
    and cohomology ($E_*(X^\vee) \cong E^{-*}(X)$) without dimension shifts.
