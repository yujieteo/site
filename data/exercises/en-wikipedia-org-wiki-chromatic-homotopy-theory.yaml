  text: Why is a formal Lie group over a ring $R$ defined as a formal group scheme and how does it relate
    to classical Lie groups?
  hint: A classical Lie group $G$ has a Lie algebra and an exponential map that defines a local group
    law on a neighborhood of the identity; formalizing this on the infinitesimal neighborhood $\mathrm{Spf}(R[[x]])$
    of the identity via complete topological Hopf algebras defines a formal Lie group over any commutative
    ring.
