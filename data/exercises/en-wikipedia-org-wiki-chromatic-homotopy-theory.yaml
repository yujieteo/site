  text: What is the idempotent Quillen reflector?
  hint: The idempotent map of ring spectra $e \colon M U_{(p)} \to M U_{(p)}$ constructed by Quillen using
    Cartier's theorem on $p$-typical formal group laws, which canonically splits the $p$-local complex
    cobordism spectrum into a wedge of suspensions of the Brown-Peterson spectrum $B P$.
