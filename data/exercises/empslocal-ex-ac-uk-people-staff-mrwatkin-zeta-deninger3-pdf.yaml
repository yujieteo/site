- id: empslocal-ex-ac-uk-people-staff-mrwatkin-zeta-deninger3-pdf#011
  text: '(Comparison with the Connes Adele Class Space Approach) Contrast Deninger''s cohomological regularized
    determinant approach with Alain Connes'' spectral realization on the adèle class space $X_K = K^\times
    \backslash \mathbb{A}_K$: 1. **Deninger:** Formulates an algebraic-geometric cohomology theory with
    a geometric flow $\phi^t$, where zeros of $L(s)$ appear as discrete eigenvalues of an infinitesimal
    generator $\Theta$. 2. **Connes:** Formulates an operator-algebraic trace formula for the scaling
    action of the idèle class group $C_K$, where zeros of $L(s)$ appear as an absorption spectrum (missing
    spectral lines). '
  hint: Both frameworks use periodic orbits of length $\log N(\mathfrak{p})$ to model prime ideals $\mathfrak{p}$
    and translate the Riemann–Weil explicit formulas into Lefschetz-type trace formulas
  locator: null
  sub_index: null
  search_text: '(comparison with the connes adele class space approach) contrast deninger''s cohomological
