- id: empslocal-ex-ac-uk-people-staff-mrwatkin-zeta-deninger3-pdf#006
  text: '(The Riemann Hypothesis as a Self-Adjointness Problem) Show that if the infinitesimal generator
    $\Theta$ on the hypothetical cohomology space $H^1(X, \mathcal{E})$ can be written as $\Theta = \frac{1}{2}
    I + i T$ with $T$ a self-adjoint operator on a Hilbert space ($T = T^*$), then the Riemann Hypothesis
    holds for $\widehat{L}(M, s)$: all non-trivial zeros lie on the critical line $\operatorname{Re}(s)
    = \frac{1}{2}$. '
  hint: The eigenvalues of $T$ are purely real, forcing $\lambda = \frac{1}{2} + i\gamma$, which implies
    $s = 2\pi\lambda$ has real part $\frac{1}{2}$
  locator: null
  sub_index: null
  search_text: '(the riemann hypothesis as a self-adjointness problem) show that if the infinitesimal
    generator $\theta$ on the hypothetical cohomology space $h^1(x, \mathcal{e})$ can be written as $\theta
    = \frac{1}{2} i + i t$ with $t$ a self-adjoint operator on a hilbert space ($t = t^*$), then the riemann
    hypothesis holds for $\widehat{l}(m, s)$: all non-trivial zeros lie on the critical line $\operatorname{re}(s)
    = \frac{1}{2}$.  the eigenvalues of $t$ are purely real, forcing $\lambda = \frac{1}{2} + i\gamma$,
    which implies $s = 2\pi\lambda$ has real part $\frac{1}{2}$'
- id: empslocal-ex-ac-uk-people-staff-mrwatkin-zeta-deninger3-pdf#007
  text: '(Functional Equations and Hodge Duality of Theta) Explain how the functional equation $\widehat{L}(M,
    s) = \varepsilon(M, s) \widehat{L}(M^\vee, 1-s)$ corresponds to a Poincaré–Lefschetz duality on the
    infinite-dimensional cohomology $H^i(X, \mathcal{E})$ that replaces the operator $\Theta$ with its
    dual adjoint $I - \Theta$. '
  hint: The pairing $H^i \otimes H^{2d-i} \to \mathbb{C}$ intertwines the flow $\phi^t$ with its time-reversed
    flow $\phi^{-t}$
  locator: null
  sub_index: null
  search_text: (functional equations and hodge duality of theta) explain how the functional equation $\widehat{l}(m,
    s) = \varepsilon(m, s) \widehat{l}(m^\vee, 1-s)$ corresponds to a poincaré–lefschetz duality on the
    infinite-dimensional cohomology $h^i(x, \mathcal{e})$ that replaces the operator $\theta$ with its
    dual adjoint $i - \theta$.  the pairing $h^i \otimes h^{2d-i} \to \mathbb{c}$ intertwines the flow
    $\phi^t$ with its time-reversed flow $\phi^{-t}$
