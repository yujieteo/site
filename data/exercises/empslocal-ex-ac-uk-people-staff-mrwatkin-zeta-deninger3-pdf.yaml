- id: empslocal-ex-ac-uk-people-staff-mrwatkin-zeta-deninger3-pdf#009
  text: '(The Lefschetz Trace Formula for Flows and Explicit Formulas) Let $\phi^t = \exp(t\Theta)$ be
    the dynamical flow on the foliated arithmetic space $X$. Show that the Guillemin–Sternberg trace formula
    for flows: $$\operatorname{Tr}\left(\phi^t \mid H^*(X)\right) = \sum_{\gamma} \frac{\ell(\gamma)^\#}{|\det(I
    - d\phi_{\gamma}^{\ell(\gamma)})|} \delta(t - \ell(\gamma))$$ recovers the Weil explicit formula $\sum_\rho
    \widehat{h}(\rho) = \widehat{h}(0) + \widehat{h}(1) - \sum_{\mathfrak{p}} \frac{\log N(\mathfrak{p})}{N(\mathfrak{p})^{m/2}}
    \dots$ via Fourier/Laplace transforms. '
  hint: The left-hand side sums over eigenvalues $\rho$ of $\Theta$ and the right-hand side sums over
    the periodic orbits $\gamma_p$ of length $\log N(\mathfrak{p})$
  locator: null
  sub_index: null
  search_text: '(the lefschetz trace formula for flows and explicit formulas) let $\phi^t = \exp(t\theta)$
    be the dynamical flow on the foliated arithmetic space $x$. show that the guillemin–sternberg trace
    formula for flows: $$\operatorname{tr}\left(\phi^t \mid h^*(x)\right) = \sum_{\gamma} \frac{\ell(\gamma)^\#}{|\det(i
    - d\phi_{\gamma}^{\ell(\gamma)})|} \delta(t - \ell(\gamma))$$ recovers the weil explicit formula $\sum_\rho
    \widehat{h}(\rho) = \widehat{h}(0) + \widehat{h}(1) - \sum_{\mathfrak{p}} \frac{\log n(\mathfrak{p})}{n(\mathfrak{p})^{m/2}}
    \dots$ via fourier/laplace transforms.  the left-hand side sums over eigenvalues $\rho$ of $\theta$
    and the right-hand side sums over the periodic orbits $\gamma_p$ of length $\log n(\mathfrak{p})$'
