- id: empslocal-ex-ac-uk-people-staff-mrwatkin-zeta-deninger3-pdf#000
  text: '(The Weil Conjectures Paradigm) For a smooth projective variety $X_0$ over a finite field $\mathbb{F}_q$,
    recall the Lefschetz trace formula for the geometric Frobenius $\operatorname{Fr}_q^*$ on $\ell$-adic
    cohomology: $\zeta(X_0, s) = \prod_{i=0}^{2\dim X} \det\big(I - q^{-s}\operatorname{Fr}_q^* \mid H^i_{\text{ét}}(\overline{X}_0,
    \mathbb{Q}_\ell)\big)^{(-1)^{i+1}}$. '
  hint: The zeros and poles of $\zeta(X_0, s)$ are given by the eigenvalues of the Frobenius operator
    $\operatorname{Fr}_q^*$
  locator: null
  sub_index: null
  search_text: '(the weil conjectures paradigm) for a smooth projective variety $x_0$ over a finite field
    $\mathbb{f}_q$, recall the lefschetz trace formula for the geometric frobenius $\operatorname{fr}_q^*$
    on $\ell$-adic cohomology: $\zeta(x_0, s) = \prod_{i=0}^{2\dim x} \det\big(i - q^{-s}\operatorname{fr}_q^*
    \mid h^i_{\text{ét}}(\overline{x}_0, \mathbb{q}_\ell)\big)^{(-1)^{i+1}}$.  the zeros and poles of
    $\zeta(x_0, s)$ are given by the eigenvalues of the frobenius operator $\operatorname{fr}_q^*$'
- id: empslocal-ex-ac-uk-people-staff-mrwatkin-zeta-deninger3-pdf#001
  text: '(Archimedean Factors and the Gamma Function) Let $L(M, s)$ be the $L$-function of a pure motive
    $M$ over a number field. Recall that the completed $L$-function is $\widehat{L}(M, s) = L(M, s) L_\infty(M,
    s)$, where $L_\infty(M, s)$ is a product of Archimedean $\Gamma$-factors $\Gamma_\mathbb{R}(s) = \pi^{-s/2}\Gamma(s/2)$
    and $\Gamma_\mathbb{C}(s) = 2(2\pi)^{-s}\Gamma(s)$. '
  hint: Serre interpreted these Archimedean factors as local Euler factors associated with infinite places
  locator: null
  sub_index: null
  search_text: (archimedean factors and the gamma function) let $l(m, s)$ be the $l$-function of a pure
    motive $m$ over a number field. recall that the completed $l$-function is $\widehat{l}(m, s) = l(m,
    s) l_\infty(m, s)$, where $l_\infty(m, s)$ is a product of archimedean $\gamma$-factors $\gamma_\mathbb{r}(s)
    = \pi^{-s/2}\gamma(s/2)$ and $\gamma_\mathbb{c}(s) = 2(2\pi)^{-s}\gamma(s)$.  serre interpreted these
    archimedean factors as local euler factors associated with infinite places
- id: empslocal-ex-ac-uk-people-staff-mrwatkin-zeta-deninger3-pdf#002
  text: '(Regularized Determinants / Zeta-Regularization) For an unbounded linear operator $\Theta$ with
    discrete spectrum $(\lambda_n)_{n \ge 0}$ such that $\operatorname{Re}(\lambda_n) > 0$, define the
    spectral zeta function $\zeta_\Theta(z) = \sum_{n=0}^\infty \lambda_n^{-z}$ for $\operatorname{Re}(z)
    \gg 0$. If $\zeta_\Theta(z)$ admits a meromorphic continuation to $z = 0$ that is holomorphic at $z
    = 0$, define the regularized determinant: $$\det{}_{\infty}(s \cdot I - \Theta) := \exp\left( -\left.\frac{d}{dz}\right|_{z=0}
    \zeta_{s I - \Theta}(z) \right).$$ '
  hint: Show that for a finite matrix, $-\zeta_\Theta'(0) = \sum \log \lambda_n = \log \det \Theta$, so
    the definition extends the product of eigenvalues to infinite dimensions
  locator: null
  sub_index: null
  search_text: '(regularized determinants / zeta-regularization) for an unbounded linear operator $\theta$
    with discrete spectrum $(\lambda_n)_{n \ge 0}$ such that $\operatorname{re}(\lambda_n) > 0$, define
    the spectral zeta function $\zeta_\theta(z) = \sum_{n=0}^\infty \lambda_n^{-z}$ for $\operatorname{re}(z)
    \gg 0$. if $\zeta_\theta(z)$ admits a meromorphic continuation to $z = 0$ that is holomorphic at $z
    = 0$, define the regularized determinant: $$\det{}_{\infty}(s \cdot i - \theta) := \exp\left( -\left.\frac{d}{dz}\right|_{z=0}
    \zeta_{s i - \theta}(z) \right).$$  show that for a finite matrix, $-\zeta_\theta''(0) = \sum \log
    \lambda_n = \log \det \theta$, so the definition extends the product of eigenvalues to infinite dimensions'
- id: empslocal-ex-ac-uk-people-staff-mrwatkin-zeta-deninger3-pdf#003
  text: '(Lerch''s Formula and the Gamma Function) Apply zeta-regularization to the translation operator
    $\Theta = -\frac{d}{dx}$ on the half-line $\mathbb{R}_{>0}$ with spectrum $\{n\}_{n \ge 1}$ (the Riemann
    zeta function $\zeta(z)$). Using Lerch''s identity $\zeta''(0) = -\frac{1}{2}\log(2\pi)$ and the Hurwitz
    zeta function $\zeta(z, s) = \sum_{n=0}^\infty (n+s)^{-z}$, prove the regularized product identity:
    $$\det{}_\infty(s \cdot I - \Theta) = \prod_{n=0}^\infty (s + n) = \frac{\sqrt{2\pi}}{\Gamma(s)}.$$ '
  hint: Compute $-\left.\frac{\partial}{\partial z}\right|_{z=0} \zeta(z, s) = \log\Gamma(s) - \frac{1}{2}\log(2\pi)$
  locator: null
  sub_index: null
  search_text: '(lerch''s formula and the gamma function) apply zeta-regularization to the translation
    operator $\theta = -\frac{d}{dx}$ on the half-line $\mathbb{r}_{>0}$ with spectrum $\{n\}_{n \ge 1}$
    (the riemann zeta function $\zeta(z)$). using lerch''s identity $\zeta''(0) = -\frac{1}{2}\log(2\pi)$
    and the hurwitz zeta function $\zeta(z, s) = \sum_{n=0}^\infty (n+s)^{-z}$, prove the regularized
    product identity: $$\det{}_\infty(s \cdot i - \theta) = \prod_{n=0}^\infty (s + n) = \frac{\sqrt{2\pi}}{\gamma(s)}.$$  compute
    $-\left.\frac{\partial}{\partial z}\right|_{z=0} \zeta(z, s) = \log\gamma(s) - \frac{1}{2}\log(2\pi)$'
- id: empslocal-ex-ac-uk-people-staff-mrwatkin-zeta-deninger3-pdf#004
  text: '(Deninger''s Spectral Ansatz for Motivic L-Functions) Formulate Christopher Deninger''s central
    conjecture: for every pure motive $M$ over a number field, there exist infinite-dimensional complex
    cohomology spaces $H^i(X, \mathcal{E})$ equipped with a canonical closed operator $\Theta$ (the infinitesimal
    generator of a 1-parameter dynamical flow $\phi^t = \exp(t\Theta)$) such that: $$\widehat{L}(M, s)
    = \prod_{i=0}^{2\dim X} \det{}_\infty\left(\frac{s}{2\pi} \cdot I - \Theta \mid H^i(X, \mathcal{E})\right)^{(-1)^{i+1}}.$$ '
  hint: The zeros and poles of $\widehat{L}(M, s)$ correspond to the discrete eigenvalues $\lambda = \frac{1}{2\pi}
    s_0$ of the operator $\Theta$
  locator: null
  sub_index: null
  search_text: '(deninger''s spectral ansatz for motivic l-functions) formulate christopher deninger''s
    central conjecture: for every pure motive $m$ over a number field, there exist infinite-dimensional
    complex cohomology spaces $h^i(x, \mathcal{e})$ equipped with a canonical closed operator $\theta$
    (the infinitesimal generator of a 1-parameter dynamical flow $\phi^t = \exp(t\theta)$) such that:
    $$\widehat{l}(m, s) = \prod_{i=0}^{2\dim x} \det{}_\infty\left(\frac{s}{2\pi} \cdot i - \theta \mid
    h^i(x, \mathcal{e})\right)^{(-1)^{i+1}}.$$  the zeros and poles of $\widehat{l}(m, s)$ correspond
    to the discrete eigenvalues $\lambda = \frac{1}{2\pi} s_0$ of the operator $\theta$'
- id: empslocal-ex-ac-uk-people-staff-mrwatkin-zeta-deninger3-pdf#005
  text: '(Archimedean Factors via Regularized Determinants) Prove that the Archimedean local factor $\Gamma_\mathbb{R}(s)^{-1}
    = \pi^{s/2}/\Gamma(s/2)$ can be expressed as a regularized product of eigenvalues of the infinitesimal
    generator $\Theta = -\frac{d}{dx}$ acting on the invariant subspace of even/odd functions on $\mathbb{R}_{>0}$. '
  hint: The spectrum of $\Theta$ on $\mathbb{R}_{>0}$ produces the eigenvalues $2n$ entering $\Gamma(s/2)$
    via Lerch's formula
  locator: null
  sub_index: null
  search_text: (archimedean factors via regularized determinants) prove that the archimedean local factor
    $\gamma_\mathbb{r}(s)^{-1} = \pi^{s/2}/\gamma(s/2)$ can be expressed as a regularized product of eigenvalues
    of the infinitesimal generator $\theta = -\frac{d}{dx}$ acting on the invariant subspace of even/odd
    functions on $\mathbb{r}_{>0}$.  the spectrum of $\theta$ on $\mathbb{r}_{>0}$ produces the eigenvalues
