  text: How does one define normalized absolute values on a global field?
  hint: Set $|x|_v = q_v^{-v(x)}$ for finite places, $|x|_v = |x|_\mathbb{R}$ for real places, and $|x|_v
    = |x|_\mathbb{C}^2$ for complex places, ensuring the product formula $\prod_v |x|_v = 1$.
  locator: null
