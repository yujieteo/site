  text: How does one invent the notion of a valuation ring?
  hint: Define $\mathcal{O}_K = \{x \in K \mid v(x) \ge 0\}$ with unique maximal ideal $\mathfrak{m} =
    \{x \in K \mid v(x) \ge 1\}$.
