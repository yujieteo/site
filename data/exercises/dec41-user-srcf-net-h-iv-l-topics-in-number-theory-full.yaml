  text: How does one come up with the notation of K^ab
  hint: one computes Gal(K^ab/K), K bar is separable closure of K, this is Gamma^ab/K i.e. one takes Gamma_K
    = Gal(K^bar / K) and kill off the commutative elements i.e. [Gamma_K, Gamma_K] where this is the commutator
    bracket.
