  text: How does one invent the inertia subgroup $I_K$?
  hint: The kernel of the restriction map $\operatorname{Gal}(K^{\mathrm{sep}}/K) \to \operatorname{Gal}(k^{\mathrm{sep}}/k)$,
    measuring ramification.
