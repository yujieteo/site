    Frobenius as part of the definition, note that it is not profinite, it is totally disconnected but
    not compact. Then one can define F^\times is isomorphic to the abelianised Weil group, and the O^\times_F
    maps isomorphically to the inertia subgroup of Gamma^ab_F.
