  hint: start with local class field theory W_F^ab is isomorphic to F^\times, now use the full Weil group,
    one can write local class field theory as the case of GL_1, characters of GL_1(F) i.e. F^\times is
    1D representations of W_F. So W_F^ab is 1-dim representations, Schur's lemma is nice, and this is
    1D reps of W_F. Then F^\times are like characters of GL_1(F).
