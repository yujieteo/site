  text: How does one invent the Weil group $W_K$?
  hint: The dense subgroup of $\operatorname{Gal}(K^{\mathrm{sep}}/K)$ whose elements act on the residue
    field by integer powers of Frobenius, giving an exact isomorphism $W_K^{\mathrm{ab}} \cong K^\times$.
  locator: null
