- id: dec41-user-srcf-net-h-iv-l-topics-in-number-theory-full#000
  text: How does one invent the notion of a separable closure?
  hint: Construct the maximal algebraic extension $K^{\mathrm{sep}} / K$ such that every element has a
    separable minimal polynomial, enabling infinite Galois theory with the Krull topology.
  locator: null
  sub_index: null
  search_text: how does one invent the notion of a separable closure? construct the maximal algebraic
    extension $k^{\mathrm{sep}} / k$ such that every element has a separable minimal polynomial, enabling
    infinite galois theory with the krull topology.
- id: dec41-user-srcf-net-h-iv-l-topics-in-number-theory-full#001
  text: How does one invent absolute Galois groups?
  hint: Define $G_K = \operatorname{Gal}(K^{\mathrm{sep}}/K)$ as a profinite group, establishing a Galois
    correspondence between closed subgroups and intermediate field extensions.
  locator: null
  sub_index: null
  search_text: how does one invent absolute galois groups? define $g_k = \operatorname{gal}(k^{\mathrm{sep}}/k)$
    as a profinite group, establishing a galois correspondence between closed subgroups and intermediate
    field extensions.
- id: dec41-user-srcf-net-h-iv-l-topics-in-number-theory-full#002
  text: How does one define the maximal abelian extension $K^{\mathrm{ab}}$?
  hint: Take the fixed field of the commutator subgroup $[G_K, G_K]$, giving $\operatorname{Gal}(K^{\mathrm{ab}}/K)
    \cong G_K^{\mathrm{ab}}$.
  locator: null
