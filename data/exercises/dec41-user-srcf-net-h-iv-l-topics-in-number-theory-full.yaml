- id: dec41-user-srcf-net-h-iv-l-topics-in-number-theory-full#017
  text: How does one invent the notion of the relative Weil group?
  hint: one needs to understand the Weil group computations of C and R, so one has the Artin map for complex
    multiplicative group to be 1, then Weil group R is a nonabelian group that is a bit messy, then the
    inverse of the Artin map maps z to zz\bar or sigma to -1. Then one defines the relative Weil group
    using the geometric Frobenius, and make it commutative by killing off the commutator and grant it
    the quotient topology
