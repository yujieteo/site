- id: dec41-user-srcf-net-h-iv-l-topics-in-number-theory-full#003
  text: What is the absolute Galois group defined up to?
  hint: Up to inner automorphisms (conjugation), while its abelianization $G_K^{\mathrm{ab}}$ is canonically
    defined.
  locator: null
