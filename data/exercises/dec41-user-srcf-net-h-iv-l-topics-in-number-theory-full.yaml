- id: dec41-user-srcf-net-h-iv-l-topics-in-number-theory-full#013
  text: What is the statement of local class field theory?
  hint: The local Artin map establishes an isomorphism $\widehat{K^\times} \cong \operatorname{Gal}(K^{\mathrm{ab}}/K)$,
    identifying finite abelian extensions with open subgroups of finite index in $K^\times$.
  locator: null
