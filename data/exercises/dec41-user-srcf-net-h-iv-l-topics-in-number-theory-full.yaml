- id: dec41-user-srcf-net-h-iv-l-topics-in-number-theory-full#011
  text: How does one invent arithmetic and geometric Frobenius elements?
  hint: The arithmetic Frobenius is $x \mapsto x^q$ on residue fields; geometric Frobenius is its inverse
    $\operatorname{Frob}^{-1}$, acting compatibly on $\ell$-adic étale cohomology.
