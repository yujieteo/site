- id: dec41-user-srcf-net-h-iv-l-topics-in-number-theory-full#018
  text: 'How does one prove class field theory? (Hint: cohomological method, exxistence of Artin map,
    then one interprets Gal(E/F) cohomologically and then compute the Brauer group, and then one gets
    the Artin map as a cup product, and it generalises to duality theorem for any M. Then formal group
    methods, one can use Lubin-Tate theory, this is very explicitly and gives a natural generalisation
    to non-abelian extensions, but it does not give non-abelian extensions. Lastly, there is the Neukirch
    method, E/F abelian finite, construct inverse Artin map to be in F^\cross \ N_{E/F}(E^\cross) there
    is only one possibility, <g. is cyclic subgroup of Gal(E/F). Then one proves a lemma to get a homomorphism
    that does not depend on the choices'
  hint: null
