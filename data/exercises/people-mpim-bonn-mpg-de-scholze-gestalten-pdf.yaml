- id: people-mpim-bonn-mpg-de-scholze-gestalten-pdf#006
  text: What is a Stefanich ring ($\mathbf{StRing}$)?
  hint: A sequence $\mathcal{A} = (A_1, A_2, \dots)$ where each $A_n \in \mathbf{CAlg}(n\mathbf{Pr})$
    is a symmetric monoidal $\kappa$-presentable $(\infty, n)$-category equipped with equivalences $A_n
    \xrightarrow{\sim} \mathrm{End}_{A_{n+1}}(\mathbf{1})$ for all $n \ge 1$; equivalently, $\mathbf{StRing}
    := \varprojlim_{\mathrm{End}_{-}(\mathbf{1})} \mathbf{CAlg}(n\mathbf{Pr})$.
  locator: null
  sub_index: null
  search_text: what is a stefanich ring ($\mathbf{string}$)? a sequence $\mathcal{a} = (a_1, a_2, \dots)$
    where each $a_n \in \mathbf{calg}(n\mathbf{pr})$ is a symmetric monoidal $\kappa$-presentable $(\infty,
    n)$-category equipped with equivalences $a_n \xrightarrow{\sim} \mathrm{end}_{a_{n+1}}(\mathbf{1})$
    for all $n \ge 1$; equivalently, $\mathbf{string} := \varprojlim_{\mathrm{end}_{-}(\mathbf{1})} \mathbf{calg}(n\mathbf{pr})$.
- id: people-mpim-bonn-mpg-de-scholze-gestalten-pdf#007
  text: How does a Stefanich ring fully deloop both addition and multiplication of a commutative ring?
  hint: If $A_1$ is stable, the ring of scalars is $A_0 = \mathrm{End}_{A_1}(\mathbf{1})$; addition on
    $A_0$ is delooped via the stable category $A_1 \simeq \Omega A_2$, while multiplication on $A_0$ is
    simultaneously delooped through the iterated endomorphism algebras $A_0 = \mathrm{End}_{A_1}(\mathbf{1})
    = \mathrm{End}_{\mathrm{End}_{A_2}(\mathbf{1})}(\mathbf{1}) = \dots$.
  locator: null
