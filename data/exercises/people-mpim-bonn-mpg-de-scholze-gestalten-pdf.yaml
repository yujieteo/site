- id: people-mpim-bonn-mpg-de-scholze-gestalten-pdf#000
  text: How is Tannakian reconstruction formulated as a fully faithful functor from commutative rings
    to presentable categories?
  hint: The functor $A \mapsto \mathbf{Mod}(A)$ (or $A \mapsto \mathcal{D}(A)$) from commutative rings
    to symmetric monoidal presentable abelian/stable categories is fully faithful, embedding algebra into
    categorical representation theory via $\mathrm{End}_{\mathbf{Mod}(A)}(\mathbf{1}) \cong A$.
