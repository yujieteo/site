- id: people-mpim-bonn-mpg-de-scholze-gestalten-pdf#011
  text: What characterizes dualizable objects in higher symmetric monoidal categories $\mathbf{CAlg}(n\mathbf{Pr})$?
  hint: An object $X$ is dualizable if the evaluation map $\mathrm{ev} \colon X^\vee \otimes X \to \mathbf{1}$
    and coevaluation $\mathrm{coev} \colon \mathbf{1} \to X \otimes X^\vee$ satisfy the triangle identities;
    for $A \in 1\mathbf{Pr}$, dualizability in $2\mathbf{Pr}$ corresponds to being smooth and proper.
  locator: null
