- id: people-mpim-bonn-mpg-de-scholze-gestalten-pdf#002
  text: Why does the classical definition of $\mathrm{Spec}(A)$ evolve from maps to a fixed base field
    into equivalence classes of maps to all fields?
  hint: Evaluating $A$ on all residue fields $\kappa(\mathfrak{p})$ rather than a single algebraically
    closed base field removes basepoint dependence, capturing the full scheme $\mathrm{Spec}(A)$ intrinsically
    through categorical representation theory.
