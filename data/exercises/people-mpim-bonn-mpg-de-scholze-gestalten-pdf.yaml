- id: people-mpim-bonn-mpg-de-scholze-gestalten-pdf#014
  text: How does every presentable six-functor formalism induce a transmutation functor into Gestalten?
  hint: Any six-functor formalism $\mathcal{D} \colon \mathcal{C}^{\mathrm{op}} \to 1\mathbf{Pr}$ factors
    canonically through Gestalten as $\mathcal{C} \to \mathbf{Gest} \xrightarrow{\mathcal{A} \mapsto A_1}
    1\mathbf{Pr}$ via a transmutation map $X \mapsto [X]_{\mathcal{D}}$, sending geometric spaces to universal
    ring-stacks representing their cohomology theories.
  locator: null
