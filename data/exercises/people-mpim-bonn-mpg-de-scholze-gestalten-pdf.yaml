- id: people-mpim-bonn-mpg-de-scholze-gestalten-pdf#015
  text: What is Aoki's Theorem on the motivic Gestalt $[\mathrm{Spec}(\mathbb{Z})]_{\mathcal{SH}}$?
  hint: The Gestalt $[\mathrm{Spec}(\mathbb{Z})]_{\mathcal{SH}}$ represents the functor assigning to any
    Gestalt $\mathcal{X}$ the space of Ringgestalten $\mathcal{R} \to \mathcal{X}$ that are 1-affine,
    cohomologically smooth, and homologically contractible, such that the zero section is a closed immersion
    and the unit group is an open immersion forming a stratification.
