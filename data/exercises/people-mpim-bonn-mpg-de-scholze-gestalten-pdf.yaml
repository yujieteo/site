- id: people-mpim-bonn-mpg-de-scholze-gestalten-pdf#010
  text: What is Gabriel-Ulmer duality in the context of $\kappa$-inductive products and colimits of categories?
  hint: The equivalence between $\kappa$-compactly generated categories with colimits and small categories
    with finite limits, ensuring that inductive tensor products and limits of presentable categories commute
    with compact generation.
