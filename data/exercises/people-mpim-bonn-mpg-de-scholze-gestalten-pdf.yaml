- id: people-mpim-bonn-mpg-de-scholze-gestalten-pdf#003
  text: Why is passing to stable $\infty$-categories necessary when truncations to the abelian heart fail
    to preserve exactness?
  hint: The derived tensor product and gluing operations do not preserve the heart of a $t$-structure;
    working in stable $\infty$-categories $\mathbf{Pr}_{\mathrm{st}}^{\mathrm{L}}$ retains all higher
    homotopies and obstruction data without losing information upon truncation.
