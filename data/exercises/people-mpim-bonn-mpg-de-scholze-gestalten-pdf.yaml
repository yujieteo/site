- id: people-mpim-bonn-mpg-de-scholze-gestalten-pdf#009
  text: Why does descent for analytic stacks require $\aleph_1$-cardinality / countable colimits of affines?
  hint: The left Kan extension $\mathbf{PSh}(\mathbf{AnRing}^{\mathrm{op}}) \to \mathbf{StRing}^{\mathrm{op}}$
    is conservative on $\aleph_1$-compact objects because geometric analytic stacks are countable colimits
    of affines, ensuring descent matches the $\infty$-topos topology.
