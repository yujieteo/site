  text: What role do shtukas and Cartier duality play in higher categorical Gestalten?
  hint: Shtukas represent Frobenius-fixed points of Gestalten over $\mathbb{F}_p$; Cartier duality on
    commutative group stacks extends to higher categorical levels as duality between $n$-affine group
    Gestalten and their character categories.
