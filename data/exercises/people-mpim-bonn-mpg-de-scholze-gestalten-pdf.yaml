- id: people-mpim-bonn-mpg-de-scholze-gestalten-pdf#004
  text: How does Deligne's program of generalized affine schemes $\mathbf{CAlg}(\mathcal{C})^{\mathrm{op}}$
    motivate higher analytic geometry?
  hint: For a symmetric monoidal presentable category $\mathcal{C}$, $\mathbf{CAlg}(\mathcal{C})^{\mathrm{op}}$
    defines $\mathcal{C}$-affine schemes (producing Faltings' almost mathematics for $\mathcal{C} = \mathbf{Mod}_K^\circ$);
    however, analytic spaces require non-flat localizations and non-flat gluings, necessitating passing
    from $\mathbf{CAlg}(\mathcal{C})$ to higher categories of categories $\mathbf{CAlg}(n\mathbf{Pr})$.
  locator: null
