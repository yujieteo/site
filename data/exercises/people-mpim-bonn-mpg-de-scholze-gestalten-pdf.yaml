- id: people-mpim-bonn-mpg-de-scholze-gestalten-pdf#013
  text: 'What is a Gestalt (plural: Gestalten) and why does $\mathbf{Gest} = \mathbf{StRing}^{\mathrm{op}}$
    form an $\infty$-topos?'
  hint: The $\infty$-category of Gestalten is defined as $\mathbf{Gest} := \mathbf{StRing}^{\mathrm{op}}$;
    Theorem 1.24 (Scholze-Stefanich) proves that $\mathbf{Gest}$ is an $(\infty, 1)$-topos without needing
    to manually choose a Grothendieck topology or pass to sheafification, restoring full geometric-algebraic
    duality.
