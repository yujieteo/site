- id: people-mpim-bonn-mpg-de-scholze-gestalten-pdf#001
  text: How does Tannakian duality extend from affine schemes to quasi-compact quasi-separated (qcqs)
    schemes and higher stacks?
  hint: The assignment $X \mapsto \mathbf{QCoh}(X)$ satisfies descent for flat/étale topologies; for qcqs
    schemes and Artin stacks, the geometric space $X$ is completely determined by its symmetric monoidal
    stable category $\mathbf{QCoh}(X)$ equipped with its structure sheaf unit $\mathcal{O}_X$ and global
    section ring $\Gamma(X, \mathcal{O}_X) \cong \mathrm{End}_{\mathbf{QCoh}(X)}(\mathbf{1})$.
  locator: null
  sub_index: null
