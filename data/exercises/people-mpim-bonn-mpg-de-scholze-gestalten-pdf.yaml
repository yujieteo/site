- id: people-mpim-bonn-mpg-de-scholze-gestalten-pdf#012
  text: Why do colimits in Stefanich rings require spectrification / stabilization?
  hint: Forming colimits of higher monoidal categories generally destroys invertibility of loops; stabilizing/spectrifying
    the endomorphism spaces ensures the resulting sequence remains in the limit of the loop/endomorphism
    tower.
