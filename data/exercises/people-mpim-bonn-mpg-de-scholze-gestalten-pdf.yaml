  text: How does the functor from $\mathbb{E}_\infty$-ring spectra to Stefanich rings operate?
  hint: It sends an $\mathbb{E}_\infty$-ring $A$ to the canonical Stefanich sequence $(A, \mathcal{D}(A),
    1\mathbf{Pr}_A, 2\mathbf{Pr}_A, \dots)$, embedding derived commutative algebra into higher category
    theory.
