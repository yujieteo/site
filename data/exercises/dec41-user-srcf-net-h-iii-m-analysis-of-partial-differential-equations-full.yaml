    test functions $\phi \in c_c^\infty(\omega)$.
- id: dec41-user-srcf-net-h-iii-m-analysis-of-partial-differential-equations-full#011
  text: What is a Sobolev space $W^{k, p}(\Omega)$?
  hint: The Banach space of functions in $L^p(\Omega)$ whose weak derivatives up to order $k$ exist and
    belong to $L^p(\Omega)$; denoted $H^k(\Omega)$ for $p=2$.
