  text: What are standard mollifiers?
  hint: Smooth, compactly supported bump functions $\eta_\varepsilon(x) = \varepsilon^{-n} \eta(x/\varepsilon)$
    used to approximate $L^p$ and Sobolev functions by smooth functions via convolution $u_\varepsilon
    = u * \eta_\varepsilon$.
