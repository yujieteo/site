  text: How to prove Picard-Lindelof?
  hint: 'forward, use FTC, converse is integral equation, u is C^0 solution to integral solution, solves
    ODE, u is C^0 satisfies integral equation, reformulated problem as integral equation, assumes less
    about functions or weak formulation, looking for fixed point of map w -> u_0 + int f(w(s)) ds acting
    on C equals set of w: from closed epsilon interval to B_r2(u_0), w continuous, complete metric space
    equipping it with supremum norm. Show epsulon small enough, contraction map, show it actually lands
    in C and it is a contraction, show this then use contraction mapping theorem, unique fixed point.
    Idea is to formulate as fixed point problem all the time. Unique C^1 exists locally, may run out of
    U in finite time so globally it may fail.'
