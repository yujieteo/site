- id: dec41-user-srcf-net-h-iii-m-analysis-of-partial-differential-equations-full#010
  text: What is a weak (distributional) derivative?
  hint: A locally integrable function $v = D^\alpha u$ satisfying $\int_\Omega u D^\alpha \phi \, dx =
    (-1)^{|\alpha|} \int_\Omega v \phi \, dx$ for all test functions $\phi \in C_c^\infty(\Omega)$.
  locator: null
