- id: math-uchicago-edu-emerton-gl2-pdf#005
  text: How is the moduli space of discrete rank-2 lattices $\mathcal{L} \subset \mathbb{C}$ identified
    with the quotient space $\mathcal{B} / \mathrm{GL}_2(\mathbb{Z})$?
  hint: The map assigning a basis $(\omega_1, \omega_2)$ to the lattice $\Lambda = \mathbb{Z}\omega_1
    \oplus \mathbb{Z}\omega_2$ is surjective; two bases span the same lattice if and only if they differ
    by a change-of-basis matrix in $\mathrm{GL}_2(\mathbb{Z})$, inducing a bijection $\mathcal{B}/\mathrm{GL}_2(\mathbb{Z})
    \xrightarrow{\sim} \mathcal{L}$ that endows $\mathcal{L}$ with the structure of a complex analytic
    surface.
  locator: null
