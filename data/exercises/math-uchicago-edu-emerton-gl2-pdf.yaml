- id: math-uchicago-edu-emerton-gl2-pdf#003
  text: How is the Lie algebra $\mathfrak{gl}_2(\mathbb{C})$ decomposed into holomorphic and anti-holomorphic
    tangent spaces at a basepoint $i_0 \in \mathcal{B}$?
  hint: Fixing the standard basis $i_0 \colon (x, y) \mapsto x + iy$ identifies $\mathcal{B} \cong \mathrm{GL}_2(\mathbb{R})$
    as a principal homogeneous space; the complexified tangent space $T_{i_0} \mathcal{B} \cong \mathfrak{gl}_2(\mathbb{C})$
    decomposes under the complex structure into $T_{i_0}^{1, 0} \mathcal{B} \oplus T_{i_0}^{0, 1} \mathcal{B}$,
    where the subspace $V_{i_0} \subset \mathfrak{gl}_2(\mathbb{C})$ corresponding to holomorphic tangent
    vectors is spanned by the Lie algebra elements generating rotations and dilations.
  locator: null
