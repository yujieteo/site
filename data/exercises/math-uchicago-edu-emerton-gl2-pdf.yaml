- id: math-uchicago-edu-emerton-gl2-pdf#011
  text: How are adelic Eisenstein series constructed as induced representations and automorphic forms?
  hint: Let $B(\mathbb{A}) = T(\mathbb{A}) U(\mathbb{A})$ be the standard Borel subgroup. For a pair of
    Hecke characters $\chi_1, \chi_2 \colon \mathbb{Q}^\times \backslash \mathbb{A}^\times \to \mathbb{C}^\times$,
    form the normalized parabolically induced representation $I(\chi_1, \chi_2) = \mathrm{Ind}_{B(\mathbb{A})}^{\mathrm{GL}_2(\mathbb{A})}(\chi_1
    \otimes \chi_2)$; the Eisenstein series is defined by the average $E(g, \Phi) = \sum_{\gamma \in B(\mathbb{Q})\backslash
    \mathrm{GL}_2(\mathbb{Q})} \Phi(\gamma g)$, which converges for $\mathrm{Re}(s) \gg 0$, admits a meromorphic
    continuation to all $s \in \mathbb{C}$, and recovers classical Eisenstein series $E_k(\tau)$ upon
    restriction to the archimedean component.
  locator: null
  sub_index: null
