- id: math-uchicago-edu-emerton-gl2-pdf#007
  text: How does the lattice function $F(\Lambda)$ translate into a classical holomorphic modular form
    $f(\tau)$ on the upper half-plane $\mathfrak{h}$?
  hint: Define $f(\tau) := F(\mathbb{Z}\tau \oplus \mathbb{Z})$ for $\tau \in \mathfrak{h}$. Homogeneity
    implies $f\left(\frac{a\tau+b}{c\tau+d}\right) = F\left(\mathbb{Z}\frac{a\tau+b}{c\tau+d} \oplus \mathbb{Z}\right)
    = F\left((c\tau+d)^{-1}(\mathbb{Z}(a\tau+b) \oplus \mathbb{Z}(c\tau+d))\right) = (c\tau+d)^k F(\mathbb{Z}\tau
    \oplus \mathbb{Z}) = (c\tau+d)^k f(\tau)$, which is the classical modular transformation law.
  locator: null
