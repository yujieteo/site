    \omega_2) \mapsto (\lambda \omega_1, \lambda \omega_2)$.
- id: math-uchicago-edu-emerton-gl2-pdf#002
  text: How does the coordinate chart $(\tau, z) \in \mathfrak{h}^\pm \times \mathbb{C}^\times$ describe
    the right $\mathrm{GL}_2(\mathbb{R})$-action on $\mathcal{B}$?
  hint: Writing $(\omega_1, \omega_2) = (z\tau, z)$ where $\tau = \omega_1/\omega_2 \in \mathfrak{h}^\pm$
    and $z = \omega_2 \in \mathbb{C}^\times$, the right action of $g = \left(\begin{smallmatrix} a & b
    \\ c & d \end{smallmatrix}\right)$ is given by $(\tau, z) \cdot g = \left(\frac{a\tau + b}{c\tau +
    d}, (c\tau + d)z\right)$, which factors the Möbius transformation on $\tau$ with the automorphy factor
    $(c\tau + d)$ on $z$.
