    f(\tau)$, which is the classical modular transformation law.
- id: math-uchicago-edu-emerton-gl2-pdf#008
  text: How does Strong Approximation decompose the adelic group $\mathrm{GL}_2(\mathbb{A}_\mathbb{Q})$
    into classical components?
  hint: Strong approximation for $\mathrm{SL}_2$ implies $\mathrm{GL}_2(\mathbb{A}_\mathbb{Q}) = \mathrm{GL}_2(\mathbb{Q})
    \cdot \mathrm{GL}_2^+(\mathbb{R}) \cdot K_0(N)$, where $K_0(N) = \prod_{p<\infty} K_p \subset \mathrm{GL}_2(\mathbb{A}_f)$
    is a compact open subgroup; taking quotients yields the topological bijection $\mathrm{GL}_2(\mathbb{Q})
    \backslash \mathrm{GL}_2(\mathbb{A}_\mathbb{Q}) / K_0(N) K_\infty \cong \Gamma_0(N) \backslash \mathfrak{h}
    = Y_0(N)$.
  locator: null
  sub_index: null
  search_text: how does strong approximation decompose the adelic group $\mathrm{gl}_2(\mathbb{a}_\mathbb{q})$
    into classical components? strong approximation for $\mathrm{sl}_2$ implies $\mathrm{gl}_2(\mathbb{a}_\mathbb{q})
    = \mathrm{gl}_2(\mathbb{q}) \cdot \mathrm{gl}_2^+(\mathbb{r}) \cdot k_0(n)$, where $k_0(n) = \prod_{p<\infty}
    k_p \subset \mathrm{gl}_2(\mathbb{a}_f)$ is a compact open subgroup; taking quotients yields the topological
    bijection $\mathrm{gl}_2(\mathbb{q}) \backslash \mathrm{gl}_2(\mathbb{a}_\mathbb{q}) / k_0(n) k_\infty
    \cong \gamma_0(n) \backslash \mathfrak{h} = y_0(n)$.
- id: math-uchicago-edu-emerton-gl2-pdf#009
  text: How is an automorphic form on $\mathrm{GL}_2(\mathbb{A}_\mathbb{Q})$ rigorously defined?
  hint: 'A smooth function $\phi \colon \mathrm{GL}_2(\mathbb{A}_\mathbb{Q}) \to \mathbb{C}$ satisfying:
    (1) Left $\mathrm{GL}_2(\mathbb{Q})$-invariance: $\phi(\gamma g) = \phi(g)$ for all $\gamma \in \mathrm{GL}_2(\mathbb{Q})$;
    (2) Right $K$-finiteness: the right translates under $K_\infty \times K_f = \mathrm{O}_2(\mathbb{R})
    \times \prod_{p} \mathrm{GL}_2(\mathbb{Z}_p)$ span a finite-dimensional space; (3) $\mathcal{Z}(\mathfrak{gl}_2)$-finiteness:
    the action of the center of the universal enveloping algebra $\mathcal{Z}(\mathfrak{gl}_2)$ generates
    a finite-dimensional space (eigenfunction of the Casimir operator); (4) Moderate growth / slow decrease:
    $|\phi(g)| \le C \|g\|^r$ for constants $C, r > 0$ with respect to a standard adelic height/norm.'
  locator: null
