- id: math-uchicago-edu-emerton-gl2-pdf#006
  text: How is a classical modular form of weight $k$ defined geometrically as a function on lattices
    $\mathcal{L}$?
  hint: A modular form of weight $k$ for $\mathrm{SL}_2(\mathbb{Z})$ is a holomorphic function $F \colon
    \mathcal{L} \to \mathbb{C}$ satisfying the homogeneity condition $F(\lambda \Lambda) = \lambda^{-k}
    F(\Lambda)$ for all $\lambda \in \mathbb{C}^\times$, together with a regularity/boundedness condition
    as the lattice degenerates.
