- id: math-uchicago-edu-emerton-gl2-pdf#000
  text: How is the space $\mathcal{B}$ of $\mathbb{R}$-linear bases of $\mathbb{C}$ defined and parameterized
    as a complex analytic manifold?
  hint: 'A basis $i \colon \mathbb{R}^2 \xrightarrow{\sim} \mathbb{C}$ is identified with the pair of
    complex numbers $(\omega_1, \omega_2) = (i(1, 0), i(0, 1)) \in \mathbb{C}^2$; since $i$ is an $\mathbb{R}$-isomorphism,
    $\mathrm{Im}(\omega_1/\omega_2) \neq 0$, realizing $\mathcal{B}$ as the open complex submanifold $\{(\omega_1,
    \omega_2) \in \mathbb{C}^2 : \mathrm{Im}(\omega_1 \overline{\omega}_2) \neq 0\} \cong \mathbb{C}^\times
    \times (\mathbb{C} \setminus \mathbb{R})$.'
  locator: null
  sub_index: null
  search_text: 'how is the space $\mathcal{b}$ of $\mathbb{r}$-linear bases of $\mathbb{c}$ defined and
    parameterized as a complex analytic manifold? a basis $i \colon \mathbb{r}^2 \xrightarrow{\sim} \mathbb{c}$
    is identified with the pair of complex numbers $(\omega_1, \omega_2) = (i(1, 0), i(0, 1)) \in \mathbb{c}^2$;
    since $i$ is an $\mathbb{r}$-isomorphism, $\mathrm{im}(\omega_1/\omega_2) \neq 0$, realizing $\mathcal{b}$
    as the open complex submanifold $\{(\omega_1, \omega_2) \in \mathbb{c}^2 : \mathrm{im}(\omega_1 \overline{\omega}_2)
    \neq 0\} \cong \mathbb{c}^\times \times (\mathbb{c} \setminus \mathbb{r})$.'
- id: math-uchicago-edu-emerton-gl2-pdf#001
  text: How do $\mathrm{GL}_2(\mathbb{R})$ and $\mathbb{C}^\times$ act on the basis space $\mathcal{B}$?
  hint: The group $\mathrm{GL}_2(\mathbb{R})$ acts on the right by precomposition $(i \cdot g)(v) = i(g
    v)$ for $g = \left(\begin{smallmatrix} a & b \\ c & d \end{smallmatrix}\right)$, mapping $(\omega_1,
    \omega_2) \mapsto (a\omega_1 + c\omega_2, b\omega_1 + d\omega_2)$; the group $\mathbb{C}^\times =
    \mathrm{GL}_\mathbb{C}(\mathbb{C})$ acts on the left by postcomposition/scaling $(\lambda \cdot i)(v)
    = \lambda i(v)$, mapping $(\omega_1, \omega_2) \mapsto (\lambda \omega_1, \lambda \omega_2)$.
  locator: null
  sub_index: null
