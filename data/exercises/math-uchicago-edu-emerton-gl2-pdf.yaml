- id: math-uchicago-edu-emerton-gl2-pdf#010
  text: How does a classical modular form $f(\tau)$ lift to an adelic automorphic function $\phi_f \colon
    \mathrm{GL}_2(\mathbb{A}_\mathbb{Q}) \to \mathbb{C}$?
  hint: Using the decomposition $g = \gamma \cdot g_\infty \cdot k_f$ with $\gamma \in \mathrm{GL}_2(\mathbb{Q})$,
    $g_\infty = \left(\begin{smallmatrix} y & x \\ 0 & 1 \end{smallmatrix}\right) \in \mathrm{GL}_2^+(\mathbb{R})$,
    and $k_f \in K_0(N)$, define $\phi_f(g) := (cz+d)^{-k} f(g_\infty \cdot i) = y^{k/2} f(x + iy)$; the
    transformation law of $f$ guarantees that $\phi_f$ is well-defined, left $\mathrm{GL}_2(\mathbb{Q})$-invariant,
    and an eigenfunction of the Casimir operator $\Delta$ with eigenvalue $\frac{k}{2}\left(\frac{k}{2}-1\right)$.
  locator: null
