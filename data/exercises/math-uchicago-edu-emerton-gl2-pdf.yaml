- id: math-uchicago-edu-emerton-gl2-pdf#004
  text: What are the standard basis elements $(Z, H, Y_+, Y_-)$ of $\mathfrak{sl}_2(\mathbb{C})$ / $\mathfrak{gl}_2(\mathbb{C})$
    and the center $\mathcal{Z}(\mathfrak{gl}_2)$ of the universal enveloping algebra?
  hint: $Z = \left(\begin{smallmatrix} 1 & 0 \\ 0 & 1 \end{smallmatrix}\right)$, $H = \left(\begin{smallmatrix}
    1 & 0 \\ 0 & -1 \end{smallmatrix}\right)$, $Y_+ = \left(\begin{smallmatrix} 0 & 1 \\ 0 & 0 \end{smallmatrix}\right)$,
    $Y_- = \left(\begin{smallmatrix} 0 & 0 \\ 1 & 0 \end{smallmatrix}\right)$; the center $\mathcal{Z}(\mathfrak{gl}_2(\mathbb{C}))
    \cong \mathbb{C}[Z, \Delta]$ is a polynomial algebra in two variables generated by the central element
    $Z$ and the Casimir element $\Delta = \frac{1}{4}H^2 + \frac{1}{2}H + Y_- Y_+$.
