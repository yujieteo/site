  text: 'How does one prove integral curves always exist? (Hint: fundamental theorem on ODES or Picard-Lindelof
    guaranteeing first order IVP has unique exact solution on specific local time interval, U in R^n open
    U valued in R^n smooth, pick t_0 in R, consider the ODE y'' = a(y(t)), y_i(t) = c_i, c_i components
    of a vector, exists open interval I containing t0 and open U_0 in U such that there is a smooth solution
    for every smooth vector c in U_0 (to make it wlog), smooth solution gamma_c valued in U parameterising
    interval I satisfying the ODE. Any solutions agree on a common domain, it is smooth in both variables.
    Then one proves integral curves exist by working in coordinates, and use the fact that the partial
