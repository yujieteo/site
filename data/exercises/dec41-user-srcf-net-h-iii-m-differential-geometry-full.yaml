- id: dec41-user-srcf-net-h-iii-m-differential-geometry-full#008
  text: What is a partition of unity subordinate to an open cover?
  hint: 'A family of smooth functions $\rho_\alpha: M \to [0, 1]$ with $\operatorname{supp}(\rho_\alpha)
    \subseteq U_\alpha$, locally finite supports, and $\sum_\alpha \rho_\alpha = 1$.'
  locator: null
