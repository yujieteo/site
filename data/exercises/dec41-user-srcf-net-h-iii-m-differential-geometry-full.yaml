- id: dec41-user-srcf-net-h-iii-m-differential-geometry-full#009
  text: How does one define embedded submanifolds?
  hint: A subset $S \subset M$ that locally admits slice coordinate charts where $S \cap U = \{x_{k+1}
    = \dots = x_n = 0\}$.
