- id: dec41-user-srcf-net-h-iii-m-differential-geometry-full#024
  text: How does one define parallel transport and geodesics?
  hint: 'A section $s(t)$ along a curve $\gamma$ is parallel if $\nabla_{\dot{\gamma}} s = 0$; a curve
    is a geodesic if its velocity vector is parallel: $\nabla_{\dot{\gamma}} \dot{\gamma} = 0$.'
  locator: null
