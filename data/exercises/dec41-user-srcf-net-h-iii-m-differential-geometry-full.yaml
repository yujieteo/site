    on their domains.
- id: dec41-user-srcf-net-h-iii-m-differential-geometry-full#003
  text: How does one define a smooth manifold?
  hint: A second-countable Hausdorff topological space equipped with a maximal smooth atlas.
  locator: null
  sub_index: null
