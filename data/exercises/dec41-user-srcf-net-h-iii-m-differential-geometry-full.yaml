- id: dec41-user-srcf-net-h-iii-m-differential-geometry-full#012
  text: How does one define the Lie bracket of vector fields?
  hint: Define $[X, Y](f) = X(Y(f)) - Y(X(f))$, which satisfies bilinearity, antisymmetry, and the Jacobi
    identity.
