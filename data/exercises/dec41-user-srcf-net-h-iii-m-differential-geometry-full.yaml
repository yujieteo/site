  text: What is a Koszul connection on a vector bundle $E \to M$?
  hint: 'A linear map $\nabla: \Gamma(E) \to \Gamma(T^*M \otimes E)$ satisfying the Leibniz rule $\nabla(f
    s) = df \otimes s + f \nabla s$.'
  locator: null
