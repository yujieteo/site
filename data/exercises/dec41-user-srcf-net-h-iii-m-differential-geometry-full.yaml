- id: dec41-user-srcf-net-h-iii-m-differential-geometry-full#005
  text: How does one define smooth maps between manifolds?
  hint: 'A map $F: M \to N$ is smooth if for all charts $(U, \varphi)$ on $M$ and $(V, \psi)$ on $N$,
    the composition $\psi \circ F \circ \varphi^{-1}$ is smooth on $\mathbb{R}^n$.'
  locator: null
  sub_index: null
  search_text: 'how does one define smooth maps between manifolds? a map $f: m \to n$ is smooth if for
    all charts $(u, \varphi)$ on $m$ and $(v, \psi)$ on $n$, the composition $\psi \circ f \circ \varphi^{-1}$
    is smooth on $\mathbb{r}^n$.'
- id: dec41-user-srcf-net-h-iii-m-differential-geometry-full#006
  text: How does one define tangent vectors via derivations?
  hint: 'Tangent vectors at $p \in M$ are $\mathbb{R}$-linear derivations $v: C^\infty(M) \to \mathbb{R}$
    satisfying the Leibniz rule $v(fg) = v(f)g(p) + f(p)v(g)$.'
  locator: null
