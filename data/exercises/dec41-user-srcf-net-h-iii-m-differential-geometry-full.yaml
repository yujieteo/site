  text: How does one define geodesic with the connections?
  hint: 'minimum D_t p''(t) = 0 for curve p: I -> M, working along the linear connection, find ODE to
    uniquely specify the geodesic, existence and uniqueness by Picard Lindelof, write this using Christofel
    symbols, second order ODE, get unique solutions locally given initial conditions, then patch to get
    global existence and uniqueness. One can talk about parallel vector fields, D_t V(t) mod 0 for all
    tin I, vector field is constant along the path, not literally constant since each V(t) lives in different
    vector space. Important result is parallel transport, path is geodesic if derivative of path is parallel
    as definitiojn. Parallel transport means there exist unique parallel vector field such that V(t_0)
    = zeta in tangent bundle under p(t_0), this is teh prallel transport. PRove using Christoffel symbols,
    first order ODE, initial condition, locally unique, globally exist by compactness using finitely many
    charts. One can define the parallel transport map. PROBLEM: depends on curve chose. SOLUTION: invent
    flat connections that depends on homotopy class of the curves.'
