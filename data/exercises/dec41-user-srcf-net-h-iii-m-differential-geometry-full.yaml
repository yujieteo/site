- id: dec41-user-srcf-net-h-iii-m-differential-geometry-full#011
  text: What is a smooth vector field?
  hint: 'A smooth section of the tangent bundle $\pi: TM \to M$, or equivalently a derivation of the algebra
    $C^\infty(M)$.'
  locator: null
  sub_index: null
