  text: 'How does one define the exterior derivative $d: \Omega^k(M) \to \Omega^{k+1}(M)$?'
  hint: The unique $\mathbb{R}$-linear operator satisfying $d^2 = 0$, $d(\omega \wedge \eta) = d\omega
    \wedge \eta + (-1)^k \omega \wedge d\eta$, and $df(X) = X(f)$ for 0-forms.
  locator: null
