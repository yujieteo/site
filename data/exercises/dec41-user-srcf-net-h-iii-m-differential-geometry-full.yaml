- id: dec41-user-srcf-net-h-iii-m-differential-geometry-full#013
  text: What are integral curves and why do they exist?
  hint: Curves $\gamma(t)$ satisfying $\dot{\gamma}(t) = X(\gamma(t))$; existence and uniqueness follow
    from the Picard-Lindelöf theorem on ODEs.
