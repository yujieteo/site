    = v(f)g(p) + f(p)v(g)$.'
- id: dec41-user-srcf-net-h-iii-m-differential-geometry-full#007
  text: How does one define the differential of a smooth map?
  hint: 'The linear map $dF_p: T_p M \to T_{F(p)} N$ defined by $(dF_p(v))(g) = v(g \circ F)$ for $g \in
    C^\infty(N)$.'
