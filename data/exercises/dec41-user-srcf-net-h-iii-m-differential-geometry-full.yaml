- id: dec41-user-srcf-net-h-iii-m-differential-geometry-full#022
  text: What is Stokes' theorem for manifolds with boundary?
  hint: $\int_M d\omega = \int_{\partial M} \omega$ for any compactly supported $(n-1)$-form on an oriented
    $n$-dimensional manifold with boundary.
  locator: null
