- id: dec41-user-srcf-net-h-iii-m-differential-geometry-full#010
  text: What is the regular value theorem?
  hint: 'If $c \in N$ is a regular value of $F: M \to N$, then $F^{-1}(c)$ is an embedded submanifold
    of dimension $\dim M - \dim N$.'
  locator: null
