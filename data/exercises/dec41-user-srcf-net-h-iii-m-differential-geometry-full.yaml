- id: dec41-user-srcf-net-h-iii-m-differential-geometry-full#001
  text: How does one define a chart on a topological space?
  hint: 'A homeomorphism $\varphi: U \to \varphi(U) \subseteq \mathbb{R}^n$ from an open subset $U \subseteq
    M$ onto an open subset of $\mathbb{R}^n$.'
  locator: null
  sub_index: null
  search_text: 'how does one define a chart on a topological space? a homeomorphism $\varphi: u \to \varphi(u)
    \subseteq \mathbb{r}^n$ from an open subset $u \subseteq m$ onto an open subset of $\mathbb{r}^n$.'
- id: dec41-user-srcf-net-h-iii-m-differential-geometry-full#002
  text: What is a smooth atlas?
  hint: A collection of charts $\{(U_\alpha, \varphi_\alpha)\}$ covering $M$ such that all transition
    maps $\varphi_\beta \circ \varphi_\alpha^{-1}$ are smooth diffeomorphisms on their domains.
  locator: null
  sub_index: null
