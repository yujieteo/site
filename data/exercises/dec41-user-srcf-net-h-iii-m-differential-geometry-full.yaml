- id: dec41-user-srcf-net-h-iii-m-differential-geometry-full#015
  text: How does one define the Lie derivative?
  hint: 'Differentiate a tensor field along the local flow $\Phi_t$ of a vector field $X$: $\mathcal{L}_X
    Y = \lim_{t \to 0} \frac{(\Phi_{-t})_* Y - Y}{t} = [X, Y]$.'
  locator: null
