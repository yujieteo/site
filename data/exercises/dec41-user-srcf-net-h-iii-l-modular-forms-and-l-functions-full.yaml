  text: How does one invent the need for local compactness in Haar measure?
  hint: nonempty open set must have strictly postiive volume, every compact set must have finite volume,
    if topological group not locally compact, pick neighbourhood of identity element, wlog for counterexample
    infinite dimension Banach space like L^2, pick neighbourhood of identity element, need infinite number
    of disjoint translated copies of smaller open, translation invariance means each copy has exact same
    volume, measure finite subpieces volume 0, so volume 0, subpieces positive volume, blows up to infinity
    by additivity, so nonzero on open and finite on compact, key is you need compactness, finite subcover
    to prevent this blow up. Haar ratio is volume of compact set is estimate d by trnaslated copies of
    open neighbourhood needed to cover it, minimumnumber of left shifts. Local compactness guarantee that
    Haar ratio is finite integer.
