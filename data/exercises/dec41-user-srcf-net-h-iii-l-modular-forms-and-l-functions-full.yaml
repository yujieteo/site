  text: How does one prove that Dirichlet has meromorphic continuation to C?
  hint: 'let phi: Z/NZ -> C be any N-periodic series, write it as Mellin transform, write f(y) as a series
    with basis exp(-2 pi n y), then write this as a ratio, split into two terms, M_0 and M_infty, second
