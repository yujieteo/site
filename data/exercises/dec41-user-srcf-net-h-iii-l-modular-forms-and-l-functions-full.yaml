  text: What is the Dedekind eta function?
  hint: Define $\eta(z) = q^{1/24} \prod_{n=1}^\infty (1 - q^n)$ with $q = e^{2\pi i z}$, satisfying the
    functional equations $\eta(z+1) = e^{\pi i / 12} \eta(z)$ and $\eta(-1/z) = \sqrt{z/i} \, \eta(z)$.
