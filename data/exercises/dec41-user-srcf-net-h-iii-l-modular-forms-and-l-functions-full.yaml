- id: dec41-user-srcf-net-h-iii-l-modular-forms-and-l-functions-full#009
  text: How does one invent the character group?
  hint: Pontraygin duality, take all continuous homomorphisms to U(1) as a group, this is a Chu construction,
    evaluating it against a target space U(1) as a dualizing object. So the easiest way to remember Pontryagin
    duality is that it is the duality of character groups in a Fourier transform somehow. The easiest
    example of Pontryagin duality to visualise is circle representing the integers. Integers to circle
    give discrete time Fourier transform. Discrete groups dualise to compact groups i.e. circle, it has
    to repeat somewhere.
  locator: null
