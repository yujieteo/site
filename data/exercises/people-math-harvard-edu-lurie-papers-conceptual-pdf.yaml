- id: people-math-harvard-edu-lurie-papers-conceptual-pdf#000
  text: '(From Stone Duality to Conceptual Completeness) Review classical Stone duality for Boolean algebras:
    the contravariant functor $\operatorname{Spec}: \mathbf{Bool}^{\text{op}} \xrightarrow{\sim} \mathbf{Stone}$
    establishes an anti-equivalence between Boolean algebras (propositional syntax) and compact totally
    disconnected Hausdorff spaces (Stone spaces of models/points). Explain how Michael Makkai generalized
    this duality from propositional logic to first-order coherent logic by replacing Boolean algebras
    with small pretopoi $\mathcal{E}$ and Stone spaces with ultracategories of models $\operatorname{Mod}(\mathcal{E})$. '
  hint: Points/models in $\operatorname{Spec}(B)$ are 2-valued homomorphisms $B \to \{0, 1\}$; in coherent
    logic, models of a pretopos $\mathcal{E}$ are coherent/left-exact functors $\mathcal{E} \to \mathbf{Set}$
    preserving finite disjoint coproducts and effective quotients
  locator: null
