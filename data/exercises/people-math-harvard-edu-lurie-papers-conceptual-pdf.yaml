- id: people-math-harvard-edu-lurie-papers-conceptual-pdf#005
  text: '(Stone Duality as a Chu Construction / *-Autonomous Duality) Explain how Stone duality and Gödel''s
    completeness theorem can be viewed through the lens of the Chu construction over $\mathbf{Set}$ with
    dualizing object $2 = \{0, 1\}$. '
  hint: 'A Chu space $(\mathcal{A}, \mathcal{X}, e)$ pairs a syntactic object $\mathcal{A}$ with a semantic
    space $\mathcal{X}$ via an evaluation pairing $e: \mathcal{A} \times \mathcal{X} \to \{0, 1\}$; in
    Stone duality, $\mathcal{A}$ is a Boolean algebra, $\mathcal{X} = \operatorname{Hom}_{\mathbf{Bool}}(\mathcal{A},
    2)$ is the set of prime filters/models, and the bidual evaluation $\mathcal{A} \xrightarrow{\sim}
    \operatorname{Hom}_{\mathbf{Stone}}(\operatorname{Spec}(\mathcal{A}), 2)$ is an isomorphism of *-autonomous
    systems'
  locator: null
  sub_index: null
