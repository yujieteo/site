- id: people-math-harvard-edu-lurie-papers-conceptual-pdf#003
  text: '(Makkai''s Conceptual Completeness Theorem) State Makkai''s Conceptual Completeness Theorem as
    formulated by Lurie: for any small pretopos $\mathcal{E}$, let $\operatorname{Mod}(\mathcal{E}) =
    \operatorname{Coh}(\mathcal{E}, \mathbf{Set})$ be its category of models equipped with its canonical
    ultracategory structure via pointwise ultraproducts in $\mathbf{Set}$. Prove that the evaluation functor
    $$\operatorname{ev}: \mathcal{E} \xrightarrow{\sim} \mathbf{Ult}(\operatorname{Mod}(\mathcal{E}),
    \mathbf{Set})$$ is an equivalence of categories between the small pretopos $\mathcal{E}$ and the category
    of ultrafunctors from $\operatorname{Mod}(\mathcal{E})$ to $\mathbf{Set}$. '
  hint: This proves that a coherent first-order theory $\mathcal{E}$ is entirely and uniquely recoverable
    from its category of models together with the ultraproduct operations on those models
  locator: null
  sub_index: null
