- id: people-math-harvard-edu-lurie-papers-conceptual-pdf#007
  text: '(Connections to Condensed Mathematics and Liquid Vector Spaces) How does Makkai''s ultracategory
    framework relate to Clausen–Scholze condensed mathematics? '
  hint: Condensed sets are sheaves on the pro-étale site of a point, testable against extremally disconnected
    compact Hausdorff spaces $\beta I$; in Makkai's framework, ultraproducts $\prod_{\mathcal{U}} X_i$
    handle infinite limits and compact projections without topological pathologies, providing an alternate
    categorical path to measure theory and liquid vector spaces via ultrafilter integration
