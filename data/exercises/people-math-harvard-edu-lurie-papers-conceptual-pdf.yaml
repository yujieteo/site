- id: people-math-harvard-edu-lurie-papers-conceptual-pdf#004
  text: '(Ultrastructures as Categorical Integration / Stokes'' Formula) Detail Lurie''s formulation of
    ultrastructures as a family of categorical integration operations. '
  hint: 'Think of ultrafilters as $\{0, 1\}$-valued finitely additive measures $\mathcal{U}: \mathcal{P}(I)
    \to \{0, 1\}$; the ultraproduct functor $\int_{\mathcal{U}}: \mathcal{C}^I \to \mathcal{C}$ acts as
    an integration operator with respect to $\mathcal{U}$, and the coherence axioms mirror Fubini''s theorem
    and Stokes''-type boundary-compatibility conditions on ultracategories'
  locator: null
