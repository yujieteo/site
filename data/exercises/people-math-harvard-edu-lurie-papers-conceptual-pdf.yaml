- id: people-math-harvard-edu-lurie-papers-conceptual-pdf#006
  text: '(Ultrafilters as Codensity Monads and Leinster''s Heuristic) State Tom Leinster''s theorem characterizing
    the ultrafilter monad $\beta: \mathbf{Set} \to \mathbf{Set}$ as the codensity monad of the inclusion
    functor $\mathbf{FinSet} \hookrightarrow \mathbf{Set}$. '
  hint: 'The Stone–Čech compactification $\beta(X)$ is the maximal compactification of a discrete set
    $X$; integrating a bounded or finite-image function $f: X \to \mathbb{R}$ against an ultrafilter $\mathcal{U}
    \in \beta(X)$ picks out the unique value $r \in \mathbb{R}$ such that $f^{-1}(r) \in \mathcal{U}$,
    acting as an ultra-mode / point-evaluation on large sets'
  locator: null
