- id: people-math-harvard-edu-lurie-papers-conceptual-pdf#001
  text: '(Definition of Ultracategories and Ultraproducts) Define an ultracategory $\mathcal{C}$ in the
    sense of Makkai and Lurie. '
  hint: 'An ultracategory is a category $\mathcal{C}$ equipped with an ultrastructure functor $\int_{\mathcal{U}}:
    \mathcal{C}^I \to \mathcal{C}$ for every set $I$ and every ultrafilter $\mathcal{U}$ on $I$, specifying
    ultraproducts $\prod_{\mathcal{U}} X_i$ that satisfy transitivity/coherence under Fubini-type iterations
    of ultrafilters and principal ultrafilter trivializations $\int_{\delta_i} (X_j)_{j \in I} \cong X_i$'
  locator: null
  sub_index: null
  search_text: '(definition of ultracategories and ultraproducts) define an ultracategory $\mathcal{c}$
    in the sense of makkai and lurie.  an ultracategory is a category $\mathcal{c}$ equipped with an ultrastructure
