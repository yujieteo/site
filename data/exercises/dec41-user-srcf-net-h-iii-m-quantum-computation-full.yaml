- id: dec41-user-srcf-net-h-iii-m-quantum-computation-full#007
  text: Why does one care about the Fisher information matrix?
  hint: the Cramer-Rao bound, this proves that maximum likelihood estimation is the best since variance
    of estimators - inverse of fisher info matrix over estimate is postiive semidefinite, so maximum likelihood
    estimation works for more general models than linear regression, so this theorem says that maximum
    likelihood estimator is unbiased and achieves the Cramer-Rao bound, asymptotically it is also normally
    distributed.
