- id: cmtp-uniroma2-it-13mqp-slides-connes-pdf#015
  text: How does the shift from 4 to 10 dimensions arise in noncommutative geometry compared to string
    theory compactifications?
  hint: In string theory, 6 extra dimensions are compactified on an unnaturally small Calabi-Yau manifold;
    in NCG, the KO-dimension of the finite spectral triple $\mathcal{A}_F$ is $6 \pmod 8$, making the
    total metric/KO-dimension of spacetime $4 + 6 = 10 \equiv 2 \pmod 8$ without requiring geometric compactification.
