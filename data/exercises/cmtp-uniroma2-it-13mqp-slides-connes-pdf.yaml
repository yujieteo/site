- id: cmtp-uniroma2-it-13mqp-slides-connes-pdf#002
  text: How does physical time emerge from quantum thermodynamics and thermal equilibrium?
  hint: A thermal equilibrium state at inverse temperature $\beta$ is given by the Gibbs state $\varphi(A)
    = \frac{\mathrm{Tr}(A e^{-\beta H})}{\mathrm{Tr}(e^{-\beta H})}$; time evolution $A \mapsto \sigma_t(A)
    = e^{i t H} A e^{-i t H}$ is uniquely determined by the algebraic KMS condition satisfied by $\varphi$.
