- id: cmtp-uniroma2-it-13mqp-slides-connes-pdf#005
  text: How did Connes' thesis establish that a von Neumann algebra possesses a canonical thermodynamic
    time evolution?
  hint: 'Connes proved the Radon-Nikodym cocycle theorem: for any two faithful normal states $\varphi,
    \psi$, the modular automorphism groups $\sigma_t^\varphi$ and $\sigma_t^\psi$ differ only by inner
    automorphisms $\mathrm{Ad}(u_t)$, yielding a canonical outer automorphism homomorphism $\delta \colon
    \mathbb{R} \to \mathrm{Out}(M) = \mathrm{Aut}(M)/\mathrm{Inn}(M)$ independent of the state.'
  locator:
