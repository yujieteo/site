  text: Why does the spectrum of the Laplacian fail to characterize a compact Riemannian manifold?
  hint: John Milnor constructed non-isometric 16-dimensional flat tori that are isospectral ($\mathrm{Spec}(\Delta_1)
    = \mathrm{Spec}(\Delta_2)$), proving that one cannot "hear the shape of a drum" from the eigenvalue
    spectrum alone.
