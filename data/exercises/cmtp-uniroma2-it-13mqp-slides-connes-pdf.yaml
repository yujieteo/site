- id: cmtp-uniroma2-it-13mqp-slides-connes-pdf#001
  text: Why does quantum mechanics provide a more subtle answer to the nature of space and the reduction
    of the wave packet?
  hint: The collapse of the wave packet is an irreversible thermodynamic phenomenon; observables are non-commuting
    operators on a Hilbert space $\mathcal{H}$, meaning quantum states interact non-trivially with the
    algebra of observables.
