- id: cmtp-uniroma2-it-13mqp-slides-connes-pdf#016
  text: How does the Spectral Action Principle unify gravity with the Standard Model forces?
  hint: The full bosonic action is given by the spectral action $\mathrm{Tr}(f(D_A / \Lambda)) + \frac{1}{2}\langle
    J\psi, D_A \psi\rangle$, where $D_A = D + A + \epsilon J A J^{-1}$ is the Dirac operator with gauge
    fluctuations; its asymptotic heat kernel expansion automatically produces the Einstein-Hilbert action,
    the Yang-Mills gauge actions, and the Higgs potential with unified coupling relations at the unification
    scale $\Lambda$.
