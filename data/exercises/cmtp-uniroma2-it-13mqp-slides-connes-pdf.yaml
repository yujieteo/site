- id: cmtp-uniroma2-it-13mqp-slides-connes-pdf#010
  text: Why is the Dirac operator $D$ used instead of the scalar Laplacian $\Delta$?
  hint: The Dirac operator $D$ is a first-order differential operator providing a square root of the Laplacian
    ($D^2 = \Delta + \frac{1}{4}R$ via Lichnerowicz), whose inverse $D^{-1}$ represents the fermion propagator
    and directly encodes the metric and spin structure.
