- id: cmtp-uniroma2-it-13mqp-slides-connes-pdf#004
  text: State the Tomita-Takesaki Theorem for von Neumann algebras
  hint: Let $M$ be a von Neumann algebra and $\varphi$ a faithful normal state on $M$. There exists a
    unique 1-parameter group of automorphisms $\sigma_t^\varphi \in \mathrm{Aut}(M)$ (the modular automorphism
    group) fulfilling the $\mathrm{KMS}_1$ condition with respect to $\varphi$.
