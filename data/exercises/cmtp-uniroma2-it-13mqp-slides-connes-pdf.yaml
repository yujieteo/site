  text: How does noncommutative geometry describe spacetime unification in the Standard Model?
  hint: Spacetime is modeled as an almost-commutative spectral triple $(\mathcal{A}, \mathcal{H}, D)$
    with algebra $\mathcal{A} = C^\infty(M) \otimes \mathcal{A}_F$, where $\mathcal{A}_F = \mathbb{C}
    \oplus \mathbb{H} \oplus M_3(\mathbb{C})$ corresponds to the finite non-commutative geometry of the
    Standard Model.
