- id: cmtp-uniroma2-it-13mqp-slides-connes-pdf#003
  text: State the Kubo-Martin-Schwinger (KMS) condition at inverse temperature $\beta$
  hint: A faithful state $\varphi$ on a von Neumann algebra $M$ satisfies the $\mathrm{KMS}_\beta$ condition
    with respect to a 1-parameter automorphism group $\sigma_t$ if for all $x, y \in M$, there exists
    a bounded holomorphic function $F(z)$ on the strip $0 \le \mathrm{Im}(z) \le \beta$ such that $F(t)
    = \varphi(x \sigma_t(y))$ and $F(t + i\beta) = \varphi(\sigma_t(y) x)$.
  locator:
    kind: slide
    value: '10'
    number: 10
  sub_index: 0
