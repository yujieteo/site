- id: cmtp-uniroma2-it-13mqp-slides-connes-pdf#009
  text: How does von Neumann's theorem characterize the algebra of bounded measurable functions on Hilbert
    space?
  hint: By von Neumann's uniqueness theorem, the maximal abelian $*$-algebra $L^\infty(M)$ acting by multiplication
    on $L^2(M)$ is uniquely isomorphic to the standard measure algebra of $M$, containing purely measure-theoretic,
    non-metric data.
