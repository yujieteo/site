- id: cmtp-uniroma2-it-13mqp-slides-connes-pdf#012
  text: How is the Riemannian geodesic distance defined spectrally in noncommutative geometry?
  hint: 'Connes'' spectral distance formula replaces the infimum of arc lengths by the dual operator formula:
    $d(p, q) = \sup \{ |f(p) - f(q)| : f \in C^\infty(M), \|[D, f]\| \le 1 \}$, where the infinitesimal
    line element is $ds = D^{-1}$.'
