- id: cmtp-uniroma2-it-13mqp-slides-connes-pdf#014
  text: Why is the group of inner automorphisms $\mathrm{Inn}(\mathcal{A})$ of $\mathcal{A} = C^\infty(M)
    \otimes M_n(\mathbb{C})$ identified with gauge transformations?
  hint: The automorphism group splits as a semi-direct product $\mathrm{Aut}(\mathcal{A}) = \mathrm{Inn}(\mathcal{A})
    \rtimes \mathrm{Out}(\mathcal{A})$, where $\mathrm{Out}(\mathcal{A}) \cong \mathrm{Diff}(M)$ gives
    gravity (diffeomorphisms) and $\mathrm{Inn}(\mathcal{A}) \cong C^\infty(M, \mathrm{SU}(n))$ gives
    the local internal gauge group.
