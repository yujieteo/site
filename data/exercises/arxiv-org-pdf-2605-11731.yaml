- id: arxiv-org-pdf-2605-11731#007
  text: What is the rigorous preliminary definition of an analytic ring?
  hint: An analytic ring is a condensed ring $\mathcal{A}$ equipped with a family of condensed $\mathcal{A}$-modules
    $\mathcal{M}(S)$ of "measures" for profinite sets $S$, together with Dirac-delta maps $S \to \mathcal{M}(S)$
    such that the category of $\mathcal{M}$-complete $\mathcal{A}$-modules forms an abelian subcategory/heart
    of $\mathbf{Cond}(\mathcal{A})$ stable under limits, colimits, and extensions.
