- id: arxiv-org-pdf-2605-11731#000
  text: How does one characterize the sheaf of holomorphic functions locally and globally on complex domains?
  hint: A holomorphic function is locally given on open polydiscs by power series converging absolutely
    and uniformly; since holomorphicity is local, it glues to a sheaf $\mathcal{O}_X$ whose higher sheaf
    cohomology vanishes on Stein domains by Cartan's Theorem B.
