  text: How does condensed mathematics resolve the failure of the First Isomorphism Theorem for topological
    groups?
  hint: By embedding topological groups into condensed abelian groups via their functor of points on profinite
    sets; the quotient of standard $\mathbb{R}$ by discrete $\mathbb{R}$ becomes a non-trivial condensed
    abelian group sheaf.
