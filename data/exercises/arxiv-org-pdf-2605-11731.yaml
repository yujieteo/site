  text: What does it mean for a condensed set $X$ to be projective?
  hint: For every surjective map of condensed sets $Y \twoheadrightarrow Z$, the induced map $\mathrm{Hom}(X,
    Y) \to \mathrm{Hom}(X, Z)$ is surjective; equivalently, any surjection $Y \twoheadrightarrow X$ admits
    a section.
