- id: arxiv-org-pdf-2605-11731#011
  text: What is the category of $\kappa$-condensed sets and how does it behave under cardinal cutoffs?
  hint: $\mathbf{Cond}_\kappa(\mathbf{Set})$ is the category of sheaves on $(\mathbf{Prof}_\kappa, \text{finitary
    étale})$, i.e., contravariant functors $X \colon \mathbf{Prof}_\kappa^{\mathrm{op}} \to \mathbf{Set}$
    sending finite coproducts to finite products and preserving covers; taking the colimit over strong
    limit cardinals $\kappa$ yields the fully faithful category $\mathbf{Cond}(\mathbf{Set})$.
