  text: What is a quasi-compact condensed set?
  hint: A condensed set $X$ such that for every collection of open coverings, any covering surjection
    $\coprod_{i} U_i \to X$ admits a finite sub-surjection; equivalently, $X$ admits a surjection from
    a single profinite set.
