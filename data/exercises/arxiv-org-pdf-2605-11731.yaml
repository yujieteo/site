- id: arxiv-org-pdf-2605-11731#001
  text: How does one establish the existence and cohomological vanishing of the sheaf of holomorphic functions?
  hint: Analyticity follows from the Cauchy integral formula; using smooth bump functions and partitions
    of unity, one constructs the Dolbeault resolution $0 \to \mathcal{O} \to \Omega^{0,0} \xrightarrow{\bar{\partial}}
    \Omega^{0,1} \xrightarrow{\bar{\partial}} \dots$, reducing higher cohomology vanishing to the solvability
    of the $\bar{\partial}$-equation on Stein/polydisc domains.
