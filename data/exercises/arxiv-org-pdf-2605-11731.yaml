- id: arxiv-org-pdf-2605-11731#005
  text: Why do topological abelian groups fail to form an abelian category?
  hint: A continuous bijective homomorphism between topological abelian groups (e.g., from discrete $\mathbb{R}$
    to standard $\mathbb{R}$) has trivial kernel and cokernel but is not an open isomorphism, so the First
    Isomorphism Theorem fails.
