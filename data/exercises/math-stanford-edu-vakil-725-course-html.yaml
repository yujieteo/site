  text: Why does regular local imply Cohen-Macaulay, UFD, and normal?
  hint: The maximal ideal of a regular local ring is generated by a regular sequence of length $d = \dim(R)$,
    so $\mathrm{depth}(R) = \dim(R)$ (Cohen-Macaulay); by the Auslander-Buchsbaum theorem, regular local
    rings are UFDs, and UFDs are integrally closed (normal).
