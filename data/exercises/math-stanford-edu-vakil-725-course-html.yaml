- id: math-stanford-edu-vakil-725-course-html#000
  text: What is the unified definition of an immersion and how does it combine open and closed immersions?
  hint: Fix the ideal sheaf $\mathcal{I} \subset \mathcal{O}_Y$ of a locally closed subset $Z \subset
    Y$. An immersion is a homeomorphism $X \xrightarrow{\sim} Z$ together with a surjective sheaf map
    $\mathcal{O}_Y|_Z \twoheadrightarrow \mathcal{O}_X$ having kernel $\mathcal{I}$; setting $\mathcal{I}
    = 0$ gives an open immersion, while taking $Z$ closed in $Y$ gives a closed immersion.
  locator: null
