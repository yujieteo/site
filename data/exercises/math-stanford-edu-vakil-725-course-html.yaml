  text: What is a normal scheme and what is the universal property of normalization?
  hint: A scheme is normal if all local rings are integrally closed domains; the normalization $\widetilde{X}
    \to X$ is the unique initial scheme among all finite birational morphisms from normal schemes to $X$,
    and $X$ is normal if and only if $\widetilde{X} \to X$ is an isomorphism.
