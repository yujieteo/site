- id: math-stanford-edu-vakil-725-course-html#002
  text: How does the diagonal morphism $\Delta \colon X \to X \times_Y X$ define the separation hierarchy
    of schemes?
  hint: 'The diagonal $\Delta$ is always a locally closed immersion; the separation adjectives correspond
    to the property of $\Delta$: monomorphism $\iff \Delta$ is an isomorphism; separated $\iff \Delta$
    is a closed immersion; semi-separated $\iff \Delta$ is an affine morphism; quasi-separated $\iff \Delta$
    is a quasi-compact morphism. Since an isomorphism is a closed immersion, a closed immersion of schemes
    is affine, and an affine morphism is quasi-compact, this yields the strict implication chain: monomorphism
    $\implies$ separated $\implies$ semi-separated $\implies$ quasi-separated.'
