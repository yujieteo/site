  text: What is the relationship between Cartier divisors and Weil divisors on normal schemes?
  hint: A Cartier divisor is a global section of $\mathcal{K}_X^\times / \mathcal{O}_X^\times$; a Weil
    divisor is a formal sum $\sum n_i Z_i$ of codimension-1 cycles; on normal schemes, Cartier divisors
    inject into Weil divisors via $\operatorname{div}(f) = \sum \mathrm{ord}_{Z_i}(f) Z_i$, and they coincide
    if and only if the scheme is locally factorial (e.g., regular).
