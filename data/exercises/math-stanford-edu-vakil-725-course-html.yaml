- id: math-stanford-edu-vakil-725-course-html#010
  text: Why is the punctured affine plane $\mathbb{A}^2 \setminus \{0\}$ quasi-affine but not affine?
  hint: It is a quasi-compact open subscheme of $\mathbb{A}^2$, but on the cover $\{D(x), D(y)\}$ the
    Čech class $\frac{1}{xy}$ is not a coboundary in $k[x, x^{-1}] \oplus k[y, y^{-1}]$, so $H^1(\mathbb{A}^2
    \setminus \{0\}, \mathcal{O}) \neq 0$, violating Serre's affineness criterion.
