- id: math-stanford-edu-vakil-725-course-html#004
  text: How is separatedness checked affine-locally on overlapping charts?
  hint: A morphism $X \to Y$ is separated if and only if for every pair of affine opens $U, V \subset
    X$ mapping into a common affine open $\mathrm{Spec}(R) \subset Y$, the intersection $U \cap V$ is
    affine and the multiplication map $\mathcal{O}(U) \otimes_R \mathcal{O}(V) \twoheadrightarrow \mathcal{O}(U
    \cap V)$ is surjective.
