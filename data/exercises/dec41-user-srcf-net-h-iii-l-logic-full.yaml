- id: dec41-user-srcf-net-h-iii-l-logic-full#019
  text: How does one invent world logic?
  hint: classical logic uses collection of propositions with model as function valued in true and false,
    then truth can be define recursively. However, one can take a subset of propositions, a subset of
    it,a. model as a collection of worlds, then take a partial order on the subset called accessibility.
    Then the partial order represents belief, w' >= w means w believes phi if w follows omega. The rest
    are poset relations.
