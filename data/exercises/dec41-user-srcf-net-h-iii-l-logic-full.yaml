- id: dec41-user-srcf-net-h-iii-l-logic-full#014
  text: Why must one have the definition of harmony?
  hint: you can use A to get A&B but A&B tells you nothing about A, in the example of the notes. Another
    asymmetry is that you do not need B to prove A&B, but you can use A&B to deduce something about B.
    So the rule you want is such that A&B is the strongest assertion one can prove from introduction,
    then A&B is the weakest assertion one can have through elimination, though this is not precise.
  locator: null
