  text: '(The Bruhat Decomposition as Categorified Gaussian Elimination) State the Bruhat decomposition
    for $\mathrm{GL}_n(\mathbb{F}_q)$ (and $\mathrm{GL}_n(\mathbb{C})$): $$\mathrm{GL}_n = \bigsqcup_{w
    \in S_n} B w B,$$ where $B$ is the Borel subgroup of upper-triangular matrices and $w \in S_n$ is
    represented by a permutation matrix. '
  hint: Show that the Bruhat decomposition is the coordinate-free geometric formulation of Gaussian elimination
