- id: arxiv-org-pdf-2203-07082#008
  text: '(The Affine Grassmannian and Geometric Satake) Define the affine Grassmannian $\operatorname{Gr}_G
    = G(\mathcal{K})/G(\mathcal{O})$, where $\mathcal{O} = \mathbb{C}[[t]]$ is the ring of formal power
    series and $\mathcal{K} = \mathbb{C}((t))$ is the field of formal Laurent series. 1. Define the Iwahori
    subgroup $\mathcal{I} \subset G(\mathcal{O})$ as the preimage of the Borel subgroup $B \subset G(\mathbb{C})$
    under the evaluation map $t \mapsto 0$. 2. State the Geometric Satake Equivalence of Mirković and
    Vilonen: the category of $G(\mathcal{O})$-equivariant perverse sheaves on $\operatorname{Gr}_G$ equipped
    with the convolution product is equivalent as a symmetric monoidal category to the representation
    category of the Langlands dual group: $$\left( \operatorname{Perv}_{G(\mathcal{O})}(\operatorname{Gr}_G),
    \star \right) \cong (\operatorname{Rep}(G^\vee), \otimes).$$ '
  hint: Perverse sheaves provide the natural abelian category to compute intersection forms and geometric
    weight spaces via Mirković–Vilonen cycles
