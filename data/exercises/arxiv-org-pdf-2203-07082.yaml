  text: '(Kazhdan-Lusztig Polynomials and Canonical Bases) State the Kazhdan–Lusztig theorem: there exists
    a unique canonical self-dual basis $\{C_w\}_{w \in W}$ in the Hecke algebra $\mathcal{H}(W, S)$ invariant
    under the bar-involution $\overline{v} = v^{-1}, \overline{H_s} = H_s^{-1}$, expressed as: $$C_w =
