  text: '(Schur-Weyl Duality and Group Algebras) State classical Schur–Weyl duality on tensor space $V^{\otimes
    n}$, where $V = \mathbb{C}^d$: 1. The natural action of $\mathrm{GL}(V)$ commutes with the permutation
    action of the symmetric group $S_n$. 2. The canonical maps $\mathbb{C}[\mathrm{GL}(V)] \twoheadrightarrow
    \operatorname{End}_{S_n}(V^{\otimes n})$ and $\mathbb{C}[S_n] \twoheadrightarrow \operatorname{End}_{\mathrm{GL}(V)}(V^{\otimes
    n})$ are surjective with centralizer properties. '
  hint: Decompose $V^{\otimes n} \cong \bigoplus_\lambda L_{\mathrm{GL}(V)}(\lambda) \otimes S^\lambda$
    as a multiplicity-free module over $\mathrm{GL}(V) \times S_n$, where $S^\lambda$ are Specht modules
    and $L(\lambda)$ are irreducible polynomial representations
