  text: '(Coxeter Systems and Bruhat Order) Define a Coxeter system $(W, S)$ as a group $W$ with generating
    set $S = \{s_i\}$ and presentation: $$(s_i s_j)^{m(s_i, s_j)} = 1, \quad m(s_i, s_i) = 1, \quad m(s_i,
    s_j) \ge 2 \text{ for } i \ne j.$$ Define the length function $\ell(w)$ via reduced expressions $w
    = s_{i_1} \dots s_{i_k}$, and define the Bruhat partial order $u \le w$ on $W$. '
  hint: The affine Weyl group $\widetilde{W} = W \ltimes Q^\vee$ is obtained by adjoining the affine reflection
    $s_0$
