- id: arxiv-org-pdf-2203-07082#009
  text: '(Iwahori-Hecke Algebras and Braid Deformations) Define the Iwahori–Hecke algebra $\mathcal{H}(W,
    S)$ of a Coxeter system as the $\mathbb{Z}[v, v^{-1}]$-algebra with standard basis $\{H_w\}_{w \in
    W}$ satisfying: 1. **Braid Relations:** $H_s H_t H_s \dots = H_t H_s H_t \dots$ for $m(s, t)$ factors.
    2. **Deformed Quadratic Relations:** $(H_s - v^{-1})(H_s + v) = 0$, or equivalently $H_s^2 = (v^{-1}
    - v)H_s + 1$. '
  hint: Show that setting $v = 1$ recovers the group algebra of the Coxeter group $\mathbb{Z}[W]$; the
    braid relations remain undeformed while the involution $s^2 = 1$ is deformed quadratically
  locator: null
