- id: ncatlab-org-nlab-show-local-coefficient-bundle#000
  text: What is a local coefficient bundle?
  hint: A section of a $V$-fiber $\infty$-bundle $E \rightarrow X$. The cohomology class chosen is the
    twist. The prototypical simpler example is the Mobius band in ordinary line bundle theory.
