  text: '(Resolving the Nodal Singularity of the Cubic Curve) Consider the nodal cubic curve $y^2 = x^3
    + x^2$ in $\mathbb{A}^2$, which has a singular node at the origin $(0, 0)$. Show that the map $t \mapsto
    (t^2 - 1, t(t^2 - 1))$ is a polynomial map from $\mathbb{A}^1$ to the curve that is $2:1$ at the origin
    ($t = \pm 1 \mapsto (0, 0)$) and $1:1$ elsewhere. (Hint: This normalization map is a birational isomorphism
    and provides the simplest example of a resolution of singularities in characteristic 0)'
  hint: null
  locator: null
  sub_index: null
