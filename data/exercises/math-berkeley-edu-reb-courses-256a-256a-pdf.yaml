- id: math-berkeley-edu-reb-courses-256a-256a-pdf#000
  text: '(The Circle as an Algebraic Group and Weierstrass Substitution) Realize the unit circle $S^1
    \subset \mathbb{R}^2$ as an affine algebraic variety defined by $x^2 + y^2 = 1$, and equip it with
    an algebraic group law. Use the stereographic/Weierstrass substitution $t = \tan(\theta/2)$ to construct
    a rational parametrization $t \mapsto \left(\frac{1-t^2}{1+t^2}, \frac{2t}{1+t^2}\right)$. (Hint:
    Show that this birational map from $\mathbb{A}^1$ to $S^1$ parametrizes all rational points on the
    circle and connects Pythagorean triples to the geometry of algebraic groups)'
  hint: null
