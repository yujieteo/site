  text: '(Short Proof of Hilbert''s Basis Theorem) State and prove Hilbert''s Basis Theorem: if $R$ is
    a Noetherian ring, then $R[x]$ is Noetherian. (Hint: For any ideal $I \subseteq R[x]$, consider the
    ideal $J \subseteq R$ of leading coefficients of polynomials in $I$; since $R$ is Noetherian, $J$
    is finitely generated, and an inductive degree argument shows $I$ is finitely generated. Adapt the
    same argument to formal power series rings $R[[x]]$ by considering the lowest-degree non-zero coefficients)'
  hint: null
