  text: 'Motivic correlators: verify the K-theory identification (52), p. 21, $\mathrm{Ext}^1_{Mot/\mathbb
    Q}(\mathbb Q(0),H^1(M)(1))=K_2(M)\otimes\mathbb Q$, is consistent with the general formula (13)-(15)
    specialized to a curve, by working out the case $X=M$ a modular curve, $n=2$, $m=1$'
  hint: 'From (13), $\mathrm{Ext}^m(\mathbb Q(0)_X,\mathbb Q(n)_X)=\mathrm{gr}^n_\gamma K_{2n-m}(X)\otimes\mathbb
    Q$. The text derives (p. 22) $K_2(X)\otimes\mathbb Q=\mathrm{Ext}^2_{Mot/F}(\mathbb Q(0),p_*\mathbb
    Q(2)_X)=\mathrm{Ext}^1_{Mot/F}(\mathbb Q(0),H^1(X)(2))$ using the Leray spectral sequence (15) and
    the vanishing of $\mathrm{Ext}^i$ for $i\ne1$ on pure motives over a number field, plus Poincare duality
    $H^1(X)=H^1(X)(-1)^\vee$-type identification to trade $(2)$ for $(1)$ on the dual motive $H^1(M)$
    vs. its twist. Setting $m=1,n=2$ in (13) directly gives $\mathrm{gr}^2_\gamma K_3(X)$, which is NOT
    what''s claimed; the correct route is via (14)-(15) as the text does, not a naive single application
    of (13) — this is precisely the point of the exercise: showing why the paper needs the two-step spectral-sequence
    argument (13)+(14)+(15) rather than one direct formula, and why the Poincare-duality step $H^1(X)=H^1(X)(-1)$
    on p. 22 is required to land on (52).'
