- id: arxiv-org-pdf-0803-0297#003
  text: The twistor operator $\widehat\omega_m$ is defined in (64), p. 30-31, using $D^{\mathbb C}=w\partial'-z\partial''+(z\,dw-w\,dz)$.
    Show that $D^{\mathbb C}$ has cohomological degree $+1$ and Hodge bidegree $(1,1)$, and use this to
    confirm that $\widehat\omega_m$ preserves the total (cohomological + Hodge) grading, as claimed in
    Lemma 2.6 (p. 31)
  hint: $\partial'$ raises cohomological degree by 1 and has Hodge bidegree $(1,0)$; multiplying by $w$,
    which under the $\mathbb C^*\times\mathbb C^*$ action has weight $(0,1)$, shifts this to bidegree
    $(1,1)$ overall, degree $+1$ cohomologically. Similarly $z\partial''$ has bidegree $(1,0)+(0,1)$...
    actually $z$ has weight $(1,0)$ and $\partial''$ has bidegree $(0,1)$, giving $(1,1)$ again, cohomological
    degree $+1$. The 1-form $z\,dw-w\,dz$ has de Rham degree 1 and total weight $(1,1)$ under the diagonal
    action, matching. Since $D^{\mathbb C}$ is homogeneous of bidegree $(1,1)$ and degree $+1$, wedging
    $m$ copies in $\widehat\omega_m=D^{\mathbb C}\varphi_1\wedge\cdots\wedge D^{\mathbb C}\varphi_m$ shifts
    the total degree of each $\varphi_i$ uniformly, so the map is grading-preserving as stated.
  locator: null
  sub_index: null
