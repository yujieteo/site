  text: 'The cyclic envelope construction: for a free associative algebra $A=T(V)$, the space $C(A)=A_+/[A_+,A_+]$
    has a basis of cyclic words (Section 1.6, p. 11). Show directly that $C(T(V))$ for $V$ two-dimensional
    with basis $\{x,y\}$ has $C(xy)=C(yx)$ by exhibiting $xy-yx$ as a commutator in $A_+$'
  hint: In the free associative algebra, $xy-yx=[x,y]$ is by definition an element of $[A_+,A_+]$ (the
    span of commutators $ab-ba$ for $a,b\in A_+$). Hence in the quotient $C(A)=A_+/[A_+,A_+]$, the classes
    of $xy$ and $yx$ coincide, giving $C(xy)=C(yx)$, illustrating the cyclic-word description of $C(A)$.
