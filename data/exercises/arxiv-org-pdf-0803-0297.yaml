  text: Example 1.6 (p. 11-12) describes the Hodge correlator for a cyclic word $W=C(\{a_0\}\otimes\cdots\otimes\{a_n\})$
    as a sum over plane trivalent trees with $n+1$ external, $S^*$-decorated edges. Using the stated fact
    ("a trivalent tree with $m+1$ external vertices has $2m-1$ edges," p. 34), compute the number of edges
    and the number of internal vertices for $n=5$ (six decorating points, as in Figure 1)
  hint: 'Here $m+1=6$ so $m=5$. Edges: $2m-1=9$. A trivalent tree with $k$ internal (valence-3) vertices
    and $m+1$ external (valence-1) vertices has, by the handshake lemma, $3k+(m+1)=2\cdot(\text{number
    of edges})=2(2m-1)$, giving $3k=2(2m-1)-(m+1)=3m-3$, so $k=m-1=4$ internal vertices — matching Figure
    1''s picture of a tree with 6 external legs and 4 internal trivalent nodes.'
