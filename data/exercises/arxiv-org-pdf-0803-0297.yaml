  text: 'Lemma 3.1 (p. 34) states: if $D_0$ is a degree-zero divisor, then $G_\mu(D_0,y)-G_{\mu''}(D_0,y)$
    does not depend on $y$. Reprove this'
  hint: Apply $\bar\partial_y\partial_y$ to $G_\mu(D_0,y)-G_{\mu'}(D_0,y)$. By linearity and (74), $\partial\bar\partial_y
    G_\mu(D_0,y)=\deg(D_0)\cdot p_2^*\mu-(\text{terms from the divisor's own points, which cancel between
    }\mu,\mu'\text{ only in the diagonal term, absent here since }D_0\text{ has no support constraint
    relative to }y\text{ generically})$. Concretely $\partial\bar\partial_y\big(G_\mu(D_0,y)-G_{\mu'}(D_0,y)\big)=\deg(D_0)\,p_2^*(\mu-\mu')$...
    but since $\deg(D_0)=0$ this vanishes identically, so the difference is a $\partial\bar\partial$-harmonic
    function of $y$ on the compact curve $X$, hence constant.
