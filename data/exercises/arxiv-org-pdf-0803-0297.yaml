  text: 'State and verify the normalization property of the pointed Green function $G_a(x,y)$ from Section
    3.1 (p. 33-34): show $\mathrm{Sp}^{x\to a}_v\,G_v(x,y)=0$ using the defining property that $G_v(x,y)-(2\pi
    i)^{-1}\log|t|$ vanishes at $x=a$, where $t$ is the local parameter with $dt(v)=1$'
  hint: By definition (p. 34), $G_v(x,y)$ is chosen so that $G_v(x,y)-(2\pi i)^{-1}\log|t(x)|$ is smooth
    and vanishes at $x=a$. The specialization operator $\mathrm{Sp}^{t\to0}_v F(t)$ extracts the coefficient
    $F_0(0)$ of the $\log^0|t|$ term in the asymptotic expansion $F(t)=\sum_n F_n(t)\log^n|t|$. Since
    $G_v(x,y)=(2\pi i)^{-1}\log|t|+(\text{smooth, vanishing at }x=a)$, the $\log^0|t|$-coefficient at
    $x=a$ is exactly the smooth remainder evaluated at $a$, which is $0$ by construction. This gives (77).
