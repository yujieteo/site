    is 1-dimensional. The shuffle relation in $CAss_3^*$ kills exactly the symmetric combination, leaving
    the antisymmetric (Lie) part — dually this matches $Lie_2=\ker(\Delta:Ass_2\to Ass_1\otimes Ass_1)$
