  text: 'Definition 4.7 (p. 45) defines the homogeneous twistor transform $\widehat\gamma$. Check the
    degree-zero (Hodge bidegree $(0,0)$) part of formula (101) is just the identity: $\widehat\gamma(\varphi_{0,0})=\varphi_{0,0}$'
  hint: 'In (101), the sum $\sum_{s,t\ge0}z^sw^t[\cdots]$ only involves terms $\varphi_{s+1,t+1}$ for
