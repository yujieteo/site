  text: Using formula (76), p. 33, $G_a(x,y)=G_{Ar}(x,y)-G_{Ar}(a,y)-G_{Ar}(x,a)+C$, verify by direct
    substitution that the right-hand side satisfies the same differential equation (74) as $G_a(x,y)$
    (with $\mu=\delta_a$), assuming $G_{Ar}$ solves (74) for $\mu=\mathrm{vol}_X$
  hint: Apply $\partial\bar\partial$ in the $x$ (and $y$) variables to each term. $\partial\bar\partial_x\partial\bar\partial_y
    G_{Ar}(x,y)$ produces the delta-diagonal minus volume-form terms from (74) with $\mu=\mathrm{vol}_X$.
    The terms $G_{Ar}(a,y)$ and $G_{Ar}(x,a)$ are each pulled back from a single copy of $X$ (constant
    in the other variable), so their mixed $\partial\bar\partial$ (in both $x$ and $y$ jointly) vanishes
    except through the single-variable Laplacian, which reproduces exactly the $p_1^*\mathrm{vol}_X$ and
    $p_2^*\mathrm{vol}_X$ correction terms in (74), leaving $\delta_{\Delta_X}$ as the only surviving
    singular term — matching (74) for $\mu=\delta_a$, since $\delta_a$ replaces the smooth volume form.
