  text: Verify the integral identity $\int_0^1(1-u)^su^t\,du=\frac{1}{s+t+1}\binom{s+t}{s}^{-1}$ used
    in the proof of Lemma 2.8 (p. 31-32) to relate $\widehat\omega_{m+1}$ integrated over the twistor
    line segment to $\omega_{m+1}$
  hint: This is the Beta function identity $B(s+1,t+1)=\int_0^1(1-u)^su^t\,du=\frac{\Gamma(s+1)\Gamma(t+1)}{\Gamma(s+t+2)}=\frac{s!\,t!}{(s+t+1)!}$.
    Rewrite $\frac{s!\,t!}{(s+t+1)!}=\frac1{s+t+1}\cdot\frac{s!\,t!}{(s+t)!}=\frac1{s+t+1}\binom{s+t}{s}^{-1}$,
    matching the stated formula (70).
