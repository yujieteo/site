  text: Definition 1.7 (p. 16) defines a twistor connection via flatness of $\mathrm{Res}_{z+w=1}\nabla_G$.
    Show that flatness of this restricted connection (39) is equivalent to $\{G_{p,q},g_{0,0}\}$ satisfying
    a Maurer-Cartan-type system, by expanding $(\mathrm{Res}\,\nabla_G)^2=0$ in powers of $u$ and matching
    coefficients (structurally, without computing every term)
  hint: $\mathrm{Res}_{z+w=1}\nabla_G=d+g_{0,0}+\sum_{s,t\ge0}(1-u)^su^t\big[(s+t+1)G_{s+1,t+1}\,du+(u\partial'-(1-u)\partial'')G_{s+1,t+1}\big]$,
    a connection depending polynomially/power-series on $u$. Flatness means the curvature 2-form vanishes
    identically in $u$; since $(1-u)^su^t$ for varying $s,t$ are linearly independent functions of $u$,
    the vanishing of the curvature forces the vanishing of each coefficient separately, giving one quadratic
    equation in the $G_{p,q}$'s (and $g_{0,0}$) per power of $u$ precisely the Maurer-Cartan system referenced
    right after Definition 1.7 on p. 16.
