  text: 'Verify the base case of the operator $\omega_m$: from Definition 2.1 (p. 28), compute $\omega_1(\varphi_0)$
    directly from the formula $\omega_{m+1}(\varphi_0,\dots,\varphi_m)=\frac{1}{(m+1)!}\mathrm{Sym}_{m+1}\sum_{k=0}^m(-1)^k\,\varphi_0\wedge\partial''\varphi_1\wedge\cdots\wedge\partial''\varphi_k\wedge\partial''''\varphi_{k+1}\wedge\cdots\wedge\partial''''\varphi_m$,
    and check it matches the stated value $\omega_1(\varphi_0)=\varphi_0$'
  hint: Set $m=0$. The sum over $k$ has only the term $k=0$, and with no $\varphi_i$ for $i\ge1$ there
    are no wedge factors, so the summand is just $\varphi_0$. $\mathrm{Sym}_1$ on one element is the identity,
    and $1/(0+1)!=1$. Hence $\omega_1(\varphi_0)=\varphi_0$, matching Example 2.2, p. 28.
