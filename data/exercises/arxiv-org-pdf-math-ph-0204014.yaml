- id: arxiv-org-pdf-math-ph-0204014#008
  text: Why is the Noether current $j^\mu$ mathematically an $(n-1)$-form defined modulo exact forms?
  hint: Conserved currents integrate over spacelike $(n-1)$-dimensional hypersurfaces $\Sigma \subset
    \mathbb{R}^n$ to yield the conserved charge $Q = \int_\Sigma *j$; changing $j$ by an identically conserved
    term $\partial_\nu K^{[\mu\nu]}$ alters $j$ by the exterior derivative $d(*K)$ of an $(n-2)$-form,
    so Noether currents canonically represent cohomology classes in $\Omega^{n-1}(V) / d\Omega^{n-2}(V)$.
  locator: null
