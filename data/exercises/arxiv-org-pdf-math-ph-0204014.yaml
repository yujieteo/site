- id: arxiv-org-pdf-math-ph-0204014#010
  text: How is the stress-energy-momentum tensor $T^{\mu\nu}$ constructed from spacetime translational
    symmetry?
  hint: Infinitesimal spacetime translations $x^\mu \mapsto x^\mu + \epsilon^\mu$ induce $\delta \phi
    = \partial_\nu \phi$; the corresponding canonical Noether currents form the tensor $T^\mu_{\ \nu}
    = \frac{\partial \mathcal{L}}{\partial(\partial_\mu \phi)} \partial_\nu \phi - \delta^\mu_\nu \mathcal{L}$,
    satisfying $\partial_\mu T^{\mu\nu} = 0$ on shell.
