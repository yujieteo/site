- id: arxiv-org-pdf-math-ph-0204014#004
  text: How does Borcherds rigorously define the algebra of Lagrangian densities using polynomial differential
    operators?
  hint: Let $V$ be a finite-dimensional real spacetime ($V \cong \mathbb{R}^n$) and $W$ a finite-dimensional
    complex representation of abstract field values equipped with complex conjugation. Let $\mathrm{Diff}(V)$
    be the polynomial ring of translation-invariant differential operators $\mathbb{C}[\partial_1, \dots,
    \partial_n]$. The space of field variables is $J(W) = \mathrm{Diff}(V) \otimes_\mathbb{C} W$, and
    a classical Lagrangian density $\mathcal{L}$ is an element of the symmetric algebra $\mathrm{Sym}^\bullet(J(W))$.
  locator: null
