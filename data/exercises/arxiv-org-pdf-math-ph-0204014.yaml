- id: arxiv-org-pdf-math-ph-0204014#007
  text: How is the conserved Noether current $j^\mu$ derived for a complex scalar field $\phi$?
  hint: For $\mathcal{L} = \partial_\mu \phi^* \partial^\mu \phi - m^2 \phi^* \phi$, global $\mathrm{U}(1)$-phase
    invariance $\phi \mapsto e^{i\alpha} \phi$ has infinitesimal generator $\delta \phi = i\phi, \delta
    \phi^* = -i\phi^*$. The resulting Noether current $j^\mu = i(\phi^* \partial^\mu \phi - \phi \partial^\mu
    \phi^*)$ satisfies the continuity equation $\partial_\mu j^\mu = 0$ on shell (modulo the Euler-Lagrange
    ideal).
