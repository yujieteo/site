- id: arxiv-org-pdf-math-ph-0204014#002
  text: What is the difference between ultraviolet (UV) divergences and the asymptotic divergence of the
    perturbation series?
  hint: UV divergences are local short-distance singularities in individual loop momentum integrals that
    are removed by regularizing and adding local counterterms to the Lagrangian; asymptotic divergence
    is the divergence of the sum $\sum a_n \lambda^n$ due to the factorial growth $a_n \sim n!$ of the
    number of Feynman diagrams, requiring Borel summation or non-perturbative completions rather than
    renormalization.
