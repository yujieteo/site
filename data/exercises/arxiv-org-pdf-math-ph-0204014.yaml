- id: arxiv-org-pdf-math-ph-0204014#011
  text: How is the electromagnetic field strength $F_{\mu\nu}$ and its Euler-Lagrange equation formulated
    homologically?
  hint: The gauge potential $A = A_\mu dx^\mu$ has curvature $F = dA = \frac{1}{2} F_{\mu\nu} dx^\mu \wedge
    dx^\nu$ where $F_{\mu\nu} = \partial_\mu A_\nu - \partial_\nu A_\mu$. The Maxwell Lagrangian $\mathcal{L}
    = -\frac{1}{4} F_{\mu\nu} F^{\mu\nu}$ yields the Euler-Lagrange equation $\partial_\mu F^{\mu\nu}
    = 0$, which expresses the cocycle condition $d * F = 0$ in the de Rham complex.
  locator: null
