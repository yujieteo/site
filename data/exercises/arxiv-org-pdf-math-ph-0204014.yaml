- id: arxiv-org-pdf-math-ph-0204014#001
  text: How does Borcherds resolve the non-existence of an infinite-dimensional translation-invariant
    Lebesgue measure in the path integral?
  hint: By treating the functional integral not as an analytical measure, but algebraically as a formal
    perturbative generating series of finite-dimensional Feynman amplitudes evaluated with cutoffs, quotiented
    by the group of finite renormalization transformations acting simultaneously on Lagrangians and cutoff
    functions.
