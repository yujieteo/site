- id: arxiv-org-pdf-math-ph-0204014#005
  text: How does the vibrating string Lagrangian on $\mathbb{R}^2$ produce the wave equation via Hamilton's
    principle?
  hint: Let $W \cong \mathbb{R}$ with coordinate $\phi(t, x)$ on $\mathbb{R}^2$. The Lagrangian density
    is $\mathcal{L} = \frac{1}{2} (\partial_t \phi)^2 - \frac{1}{2} (\partial_x \phi)^2$. Setting the
    variation of the action $\delta S = \delta \int \mathcal{L} \, dt\,dx = 0$ and applying integration
    by parts yields the Euler-Lagrange equation $\partial_t^2 \phi - \partial_x^2 \phi = 0$.
  locator: null
