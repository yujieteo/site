- id: arxiv-org-pdf-math-ph-0204014#003
  text: How are fundamental particles classified by spin and statistics in the Standard Model?
  hint: Matter fields are fermions with half-integer spin ($s = 1/2$, such as quarks, electrons, and neutrinos)
    governed by Grassmann/anticommuting variables and Fermi-Dirac statistics; force carriers are bosons
    with integer spin ($s = 1$ gauge bosons $\gamma, W^\pm, Z^0, g$ and $s = 0$ Higgs scalar) governed
    by symmetric variables and Bose-Einstein statistics.
