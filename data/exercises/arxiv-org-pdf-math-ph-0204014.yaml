- id: arxiv-org-pdf-math-ph-0204014#006
  text: How is the real scalar field generalized to $\phi^4$-theory on $\mathbb{R}^n$?
  hint: The Lagrangian density is $\mathcal{L} = \frac{1}{2} \partial_\mu \phi \partial^\mu \phi - \frac{1}{2}
    m^2 \phi^2 - \frac{\lambda}{4!} \phi^4$, whose Euler-Lagrange equation is the non-linear Klein-Gordon
    equation $(\Box + m^2)\phi + \frac{\lambda}{3!} \phi^3 = 0$, where $\Box = \partial_\mu \partial^\mu$.
