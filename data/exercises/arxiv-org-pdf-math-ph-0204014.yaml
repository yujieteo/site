- id: arxiv-org-pdf-math-ph-0204014#000
  text: What is Borcherds' "life cycle of a mathematical physicist" in perturbative quantum field theory?
  hint: (1) Write down a classical Lagrangian density $\mathcal{L}(\phi, \partial \phi)$; (2) form the
    Feynman path integral $Z = \int \mathcal{D}\phi \, e^{i \int \mathcal{L} dx}$; (3) expand perturbatively
    as a formal power series $\sum a_n \lambda^n$ where each coefficient $a_n$ is a sum of finite-dimensional
    Feynman integrals labeled by graphs; (4) observe that the loop integrals diverge (ultraviolet divergences);
    (5) introduce a regulator/cutoff $\epsilon > 0$ to make the integrals finite; (6) absorb divergences
    into $\epsilon$-dependent bare parameters (mass, coupling constants, field normalization) via the
    renormalization group; (7) observe that the $\epsilon$-independent renormalized coefficients $a_n$
    are finite; (8) observe that the resulting renormalized perturbation series $\sum a_n \lambda^n$ still
    has zero radius of convergence (Dyson's divergence argument); (9) truncate the divergent asymptotic
    series at a finite order to compare with experimental measurements.
  locator: null
  sub_index: null
