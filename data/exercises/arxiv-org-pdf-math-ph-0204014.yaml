- id: arxiv-org-pdf-math-ph-0204014#009
  text: Why does physics depend on the action integral $\int \mathcal{L}\, d^n x$ rather than the Lagrangian
    density $\mathcal{L}$ itself?
  hint: Adding a total spacetime divergence $\partial_\mu K^\mu$ to $\mathcal{L}$ leaves the Euler-Lagrange
    equations, classical equations of motion, and quantum amplitudes completely invariant, meaning Lagrangian
    densities are physically defined modulo the image of the total divergence operator $d \colon \Omega^{n-1}
    \to \Omega^n$.
