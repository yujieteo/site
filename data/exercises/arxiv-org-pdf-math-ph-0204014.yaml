- id: arxiv-org-pdf-math-ph-0204014#012
  text: How does Borcherds formulate the Euler-Lagrange equations via the universal derivation module
    $\Omega^1(\mathcal{A})$ of the jet algebra?
  hint: The variational derivative is realized algebraically as the quotient map $\delta \colon \mathcal{A}
    \to \Omega^1(\mathcal{A}) / (\mathrm{Im}(d) + \mathcal{I}_{\mathrm{EL}})$, where $\mathcal{I}_{\mathrm{EL}}$
    is the differential ideal generated by the Euler-Lagrange relations, recasting variational calculus
    into commutative and homological algebra.
