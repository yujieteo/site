  text: '(Section 1) List the four key properties that define a "good" category of spectra. '
  hint: It should be an elementary model category whose homotopy category is the stable homotopy category,
    it must possess a compatible closed symmetric monoidal smash product, and spectra arising from generalized
    cohomology theories like $KO$ and $HA$ should be easily described
