- id: ncatlab-org-nlab-files-symmetricspectra-pdf#000
  text: '(Section 1) Explain how the Freudenthal suspension theorem motivates the construction of the
    stable homotopy category. '
  hint: The sequence of pointed homotopy classes $[ \Sigma^k X, \Sigma^k Y ]_+$ is eventually constant
    for finite-dimensional CW-complexes, suggesting the construction of a localized category where the
    suspension functor $\Sigma = S^1 \wedge -$ is formally inverted
