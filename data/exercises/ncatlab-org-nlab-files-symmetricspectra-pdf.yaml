- id: ncatlab-org-nlab-files-symmetricspectra-pdf#003
  text: '(Section 2.1) Review the category of pointed simplicial sets $\mathcal{S}_*$. Show that $\mathcal{S}_*$
    is a closed symmetric monoidal category under the smash product $X \wedge Y = (X \times Y)/(X \times
    * \cup * \times Y)$. '
  hint: The unit object is $S^0 = \Delta[0]_+$, and the right adjoint to $-\wedge X$ is the mapping simplicial
    set $\operatorname{Map}_{\mathcal{S}_*}(X, Y)_n = \mathcal{S}_*(X \wedge \Delta[n]_+, Y)$
  locator: null
