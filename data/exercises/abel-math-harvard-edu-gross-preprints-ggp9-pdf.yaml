    \mathbb{c}) \le 1$. (hint: the pair $(g \times h, \operatorname{diag}(h))$ is a gelfand pair, meaning
    the invariant distribution space on the double coset is 1-dimensional)'
- id: abel-math-harvard-edu-gross-preprints-ggp9-pdf#005
  text: '(The Local Langlands Correspondence) Let $W_F''$ be the Weil–Deligne group of $F$. State the
    Local Langlands Correspondence mapping an irreducible admissible representation $\pi$ of $G(F)$ to
    an $L$-parameter $\phi: W_F'' \to {}^L G$. (Hint: ${}^L G = G^\vee(\mathbb{C}) \rtimes W_F$ is the
    Langlands dual group, where $\mathrm{SO}(2n+1)^\vee \cong \operatorname{Sp}_{2n}(\mathbb{C})$ and
    $\mathrm{SO}(2n)^\vee \cong \mathrm{SO}_{2n}(\mathbb{C})$)'
  hint: null
  locator: null
  sub_index: null
  search_text: '(the local langlands correspondence) let $w_f''$ be the weil–deligne group of $f$. state
    the local langlands correspondence mapping an irreducible admissible representation $\pi$ of $g(f)$
    to an $l$-parameter $\phi: w_f'' \to {}^l g$. (hint: ${}^l g = g^\vee(\mathbb{c}) \rtimes w_f$ is
    the langlands dual group, where $\mathrm{so}(2n+1)^\vee \cong \operatorname{sp}_{2n}(\mathbb{c})$
    and $\mathrm{so}(2n)^\vee \cong \mathrm{so}_{2n}(\mathbb{c})$)'
- id: abel-math-harvard-edu-gross-preprints-ggp9-pdf#006
  text: '(Local L-Packets) Define a local $L$-packet $\Pi_\phi(G)$ as the finite set of irreducible representations
    of $G(F)$ sharing the same $L$-parameter $\phi$. (Hint: For quasi-split groups, $L$-packets are partitioned
    into distinct representations parameterized by the characters of the component group of the centralizer
    of $\phi$)'
  hint: null
