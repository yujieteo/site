  text: '(The Global GGP Conjecture: Period Integrals) Let $F$ be a global number field with adèle ring
    $\mathbb{A}_F$. For automorphic cusp forms $\varphi \in \pi$ on $G(\mathbb{A}_F)$ and $\phi \in \sigma$
    on $H(\mathbb{A}_F)$, define the global period integral: $$\mathcal{P}(\varphi, \phi) = \int_{H(F)
    \backslash H(\mathbb{A}_F)} \varphi(h) \phi(h) \, dh.$$ (Hint: The non-vanishing of $\mathcal{P}(\varphi,
    \phi)$ measures the non-triviality of the global branching law $\pi|_{H(\mathbb{A}_F)}$)'
  hint: null
  locator: null
  sub_index: null
  search_text: '(the global ggp conjecture: period integrals) let $f$ be a global number field with adèle
    ring $\mathbb{a}_f$. for automorphic cusp forms $\varphi \in \pi$ on $g(\mathbb{a}_f)$ and $\phi \in
    \sigma$ on $h(\mathbb{a}_f)$, define the global period integral: $$\mathcal{p}(\varphi, \phi) = \int_{h(f)
    \backslash h(\mathbb{a}_f)} \varphi(h) \phi(h) \, dh.$$ (hint: the non-vanishing of $\mathcal{p}(\varphi,
