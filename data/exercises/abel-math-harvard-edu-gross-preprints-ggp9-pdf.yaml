- id: abel-math-harvard-edu-gross-preprints-ggp9-pdf#000
  text: '(Orthogonal and Unitary Groups) Let $F$ be a local field of characteristic 0. Define the classical
    groups $G = \mathrm{SO}(V)$ for a quadratic space $V$ over $F$, and $G = \mathrm{U}(V)$ for a Hermitian
    space $V$ over a quadratic extension $E/F$. (Hint: Quadratic forms are symmetric bilinear pairings;
    Hermitian forms satisfy $\langle x, y \rangle = \tau(\langle y, x \rangle)$ for the non-trivial automorphism
    $\tau \in \operatorname{Gal}(E/F)$)'
  hint: null
  locator: null
  sub_index: null
  search_text: '(orthogonal and unitary groups) let $f$ be a local field of characteristic 0. define the
    classical groups $g = \mathrm{so}(v)$ for a quadratic space $v$ over $f$, and $g = \mathrm{u}(v)$
    for a hermitian space $v$ over a quadratic extension $e/f$. (hint: quadratic forms are symmetric bilinear
    pairings; hermitian forms satisfy $\langle x, y \rangle = \tau(\langle y, x \rangle)$ for the non-trivial
    automorphism $\tau \in \operatorname{gal}(e/f)$)'
- id: abel-math-harvard-edu-gross-preprints-ggp9-pdf#001
  text: '(Subgroups and Codimension 1 Pairs) Let $W \subset V$ be a non-degenerate subspace of codimension
    1. Define the subgroup embedding $H \subset G$, where $H = \mathrm{SO}(W)$ into $G = \mathrm{SO}(V)$,
    or $H = \mathrm{U}(W)$ into $G = \mathrm{U}(V)$. (Hint: $H$ is the stabilizer in $G$ of a non-zero
    orthogonal vector $v_0 \in W^\perp$)'
  hint: null
  locator: null
  sub_index: null
  search_text: '(subgroups and codimension 1 pairs) let $w \subset v$ be a non-degenerate subspace of
    codimension 1. define the subgroup embedding $h \subset g$, where $h = \mathrm{so}(w)$ into $g = \mathrm{so}(v)$,
    or $h = \mathrm{u}(w)$ into $g = \mathrm{u}(v)$. (hint: $h$ is the stabilizer in $g$ of a non-zero
    orthogonal vector $v_0 \in w^\perp$)'
- id: abel-math-harvard-edu-gross-preprints-ggp9-pdf#002
  text: '(Bessel and Fourier-Jacobi Models) Distinguish the two geometric settings of the Gan–Gross–Prasad
    conjectures: the Bessel case (codimension 1 embeddings $H \hookrightarrow G$) and the Fourier–Jacobi
    case (symplectic and metaplectic groups $\mathrm{Sp}(W) \hookrightarrow \mathrm{Sp}(V)$). (Hint: The
    Bessel case concerns spherical pairs with trivial unipotent radicals, while Fourier–Jacobi pairs involve
    Heisenberg unipotent radicals)'
  hint: null
  locator: null
  sub_index: null
  search_text: '(bessel and fourier-jacobi models) distinguish the two geometric settings of the gan–gross–prasad
    conjectures: the bessel case (codimension 1 embeddings $h \hookrightarrow g$) and the fourier–jacobi
    case (symplectic and metaplectic groups $\mathrm{sp}(w) \hookrightarrow \mathrm{sp}(v)$). (hint: the
    bessel case concerns spherical pairs with trivial unipotent radicals, while fourier–jacobi pairs involve
    heisenberg unipotent radicals)'
- id: abel-math-harvard-edu-gross-preprints-ggp9-pdf#003
  text: '(The Hom Space of Intertwiners) Let $\pi$ be an irreducible admissible representation of $G(F)$
    and $\sigma$ an irreducible admissible representation of $H(F)$. Define the branching space $\operatorname{Hom}_{H(F)}(\pi
    \otimes \sigma, \mathbb{C})$. (Hint: Elements are continuous linear functionals $\ell: \pi \otimes
    \sigma \to \mathbb{C}$ satisfying $\ell(\pi(h)v \otimes \sigma(h)w) = \ell(v \otimes w)$ for all $h
    \in H(F)$)'
  hint: null
  locator: null
  sub_index: null
  search_text: '(the hom space of intertwiners) let $\pi$ be an irreducible admissible representation
    of $g(f)$ and $\sigma$ an irreducible admissible representation of $h(f)$. define the branching space
    $\operatorname{hom}_{h(f)}(\pi \otimes \sigma, \mathbb{c})$. (hint: elements are continuous linear
    functionals $\ell: \pi \otimes \sigma \to \mathbb{c}$ satisfying $\ell(\pi(h)v \otimes \sigma(h)w)
    = \ell(v \otimes w)$ for all $h \in h(f)$)'
- id: abel-math-harvard-edu-gross-preprints-ggp9-pdf#004
  text: '(Multiplicity One Theorems) State the local multiplicity one theorem (proved by Aizenbud–Gourevitch–Rallis–Schiffmann
    and Waldspurger) for orthogonal and unitary groups: $\dim \operatorname{Hom}_{H(F)}(\pi \otimes \sigma,
    \mathbb{C}) \le 1$. (Hint: The pair $(G \times H, \operatorname{diag}(H))$ is a Gelfand pair, meaning
    the invariant distribution space on the double coset is 1-dimensional)'
  hint: null
  locator: null
