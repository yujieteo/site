  text: '(Gross-Zagier Formula as the Arithmetic GGP) Explain how the arithmetic Gan–Gross–Prasad conjecture
    generalizes the Gross–Zagier theorem on heights of Heegner points: when $L(1/2, \pi \otimes \sigma)
    = 0$, the first derivative $L''(1/2, \pi \otimes \sigma)$ is proportional to the Néron–Tate height
    of an arithmetic cycle on a Shimura variety. (Hint: The classical period integral is replaced by the
    arithmetic intersection pairing of special cycles on unitary/orthogonal Shimura varieties)'
