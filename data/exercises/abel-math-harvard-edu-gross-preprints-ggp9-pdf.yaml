- id: abel-math-harvard-edu-gross-preprints-ggp9-pdf#010
  text: '(The Local GGP Conjecture Formulation) Let $\phi$ and $\psi$ be generic $L$-parameters for $G$
    and $H$, respectively. State the local Gan–Gross–Prasad conjecture: $$\sum_{\pi \in \Pi_\phi, \, \sigma
    \in \Pi_\psi} \dim \operatorname{Hom}_{H(F)}(\pi \otimes \sigma, \mathbb{C}) = 1.$$ (Hint: There is
    a unique representation $\pi \in \Pi_\phi$ and a unique representation $\sigma \in \Pi_\psi$ on a
    unique pair of inner forms $(G'', H'')$ such that $\operatorname{Hom}_{H''(F)}(\pi \otimes \sigma,
    \mathbb{C})$ is exactly 1-dimensional)'
