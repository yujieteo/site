  text: '(Waldspurger''s Theorem as GGP for SO(3) x SO(2)) Show that when $G = \mathrm{SO}(3) \cong \mathrm{PGL}_2$
    and $H = \mathrm{SO}(2)$ (a torus $T$ associated with a quadratic extension), the GGP conjecture reduces
    to Waldspurger''s classical formula for toric periods and central $L$-values $L(1/2, \pi \otimes \chi)$.
    (Hint: The local packet of $\mathrm{SO}(3)$ consists of representations of $\mathrm{PGL}_2(F)$ and
    its inner form $D^\times / F^\times$ for a quaternion division algebra $D$)'
