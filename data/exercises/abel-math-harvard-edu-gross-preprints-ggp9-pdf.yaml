- id: abel-math-harvard-edu-gross-preprints-ggp9-pdf#014
  text: '(The Central L-Value Formula: Global GGP) State the global Gan–Gross–Prasad conjecture relating
    the period integral $\mathcal{P}(\varphi, \phi)$ to the central value of the automorphic tensor product
    $L$-function: $$\frac{|\mathcal{P}(\varphi, \phi)|^2}{\langle \varphi, \varphi \rangle \langle \phi,
    \phi \rangle} = C \cdot \frac{L(1/2, \pi \otimes \sigma)}{L(1, \pi, \operatorname{Ad}) L(1, \sigma,
    \operatorname{Ad})}.$$ (Hint: The global period is non-zero on the cuspidal packet if and only if
    $L(1/2, \pi \otimes \sigma) \ne 0$ and the local conditions are satisfied at all places $v$)'
  hint: null
