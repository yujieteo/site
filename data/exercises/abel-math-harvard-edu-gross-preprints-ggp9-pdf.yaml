- id: abel-math-harvard-edu-gross-preprints-ggp9-pdf#009
  text: '(Character Parameterization of Representations in a Packet) For a generic $L$-packet $\Pi_\phi$,
    state the bijection $\Pi_\phi \longleftrightarrow \widehat{S}_\phi$ between representations $\pi \in
    \Pi_\phi$ and irreducible characters $\eta \in \widehat{S}_\phi = \operatorname{Hom}(S_\phi, \{\pm
    1\})$. (Hint: The trivial character corresponds to the unique generic/unramified representation in
    the packet associated with a fixed Whittaker datum)'
  hint: null
