  sub_index: null
  search_text: '(local l-packets) define a local $l$-packet $\pi_\phi(g)$ as the finite set of irreducible
    representations of $g(f)$ sharing the same $l$-parameter $\phi$. (hint: for quasi-split groups, $l$-packets
    are partitioned into distinct representations parameterized by the characters of the component group
    of the centralizer of $\phi$)'
- id: abel-math-harvard-edu-gross-preprints-ggp9-pdf#007
  text: '(The Component Group S_\phi) Let $\phi: W_F'' \to {}^L G$ be an $L$-parameter. Define the centralizer
    group $C_\phi = \operatorname{Cent}( \operatorname{im}(\phi), G^\vee )$ and its finite component group
    $S_\phi = C_\phi / C_\phi^\circ Z(G^\vee)$. (Hint: For orthogonal and unitary groups, $S_\phi$ is
    an elementary abelian 2-group $(\mathbb{Z}/2\mathbb{Z})^k$)'
  hint: null
  locator: null
  sub_index: null
  search_text: '(the component group s_\phi) let $\phi: w_f'' \to {}^l g$ be an $l$-parameter. define
    the centralizer group $c_\phi = \operatorname{cent}( \operatorname{im}(\phi), g^\vee )$ and its finite
    component group $s_\phi = c_\phi / c_\phi^\circ z(g^\vee)$. (hint: for orthogonal and unitary groups,
    $s_\phi$ is an elementary abelian 2-group $(\mathbb{z}/2\mathbb{z})^k$)'
- id: abel-math-harvard-edu-gross-preprints-ggp9-pdf#008
  text: '(Vogan Packets and Pure Inner Forms) Explain why the Gan–Gross–Prasad conjectures require working
    with Vogan packets across all pure inner forms of $G$ and $H$. (Hint: A Vogan packet is the disjoint
    union $\Pi_\phi = \bigsqcup_{G''} \Pi_\phi(G'')$ over all pure inner forms $G''$ of $G$; working with
    Vogan packets guarantees that the branching space is non-zero for a unique pair in the packet)'
  hint: null
