- id: dec41-user-srcf-net-h-iii-l-symplectic-geometry-full#010
  text: What is the Lagrangian neighborhood theorem?
  hint: A tubular neighborhood of a Lagrangian submanifold $L \subset M$ is symplectomorphic to a neighborhood
    of the zero section in $T^*L$.
