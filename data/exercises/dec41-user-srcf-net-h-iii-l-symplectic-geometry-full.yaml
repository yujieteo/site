- id: dec41-user-srcf-net-h-iii-l-symplectic-geometry-full#013
  text: What is the Newlander-Nirenberg theorem?
  hint: An almost complex structure $J$ is integrable (induced by complex charts) if and only if its Nijenhuis
    tensor $N_J$ vanishes identically.
