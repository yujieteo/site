- id: dec41-user-srcf-net-h-iii-l-symplectic-geometry-full#004
  text: Why is the volume of a compact symplectic manifold non-zero in de Rham cohomology?
  hint: $\omega^n$ is a non-vanishing volume form, so $\int_M \omega^n > 0$, implying $[\omega] \ne 0
    \in H_{\mathrm{dR}}^2(M)$.
