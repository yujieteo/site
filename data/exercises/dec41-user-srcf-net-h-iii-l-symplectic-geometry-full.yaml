- id: dec41-user-srcf-net-h-iii-l-symplectic-geometry-full#005
  text: What is a symplectomorphism?
  hint: 'A diffeomorphism $f: M \to M$ preserving the symplectic form: $f^* \omega = \omega$.'
  locator: null
  sub_index: null
