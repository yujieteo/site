- id: dec41-user-srcf-net-h-iii-l-symplectic-geometry-full#006
  text: What is Moser's stability theorem?
  hint: If $\omega_t$ is a smooth family of symplectic forms on a compact manifold with constant cohomology
    class $[\omega_t]$, then there exists a family of diffeomorphisms $\psi_t$ such that $\psi_t^* \omega_t
    = \omega_0$.
