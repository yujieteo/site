- id: dec41-user-srcf-net-h-iii-l-symplectic-geometry-full#000
  text: What is a symplectic vector space?
  hint: 'A real vector space $V$ equipped with a non-degenerate, skew-symmetric bilinear form $\Omega:
    V \times V \to \mathbb{R}$.'
  locator: null
  sub_index: null
  search_text: 'what is a symplectic vector space? a real vector space $v$ equipped with a non-degenerate,
    skew-symmetric bilinear form $\omega: v \times v \to \mathbb{r}$.'
- id: dec41-user-srcf-net-h-iii-l-symplectic-geometry-full#001
  text: What is the standard form theorem for symplectic vector spaces?
  hint: Every finite-dimensional symplectic vector space has even dimension $2n$ and admits a symplectic
    basis where $\Omega = \sum e_i^* \wedge f_i^*$.
  locator: null
  sub_index: null
  search_text: what is the standard form theorem for symplectic vector spaces? every finite-dimensional
    symplectic vector space has even dimension $2n$ and admits a symplectic basis where $\omega = \sum
    e_i^* \wedge f_i^*$.
- id: dec41-user-srcf-net-h-iii-l-symplectic-geometry-full#002
  text: What are isotropic, coisotropic, and Lagrangian subspaces?
  hint: A subspace $W \subseteq V$ is isotropic if $W \subseteq W^\Omega$, coisotropic if $W^\Omega \subseteq
    W$, and Lagrangian if $W = W^\Omega$ ($\dim W = \frac{1}{2} \dim V$).
  locator: null
  sub_index: null
