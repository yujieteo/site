    dx_i \wedge dy_i$.
- id: dec41-user-srcf-net-h-iii-l-symplectic-geometry-full#008
  text: What is the canonical symplectic structure on a cotangent bundle $T^*X$?
  hint: The canonical 1-form $\alpha = \sum p_i dq_i$ gives the symplectic form $\omega = -d\alpha = \sum
    dq_i \wedge dp_i$.
