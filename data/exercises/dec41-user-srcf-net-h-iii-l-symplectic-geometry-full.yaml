- id: dec41-user-srcf-net-h-iii-l-symplectic-geometry-full#009
  text: What is a Lagrangian submanifold?
  hint: 'An $n$-dimensional submanifold $L \subset M^{2n}$ such that the pullback of the symplectic form
    vanishes: $\iota^* \omega = 0$.'
  locator: null
