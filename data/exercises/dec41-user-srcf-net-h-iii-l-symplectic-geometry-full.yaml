- id: dec41-user-srcf-net-h-iii-l-symplectic-geometry-full#007
  text: What is Darboux's theorem?
  hint: Every symplectic manifold is locally symplectomorphic to standard $\mathbb{R}^{2n}$ with coordinates
    $(x_1, \dots, x_n, y_1, \dots, y_n)$ where $\omega = \sum_{i=1}^n dx_i \wedge dy_i$.
  locator: null
