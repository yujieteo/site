- id: dec41-user-srcf-net-h-iii-l-symplectic-geometry-full#015
  text: What is the Hodge decomposition on a compact Kähler manifold?
  hint: Decomposes de Rham cohomology into Dolbeault cohomology groups $H^k(M, \mathbb{C}) \cong \bigoplus_{p+q=k}
    H^{p,q}(M)$ with Hodge symmetry $H^{p,q} \cong \overline{H^{q,p}}$.
  locator: null
