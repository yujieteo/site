    isotropic if $w \subseteq w^\omega$, coisotropic if $w^\omega \subseteq w$, and lagrangian if $w =
    w^\omega$ ($\dim w = \frac{1}{2} \dim v$).
- id: dec41-user-srcf-net-h-iii-l-symplectic-geometry-full#003
  text: What is a symplectic manifold?
  hint: A smooth $2n$-dimensional manifold $M$ equipped with a closed, non-degenerate differential 2-form
    $\omega$ ($d\omega = 0$, $\omega^n \ne 0$).
  locator: null
  sub_index: null
  search_text: what is a symplectic manifold? a smooth $2n$-dimensional manifold $m$ equipped with a closed,
