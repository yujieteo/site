- id: dec41-user-srcf-net-h-iii-l-symplectic-geometry-full#011
  text: What is an almost complex structure $J$?
  hint: 'A smooth bundle endomorphism $J: TM \to TM$ satisfying $J^2 = -\operatorname{id}$.'
  locator: null
  sub_index: null
  search_text: 'what is an almost complex structure $j$? a smooth bundle endomorphism $j: tm \to tm$ satisfying
    $j^2 = -\operatorname{id}$.'
- id: dec41-user-srcf-net-h-iii-l-symplectic-geometry-full#012
  text: When is an almost complex structure compatible with a symplectic form?
  hint: When $g(u, v) = \omega(u, Jv)$ defines a Riemannian metric and $\omega(Ju, Jv) = \omega(u, v)$.
  locator: null
  sub_index: null
  search_text: when is an almost complex structure compatible with a symplectic form? when $g(u, v) =
