- id: www-math-stonybrook-edu-mmovshev-mat570spring2008-books-atiyahbott-moment-pdf#006
  text: '(Algebraic Mechanism of Localization: Inverting Primes in H*(BG)) Detail the commutative algebra
    underpinning the localization theorem in the case of a circle group $G = S^1$. '
  hint: The coefficient ring is $H^*(BS^1; \mathbb{Q}) \cong \mathbb{Q}[u]$ (a PID). Every finitely generated
    module over $\mathbb{Q}[u]$ decomposes into a free part and a torsion part; localizing by inverting
    the polynomial generator $u$ kills all $\mathbb{Q}[u]$-torsion supported outside the fixed-point set
    $M^{S^1}$, establishing an isomorphism $H_{S^1}^*(M) \otimes_{\mathbb{Q}[u]} \mathbb{Q}[u, u^{-1}]
    \cong H^*(M^{S^1}) \otimes \mathbb{Q}[u, u^{-1}]$
  locator: null
  sub_index: null
  search_text: '(algebraic mechanism of localization: inverting primes in h*(bg)) detail the commutative
    algebra underpinning the localization theorem in the case of a circle group $g = s^1$.  the coefficient
    ring is $h^*(bs^1; \mathbb{q}) \cong \mathbb{q}[u]$ (a pid). every finitely generated module over
    $\mathbb{q}[u]$ decomposes into a free part and a torsion part; localizing by inverting the polynomial
    generator $u$ kills all $\mathbb{q}[u]$-torsion supported outside the fixed-point set $m^{s^1}$, establishing
