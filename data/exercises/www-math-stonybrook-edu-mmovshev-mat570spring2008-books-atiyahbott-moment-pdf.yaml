- id: www-math-stonybrook-edu-mmovshev-mat570spring2008-books-atiyahbott-moment-pdf#000
  text: '(The Borel Construction and Equivariant Cohomology) Define the equivariant cohomology $H_G^*(M)$
    of a $G$-space $M$ using the Borel homotopy quotient construction. '
  hint: Form the mixed space $M_G = EG \times_G M = (EG \times M)/G$, where $G$ acts freely on the right
    of the contractible universal space $EG$ and on the left of $M$. Define $H_G^*(M) := H^*(M_G)$ as
    the ordinary cohomology of the fiber bundle $M_G \to BG$ with fiber $M$ over the classifying space
    $BG$
  locator: null
  sub_index: null
  search_text: (the borel construction and equivariant cohomology) define the equivariant cohomology $h_g^*(m)$
    of a $g$-space $m$ using the borel homotopy quotient construction.  form the mixed space $m_g = eg
    \times_g m = (eg \times m)/g$, where $g$ acts freely on the right of the contractible universal space
    $eg$ and on the left of $m$. define $h_g^*(m) := h^*(m_g)$ as the ordinary cohomology of the fiber
    bundle $m_g \to bg$ with fiber $m$ over the classifying space $bg$
- id: www-math-stonybrook-edu-mmovshev-mat570spring2008-books-atiyahbott-moment-pdf#001
  text: '(Equivariant Coefficient Rings) What is the coefficient ring of equivariant cohomology when $M
    = \{*\}$ is a single point, and how does this enlarge the coefficient structure for general $G$-spaces? '
  hint: $H_G^*(\{*\}) \cong H^*(BG)$; for a compact Lie group $G$ with maximal torus $T$ and Weyl group
    $W$, show that $H_G^*(\{*\} ; \mathbb{R}) \cong S(\mathfrak{t}^*)^W$ is the polynomial ring of $W$-invariant
    polynomials on the Lie algebra $\mathfrak{g}$, turning $H_G^*(M)$ into a module over $H^*(BG)$
  locator: null
  sub_index: null
