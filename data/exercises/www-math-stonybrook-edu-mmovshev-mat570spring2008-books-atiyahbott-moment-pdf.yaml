- id: www-math-stonybrook-edu-mmovshev-mat570spring2008-books-atiyahbott-moment-pdf#004
  text: '(The Atiyah-Bott / Berline-Vergne Localization Formula) State and prove the Atiyah–Bott localization
    theorem in equivariant de Rham cohomology for an equivariantly closed form $\alpha \in \Omega_G^*(M)$
    on a compact oriented manifold $M$. '
  hint: 'For isolated fixed points $p \in M^G$, the integral over $M$ localizes completely to the fixed-point
    set: $\int_M \alpha(X) = \sum_{p \in M^G} \frac{\alpha(X)(p)}{\det\left(\frac{1}{2\pi} L_p(X)\right)}$,
    where $L_p(X) \in \mathfrak{so}(T_p M)$ is the infinitesimal rotation induced by $X \in \mathfrak{g}$
    on the tangent space'
  locator: null
  sub_index: null
  search_text: '(the atiyah-bott / berline-vergne localization formula) state and prove the atiyah–bott
    localization theorem in equivariant de rham cohomology for an equivariantly closed form $\alpha \in
    \omega_g^*(m)$ on a compact oriented manifold $m$.  for isolated fixed points $p \in m^g$, the integral
    over $m$ localizes completely to the fixed-point set: $\int_m \alpha(x) = \sum_{p \in m^g} \frac{\alpha(x)(p)}{\det\left(\frac{1}{2\pi}
    l_p(x)\right)}$, where $l_p(x) \in \mathfrak{so}(t_p m)$ is the infinitesimal rotation induced by
    $x \in \mathfrak{g}$ on the tangent space'
- id: www-math-stonybrook-edu-mmovshev-mat570spring2008-books-atiyahbott-moment-pdf#005
  text: '(Duistermaat-Heckman Theorem and Exact Stationary Phase) Explain how the localization formula
    proves the Duistermaat–Heckman theorem, establishing that the stationary phase approximation for oscillatory
    Hamiltonian path integrals is exact. '
  hint: For an $S^1$-action on a symplectic manifold $(M, \omega)$ with moment map $H$, the Fourier transform
    of the Liouville pushforward measure $\int_M e^{i t H} \frac{\omega^n}{n!}$ is evaluated exactly by
    the localized sum over the critical points of $H$, which are the fixed points of the circle action
  locator: null
