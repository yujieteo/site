- id: www-math-stonybrook-edu-mmovshev-mat570spring2008-books-atiyahbott-moment-pdf#002
  text: '(The Cartan Model and Equivariant de Rham Complex) Formulate the de Rham model of equivariant
    cohomology for a smooth $G$-manifold $M$ with compact Lie group $G$. '
  hint: 'Define the space of equivariant differential forms $\Omega_G^*(M) = (S(\mathfrak{g}^*) \otimes
    \Omega^*(M))^G$ as polynomial maps $\alpha: \mathfrak{g} \to \Omega^*(M)$ invariant under the diagonal
    adjoint/$G$-action. Define the Cartan differential $d_G \alpha(X) = d(\alpha(X)) - \iota_{X_M}(\alpha(X))$
    for $X \in \mathfrak{g}$, and prove that $d_G^2 = 0$ on invariant forms'
  locator: null
  sub_index: null
  search_text: '(the cartan model and equivariant de rham complex) formulate the de rham model of equivariant
    cohomology for a smooth $g$-manifold $m$ with compact lie group $g$.  define the space of equivariant
    differential forms $\omega_g^*(m) = (s(\mathfrak{g}^*) \otimes \omega^*(m))^g$ as polynomial maps
    $\alpha: \mathfrak{g} \to \omega^*(m)$ invariant under the diagonal adjoint/$g$-action. define the
    cartan differential $d_g \alpha(x) = d(\alpha(x)) - \iota_{x_m}(\alpha(x))$ for $x \in \mathfrak{g}$,
    and prove that $d_g^2 = 0$ on invariant forms'
- id: www-math-stonybrook-edu-mmovshev-mat570spring2008-books-atiyahbott-moment-pdf#003
  text: '(Equivariantly Closed Forms and the Moment Map) Let $(M, \omega)$ be a symplectic manifold equipped
    with a Hamiltonian action of a compact Lie group $G$ with equivariant moment map $\mu: M \to \mathfrak{g}^*$.
    Show that the modified symplectic 2-form $\widetilde{\omega}(X) = \omega + \langle \mu, X \rangle$
    is an equivariantly closed form in the Cartan model. '
  hint: Compute $d_G \widetilde{\omega}(X) = (d - \iota_{X_M})(\omega + \langle \mu, X \rangle) = d\omega
    - \iota_{X_M}\omega + d\langle \mu, X \rangle$; verify that this vanishes identically using $d\omega
    = 0$ and Hamilton's equation $d\langle \mu, X \rangle = \iota_{X_M}\omega$
  locator: null
  sub_index: null
