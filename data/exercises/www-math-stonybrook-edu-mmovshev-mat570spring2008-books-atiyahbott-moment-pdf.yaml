- id: www-math-stonybrook-edu-mmovshev-mat570spring2008-books-atiyahbott-moment-pdf#008
  text: '(Moduli Spaces of Bundles and the Narasimhan-Seshadri Theorem) How does the Atiyah–Bott framework
    link infinite-dimensional equivariant localization to Donaldson''s proof of the Narasimhan–Seshadri
    theorem on Riemann surfaces? '
  hint: Consider the infinite-dimensional affine space of unitary connections $\mathcal{A}$ on a principal
    bundle over a Riemann surface $\Sigma$, acted on by the gauge group $\mathcal{G}$. The curvature $F_A$
    acts as the moment map for the gauge action, and the symplectic reduction $\mathcal{A} /\!\!/ \mathcal{G}
    = \mu^{-1}(0)/\mathcal{G}$ yields the moduli space of flat/stable holomorphic vector bundles
  locator: null
