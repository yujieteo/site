    \mathbb{q}[u, u^{-1}]$'
- id: www-math-stonybrook-edu-mmovshev-mat570spring2008-books-atiyahbott-moment-pdf#007
  text: '(Moment Maps, Morse Theory, and Norm-Square Functional) Let $\mu: M \to \mathfrak{g}^*$ be an
    equivariant moment map. How did Atiyah and Bott utilize the norm-square functional $f = \|\mu\|^2:
    M \to \mathbb{R}$ to compute the topology of moduli spaces? '
  hint: $f$ is a $G$-invariant, minimally degenerate Morse–Bott function whose critical points correspond
    to the stratification of $M$ into unstable and semistable loci in Geometric Invariant Theory; this
    provides equivariant Morse inequalities that compute the Betti numbers of the symplectic quotient
    $M /\!\!/ G = \mu^{-1}(0)/G$
  locator: null
  sub_index: null
  search_text: '(moment maps, morse theory, and norm-square functional) let $\mu: m \to \mathfrak{g}^*$
