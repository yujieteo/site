  text: What was the original number-theoretic motivation for Kummer's Theorem on $p$-adic carries in
    binomial coefficients, and how does it relate to algebraic topology and formal group laws?
  hint: 'Motivation: analyze irregular primes and class numbers of cyclotomic fields $\mathbb{Q}(\zeta_p)$
