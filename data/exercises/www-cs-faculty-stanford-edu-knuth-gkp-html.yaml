  text: How does one invent the optimal strategy for the Double Tower of Hanoi (with $2n$ disks, two of
    each of $n$ sizes) and compute the move count $A_n$ in your head?
  hint: 'Motivation: understand how duplicate disk sizes change the transfer bottleneck. Invention: transfer
    $2n-2$ disks to an intermediate peg in $A_{n-1}$ moves, move the two largest identical disks to the
    destination peg in 2 moves, and transfer the $2n-2$ disks to the destination in $A_{n-1}$ moves, giving
    $A_n = 2 A_{n-1} + 2$ with $A_0 = 0$. Mental trick: adding 2 gives $A_n + 2 = 2(A_{n-1} + 2) = 2^n(A_0
    + 2) = 2^{n+1}$, so $A_n = 2^{n+1} - 2$, which is exactly twice the standard Hanoi count $2(2^n -
    1)$.'
