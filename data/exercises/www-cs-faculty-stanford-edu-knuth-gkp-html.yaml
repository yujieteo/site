  text: How does one invent the harmonic number recurrence $\sum_{k=1}^n H_k = (n+1)H_n - n$ and evaluate
    it without pen and paper?
  hint: 'Motivation: find the discrete antiderivative of the discrete logarithm $H_x$. Invention: apply
    discrete integration by parts $\sum H_x \delta x = x H_x - \sum (x+1)\Delta H_x \delta x = x H_x -
    \sum (x+1)\frac{1}{x+1}\delta x = x H_x - x$. Mental trick: treat $H_n$ like $\ln x$, whose continuous
    integral is $x \ln x - x$, and shift the coefficient $x$ to $n+1$.'
