- id: www-cs-faculty-stanford-edu-knuth-gkp-html#008
  text: What was the original physical and mathematical motivation for Bernoulli numbers, and how do they
    connect arithmetic topology to the Riemann zeta function and exotic spheres?
  hint: 'Motivation: find an exact formula for the sum of $m$-th powers of integers (Faulhaber''s problem).
    Relation to other math: Bernoulli numbers provide the values of the Riemann zeta function at even
    integers $\zeta(2k) = (-1)^{k-1} \frac{(2\pi)^{2k} B_{2k}}{2(2k)!}$, compute the Todd classes of algebraic
    varieties, and determine the number of distinct smooth differential structures (Milnor''s exotic spheres)
    on the sphere $S^{4k-1}$.'
