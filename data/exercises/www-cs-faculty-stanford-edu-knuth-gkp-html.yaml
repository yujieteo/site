  text: How does one invent the asymptotic approximation of $n!$ via Stirling's formula and calculate
    $\ln(10!)$ in your head?
  hint: 'Motivation: approximate factorials without multiplying long sequences. Invention: approximate
    $\sum_{k=1}^n \ln k$ by $\int_1^n \ln x dx = n \ln n - n + 1$, and add the trapezoidal boundary correction
    $\frac{1}{2}\ln n$ plus the constant $\frac{1}{2}\ln(2\pi)$ via Euler-Maclaurin, giving $n! \approx
    \sqrt{2\pi n}(n/e)^n$. Mental trick: $\ln(n!) \approx n \ln n - n + \frac{1}{2}\ln(2\pi n)$; for $n=10$,
    $10 \ln 10 - 10 \approx 23.03 - 10 = 13.03$, plus $\frac{1}{2}\ln(62.8) \approx 2.07$, giving $\ln(10!)
    \approx 15.10$.'
