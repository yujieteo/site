  text: How does one invent the binary shift rule for the Josephus problem $J(2^m + l) = 2l + 1$ and compute
    it in your head?
  hint: 'Motivation: find an explicit non-recursive formula for cyclic elimination. Invention: notice
    that one full pass through an even circle $2n$ eliminates all even seats and relabels seat $k$ to
