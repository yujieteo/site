  text: How does one invent Penney's game winning probabilities between two coin-toss patterns using Conway's
    algorithm?
  hint: 'Motivation: determine why the game of matching binary strings in coin tosses is non-transitive
    (like rock-paper-scissors). Invention: for strings $A$ and $B$, define the binary overlap $(A B)_2
    = \sum_{k=1}^m [A \text{ suffix of length } k = B \text{ prefix of length } k] 2^{k-1}$; the odds
    of $A$ appearing before $B$ is $\frac{P(A \text{ wins})}{P(B \text{ wins})} = \frac{(B B)_2 - (B A)_2}{(A
    A)_2 - (A B)_2}$.'
