  text: What is the geometric motivation behind Eulerian numbers, and how do they compute the volume of
    hypersimplices and the cohomology of toric varieties?
  hint: 'Motivation: refine permutation counting by tracking sorting ascents and descents. Relation to
    other math: the Eulerian number $\left\langle \begin{matrix} n \\ k \end{matrix} \right\rangle$ computes
    the normalized volume of the slice of the hypercube $\Delta(k, n) = \{x \in [0, 1]^n \mid k-1 \le
    \sum x_i \le k\}$ (hypersimplex) and gives the Betti numbers of the permutohedral toric variety.'
