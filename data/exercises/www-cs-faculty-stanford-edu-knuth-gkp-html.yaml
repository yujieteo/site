  text: How does one invent the convolution of two sequences using Ordinary Generating Functions (OGFs)
    and compute the sum of products of ones $\sum_{k=0}^n 1 \cdot 1$?
  hint: 'Motivation: turn discrete Cauchy convolution $c_n = \sum_{k=0}^n a_k b_{n-k}$ into standard polynomial
    multiplication. Invention: if $A(z) = \sum a_n z^n$ and $B(z) = \sum b_n z^n$, their product $A(z)B(z)
    = \sum c_n z^n$ automatically groups indices summing to $n$; for $a_n = b_n = 1$, $A(z) = B(z) = \frac{1}{1-z}$,
    so $A(z)B(z) = \frac{1}{(1-z)^2} = \sum (n+1)z^n$, proving the sum is $n+1$.'
