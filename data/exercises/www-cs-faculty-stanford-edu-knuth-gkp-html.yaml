  text: What is the motivation behind the Saddle Point Method in asymptotic combinatorics, and how does
    it relate to the stationary phase approximation in semi-classical quantum mechanics?
  hint: 'Motivation: evaluate Cauchy contour integrals $\frac{1}{2\pi i} \oint e^{n \phi(z)} dz$ when
    generating functions have no simple algebraic branch cuts (such as $e^z$ or $e^{e^z}$). Relation to
    other math: it is the complex-analytic counterpart to the principle of stationary phase in wave optics
    and the WKB approximation in quantum mechanics, localizing the integral around the classical trajectory
    $\phi''(z_0) = 0$.'
