  text: How does one invent the Cassini identity $F_{n+1} F_{n-1} - F_n^2 = (-1)^n$ and use it to test
    Fibonacci numbers?
  hint: 'Motivation: find an invariant quadratic relation for consecutive Fibonacci terms. Invention:
    express the Fibonacci step as a $2 \times 2$ matrix $M = \left(\begin{smallmatrix} 1 & 1 \\ 1 & 0
    \end{smallmatrix}\right)$; since $\det(M) = -1$, taking determinants of $M^n = \left(\begin{smallmatrix}
    F_{n+1} & F_n \\ F_n & F_{n-1} \end{smallmatrix}\right)$ instantly yields $\det(M^n) = F_{n+1}F_{n-1}
    - F_n^2 = (\det M)^n = (-1)^n$. Mental trick: check if the product of neighbors differs from the square
    by $\pm 1$.'
