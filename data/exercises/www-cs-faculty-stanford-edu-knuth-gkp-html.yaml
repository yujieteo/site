- id: www-cs-faculty-stanford-edu-knuth-gkp-html#003
  text: What is the arithmetic motivation behind Beatty's Theorem on complementary spectra, and how does
    it govern Hamiltonian dynamical systems and quasicrystals?
  hint: 'Motivation: partition the positive integers $\mathbb{Z}_{\ge 1}$ using irrational rotations without
    gaps or overlaps. Relation to other math: it models the sequence of cuts in physical quasicrystals
    (Penrose tilings) and the symbolic dynamics of Sturmian words / rotation orbits on the circle $\mathbb{R}/\mathbb{Z}$
    in ergodic theory.'
