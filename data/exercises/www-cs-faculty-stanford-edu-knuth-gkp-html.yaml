- id: www-cs-faculty-stanford-edu-knuth-gkp-html#009
  text: What is the combinatorial motivation behind the Exponential Formula $G(z) = \exp(F(z))$, and how
    does it relate to Feynman path integrals and quantum statistical mechanics?
  hint: 'Motivation: reconstruct the count of all composite labeled structures from the count of their
    connected components. Relation to other math: it is the combinatorial origin of the linked-cluster
    theorem in statistical physics and the identity $\ln Z = W$ relating the partition function $Z$ (all
    diagrams) to the free energy $W$ (connected Feynman diagrams) in Quantum Field Theory.'
