  text: How does one invent the general Josephus recurrence for eliminating every $q$-th person $J_q(n)$
    and compute small cases quickly?
  hint: 'Motivation: generalize the step size $q=2$ to arbitrary elimination steps. Invention: after the
    first person at position $q$ is eliminated, the circle shrinks to size $n-1$ and the numbering shifts
    by $q$, yielding the 1-based modular recurrence $J_q(n) = (J_q(n-1) + q - 1) \bmod n + 1$ with $J_q(1)
    = 1$. Mental trick: iterate forward from $J_q(1) = 1$ adding $q$ modulo the current circle size $k
    = 2, 3, \dots, n$.'
