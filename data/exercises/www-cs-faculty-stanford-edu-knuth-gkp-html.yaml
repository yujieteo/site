  text: How does one invent the method of finite differences to sum polynomials and compute $\sum_{k=1}^n
    k^3$ in your head?
  hint: 'Motivation: eliminate polynomial expansion when summing powers. Invention: convert ordinary powers
    into falling factorial powers $k^3 = k^{\underline{3}} + 3k^{\underline{2}} + k^{\underline{1}}$ using
    Stirling numbers of the second kind; discrete integration gives $\sum x^3 \delta x = \frac{x^{\underline{4}}}{4}
    + x^{\underline{3}} + \frac{x^{\underline{2}}}{2} = \left(\frac{x(x-1)}{2}\right)^2$. Mental trick:
    the sum of the first $n$ cubes is always the square of the sum of the first $n$ integers: $\sum_{k=1}^n
    k^3 = \left(\frac{n(n+1)}{2}\right)^2$.'
