  text: How does one invent the generating function for the Catalan numbers $C_n = \frac{1}{n+1}\binom{2n}{n}$
    from binary trees?
  hint: 'Motivation: count non-associative parenthesizations or binary trees of size $n$. Invention: any
    non-empty binary tree decomposes into a root, a left subtree of size $k$, and a right subtree of size
    $n-1-k$, giving $C_n = \sum_{k=0}^{n-1} C_k C_{n-1-k}$ with $C_0 = 1$; in generating functions, $C(z)
    = 1 + z C(z)^2$, whose quadratic solution is $C(z) = \frac{1 - \sqrt{1 - 4z}}{2z}$.'
