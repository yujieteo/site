  text: How does one invent the Bootstrapping method for solving $x e^x = t$ as $t \to \infty$ and compute
    the first two terms mentally?
  hint: 'Motivation: find asymptotic expansions for transcendental algebraic equations. Invention: take
    logarithms to get $x + \ln x = \ln t \implies x = \ln t - \ln x$; plug the leading guess $x_0 = \ln
    t$ into $\ln x$ to get the next correction $x_1 = \ln t - \ln \ln t$, and iterate $x_{k+1} = \ln t
    - \ln(\ln t - \ln \ln t) = \ln t - \ln \ln t + \frac{\ln \ln t}{\ln t} + \dots$.'
