  text: What is the geometric motivation for the Stern-Brocot tree, and how does it relate to the modular
    group $\mathrm{PSL}_2(\mathbb{Z})$ and geodesics on the hyperbolic upper half-plane?
  hint: 'Motivation: construct all positive rational numbers $\mathbb{Q}^+$ in lowest terms using only
    addition (mediants). Relation to other math: the tree is the dual tree to the ideal triangle tessellation
    of the Poincaré upper half-plane $\mathbb{H}^2/\mathrm{PSL}_2(\mathbb{Z})$; a node''s binary address
    $L^a R^b$ gives the cutting sequence of an infinite geodesic in hyperbolic geometry.'
