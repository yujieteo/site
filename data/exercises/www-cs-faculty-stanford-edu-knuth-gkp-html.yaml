  text: How does one invent the floor-sum inversion $\sum_{0 \le k < n} \lfloor \frac{k}{2} \rfloor$ and
    compute it in your head?
  hint: 'Motivation: evaluate sums of fractional step functions. Invention: pairing $2j$ and $2j+1$ gives
    two copies of each integer $j$, summing to $\lfloor n/2 \rfloor \lfloor (n-1)/2 \rfloor$. Mental trick:
    for even $n = 2m$, the sum is $2(0 + 1 + \dots + m-1) = m(m-1) = \frac{n(n-2)}{4}$; for odd $n = 2m+1$,
    the sum is $m^2 = \frac{(n-1)^2}{4}$.'
