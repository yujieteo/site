- id: www-cs-faculty-stanford-edu-knuth-gkp-html#014
  text: What is the motivation behind Singularity Analysis of generating functions (Flajolet-Odlyzko),
    and how does it bridge complex analysis to the average-case analysis of algorithms?
  hint: 'Motivation: extract the asymptotic growth of a sequence $a_n = [z^n]F(z)$ directly from the geometry
    of the singularities of $F(z)$ in the complex plane. Relation to other math: by Cauchy''s integral
    formula, the distance to the nearest singularity $\rho$ dictates the exponential growth $\rho^{-n}$,
    while the algebraic/logarithmic nature of the branch cut dictates the polynomial prefactor $n^{\alpha-1}$,
    bypassing manual real summation.'
