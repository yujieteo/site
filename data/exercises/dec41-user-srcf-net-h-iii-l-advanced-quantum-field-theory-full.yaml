  text: How does one invent Feynman diagrams?
  hint: Consider the powers of the combination $(\hbar \lambda / m^4)^n$; the power is fixed by dimensional
    analysis, but the combinatorial coefficient is hard. Rewriting the path integral and using Wick's
    theorem, the factors arise from the number of ways to pair up $4n$ legs of $n$ vertices. Feynman diagrams
    then are ways to group quadruple vertices (each of valence 4) together; for example, connecting the
    two lines of the diagram gives a single point with two loops. Use the orbit-stabiliser theorem—and
    some counting of connected graphs—to simplify the process.
