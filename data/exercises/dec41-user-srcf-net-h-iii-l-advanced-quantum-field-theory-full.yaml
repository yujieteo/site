- id: dec41-user-srcf-net-h-iii-l-advanced-quantum-field-theory-full#055
  text: What does one compute for a $0$-dimensional free QFT?
  hint: 'Take a positive definite symmetric matrix for simplicity, denoted $M$. Its inverse $M^{-1}$ is
    the propagator, and it appears in the action formula through the quadratic term $\frac12 M_{ab} \phi^{a}\phi^{b}$.
    The partition function is a Gaussian integral: $\int d^n\phi\, e^{-\frac{1}{2\hbar}\phi^{T}M\phi}
    = \frac{(2\pi\hbar)^{n/2}}{\sqrt{\det M}}$. Diagonalise $M$ (the action matrix), since the Lebesgue
    measure is invariant under an orthogonal map $O$, the integral factorises into $n$ independent $1$-dimensional
    Gaussian integrals over the eigenvectors; this reduces free QFT to classical probability theory.'
  locator: null
