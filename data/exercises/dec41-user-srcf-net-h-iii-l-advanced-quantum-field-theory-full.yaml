- id: dec41-user-srcf-net-h-iii-l-advanced-quantum-field-theory-full#133
  text: How does one construct the Lévy-flight RG-LRG?
  hint: 'The mass/renormalisation point: the variable renormalisation becomes $\mathrm{L}(x)$, $x'' =
    x/2^{1/\alpha}$, with $2\to\alpha$ not fixed at 2. Take $a$ arbitrary, the general (non-Gaussian)
    term is not Gaussian; use the Fourier transform to compute the beta of the Gaussian coupling: $\beta(g)
    = (\alpha-2)g$. For $\alpha>2$ Gaussian is stable; for $\alpha<2$, $\beta<0$, so set $\beta(g)=0$
    gives a *non*Gaussian fixed point, the Lévy (stable) fixed point. The characteristic function is $\exp(-\mathrm{const}|k|^\alpha)$,
    non-analytic in $k$; this is an exact fixed point for a "Lévy flight": long jumps as well as short
    steps, and self-similarity across scales.'
