- id: dec41-user-srcf-net-h-iii-l-advanced-quantum-field-theory-full#039
  text: How does one compute the partition function of a topological four-functor field theory?
  hint: A functor from the category of $d$-dimensional cobordisms; the partition function is the value
    of the functor on a $d$-torus, i.e. $Z(T)$. The partition function is the trace over the value of
    the QFT on the cylinder given by cutting, so the name comes from the cylinder cobordism of the manifold.
    On Riemannian cobordisms, the value of the QFT on a cylinder of length $t$ is a linear operator of
    the form $\exp(-\hbar)\, H$; here $H$ is the Hamiltonian (energy). The torus is cut open, then built
    by gluing the end of the Cylinder, and gluing the ends corresponds to taking the trace of the evolution
    operator, hence the $d$-torus is mapped to a number.
