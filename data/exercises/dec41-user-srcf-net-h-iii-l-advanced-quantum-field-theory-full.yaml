  text: What is the purpose of the beta function?
  hint: 'It measures the dependence of a coupling parameter on energy scale; it is itself independent
    of the scale. The scale is self- but predicts scale: under a flow, $g(\kappa) = G^{-1}\left((\kappa/\mu)^d
    G(g(\mu))\right)$. If the beta-function vanish at $g_*$, the theory is scale-invariant—this is a fixed
    point and in many cases gives rise to a CFT.'
