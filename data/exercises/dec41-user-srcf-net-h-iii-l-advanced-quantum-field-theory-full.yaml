- id: dec41-user-srcf-net-h-iii-l-advanced-quantum-field-theory-full#031
  text: Why does one need to decide/choose a space?
  hint: 'It depends on the domain: for particle physics one picks a pseudo-Riemannian manifold, e.g. $(M,g)
    = (\mathbb{R}^4, \eta)$ with $\eta$ the Minkowski metric, or $(\mathbb{R}^3, \delta)$ with $\delta$
    the flat Euclidean metric; in string theory one picks a Riemann surface, such as a sphere or a torus,
    and only needs a conformal equivalence class of metrics, i.e. a metric up to a scalar factor. For
    the QFT of knots one chooses an oriented $3$-manifold with no metric. $\mathbb{R}^d$ is noncompact,
    so it is bad.'
