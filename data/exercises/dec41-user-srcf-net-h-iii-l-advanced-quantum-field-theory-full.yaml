  text: What is Wick's probability theorem (Isserlis' theorem)?
  hint: For a zero-mean multivariate normal random vector $X_1,\dots X_{2k}$, the expectation $\mathbb{E}(X_1X_2\cdots
    X_{2k})$ is a sum over all complete pairings, each term a product of the $2k$ covariance entries,
    e.g. $\sum_{\text{pairings}}\prod_{(a,b)\text{pair}} \mathbb{E}(X_aX_b)$. Odd moments vanish, and
    Isserlis proves the even case by induction using combinatorics. This gives a exact method of Gaussian
    expectations/characteristic functions.
