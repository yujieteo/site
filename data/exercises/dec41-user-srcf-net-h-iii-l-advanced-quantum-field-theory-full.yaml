- id: dec41-user-srcf-net-h-iii-l-advanced-quantum-field-theory-full#010
  text: Why does one compute the partition function and why is there a minus sign?
  hint: this is where harmonic analysis can come in, Euclidean signature gives - sign, otherwise it will
    be some i, partition function allows you to do harmonic analysis, in fact it is Z = int D phi exp(-S[phi]
    h), the factor exp is the suppress wild contributions using analysis, D phi is the entropy but problem
    is that this not well defined as a measure since we do not have tools like compactness here, one fixes
    this with lattice regularisation and Faddev-Popov ghosts. This is the hard part of quantum field theory
    which is to find a working measure. Same as partition function but in imaginary time.
  locator: null
