- id: dec41-user-srcf-net-h-iii-l-advanced-quantum-field-theory-full#001
  text: What is a Wilson loop?
  hint: 'A gauge-invariant observable defined by the trace of the path-ordered exponential of a gauge
    field along a closed loop: $W_C = \operatorname{Tr} \mathcal{P} \exp(i g \oint_C A_\mu dx^\mu)$.'
