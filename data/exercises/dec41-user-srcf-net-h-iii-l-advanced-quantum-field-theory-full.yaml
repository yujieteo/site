  text: What is the Callan-Symanzik equation?
  hint: A differential equation $\left[ \mu \frac{\partial}{\partial \mu} + \beta(g) \frac{\partial}{\partial
    g} + n \gamma \right] G^{(n)} = 0$ expressing the independence of physical observables from the arbitrary
    renormalization scale $\mu$.
