- id: dec41-user-srcf-net-h-iii-l-advanced-quantum-field-theory-full#032
  text: Why must one pick a scalar field?
  hint: 'Field theory is about fields, and a field is a map $M \to N$ whose choice is tasted by a parametrisation
    of the configuration. The field can be a scalar obtained by choosing an isomorphism on a principal
    $G$-bundle (or in an infinity-bundle), but one can choose something more general: a target space.
    In the course, $N$ is a manifold, but ultimately it can be anything that behaves like a manifold,
    i.e. a sheaf. Basically a field is a value assigned to each parameter point.'
