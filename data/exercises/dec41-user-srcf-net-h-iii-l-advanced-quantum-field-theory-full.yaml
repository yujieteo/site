  text: What is the entropy of the field?
  hint: it is the measure D phi and it does not exist, essentially the measure used in the partition function
    and we do not understand what it is in the path integral. Integrated over all field configuration,
    weighted by exp(-S/h). Requires Faddev-Popov determinant to correct redundancies in the measure and
    lattice regularisation to yield finite results. There is no compactness or even local compactness
    here. Subject of research. Strangely there is no compactness assumption required, just need discretisation
