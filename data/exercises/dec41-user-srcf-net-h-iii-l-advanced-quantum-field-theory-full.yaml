- id: dec41-user-srcf-net-h-iii-l-advanced-quantum-field-theory-full#033
  text: What is the entropy of the field?
  hint: It is the measure $D\phi$; it does not actually exist in general. It is the measure used in the
    partition function, and what it really is is not fully understood in the path integral. It is integrated
    over all field configurations, weighted by $\exp(-S[\phi]/\hbar)$. It requires the Faddeev–Popov  determinant
    to correct redundancy in the measure and lattice regularisation to give finite results. There is no
    compactness, or even local compactness, here; this is a subject of research. Strangely, on compactness
    is not required, just discretisation.
