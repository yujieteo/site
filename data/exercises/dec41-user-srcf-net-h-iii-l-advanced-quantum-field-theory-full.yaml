- id: dec41-user-srcf-net-h-iii-l-advanced-quantum-field-theory-full#027
  text: 'What does one compute for a 0D free QFT? (Hint: define a positive definite symmetric matrix for
    simplicity, denoted M, the inverse of M is the propagator, this appears in the field action formula,
    then one uses the quadratic terms 0.5 M_ab phi^a phi^b, then one computes the partition function as
    a Gaussian integral to be (2 pi h)^n/2 / root(det M)). Diagonalise the M which is the action matrix,
    inverse is directionally proportional to the propagator with orthogonal O, and note that Lebesgue
    measure is invariant under orthogonal transform [mass does not change intuitively] so the terms of
    eigenvectors reduces to n 1D Gaussian integrals (think about Schur''s lemma) i.e. this reduces to
    classical probability theory)'
