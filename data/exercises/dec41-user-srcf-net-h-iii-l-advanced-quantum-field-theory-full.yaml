- id: dec41-user-srcf-net-h-iii-l-advanced-quantum-field-theory-full#038
  text: Why does one compute the partition function and why is there a minus sign?
  hint: 'This is where harmonic analysis enters. Euclidean signature gives the minus sign; otherwise there
    is an $i$. The partition function allows one to do harmonic analysis, e.g $Z = \int D\phi\ e^{-S[\phi]/\hbar}$.
    The exponential factor suppresses wild contributions using analysis; the problem is that $D\phi$ is
    not a well-defined measure (no compactness tools), and one fixes this with the lattice regularisation
    and Faddeev–Popov ghosts. This is the hard part of quantum field theory: finding a working measure.
    This is the same as the partition function, but in an imaginary time.'
