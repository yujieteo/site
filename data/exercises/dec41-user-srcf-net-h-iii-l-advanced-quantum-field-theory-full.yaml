  text: How does one get $GL$-bundles/G-bundles?
  hint: 'If the fiber is $V=\mathbb{R}^n with some inner product $g$, one wants $g$ to be arrival: trivialisation
    is not just a linear isomorphism but/is orthogonal, so that changed between charts are transitions
    in $O(n)$. More generally, a $G$-bundle $E$ is a vector bundle with all transition functions taking
    values in a Lie subgroup $G\subseteq GL(V)$; specify transitions functions satisfying the cocycle
    condition $g_{kj}g_{ji}=g_{ki}$.'
