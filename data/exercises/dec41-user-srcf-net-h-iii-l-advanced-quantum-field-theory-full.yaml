  text: Why does Euclidean path integration introduce a negative exponential $\exp(-S_E / \hbar)$?
  hint: Wick rotation $t \to -i\tau$ turns the oscillating phase $e^{i S / \hbar}$ into a damping factor
    $e^{-S_E / \hbar}$, establishing a rigorous link with statistical mechanics.
