  text: How does final one specify a quantum gauge theory?
  hint: 'One picks a spacetime $M$, a gauge group $G$—e.g. the gauge group $U(1)$ for QED, $SU(3)$ ones
    QCD, $SU(3)\times SU(2)\times U(1)$ for the standard model—and obtain a principal $G$-bundle $P$ above
    $M$. Then pick a category representation $\mathbf{\rho}$ of $G$; the associated bundle is for an associated
    vector bundle; fields are sections of associated bundle. Examples: $U(1)$-Maxwell with a complex scalar
    field.'
