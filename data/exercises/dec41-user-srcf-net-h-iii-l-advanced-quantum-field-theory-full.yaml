  text: What is the purpose of the propagator in a $0$-dimensional QFT?
  hint: 'It reduces the calculation of correlation-function integrals to the combinatorics of pairing
    indices; note that the number of pairings is $(2k-1)!!$, related to Krened/Connes–Kreimen interpretations.
    The propagator assigns a weight: one uses it to compute amplitudes by counting the number of ways
    of pairing up. For interactions, a vertex is of even degree (e.g. 4 legs); pair up legs using Feynman
    diagrams. Graph enumeration, symmetry factors, and permutations of the dots(lines) are done with orbit-stabiliser
    arguments. Feynman diagrams are the graph basis, the coproduct the diagram into its divergent subgraphs,
    and the Hopf algebra and antipode computes the counterterms of BPHZ renormalisation.'
