    with coupling g = m^2, g(zeta) = g_0/zeta^2. Take derivative with log zeta, gets Callan-Symanzik beta,
    now set it to 0 i.e. g = 0. This is the Gaussian fixed point, as zeta -> 1, massless free field theory
    is scale invariant. Similarly for phi^4 theory in 4D.
