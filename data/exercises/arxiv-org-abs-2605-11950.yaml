  text: (10) What ingredients are required to show a module forms a class formation?
  hint: 'One needs: (1) vanishing of $H^1$ via Hilbert''s Theorem 90 / Kummer theory; (2) computation
    of Herbrand quotients $h(A^N) = [H:N]$; (3) existence of enough cyclic extensions (especially unramified
    ones) to normalize and assemble the invariant maps.'
