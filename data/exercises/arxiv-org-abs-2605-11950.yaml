  text: (11) How is local class field theory proved using class formations for nonarchimedean local fields?
  hint: Let $\mathcal{C}$ be the Galois category of finite separable extensions of $K$, with coefficient
    functor $A(L) = L^\times$. (1) $H^1(L/K, L^\times) = 0$ by Hilbert 90; (2) for unramified extensions,
    $h(\mathcal{O}_L^\times) = 1$ implies $h(L^\times) = [L:K]$; (3) unramified invariant maps extend
    to all extensions, proving local CFT.
