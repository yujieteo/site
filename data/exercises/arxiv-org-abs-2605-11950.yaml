  hint: Check that for every Sylow $p$-subgroup $G_p \subset G$, $H^1(G_p, A) = 0$ and $H^2(G_p, A)$ is
    cyclic of order $|G_p|$, generated by the restriction of the fundamental class $\alpha$.
