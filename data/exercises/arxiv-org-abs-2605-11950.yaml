  text: (9) How is Tate cohomology exploited via 2-periodicity for cyclic groups?
  hint: For cyclic $G$, $\widehat{H}^{i}(G, A) \cong \widehat{H}^{i+2}(G, A)$ for all $i$, so the entire
    cohomology is determined by $\widehat{H}^0(G, A) = A^G / \mathrm{Nm}(A)$ and $\widehat{H}^1(G, A)
    = \ker(\mathrm{Nm}) / I_G A$, simplifying all calculations to the Herbrand quotient $h(A) = |\widehat{H}^0(A)|
    / |\widehat{H}^1(A)|$.
  locator: null
  sub_index: null
  search_text: (9) how is tate cohomology exploited via 2-periodicity for cyclic groups? for cyclic $g$,
    $\widehat{h}^{i}(g, a) \cong \widehat{h}^{i+2}(g, a)$ for all $i$, so the entire cohomology is determined
    by $\widehat{h}^0(g, a) = a^g / \mathrm{nm}(a)$ and $\widehat{h}^1(g, a) = \ker(\mathrm{nm}) / i_g
