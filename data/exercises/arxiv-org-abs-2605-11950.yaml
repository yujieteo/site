- id: arxiv-org-abs-2605-11950#000
  text: (1) To organise Galois groups and modules, how does one formulate a classical class formation?
  hint: A class formation is a pair $(\Gamma, A)$ where $\Gamma$ is a profinite group and $A$ is a discrete
    $\Gamma$-module such that for every open subgroup $H \subset \Gamma$ and open normal subgroup $N \triangleleft
    H$, $H^1(H/N, A^N) = 0$ and $H^2(H/N, A^N) \cong \frac{1}{[H:N]}\mathbb{Z}/\mathbb{Z}$ canonically
    via an invariant map $\mathrm{inv}_{H/N}$.
  locator: null
  sub_index: null
