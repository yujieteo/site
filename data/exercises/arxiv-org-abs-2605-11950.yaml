  text: (14) What is the Weil group of a class formation and how does it resolve the canonicity issue?
  hint: The Weil group $W_{L/K}$ is the group extension $1 \to A^L \to W_{L/K} \to \mathrm{Gal}(L/K) \to
    1$ classified by the fundamental class $\alpha \in H^2(\mathrm{Gal}(L/K), A^L)$; Clausen refines this
    into an abelian gerbe on $B\Gamma$ banded by $A$.
