  text: (3) What is the purpose of the Nakayama-Tate lemma in class formations?
  hint: Given a class formation with fundamental class $\alpha \in H^2(G, A)$, cup product with $\alpha$
    yields an isomorphism $\widehat{H}^i(G, \mathbb{Z}) \xrightarrow{\sim} \widehat{H}^{i+2}(G, A)$ for
    all $i \in \mathbb{Z}$; taking $i = -2$ gives the Artin reciprocity isomorphism $(G)^{\mathrm{ab}}
    \cong \widehat{H}^{-2}(G, \mathbb{Z}) \xrightarrow{\sim} \widehat{H}^0(G, A) = A^G / \mathrm{Tr}_G(A)$.
  locator: null
  sub_index: null
  search_text: (3) what is the purpose of the nakayama-tate lemma in class formations? given a class formation
