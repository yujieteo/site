  text: (7) What are the axiomatic cohomological criteria required for a class formation?
  hint: (i) $H^1(H/N, A^N) = 0$; (ii) there exists an isomorphism $\mathrm{inv}_{H/N} \colon H^2(H/N,
    A^N) \xrightarrow{\sim} \frac{1}{[H:N]}\mathbb{Z}/\mathbb{Z}$; (iii) these invariant maps commute
    with inflation and restriction maps across all open subgroups $N \subset H \subset \Gamma$.
