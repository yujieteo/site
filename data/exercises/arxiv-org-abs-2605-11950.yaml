  text: (5) How does one construct the Artin reciprocity map with dense image and determine its kernel?
  hint: Taking the projective limit over all open normal subgroups $N \triangleleft H$ of the Nakayama-Tate
    isomorphisms $(H/N)^{\mathrm{ab}} \cong A^H / \mathrm{Tr}_{H/N}(A^N)$ yields the Artin map $A^H \to
    H^{\mathrm{ab}}$ with dense image and kernel $\bigcap_{N} \mathrm{Tr}_{H/N}(A^N)$, which is the subgroup
    of universal norms.
