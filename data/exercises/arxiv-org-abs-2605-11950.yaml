  text: (8) How does one reduce the verification of class formation axioms to cyclic extensions?
  hint: By Sylow theory and solvable filtration, any finite group can be decomposed into a tower of cyclic
    extensions of prime degree; checking the axioms on prime-degree cyclic steps implies them for all
    finite Galois extensions.
