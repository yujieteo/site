- id: math-dartmouth-edu-lesen-notes-talk-slides-pdf#001
  text: 'Fix a standard symplectic form $\psi$. Define $G = \mathrm{GSp}_2g(\mathbb{R})$. Show that the
    standard Siegel modular variety $M := \{A + Bi \in \mathrm{Sym}_g(\mathbb{C}): B > 0\}$ is identified
    with the description as a $G(\mathbb{R})$-conjugacy class of homomorphisms $h: \mathbb{S} \rightarrow
    G_\mathbb{R}$ (from the Deligne torus). Show that with this identification, if the associated $M /
    \Gamma(N)$ and $D/K(N)$ both parameterise abelian varieties with level $N$ structure for all $N$,
    then the moduli functors are represented by the same variety'
  hint: null
  locator: null
  sub_index: null
  search_text: 'fix a standard symplectic form $\psi$. define $g = \mathrm{gsp}_2g(\mathbb{r})$. show
    that the standard siegel modular variety $m := \{a + bi \in \mathrm{sym}_g(\mathbb{c}): b > 0\}$ is
    identified with the description as a $g(\mathbb{r})$-conjugacy class of homomorphisms $h: \mathbb{s}
    \rightarrow g_\mathbb{r}$ (from the deligne torus). show that with this identification, if the associated
    $m / \gamma(n)$ and $d/k(n)$ both parameterise abelian varieties with level $n$ structure for all
    $n$, then the moduli functors are represented by the same variety'
