  text: What is the difference between matroid contraction and deletion intuitively?
  hint: Deletion $M \setminus e$ removes the element $e$ and ignores it (like deleting an edge in a graph);
    contraction $M / e$ forces $e$ to be part of the independent structure and projects the rest of the
    geometry onto the quotient space along $e$.
