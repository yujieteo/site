  text: Why do we care about the Rank Axioms?
  hint: They characterize the integer-valued dimension function $r \colon \mathcal{P}(E) \to \mathbb{Z}_{\ge
    0}$ via submodularity $r(A \cup B) + r(A \cap B) \le r(A) + r(B)$, which serves as the discrete analogue
    of concave energy functionals in convex optimization.
