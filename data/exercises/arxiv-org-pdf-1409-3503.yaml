  text: How does one invent the notion of the Möbius function on a poset?
  hint: Invert the zeta matrix $\zeta(x, y) = \mathbf{1}_{\{x \le y\}}$ in the incidence algebra of the
    poset to solve the general reconstruction problem $g(x) = \sum_{y \le x} f(y) \implies f(x) = \sum_{y
    \le x} g(y) \mu(y, x)$.
