- id: arxiv-org-pdf-1409-3503#003
  text: How does one invent the notion of a matroid?
  hint: Whitney observed that the greedy algorithm works for finding minimum spanning trees and that linear
    independence in matrices satisfies purely set-theoretic exchange axioms; he abstracted these common
    axioms away from the underlying field.
