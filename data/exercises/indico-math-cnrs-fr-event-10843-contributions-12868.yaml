- id: indico-math-cnrs-fr-event-10843-contributions-12868#003
  text: '(The Adele Class Space as a Noncommutative Space) Define the adèle class space $X_K = K^\times
    \backslash \mathbb{A}_K$ introduced by Alain Connes in 1996. Why does classical measure theory fail
    on this space? (Hint: The action of $K^\times$ on $\mathbb{A}_K$ is ergodic with respect to the Haar
    measure, meaning any measurable invariant function is almost everywhere constant; $X_K$ behaves as
    the leaf space of a foliation, serving as a prototype noncommutative space)'
