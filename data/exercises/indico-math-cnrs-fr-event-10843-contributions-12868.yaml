  text: '(Ramification and Periodic Orbits) How does ramification of a number field extension manifest
    in the finite cover of the scaling site? (Hint: For an unramified prime $p$, the preimage of the periodic
    orbit $C_p$ (of length $\log p$) decomposes into connected circles corresponding to the places lying
    over $p$, each acting as the mapping torus of the Frobenius automorphism)'
