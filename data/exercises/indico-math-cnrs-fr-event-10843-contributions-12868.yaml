  text: '(Constructing Finite Covers of the Scaling Site) Let $G$ be a finite abelian group and let $\chi:
    \widehat{\mathbb{Z}}^\times \twoheadrightarrow G$ be a surjective continuous homomorphism. How is
    the corresponding finite cover of the scaling site constructed? (Hint: Take the balanced product $X_{\mathbb{Q}}
    \times_{\widehat{\mathbb{Z}}^\times} G$, yielding a space where $G$ acts transitively on the fibers
    over the double quotient)'
