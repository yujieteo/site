- id: indico-math-cnrs-fr-event-10843-contributions-12868#001
  text: '(Galois Theory as Group Actions on Spaces) Why is it insufficient to view Galois groups merely
    as abstract groups? (Hint: Galois originally formulated solvability via primitive equations of prime
    power degree acting transitively on pairs of roots; Galois groups must be understood through their
    concrete actions on spaces, where the idèle class group plays the fundamental geometric role)'
