- id: indico-math-cnrs-fr-event-10843-contributions-12868#005
  text: '(Riemann-Weil Explicit Formulas as a Trace Formula) Explain how the local terms $\int_{K_v^\times}
    \frac{f(u)}{|1-u|}\,d^*u$ in the Riemann–Weil explicit formula arise from the adèle class space. (Hint:
    The action of the scaling operator $u \in K_v^\times$ on the transverse space has Schwartz kernel
    $\delta(y - ux)$, whose diagonal trace $\int \delta(x - ux)\,dx = \frac{1}{|1-u|}$ converts Weil''s
    explicit formula into a geometric trace formula)'
