- id: indico-math-cnrs-fr-event-10843-contributions-12868#000
  text: '(Philosophy of Class Field Theory & Yoneda Lemma) How does class field theory realize the principle
    that an algebraic number field "possesses within itself the elements of its own surpassing"? (Hint:
    Abelian extensions are determined entirely by internal invariants of the base field $K$, mirroring
    the Yoneda lemma; trace the historical progression from Kummer''s ideal numbers and Dedekind''s ideal
    classes to Chevalley''s idèle class group $C_K = \mathrm{GL}_1(\mathbb{A}_K)/K^\times$, whose quotient
    by the connected component of the identity yields $\operatorname{Gal}(K^{\text{ab}}/K)$)'
  hint: null
