- id: indico-math-cnrs-fr-event-10843-contributions-12868#004
  text: '(Local-to-Global Class Field Theory via Isotropy) How does the adèle class space $X_K$ bridge
    local and global class field theory? (Hint: Local class field theory for a completion $K_v$ is simpler;
    in the adèle class space, the local multiplicative group $K_v^\times$ embeds canonically as the isotropy
    group of the local slice at $v$, realizing the local-to-global transition geometrically)'
