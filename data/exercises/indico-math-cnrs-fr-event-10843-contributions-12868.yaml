  text: '(The Scaling Site without Adeles) Define the scaling site $X_{\mathbb{Q}} = \mathbb{Q}^\times
    \backslash \mathbb{A}_{\mathbb{Q}} / \widehat{\mathbb{Z}}^\times$ and describe its presentation in
    terms of rank-1 subgroups of $\mathbb{R}$. (Hint: $X_{\mathbb{Q}}$ can be realized without adèles
    as the space of rank-1 additive subgroups of $\mathbb{R}$, such as $\mathbb{Z}[1/p]$; the visible
    generic orbit is $\mathbb{R}_+^*$, and the periodic orbits have lengths $\log p$ corresponding to
    prime numbers $p$)'
