- id: ncatlab-org-nlab-show-six-operations#005
  text: How is the complementary open-closed localization property expressed purely in six-functor operators?
  hint: 'For a closed immersion $i \colon Z \hookrightarrow X$ with open complement $j \colon U \hookrightarrow
    X$, there are two canonical fiber sequences of identity functors: $j_! j^! \to \mathrm{id}_{\mathcal{D}(X)}
    \to i_* i^*$ (counit-unit sequence) and $i_! i^! \to \mathrm{id}_{\mathcal{D}(X)} \to j_* j^*$ (Verdier
    dual sequence).'
  locator: null
