  text: What does $j^! \cong j^*$ mean for an open immersion $j \colon U \hookrightarrow X$?
  hint: It means restricting to an open subset does not alter the dualizing complex or impose any boundary
    twist; local boundary conditions do not exist on open charts because there are no boundary points
    in $U$, so the exceptional pullback $j^!$ collapses to the ordinary restriction functor $j^*$.
