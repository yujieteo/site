    algebra object $\mathcal{A} = f_*\mathcal{O}_X$, establishing the exact categorical equivalence $\mathbf{QCoh}(X)
    \simeq \mathbf{Mod}_{\mathcal{A}}(\mathbf{QCoh}(Y))$ and proving $X \simeq \underline{\mathrm{Spec}}_Y(f_*\mathcal{O}_X)$.'
