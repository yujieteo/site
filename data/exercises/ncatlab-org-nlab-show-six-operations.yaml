- id: ncatlab-org-nlab-show-six-operations#010
  text: Why does an immersion $f \colon X \to Y$ need $f_! \simeq j_! i_*$ to be fully faithful?
  hint: An immersion is a closed immersion $i$ into an open subscheme $j$; since both $i_*$ and $j_!$
    are fully faithful functors, their composition $f_! = j_! i_*$ is a fully faithful embedding of $\mathcal{D}(X)$
    as a subcategory of sheaves on $Y$ supported on the locally closed locus.
