  text: What is the difference between the left adjoint via the trace map and the right adjoint up to
    a dualizing line bundle for $f_*$?
  hint: The left adjoint to $f^*$ is constructed by summing over fibers using the trace map $\mathrm{Tr}
    \colon f_* \mathcal{O}_X \to \mathcal{O}_Y$; the right adjoint to $f^*$ is constructed via the dualizing
    module $\underline{\mathrm{Hom}}_{\mathcal{O}_Y}(f_* \mathcal{O}_X, \mathcal{O}_Y) \cong f_*(\omega_{X/Y})$;
    when $f$ is finite locally free and unramified (or Calabi-Yau), $\omega_{X/Y} \cong \mathcal{O}_X$,
    so both adjoints coincide on the nose without twisting.
