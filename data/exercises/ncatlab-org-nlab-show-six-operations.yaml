- id: ncatlab-org-nlab-show-six-operations#004
  text: Why does $j_!$ being fully faithful mean extension by zero?
  hint: A left adjoint $j_!$ is fully faithful if and only if the unit $j^* j_! \xrightarrow{\sim} \mathrm{id}_{\mathcal{D}(U)}$
    is an isomorphism; this means taking a sheaf on $U$, extending it by zero to $X$, and restricting
    it back to $U$ recovers the exact same original sheaf without losing or altering any sections.
