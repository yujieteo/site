- id: ncatlab-org-nlab-show-six-operations#006
  text: Why does $i^* i_* \cong \mathrm{id}_{\mathcal{D}(Z)}$ mean that the closed immersion pushforward
    $i_*$ is fully faithful?
  hint: For any adjoint pair $(L, R)$, the right adjoint $R$ is fully faithful if and only if the counit
    $L R \xrightarrow{\sim} \mathrm{id}$ is an isomorphism; for a closed immersion $i$, restricting a
    pushed-forward sheaf back to the closed subscheme $i^* i_* \mathcal{F} \cong \mathcal{F}$ is an isomorphism,
    meaning $\mathrm{Hom}_{\mathcal{D}(Z)}(\mathcal{F}, \mathcal{G}) \cong \mathrm{Hom}_{\mathcal{D}(X)}(i_*
    \mathcal{F}, i_* \mathcal{G})$.
