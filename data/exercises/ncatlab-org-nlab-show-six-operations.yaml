  text: Why does a flat morphism refer to the pullback functor being t-exact when I thought flatness referred
    to tensor products?
  hint: Because on affine schemes, the pullback is defined by the tensor product $f^*(\widetilde{M}) =
    \widetilde{M \otimes_B A}$; $A$ is flat over $B$ if and only if $-\otimes_B A$ is an exact functor
    on modules, which means the derived pullback $\mathbf{L}f^*$ has no higher $\mathrm{Tor}_i$ homology
    sheaves and is t-exact on $\mathcal{D}(Y)$.
