- id: ncatlab-org-nlab-show-six-operations#000
  text: Is it because $\mathbf{QCoh}$ is symmetric monoidal that we have a nice six-functor formalism?
  hint: Yes; the symmetric monoidal tensor product $\otimes$ on $\mathbf{QCoh}(X)$ provides the internal
    multiplication and internal hom $\underline{\mathrm{Hom}}$, allowing all geometric operations $(f^*,
    f_*, f_!, f^!)$ to satisfy the projection formula, duality pairings, and monadicity equivalences as
    enriched module functors over the base category.
