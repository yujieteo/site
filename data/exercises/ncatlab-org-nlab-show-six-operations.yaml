  text: Does quasi-separated mean that the diagonal is quasi-compact?
  hint: Yes; by definition, a morphism $f \colon X \to Y$ is quasi-separated if and only if its diagonal
    morphism $\Delta_{X/Y} \colon X \to X \times_Y X$ is a quasi-compact morphism, which means the intersection
    of any two quasi-compact open subschemes is quasi-compact.
