- id: ncatlab-org-nlab-show-six-operations#000
  text: How is an isomorphism of schemes $f \colon X \xrightarrow{\sim} Y$ characterized in the six-functor
    formalism?
  hint: $f^*, f_*, f_!, f^!$ are all equivalences of symmetric monoidal $\infty$-categories, with $f^*
    \cong f^!$ and $f_* \cong f_!$, and the unit/counit maps $\mathrm{id} \xrightarrow{\sim} f_* f^*$
    and $f^* f_* \xrightarrow{\sim} \mathrm{id}$ are natural isomorphisms.
  locator: null
  sub_index: null
  search_text: how is an isomorphism of schemes $f \colon x \xrightarrow{\sim} y$ characterized in the
    six-functor formalism? $f^*, f_*, f_!, f^!$ are all equivalences of symmetric monoidal $\infty$-categories,
    with $f^* \cong f^!$ and $f_* \cong f_!$, and the unit/counit maps $\mathrm{id} \xrightarrow{\sim}
    f_* f^*$ and $f^* f_* \xrightarrow{\sim} \mathrm{id}$ are natural isomorphisms.
- id: ncatlab-org-nlab-show-six-operations#001
  text: How is a monomorphism of schemes $f \colon X \to Y$ characterized in the six-functor formalism?
  hint: The diagonal six-functor pullback along $\Delta_f \colon X \to X \times_Y X$ satisfies $\Delta_f^*
    \cong \Delta_f^! \cong \mathrm{id}_{\mathcal{D}(X)}$ and $(\Delta_f)_* \cong (\Delta_f)_! \cong \mathrm{id}_{\mathcal{D}(X)}$,
    meaning the diagonal functorially acts as the identity functor on all sheaves.
  locator: null
  sub_index: null
  search_text: how is a monomorphism of schemes $f \colon x \to y$ characterized in the six-functor formalism?
    the diagonal six-functor pullback along $\delta_f \colon x \to x \times_y x$ satisfies $\delta_f^*
    \cong \delta_f^! \cong \mathrm{id}_{\mathcal{d}(x)}$ and $(\delta_f)_* \cong (\delta_f)_! \cong \mathrm{id}_{\mathcal{d}(x)}$,
    meaning the diagonal functorially acts as the identity functor on all sheaves.
- id: ncatlab-org-nlab-show-six-operations#002
  text: How is an open immersion $j \colon U \hookrightarrow X$ characterized in the six-functor formalism?
  hint: $j^* \cong j^!$ is exact and preserves all limits and colimits; its left adjoint $j_!$ is fully
    faithful (extension-by-zero), satisfying $j^* j_! \cong \mathrm{id}_{\mathcal{D}(U)}$, and $j_!$ admits
    a right adjoint $j^* \cong j^!$ with counit $j_! j^* \hookrightarrow \mathrm{id}_{\mathcal{D}(X)}$.
  locator: null
  sub_index: null
  search_text: how is an open immersion $j \colon u \hookrightarrow x$ characterized in the six-functor
    formalism? $j^* \cong j^!$ is exact and preserves all limits and colimits; its left adjoint $j_!$
    is fully faithful (extension-by-zero), satisfying $j^* j_! \cong \mathrm{id}_{\mathcal{d}(u)}$, and
    $j_!$ admits a right adjoint $j^* \cong j^!$ with counit $j_! j^* \hookrightarrow \mathrm{id}_{\mathcal{d}(x)}$.
- id: ncatlab-org-nlab-show-six-operations#003
  text: How is a closed immersion $i \colon Z \hookrightarrow X$ characterized in the six-functor formalism?
  hint: $i_* \cong i_!$ is fully faithful (meaning $i^* i_* \cong \mathrm{id}_{\mathcal{D}(Z)}$ and $i^!
    i_! \cong \mathrm{id}_{\mathcal{D}(Z)}$); the counit $i_! i^! \to \mathrm{id}_{\mathcal{D}(X)}$ and
    unit $\mathrm{id}_{\mathcal{D}(X)} \to i_* i^*$ form the co-support and support projectors.
  locator: null
  sub_index: null
  search_text: how is a closed immersion $i \colon z \hookrightarrow x$ characterized in the six-functor
