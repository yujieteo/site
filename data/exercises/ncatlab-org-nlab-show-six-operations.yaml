  text: What is the counit $i_! i^! \to \mathrm{id}_{\mathcal{D}(X)}$ and what is a counit in general?
  hint: In any adjunction $L \dashv R$, the counit is the canonical natural transformation $\epsilon \colon
    L R \to \mathrm{id}$; for a closed immersion $(i_! \dashv i^!)$, the counit $i_! i^! \mathcal{F} \to
    \mathcal{F}$ is the universal inclusion of the subsheaf of sections supported strictly on $Z$ into
    the ambient sheaf $\mathcal{F}$.
