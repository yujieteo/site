- id: ncatlab-org-nlab-show-six-operations#009
  text: What are support and cosupport in the six-functor formalism?
  hint: The support of $\mathcal{F}$ on a closed subscheme $i \colon Z \hookrightarrow X$ is the operation
    $i_* i^* \mathcal{F}$ (quotienting by sections that vanish on $Z$); the cosupport of $\mathcal{F}$
    on $Z$ is the operation $i_! i^! \mathcal{F}$ (subsheaf of sections with compact support / local cohomology
    supported on $Z$).
