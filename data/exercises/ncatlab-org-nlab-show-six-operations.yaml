- id: ncatlab-org-nlab-show-six-operations#000
  text: What is the role of the diagonal pullback $\Delta^*$ in the six-functor formalism?
  hint: The diagonal map $\Delta \colon X \to X \times X$ converts external tensor products into internal
    tensor products via $\Delta^*(\mathcal{F} \boxtimes \mathcal{G}) \simeq \mathcal{F} \otimes \mathcal{G}$,
    turns self-intersections into Hochschild homology via $\Delta^* \Delta_* \mathbf{1} \simeq \mathbf{HH}_*(X)$,
    and encodes all separation properties through the algebraic behavior of $\Delta^*$.
  locator: null
