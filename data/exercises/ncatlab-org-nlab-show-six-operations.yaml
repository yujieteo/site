- id: ncatlab-org-nlab-show-six-operations#008
  text: How is the Projection Formula encoded as an enriched module action in the six-functor formalism?
  hint: The natural transformation $f_!(A \otimes f^* B) \xrightarrow{\sim} f_!(A) \otimes B$ is an isomorphism
    for all $A \in \mathcal{D}(X), B \in \mathcal{D}(Y)$, making $f_!$ an enriched $\mathcal{D}(Y)$-module
    functor; if $f$ is proper, $f_*(A \otimes f^* B) \cong f_*(A) \otimes B$.
  locator: null
  sub_index: null
  search_text: how is the projection formula encoded as an enriched module action in the six-functor formalism?
