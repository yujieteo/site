- id: ncatlab-org-nlab-show-six-operations#004
  text: What does it mean for $j_!$ to be exact in an open immersion?
  hint: It means the extension-by-zero functor $j_! \colon \mathbf{Sh}(U) \to \mathbf{Sh}(X)$ preserves
    all short exact sequences and all finite limits and colimits, which occurs because extending a sheaf
    by zero outside an open set preserves stalk-wise exactness at every point $x \in X$.
