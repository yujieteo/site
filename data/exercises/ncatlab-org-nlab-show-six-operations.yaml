- id: ncatlab-org-nlab-show-six-operations#011
  text: Why is an ambidextrous adjunction related to Frobenius reciprocity?
  hint: An adjunction is ambidextrous if the left adjoint equals the right adjoint ($F \cong G$); for
    finite covering maps, this means pushforward $f_*$ is simultaneously left and right adjoint to pullback
    $f^*$, which reproduces Frobenius reciprocity $\mathrm{Hom}_G(\mathrm{Ind}(V), W) \cong \mathrm{Hom}_H(V,
    \mathrm{Res}(W)) \cong \mathrm{Hom}_G(W, \mathrm{Ind}(V))$ by identifying induction with coinduction.
  locator: null
