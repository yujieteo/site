    with smooth projection $p \colon \mathbf{V}(\mathcal{E}) \to X$; the Euler class is the composite
    pullback $c_{\mathrm{top}}(\mathcal{E}) = s_0^* (s_0)_*(\mathbf{1}_X) \in H^{2r}(X, \mathbb{Z}(r))$,
    matching the derived self-intersection of the zero section.
