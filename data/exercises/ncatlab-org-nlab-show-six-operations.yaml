- id: ncatlab-org-nlab-show-six-operations#004
  text: How is a locally closed immersion (immersion) $f \colon X \to Y$ characterized in the six-functor
    formalism?
  hint: $f$ factors as $f = j \circ i$ where $i_* \cong i_!$ is fully faithful and $j^* \cong j^!$ with
    $j_!$ fully faithful; the composite $f_! \simeq j_! i_*$ is fully faithful.
