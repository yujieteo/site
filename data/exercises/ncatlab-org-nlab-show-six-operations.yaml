- id: ncatlab-org-nlab-show-six-operations#006
  text: Why is $j_!$ admitting a right adjoint $j^* \cong j^!$ needed for an open immersion?
  hint: Having $j_!$ as a left adjoint to $j^*$ makes $j^*$ commute with all limits and colimits simultaneously,
    which is the definition of an open subtopos and allows the localization sequence $j_! j^* \to \mathrm{id}
    \to i_* i^*$ to split the ambient category $\mathcal{D}(X)$ into complementary orthogonal subcategories.
