- id: ncatlab-org-nlab-show-six-operations#013
  text: Why are conservativity and preserving reflexive coequalizers the right criteria for modules over
    an endofunctor monad (Barr-Beck)?
  hint: Conservativity ensures the right adjoint $U$ does not destroy any non-zero objects or relations,
    while preserving reflexive coequalizers ensures that taking quotients of algebraic relations $R \rightrightarrows
    M \to M/R$ commutes with the forgetful functor, allowing the category to be reconstructed purely by
    generators and relations.
