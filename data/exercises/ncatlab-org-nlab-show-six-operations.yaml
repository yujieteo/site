    right adjoint $U$ is monadic if the comparison functor $\mathcal{D} \to \mathbf{Alg}_{U F}(\mathcal{C})$
    is an equivalence of categories, meaning every object in $\mathcal{D}$ is canonically reconstructed
    as an algebra/module over the monad $T = U F$. Translation: for an affine morphism $f \colon X \to
