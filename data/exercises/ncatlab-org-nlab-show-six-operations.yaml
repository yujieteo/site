  text: What does it mean for a functor between derived or triangulated categories to be t-exact, and
    how does this translate to classical algebraic geometry?
  hint: 'Meaning: a functor $F \colon \mathcal{D}(Y) \to \mathcal{D}(X)$ is t-exact if it preserves the
    connective and co-connective hearts ($\mathcal{D}_{\ge 0}$ and $\mathcal{D}_{\le 0}$), meaning it
    sends 0-truncated objects (classical sheaves) to 0-truncated objects without creating higher cohomology
    sheaves $H^{i \neq 0}(F(\mathcal{F})) = 0$. Translation: for a pullback $f^*$, t-exactness is equivalent
    to $f$ being flat (no higher $\mathrm{Tor}_i$ terms); for a pushforward $f_*$, t-exactness is equivalent
    to $f$ being affine (vanishing of higher direct images $R^{i > 0}f_* \mathcal{F} = 0$ for all quasi-coherent
    sheaves $\mathcal{F}$ by Serre''s affineness criterion).'
