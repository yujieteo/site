- id: ncatlab-org-nlab-show-six-operations#001
  text: Why does $f_! \cong f_*$ mean proper, and why is properness not needed for open immersions where
    $j_! \dashv j^*$?
  hint: The natural map $\alpha_f \colon f_! \to f_*$ forgets the condition of compact supports; when
    a space is already compact/proper, all sections already have compact support so $f_! \cong f_*$; for
    an open immersion $j$, $j$ is never proper (unless components split, proper morphisms are universally
    closed), so $j_! \not\cong j_*$, but $j_!$ exists as the exact extension-by-zero left adjoint to restriction
    $j^*$.
