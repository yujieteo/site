  text: What does it mean for a functor to be conservative, and how does this translate to classical algebraic
    geometry? .)
  hint: 'Meaning: a functor $F \colon \mathcal{C} \to \mathcal{D}$ is conservative if it reflects isomorphisms,
    meaning $F(f)$ is an isomorphism if and only if $f$ is an isomorphism (or for stable categories, $F(X)
    \simeq 0 \implies X \simeq 0$). Translation: for a scheme morphism $f \colon X \to Y$, $f^*$ being
    conservative on quasi-coherent sheaves means $f$ is surjective (no non-empty sheaf on $Y$ pulls back
