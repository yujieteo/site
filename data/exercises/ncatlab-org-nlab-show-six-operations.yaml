- id: ncatlab-org-nlab-show-six-operations#011
  text: How is $f^!$ the internal dualizing operator parameterizing the failure of $f_!$ to commute with
    duals, and what is an example?
  hint: In general, $(f_! \mathcal{F})^\vee \not\cong f_!(\mathcal{F}^\vee)$; the exceptional pullback
    fixes this via Grothendieck duality $(f_! \mathcal{F})^\vee \cong f_* \underline{\mathrm{Hom}}(\mathcal{F},
    f^!\mathbf{1})$; for example, if $X = \mathbb{R}^d$ and $f \colon \mathbb{R}^d \to *$, compactly supported
    cohomology $H_c^0(\mathbb{R}^d) = 0$ has dual $0$, but $f^!\mathbf{1} = \mathbf{1}[-d]$, so $H^{-d}(\mathbb{R}^d,
    \mathbf{1}[-d]) \cong \mathbb{R}$, which restores duality.
