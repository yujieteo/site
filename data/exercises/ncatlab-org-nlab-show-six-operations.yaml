- id: ncatlab-org-nlab-show-six-operations#039
  text: Why does the six-functor formalism unconditionally force the stability of smooth, proper, flat,
    and étale morphisms under base change?
  hint: Because the six-functor axioms require all natural transformations ($g^* f_! \cong (f')_! (g')^*$,
    $f^! g_* \cong (g')_* (f')^!$, and $f_!(A \otimes f^* B) \cong f_!(A) \otimes B$) to be isomorphisms
    for ALL Cartesian squares, so any property defined by an identity of functors ($f_! \cong f_*$, $f^!
    \cong f^*$, or $f^! \cong f^*(d)[2d]$) is preserved under base change by functorial substitution.
