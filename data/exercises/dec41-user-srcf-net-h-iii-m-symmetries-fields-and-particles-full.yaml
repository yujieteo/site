- id: dec41-user-srcf-net-h-iii-m-symmetries-fields-and-particles-full#000
  text: Why are symmetry groups used in physics?
  hint: Symmetries leave physical laws invariant; continuous global symmetries yield conserved charges
    via Noether's theorem.
  locator: null
  sub_index: null
  search_text: why are symmetry groups used in physics? symmetries leave physical laws invariant; continuous
    global symmetries yield conserved charges via noether's theorem.
- id: dec41-user-srcf-net-h-iii-m-symmetries-fields-and-particles-full#001
  text: Why are Lie algebras studied instead of Lie groups?
  hint: Lie algebras linearize the group near the identity, reducing non-linear group manifolds to linear
    algebra.
  locator: null
  sub_index: null
  search_text: why are lie algebras studied instead of lie groups? lie algebras linearize the group near
    the identity, reducing non-linear group manifolds to linear algebra.
- id: dec41-user-srcf-net-h-iii-m-symmetries-fields-and-particles-full#002
  text: What is a matrix Lie group?
  hint: A closed subgroup of $\mathrm{GL}_n(\mathbb{C})$, such as $\mathrm{SO}(n)$, $\mathrm{SU}(n)$,
    or $\mathrm{Sp}(n)$.
  locator: null
  sub_index: null
  search_text: what is a matrix lie group? a closed subgroup of $\mathrm{gl}_n(\mathbb{c})$, such as $\mathrm{so}(n)$,
    $\mathrm{su}(n)$, or $\mathrm{sp}(n)$.
- id: dec41-user-srcf-net-h-iii-m-symmetries-fields-and-particles-full#003
  text: What is the orthogonal group $\mathrm{O}(n)$?
  hint: The group of real matrices preserving the Euclidean inner product $M^T M = I$, with $\det M =
    \pm 1$.
  locator: null
  sub_index: null
  search_text: what is the orthogonal group $\mathrm{o}(n)$? the group of real matrices preserving the
    euclidean inner product $m^t m = i$, with $\det m = \pm 1$.
- id: dec41-user-srcf-net-h-iii-m-symmetries-fields-and-particles-full#004
  text: What is the unitary group $\mathrm{U}(n)$?
  hint: The group of complex matrices preserving the Hermitian inner product $U^\dagger U = I$.
  locator: null
  sub_index: null
  search_text: what is the unitary group $\mathrm{u}(n)$? the group of complex matrices preserving the
    hermitian inner product $u^\dagger u = i$.
- id: dec41-user-srcf-net-h-iii-m-symmetries-fields-and-particles-full#005
  text: Why is the Lorentz group $\mathrm{O}(3, 1)$ non-compact?
  hint: It preserves the indefinite Minkowski metric $\eta = \operatorname{diag}(1, -1, -1, -1)$, allowing
    unbounded boost parameters.
  locator: null
