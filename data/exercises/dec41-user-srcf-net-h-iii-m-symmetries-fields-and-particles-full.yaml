- id: dec41-user-srcf-net-h-iii-m-symmetries-fields-and-particles-full#008
  text: What is the Poincaré-Hopf theorem?
  hint: 'The sum of indices of zeros of a smooth vector field on a compact manifold equals its Euler characteristic:
    $\sum \operatorname{ind}(X) = \chi(M)$.'
