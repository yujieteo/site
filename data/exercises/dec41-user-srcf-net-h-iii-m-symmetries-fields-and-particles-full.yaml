- id: dec41-user-srcf-net-h-iii-m-symmetries-fields-and-particles-full#006
  text: How does one compute the Lie algebra $\mathfrak{su}(n)$?
  hint: 'Traceless anti-Hermitian $n \times n$ matrices: $\mathfrak{su}(n) = \{X \in M_n(\mathbb{C}) \mid
    X^\dagger = -X, \operatorname{Tr}(X) = 0\}$.'
  locator: null
  sub_index: null
  search_text: 'how does one compute the lie algebra $\mathfrak{su}(n)$? traceless anti-hermitian $n \times
    n$ matrices: $\mathfrak{su}(n) = \{x \in m_n(\mathbb{c}) \mid x^\dagger = -x, \operatorname{tr}(x)
    = 0\}$.'
- id: dec41-user-srcf-net-h-iii-m-symmetries-fields-and-particles-full#007
  text: Why is $\mathrm{SU}(2)$ the universal covering group of $\mathrm{SO}(3)$?
  hint: $\mathrm{SU}(2) \cong S^3$ is simply connected and has a $2:1$ covering homomorphism onto $\mathrm{SO}(3)
    \cong \mathbb{RP}^3$.
