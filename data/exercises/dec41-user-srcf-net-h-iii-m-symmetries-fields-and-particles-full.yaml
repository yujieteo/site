- id: dec41-user-srcf-net-h-iii-m-symmetries-fields-and-particles-full#009
  text: What is the Baker-Campbell-Hausdorff formula?
  hint: Expresses $\ln(e^X e^Y) = X + Y + \frac{1}{2}[X, Y] + \frac{1}{12}[X, [X, Y]] - \frac{1}{12}[Y,
    [X, Y]] + \dots$ purely in terms of Lie brackets.
  locator: null
