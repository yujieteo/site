  text: How does one invent the notion of the matrix Lie groups?
  hint: not all matrices are invertible, so one invents the general linear group over the field. These
    are Lie groups. One proves for SL(2, R) by counting argument on coordinate patches for all points
    a nonzero, d = 1 + bc/a, then cover all of SL(2, R), so it has dimension 3, one can do a similar counting
    argument by induction to prove existence of matrix Lie groups, and then compute the dimension. Subgroups
    of GL_n are matrix Lie groups
