  text: 'Why do empirical probabilities, defined via ratios $n_i : n_j$ of occurrence counts, naturally
    live in a projective space rather than in $\mathbb{R}^I$?'
  hint: since the normalizing total $\sum_i n_i$ (and sometimes even the full index set $I$) is often
    unavailable, only the ratios among the $n_i$ are meaningful, so probability distributions on $I$ properly
    reside in the projective space $(\mathbb{R}^I \setminus 0)/\mathbb{R}^\times_+$ rather than in the
    vector space $\mathbb{R}^I$.
