  text: 'Define a reduction $f: P \to Q$ of finite measure spaces'
  hint: 'a map of underlying sets $f: \mathrm{set}(P) \to \mathrm{set}(Q)$ such that for every $q \in
    Q$, the fiber $P_q = f^{-1}(q)$ satisfies $|P_q| = |q|$, i.e. the total mass of the preimage of $q$
    equals the mass assigned to $q$ in $Q$.'
