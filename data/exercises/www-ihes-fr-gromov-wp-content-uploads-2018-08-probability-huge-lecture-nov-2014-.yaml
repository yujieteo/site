  text: Why does Chomsky's remark that "the probability of a sentence is a useless notion" motivate replacing
    number-valued probabilities for linguistic events with something else?
  hint: linguistic events form category-theoretic "ensembles" structurally unlike physical events; their
    "probabilities" should instead be modeled as functors from a category of linguistic events into a
    smaller combinatorial category, e.g. of weighted trees, rather than as real numbers.
