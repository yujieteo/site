- id: www-ihes-fr-gromov-wp-content-uploads-2018-08-probability-huge-lecture-nov-2014-#001
  text: What is "tensorization symmetry," and how does it survive even for a biased Bernoulli measure
    $X = \{\circ_p, \bullet_{1-p}\}^S$ with $p \ne 1/2$?
  hint: although the full Haar symmetry visible at $p = 1/2$ disappears, $X$ can still be decomposed in
    many ways as a Cartesian product of copies of itself, since every partition of the countable set $S$
    into infinite subsets $S = S_1 \sqcup S_2$ induces $X \cong X_{S_1} \times X_{S_2}$.
