- id: www-ihes-fr-gromov-wp-content-uploads-2018-08-probability-huge-lecture-nov-2014-#000
  text: Why is "classical probability" said to depend on quasi-invariant Haar-like measures?
  hint: the infinite product measure on the space $X = \{\circ, \bullet\}^{\mathbb{N}}$ of binary sequences
    is invariant under the compact group $\mathbb{Z}_2^{\mathbb{N}}$ and is also acted on by the infinite
    permutation group of $\mathbb{N}$, exhibiting both a genuine group-invariance and a combinatorial
    symmetry that a naive definition of "randomness" would not predict.
  locator: null
