    computation for $Y$ gives $\mathrm{ent}(Y : \Delta_\infty) = \mathrm{ent}(Q)$; the $\mathbb{Z}$-equivariant
    isomorphism forces these two renormalized entropies to agree, giving $\mathrm{ent}(P) = \mathrm{ent}(Q)$.'
