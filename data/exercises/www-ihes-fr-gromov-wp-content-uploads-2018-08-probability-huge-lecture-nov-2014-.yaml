  text: List the five proposed alternatives to classical Kolmogorov probability and Shannon entropy
  hint: (1) entropy defined via a Grothendieck semigroup; (2) probability spaces modeled as covariant
    functors; (3) large deviations and nonstandard analysis for classical and quantum entropies; (4) linearized
    measures, probabilities, and entropies; (5) combinatorial probability with limited symmetry groups.
