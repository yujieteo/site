  text: Beyond biased coin-flip sequences, which classical measures most strongly exhibit tensorization
    symmetry?
  hint: Gaussian measures and Brownian/Wiener measures exhibit it prominently, and Gibbsian (Boltzmann)
    measures exhibit it to a lesser degree; this tensorization underlies both the Bernoulli Approximation
    Theorem and Boltzmann entropy.
