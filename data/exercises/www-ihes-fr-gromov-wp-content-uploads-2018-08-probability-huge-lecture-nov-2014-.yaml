  text: Why does Gromov argue that Boltzmann's statistical mechanics is more naturally modeled by nonstandard
    analysis and Grothendieck-style category theory than by Kolmogorov's set theory?
  hint: the "space of states" of a physical system is not literally a mathematician's set but rather a
    class of mutually equivalent idealized experimental protocols, which is better captured by nonstandard
    infinitesimal structures or categorical formalism than by an explicit measure space.
