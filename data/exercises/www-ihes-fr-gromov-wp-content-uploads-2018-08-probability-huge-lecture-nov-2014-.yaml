  text: In Kolmogorov's 1933 set-theoretic formulation (extending Buffon's 1733 needle problem), how is
    the probability of an event $Y$ defined?
  hint: random events are represented as subdomains $Y$ of a reference space (e.g. a unit square), and
    the probability of $Y$ is simply defined to be its area/measure.
