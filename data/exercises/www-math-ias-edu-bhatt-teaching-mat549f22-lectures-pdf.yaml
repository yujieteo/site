- id: www-math-ias-edu-bhatt-teaching-mat549f22-lectures-pdf#010
  text: How does pushforward stability in $\ell$-adic sheaves capture the fact that étale cohomology groups
    $H_{\text{ét}}^i(X_{\overline{k}}, \mathbb{Q}_\ell)$ are naturally continuous finite-dimensional Galois
    representations?
  hint: 'Motivation: explain why the cohomology of a variety over $k$ carries an action of the Galois
    group $G_k$. Invention: let $a_X \colon X \to \mathrm{Spec}(k)$ be the structure map; Grothendieck''s
    constructibility theorem ensures that the derived pushforward $(a_X)_*(\underline{\mathbb{Q}}_\ell)
    \in \mathcal{D}_c^b(\mathrm{Spec}(k), \mathbb{Q}_\ell)$ is a bounded complex of constructible Galois
    representations, so its $i$-th cohomology group $H^i((a_X)_*\underline{\mathbb{Q}}_\ell) \cong H_{\text{ét}}^i(X_{\overline{k}},
    \mathbb{Q}_\ell)$ is a continuous finite-dimensional representation of $\mathrm{Gal}(\overline{k}/k)$.
    Easy way to remember: pushing forward down to a point packages the étale cohomology into a finite-dimensional
    Galois representation automatically.'
