  text: In Bhatt's Example 2.1.6, how is the Cartier isomorphism computed explicitly for the torus $X
    = \mathbb{G}_m = \mathrm{Spec}(\mathbb{F}_p[t^{\pm 1}])$?
  hint: 'Motivation: observe $\mathcal{H}^i(F_* \Omega_X^\bullet) \cong \Omega_{X^{(1)}}^i$ explicitly
    in coordinates. Invention: let $Y = \mathbb{G}_m = \mathrm{Spec}(\mathbb{F}_p[y^{\pm 1}])$ with relative
    Frobenius $y \mapsto t^p$; the complex decomposes into lines $\mathbb{F}_p t^i \xrightarrow{\cdot
    i} \mathbb{F}_p t^i \frac{dt}{t}$, and since $i \equiv 0 \pmod p \iff i \in p\mathbb{Z}$, the differential
    vanishes precisely on $p$-th powers $t^{pk} = y^k$, yielding $\mathcal{H}^0(\Omega^\bullet) = \bigoplus_k
    \mathbb{F}_p t^{pk} = \mathcal{O}_Y$ and $\mathcal{H}^1(\Omega^\bullet) = \bigoplus_k \mathbb{F}_p
    t^{pk}\frac{dt}{t} = \Omega_{Y/\mathbb{F}_p}^1$. Easy way to remember: $d(t^i) = 0 \iff p \mid i$;
    multiples of $p$ are powers of $y = t^p$, giving $\mathcal{O}_Y$ at $H^0$ and $\Omega_Y^1$ at $H^1$.'
