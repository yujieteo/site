    modulo powers of $\ell$, and a lisse sheaf is an $\ell$-adic local system given by a representation
    of the étale fundamental group.'
- id: www-math-ias-edu-bhatt-teaching-mat549f22-lectures-pdf#009
  text: How is the constructible derived category of a point $\mathcal{D}_c^b(\mathrm{Spec}(k), \mathbb{Q}_\ell)$
    computed as the derived category of Galois representations?
  hint: 'Motivation: identify the zero-dimensional base category of $\ell$-adic sheaves. Invention: since
    the étale site of $\mathrm{Spec}(k)$ is the category of finite continuous $\mathrm{Gal}(\overline{k}/k)$-sets,
    a constructible $\ell$-adic sheaf is precisely a continuous finite-dimensional $\ell$-adic representation
    $V$ of the absolute Galois group $G_k = \mathrm{Gal}(\overline{k}/k)$; its derived category is $\mathcal{D}_c^b(\mathrm{Spec}(k),
    \mathbb{Q}_\ell) \simeq \mathcal{D}^b(\mathbf{Rep}_{\mathbb{Q}_\ell}^{\mathrm{cont}}(G_k))$. Easy
    way to remember: over a point, étale sheaves are Galois representations, and their derived category
    is the derived category of continuous Galois modules.'
