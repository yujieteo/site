- id: www-math-ias-edu-bhatt-teaching-mat549f22-lectures-pdf#011
  text: How does the extension group $\mathrm{Ext}_{\mathcal{D}_c^b(X, \mathbb{Q}_\ell)}^i(\underline{\mathbb{Q}}_\ell,
    \underline{\mathbb{Q}}_\ell(j))$ compute absolute étale cohomology, and how does the Hochschild-Serre
    spectral sequence relate to the conjectural Bloch-Beilinson filtration?
  hint: 'Motivation: compute absolute étale cohomology over a non-algebraically closed field from geometric
    cohomology and Galois cohomology. Invention: $\mathrm{Ext}^i(\underline{\mathbb{Q}}_\ell, \underline{\mathbb{Q}}_\ell(j))
    \cong H_{\text{ét}}^i(X, \mathbb{Q}_\ell(j))$; the Leray spectral sequence for $a_X \colon X \to \mathrm{Spec}(k)$
    is the Hochschild-Serre spectral sequence $E_2^{p, q} = H^p(G_k, H_{\text{ét}}^q(X_{\overline{k}},
    \mathbb{Q}_\ell(j))) \implies H_{\text{ét}}^{p+q}(X, \mathbb{Q}_\ell(j))$, where the filtration on
    the abutment is conjectured by Beilinson to match the arithmetic filtration on motivic cohomology
    $C H^j(X, 2j - i) \otimes \mathbb{Q}_\ell$. Easy way to remember: Ext groups compute absolute étale
    cohomology, and the Hochschild-Serre spectral sequence filters it by Galois cohomology acting on geometric
    étale cohomology.'
