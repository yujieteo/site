    line bundles into their discrete topological chern class in $\mathrm{ns}(x)_\mathbb{q}$ plus their
    continuous deformation in the jacobian $\mathrm{pic}^0(x)$.'
- id: www-math-ias-edu-bhatt-teaching-mat549f22-lectures-pdf#008
  text: For a variety $X$ over a field $k$, what is the constructible derived category of $\ell$-adic
    sheaves $\mathcal{D}_c^b(X, \mathbb{Q}_\ell)$ and what is an invertible lisse $\ell$-adic sheaf?
  hint: 'Motivation: construct the algebraic analogue of the topological derived category for étale cohomology.
    Invention: $\mathcal{D}_c^b(X, \mathbb{Q}_\ell) := (\varprojlim_n \mathcal{D}_c^b(X_{\text{ét}}, \mathbb{Z}/\ell^n\mathbb{Z}))
    \otimes_{\mathbb{Z}_\ell} \mathbb{Q}_\ell$; a lisse $\ell$-adic sheaf $\mathcal{L}$ is a dualizable
    object whose cohomology sheaves are locally constant on the étale site, corresponding to a continuous
    finite-dimensional representation $\rho \colon \pi_1^{\text{ét}}(X, \overline{x}) \to \mathrm{GL}_r(\mathbb{Q}_\ell)$,
    and it is invertible if $r = 1$. Easy way to remember: an $\ell$-adic sheaf is a system of étale sheaves
    modulo powers of $\ell$, and a lisse sheaf is an $\ell$-adic local system given by a representation
    of the étale fundamental group.'
