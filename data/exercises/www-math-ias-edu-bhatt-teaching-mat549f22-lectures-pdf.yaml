  text: 'Explain the principle: when $R$ has characteristic 0, specifying a representation of the formal
    additive group $\widehat{\mathbb{G}}_a$ on an $R$-module $V$ is equivalent to specifying an endomorphism
    $t \colon V \to V$, and $\mathcal{D}_{\mathrm{qc}}(\mathcal{B}\widehat{\mathbb{G}}_a) \simeq \mathcal{D}(R[t])$'
  hint: 'Motivation: classify representations of formal Lie groups algebraically. Invention: an action
    $\rho \colon V \to V[[X]]$ is given by $\rho(v) = \exp(Xt)(v) = \sum \frac{t^n(v)}{n!} X^n$ where
    $t = \frac{d}{dX}\rho|_{X=0} \in \mathrm{End}_R(V)$; in characteristic 0, division by $n!$ is unique,
    setting an equivalence $\mathcal{D}_{\mathrm{qc}}(\mathcal{B}\widehat{\mathbb{G}}_a) \simeq \mathcal{D}(R[t])$
    where global sections are the fiber $R\Gamma(\mathcal{B}\widehat{\mathbb{G}}_a, M) \simeq \mathrm{fib}(M
    \xrightarrow{t} M)$. Easy way to remember: $\widehat{\mathbb{G}}_a$-representations in char 0 are
    $\exp(Xt)$, uniquely determined by the operator $t$; sheaves on $\mathcal{B}\widehat{\mathbb{G}}_a$
    are complexes with an endomorphism $t$, and cohomology is $\mathrm{fib}(t)$.'
