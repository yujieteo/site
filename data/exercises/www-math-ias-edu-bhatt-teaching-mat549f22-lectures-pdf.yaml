    sheaf operations. invention: let $a_x \colon x \to \mathrm{pt}$ be the structure map; since the constant
    object $\underline{\mathbb{q}}_x^h := a_x^*(\mathbb{q}_{\mathrm{pt}}^h) \in \mathcal{d}^b\mathbf{mhm}(x)$
    is a mixed hodge module, saito''s theorem on the stability of $\mathbf{mhm}$ under derived pushforward
