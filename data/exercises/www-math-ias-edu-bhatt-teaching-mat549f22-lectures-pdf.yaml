    in the unique cohomological degree $-d$ where its support condition $\dim \mathrm{supp}(\mathcal{h}^{-d})
    = d \le d$ is sharp. easy way to remember: perversity shifts the top-dimensional fundamental class
    to degree 0, centering the poincaré duality reflection axis at 0.'
- id: www-math-ias-edu-bhatt-teaching-mat549f22-lectures-pdf#003
  text: What is a Tate twist $\mathbb{Q}(n)$ in mixed Hodge modules and mixed Hodge structures?
  hint: 'Motivation: normalize the weights and Hodge types of algebraic cycle classes, Chern classes,
    and Poincaré pairings. Invention: the 1-dimensional pure Hodge structure of weight $-2n$ having underlying
    vector space $(2\pi i)^n \mathbb{Q} \subset \mathbb{C}$, concentrated in pure Hodge type $(-n, -n)$;
    tensoring an object $M \in \mathbf{MHM}(X)$ by $\mathbb{Q}(n)$ shifts the weight filtration by $W_k(M(n))
    = W_{k+2n}(M)$ and shifts the Hodge filtration by $F^p(M(n)) = F^{p+n}(M)$. Easy way to remember:
    $\mathbb{Q}(1)$ is the $H_1$ homology of $\mathbb{C}^\times$, with weight $-2$ and Hodge type $(-1,
    -1)$; twisting by $(n)$ lowers the weight by $2n$ and shifts Hodge indices by $-n$.'
  locator: null
  sub_index: null
  search_text: 'what is a tate twist $\mathbb{q}(n)$ in mixed hodge modules and mixed hodge structures?
    motivation: normalize the weights and hodge types of algebraic cycle classes, chern classes, and poincaré
    pairings. invention: the 1-dimensional pure hodge structure of weight $-2n$ having underlying vector
    space $(2\pi i)^n \mathbb{q} \subset \mathbb{c}$, concentrated in pure hodge type $(-n, -n)$; tensoring
    an object $m \in \mathbf{mhm}(x)$ by $\mathbb{q}(n)$ shifts the weight filtration by $w_k(m(n)) =
    w_{k+2n}(m)$ and shifts the hodge filtration by $f^p(m(n)) = f^{p+n}(m)$. easy way to remember: $\mathbb{q}(1)$
    is the $h_1$ homology of $\mathbb{c}^\times$, with weight $-2$ and hodge type $(-1, -1)$; twisting
    by $(n)$ lowers the weight by $2n$ and shifts hodge indices by $-n$.'
- id: www-math-ias-edu-bhatt-teaching-mat549f22-lectures-pdf#004
  text: How is the category of mixed Hodge modules on a point $\mathbf{MHM}(\mathrm{Spec}(\mathbb{C}))$
    computed?
  hint: 'Motivation: identify the zero-dimensional base category of mixed Hodge modules. Invention: for
    $X = \mathrm{pt}$, a $\mathcal{D}_{\mathrm{pt}}$-module is simply a complex vector space $V_\mathbb{C}$,
    the de Rham comparison matches it with a rational vector space $V_\mathbb{Q}$, and Saito''s axioms
    reduce precisely to Deligne''s definition of a polarizable mixed Hodge structure $(V_\mathbb{Q}, W_\bullet
    V_\mathbb{Q}, F^\bullet V_\mathbb{C})$ where the graded pieces $\mathrm{Gr}_k^W(V)$ admit polarization
    forms; thus $\mathbf{MHM}(\mathrm{pt}) \simeq \mathbf{MHS}_{\mathbb{Q}}^{\mathrm{pol}}$. Easy way
    to remember: over a point, space has no geometry, so mixed Hodge modules collapse to classical polarizable
    mixed Hodge structures.'
  locator: null
  sub_index: null
