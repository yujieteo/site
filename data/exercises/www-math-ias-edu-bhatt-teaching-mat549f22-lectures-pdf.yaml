    \simeq \mathcal{d}^b(\mathbf{mhs}_\mathbb{q}^{\mathrm{pol}})$; taking the $i$-th cohomology functor
    $h^i$ yields the canonical polarizable mixed hodge structure on $h^i(x, \mathbb{q})$. easy way to
    remember: pushforward along $x \to \mathrm{pt}$ preserves mixed hodge modules, so taking cohomology
    automatically produces a mixed hodge structure.'
- id: www-math-ias-edu-bhatt-teaching-mat549f22-lectures-pdf#006
  text: How does the extension group $\mathrm{Ext}_{\mathcal{D}^b\mathbf{MHM}(X)}^i(\underline{\mathbb{Q}}_X^H,
    \underline{\mathbb{Q}}_X^H(j))$ provide a Hodge-theoretic approximation to motivic cohomology?
  hint: 'Motivation: construct an archimedean realization of Beilinson''s motivic cohomology groups $H_{\mathcal{M}}^i(X,
    \mathbb{Q}(j))$. Invention: define the absolute Hodge / mixed Hodge module cohomology as $H_{\mathbf{MHM}}^i(X,
    \mathbb{Q}(j)) := \mathrm{Hom}_{\mathcal{D}^b\mathbf{MHM}(X)}(\underline{\mathbb{Q}}_X^H, \underline{\mathbb{Q}}_X^H(j)[i])
    \cong \mathrm{Ext}^i(\underline{\mathbb{Q}}_X^H, \underline{\mathbb{Q}}_X^H(j))$; for $X = \mathrm{pt}$,
    the group $\mathrm{Ext}_{\mathbf{MHS}}^1(\mathbb{Q}(0), \mathbb{Q}(j))$ is Carlson''s extension group,
    which computes the Deligne-Beilinson cohomology $H_{\mathcal{D}}^i(X, \mathbb{R}(j))$. Easy way to
    remember: Ext groups in mixed Hodge modules compute Deligne-Beilinson cohomology, which is the Hodge
    realization of motivic cohomology.'
  locator: null
