    forms; thus $\mathbf{mhm}(\mathrm{pt}) \simeq \mathbf{mhs}_{\mathbb{q}}^{\mathrm{pol}}$. easy way
    to remember: over a point, space has no geometry, so mixed hodge modules collapse to classical polarizable
    mixed hodge structures.'
- id: www-math-ias-edu-bhatt-teaching-mat549f22-lectures-pdf#005
  text: How does pushforward stability in $\mathbf{MHM}$ prove that the singular cohomology $H^i(X, \mathbb{Q})$
    of any complex algebraic variety carries a canonical mixed Hodge structure?
  hint: 'Motivation: prove Deligne''s theorem that all complex algebraic varieties have mixed Hodge structures
    using modern sheaf operations. Invention: let $a_X \colon X \to \mathrm{pt}$ be the structure map;
    since the constant object $\underline{\mathbb{Q}}_X^H := a_X^*(\mathbb{Q}_{\mathrm{pt}}^H) \in \mathcal{D}^b\mathbf{MHM}(X)$
    is a mixed Hodge module, Saito''s theorem on the stability of $\mathbf{MHM}$ under derived pushforward
    $(a_X)_*$ guarantees that $(a_X)_*(\underline{\mathbb{Q}}_X^H) \in \mathcal{D}^b\mathbf{MHM}(\mathrm{pt})
    \simeq \mathcal{D}^b(\mathbf{MHS}_\mathbb{Q}^{\mathrm{pol}})$; taking the $i$-th cohomology functor
    $H^i$ yields the canonical polarizable mixed Hodge structure on $H^i(X, \mathbb{Q})$. Easy way to
    remember: pushforward along $X \to \mathrm{pt}$ preserves mixed Hodge modules, so taking cohomology
    automatically produces a mixed Hodge structure.'
  locator: null
  sub_index: null
  search_text: 'how does pushforward stability in $\mathbf{mhm}$ prove that the singular cohomology $h^i(x,
    \mathbb{q})$ of any complex algebraic variety carries a canonical mixed hodge structure? motivation:
