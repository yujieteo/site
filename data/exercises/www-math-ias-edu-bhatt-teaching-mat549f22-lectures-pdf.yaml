- id: www-math-ias-edu-bhatt-teaching-mat549f22-lectures-pdf#000
  text: For a complex algebraic variety $X$, what is Saito's category of mixed Hodge modules $\mathbf{MHM}(X)$?
  hint: 'Motivation: construct a geometric category of coefficient sheaves over complex varieties that
    formalizes families of degenerating mixed Hodge structures while supporting Grothendieck''s six operations
    $(f^*, f_*, f_!, f^!, \otimes, \underline{\mathrm{Hom}})$. Invention: Morihiko Saito combined the
    Riemann-Hilbert correspondence for regular holonomic $\mathcal{D}_X$-modules with Deligne''s perverse
    sheaves and weight/Hodge filtrations: an object is a triple $(M, F^\bullet M, K, W_\bullet)$ where
    $M$ is a regular holonomic $\mathcal{D}_X$-module with a good Hodge filtration $F^\bullet M$, $K \in
    \mathbf{Perv}(X, \mathbb{Q})$ is a $\mathbb{Q}$-perverse sheaf matching the de Rham complex $\mathrm{DR}(M)
    \simeq K \otimes \mathbb{C}$, and $W_\bullet$ is a compatible weight filtration whose graded pieces
    are polarizable pure Hodge modules. Easy way to remember: a mixed Hodge module is a perverse sheaf
    whose local stalks carry smoothly degenerating, polarizable mixed Hodge structures.'
  locator: null
  sub_index: null
