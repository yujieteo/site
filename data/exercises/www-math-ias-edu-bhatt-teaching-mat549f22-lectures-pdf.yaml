  text: In Bhatt's Example 1.4.4, how is the syntomification $X^{\mathrm{Syn}}$ of a perfect field $k$
    of characteristic $p$ constructed explicitly?
  hint: 'Motivation: compute the stacks $X_\mathbin{\Delta}$, $X^{\mathcal{N}}$, and $X^{\mathrm{Syn}}$
    on the base space $X = \mathrm{Spec}(k)$. Invention: (1) The prismatization is $X_\mathbin{\Delta}
    = \mathrm{Spf}(W(k))$; (2) The Nygaard filtered prismatization is $X^{\mathcal{N}} = [\mathrm{Spf}(W(k)[u,
    t]/(ut - p)) / \mathbb{G}_m]$, which contains two open substacks $X_{u \neq 0}^{\mathcal{N}} \cong
    \mathrm{Spf}(W(k))$ and $X_{t \neq 0}^{\mathcal{N}} \cong \mathrm{Spf}(W(k))$; (3) The syntomification
    $X^{\mathrm{Syn}}$ is the pushout stack gluing $X_{u \neq 0}^{\mathcal{N}}$ and $X_{t \neq 0}^{\mathcal{N}}$
    via the Frobenius $\phi^{-1}$ and the identity $\mathrm{id}$: $$X_{u \neq 0}^{\mathcal{N}} \amalg
    X_{t \neq 0}^{\mathcal{N}} \xrightarrow{(\phi^{-1}, \mathrm{id})} X_\mathbin{\Delta} \implies X^{\mathrm{Syn}}
    = X^{\mathcal{N}} \cup_{X_\mathbin{\Delta} \amalg X_\mathbin{\Delta}} X_\mathbin{\Delta}.$$ Due to
    the Frobenius twist, $X^{\mathrm{Syn}}$ is only $\mathbb{Z}_p$-linear, reflecting the fact that syntomic
    cohomology is $\mathbb{Z}_p$-linear. Easy way to remember: for a perfect field $k$, $X^{\mathrm{Syn}}$
    is obtained by gluing the two open copies of $\mathrm{Spf}(W(k))$ inside the Rees stack $[\mathrm{Spf}(W(k)[u,
    t]/(ut-p))/\mathbb{G}_m]$ along the Frobenius automorphism $\phi$.'
