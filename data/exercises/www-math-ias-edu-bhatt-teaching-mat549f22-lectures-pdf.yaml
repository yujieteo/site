  text: In Section 2.1 (Points 3, 4, 5), what are the core properties of Poincaré duality and Cartier
    theory for the algebraic de Rham complex?
  hint: 'Motivation: establish duality and characteristic-$p$ decomposition tools for de Rham cohomology.
    Invention: (1) Poincaré duality: for smooth proper $f \colon X \to S$ of dimension $n$, the trace
    $t_{X/S} \colon R^{2n}f_* \Omega_{X/S}^\bullet \to \mathcal{O}_S$ induces a perfect pairing $Rf_*
    \Omega_{X/S}^\bullet \otimes^{\mathbf{L}} Rf_* \Omega_{X/S}^\bullet \to \mathcal{O}_S[-2n]$; (2) Cartier
    isomorphism: in char $p$, $\mathcal{H}^i(F_{X/S, *} \Omega_{X/S}^\bullet) \cong \Omega_{X^{(1)}/S}^i$
    since $d(f^p) = 0$; (3) Conjugate filtration: Postnikov truncations on $F_* \Omega_X^\bullet$ yield
    $E_2^{p, q} = R^p f_*^{(1)} \Omega_{X^{(1)}/S}^q \implies R^{p+q} f_* \Omega_{X/S}^\bullet$. Easy
    way to remember: Poincaré duality pairs degree $i$ with $2n-i$; Cartier isomorphism identifies de
    Rham cohomology sheaves in char $p$ with differential forms on the Frobenius twist $X^{(1)}$.'
