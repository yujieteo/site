    $\mathrm{dr}(m) \simeq k \otimes \mathbb{c}$, and $w_\bullet$ is a compatible weight filtration whose
    graded pieces are polarizable pure hodge modules. easy way to remember: a mixed hodge module is a
    perverse sheaf whose local stalks carry smoothly degenerating, polarizable mixed hodge structures.'
- id: www-math-ias-edu-bhatt-teaching-mat549f22-lectures-pdf#001
  text: What is a perverse sheaf on a complex algebraic variety $X$?
  hint: 'Motivation: find an abelian category of constructible complexes on singular spaces on which intersection
    cohomology and intermediate extensions behave like simple modules, satisfying Poincaré-Verdier self-duality.
    Invention: Beilinson, Bernstein, and Deligne defined $\mathbf{Perv}(X, \mathbb{Q}) \subset \mathcal{D}_c^b(X,
    \mathbb{Q})$ as the heart of a non-standard $t$-structure by imposing support and cosupport conditions
    on cohomology sheaves: $\dim \mathrm{supp}(\mathcal{H}^{-i}(\mathcal{F})) \le i$ and $\dim \mathrm{supp}(\mathcal{H}^{-i}(\mathbb{D}\mathcal{F}))
    \le i$ for all $i \in \mathbb{Z}$. Easy way to remember: a perverse sheaf is a complex of sheaves
    shifted so that its middle-dimensional cohomology lives in degree $-\dim(X)$, ensuring that the Poincaré
    dual $\mathbb{D}\mathcal{F}$ satisfies the exact same support bounds.'
  locator: null
  sub_index: null
  search_text: 'what is a perverse sheaf on a complex algebraic variety $x$? motivation: find an abelian
    category of constructible complexes on singular spaces on which intersection cohomology and intermediate
    extensions behave like simple modules, satisfying poincaré-verdier self-duality. invention: beilinson,
    bernstein, and deligne defined $\mathbf{perv}(x, \mathbb{q}) \subset \mathcal{d}_c^b(x, \mathbb{q})$
    as the heart of a non-standard $t$-structure by imposing support and cosupport conditions on cohomology
    sheaves: $\dim \mathrm{supp}(\mathcal{h}^{-i}(\mathcal{f})) \le i$ and $\dim \mathrm{supp}(\mathcal{h}^{-i}(\mathbb{d}\mathcal{f}))
    \le i$ for all $i \in \mathbb{z}$. easy way to remember: a perverse sheaf is a complex of sheaves
    shifted so that its middle-dimensional cohomology lives in degree $-\dim(x)$, ensuring that the poincaré
    dual $\mathbb{d}\mathcal{f}$ satisfies the exact same support bounds.'
- id: www-math-ias-edu-bhatt-teaching-mat549f22-lectures-pdf#002
  text: Why does a dimension shift cause perversity, and why is the constant sheaf $\underline{\mathbb{Q}}_X[\dim
    X]$ perverse on a smooth variety?
  hint: 'Motivation: ensure that smooth manifolds and varieties of dimension $d$ have self-dual intersection
    complexes matching the ordinary constant sheaf. Invention: on a smooth variety $X$ of dimension $d$,
    Verdier duality on the constant sheaf gives $\mathbb{D}(\underline{\mathbb{Q}}_X) \simeq \underline{\mathbb{Q}}_X[2d]$;
    shifting the complex by $d$ yields $\mathbb{D}(\underline{\mathbb{Q}}_X[d]) \simeq \underline{\mathbb{Q}}_X[d]$,
    making $\underline{\mathbb{Q}}_X[d]$ self-dual and concentrated in the unique cohomological degree
    $-d$ where its support condition $\dim \mathrm{supp}(\mathcal{H}^{-d}) = d \le d$ is sharp. Easy way
    to remember: perversity shifts the top-dimensional fundamental class to degree 0, centering the Poincaré
    duality reflection axis at 0.'
  locator: null
  sub_index: null
