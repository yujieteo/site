  text: How does the exterior product of differential forms turn the algebraic de Rham complex $\Omega_{X/S}^\bullet$
    into a commutative differential graded algebra (cdga), and how is the Hodge complex computed similarly?
  hint: 'Motivation: equip $R\Gamma(X, \Omega_{X/S}^\bullet)$ with an intrinsic cup product at the cochain
    level. Invention: define multiplication via the wedge product $\wedge$ satisfying the graded Leibniz
    rule $d(\alpha \wedge \beta) = d\alpha \wedge \beta + (-1)^{\deg(\alpha)} \alpha \wedge d\beta$ and
    graded commutativity $\alpha \wedge \beta = (-1)^{\deg(\alpha)\deg(\beta)} \beta \wedge \alpha$; the
    Hodge complex $\bigoplus_{i} \Omega_{X/S}^i[-i]$ has the exact same graded-commutative algebra structure
    via wedge product but with zero differential $d = 0$. Easy way to remember: de Rham is forms with
    $d$; Hodge is the same algebra of forms with $d = 0$.'
