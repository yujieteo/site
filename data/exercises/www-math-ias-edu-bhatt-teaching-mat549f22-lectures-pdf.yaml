  text: In Bhatt's Example 1.3.2, how does one compute the syntomic cohomology of $E = \mathcal{O}\{1\}$
    (where $E^*\{1\} = \mathcal{O}$) using Kummer theory?
  hint: 'Motivation: explicitly verify the Lagrangian fiber sequence of Theorem 1.3.1 (3) on the Tate
    twist $\mathcal{O}\{1\}$. Invention: by Kummer theory on $\mathrm{Spf}(\mathbb{Z}_p)$, $H_{\mathrm{syn}}^1(\mathcal{O}\{1\})
    = H_{\mathrm{fl}}^1(\mathrm{Spf}(\mathbb{Z}_p), \mathbb{Z}_p(1)) \cong (\mathbb{Z}_p^\times)^\wedge$
    and $H^i = 0$ for $i \neq 1$; for Galois cohomology, $H^1(G_{\mathbb{Q}_p}, \mathbb{Z}_p(1)) \cong
    (\mathbb{Q}_p^\times)^\wedge$, $H^2 \cong \mathbb{Z}_p$, and $H^0 = 0$; for the dual $E^*\{1\} = \mathcal{O}$,
    $H_{\mathrm{syn}}^0(\mathcal{O}) = H_{\text{ét}}^0(\mathrm{Spec}(\mathbb{F}_p), \mathbb{Z}_p) \cong
    \mathbb{Z}_p$ and $H_{\mathrm{syn}}^1(\mathcal{O}) \cong \pi^\vee = \mathrm{Hom}(\mathrm{Gal}(\overline{\mathbb{F}}_p/\mathbb{F}_p),
    \mathbb{Z}_p) \cong \mathbb{Z}_p$; substituting into the degree-1 sequence yields the exact sequence
    $0 \to (\mathbb{Z}_p^\times)^\wedge \to (\mathbb{Q}_p^\times)^\wedge \xrightarrow{v_p} \mathbb{Z}_p
    \to 0$ induced by the $p$-adic valuation map. Easy way to remember: the syntomic sequence for $\mathcal{O}\{1\}$
    is the $p$-adic completion of the valuation sequence $0 \to \mathbb{Z}_p^\times \to \mathbb{Q}_p^\times
    \to \mathbb{Z} \to 0$.'
