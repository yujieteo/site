  text: What is the Lagrangian refinement of Tate duality in syntomic cohomology and $p$-adic Hodge theory?
  hint: 'Motivation: refine classical local Tate duality $H^i(K, V) \times H^{2-i}(K, V^*(1)) \to \mathbb{Q}_p$
    into a geometric self-duality on the de Rham and syntomic complexes of schemes over $\mathcal{O}_K$.
    Invention: for a proper smooth scheme $X$ over $\mathcal{O}_K$ and an $F$-gauge $\mathcal{E}$, the
    pairing $\mathbf{R}\Gamma_{\mathrm{syn}}(X, \mathcal{E}) \otimes^{\mathbf{L}} \mathbf{R}\Gamma_{\mathrm{syn}}(X,
    \mathcal{E}^\vee\{d\}[2d]) \to \mathbb{Z}_p$ exhibits the syntomic complex as an isotropic / Lagrangian
    subspace inside the ambient de Rham and crystalline cohomology under the Poincaré-Verdier trace pairing.
    Easy way to remember: the syntomic complex is the arithmetic Lagrangian subcomplex where the Frobenius
    fixed points $\Phi = 1$ cut out half the dimension of the de Rham space under Tate duality.'
