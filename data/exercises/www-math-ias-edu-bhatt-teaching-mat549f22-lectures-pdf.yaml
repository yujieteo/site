  text: What is the étale realization functor $\mathrm{ev}_{\text{ét}} \colon \mathbf{Gauge}(X) \to \mathbf{Loc}_{\mathbb{Z}_p}(X_{\eta})$
    for a prismatic $F$-gauge?
  hint: 'Motivation: extract the underlying topological $p$-adic étale local system from an algebraic
    $F$-gauge on a $p$-adic scheme. Invention: restrict the $F$-gauge $\mathcal{E}$ to the generic fiber
    / perfectoid locus where the Cartier ideal $I$ is inverted, and take the Frobenius-fixed submodule
    $T_p(\mathcal{E}) := (\mathcal{E}|_{X_\eta[1/I]})^{\Phi = 1}$, which forms a lisse $\mathbb{Z}_p$-local
    system on the generic fiber $X_\eta$ by the Artin-Schreier-Witt theorem. Easy way to remember: étale
    realization is taking the Frobenius-fixed points $(\Phi = 1)$ of the gauge bundle after inverting
    the Cartier ideal on the generic fiber.'
