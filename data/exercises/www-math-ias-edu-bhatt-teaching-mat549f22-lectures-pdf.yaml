  text: In Bhatt's Example 2.1.3, how is the algebraic de Rham cohomology of the torus $X = \mathbb{G}_m
    = \mathrm{Spec}(\mathbb{C}[t^{\pm 1}])$ computed explicitly?
  hint: 'Motivation: verify Grothendieck''s comparison $H_{\mathrm{dR}}^i(\mathbb{G}_m/\mathbb{C}) \cong
    H_{\mathrm{sing}}^i(\mathbb{C}^\times, \mathbb{C})$. Invention: decompose $\Omega_{\mathbb{C}[t^{\pm
    1}]/\mathbb{C}}^\bullet = (\mathbb{C}[t^{\pm 1}] \xrightarrow{d} \mathbb{C}[t^{\pm 1}]\frac{dt}{t})$
    into 1D eigenspaces under the Euler operator $t\frac{d}{dt}$; for $i \neq 0$, $t^i \mapsto i t^i \frac{dt}{t}$
    is an isomorphism, while for $i = 0$, $d(1) = 0$ and $1\frac{dt}{t}$ is not in the image, yielding
    $H^0(\mathbb{G}_m, \Omega^\bullet) \cong \mathbb{C} \cdot 1$, $H^1(\mathbb{G}_m, \Omega^\bullet) \cong
    \mathbb{C} \cdot \frac{dt}{t}$, and $H^i = 0$ for $i \notin [0, 1]$. Easy way to remember: differentiation
    multiplies $t^i$ by $i$; only $i=0$ has zero derivative, leaving $\mathbb{C}$ at degree 0 and $\mathbb{C}\frac{dt}{t}$
    at degree 1.'
