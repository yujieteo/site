  text: What is a $\delta$-ring (in the sense of Joyal)?
  hint: A commutative ring $A$ equipped with a set-theoretic map $\delta \colon A \to A$ satisfying $\delta(0)
    = \delta(1) = 0$, $\delta(x + y) = \delta(x) + \delta(y) - \sum_{i=1}^{p-1} \frac{1}{p}\binom{p}{i}
    x^i y^{p-i}$, and $\delta(x y) = x^p \delta(y) + y^p \delta(x) + p \delta(x)\delta(y)$, so that $\phi(x)
    := x^p + p \delta(x)$ is a ring endomorphism lifting the Frobenius.
