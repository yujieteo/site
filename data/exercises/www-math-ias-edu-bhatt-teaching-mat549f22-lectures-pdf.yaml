    which computes the deligne-beilinson cohomology $h_{\mathcal{d}}^i(x, \mathbb{r}(j))$. easy way to
    remember: ext groups in mixed hodge modules compute deligne-beilinson cohomology, which is the hodge
    realization of motivic cohomology.'
- id: www-math-ias-edu-bhatt-teaching-mat549f22-lectures-pdf#007
  text: How is the absolute Hodge cohomology group $H_{\mathbf{MHM}}^2(X, \mathbb{Q}(1))$ computed as
    the Picard group of an analytic variety, and how does it split into discrete and continuous parts?
  hint: 'Motivation: understand how Hodge modules decompose the geometry of line bundles into topological
    cycle classes and continuous Jacobian variations. Invention: the short exact sequence of mixed Hodge
    structures $0 \to \mathrm{Ext}_{\mathbf{MHS}}^1(\mathbb{Q}(0), H^1(X, \mathbb{Q}(1))) \to H_{\mathbf{MHM}}^2(X,
    \mathbb{Q}(1)) \to \mathrm{Hom}_{\mathbf{MHS}}(\mathbb{Q}(0), H^2(X, \mathbb{Q}(1))) \to 0$ computes
    $H_{\mathbf{MHM}}^2(X, \mathbb{Q}(1)) \cong \mathrm{Pic}(X) \otimes \mathbb{Q}$; the discrete quotient
    is the space of rational Hodge classes $\mathrm{Hdg}^2(X, \mathbb{Q}) = H^{1, 1}(X) \cap H^2(X, \mathbb{Q})
    \cong \mathrm{NS}(X) \otimes \mathbb{Q}$ (the Néron-Severi group), and the continuous kernel is the
    intermediate Jacobian $J^1(X) = H^1(X, \mathbb{C}) / (F^1 H^1(X, \mathbb{C}) + H^1(X, \mathbb{Z}(1)))
    \cong \mathrm{Pic}^0(X)$. Easy way to remember: $H_{\mathbf{MHM}}^2(X, \mathbb{Q}(1))$ decomposes
    line bundles into their discrete topological Chern class in $\mathrm{NS}(X)_\mathbb{Q}$ plus their
    continuous deformation in the Jacobian $\mathrm{Pic}^0(X)$.'
  locator: null
  sub_index: null
