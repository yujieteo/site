- id: gofling-me-paper-proj-20cech-20cohom-pdf#002
  text: How does one compute $H^0(\mathbb{P}^n, \mathcal{O}(d))$ in your head in two seconds for any dimension
    $n$ and twist $d$?
  hint: 'Motivation: count global sections of line bundles on $\mathbb{P}^n$. Invention: global sections
    of $\mathcal{O}(d)$ are ordinary homogeneous polynomials of degree $d$ in $n+1$ variables $T_0, \dots,
    T_n$. Mental trick: by stars-and-bars, placing $d$ identical powers into $n+1$ distinct variables
    gives $\binom{n+d}{n} = \binom{n+d}{d}$ for $d \ge 0$, and $0$ for $d < 0$. Quick check: on $\mathbb{P}^2$,
    $H^0(\mathcal{O}(2))$ has dimension $\binom{2+2}{2} = \binom{4}{2} = 6$ (the 6 quadratic monomials);
    for $d = -1$, it is $0$.'
