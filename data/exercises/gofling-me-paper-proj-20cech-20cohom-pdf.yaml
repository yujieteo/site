  text: 'Exercise 18.1.B: If $X$ is a quasicompact separated scheme and $\mathcal{F}$ is a quasicoherent
    sheaf, show that $H^0(X, \mathcal{F})$ computed by the Čech complex coincides with global sections
    $\Gamma(X, \mathcal{F})$'
  hint: For any open cover $\mathcal{U} = \{U_i\}$, the Čech 0-coboundary kernel is $\ker(d^0 \colon \prod
    \mathcal{F}(U_i) \to \prod \mathcal{F}(U_i \cap U_j)) = \{ (s_i) \mid s_i|_{U_{ij}} = s_j|_{U_{ij}}
    \}$, which is precisely the sheaf condition characterizing global sections $\Gamma(X, \mathcal{F})$.
  locator: null
  sub_index: null
