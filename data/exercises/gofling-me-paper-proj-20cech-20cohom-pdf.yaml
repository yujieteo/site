  text: 'Exercise 18.9.A: Use Chow''s Lemma to prove that for any proper morphism $f \colon X \to Y$ of
    Noetherian schemes and any coherent sheaf $\mathcal{F}$ on $X$, the direct image sheaves $R^i f_*
    \mathcal{F}$ are coherent on $Y$'
  hint: By Chow's Lemma, choose a projective birational map $\pi \colon X' \to X$ that is an isomorphism
    on a dense open $U \subset X$; let $Z = X \setminus U$ be the closed complement with $\dim Z < \dim
    X$. By Noetherian induction on the dimension of the support of $\mathcal{F}$, the higher direct images
    are coherent on $Z$; since $X' \to Y$ is projective, $R^i (f \circ \pi)_* (\pi^* \mathcal{F})$ is
    coherent by projective Čech theory, and the Leray spectral sequence for $\pi$ combined with 5-lemma
    on the excision sequence proves $R^i f_* \mathcal{F}$ is coherent.
