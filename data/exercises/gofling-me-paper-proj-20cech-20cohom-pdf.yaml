  text: How does the Koszul resolution compute the cohomology and Hilbert polynomial of a complete intersection
    $X = V(f_1, \dots, f_r) \subset \mathbb{P}^n$?
  hint: 'Motivation: calculate sheaf cohomology on subvarieties without leaving the ambient projective
    space. Invention: resolve the structure sheaf $\mathcal{O}_X$ by the Koszul complex $0 \to \bigwedge^r
    \mathcal{E}^\vee \to \dots \to \mathcal{E}^\vee \to \mathcal{O}_{\mathbb{P}^n} \to \mathcal{O}_X \to
    0$ where $\mathcal{E} = \bigoplus_{i=1}^r \mathcal{O}(d_i)$. Since all terms are direct sums of line
    bundles $\mathcal{O}(-k)$ whose cohomology on $\mathbb{P}^n$ is known, break the complex into short
    exact sequences to compute $H^*(X, \mathcal{O}_X(m))$ and Euler characteristics inductively.'
