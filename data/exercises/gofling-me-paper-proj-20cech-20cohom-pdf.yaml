- id: gofling-me-paper-proj-20cech-20cohom-pdf#007
  text: How does the Čech computation work concretely on $\mathbb{P}^1$ using two charts, and how does
    it generalize to higher dimensions?
  hint: 'Motivation: understand the base case $n=1$ before attacking general $n$. Invention: on $\mathbb{P}^1$,
    the covering is $U_0 = \mathrm{Spec}(k[t])$ and $U_1 = \mathrm{Spec}(k[t^{-1}])$ with overlap $U_0
    \cap U_1 = \mathrm{Spec}(k[t, t^{-1}])$. The Čech complex is $k[t] \oplus k[t^{-1}] \xrightarrow{d}
    k[t, t^{-1}]$ where $d(f, g) = g - t^d f$. Mental trick: $H^0$ is polynomials of degree $\le d$ (dimension
    $d+1$ for $d \ge 0$); $H^1$ is the space of un-cancelable negative Laurent poles $\{t^{-1}, \dots,
    t^{d+1}\}$ (dimension $-d-1$ for $d \le -2$). For $d = -1$, both $H^0 = 0$ and $H^1 = 0$.'
