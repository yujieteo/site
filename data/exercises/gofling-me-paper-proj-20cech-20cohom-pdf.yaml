  text: How does one compute the higher direct images $R^q \pi_*(\mathcal{O}_{\mathbb{P}(\mathcal{E})}(d))$
    for a projective bundle $\pi \colon \mathbb{P}(\mathcal{E}) \to S$ in your head?
  hint: 'Motivation: compute pushforwards along families of projective spaces. Invention: relative projective
    space behaves fiberwise like standard $\mathbb{P}^n$; for a rank-$(n+1)$ vector bundle $\mathcal{E}$
    on $S$: (1) $R^0 \pi_*(\mathcal{O}(d)) \cong \mathrm{Sym}^d(\mathcal{E})$ for $d \ge 0$; (2) $R^n
    \pi_*(\mathcal{O}(d)) \cong \mathrm{Sym}^{-n-1-d}(\mathcal{E})^\vee \otimes \det(\mathcal{E})^{-1}$
    for $d \le -n-1$; (3) $R^q \pi_*(\mathcal{O}(d)) = 0$ for all $0 < q < n$, reducing relative projective
    geometry to symmetric and determinant powers of $\mathcal{E}$.'
