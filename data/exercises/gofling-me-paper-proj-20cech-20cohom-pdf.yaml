- id: gofling-me-paper-proj-20cech-20cohom-pdf#003
  text: 'Exercise 18.2.D (Independence of Cover): Show that if $\mathcal{V}$ is an affine refinement of
    an affine cover $\mathcal{U}$, there is a canonical isomorphism $\check{H}^\bullet(\mathcal{U}, \mathcal{F})
    \xrightarrow{\sim} \check{H}^\bullet(\mathcal{V}, \mathcal{F})$'
  hint: Form the Čech double complex $C^{p, q} = \prod \mathcal{F}(U_{i_0 \dots i_p} \cap V_{j_0 \dots
    j_q})$; since each $U_{i_0 \dots i_p}$ is affine, the rows are acyclic in positive degrees with $H^0
    = \check{C}^p(\mathcal{U}, \mathcal{F})$, while the columns are acyclic in positive degrees with $H^0
    = \check{C}^q(\mathcal{V}, \mathcal{F})$; by the spectral sequence of a double complex, both edge
    maps compute the total cohomology, yielding $\check{H}^i(\mathcal{U}, \mathcal{F}) \cong \check{H}^i(\mathcal{V},
    \mathcal{F})$.
  locator: null
  sub_index: null
