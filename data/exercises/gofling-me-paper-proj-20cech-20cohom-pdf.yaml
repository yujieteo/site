- id: gofling-me-paper-proj-20cech-20cohom-pdf#009
  text: How does one compute the canonical bundle $\omega_X$ of a complete intersection $X = V(f_1, \dots,
    f_r) \subset \mathbb{P}^n$ of degrees $(d_1, \dots, d_r)$ in your head?
  hint: 'Motivation: determine whether a variety is Fano, Calabi-Yau, or of general type. Invention: apply
    the Adjunction Formula $\omega_X \cong \omega_{\mathbb{P}^n} \otimes \det(N_{X/\mathbb{P}^n}) \cong
    \mathcal{O}(-n-1) \otimes \mathcal{O}(\sum d_i) \cong \mathcal{O}_X(\sum d_i - n - 1)$. Mental trick:
    add the degrees of all defining equations and subtract $n+1$; $X$ is Calabi-Yau ($\omega_X \cong \mathcal{O}_X$)
    $\iff \sum d_i = n+1$. Examples: cubic curve in $\mathbb{P}^2$ ($3 = 2+1$), quartic surface in $\mathbb{P}^3$
    ($4 = 3+1$), quintic 3-fold in $\mathbb{P}^4$ ($5 = 4+1$), and complete intersection of a quadric
    and a cubic in $\mathbb{P}^4$ ($2+3 = 5 = 4+1$).'
