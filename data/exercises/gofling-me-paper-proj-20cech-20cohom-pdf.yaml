  text: 'Exercise 18.3.F: Combine the above results to write down the complete cohomology $H^i(\mathbb{P}_A^n,
    \mathcal{O}_{\mathbb{P}_A^n}(d))$ for all $i$ and all $d$'
  hint: (1) $H^0(\mathbb{P}_A^n, \mathcal{O}(d)) \cong A[x_0, \dots, x_n]_d$, which is a free $A$-module
    of rank $\binom{n+d}{n}$ for $d \ge 0$, and $0$ for $d < 0$; (2) $H^i(\mathbb{P}_A^n, \mathcal{O}(d))
    = 0$ for all $0 < i < n$ and all $d \in \mathbb{Z}$; (3) $H^n(\mathbb{P}_A^n, \mathcal{O}(d)) \cong
    \mathrm{Hom}_A(A[x_0, \dots, x_n]_{-n-1-d}, A)$, which is a free $A$-module of rank $\binom{-d-1}{n}$
    for $d \le -n-1$, and $0$ for $d \ge -n$.
