  text: 'Exercise 18.3.A: Compute the cohomology groups $H^i(\mathbb{P}_A^1, \mathcal{O}_{\mathbb{P}_A^1}(d))$
    for all $i \ge 0$ and all $d \in \mathbb{Z}$ using the standard affine open cover $\mathcal{U} = \{D_+(x_0),
    D_+(x_1)\}$'
  hint: The Čech complex is $A[x_1/x_0] \oplus A[x_0/x_1] \xrightarrow{d^0} A[x_0/x_1, x_1/x_0]$ where
    $d^0(f, g) = g - f$. For $\mathcal{O}(d)$, identifying sections on the overlap yields $d^0(x_1^a x_0^{d-a},
    x_0^b x_1^{d-b}) = x_0^b x_1^{d-b} - x_1^a x_0^{d-a}$. If $d \ge 0$, $\ker(d^0)$ is the free $A$-module
    generated by monomials $\{x_0^d, x_0^{d-1}x_1, \dots, x_1^d\}$ of rank $d+1$, and $\mathrm{coker}(d^0)
    = 0$. If $d = -1$, $\ker(d^0) = 0$ and $\mathrm{coker}(d^0) = 0$. If $d \le -2$, $\ker(d^0) = 0$ and
    $\mathrm{coker}(d^0)$ has an $A$-basis $\{x_0^{-1}x_1^{d+1}, x_0^{-2}x_1^{d+2}, \dots, x_0^{d+1}x_1^{-1}\}$
    of rank $-d-1$. Higher terms $\check{C}^p = 0$ for $p \ge 2$, so $H^i = 0$ for all $i \ge 2$.
  locator: null
