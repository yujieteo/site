  text: 'Exercise 18.2.F: Show that Čech cohomology commutes with arbitrary filtered colimits (and arbitrary
    direct sums) of quasicoherent sheaves on a quasicompact separated scheme'
  hint: On a quasicompact separated scheme, the affine cover $\mathcal{U}$ is finite; since taking sections
    on affine opens commutes with filtered colimits of quasicoherent sheaves and a finite direct product
    of modules commutes with filtered colimits, the finite Čech complex $\check{C}^\bullet(\mathcal{U},
    \varinjlim \mathcal{F}_i) \cong \varinjlim \check{C}^\bullet(\mathcal{U}, \mathcal{F}_i)$ commutes
    with colimits, and taking homology of chain complexes preserves filtered colimits.
