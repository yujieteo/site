  text: 'Exercise 18.3.A: Explicitly compute the cohomology of line bundles on the projective line $\mathbb{P}_A^1
    = \mathrm{Proj}(A[x_0, x_1])$ using the two-chart cover $\mathcal{U} = \{D_+(x_0), D_+(x_1)\}$'
  hint: The Čech complex is $A[t] \oplus A[t^{-1}] \xrightarrow{d} A[t, t^{-1}]$ where $t = x_1/x_0$ and
    $d(f(t), g(t^{-1})) = g(t^{-1}) - t^d f(t)$. (1) For $d \ge 0$, $\ker(d)$ is polynomials of degree
    $\le d$ (free of rank $d+1$), and $\mathrm{coker}(d) = 0$; (2) for $d = -1$, $\ker(d) = 0$ and $\mathrm{coker}(d)
    = 0$; (3) for $d \le -2$, $\ker(d) = 0$ and $\mathrm{coker}(d)$ has basis $\{t^{-1}, t^{-2}, \dots,
    t^{d+1}\}$ (free of rank $-d-1$).
