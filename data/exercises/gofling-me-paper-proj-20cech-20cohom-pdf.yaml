    \to H^n(\mathcal{F}'') \to 0$ is a finite-length exact sequence of finite-dimensional $k$-vector spaces.
    The alternating sum of dimensions of any finite exact sequence of vector spaces is identically zero,
    which immediately yields $\chi(X, \mathcal{F}) = \chi(X, \mathcal{F}') + \chi(X, \mathcal{F}'')$.
