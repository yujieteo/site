- id: gofling-me-paper-proj-20cech-20cohom-pdf#001
  text: How does the negative support set $\mathrm{NEG}(\vec{e}) = \{i \mid e_i < 0\}$ classify the cohomology
    of a monomial into three distinct cases, and how do you evaluate it in your head?
  hint: 'Motivation: eliminate all intermediate homological boundary checks. Invention: (1) Case $\mathrm{NEG}(\vec{e})
    = \emptyset$ (all $e_i \ge 0$): the monomial has no denominators, belongs to every affine chart, and
    survives in $H^0$; (2) Case $\mathrm{NEG}(\vec{e}) = \{0, 1, \dots, n\}$ (all $e_i < 0$): the monomial
    has poles along every coordinate hyperplane, lives only on the $(n+1)$-fold intersection $U_0 \cap
    \dots \cap U_n$, and has nowhere to map, surviving in $H^n$; (3) Case $\emptyset \subsetneq \mathrm{NEG}(\vec{e})
    \subsetneq \{0, 1, \dots, n\}$: choosing any non-negative coordinate index $j \notin \mathrm{NEG}(\vec{e})$
    acts as a contracting cone vertex, producing an explicit null-homotopy $h(s) = s \cup \{j\}$ that
    proves $H^q = 0$ for all $0 < q < n$.'
