    with intersection $U_0 \cap U_1 = \mathrm{Spec}(k[t, t^{-1}])$; the Čech complex is $k[t] \oplus k[t^{-1}]
    \xrightarrow{d} k[t, t^{-1}]$ where $d(f, g) = g - f$. For $\mathcal{O}(d)$, the transition function
    is $t^d$, so $d(f, g) = g - t^d f$. Mental trick: (1) $H^0 = \ker(d)$ is polynomials of degree $\le
