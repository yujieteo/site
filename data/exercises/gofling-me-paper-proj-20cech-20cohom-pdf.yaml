- id: gofling-me-paper-proj-20cech-20cohom-pdf#000
  text: What was the original geometric motivation for Serre and Grothendieck computing the Čech cohomology
    $H^*(\mathbb{P}^n, \mathcal{O}(d))$, and why does the multi-grading by monomial weights make the entire
    infinite-dimensional calculation computable?
  hint: 'Motivation: find an exact algebraic formula for sheaf cohomology on projective space without
    using continuous analysis or transcendental Hodge theory. Invention: cover $\mathbb{P}^n$ by the $n+1$
    standard affine opens $U_i = D_+(T_i)$; on intersections $U_{i_0} \cap \dots \cap U_{i_p}$, sections
    are localized Laurent polynomials. The key insight is that the Čech differential preserves the multi-exponent
    vector $\vec{e} = (e_0, \dots, e_n)$ of each monomial $T_0^{e_0} \cdots T_n^{e_n}$, splitting the
    infinite Čech complex into a direct sum of independent 1-dimensional subcomplexes $\check{\mathcal{C}}^\bullet(\vec{e})$
    classified solely by the negative index set $\mathrm{NEG}(\vec{e}) = \{i \mid e_i < 0\}$.'
