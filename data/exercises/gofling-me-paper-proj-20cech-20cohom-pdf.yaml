  text: 'Exercise 18.3.B: Show that the Čech complex for $\mathcal{O}_{\mathbb{P}_A^n}(d)$ with respect
    to the standard affine cover $\mathcal{U} = \{D_+(x_0), \dots, D_+(x_n)\}$ decomposes as a direct
    sum of subcomplexes indexed by the weight vector $\vec{e} = (e_0, \dots, e_n) \in \mathbb{Z}^{n+1}$
    with $\sum e_i = d$'
  hint: The Čech differential $d^p(s)_{i_0 \dots i_{p+1}} = \sum_{j=0}^{p+1} (-1)^j s_{i_0 \dots \widehat{i_j}
    \dots i_{p+1}}$ is linear and preserves the monomial degree in each variable $x_i$ individually. Thus,
    if a section $s$ is a linear combination of monomials $x_0^{e_0} \cdots x_n^{e_n}$, the differential
    $d(s)$ involves only terms with the exact same exponent vector $\vec{e}$, splitting the complex into
    $\check{C}^\bullet(\mathcal{U}, \mathcal{O}(d)) = \bigoplus_{\sum e_i = d} \check{C}^\bullet(\vec{e})$.
  locator: null
