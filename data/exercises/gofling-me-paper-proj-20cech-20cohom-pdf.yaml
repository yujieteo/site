  text: Why is the intermediate cohomology $H^q(\mathbb{P}^n, \mathcal{O}(d)) = 0$ always zero for all
    $0 < q < n$ and all degrees $d \in \mathbb{Z}$?
  hint: 'Motivation: understand why projective space has no intermediate topological holes. Invention:
