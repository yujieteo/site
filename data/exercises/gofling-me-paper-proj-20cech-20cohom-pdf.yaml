- id: gofling-me-paper-proj-20cech-20cohom-pdf#006
  text: How does the single polynomial $\chi(\mathbb{P}^n, \mathcal{O}(d)) = \binom{n+d}{n}$ compute the
    entire Euler characteristic and explain the "vanishing window"?
  hint: 'Motivation: compute the alternating sum of cohomology dimensions $\chi(d) = \sum (-1)^q h^q(d)$
    uniformly for all $d \in \mathbb{Z}$. Invention: the Euler characteristic is given by the single polynomial
    $\chi(d) = \frac{(d+1)(d+2)\cdots(d+n)}{n!}$, which has $n$ roots at $d = -1, -2, \dots, -n$. Mental
    trick: (1) For $d \ge 0$, $\chi(d) = h^0(d) = \binom{n+d}{n}$; (2) For $-n \le d \le -1$, $\chi(d)
    = 0$ (the vanishing window where all cohomology groups vanish); (3) For $d \le -n-1$, $(-1)^n \chi(d)
    = h^n(d) = (-1)^n \binom{n+d}{n} = \binom{-d-1}{n}$ by upper index negation.'
