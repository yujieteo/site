    $h \colon \check{C}^{p+1}(\vec{e}) \to \check{C}^p(\vec{e})$ by inserting the index $j$: $(h s)_{i_0
    \dots i_p} = s_{j i_0 \dots i_p}$ if $j \notin \{i_0, \dots, i_p\}$, and $(h s)_{i_0 \dots i_p} =
    0$ if $j \in \{i_0, \dots, i_p\}$. A direct calculation using the simplicial boundary identities verifies
    $d h + h d = \mathrm{id}$, proving that $\check{C}^\bullet(\vec{e})$ is contractible and all its cohomology
