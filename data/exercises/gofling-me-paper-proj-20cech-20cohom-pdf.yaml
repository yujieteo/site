- id: gofling-me-paper-proj-20cech-20cohom-pdf#002
  text: 'Exercise 18.2.C: Show that if $0 \to \mathcal{F}'' \to \mathcal{F} \to \mathcal{F}'''' \to 0$
    is a short exact sequence of quasicoherent sheaves on a separated scheme $X$, then the sequence of
    Čech complexes $0 \to \check{C}^\bullet(\mathcal{U}, \mathcal{F}'') \to \check{C}^\bullet(\mathcal{U},
    \mathcal{F}) \to \check{C}^\bullet(\mathcal{U}, \mathcal{F}'''') \to 0$ is exact'
  hint: Each term $\check{C}^p(\mathcal{U}, \mathcal{F}) = \prod \mathcal{F}(U_{i_0 \dots i_p})$ is a
    product of sections over affine opens $U_{i_0 \dots i_p} = \mathrm{Spec}(A_{i_0 \dots i_p})$; on affine
    schemes, the functor $\widetilde{(-)}$ is an exact equivalence between modules and quasicoherent sheaves,
    so taking sections on affine opens is exact, making the sequence of complexes exact termwise.
  locator: null
  sub_index: null
