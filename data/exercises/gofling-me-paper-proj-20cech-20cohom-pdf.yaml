- id: gofling-me-paper-proj-20cech-20cohom-pdf#008
  text: How does one compute the genus $g$ of a smooth degree-$d$ plane curve $C \subset \mathbb{P}^2$
    in your head using the cohomology of $\mathbb{P}^2$?
  hint: 'Motivation: compute the topological genus of an algebraic curve directly from its defining polynomial
    degree. Invention: write the ideal sheaf sequence $0 \to \mathcal{O}_{\mathbb{P}^2}(-d) \to \mathcal{O}_{\mathbb{P}^2}
    \to \mathcal{O}_C \to 0$; taking the long exact sequence in cohomology yields $H^1(C, \mathcal{O}_C)
    \cong H^2(\mathbb{P}^2, \mathcal{O}(-d))$. By Serre duality on $\mathbb{P}^2$, $H^2(\mathbb{P}^2,
    \mathcal{O}(-d)) \cong H^0(\mathbb{P}^2, \mathcal{O}(d-3))^\vee$. Mental trick: $g = h^0(\mathbb{P}^2,
    \mathcal{O}(d-3)) = \binom{(d-3)+2}{2} = \frac{(d-1)(d-2)}{2}$; for line $d=1 \implies g=0$; conic
    $d=2 \implies g=0$; cubic $d=3 \implies g=1$; quartic $d=4 \implies g=3$.'
