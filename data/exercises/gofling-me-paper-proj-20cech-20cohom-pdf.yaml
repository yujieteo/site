  text: 'Exercise 18.2.A: For a finite affine open cover $\mathcal{U} = \{U_0, \dots, U_n\}$ of a separated
    scheme $X$, show that the Čech differential $d \colon \check{C}^p(\mathcal{U}, \mathcal{F}) \to \check{C}^{p+1}(\mathcal{U},
    \mathcal{F})$ satisfies $d^2 = 0$'
  hint: Expand $d(d s)_{i_0 \dots i_{p+2}} = \sum_{j < k} (-1)^{j+k} s_{\dots \widehat{i_j} \dots \widehat{i_k}
    \dots} + \sum_{k < j} (-1)^{j+k-1} s_{\dots \widehat{i_k} \dots \widehat{i_j} \dots}$; swapping the
    summation dummy variables in the second sum produces an identical sum with opposite sign, so the terms
    cancel pairwise.
