- id: gofling-me-paper-proj-20cech-20cohom-pdf#004
  text: How does one compute the top cohomology $H^n(\mathbb{P}^n, \mathcal{O}(d))$ in your head using
    the canonical shift $-n-1$?
  hint: 'Motivation: compute the obstruction space / top cohomology of line bundles. Invention: top cohomology
    classes in $H^n$ are spanned by inverse Laurent monomials $\frac{1}{T_0^{a_0} \cdots T_n^{a_n}}$ with
    all strictly positive integer exponents $a_i \ge 1$ summing to $\sum a_i = -d$. Substituting $a_i
    = b_i + 1$ with $b_i \ge 0$ shifts the total degree to $\sum b_i = -d - (n+1) = -n-1-d$. Mental trick:
    $H^n(\mathbb{P}^n, \mathcal{O}(d)) = 0$ for $d \ge -n$, and for $d \le -n-1$ its dimension is $\binom{n
    + (-n-1-d)}{n} = \binom{-d-1}{n}$. Quick check: on $\mathbb{P}^2$ for $d = -4$, compute $-d-1 = 3
    \implies \binom{3}{2} = 3$.'
