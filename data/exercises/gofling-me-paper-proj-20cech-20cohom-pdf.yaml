- id: gofling-me-paper-proj-20cech-20cohom-pdf#005
  text: What is the residue map on top cohomology and how does it prove that $\omega_{\mathbb{P}^n} \cong
    \mathcal{O}(-n-1)$?
  hint: 'Motivation: find the canonical trace map $\mathrm{Tr} \colon H^n(\mathbb{P}^n, \omega_{\mathbb{P}^n})
    \to k$ for Serre duality. Invention: evaluating top cohomology at $d = -n-1$ yields dimension $\binom{-(-n-1)-1}{n}
    = \binom{n}{n} = 1$, spanned by the unique fundamental inverse volume element $\frac{1}{T_0 T_1 \cdots
    T_n}$; sending $\frac{1}{T_0 \cdots T_n} \mapsto 1$ defines the non-degenerate residue trace map.'
