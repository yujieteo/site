- id: dec41-user-srcf-net-h-iii-l-ramsey-theory-full#001
  text: What is Ramsey's theorem for graphs?
  hint: For any integers $k, l$, there exists a minimal $R(k, l)$ such that every 2-coloring of the edges
    of $K_N$ contains a monochromatic $K_k$ or $K_l$.
