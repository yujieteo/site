- id: dec41-user-srcf-net-h-iii-l-ramsey-theory-full#000
  text: What is the fundamental principle of Ramsey theory?
  hint: 'Complete disorder is impossible: any sufficiently large structure, when partitioned into finitely
    many pieces, must contain a monochromatic substructure.'
