- id: dec41-user-srcf-net-h-ib-m-markov-chains-full#000
  text: What is the Markov property?
  hint: 'The conditional probability of future states depends only on the present state, not on the sequence
    of past states: $P(X_{n+1} = j \mid X_n = i, \dots, X_0 = i_0) = P(X_{n+1} = j \mid X_n = i)$.'
