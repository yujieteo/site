- id: ncatlab-org-nlab-show-integral-cohomology#000
  text: What is integral cohomology?
  hint: Ordinary version of Whitehead-generalized cohomology. The one represented by the Eilenberg-Maclane
    spectrum with coefficeints in the integers.
