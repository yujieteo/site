- id: people-math-harvard-edu-lurie-252xnotes-lecture7-pdf#002
  text: How does one prove that the Lazard ring is isomorphic to $\pi_* MU$ or the Milnor-Quillen theorem?
  hint: $MU$ is the homotopy colimit of the sequence. Compute the homology for $E_*(MU)$ which is arbitrary
    complex oriented cohomology theory. Consider a canonical isomorphism using the fact that every complex
    vector bundle has a canonical $E$-orientation, with dual basis to topological basis. Pass to bordism
    spectrum $MU$, one then understands transition maps to higher $MU(n)$. Take the dual of the topological
    basis $t_i$ for the case of $E_*(MU(n))$, so one can get a image of the $b_i$ determining a ring isomorphism
    $\pi_* E{b_1, \cdots}$ to $E_*(MU)$. Compute for $H_*(MU, \mathbb{Z})$ to be isomorphic to infinite
    power series ring $\mathbb{Z}[b_1, \cdots]$. Using the fact that smash product is another multiplicative
    cohomology theory with two complex orientation, one can find two classes that determine isomorphisms.
    Construct a map associated with the Lazard ring and repeatedly tensor with $\mathbb{Q}$ to get the
    result.
  locator: null
  sub_index: null
  search_text: how does one prove that the lazard ring is isomorphic to $\pi_* mu$ or the milnor-quillen
    theorem? $mu$ is the homotopy colimit of the sequence. compute the homology for $e_*(mu)$ which is
    arbitrary complex oriented cohomology theory. consider a canonical isomorphism using the fact that
    every complex vector bundle has a canonical $e$-orientation, with dual basis to topological basis.
    pass to bordism spectrum $mu$, one then understands transition maps to higher $mu(n)$. take the dual
    of the topological basis $t_i$ for the case of $e_*(mu(n))$, so one can get a image of the $b_i$ determining
    a ring isomorphism $\pi_* e{b_1, \cdots}$ to $e_*(mu)$. compute for $h_*(mu, \mathbb{z})$ to be isomorphic
    to infinite power series ring $\mathbb{z}[b_1, \cdots]$. using the fact that smash product is another
    multiplicative cohomology theory with two complex orientation, one can find two classes that determine
    isomorphisms. construct a map associated with the lazard ring and repeatedly tensor with $\mathbb{q}$
    to get the result.
