- id: people-math-harvard-edu-lurie-252xnotes-lecture7-pdf#005
  text: What is $p$-localisation?
  hint: 'localisation at a prime ideal $p$, for example $\mathbb{Z}_{(p)}$ which means inverting all primes
    except $p$ which is the ring of functions defined on the open complement of the point. Mote that away
    from $p$ it is different which means one ignores $p$-torsion, this gives you the subring whose fractions
    are powers of $1/p$ in the denominator. NOTE: this is not the Laurent/power series ring which is $Z[1/p][[x]]$.
    $Z_p$ is the functions on the formal neighbourhood of $(p)$.'
  locator: null
