- id: www-preschema-com-lecture-notes-cohdag2022-cohdag2022-pdf#000
  text: How does one formulate Poincaré duality for a noncompact oriented smooth manifold of dimension
    $d$?
  hint: There exists a fundamental class $[X] \in H_d^{\mathrm{BM}}(X)$ in Borel-Moore homology such that
    the cap product $-\cap [X] \colon H^i(X) \xrightarrow{\sim} H_{d-i}^{\mathrm{BM}}(X)$ is an isomorphism
    for all $i$.
