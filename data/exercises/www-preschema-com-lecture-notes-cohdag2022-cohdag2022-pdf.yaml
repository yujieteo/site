- id: www-preschema-com-lecture-notes-cohdag2022-cohdag2022-pdf#011
  text: What are the compatabilities associated with tensor products and internal hom? State these formulas
    in full. How does one invent the notion?
  hint: 'Projection formula: $f_!(\mathcal{F} \otimes f^*\mathcal{G}) \simeq f_!(\mathcal{F}) \otimes
    \mathcal{G}$. Base change formula for Cartesian squares: $g^* f_! \simeq (f'')_! (g'')^*$ and $f^!
    g_* \simeq (g'')_* (f'')^!$. Invented to encode that integration commutes with base change and module
    actions.'
