    $\mathrm{ch}_*(x)$ and $g_0(x)$.'
- id: www-preschema-com-lecture-notes-cohdag2022-cohdag2022-pdf#005
  text: How does one study $G$-theory?
  hint: As the algebraic $K$-theory of coherent sheaves $K(\mathbf{Coh}(X))$. It behaves as a homology
    theory with proper pushforwards, whereas $K$-theory of vector bundles $K(\mathbf{Perf}(X))$ behaves
    like cohomology with arbitrary pullbacks.
