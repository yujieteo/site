  text: State the exact distinguished triangle and the conditions for the property of localisation? How
    does one invent the notion?
  hint: For closed immersion $i \colon Z \hookrightarrow X$ with complement open immersion $j \colon U
    \hookrightarrow X$, there is a fiber sequence $i_* \omega_Z \to \omega_X \to j_* \omega_U$, yielding
    the exact localization triangle $C_\bullet^{\mathrm{BM}}(Z) \xrightarrow{i_*} C_\bullet^{\mathrm{BM}}(X)
    \xrightarrow{j^*} C_\bullet^{\mathrm{BM}}(U) \xrightarrow{+1}$.
