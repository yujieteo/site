- id: www-preschema-com-lecture-notes-cohdag2022-cohdag2022-pdf#020
  text: Does Borel-Moore homology have proper pushforwards? State the definition of proper pushforwards?
    How does one invent the notion?
  hint: Yes. For proper $f$, $f_! \simeq f_*$, so the counit $\mathrm{Tr}_f \colon f_* f^! \to \mathrm{id}$
    induces $f_* \colon (a_X)_* a_X^! \mathbf{1} \simeq (a_Y)_* f_* f^! a_Y^! \mathbf{1} \to (a_Y)_* a_Y^!
    \mathbf{1}$.
  locator:
