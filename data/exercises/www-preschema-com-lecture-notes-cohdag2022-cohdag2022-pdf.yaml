- id: www-preschema-com-lecture-notes-cohdag2022-cohdag2022-pdf#009
  text: State the pushforward and pullback adjunction in the six operation. How does one invent the notion?
  hint: Standard adjunction $f^* \colon D(Y) \rightleftarrows D(X) \colon f_*$ and exceptional adjunction
    $f_! \colon D(X) \rightleftarrows D(Y) \colon f^!$. Invented because $f^*$ preserves colimits (hence
    has right adjoint $f_*$) and compactly supported integration $f_!$ preserves colimits (hence has right
    adjoint $f^!$).
