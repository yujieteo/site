- id: www-preschema-com-lecture-notes-cohdag2022-cohdag2022-pdf#006
  text: Write down the implication of Chow's moving lemma in Chow homology for the intersection product?
  hint: Any two cycles can be moved into proper intersection, yielding $[Y] \cdot [Z] = \sum_\alpha i(W_\alpha,
    Y \cdot Z; X) [W_\alpha]$, where the multiplicities $i(W_\alpha, Y \cdot Z; X) = \sum_k (-1)^k \mathrm{length}_{\mathcal{O}_{X,
    W_\alpha}}(\mathrm{Tor}_k^{\mathcal{O}_{X, W_\alpha}}(\mathcal{O}_{Y, W_\alpha}, \mathcal{O}_{Z, W_\alpha}))$
    are given by Serre's Tor-formula.
  locator:
    kind: page
    value: '4'
    number: 4
  sub_index: 0
  search_text: write down the implication of chow's moving lemma in chow homology for the intersection
    product? any two cycles can be moved into proper intersection, yielding $[y] \cdot [z] = \sum_\alpha
    i(w_\alpha, y \cdot z; x) [w_\alpha]$, where the multiplicities $i(w_\alpha, y \cdot z; x) = \sum_k
    (-1)^k \mathrm{length}_{\mathcal{o}_{x, w_\alpha}}(\mathrm{tor}_k^{\mathcal{o}_{x, w_\alpha}}(\mathcal{o}_{y,
    w_\alpha}, \mathcal{o}_{z, w_\alpha}))$ are given by serre's tor-formula.
- id: www-preschema-com-lecture-notes-cohdag2022-cohdag2022-pdf#007
  text: Apart from using Chow's moving lemma, state another result one can using derived algebraic geometry
    to get non-transverse intersection theory?
  hint: Form the derived intersection $Y \times_X^{\mathbf{R}} Z = \mathbf{Spec}_X(\mathcal{O}_Y \otimes_{\mathcal{O}_X}^{\mathbf{L}}
    \mathcal{O}_Z)$. It is quasi-smooth and carries a virtual fundamental class $[Y \times_X^{\mathbf{R}}
    Z]^{\mathrm{vir}}$ such that $[Y] \cdot [Z] = [Y \times_X^{\mathbf{R}} Z]^{\mathrm{vir}}$, recovering
    Serre's Tor-formula without moving cycles.
  locator:
