- id: www-preschema-com-lecture-notes-cohdag2022-cohdag2022-pdf#004
  text: Classify many Borel-Moore type theories?
  hint: '(1) Topological: $H_*^{\mathrm{BM}}(X(\mathbb{C})^{\mathrm{an}})$; (2) $\ell$-adic: $H_i^{\mathrm{BM}}(X)
    = H^{-i}(X, \omega_X)$; (3) Motivic / Chow: $H_{2i}^{\mathrm{BM}}(X, \mathbb{Z}(i)) \cong \mathrm{CH}_i(X)$;
    (4) $G$-theory: $G_0(X) = K_0(\mathbf{Coh}(X))$; (5) Algebraic cobordism: $\Omega_*(X)$ via Voevodsky''s
    cobordism spectrum $\mathbf{MGL}$, which interpolates between $\mathrm{CH}_*(X)$ and $G_0(X)$.'
  locator:
    kind: page
    value: '3'
    number: 3
  sub_index: 0
  search_text: 'classify many borel-moore type theories? (1) topological: $h_*^{\mathrm{bm}}(x(\mathbb{c})^{\mathrm{an}})$;
    (2) $\ell$-adic: $h_i^{\mathrm{bm}}(x) = h^{-i}(x, \omega_x)$; (3) motivic / chow: $h_{2i}^{\mathrm{bm}}(x,
    \mathbb{z}(i)) \cong \mathrm{ch}_i(x)$; (4) $g$-theory: $g_0(x) = k_0(\mathbf{coh}(x))$; (5) algebraic
