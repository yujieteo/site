- id: www-preschema-com-lecture-notes-cohdag2022-cohdag2022-pdf#002
  text: How does one define a cohomological Bézout theorem?
  hint: Cup product defines a ring structure on $H^*(X)$. Via Poincaré duality, this induces an intersection
    product $[Y] \cdot [Z] := \mathrm{PD}^{-1}(\mathrm{PD}([Y]) \cup \mathrm{PD}([Z]))$. If $Y^m$ and
    $Z^n$ intersect transversely in $X^d$, then $Y \cap Z$ is an oriented submanifold of dimension $m+n-d$
    and $[Y] \cdot [Z] = [Y \cap Z]$.
  locator:
    kind: page
    value: '2'
    number: 2
  sub_index: 1
  search_text: how does one define a cohomological bézout theorem? cup product defines a ring structure
    on $h^*(x)$. via poincaré duality, this induces an intersection product $[y] \cdot [z] := \mathrm{pd}^{-1}(\mathrm{pd}([y])
    \cup \mathrm{pd}([z]))$. if $y^m$ and $z^n$ intersect transversely in $x^d$, then $y \cap z$ is an
    oriented submanifold of dimension $m+n-d$ and $[y] \cdot [z] = [y \cap z]$.
- id: www-preschema-com-lecture-notes-cohdag2022-cohdag2022-pdf#003
  text: What does Thom's transversality mean in non-transverse case?
  hint: Smooth maps can be homotoped to transverse ones, so non-transverse intersections can be perturbed
    away. This fails in algebraic geometry because the Zariski topology is rigid and continuous perturbations
    are not algebraic morphisms; it fails in equivariant geometry because perturbations must respect group
    actions.
