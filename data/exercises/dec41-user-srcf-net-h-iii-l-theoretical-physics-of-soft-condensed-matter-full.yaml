- id: dec41-user-srcf-net-h-iii-l-theoretical-physics-of-soft-condensed-matter-full#004
  text: Why are hydrodynamic equations used for soft condensed matter?
  hint: They describe the slow, long-wavelength dissipative relaxation of conserved order parameters via
    free energy functionals.
  locator: null
  sub_index: null
  search_text: why are hydrodynamic equations used for soft condensed matter? they describe the slow,
