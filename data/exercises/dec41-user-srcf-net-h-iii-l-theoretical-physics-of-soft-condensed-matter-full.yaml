- id: dec41-user-srcf-net-h-iii-l-theoretical-physics-of-soft-condensed-matter-full#005
  text: Why is random thermal noise added to hydrodynamic equations?
  hint: To satisfy the fluctuation-dissipation theorem, yielding stochastic PDEs such as the Landau-Lifshitz
    equations.
  locator: null
  sub_index: null
  search_text: why is random thermal noise added to hydrodynamic equations? to satisfy the fluctuation-dissipation
