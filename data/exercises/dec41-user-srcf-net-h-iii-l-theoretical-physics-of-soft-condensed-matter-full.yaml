- id: dec41-user-srcf-net-h-iii-l-theoretical-physics-of-soft-condensed-matter-full#007
  text: How does one gradually weaken the Navier-Stokes equation to study soft matter?
  hint: get hydrodynamic PDE, assume incompressibility, then promote to stochastic PDE using the Landau-Lipschitz
    equation, last term is noise stress tensor, treat it as Gaussian, fixed by fluctuation dissipation.
    One can weaken more assumptions by thinking about fluid mixtures, and add molecular orientations.
