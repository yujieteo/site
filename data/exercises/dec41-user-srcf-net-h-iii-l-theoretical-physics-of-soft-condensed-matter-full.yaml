- id: dec41-user-srcf-net-h-iii-l-theoretical-physics-of-soft-condensed-matter-full#003
  text: Why is mean field theory used and where does it fail?
  hint: It computes dominant free energy minima but neglects large-scale fluctuation effects near critical
    points.
  locator: null
  sub_index: null
  search_text: why is mean field theory used and where does it fail? it computes dominant free energy
