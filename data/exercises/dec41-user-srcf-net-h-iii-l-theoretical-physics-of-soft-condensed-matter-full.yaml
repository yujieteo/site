- id: dec41-user-srcf-net-h-iii-l-theoretical-physics-of-soft-condensed-matter-full#006
  text: How does one modify the Navier-Stokes equations for soft matter?
  hint: Incorporate stress tensors derived from free energy functionals, incompressibility constraints,
    stochastic noise, and internal orientational order parameters.
