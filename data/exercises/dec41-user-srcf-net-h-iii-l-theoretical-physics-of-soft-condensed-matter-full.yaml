- id: dec41-user-srcf-net-h-iii-l-theoretical-physics-of-soft-condensed-matter-full#000
  text: Why does one ignore quantum fluctuations in soft matter physics?
  hint: The thermal energy scale $k_B T$ greatly exceeds the quantum energy scale $\hbar / \tau_Q$, so
    setting $\hbar \to 0$ is valid.
  locator: null
  sub_index: null
  search_text: why does one ignore quantum fluctuations in soft matter physics? the thermal energy scale
    $k_b t$ greatly exceeds the quantum energy scale $\hbar / \tau_q$, so setting $\hbar \to 0$ is valid.
- id: dec41-user-srcf-net-h-iii-l-theoretical-physics-of-soft-condensed-matter-full#001
  text: Why are thermal fluctuations essential in soft matter systems?
  hint: Elastic shear moduli are of order $k_B T \cdot N/V \sim 10^2 - 10^7 \, \mathrm{Pa}$, which makes
    thermal energies comparable to structural deformation energies.
  locator: null
  sub_index: null
  search_text: why are thermal fluctuations essential in soft matter systems? elastic shear moduli are
    of order $k_b t \cdot n/v \sim 10^2 - 10^7 \, \mathrm{pa}$, which makes thermal energies comparable
    to structural deformation energies.
- id: dec41-user-srcf-net-h-iii-l-theoretical-physics-of-soft-condensed-matter-full#002
  text: Why does one coarse-grain a soft matter system?
  hint: To eliminate microscopic molecular degrees of freedom and focus on macroscopic continuous field
    variables.
  locator: null
  sub_index: null
