- id: dec41-user-srcf-net-h-ib-m-analysis-ii-full#005
  text: What is absolute convergence of a series?
  hint: A series $\sum a_n$ converges absolutely if $\sum |a_n| < \infty$.
  locator: null
  sub_index: null
