- id: dec41-user-srcf-net-h-ib-m-analysis-ii-full#009
  text: What is Lebesgue's criterion for Riemann integrability?
  hint: A bounded function on a compact interval is Riemann integrable if and only if its set of discontinuities
    has Lebesgue measure zero.
