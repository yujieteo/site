- id: dec41-user-srcf-net-h-ib-m-analysis-ii-full#006
  text: What is the Weierstrass M-test?
  hint: If $|f_n(x)| \le M_n$ for all $x$ and $\sum M_n < \infty$, then $\sum f_n(x)$ converges uniformly
    and absolutely.
  locator: null
  sub_index: null
