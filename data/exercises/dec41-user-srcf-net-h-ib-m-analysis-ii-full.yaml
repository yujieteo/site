- id: dec41-user-srcf-net-h-ib-m-analysis-ii-full#001
  text: What is the limitation of pointwise convergence?
  hint: Pointwise limits of continuous functions need not be continuous, e.g., $f_n(x) = x^{2n+1}$ on
    $[-1, 1]$.
