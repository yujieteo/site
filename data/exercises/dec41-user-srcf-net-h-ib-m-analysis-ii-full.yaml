- id: dec41-user-srcf-net-h-ib-m-analysis-ii-full#002
  text: How does one define uniform convergence?
  hint: $f_n \to f$ uniformly if for all $\varepsilon > 0$, there exists $N$ such that for all $n > N$
    and all $x \in D$, $|f_n(x) - f(x)| < \varepsilon$.
  locator: null
  sub_index: null
  search_text: how does one define uniform convergence? $f_n \to f$ uniformly if for all $\varepsilon
    > 0$, there exists $n$ such that for all $n > n$ and all $x \in d$, $|f_n(x) - f(x)| < \varepsilon$.
- id: dec41-user-srcf-net-h-ib-m-analysis-ii-full#003
  text: What is a uniformly Cauchy sequence?
  hint: For all $\varepsilon > 0$, there exists $N$ such that for all $n, m > N$ and all $x$, $|f_n(x)
    - f_m(x)| < \varepsilon$; equivalent to uniform convergence in complete spaces.
  locator: null
  sub_index: null
