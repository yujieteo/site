    then $\sum f_n(x)$ converges uniformly and absolutely.
- id: dec41-user-srcf-net-h-ib-m-analysis-ii-full#007
  text: How does one define uniform continuity?
  hint: A function $f$ is uniformly continuous if for all $\varepsilon > 0$, there exists $\delta > 0$
    such that for all $x, y$ with $|x - y| < \delta$, $|f(x) - f(y)| < \varepsilon$.
  locator: null
