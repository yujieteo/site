  text: '(Compactification and Cohomology with Compact Support: Page 14) By Nagata''s Compactification
    Theorem, every separated scheme $X$ of finite type over a field $k$ admits an open immersion $j: X
    \hookrightarrow \overline{X}$ into a proper scheme $\overline{X}$. 1. For an open immersion $j: U
    \hookrightarrow X$, define the extension by zero functor $j_!$ (exceptional pushforward) as the exact
    left adjoint to $j^*$. 2. Define the cohomology with compact support $H_c^i(X, \mathcal{F}) := H_{\text{ét}}^i(\overline{X},
    j_! \mathcal{F})$, and prove that this definition is independent of the choice of compactification
    $\overline{X}$. (Hint: Show that $j_! \mathcal{F}$ has stalks $(j_!\mathcal{F})_x = \mathcal{F}_x$
    for $x \in U$ and $(j_!\mathcal{F})x = 0$ for $x \notin U$)'
