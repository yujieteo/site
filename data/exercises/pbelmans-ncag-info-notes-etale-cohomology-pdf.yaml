    functor from the category of smooth projective varieties over a field $k$ to finite-dimensional graded-commutative
    $k$-algebras (where $k$ is a field of characteristic 0), satisfying: 1. **finite dimensionality:**
    each $h^i(x)$ is a finite-dimensional $k$-vector space. 2. **vanishing:** if $\dim(x) = n$, then $h^i(x)
    = 0$ for $i \notin [0, 2n]$. 3. **orientation & trace map:** a canonical isomorphism $\operatorname{tr}:
    h^{2n}(x) \xrightarrow{\sim} k$. 4. **poincaré duality:** the cup product pairing $h^i(x) \times h^{2n-i}(x)
    \to h^{2n}(x) \xrightarrow{\operatorname{tr}} k$ is a non-degenerate bilinear form. 5. **künneth formula:**
    the exterior cup product $h^*(x) \otimes_k h^*(y) \xrightarrow{\sim} h^*(x \times y)$ is an isomorphism.
    6. **cycle class maps:** a functorial cycle map $\gamma: \operatorname{ch}^r(x) \to h^{2r}(x)$ compatible
    with intersections and chern classes. (hint: list the four classical weil cohomology theories: $\ell$-adic
    étale cohomology, singular cohomology of the analytification $x(\mathbb{c})$, algebraic de rham cohomology
    in characteristic 0, and crystalline cohomology over perfect fields)'
- id: pbelmans-ncag-info-notes-etale-cohomology-pdf#006
  text: '(Constructible Sheaves and l-Adic Cohomology) Explain why constant $\mathbb{Q}_\ell$-sheaves
    are insufficient and how constructible sheaves resolve the failure of pushforwards. (Hint: Locally
    constant sheaves are not stable under pushforward along open immersions or closed embeddings. A sheaf
    $\mathcal{F}$ on $X_{\text{ét}}$ is constructible if $X$ can be stratified into a finite disjoint
    union of locally closed subschemes $X = \coprod X_i$ such that $\mathcal{F}|_{X_i}$ is a finite locally
    constant sheaf. $\ell$-adic cohomology is defined via the projective system of constructible torsion
    sheaves: $H^i(X, \mathbb{Q}_\ell) := (\varprojlim_n H_{\text{ét}}^i(X, \mathbb{Z}/\ell^n\mathbb{Z}))
    \otimes_{\mathbb{Z}_\ell} \mathbb{Q}_\ell$)'
