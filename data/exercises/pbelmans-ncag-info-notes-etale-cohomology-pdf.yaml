- id: pbelmans-ncag-info-notes-etale-cohomology-pdf#001
  text: '(Comparison of Grothendieck Topologies on Schemes) Define and compare the standard Grothendieck
    sites on schemes: 1. **Small Zariski Site $(X)_{\text{Zar}}$:** Full subcategory of $\mathbf{Sch}/X$
    whose objects are open immersions $U \hookrightarrow X$, with coverings given by jointly surjective
    families of open immersions. 2. **Big Zariski Site $(\mathbf{Sch}/X)_{\text{Zar}}$:** Category of
    all $X$-schemes with jointly surjective open covers. 3. **Small Étale Site $(X)_{\text{ét}}$:** Full
    subcategory of $\mathbf{Sch}/X$ whose objects are étale morphisms $U \to X$ (flat, unramified, locally
    of finite presentation), with coverings given by jointly surjective families of étale morphisms. 4.
    **Big fppf Site $(\mathbf{Sch}/X)_{\text{fppf}}$:** Jointly surjective families of flat morphisms
    locally of finite presentation. 5. **Big fpqc Site $(\mathbf{Sch}/X)_{\text{fpqc}}$:** Jointly surjective
    families of faithfully flat and quasi-compact morphisms. (Hint: Define a topology to be subcanonical
    if every representable functor $h_Y = \operatorname{Hom}(-, Y)$ is a sheaf; explain why the fpqc and
    fppf topologies are subcanonical, and why topologies involving proper morphisms can fail to be subcanonical)'
