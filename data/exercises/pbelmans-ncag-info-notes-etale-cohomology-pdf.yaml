  text: '(Proper Base Change Theorem: Theorem 27) State the Proper Base Change Theorem (SGA 4, Artin):
    let $f: Y \to X$ be a proper morphism of schemes and let $g: X'' \to X$ be any morphism. For any constructible
    sheaf $\mathcal{F}$ on $Y_{\text{ét}}$, prove that the canonical base change map $$g^* R^i f_* \mathcal{F}
