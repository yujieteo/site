- id: pbelmans-ncag-info-notes-etale-cohomology-pdf#000
  text: '(Definition of a Grothendieck Topology and Sites: Page 11) Formulate the precise definition of
    a Grothendieck topology on a category $\mathcal{C}$ via covering families. (Hint: A Grothendieck topology
    specifies a collection of covering families $\{U_i \to U\}_{i \in I}$ such that: 1. Any isomorphism
    $\{V \xrightarrow{\sim} U\}$ is a covering family. 2. If $\{U_i \to U\}$ is a covering family and
    $V \to U$ is any morphism, all fiber products $U_i \times_U V$ exist and the induced projections $\{U_i
    \times_U V \to V\}$ form a covering family. 3. If $\{U_i \to U\}_{i \in I}$ is a covering family and
    for each $i$, $\{V_{ij} \to U_i\}_{j \in J_i}$ is a covering family, then the composite family $\{V_{ij}
    \to U\}_{i \in I, j \in J_i}$ is a covering family. Illustrate this with the prototypical category
    of open sets $\operatorname{Open}(X)$ where morphisms are inclusions, fiber products are intersections
    $U_i \cap V$, and coverings are jointly surjective open covers $\bigcup U_i = U$)'
