    for all $i \ge 0$. (Hint: When $X'' = \operatorname{Spec}(\kappa(\overline{x}))$ is a geometric point,
    this reduces the stalk $(R^i f_* \mathcal{F})_{\overline{x}}$ to the étale cohomology of the geometric
    fiber $H_{\text{ét}}^i(Y_{\overline{x}}, \mathcal{F})$)'
