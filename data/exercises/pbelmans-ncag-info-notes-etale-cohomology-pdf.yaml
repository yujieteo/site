  text: '(Torsion Prime to Characteristic and Smooth Specialization) Let $X$ be a scheme and $\mathcal{F}$
    a torsion sheaf on $X_{\text{ét}}$. What does it mean for the torsion of $\mathcal{F}$ to be prime
    to the characteristic of $X$? (Hint: The characteristic $\operatorname{char}(X)$ is the image of $X
    \to \operatorname{Spec} \mathbb{Z}$; the torsion of $\mathcal{F}$ is prime to $\operatorname{char}(X)$
    if multiplication by $p$ on $\mathcal{F}$ is an isomorphism for every prime $p \in \operatorname{char}(X)$.
    Under this hypothesis, smooth base change and the smooth specialization theorem hold, ensuring that
    the cohomology of affine spaces $H_{\text{ét}}^i(\mathbb{A}_X^n, \mathcal{F}) \cong H_{\text{ét}}^i(X,
    \mathcal{F})$ is acyclic)'
