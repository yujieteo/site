- id: pbelmans-ncag-info-notes-etale-cohomology-pdf#002
  text: '(Failure of the Zariski Topology for Non-Coherent Cohomology) Why does the Zariski topology fail
    to produce the correct cohomology groups for constant sheaves or smooth group schemes? (Hint: The
    inverse function theorem fails algebraically in the Zariski topology; on an irreducible variety $X$,
    every constant sheaf $\underline{A}$ is flasque, forcing $H_{\text{Zar}}^i(X, \underline{A}) = 0$
    for all $i \ge 1$. For example, the Frobenius map $x \mapsto x^p$ on $\mathbb{A}^1$ is étale away
    from $0$ but is nowhere a local isomorphism in the Zariski topology. Étale morphisms formally add
    local algebraic inverses, resolving this failure)'
