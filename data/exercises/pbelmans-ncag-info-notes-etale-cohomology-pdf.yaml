  text: '(Galois Cohomology as a Special Case of Étale Cohomology) Let $K/k$ be a finite Galois extension
    with Galois group $G = \operatorname{Gal}(K/k)$. Show that $\operatorname{Spec}(K) \to \operatorname{Spec}(k)$
    is an étale covering. 1. Prove that the fiber product decomposes as $\operatorname{Spec}(K) \times_{\operatorname{Spec}(k)}
    \operatorname{Spec}(K) \cong \coprod_{\sigma \in G} \operatorname{Spec}(K)$ via the map $x \otimes
    y \mapsto (x \sigma(y))_{\sigma \in G}$. 2. Deduce that the Čech complex for the étale cover $\operatorname{Spec}(K)
    \to \operatorname{Spec}(k)$ coincides with the standard algebraic bar resolution computing group cohomology,
    establishing the canonical isomorphism $H_{\text{ét}}^n(\operatorname{Spec}(k), \mathcal{F}) \cong
    H^n(\operatorname{Gal}(k^{\text{sep}}/k), M)$. (Hint: Higher intersections in the Čech nerve correspond
    to iterated products indexed by $G^n$)'
