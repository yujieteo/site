  text: '(Representation Theory in Mixed Characteristic and Height Stratification) Contrast the representation
    theory of finite groups in characteristic 0 (where Maschke''s theorem ensures every representation
    is semisimple and extensions vanish) with modular representation theory in characteristic $p$ (where
    projective covers are non-trivial and extensions abound). Explain how chromatic homotopy theory organizes
    this behavior by stratifying the moduli stack of formal groups $\mathcal{M}_{\text{fg}}$ by height,
    with height 0 corresponding to rational semisimple representations and height $\infty$ to $p$-modular
    phenomena. '
