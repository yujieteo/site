- id: www-sas-rochester-edu-mth-sites-doug-ravenel-talks-plectics24-pdf#009
  text: '(The Devinatz-Hopkins-Smith Nilpotence and Periodicity Theorems) State the fundamental theorems
    of chromatic homotopy theory: 1. **Nilpotence Theorem:** $\langle \operatorname{MU} \rangle = \langle
    \mathbb{S} \rangle$. A ring spectrum map or self-map $f: \Sigma^d X \to X$ on a finite $p$-local complex
    is smash-nilpotent if and only if $\operatorname{MU}_*(f) = 0$ (or equivalently $\operatorname{BP}_*(f)
    = 0$). 2. **Periodicity Theorem:** Every finite $p$-local spectrum $X$ of chromatic type $n$ (meaning
    $K(n-1)_* X = 0$ and $K(n)_* X \ne 0$) admits a $v_n$-periodic self-map $v: \Sigma^{d} X \to X$ such
    that $K(n)_*(v)$ is an isomorphism and $K(m)_*(v) = 0$ for $m \ne n$. '
  hint: Constructing finite complexes of arbitrary chromatic type $n$ was first achieved by Mitchell via
    the Steinberg idempotent on flag manifolds
  locator: null
  sub_index: null
