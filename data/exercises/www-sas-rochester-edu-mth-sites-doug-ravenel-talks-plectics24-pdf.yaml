    commutative formal group laws $F(x, y) = x + y + \sum a_{ij} x^i y^j$. At a fixed prime $p$, describe
    the $p$-local Brown–Peterson spectrum $\operatorname{BP}$ with coefficient ring: $$\pi_*(\operatorname{BP})
    \cong \mathbb{Z}_{(p)}[v_1, v_2, \dots], \quad |v_n| = 2(p^n - 1),$$ and explain its connection to
    Lubin–Tate formal group laws and $p$-typical formal groups. '
