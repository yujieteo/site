- id: www-sas-rochester-edu-mth-sites-doug-ravenel-talks-plectics24-pdf#008
  text: '(Harmonic vs. Dissonant Spectra) Define the harmonic localization $L_\infty X = \operatorname{holim}_n
    L_n X$ of a $p$-local spectrum $X$. A spectrum $X$ is harmonic if $X \xrightarrow{\sim} L_\infty X$
    is an equivalence, and dissonant if $L_\infty X \simeq *$, or equivalently if $K(n)_* X = 0$ for all
    $n \ge 0$. Prove that: 1. There are no non-trivial maps from any dissonant spectrum to any harmonic
    spectrum: $[D, H] = 0$. 2. Every finite $p$-local spectrum is harmonic (Ravenel''s Theorem). 3. The
    mod-$p$ Eilenberg–MacLane spectrum $H\mathbb{F}_p$ is dissonant, as is any spectrum with bounded torsion
    homotopy groups. '
  hint: Harmonic spectra are built from the chromatic tower, whereas dissonant spectra are invisible to
    all Morava $K$-theories
  locator: null
  sub_index: null
