  text: '(Morava K-Theories and Height Classification) Define the Morava $K$-theory spectra $K(n)$ at
    a prime $p$ for $n \ge 0$, with coefficients: $$\pi_*(K(n)) \cong \mathbb{F}_p[v_n^{\pm 1}], \quad
    |v_n| = 2(p^n - 1) \quad (\text{for } n \ge 1), \quad \text{and} \quad K(0) = H\mathbb{Q}.$$ Explain
    how $K(n)$ corresponds to the unique 1-dimensional formal group of height $n$ over $\overline{\mathbb{F}}_p$,
    acting as categorical "prime fields" in stable homotopy theory. '
  hint: By the Landweber–Morava classification, Morava $K$-theories are field objects satisfying a Künneth
    isomorphism $K(n)_*(X \times Y) \cong K(n)_*(X) \otimes_{K(n)_*} K(n)_*(Y)$
