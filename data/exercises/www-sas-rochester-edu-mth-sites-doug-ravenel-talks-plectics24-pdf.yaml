- id: www-sas-rochester-edu-mth-sites-doug-ravenel-talks-plectics24-pdf#007
  text: '(Bousfield Equivalence Classes and the Lattice of Spectra) Define the Bousfield equivalence class
    $\langle E \rangle$ of a spectrum $E$, where $\langle E \rangle = \langle F \rangle$ if they have
    the same acyclic spectra ($E_* X = 0 \iff F_* X = 0$). 1. Define the partial order $\langle E \rangle
    \ge \langle F \rangle$, with maximal class $\langle \mathbb{S} \rangle$ and minimal class $\langle
    * \rangle$. 2. Prove that for a cofiber sequence $W \to X \to Y \xrightarrow{f} \Sigma W$, $\langle
    X \rangle \le \langle W \rangle \vee \langle Y \rangle$, with equality holding if and only if $f$
    is smash-nilpotent ($f^{\wedge k} = 0$). 3. Verify the Bousfield decompositions: $$\langle \mathbb{S}
    \rangle = \langle H\mathbb{Q} \rangle \vee \bigvee_{p \text{ prime}} \langle S/p \rangle, \quad \langle
    \operatorname{BP} \rangle \ge \langle H\mathbb{F}_p \rangle \vee \bigvee_{n=1}^\infty \langle K(n)
    \rangle, \quad \langle E(n) \rangle = \bigvee_{i=0}^n \langle K(i) \rangle.$$ '
  hint: Show that $\langle K(i) \wedge K(j) \rangle = \langle * \rangle$ for $i \ne j$, meaning Morava
    $K$-theories are mutually orthogonal
  locator: null
  sub_index: null
