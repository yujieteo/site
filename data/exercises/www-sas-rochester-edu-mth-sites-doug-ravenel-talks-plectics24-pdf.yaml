  text: '(The Smash Product Conjecture and the Telescope Conjecture)  1. **Smash Product Conjecture:**
    State the conjecture asserting that localization commutes with smash products: $L_n X \simeq X \wedge
    L_n \mathbb{S}$. 2. **Telescope Conjecture:** For a finite type-$n$ spectrum $X$ with $v_n$-periodic
    self-map $v$, compare the telescope localization $v^{-1}X = \operatorname{hocolim}(X \xrightarrow{v}
    \Sigma^{-d}X \to \dots)$ with the chromatic localization $L_{K(n)} X$. State the recent resolution
    of the Telescope Conjecture (disproven for $n \ge 2$ at all primes by Burklund, Hahn, Levy, and Schlank). '
  hint: The telescope localization $v^{-1}X$ detects unstable algebraic phenomena that are completed away
    in the Morava $K$-theory localization $L_{K(n)} X$
