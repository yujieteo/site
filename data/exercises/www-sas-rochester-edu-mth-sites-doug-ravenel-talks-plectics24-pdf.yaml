  text: '(Homotopy Groups of Spheres and the Adams-Novikov Spectral Sequence) Trace the classification
    of the stable homotopy groups of spheres $\pi_*^s(\mathbb{S}) = \varinjlim \pi_{n+k}(S^n)$, originating
