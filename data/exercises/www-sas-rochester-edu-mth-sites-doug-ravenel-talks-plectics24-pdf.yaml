  text: '(The Chromatic Spectral Sequence and Astronomical Analogy) Describe the chromatic spectral sequence
    constructed by Miller, Ravenel, and Wilson. Explain why each column displays $v_n$-periodic families
    and how the $n$-th chromatic layer is controlled by the continuous cohomology of the $n$-th Morava
    stabilizer group $\mathbb{S}_n = \operatorname{Aut}(\mathbb{G}_n) \cong \mathcal{O}_{D_{1/n}}^\times$. '
  hint: The name "chromatic" comes from the decomposition of the stable homotopy of spheres into periodic
    monochromatic components, analogous to decomposing light into spectral lines
