  text: What is a prismatic structure sheaf and how does it compare to the crystalline structure sheaf?
  hint: The crystalline structure sheaf $\mathcal{O}_{\mathrm{crys}}$ evaluates on divided-power thickenings
    $(U \hookrightarrow T, \delta)$ to return $T$; the prismatic structure sheaf $\mathcal{O}_{\mathbin{\Delta}}$
    evaluates on $\delta$-pair thickenings $(B, IB)$ to return the $\delta$-ring $B$, which does not require
    divided powers and thus works for arbitrarily ramified $p$-adic bases.
