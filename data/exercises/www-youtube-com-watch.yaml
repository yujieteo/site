  text: Under what circumstances does one want the wedge product of a differential 1-form with itself
    $\omega \wedge \omega$?
  hint: For ordinary commuting 1-forms $\omega \wedge \omega = 0$; one wants $\omega \wedge \omega \neq
    0$ when working with non-abelian Lie-algebra-valued gauge connection 1-forms $A = A_\mu^a T^a dx^\mu$,
    where $A \wedge A = \frac{1}{2}[A, A] = \frac{1}{2}[A_\mu, A_\nu] dx^\mu \wedge dx^\nu$ computes the
    non-linear curvature term in Yang-Mills theory and Maurer-Cartan equations.
