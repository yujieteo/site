  text: Is the statement of the first de Rham cohomology related to the Fundamental Theorem of Calculus?
  hint: Yes; $H_{\mathrm{dR}}^1(X) = \ker(d_1)/\mathrm{im}(d_0)$ measures the exact obstruction to finding
    a global potential function $f$ whose derivative is a given closed 1-form $\omega$ ($df = \omega$),
    which is the global topological obstruction to the Fundamental Theorem of Calculus $\int_a^b \omega
    = f(b) - f(a)$.
