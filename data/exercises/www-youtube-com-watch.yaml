  text: '(Ergodicity of K-Cross on the Adeles and Noncommutative Spaces) Let $\mathbb{A}_K$ be equipped
    with its additive Haar measure. Explain why the quotient space $X_K = K^\times \backslash \mathbb{A}_K$
    must be treated as a noncommutative space. '
  hint: The multiplicative action of $K^\times$ on $\mathbb{A}_K$ is ergodic, so every measurable $K^\times$-invariant
    function is almost everywhere constant; no non-trivial measurable injection into $\mathbb{R}$ exists,
    requiring $X_K$ to be treated as the leaf space of a foliation or a crossed-product $C^*$-algebra
