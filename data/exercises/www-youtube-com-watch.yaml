  text: Why care about principal Cartier divisors?
  hint: A principal Cartier divisor formalizes the vanishing locus of a single non-zero-divisor $d \in
    R$, translating codimension-1 geometric hypersurfaces into invertible ideals $(d) \subset R$ where
    intersection theory, line bundles, and deformation specializations can be computed algebraically.
