  text: '(Schwartz Kernels, Scaling Operators, and Orbital Traces) Compute the trace of the scaling operator
    $x \mapsto \lambda x$ on the local field $K_v$. '
  hint: The scaling operator on $K_v$ is represented by the Schwartz distribution kernel $\delta(y - \lambda
    x)$; its distributional trace on the diagonal is given by $\int_{K_v} \delta(x - \lambda x)\,dx =
