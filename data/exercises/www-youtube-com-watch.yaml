  text: What is a $q$-integer and why does it generalize ordinary integers and primes?
  hint: $[n]_q = \frac{q^n - 1}{q - 1} = 1 + q + \dots + q^{n-1}$ is a polynomial deformation in a parameter
    $q$ that specializes to $n$ as $q \to 1$; when $n = p$ is prime, $[p]_q$ is an irreducible cyclotomic
    factor in $\mathbb{Z}[q]$ that serves as a $q$-deformed prime generating the prismatic ideal in $q$-crystalline
    cohomology.
