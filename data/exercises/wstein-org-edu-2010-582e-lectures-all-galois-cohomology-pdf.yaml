- id: wstein-org-edu-2010-582e-lectures-all-galois-cohomology-pdf#001
  text: 'Define 1-cocycles $Z^1(G, A) = \{f: G \to A \mid f(\sigma \tau) = f(\sigma) + \sigma f(\tau)\}$
    and 1-coboundaries $B^1(G, A) = \{f(\sigma) = \sigma a - a\}$, and compute $H^1(G, A) = Z^1(G, A)
    / B^1(G, A)$'
