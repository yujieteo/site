- id: ncatlab-org-nlab-show-twisted-cohomology#001
  text: What is stable cohomology?
  hint: Cohomology by the Eilenberg-Steenrod axioms. This is the lowest order Goodwillie approximation
    to nonabelian cohomology. A cocycle in nonabelian cohomology is a map to any homotopy type. A cocycle
    in generalised Eilenberg-Steenrod cohomology is a map into a stable homotopy type.
