- id: ncatlab-org-nlab-show-twisted-cohomology#000
  text: What is twisted cohomology?
  hint: Homotopy types of spaces of sections in comparison to mapping spaces. The basic assumption is
    that for nonabelian cohomology, one looks at hom-spaces. For generalised Eilnberg-Steenrod cohomology
    one looks at stabilisations. But for twisted cohomology one looks at spaces of sections, not just
    hom spaces.
