- id: dec41-user-srcf-net-h-iii-m-hydrodynamic-stability-full#004
  text: What is the Boussinesq approximation?
  hint: Density differences are neglected in inertial terms and retained only in the buoyancy gravitational
    term $g \Delta\rho$.
