- id: dec41-user-srcf-net-h-iii-m-hydrodynamic-stability-full#001
  text: When are inviscid and irrotational assumptions valid?
  hint: In potential flow where $\nabla \times u = 0$, allowing velocity to be expressed as the gradient
    of a potential $u = \nabla \phi$ satisfying $\nabla^2 \phi = 0$.
  locator: null
