- id: dec41-user-srcf-net-h-iii-m-hydrodynamic-stability-full#003
  text: What is the Rayleigh-Taylor instability?
  hint: An instability that occurs when a heavy fluid is placed on top of a lighter fluid in a gravitational
    field.
  locator: null
