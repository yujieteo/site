  text: When is a line bundle $\mathcal{L}$ very ample, ample, and basepoint-free?
  hint: $\mathcal{L}$ is basepoint-free if global sections generate each stalk; very ample if global sections
    define a closed embedding $i \colon X \hookrightarrow \mathbb{P}_A^n$; ample if $\mathcal{L}^{\otimes
    m}$ is very ample for some $m \ge 1$.
  locator: null
