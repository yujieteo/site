  hint: A scheme $X$ is factorial if all its local rings $\mathcal{O}_{X, x}$ are unique factorization
    domains (UFDs); since UFDs are integrally closed, every factorial scheme is normal and its Weil divisors
    coincide with Cartier divisors.
