  text: What is a sheaf of sets on a topological space $X$?
  hint: 'A presheaf $\mathcal{F}$ satisfying two axioms for every open cover $U = \bigcup_{i \in I} U_i$:
    (1) Locality/Separation: if $s, t \in \mathcal{F}(U)$ satisfy $s|_{U_i} = t|_{U_i}$ for all $i$, then
    $s = t$; (2) Gluing: if sections $s_i \in \mathcal{F}(U_i)$ satisfy $s_i|_{U_i \cap U_j} = s_j|_{U_i
    \cap U_j}$ for all $i, j$, there exists a unique $s \in \mathcal{F}(U)$ such that $s|_{U_i} = s_i$.'
