  text: What is a Cartier divisor and its associated class group?
  hint: A global section of $\mathcal{K}_X^\times / \mathcal{O}_X^\times$ represented by data $\{(U_i,
    f_i)\}$ with $f_i / f_j \in \mathcal{O}_X^\times(U_i \cap U_j)$; the group of Cartier divisors modulo
    principal divisors $\mathcal{K}_X^\times(X)$ is canonically isomorphic to the Picard group $\mathrm{Pic}(X)$
    on locally factorial integral schemes.
  locator: null
  sub_index: null
  search_text: what is a cartier divisor and its associated class group? a global section of $\mathcal{k}_x^\times
    / \mathcal{o}_x^\times$ represented by data $\{(u_i, f_i)\}$ with $f_i / f_j \in \mathcal{o}_x^\times(u_i
    \cap u_j)$; the group of cartier divisors modulo principal divisors $\mathcal{k}_x^\times(x)$ is canonically
    isomorphic to the picard group $\mathrm{pic}(x)$ on locally factorial integral schemes.
