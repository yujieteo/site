    duality isomorphism $\mathrm{hom}_{\mathcal{o}_x}(\mathcal{f}, \omega_x) \xrightarrow{\sim} h^n(x,
    \mathcal{f})^\vee$ for all coherent sheaves $\mathcal{f}$.
