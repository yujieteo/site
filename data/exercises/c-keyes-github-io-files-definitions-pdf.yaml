  text: What is an $F$-acyclic object in an abelian category?
  hint: An object $A$ such that $R^i F(A) = 0$ (or $L_i F(A) = 0$) for all $i > 0$; injective objects
    are acyclic for left-exact functors and projective objects are acyclic for right-exact functors.
  locator: null
  sub_index: null
  search_text: what is an $f$-acyclic object in an abelian category? an object $a$ such that $r^i f(a)
    = 0$ (or $l_i f(a) = 0$) for all $i > 0$; injective objects are acyclic for left-exact functors and
    projective objects are acyclic for right-exact functors.
- id: c-keyes-github-io-files-definitions-pdf#002
  text: What is an affine scheme and an affine morphism?
  hint: An affine scheme is isomorphic to $\mathrm{Spec}(A)$ for a commutative ring $A$; a morphism $f
    \colon X \to Y$ is affine if for every affine open $U = \mathrm{Spec}(B) \subset Y$, the preimage
    $f^{-1}(U)$ is affine, isomorphic to $\mathrm{Spec}(A)$.
  locator: null
  sub_index: null
  search_text: what is an affine scheme and an affine morphism? an affine scheme is isomorphic to $\mathrm{spec}(a)$
    for a commutative ring $a$; a morphism $f \colon x \to y$ is affine if for every affine open $u =
    \mathrm{spec}(b) \subset y$, the preimage $f^{-1}(u)$ is affine, isomorphic to $\mathrm{spec}(a)$.
