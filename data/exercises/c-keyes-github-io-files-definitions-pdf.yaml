  text: When is an $\mathcal{O}_X$-module coherent?
  hint: An $\mathcal{O}_X$-module $\mathcal{F}$ is coherent if it is of finite type and for every open
    $U$ and morphism $\mathcal{O}_U^n \to \mathcal{F}|_U$, the kernel is of finite type; on locally Noetherian
    schemes, coherence is equivalent to being quasi-coherent and locally of finite type.
