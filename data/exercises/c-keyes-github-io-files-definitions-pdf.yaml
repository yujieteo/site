  text: How is Čech cohomology defined on a separated scheme with an affine cover?
  hint: The cohomology of the complex $C^p(\mathcal{U}, \mathcal{F}) = \prod_{i_0 < \dots < i_p} \mathcal{F}(U_{i_0}
    \cap \dots \cap U_{i_p})$ with differential $d\alpha = \sum_{j=0}^{p+1} (-1)^j \alpha|_{U_{i_0} \dots
    \hat{U}_{i_j} \dots U_{i_{p+1}}}$; it computes sheaf cohomology $H^p(X, \mathcal{F})$.
  locator: null
  sub_index: null
  search_text: how is čech cohomology defined on a separated scheme with an affine cover? the cohomology
    of the complex $c^p(\mathcal{u}, \mathcal{f}) = \prod_{i_0 < \dots < i_p} \mathcal{f}(u_{i_0} \cap
    \dots \cap u_{i_p})$ with differential $d\alpha = \sum_{j=0}^{p+1} (-1)^j \alpha|_{u_{i_0} \dots \hat{u}_{i_j}
