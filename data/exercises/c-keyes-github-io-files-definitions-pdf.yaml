    the degree of a closed point $p$ is $[k(p):k]$; the degree of a finite map $\pi \colon c \to c'$ is
    the rank of $\pi_* \mathcal{o}_c$; the degree of a line bundle $\mathcal{l}$ is $\deg(\mathcal{l})
    = \chi(c, \mathcal{l}) - \chi(c, \mathcal{o}_c)$, matching $\sum n_i [k(p_i):k]$ for $\mathcal{l}
    \cong \mathcal{o}_c(\sum n_i p_i)$.
