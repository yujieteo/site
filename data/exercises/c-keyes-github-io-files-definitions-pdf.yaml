  hint: A coherent sheaf $\omega_X$ equipped with a trace map $\mathrm{Tr} \colon H^n(X, \omega_X) \to
    k$ inducing the Serre duality isomorphism $\mathrm{Hom}_{\mathcal{O}_X}(\mathcal{F}, \omega_X) \xrightarrow{\sim}
    H^n(X, \mathcal{F})^\vee$ for all coherent sheaves $\mathcal{F}$.
  locator: null
