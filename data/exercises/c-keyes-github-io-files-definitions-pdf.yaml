- id: c-keyes-github-io-files-definitions-pdf#000
  text: What is an abelian category vs. a semiadditive category?
  hint: A category is semiadditive if finite coproducts and products are canonically isomorphic (biproducts
    $\oplus$); it is abelian if it is semiadditive, enriched over abelian groups, every morphism has a
    kernel and a cokernel, and every monomorphism is the kernel of its cokernel and every epimorphism
    is the cokernel of its kernel.
  locator: null
