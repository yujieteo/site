  text: How is the degree of a point, a map, and a line bundle defined on a projective curve $C$?
  hint: The degree of a closed point $p$ is $[k(p):k]$; the degree of a finite map $\pi \colon C \to C'$
    is the rank of $\pi_* \mathcal{O}_C$; the degree of a line bundle $\mathcal{L}$ is $\deg(\mathcal{L})
    = \chi(C, \mathcal{L}) - \chi(C, \mathcal{O}_C)$, matching $\sum n_i [k(p_i):k]$ for $\mathcal{L}
    \cong \mathcal{O}_C(\sum n_i p_i)$.
  locator: null
  sub_index: null
