  text: 'State the Tate Local Duality theorem: for an abelian variety $A$ over a local field $K$, the
    cup product pairing $H^1(K, A) \times A''(K) \to H^2(K, \mathbb{G}_m) \cong \mathbb{Q}/\mathbb{Z}$
    is a perfect pairing of locally compact groups, where $A''$ is the dual abelian variety'
