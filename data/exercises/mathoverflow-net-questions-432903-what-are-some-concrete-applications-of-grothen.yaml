- id: mathoverflow-net-questions-432903-what-are-some-concrete-applications-of-grothen#004
  text: How is an integral kernel transform (Fourier-Mukai functor) formulated via the six-functor formalism?
  hint: For a correspondence $X \xleftarrow{p_X} X \times Y \xrightarrow{p_Y} Y$ and kernel $\mathcal{K}
    \in \mathcal{D}(X \times Y)$, the integral transform is the six-functor operation $\Phi_{\mathcal{K}}(\mathcal{F})
    := (p_Y)_! (p_X^* \mathcal{F} \otimes \mathcal{K})$; when $X \times Y$ is proper, $(p_Y)_! \cong (p_Y)_*$,
    recovering the classical Fourier-Mukai transform.
  locator: null
  sub_index: null
  search_text: how is an integral kernel transform (fourier-mukai functor) formulated via the six-functor
    formalism? for a correspondence $x \xleftarrow{p_x} x \times y \xrightarrow{p_y} y$ and kernel $\mathcal{k}
    \in \mathcal{d}(x \times y)$, the integral transform is the six-functor operation $\phi_{\mathcal{k}}(\mathcal{f})
    := (p_y)_! (p_x^* \mathcal{f} \otimes \mathcal{k})$; when $x \times y$ is proper, $(p_y)_! \cong (p_y)_*$,
