- id: mathoverflow-net-questions-432903-what-are-some-concrete-applications-of-grothen#006
  text: Why does the six-functor formalism guarantee that smooth, proper, flat, and étale morphisms are
    unconditionally stable under base change?
  hint: Because in any six-functor formalism, the base change transformations $g^* f_! \cong (f')_! (g')^*$,
    $f^! g_* \cong (g')_* (f')^!$, and $f_!(A \otimes f^* B) \cong f_!(A) \otimes B$ are axioms required
    to hold for ALL Cartesian squares; any morphism property defined by a six-functor relation ($f_! \cong
    f_*$ for proper, $f^! \cong f^*$ for étale, $f^*$ t-exact for flat, $f^! \cong f^*(d)[2d]$ for smooth)
    is automatically preserved upon substitution into the base-change diagrams.
  locator: null
