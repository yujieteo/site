  text: What is a Cartier divisor $D \subset X$ in the six-functor formalism?
  hint: A closed subscheme $i \colon D \hookrightarrow X$ of codimension 1 whose ideal sheaf $\mathcal{I}_D
    = \mathrm{fib}(\mathbf{1}_X \to i_* \mathbf{1}_D)$ is $\otimes$-invertible in $\mathcal{D}(X)$; the
    line bundle associated to $D$ is the dual $\mathcal{O}_X(D) := \underline{\mathrm{Hom}}(\mathcal{I}_D,
    \mathbf{1}_X)$.
