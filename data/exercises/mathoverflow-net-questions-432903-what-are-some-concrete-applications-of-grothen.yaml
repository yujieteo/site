- id: mathoverflow-net-questions-432903-what-are-some-concrete-applications-of-grothen#002
  text: How is the Chern class / Euler class of a vector bundle $\mathcal{E}$ formulated via six-functor
    Gysin maps?
  hint: Let $s_0 \colon X \hookrightarrow \mathbf{V}(\mathcal{E})$ be the zero section of a rank-$r$ vector
    bundle. The Euler class is the composite pullback $c_r(\mathcal{E}) := s_0^* (s_0)_*(\mathbf{1}_X)
    \in H^{2r}(X, \mathbb{Z}(r))$, which measures the derived self-intersection of the zero section and
    matches the top Chern class $c_{\mathrm{top}}(\mathcal{E}) \cap [X]$.
  locator: null
  sub_index: null
  search_text: how is the chern class / euler class of a vector bundle $\mathcal{e}$ formulated via six-functor
