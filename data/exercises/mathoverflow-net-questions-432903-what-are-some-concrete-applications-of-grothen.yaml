- id: mathoverflow-net-questions-432903-what-are-some-concrete-applications-of-grothen#000
  text: How is the derived self-intersection of the diagonal $X \times_{X \times X}^{\mathbf{R}} X$ computed
    via the six-functor formalism?
  hint: The derived self-intersection is the derived loop space $\mathcal{L}X$; its structure sheaf is
    the six-functor pullback $\mathcal{O}_{\mathcal{L}X} \simeq \Delta^* \Delta_*(\mathcal{O}_X) \simeq
    \bigoplus_{i=0}^{\dim X} \Omega_X^i[i]$, which computes the Hochschild homology $\mathbf{HH}_*(X)$
    via the Hochschild-Kostant-Rosenberg (HKR) isomorphism.
  locator: null
  sub_index: null
  search_text: how is the derived self-intersection of the diagonal $x \times_{x \times x}^{\mathbf{r}}
    x$ computed via the six-functor formalism? the derived self-intersection is the derived loop space
    $\mathcal{l}x$; its structure sheaf is the six-functor pullback $\mathcal{o}_{\mathcal{l}x} \simeq
    \delta^* \delta_*(\mathcal{o}_x) \simeq \bigoplus_{i=0}^{\dim x} \omega_x^i[i]$, which computes the
    hochschild homology $\mathbf{hh}_*(x)$ via the hochschild-kostant-rosenberg (hkr) isomorphism.
- id: mathoverflow-net-questions-432903-what-are-some-concrete-applications-of-grothen#001
  text: How does one invent the derived self-intersection of the diagonal?
  hint: 'Motivation: compute the self-intersection of a variety without moving cycles. Invention: resolve
    the diagonal $\Delta \colon X \hookrightarrow X \times X$ by the Koszul complex of its conormal bundle
    $\Omega_X^1$; pulling back along $\Delta^*$ turns the Koszul differentials to zero, leaving the exterior
    algebra of differential forms $\bigwedge^\bullet \Omega_X^1$.'
  locator: null
  sub_index: null
