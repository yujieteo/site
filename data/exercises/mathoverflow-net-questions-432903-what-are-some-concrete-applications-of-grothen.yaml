- id: mathoverflow-net-questions-432903-what-are-some-concrete-applications-of-grothen#007
  text: What is a quasi-coherent ideal sheaf $\mathcal{I}_Z$ of a closed subscheme $i \colon Z \hookrightarrow
    X$ in the six-functor formalism?
  hint: '$\mathcal{I}_Z$ is the homotopy fiber of the unit map of the $(i^*, i_*)$ adjunction on the structure
    sheaf: $\mathcal{I}_Z := \mathrm{fib}(\mathcal{O}_X \xrightarrow{\mathrm{unit}} i_* i^* \mathcal{O}_X)
    \in \mathcal{D}(X)$; the classical exact sequence $0 \to \mathcal{I}_Z \to \mathcal{O}_X \to i_* \mathcal{O}_Z
    \to 0$ is the exact triangle $\mathcal{I}_Z \to \mathbf{1}_X \to i_* \mathbf{1}_Z \xrightarrow{+1}$.'
  locator: null
  sub_index: null
  search_text: 'what is a quasi-coherent ideal sheaf $\mathcal{i}_z$ of a closed subscheme $i \colon z
    \hookrightarrow x$ in the six-functor formalism? $\mathcal{i}_z$ is the homotopy fiber of the unit
    map of the $(i^*, i_*)$ adjunction on the structure sheaf: $\mathcal{i}_z := \mathrm{fib}(\mathcal{o}_x
    \xrightarrow{\mathrm{unit}} i_* i^* \mathcal{o}_x) \in \mathcal{d}(x)$; the classical exact sequence
    $0 \to \mathcal{i}_z \to \mathcal{o}_x \to i_* \mathcal{o}_z \to 0$ is the exact triangle $\mathcal{i}_z
    \to \mathbf{1}_x \to i_* \mathbf{1}_z \xrightarrow{+1}$.'
