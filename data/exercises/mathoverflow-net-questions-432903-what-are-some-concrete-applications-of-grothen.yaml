  text: What is the normal bundle $\mathcal{N}_{Z/X}$ of a regular closed immersion $i \colon Z \hookrightarrow
    X$ in the six-functor formalism?
  hint: 'The vector bundle on $Z$ whose shifted dual (conormal sheaf) is computed by the excess pullback
    of the ideal sheaf: $\mathcal{N}_{Z/X}^* \simeq i^* \mathcal{I}_Z \simeq i^* \mathrm{fib}(\mathbf{1}_X
    \to i_* \mathbf{1}_Z)$; in terms of dualizing complexes, relative purity gives $\det(\mathcal{N}_{Z/X})
    \cong i^!(\mathbf{1}_X)^\vee[-r]$ where $r = \mathrm{codim}(Z)$.'
