- id: mathoverflow-net-questions-432903-what-are-some-concrete-applications-of-grothen#005
  text: How does one invent Fourier-Mukai transforms?
  hint: 'Motivation: generalize the continuous Fourier transform $\widehat{f}(y) = \int f(x) e^{-2\pi
    i x y} dx$ to derived categories of algebraic varieties. Invention: Mukai replaced the integral kernel
    $e^{-2\pi i x y}$ with the Poincaré line bundle $\mathcal{P}$ on an abelian variety $A \times \widehat{A}$,
    proving that $\mathbf{R}(p_2)_*(p_1^*(-) \otimes \mathcal{P})$ is an equivalence of derived categories
    $\mathcal{D}(A) \xrightarrow{\sim} \mathcal{D}(\widehat{A})$.'
  locator: null
