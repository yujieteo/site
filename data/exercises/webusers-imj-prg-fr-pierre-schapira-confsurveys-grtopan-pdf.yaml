  text: '(Temperate Functions and Distributions on M_sa) Let $U \in \operatorname{Op}_{M_{\text{sa}}}$.
    Define what it means for a smooth function $f \in \mathcal{C}^\infty(U)$ to have polynomial growth
    of order $N$ at a boundary point $p \in M$, and define temperate functions $\mathcal{C}_{M_{\text{sa}}}^{\infty,
    \text{tp}}(U)$ and temperate distributions $\mathcal{D}b_{M_{\text{sa}}}^{\text{tp}}(U)$. '
  hint: Polynomial growth requires $\sup_{x \in K \cap U} \operatorname{dist}(x, K \setminus U)^N |f(x)|
    < \infty$ for a compact neighborhood $K$; a function is temperate if all its derivatives have polynomial
    growth
