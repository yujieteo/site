  text: '(Subanalytic Sets) Define a semi-analytic subset $S \subseteq M$ of a real analytic manifold
    $M$ as a locally closed subset defined locally by finitely many analytic inequalities $\{f_i(x) <
    0, g_j(x) \le 0\}$. Explain why the family of semi-analytic sets is inadequate for geometric operations
    and how the family of subanalytic sets $\operatorname{SbA}(M)$ resolves this. '
  hint: Semi-analytic sets are not stable under proper direct images except when $\dim M \le 2$; $\operatorname{SbA}(M)$
    is the smallest family containing semi-analytic sets that is stable under proper direct images, preimages,
    finite unions/intersections, complements, interiors, and closures
