    projective dimension, $\mathrm{pd}_a(m) + \mathrm{depth}_a(m) = \mathrm{depth}(a)$. serre used this
    to prove that $a$ is regular if and only if the residue field $k = a/\mathfrak{m}$ has finite projective
    dimension, in which case $\mathrm{pd}_a(k) = \dim(a)$, establishing that localization of a regular
    local ring is always regular.'
- id: adjectivesproject-org#002
  text: What does an unramified morphism mean, and how does it differ from a formally unramified morphism?
  hint: 'Motivation: formalize covering maps without branch points or NILPOTENT TANGENT VECTORS. Invention:
    a morphism $f \colon X \to Y$ is unramified if it is locally of finite presentation and for all $x
    \in X$, $\mathfrak{m}_{f(x)} \mathcal{O}_{X, x} = \mathfrak{m}_x$ and $k(x)/k(f(x))$ is a finite separable
    field extension (equivalently, $\Omega_{X/Y}^1 = 0$, or the diagonal $\Delta_{X/Y}$ is an open immersion);
    it is formally unramified if it satisfies the infinitesimal uniqueness lifting property for any square-zero
    thickening without requiring finite presentation. Mental image: an unramified map is a local immersion
    with discrete fibers: sheets of the cover never pinch together, tangent spaces do not collapse, and
    the Jacobian derivative has trivial kernel.'
