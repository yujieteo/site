    = 0$ on $m$; this proves that $a \subset b$ is an integral extension if and only if $b$ is a finite
    $a$-module. mental image: cayley-hamilton takes a linear transformation on a finite-dimensional space
    and turns its characteristic polynomial into an algebraic integral dependence equation, recall that
    integral extensions generalise finite field extensions in galois theory.'
- id: adjectivesproject-org#012
  text: What is so special about unique infinitesimal lifting for formally étale morphisms, why does it
    deserve the name "étale", and why care about square-zero extensions?
  hint: 'Motivation: formalize the inverse function theorem algebraically without real/complex numbers.
    Invention: a morphism $f \colon X \to Y$ is formally étale if for every commutative ring $A$ and square-zero
    ideal $I \subset A$ ($I^2 = 0$), any morphism $\mathrm{Spec}(A/I) \to X$ has a unique lift $\mathrm{Spec}(A)
    \to X$ over $Y$; Weil and Grothendieck chose the word "étale" (French for "slack water" / "calm, unrippled
    sea") because the sheets of the covering space lie flat and smooth over the base without creases,
    tears, or tangent overlaps; square-zero ideals $I^2 = 0$ represent first-order infinitesimal tangent
    vectors ($k[\epsilon]/\epsilon^2$). Mental image: Étale = an algebraic local diffeomorphism where
    infinitesimal tangent patches lift uniquely with zero deformation and zero obstruction.'
  locator: null
