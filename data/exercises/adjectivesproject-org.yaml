- id: adjectivesproject-org#008
  text: Is every quasi-compact immersion an affine morphism? Chain together the relevant theorems to prove
    or refute this
  hint: 'Not directly claimed, but one can chain "quasi-compact immersions are quasi-affine" together
    with "affine morphisms are quasi-affine" run in reverse — quasi-affine does NOT imply affine in general
    (quasi-affine is strictly weaker). A counterexample: $\mathbb{A}^2_\mathbb{Q}\setminus\{0\} \to \mathbb{A}^2_\mathbb{Q}$
    is a quasi-compact open immersion (hence a quasi-compact immersion, hence quasi-affine) but its source
    is not affine (removing a codimension-2 point from an affine scheme of dimension $\ge 2$ leaves a
    non-affine scheme, since $H^1$ of the structure sheaf is nonzero), so the morphism itself is not affine.'
  locator: null
