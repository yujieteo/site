- id: adjectivesproject-org#006
  text: Exhibit a scheme from the database that is reduced and irreducible but NOT normal, and name the
    theorem whose converse this violates
  hint: 'The nodal cubic $\operatorname{Spec}\mathbb{Q}[x,y]/(y^2-x^2(x+1))$-type scheme, represented
    in the database as "nodal cubic," is reduced and irreducible (integral) but singular at the node,
    hence not normal, since two branches meet there and normalization separates them. This shows the converse
    of "locally factorial schemes are normal" (and of "normal schemes are reduced") fails: reduced does
    not imply normal, only normal implies reduced.'
