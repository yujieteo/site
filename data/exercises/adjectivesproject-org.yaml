- id: adjectivesproject-org#003
  text: Give an example of a morphism that is universally closed and injective but NOT a closed immersion,
    testing the limits of "universally homeomorphism is integral, universally injective and surjective."
  hint: The normalization-type map "cusp to $\mathbb{A}^1_\mathbb{Q}$" (parametrizing the cuspidal cubic
    $y^2=x^3$ by $t \mapsto (t^2,t^3)$) is a bijective, universally closed, integral morphism (finite,
    hence proper) that is a universally injective homeomorphism but not an isomorphism, since it is not
    formally unramified at the cusp point — the induced map on tangent spaces is not injective, so it
    fails to be unramified/étale and hence is not a closed immersion despite being bijective.
