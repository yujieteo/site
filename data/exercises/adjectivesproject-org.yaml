- id: adjectivesproject-org#014
  text: Using "morphisms with quasi-compact source and quasi-separated target are quasi-compact" and the
    scheme $\bigsqcup_{i=1}^\infty \operatorname{Spec}\mathbb{Q} \to \operatorname{Spec}\mathbb{Q}$, determine
    whether this morphism is quasi-compact, and explain why the countable disjoint union example is the
    minimal counterexample to naive intuitions about compactness
  hint: '$\bigsqcup_{i=1}^\infty \operatorname{Spec}\mathbb{Q} \to \operatorname{Spec}\mathbb{Q}$ is NOT
    quasi-compact: the source has no finite subcover by affine opens covering all countably many components
    (each $\operatorname{Spec}\mathbb{Q}$ summand is itself clopen, so a finite union of them can never
    cover the whole disjoint union). This shows the hypothesis "quasi-compact source" in the cited theorem
    is not automatic — a disjoint union of infinitely many affines is not itself quasi-compact even though
    each piece is affine, making it the standard minimal witness that infinite disjoint unions break quasi-compactness.'
