  text: Why are all fields regular local rings?
  hint: 'Motivation: identify the zero-dimensional base cases of regular schemes. Invention: for a field
    $k$, its only ideal is $(0)$, which is the unique maximal ideal $\mathfrak{m} = (0)$; its dimension
