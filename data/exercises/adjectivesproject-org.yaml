- id: adjectivesproject-org#005
  text: Why are regular local rings always local complete intersections?
  hint: 'Motivation: show that smooth points are the cleanest possible complete intersections. Invention:
    in a regular local ring $(A, \mathfrak{m})$, the maximal ideal $\mathfrak{m}$ is generated by a regular
    sequence of length $d = \dim(A)$; viewing $A$ as the quotient of itself by the empty sequence $(0)$,
    the Koszul complex $K_\bullet(A; x_1, \dots, x_d)$ is exact in positive degrees, proving that $A$
    is cut out by zero relations inside a regular ring, hence is a complete intersection with $I/I^2 =
    0$.'
  locator: null
  sub_index: null
  search_text: 'why are regular local rings always local complete intersections? motivation: show that
