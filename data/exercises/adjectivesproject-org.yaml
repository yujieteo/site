  text: 'Is "Noetherian" a property that is preserved by taking $\operatorname{Spec}$ of a non-finitely-generated
    $\mathbb{Q}$-algebra like $\mathbb{Q}[x^q : q \in \mathbb{Q}_{>0}]$? Contrast with "definition of
    finite type" applied to $\operatorname{Spec}\mathbb{Q}[x^q : q \in \mathbb{Q}_{>0}] \to \operatorname{Spec}\mathbb{Q}$'
  hint: 'No — $\mathbb{Q}[x^q : q\in\mathbb{Q}_{>0}]$ is generated by infinitely many independent monomials
    with fractional exponents, so as a $\mathbb{Q}$-algebra it is not finitely generated, hence $\operatorname{Spec}\mathbb{Q}[x^q:q\in\mathbb{Q}_{>0}]
    \to \operatorname{Spec}\mathbb{Q}$ fails "definition of finite type" (finite type requires a surjection
    from a polynomial ring in finitely many variables). Since finite type is necessary for a Noetherian
    scheme of finite type over a field to have a Noetherian coordinate ring via Hilbert basis theorem,
    and here finite type already fails, one cannot even invoke Hilbert basis theorem to conclude Noetherianity;
    direct inspection shows the ideal generated by $\{x^q : q < 1\}$ is not finitely generated, confirming
    non-Noetherian.'
