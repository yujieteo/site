- id: adjectivesproject-org#004
  text: What is a syntomic morphism and why does it mean flat, locally of finite presentation, with local
    complete intersection (lci) fibers?
  hint: 'Motivation: define the exact geometric class of morphisms where deformation theory is controlled
    by a 2-term cotangent complex and differential forms carry an intrinsic crystalline-Frobenius structure.
    Invention: a morphism $f \colon X \to Y$ is syntomic if it is flat, locally of finite presentation,
    and its fibers are local complete intersections; in prismatic $F$-gauges, syntomic morphisms are precisely
    those where the relative prismatic complex $\mathbin{\Delta}_{X/Y}$ behaves like a smooth deformation,
    allowing syntomic cohomology $\mathbb{Z}_p(n)(X)$ to compute $p$-adic motivic cohomology. Mental image:
    Syntomic = flat family of varieties whose fibers are clean local complete intersections, differential
    forms deform without higher obstructions.'
