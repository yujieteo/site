- id: adjectivesproject-org#001
  text: Is every injective morphism separated? Conversely, is every separated morphism injective?
  hint: 'Injective $\implies$ separated, via "injective morphisms are separated." The converse is false:
    closed immersions and quasi-affine morphisms are separated but need not be injective on points, e.g.
    $\operatorname{Spec} \mathbb{C} \to \operatorname{Spec} \mathbb{R}$ is separated (affine target) but
    its underlying map need not be injective on the relevant fiber structure — more simply, $\mathbb{A}^1_\mathbb{Q}
    \to \operatorname{Spec}\mathbb{Q}$ is separated but wildly non-injective.'
