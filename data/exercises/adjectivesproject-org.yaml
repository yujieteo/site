- id: adjectivesproject-org#002
  text: The affine line with doubled origin is a classic non-separated scheme. Which theorem in the "morphism"
    adjectives list, when applied to the doubling map $\mathbb{A}^1_\mathbb{Q} \to \mathbb{A}^1_\mathbb{Q}$-with-doubled-origin,
    explains the failure of separatedness, and what does this say about "surjective immersions are closed
    immersions"?
  hint: 'The two copies of $\mathbb{A}^1$ glue along $\mathbb{A}^1 \setminus \{0\}$, an open immersion
    that is not closed, so its diagonal is not closed and the doubled-origin scheme fails separatedness.
    This shows the hypothesis of surjectivity in "surjective immersions are closed immersions" is essential:
    the open immersion $\mathbb{A}^1 \setminus \{0\} \hookrightarrow \mathbb{A}^1$ is an immersion that
    is not surjective and indeed not closed.'
