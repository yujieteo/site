- id: adjectivesproject-org#009
  text: Why does quasi-separatedness always appear alongside quasi-compactness (qcqs)?
  hint: 'Motivation: do Noetherian-style algebraic geometry on general non-Noetherian schemes. Invention:
    a scheme is quasi-compact if it is a finite union of affine opens; it is quasi-separated if the intersection
    of any two quasi-compact opens is quasi-compact (meaning the diagonal $\Delta \colon X \to X \times
    X$ is quasi-compact); together, qcqs ensures that quasi-coherent sheaves are determined by their sections
    on a finite diagram of affine opens, making derived functors, limits, and descent constructible. Mental
    image: Quasi-compact = finite number of charts; Quasi-separated = charts overlap along finite pieces,
    preventing infinitely jagged boundaries between local patches.'
