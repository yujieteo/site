  text: Why is an étale morphism the algebraic analogue of a local isomorphism?
  hint: 'Motivation: provide local coordinate charts in the étale topology. Invention: on the level of
    complete local rings, an étale morphism $f \colon X \to Y$ at a point $x \mapsto y$ induces an isomorphism
    on completed stalks $\widehat{\mathcal{O}}_{Y, y} \xrightarrow{\sim} \widehat{\mathcal{O}}_{X, x}$
    and on tangent spaces $T_x X \xrightarrow{\sim} T_y Y$, meaning that in the formal and étale topologies,
    $X$ and $Y$ are indistinguishable.'
