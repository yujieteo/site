    infinitesimal tangent patches lift uniquely with zero deformation and zero obstruction.'
- id: adjectivesproject-org#013
  text: Why is flatness paired with surjectivity to form a faithfully flat morphism? What does it mean
    for checking properties on pullback is equivalent to checking on the base?
  hint: 'Motivation: ensure that checking algebraic properties after pullback is completely equivalent
    to checking them on the base. Invention: a flat morphism $f \colon X \to Y$ preserves exact sequences
    of modules but might miss points; adding surjectivity ($f(X) = Y$) ensures that a complex of $\mathcal{O}_Y$-modules
    $M^\bullet$ is exact if and only if $f^* M^\bullet$ is exact, making $f^*$ a faithful, conservative
    functor on module categories. Mental image: Faithfully flat = a family of spaces that covers every
    point of the base and varies with uniform algebraic thickness, so no fiber is missing and no homological
    information is lost.'
