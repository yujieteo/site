  text: Is $\mathbb{A}^2_\mathbb{Q} \to \mathbb{A}^2_\mathbb{Q}/S_2$ (the quotient by the swap action)
    étale? Use "étale is formally étale and locally of finite presentation" together with ramification
    along the diagonal to decide
