    if the mirror image is closed, points are separated; if it is open, points are isolated from their
    neighbors.'
- id: adjectivesproject-org#008
  text: How does one come up with the idea of a normal scheme and what does it mean to be integrally closed
    in the field of fractions?
  hint: 'Motivation: eliminate codimension-1 singularities (pinches, self-intersections, cusps) where
    rational functions fail to have well-defined poles and zeroes. Invention: an integral domain $A$ is
    normal if every monic polynomial in $A[x]$ having a root in the fraction field $K(A)$ has that root
    already in $A$; geometrically, by Serre''s Criterion ($R_1 + S_2$), a normal scheme is smooth in codimension
    1 ($R_1$) and has no embedded component spikes ($S_2$), meaning every bounded rational function extends
    across codimension $\ge 2$ subsets. Mental image: Normal = a smooth surface where all self-intersecting
    creases (like $y^2 = x^2(x+1)$) and cusps (like $y^2 = x^3$) have been pulled apart and uncreased
    into smooth separate sheets.'
