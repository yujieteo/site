- id: adjectivesproject-org#020
  text: 'State and justify: "morphisms with affine source and target are affine."'
  hint: 'if X is affine, then for every affine open V ⊂ Y, f^{-1}(V) ⊂ X is a subscheme of an affine scheme;
    but more simply, when X itself is affine, f^{-1}(V) is affine automatically because f factors through
    Spec of the coordinate ring and a closed/open condition is not even needed — the whole preimage X
    is affine so any subscheme argument is unnecessary; formally: the composite Spec(A) → X → Y with X
    affine makes f automatically affine since affineness of the source scheme is inherited by all preimages
    via base change to affine opens of an affine scheme.'
  locator: null
  sub_index: null
