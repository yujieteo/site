- id: adjectivesproject-org#007
  text: The database lists $\operatorname{Spec}\left(\prod_{i=1}^\infty \mathbb{Q}\right)$ as an example
    scheme. Determine whether it is Noetherian, and use "Hilbert basis theorem" and "definition Noetherian"
    to justify your answer, then explain why $\bigsqcup_{i=1}^\infty \operatorname{Spec}\mathbb{Q} \to
    \operatorname{Spec}\left(\prod_{i=1}^\infty\mathbb{Q}\right)$ is relevant
  hint: '$\prod_{i=1}^\infty \mathbb{Q}$ is not Noetherian: the chain of ideals $I_n = \{(a_i) : a_i =
    0 \text{ for } i \le n\}$ is strictly increasing and never stabilizes, violating the ascending chain
    condition in "definition Noetherian." The Hilbert basis theorem only guarantees Noetherianity is preserved
    under finitely generated polynomial extensions of Noetherian rings, which does not apply to this infinite
    product. The disjoint union map is the natural comparison map from the "constructible" countable disjoint
    union into the Zariski spectrum of the product ring, illustrating that $\operatorname{Spec}$ of an
    infinite product has "extra" points (ultrafilter points) beyond the union of the factors.'
  locator: null
