- id: adjectivesproject-org#010
  text: What is a projective bundle $\mathbb{P}(\mathcal{E})$ and how is a projective morphism defined?
  hint: 'Motivation: construct the algebraic family of lines in a vector bundle over a base scheme. Invention:
    for a quasi-coherent $\mathcal{O}_S$-module $\mathcal{E}$, the projective bundle is $\mathbb{P}(\mathcal{E})
    := \mathbf{Proj}_S(\mathrm{Sym}_{\mathcal{O}_S}^\bullet(\mathcal{E}))$; a morphism $f \colon X \to
    S$ is projective if it factors as a closed embedding $i \colon X \hookrightarrow \mathbb{P}(\mathcal{E})$
    into a projective bundle of a finite-rank locally free sheaf $\mathcal{E}$ over $S$. Mental image:
    Projective bundle = a smooth fiber bundle whose fibers are classical projective spaces $\mathbb{P}^n$,
    parameterizing 1-dimensional quotients of the fiber vector spaces.'
