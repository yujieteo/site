- id: adjectivesproject-org#007
  text: Why is the diagonal morphism $\Delta \colon X \to X \times_S X$ fundamental, and what does it
    mean for the diagonal to be an open or closed immersion?
  hint: 'Motivation: encode separation, unramifiedness, and intersection theory, DIAGONAL MORPHISM IS
    UNIVERSAL SELF INTERSECTION OF SPACE. Invention: $\Delta$ is the graph of the identity map; (1) $\Delta$
    is a closed immersion $\iff X \to S$ is separated (Hausdorff separation); (2) $\Delta$ is an open
    immersion $\iff X \to S$ is unramified (fibers are discrete and non-singular); (3) $\Delta$ is an
    isomorphism $\iff X \to S$ is a monomorphism; (4) for any two morphisms $f, g \colon Y \to X$, the
    equalizer $\{y \in Y \mid f(y) = g(y)\} \cong (Y \times Y) \times_{X \times X} X$ is the pullback
    of the diagonal. REALLY GOOD MENTAL IMAGE: instead of thinking of Hausdorff open balls, try thinking
    of the diagonal is the mirror reflection of the space inside its product; if the mirror image is closed,
    points are separated; if it is open, points are isolated from their neighbors.'
