- id: adjectivesproject-org#241
  text: Chain the theorems "finite locally free is finite, flat and locally of finite presentation," "finite
    is proper and quasi-finite," and "flat morphisms locally of finite presentation are universally open"
    to conclude something about finite locally free morphisms; then check this against "finite morphisms
    with affine target are H-projective" for consistency
  hint: A finite locally free morphism is simultaneously proper (hence universally closed) AND universally
    open (from flat + locally of finite presentation), so its image in each connected component is a union
    of connected components — i.e. finite locally free morphisms are "clopen" onto unions of components
    of the target. This is consistent with "finite morphisms with affine target are H-projective," since
    H-projective morphisms are always proper, and here properness is independently confirmed via the finite
    $\Rightarrow$ proper route.
