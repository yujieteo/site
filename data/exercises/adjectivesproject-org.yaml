- id: adjectivesproject-org#000
  text: What is the relationship between regular schemes, complete intersections, and Cohen-Macaulay schemes?
  hint: 'Motivation: organize geometric singularities into a hierarchy based on how well homological algebra
    and dimension theory behave. Invention: there is a strict hierarchy of Noetherian local rings: $\mathbf{Regular}
    \implies \mathbf{Complete\ Intersection\ (lci)} \implies \mathbf{Gorenstein} \implies \mathbf{Cohen\text{-}Macaulay}
    \implies \mathbf{Reduced/Unmixed}$. A regular local ring has minimal maximal ideal generator count
    equal to its dimension ($\dim \mathfrak{m}/\mathfrak{m}^2 = \dim A$); a complete intersection is a
    regular ring quotiented out by a regular sequence ($A \cong R/(f_1, \dots, f_k)$); a Cohen-Macaulay
    ring has depth equal to its dimension ($\mathrm{depth}(A) = \dim(A)$). Mental image: Regular = completely
    smooth manifold; Complete intersection = smooth manifold cut out by clean transverse equations; Cohen-Macaulay
    = singular space with no floating isolated components or embedded zero-dimensional spikes.'
