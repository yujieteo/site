- id: adjectivesproject-org#010
  text: The database records both "$\mathbb{A}^1_\mathbb{Q}$ to cusp" and "$\mathbb{A}^1_\mathbb{Q}$ to
    nodal cubic" as morphisms. Are these open immersions, closed immersions, or neither? Use "definition
    étale" and "surjective immersions are closed immersions" to argue your answer
  hint: Neither. Both are the normalization maps $t \mapsto (t^2, t^3)$ and $t \mapsto (t^2-1, t(t^2-1))$
    respectively, which are bijective on closed points but not isomorphisms locally at the singular point,
    so they cannot be immersions (an immersion would realize the source as a subscheme, but the local
    ring maps are not surjective/injective as required, and in particular they are not unramified there,
    violating "definition étale"). Since they are not immersions at all, "surjective immersions are closed
    immersions" does not apply — the surjectivity alone is insufficient without the immersion hypothesis.
