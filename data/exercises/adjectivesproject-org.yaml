    ring a.
- id: adjectivesproject-org#001
  text: What is the definition of a Cohen-Macaulay scheme?
  hint: every local ring O_{X,x} is Cohen-Macaulay, i.e. depth(O_{X,x}) = dim(O_{X,x}).
  locator: null
  sub_index: null
  search_text: what is the definition of a cohen-macaulay scheme? every local ring o_{x,x} is cohen-macaulay,
    i.e. depth(o_{x,x}) = dim(o_{x,x}).
- id: adjectivesproject-org#002
  text: What is the definition of a connected scheme?
  hint: the underlying topological space |X| is connected, i.e. cannot be written as a disjoint union
    of two nonempty open subsets.
  locator: null
  sub_index: null
  search_text: what is the definition of a connected scheme? the underlying topological space |x| is connected,
    i.e. cannot be written as a disjoint union of two nonempty open subsets.
- id: adjectivesproject-org#003
  text: What is the definition of an excellent scheme?
  hint: X is locally Noetherian, universally catenary, and all its local rings have geometrically regular
    formal fibers (Grothendieck's technical finiteness condition ensuring good behavior under completion
    and base change).
  locator: null
  sub_index: null
  search_text: what is the definition of an excellent scheme? x is locally noetherian, universally catenary,
