  text: How does one motivate the definition of properness as separated, of finite type, and universally
    closed?
  hint: 'Motivation: define the algebraic analogue of compact topological spaces ($X$ is compact $\iff
    X \to *$ is closed and separated). Invention: Chevalley and Grothendieck realized that in algebraic
    geometry, the Zariski topology is too coarse for compactness ($X$ is always quasi-compact), but a
    map is truly compact if under any auxiliary test space $Y$, the projection $X \times Y \to Y$ maps
    closed algebraic sets to closed algebraic sets (universally closed) with Hausdorff limits (separated)
    and finitely many equations (finite type). Mental image: Proper = algebraic compactness: solutions
    to equations inside $X$ cannot branch into multiple limits (separated) and cannot escape off to infinity
    as parameters vary (universally closed).'
