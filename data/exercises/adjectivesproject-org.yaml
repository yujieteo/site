- id: adjectivesproject-org#003
  text: Why is an integral scheme defined as both reduced and irreducible, and how does this relate to
    integral extensions and domains?
  hint: 'Motivation: match the geometric notion of a whole, undivided geometric space with the algebraic
    notion of an integral domain $A$ (no zero-divisors). Invention: a scheme $X$ is integral if and only
    if for every open set $U$, $\mathcal{O}_X(U)$ is an integral domain; geometrically, being an integral
    domain means there are no non-zero nilpotent functions (reduced: $\sqrt{(0)} = 0$) and the space cannot
    be split into two proper closed subsets (irreducible: prime ideal $(0)$ is unique and minimal); an
    integral extension $A \subset B$ geometrically corresponds to a finite dominant map between integral
    schemes. Mental image: Integral = a solid, one-piece geometric object with no ghost nilpotents (reduced)
    and no overlapping multi-component pieces (irreducible).'
