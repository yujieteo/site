- id: adjectivesproject-org#000
  text: Does "flat" imply "universally open"? If so, cite the strongest hypothesis needed; if not, exhibit
    a counterexample from the database
  hint: False in general — flatness alone does not give universally open. The correct implication is "flat
    morphisms locally of finite presentation are universally open." Without local finite presentation,
    flatness can fail to be open, e.g. $\operatorname{Spec} \mathbb{Q}(x) \to \mathbb{A}^1_\mathbb{Q}$
    is flat (localization) but not of finite presentation, and its image is a single non-open point.
