    by finding a scheme-theoretic obstruction using $\operatorname{Spec}\mathbb{F}_2(t_1^{1/2}, t_2^{1/2},
    \ldots) \to \operatorname{Spec}\mathbb{F}_2(t_1,t_2,\ldots)$
  hint: This morphism has regular source and target (both are fields, hence regular local rings) and can
    be of finite presentation in suitable truncations, yet it is a purely inseparable extension in positive
    characteristic, so $\Omega^1_{X/Y} \ne 0$ and it fails to be smooth (in fact it is not even unramified).
    This shows regular + locally of finite presentation is not enough without also being (generically)
    separable / flat with smooth geometric fibers — regularity of the rings alone does not see inseparability.
