- id: adjectivesproject-org#006
  text: What is a universally catenary scheme and how does it relate to Grothendieck's excellent schemes?
  hint: 'Motivation: ensure that the dimension of a subvariety does not depend on the choice of maximal
    chain of prime ideals connecting it to the ambient space. Invention: a ring $A$ is catenary if all
    maximal chains of prime ideals between any two primes $\mathfrak{p} \subset \mathfrak{q}$ have the
    exact same length; it is universally catenary if every finitely generated $A$-algebra is catenary;
    an excellent scheme is a universally catenary, locally Noetherian scheme where formal completions
    are geometrically regular and normalization commutes with finite type maps, ensuring resolution of
    singularities and dimension calculus are well-behaved. Mental image: subvariety dim does not depennd
    on maximal chain of prime ideals.'
