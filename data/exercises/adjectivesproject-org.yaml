- id: adjectivesproject-org#001
  text: What is the Auslander-Buchsbaum Formula and how does it characterize regular local rings?
  hint: 'Motivation: relate the projective dimension of a module to the depth of the ring. Invention:
    for a Noetherian local ring $(A, \mathfrak{m})$ and a non-zero finitely generated $A$-module $M$ of
    finite projective dimension, $\mathrm{pd}_A(M) + \mathrm{depth}_A(M) = \mathrm{depth}(A)$. Serre used
    this to prove that $A$ is regular if and only if the residue field $k = A/\mathfrak{m}$ has finite
    projective dimension, in which case $\mathrm{pd}_A(k) = \dim(A)$, establishing that localization of
    a regular local ring is always regular.'
  locator: null
  sub_index: null
  search_text: 'what is the auslander-buchsbaum formula and how does it characterize regular local rings?
    motivation: relate the projective dimension of a module to the depth of the ring. invention: for a
