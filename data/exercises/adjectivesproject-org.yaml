- id: adjectivesproject-org#011
  text: Is $\mathbb{A}^2_\mathbb{Q} \to \mathbb{A}^2_\mathbb{Q}/S_2$ (the quotient by the swap action)
    étale? Use "étale is formally étale and locally of finite presentation" together with ramification
    along the diagonal to decide
  hint: No. The quotient map is ramified exactly along the diagonal $\{x=y\}$, where the stabilizer is
    nontrivial ($\mathbb{Z}/2$), so the residue field extension / tangent map fails the infinitesimal
    lifting criterion for formal étaleness there, i.e. $\Omega^1_{X/Y} \ne 0$ along the diagonal. It is
    locally of finite presentation (finite morphism of finite type schemes) but fails formal étaleness,
    hence by "étale is formally étale and locally of finite presentation" it cannot be étale, even though
    it is étale away from the diagonal.
