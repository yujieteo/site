- id: adjectivesproject-org#240
  text: 'The scheme $\operatorname{Spec}\mathbb{Q}[x_1,x_2,\ldots]/(x_i^2 - x_i,\, x_ix_j : i\ne j)$ is
    listed in the database. Is it Noetherian? Is it reduced? Use these to test "excellent schemes are
    locally Noetherian" vacuously or not'
  hint: It is reduced, since the relations $x_i^2=x_i$ and $x_ix_j=0$ generate a radical ideal (a Boolean-type
    ring, isomorphic to functions on a countable discrete set with a basepoint). It is NOT Noetherian,
    since the ideal $(x_1,x_2,\ldots)$ is not finitely generated (infinitely many independent idempotent-like
    generators). Consequently it cannot be excellent, since "excellent schemes are locally Noetherian"
    forces excellence to fail here — this scheme is a genuine witness that reduced does not imply Noetherian,
    hence not excellent.
