- id: adjectivesproject-org#011
  text: How does the Cayley-Hamilton Theorem relate to integral ring extensions and module-finite morphisms?
  hint: 'Motivation: prove that an element generating a finite module satisfies a monic polynomial equation.
    Invention: if $M$ is a finitely generated $A$-module and $\phi \colon M \to M$ is an $A$-linear endomorphism,
    the Cayley-Hamilton determinant formula on the matrix of $\phi$ produces a monic polynomial $P(T)
    = \det(T \cdot I - [\phi]) = T^n + a_{n-1}T^{n-1} + \dots + a_0 \in A[T]$ such that $P(\phi) = 0$
    on $M$; this proves that $A \subset B$ is an integral extension if and only if $B$ is a finite $A$-module.
    Mental image: Cayley-Hamilton takes a linear transformation on a finite-dimensional space and turns
    its characteristic polynomial into an algebraic integral dependence equation, recall that integral
    extensions generalise finite field extensions in Galois theory.'
  locator: null
  sub_index: null
  search_text: 'how does the cayley-hamilton theorem relate to integral ring extensions and module-finite
    morphisms? motivation: prove that an element generating a finite module satisfies a monic polynomial
