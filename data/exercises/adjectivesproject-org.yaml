  text: Is "finite fibers" equivalent to "quasi-finite"? Use the database's definitions to pin down the
    discrepancy
  hint: 'They differ by finiteness conditions on the morphism itself. "Injective morphisms have finite
    fibers" shows finite fibers is a weak, purely set-theoretic condition following from injectivity alone.
    "Definition quasi-finite" additionally requires the morphism to be of finite type (or finite presentation)
    with locally finite fibers, a scheme-theoretic condition. An example distinguishing them: $\operatorname{Spec}\overline{\mathbb{Q}}
    \to \operatorname{Spec}\mathbb{Q}$ has finite (indeed infinite but each residue field finite over
    the base only in the algebraic sense) — more precisely $\operatorname{Spec}\mathbb{Q}(x) \to \operatorname{Spec}\mathbb{Q}$
    has one point with infinite residue field extension, so it has "finite fibers" as a set but is not
    quasi-finite since it fails finite type.'
