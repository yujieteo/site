- id: people-mpim-bonn-mpg-de-gaitsgde-book-basicsdag-pdf#002
  text: 'Define $n$-connective and $n$-coconnective prestacks via Kan extensions. '
  hint: The inclusion of $n$-connective derived affine schemes into all derived affine schemes admits
    a fully faithful left adjoint; a prestack is $n$-coconnective if it is completely determined by its
    values on $n$-coconnective affine schemes
