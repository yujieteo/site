- id: people-mpim-bonn-mpg-de-gaitsgde-book-basicsdag-pdf#009
  text: 'Define flatness for morphisms of derived affine schemes $S'' \to S$. '
  hint: A morphism $\operatorname{Spec} B \to \operatorname{Spec} A$ is flat if $\pi_0(B)$ is flat over
    $\pi_0(A)$ in the classical sense and the natural base change map $\pi_i(A) \otimes_{\pi_0(A)} \pi_0(B)
    \xrightarrow{\sim} \pi_i(B)$ is an isomorphism for all $i$
