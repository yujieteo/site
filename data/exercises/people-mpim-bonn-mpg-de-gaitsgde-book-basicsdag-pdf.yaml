- id: people-mpim-bonn-mpg-de-gaitsgde-book-basicsdag-pdf#003
  text: 'Explain the convergence condition for prestacks in derived deformation theory. '
  hint: A prestack $\mathcal{Y}$ is convergent if the natural evaluation map $\mathcal{Y}(S) \to \lim_{n}
    \mathcal{Y}(\tau_{\le n} S)$ to its Postnikov $n$-coconnective truncations is an equivalence for every
    affine scheme $S$, ensuring formal deformation theory works
  locator:
