    have kinetic term, get l_g = -1/4 f_mu nu f^mu nu. this gets a u(1) gauge theory, since exp(ia) is
    in u(1), a_mu in lie algebra u(1). real lie algebra will have nontrivial lie bracket, however, so
    this is a simple demo
