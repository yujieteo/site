- id: dec41-user-srcf-net-h-iii-l-the-standard-model-full#000
  text: What gauge groups mediate the fundamental forces in the Standard Model?
  hint: The gauge group is $\mathrm{SU}(3)_C \times \mathrm{SU}(2)_L \times \mathrm{U}(1)_Y$, mediating
    strong, weak, and hypercharge interactions via gluons, $W^\pm/Z^0$ bosons, and photons.
  locator: null
  sub_index: null
