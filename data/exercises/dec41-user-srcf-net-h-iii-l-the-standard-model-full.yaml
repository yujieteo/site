- id: dec41-user-srcf-net-h-iii-l-the-standard-model-full#009
  text: How does one demo gauge symmetry for the Dirac equation as the simplest example?
  hint: Dirac equation, p(x) -> exp(ia) p(x) for any constant a, leaves all observable physics unchanged,
    problem, a varies with x, kinetic term in Dirac Lagrangian nolonger invariant, solution, at gauge
    covariant derivative D_mu, D_mu p(x) -> exp(i a(x)) D_mu p(x), replace del_mu with D_mu in Lagrangian,
    get Gauge invariant theory, really it means introducting A_mu(x) which is a Gauge field, D_mu p(x)
    = (del_mu + igA_mu) p(x), then transform A_mu -> A_mu - 1/g del_mu a(x), a(x) is the gauge transform
    since a now depends on x. Check that D_mu transforms ass claimed, A_mu(x) is thought of as physical
    field, have kinetic term, get L_g = -1/4 F_mu nu F^mu nu. This gets a U(1) gauge theory, since exp(ia)
    is in U(1), A_mu in Lie algebra u(1). Real Lie algebra will have nontrivial Lie bracket, however,
    so this is a simple demo
  locator: null
  sub_index: null
