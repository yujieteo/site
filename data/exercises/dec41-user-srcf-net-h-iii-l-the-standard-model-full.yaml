    0 \\ v \end{pmatrix}$, breaking $\mathrm{su}(2)_l \times \mathrm{u}(1)_y \to \mathrm{u}(1)_{\mathrm{em}}$.
- id: dec41-user-srcf-net-h-iii-l-the-standard-model-full#005
  text: What is Goldstone's theorem?
  hint: Spontaneous breaking of continuous global symmetries produces massless scalar particles (Nambu-Goldstone
    bosons).
  locator: null
  sub_index: null
  search_text: what is goldstone's theorem? spontaneous breaking of continuous global symmetries produces
    massless scalar particles (nambu-goldstone bosons).
- id: dec41-user-srcf-net-h-iii-l-the-standard-model-full#006
  text: What is the Higgs mechanism?
  hint: In gauge theories, Goldstone bosons are "eaten" to become the longitudinal polarization states
    of gauge bosons, giving mass to $W^\pm$ and $Z^0$ while keeping the photon massless.
  locator: null
  sub_index: null
