    the longitudinal polarization states of gauge bosons, giving mass to $w^\pm$ and $z^0$ while keeping
    the photon massless.
- id: dec41-user-srcf-net-h-iii-l-the-standard-model-full#007
  text: What are Dirac and chiral representations of spinors?
  hint: Dirac spinors transform under the Clifford algebra $\{\gamma^\mu, \gamma^\nu\} = 2\eta^{\mu\nu}$;
    chiral projectors $P_{L,R} = \frac{1}{2}(1 \mp \gamma^5)$ separate left- and right-handed Weyl fermions.
  locator: null
  sub_index: null
