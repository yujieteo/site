    is $\mathrm{su}(3)_c \times \mathrm{su}(2)_l \times \mathrm{u}(1)_y$, mediating strong, weak, and
    hypercharge interactions via gluons, $w^\pm/z^0$ bosons, and photons.
- id: dec41-user-srcf-net-h-iii-l-the-standard-model-full#001
  text: How are gauge fields represented geometrically?
  hint: As connection 1-forms $A = A_\mu^a T^a dx^\mu$ on principal $G$-bundles with curvature given by
    the field strength $F = dA + g A \wedge A$.
  locator: null
  sub_index: null
  search_text: how are gauge fields represented geometrically? as connection 1-forms $a = a_\mu^a t^a
    dx^\mu$ on principal $g$-bundles with curvature given by the field strength $f = da + g a \wedge a$.
- id: dec41-user-srcf-net-h-iii-l-the-standard-model-full#002
  text: What are the exact symmetries of the Standard Model?
  hint: Color $\mathrm{SU}(3)_C$ and electromagnetism $\mathrm{U}(1)_{\mathrm{EM}}$ are unbroken exact
    gauge symmetries.
  locator: null
  sub_index: null
  search_text: what are the exact symmetries of the standard model? color $\mathrm{su}(3)_c$ and electromagnetism
    $\mathrm{u}(1)_{\mathrm{em}}$ are unbroken exact gauge symmetries.
- id: dec41-user-srcf-net-h-iii-l-the-standard-model-full#003
  text: What are gauge anomalies?
  hint: Classical symmetries of an action that are broken by quantum loop effects in the path integral
    measure.
  locator: null
  sub_index: null
  search_text: what are gauge anomalies? classical symmetries of an action that are broken by quantum
    loop effects in the path integral measure.
- id: dec41-user-srcf-net-h-iii-l-the-standard-model-full#004
  text: How does spontaneous symmetry breaking occur in the Standard Model?
  hint: The Higgs scalar field develops a non-zero vacuum expectation value $\langle \Phi \rangle = \frac{1}{\sqrt{2}}
    \begin{pmatrix} 0 \\ v \end{pmatrix}$, breaking $\mathrm{SU}(2)_L \times \mathrm{U}(1)_Y \to \mathrm{U}(1)_{\mathrm{EM}}$.
  locator: null
  sub_index: null
