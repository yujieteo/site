    \mp \gamma^5)$ separate left- and right-handed weyl fermions.
- id: dec41-user-srcf-net-h-iii-l-the-standard-model-full#008
  text: What is the CPT theorem?
  hint: Any local, Lorentz-invariant unitary quantum field theory is invariant under the combined operations
    of Charge conjugation, Parity inversion, and Time reversal.
  locator: null
  sub_index: null
  search_text: what is the cpt theorem? any local, lorentz-invariant unitary quantum field theory is invariant
    under the combined operations of charge conjugation, parity inversion, and time reversal.
