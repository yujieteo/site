- id: opus-bibliothek-uni-augsburg-de-opus4-files-42513-notes-pdf#000
  text: Compute the internal meaning of a sheaf of $\mathcal{O}_X$-modules to be of finite type
  hint: 'An $\mathcal{O}_X$-module $\mathcal{F}$ is locally of finite type externally if and only if internally
    in $\mathbf{Sh}(X)$ it is a finitely generated $\mathcal{O}_X$-module: $\mathbf{Sh}(X) \models \exists
    n \in \mathbb{N},\, \exists x_1, \dots, x_n \in \mathcal{F},\, \forall x \in \mathcal{F},\, \exists
    a_1, \dots, a_n \in \mathcal{O}_X,\, x = \sum_{i=1}^n a_i x_i$.'
  locator:
    kind: page
    value: '11'
    number: 11
  sub_index: 0
  search_text: 'compute the internal meaning of a sheaf of $\mathcal{o}_x$-modules to be of finite type
    an $\mathcal{o}_x$-module $\mathcal{f}$ is locally of finite type externally if and only if internally
    in $\mathbf{sh}(x)$ it is a finitely generated $\mathcal{o}_x$-module: $\mathbf{sh}(x) \models \exists
    n \in \mathbb{n},\, \exists x_1, \dots, x_n \in \mathcal{f},\, \forall x \in \mathcal{f},\, \exists
    a_1, \dots, a_n \in \mathcal{o}_x,\, x = \sum_{i=1}^n a_i x_i$.'
- id: opus-bibliothek-uni-augsburg-de-opus4-files-42513-notes-pdf#001
  text: Compute using a commutative algebra fact the finite generation of the middle term in a short exact
    sequence of modules, and deduce the sheaf version
  hint: In ordinary algebra, if $0 \to M' \to M \to M'' \to 0$ is exact and $M', M''$ are finitely generated,
    then $M$ is finitely generated; since the internal logic of $\mathbf{Sh}(X)$ validates constructive
    module algebra, if $\mathcal{F}'$ and $\mathcal{F}''$ are locally of finite type, then $\mathcal{F}$
    is locally of finite type.
  locator:
    kind: page
    value: '11'
    number: 11
  sub_index: 1
  search_text: compute using a commutative algebra fact the finite generation of the middle term in a
    short exact sequence of modules, and deduce the sheaf version in ordinary algebra, if $0 \to m' \to
    m \to m'' \to 0$ is exact and $m', m''$ are finitely generated, then $m$ is finitely generated; since
    the internal logic of $\mathbf{sh}(x)$ validates constructive module algebra, if $\mathcal{f}'$ and
    $\mathcal{f}''$ are locally of finite type, then $\mathcal{f}$ is locally of finite type.
