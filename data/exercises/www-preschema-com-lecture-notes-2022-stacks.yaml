  text: 'State the Artin-Lurie Representability Theorem for derived algebraic stacks. (Hint: A functor
    $\mathcal{X} \colon \mathbf{CAlg}^{\mathrm{an}} \to \mathcal{S}$ is a derived Artin stack locally
    of finite presentation if and only if: (1) $\mathcal{X}$ is an $\infty$-sheaf for the derived étale
    topology; (2) $\mathcal{X}$ is nilcomplete ($\mathcal{X}(A) \xrightarrow{\sim} \varprojlim \mathcal{X}(\tau_{\le
    n} A)$); (3) $\mathcal{X}$ is cohesive (preserves fiber products over square-zero extensions); (4)
    $\mathcal{X}$ admits a cotangent complex $\mathbb{L}_{\mathcal{X}}$ with Tor-amplitude in $(-\infty,
    1]$.)'
