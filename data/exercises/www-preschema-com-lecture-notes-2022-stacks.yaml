- id: www-preschema-com-lecture-notes-2022-stacks#008
  text: What is a category fibred in groupoids (CFG) over a base category $\mathcal{C}$?
  hint: A functor $p \colon \mathcal{X} \to \mathcal{C}$ such that for every morphism $f \colon V \to
    U$ in $\mathcal{C}$ and object $x \in \mathcal{X}$ over $U$, there exists a Cartesian lift $\phi \colon
    y \to x$ over $f$, and any two Cartesian lifts are canonically isomorphic.
