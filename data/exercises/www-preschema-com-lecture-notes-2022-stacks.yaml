- id: www-preschema-com-lecture-notes-2022-stacks#006
  text: What is a presheaf of groupoids (or 2-presheaf)?
  hint: A pseudofunctor / 2-functor $\mathcal{F} \colon \mathcal{C}^{\mathrm{op}} \to \mathbf{Grpd}$ assigning
    a groupoid $\mathcal{F}(U)$ to each object $U$, a pullback functor $f^* \colon \mathcal{F}(U) \to
    \mathcal{F}(V)$ to each morphism $f \colon V \to U$, and natural isomorphisms $(f \circ g)^* \cong
    g^* \circ f^*$ satisfying the cocycle associativity condition.
  locator: null
