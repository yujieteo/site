  text: State the Virtual Torus Localization Formula for quasi-smooth derived stacks
  hint: For a quasi-smooth derived stack $X$ equipped with an action of an algebraic torus $T$, the virtual
    fundamental class of $X$ localizes to the virtual fundamental class of the fixed-point derived stack
    $X^T$ via $[X]^{\mathrm{vir}} = \iota_* \left( \frac{[X^T]^{\mathrm{vir}}}{e^T(N^{\mathrm{vir}})}
    \right)$, where $e^T(N^{\mathrm{vir}})$ is the equivariant Euler class of the virtual normal complex
    $N^{\mathrm{vir}} = (\mathbb{T}_{X}|_{X^T})^{\mathrm{mov}}$.
