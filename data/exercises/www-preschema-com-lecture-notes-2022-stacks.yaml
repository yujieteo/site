- id: www-preschema-com-lecture-notes-2022-stacks#010
  text: What is a stack (in groupoids) over a site $(\mathcal{C}, \tau)$?
  hint: 'A category fibred in groupoids $p \colon \mathcal{X} \to \mathcal{C}$ satisfying two descent
    conditions: (1) for any two objects $x, y \in \mathcal{X}(U)$, the assignment $V \mapsto \mathrm{Isom}_{\mathcal{X}(V)}(x|_V,
    y|_V)$ is a sheaf of sets on $\mathcal{C}/U$; (2) every descent datum for objects in $\mathcal{X}$
    with respect to any covering $\{U_i \to U\}$ is effective (can be glued to an object over $U$).'
  locator: null
  sub_index: null
  search_text: 'what is a stack (in groupoids) over a site $(\mathcal{c}, \tau)$? a category fibred in
    groupoids $p \colon \mathcal{x} \to \mathcal{c}$ satisfying two descent conditions: (1) for any two
    objects $x, y \in \mathcal{x}(u)$, the assignment $v \mapsto \mathrm{isom}_{\mathcal{x}(v)}(x|_v,
    y|_v)$ is a sheaf of sets on $\mathcal{c}/u$; (2) every descent datum for objects in $\mathcal{x}$
    with respect to any covering $\{u_i \to u\}$ is effective (can be glued to an object over $u$).'
- id: www-preschema-com-lecture-notes-2022-stacks#011
  text: How does one invent stacks and what is the motivation?
  hint: 'Motivation: solve moduli problems that fail to be representable by schemes due to non-trivial
    automorphisms. Invention: Giraud, Deligne, and Mumford generalized sheaves of sets to sheaves of groupoids
    where isomorphisms form sheaves and objects can be glued along cocycles.'
