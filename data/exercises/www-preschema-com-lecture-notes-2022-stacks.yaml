- id: www-preschema-com-lecture-notes-2022-stacks#016
  text: What is the 2-Yoneda Lemma for stacks?
  hint: For any scheme $X \in \mathcal{C}$ (viewed as a stack via its representable functor $h_X$) and
    any stack $\mathcal{X}$, the functor $\mathrm{Hom}(h_X, \mathcal{X}) \to \mathcal{X}(X)$ given by
    evaluating on the identity $\mathrm{id}_X$ is an equivalence of groupoids.
  locator: null
