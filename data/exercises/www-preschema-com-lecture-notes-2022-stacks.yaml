- id: www-preschema-com-lecture-notes-2022-stacks#000
  text: What is a presheaf of sets on a site $(\mathcal{C}, \tau)$?
  hint: A contravariant functor $F \colon \mathcal{C}^{\mathrm{op}} \to \mathbf{Set}$ assigning a set
    of sections $F(U)$ to each object $U \in \mathcal{C}$ and a restriction map $\mathrm{res}_{U, V} \colon
    F(U) \to F(V)$ to each morphism $V \to U$.
  locator: null
  sub_index: null
  search_text: what is a presheaf of sets on a site $(\mathcal{c}, \tau)$? a contravariant functor $f
    \colon \mathcal{c}^{\mathrm{op}} \to \mathbf{set}$ assigning a set of sections $f(u)$ to each object
    $u \in \mathcal{c}$ and a restriction map $\mathrm{res}_{u, v} \colon f(u) \to f(v)$ to each morphism
    $v \to u$.
- id: www-preschema-com-lecture-notes-2022-stacks#001
  text: How does one invent presheaves and what is the motivation?
  hint: 'Motivation: abstract the assignment of local mathematical data (functions, forms, bundles) to
    geometric test spaces. Invention: define a contravariant functor from the category of open sets /
    test schemes to the category of sets.'
