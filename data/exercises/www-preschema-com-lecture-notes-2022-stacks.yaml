- id: www-preschema-com-lecture-notes-2022-stacks#002
  text: What is a sheaf of sets on a site $(\mathcal{C}, \tau)$?
  hint: A presheaf $F$ satisfying the equalizer condition $F(U) \to \prod_i F(U_i) \rightrightarrows \prod_{i,
    j} F(U_i \times_U U_j)$ for every covering family $\{U_i \to U\}$ in the Grothendieck topology $\tau$.
  locator: null
  sub_index: null
  search_text: what is a sheaf of sets on a site $(\mathcal{c}, \tau)$? a presheaf $f$ satisfying the
    equalizer condition $f(u) \to \prod_i f(u_i) \rightrightarrows \prod_{i, j} f(u_i \times_u u_j)$ for
    every covering family $\{u_i \to u\}$ in the grothendieck topology $\tau$.
