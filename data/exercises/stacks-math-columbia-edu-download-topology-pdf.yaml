- id: stacks-math-columbia-edu-download-topology-pdf#000
  text: '(Hausdorff Spaces and the Closed Diagonal: Section 5.3) Prove that a topological space $X$ is
    Hausdorff if and only if the diagonal $\Delta_X = \{(x, x) : x \in X\}$ is a closed subset of $X \times
    X$. '
  hint: Show that $(X \times X) \setminus \Delta_X$ is open by finding disjoint open neighborhoods $U_x,
    U_y \subset X$ for $x \ne y$ such that $U_x \times U_y \subseteq (X \times X) \setminus \Delta_X$;
    conversely, if $\Delta_X$ is closed, any basic open neighborhood in the complement yields disjoint
    open sets
  locator: null
  sub_index: null
  search_text: '(hausdorff spaces and the closed diagonal: section 5.3) prove that a topological space
    $x$ is hausdorff if and only if the diagonal $\delta_x = \{(x, x) : x \in x\}$ is a closed subset
