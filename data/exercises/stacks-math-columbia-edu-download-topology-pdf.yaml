- id: stacks-math-columbia-edu-download-topology-pdf#003
  text: '(Subspace, Quotient, and Submersive/Strict Topologies: Section 5.6) Compare the subspace topology
    (weakest/coarsest topology making the inclusion continuous) with the quotient topology on $Y = X/\sim$
    (strongest/finest topology making the projection $\pi: X \twoheadrightarrow Y$ continuous). Define
    a continuous map $f: X \to Y$ to be submersive (strict) if $f$ is surjective and $Y$ carries the quotient
    topology ($V \subseteq Y$ is open if and only if $f^{-1}(V)$ is open in $X$). '
  hint: Note that this topological definition of submersive is purely quotient-theoretic and distinct
    from differential submersions with surjective differentials
