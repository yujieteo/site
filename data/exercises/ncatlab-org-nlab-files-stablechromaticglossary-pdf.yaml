- id: ncatlab-org-nlab-files-stablechromaticglossary-pdf#015
  text: State the Periodicity Theorem of Hopkins-Smith
  hint: Every finite $p$-local spectrum $X$ of type $n$ (meaning $K(n-1)_*(X) = 0$ but $K(n)_*(X) \neq
    0$) admits a $v_n$-self map $f \colon \Sigma^{d} X \to X$ for sufficiently large $d$, and such self-maps
    are unique up to high powers and homotopy.
