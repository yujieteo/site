    = \{ x \in \mathbf{sp}_{(p)}^{\mathrm{fin}} \mid k(n-1)_*(x) = 0 \}$ for some integer $0 \le n \le
    \infty$, yielding a strict filtration $\dots \subset \mathcal{c}_{n+1} \subset \mathcal{c}_n \subset
    \dots \subset \mathcal{c}_1 \subset \mathcal{c}_0 = \mathbf{sp}_{(p)}^{\mathrm{fin}}$.
