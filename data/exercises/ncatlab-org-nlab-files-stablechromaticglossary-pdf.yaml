- id: ncatlab-org-nlab-files-stablechromaticglossary-pdf#002
  text: What is the Eilenberg-MacLane spectrum $H R$ for an abelian group $R$?
  hint: The spectrum representing ordinary singular cohomology $H^n(X; R) \cong [X, \Sigma^n H R]$ and
    homology, satisfying $\pi_0(H R) \cong R$ and $\pi_n(H R) = 0$ for $n \neq 0$, serving as the heart
    of the standard $t$-structure on $\mathbf{Sp}$.
  locator: null
  sub_index: null
  search_text: what is the eilenberg-maclane spectrum $h r$ for an abelian group $r$? the spectrum representing
    ordinary singular cohomology $h^n(x; r) \cong [x, \sigma^n h r]$ and homology, satisfying $\pi_0(h
    r) \cong r$ and $\pi_n(h r) = 0$ for $n \neq 0$, serving as the heart of the standard $t$-structure
    on $\mathbf{sp}$.
- id: ncatlab-org-nlab-files-stablechromaticglossary-pdf#003
  text: What is complex cobordism $M U$ and its coefficient ring $\pi_*(M U)$?
  hint: The Thom spectrum associated to the universal unitary bundles $B\mathrm{U}(n)$; by Quillen's theorem,
    its coefficient ring is isomorphic to the Lazard ring $\pi_*(M U) \cong L \cong \mathbb{Z}[x_1, x_2,
    \dots]$ with $|x_i| = 2i$, classifying 1-dimensional commutative formal group laws.
  locator: null
  sub_index: null
  search_text: what is complex cobordism $m u$ and its coefficient ring $\pi_*(m u)$? the thom spectrum
    associated to the universal unitary bundles $b\mathrm{u}(n)$; by quillen's theorem, its coefficient
    ring is isomorphic to the lazard ring $\pi_*(m u) \cong l \cong \mathbb{z}[x_1, x_2, \dots]$ with
    $|x_i| = 2i$, classifying 1-dimensional commutative formal group laws.
- id: ncatlab-org-nlab-files-stablechromaticglossary-pdf#004
  text: What is the Brown-Peterson spectrum $B P$ at a prime $p$?
  hint: The $p$-local direct summand of $M U_{(p)}$ split off by the idempotent Quillen reflector; its
    coefficient ring is $\pi_*(B P) \cong \mathbb{Z}_{(p)}[v_1, v_2, \dots]$ where $|v_n| = 2(p^n - 1)$,
    classifying $p$-typical formal group laws.
