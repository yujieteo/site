- id: ncatlab-org-nlab-files-stablechromaticglossary-pdf#013
  text: State the Thick Subcategory Theorem of Hopkins-Smith for finite $p$-local spectra $\mathbf{Sp}_{(p)}^{\mathrm{fin}}$
  hint: Every non-trivial thick subcategory of $\mathbf{Sp}_{(p)}^{\mathrm{fin}}$ is of the form $\mathcal{C}_n
    = \{ X \in \mathbf{Sp}_{(p)}^{\mathrm{fin}} \mid K(n-1)_*(X) = 0 \}$ for some integer $0 \le n \le
    \infty$, yielding a strict filtration $\dots \subset \mathcal{C}_{n+1} \subset \mathcal{C}_n \subset
    \dots \subset \mathcal{C}_1 \subset \mathcal{C}_0 = \mathbf{Sp}_{(p)}^{\mathrm{fin}}$.
  locator: null
  sub_index: null
  search_text: state the thick subcategory theorem of hopkins-smith for finite $p$-local spectra $\mathbf{sp}_{(p)}^{\mathrm{fin}}$
