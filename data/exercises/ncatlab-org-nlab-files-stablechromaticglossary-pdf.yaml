- id: ncatlab-org-nlab-files-stablechromaticglossary-pdf#005
  text: What is a formal group law (FGL) of dimension 1?
  hint: 'A formal power series $F(x, y) \in R[[x, y]]$ satisfying: (1) $F(x, 0) = x$ and $F(0, y) = y$;
    (2) $F(x, y) = F(y, x)$; (3) $F(F(x, y), z) = F(x, F(y, z))$.'
  locator: null
  sub_index: null
  search_text: 'what is a formal group law (fgl) of dimension 1? a formal power series $f(x, y) \in r[[x,
    y]]$ satisfying: (1) $f(x, 0) = x$ and $f(0, y) = y$; (2) $f(x, y) = f(y, x)$; (3) $f(f(x, y), z)
    = f(x, f(y, z))$.'
- id: ncatlab-org-nlab-files-stablechromaticglossary-pdf#006
  text: What is the height $h$ of a formal group law over a field $k$ of characteristic $p > 0$?
  hint: The unique integer $h \in \{1, 2, \dots, \infty\}$ such that the $p$-series satisfies $[p]_F(x)
    = a x^{p^h} + O(x^{p^h+1})$ with $a \neq 0$; height 1 corresponds to $\widehat{\mathbb{G}}_m$ and
    height $\infty$ to $\widehat{\mathbb{G}}_a$.
  locator: null
