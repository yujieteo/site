- id: ncatlab-org-nlab-files-stablechromaticglossary-pdf#007
  text: What is the Landweber Exact Functor Theorem (LEFT)?
  hint: An invariant prime ideal condition ensuring that for a $B P_*$-module $M$, the functor $X \mapsto
    B P_*(X) \otimes_{B P_*} M$ defines a homology theory on spaces; the condition requires that multiplication
    by $v_n$ on $M/(p, v_1, \dots, v_{n-1})M$ is injective for all $n \ge 0$.
  locator: null
  sub_index: null
  search_text: what is the landweber exact functor theorem (left)? an invariant prime ideal condition
