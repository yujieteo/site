- id: ncatlab-org-nlab-files-stablechromaticglossary-pdf#000
  text: What is the stable $\infty$-category of spectra $\mathbf{Sp}$?
  hint: The stabilization $\mathrm{Sp}(\mathcal{S}_*) = \varprojlim(\dots \xrightarrow{\Omega} \mathcal{S}_*
    \xrightarrow{\Omega} \mathcal{S}_*)$ of pointed spaces, forming a presentable, symmetric monoidal
    stable $\infty$-category whose homotopy category is the classical stable homotopy category.
  locator: null
  sub_index: null
  search_text: what is the stable $\infty$-category of spectra $\mathbf{sp}$? the stabilization $\mathrm{sp}(\mathcal{s}_*)
    = \varprojlim(\dots \xrightarrow{\omega} \mathcal{s}_* \xrightarrow{\omega} \mathcal{s}_*)$ of pointed
    spaces, forming a presentable, symmetric monoidal stable $\infty$-category whose homotopy category
    is the classical stable homotopy category.
- id: ncatlab-org-nlab-files-stablechromaticglossary-pdf#001
  text: What is the sphere spectrum $\mathbb{S}$?
  hint: The monoidal unit $\mathbf{1} \in \mathbf{Sp}$, whose endomorphism ring spectrum is $\mathrm{End}_{\mathbf{Sp}}(\mathbb{S})
    \simeq \mathbb{S}$ and whose homotopy groups $\pi_*(\mathbb{S})$ are the stable homotopy groups of
    spheres $\pi_*^s$.
  locator: null
