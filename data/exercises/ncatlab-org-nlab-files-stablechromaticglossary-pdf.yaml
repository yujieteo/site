  text: What is the Morava $K$-theory spectrum $K(n)$ at height $n$ and prime $p$?
  hint: The periodic ring spectrum with coefficient ring $\pi_*(K(n)) \cong \mathbb{F}_p[v_n, v_n^{-1}]$
    where $|v_n| = 2(p^n - 1)$; it acts as a "field object" in stable homotopy theory satisfying a Künneth
    isomorphism $K(n)_*(X \times Y) \cong K(n)_*(X) \otimes_{K(n)_*} K(n)_*(Y)$.
  locator: null
  sub_index: null
