- id: www-ms-u-tokyo-ac-jp-yasuyuki-yamashita-crest2022-3-pdf#007
  text: How does one motivate the definition of a connection in differential geometry to detect cohomology
    classes, in particular the first Chern class $c_1(L) = [i \Omega / 2 \pi]$ is in cohomology $H^2(X,
    \mathbb{Z})$?
  hint: with a connection, one can define the curvature, and recover it up to torsion. A line bundle is
    a topological object, to compute characteristics via local invariants, one must differentia locally.
    The de Rham class only sees the real part of the integer Chern class, torsion is invisible to the
    curvature alone, however, a connection detects the Chern class up to torsion. The torsion is recorded
    by the holonomy or the information in the flat line bundle.
