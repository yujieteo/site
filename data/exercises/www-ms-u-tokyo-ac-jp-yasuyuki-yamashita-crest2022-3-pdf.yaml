- id: www-ms-u-tokyo-ac-jp-yasuyuki-yamashita-crest2022-3-pdf#009
  text: How does flat line bundles fail to recover the topology?
  hint: take tensors with a connection such as $F =0$, taking tensor products with real cohomology means
    the Chern class vanishes. A flat bundle can only see the torsion cohomology. Flatness is valuable
    locallly, but it is not general enough to detect the topology of all line bundles.
