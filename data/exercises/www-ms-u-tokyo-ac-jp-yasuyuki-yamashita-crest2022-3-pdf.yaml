- id: www-ms-u-tokyo-ac-jp-yasuyuki-yamashita-crest2022-3-pdf#006
  text: What is the motivation for the object $\hat{x}$ that recovers to topological terms in the integral
    $\int_{M^{n-1}} f^{*} \hat{x}$ that lives inside differential cohomology?
  hint: you want it the integral to be a topological action in a field theory. Using ordinary cohomology
    classes $x$, one loses all geometric information. If one uses only a differential form, one loses
    global topology and torsion information. The cohomology class $\hat{x}$ has an underlying topological
    class, a closed differential form that is usually integral, and a flat and holonomic part. This integral
    therefore produces a gauge-invariant, geometrically refined topological term. This is what Chern-Simons
    theory needs.
  locator: null
  sub_index: null
