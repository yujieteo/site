  text: How does the first Pontrjagin number of 4-manifolds recover Chern-Simons theory?
  hint: Differential Pontrjagin classes can be used to show that $SO(3)$ or $\mathbb{R}P^3$ with the usual
    metric of constant curvature does not admit a conformal immersion in $\mathbb{R}^4$. See Chern, Shiing
    Shen; Simons, James Characteristic forms and geometric invariants. Ann. of Math. (2) 99 (1974), 48–69
