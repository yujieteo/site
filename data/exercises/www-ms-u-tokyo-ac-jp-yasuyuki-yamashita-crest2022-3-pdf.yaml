- id: www-ms-u-tokyo-ac-jp-yasuyuki-yamashita-crest2022-3-pdf#015
  text: How does one invent the notion of isomorphism classes of vector bundles?
  hint: allow for bundle isomorphisms, one can quotient out local trivialisations. These isomorphism classes
    form a semigroup under direct sum. The Grothendieck group is the group completion of the semigroup
    of isomorphism classes. This allows one to subtract bundles formally, this is useful for say, index
    theorems.
