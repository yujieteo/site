- id: dec41-user-srcf-net-h-ib-m-linear-algebra-full#005
  text: How does one define linear independence?
  hint: A set $\{v_1, \dots, v_k\}$ is linearly independent if $\sum c_i v_i = 0$ implies $c_1 = \dots
    = c_k = 0$.
