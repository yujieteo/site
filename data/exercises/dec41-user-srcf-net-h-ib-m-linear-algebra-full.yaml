- id: dec41-user-srcf-net-h-ib-m-linear-algebra-full#003
  text: How does one define the span of a subset?
  hint: The set of all finite linear combinations $\operatorname{span}(S) = \{\sum_{i=1}^k c_i v_i \mid
    c_i \in \mathbb{F}, v_i \in S\}$.
