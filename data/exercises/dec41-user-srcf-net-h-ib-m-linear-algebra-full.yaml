- id: dec41-user-srcf-net-h-ib-m-linear-algebra-full#001
  text: What is the standard basis of $\mathbb{F}^n$?
  hint: The set of unit vectors $\{e_1, \dots, e_n\}$ where $e_i$ has a 1 in the $i$-th entry and 0 elsewhere.
