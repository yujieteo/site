- id: dec41-user-srcf-net-h-ib-e-variational-principles-full#000
  text: What is the Euler-Lagrange equation?
  hint: 'Necessary condition for a path $y(x)$ to be a stationary point of $S[y] = \int L(x, y, y'') \,
    dx$: $\frac{\partial L}{\partial y} - \frac{d}{dx}\left(\frac{\partial L}{\partial y''}\right) = 0$.'
  locator: null
  sub_index: null
  search_text: 'what is the euler-lagrange equation? necessary condition for a path $y(x)$ to be a stationary
    point of $s[y] = \int l(x, y, y'') \, dx$: $\frac{\partial l}{\partial y} - \frac{d}{dx}\left(\frac{\partial
    l}{\partial y''}\right) = 0$.'
- id: dec41-user-srcf-net-h-ib-e-variational-principles-full#001
  text: What is the geometric meaning of stationary points?
  hint: Points where the first variation $\delta S = 0$, meaning directional derivatives vanish in all
    directions.
  locator: null
  sub_index: null
