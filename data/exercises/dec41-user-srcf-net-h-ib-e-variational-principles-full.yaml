- id: dec41-user-srcf-net-h-ib-e-variational-principles-full#002
  text: What is the Legendre transform?
  hint: Transforms a convex Lagrangian $L(q, \dot{q})$ into a Hamiltonian $H(q, p) = p\dot{q} - L$ where
    $p = \frac{\partial L}{\partial \dot{q}}$.
