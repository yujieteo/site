  text: '(The Lie Bracket from Group Commutators) Let $G = \mathrm{GL}_n(\mathbb{R})$ with Lie algebra
    $\mathfrak{g} = \mathfrak{gl}_n(\mathbb{R}) = M_n(\mathbb{R})$. For small $A, B \in \mathfrak{g}$,
    compute the Taylor expansion of the group commutator: $$(I + A)(I + B)(I + A)^{-1}(I + B)^{-1} = I
    + [A, B] + \mathcal{O}(\|(A, B)\|^3),$$ where $[A, B] = AB - BA$. Prove that $[A, B] = -[B, A]$ and
    deduce the Jacobi identity $[A, [B, C]] + [B, [C, A]] + [C, [A, B]] = 0$. '
  hint: The Lie bracket measures the leading-order obstruction to the commutativity of the group multiplication
  locator: null
