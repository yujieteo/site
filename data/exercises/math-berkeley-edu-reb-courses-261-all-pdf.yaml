  text: '(The Solvable Radical and Structure of General Lie Groups) Define the solvable radical $\operatorname{Rad}(G)$
    as the unique maximal connected normal solvable subgroup of a connected Lie group $G$. Establish the
    canonical structural filtration: $$1 \subseteq G_{\text{nil}} \subseteq G_{\text{sol}} \subseteq G_{\text{conn}}
    \subseteq G,$$ where $G_{\text{nil}} = [G_{\text{sol}}, G_{\text{sol}}]$ is nilpotent, $G_{\text{sol}}
    = \operatorname{Rad}(G)$, and $G_{\text{conn}}/G_{\text{sol}}$ is semisimple. Analyze this filtration
    for the Euclidean isometry group of $\mathbb{R}^4$: $G = \mathbb{R}^4 \rtimes \mathrm{GO}_4(\mathbb{R})$. '
  hint: Translations form the abelian/solvable normal part, and orthogonal rotations form the reductive/semisimple
    quotient
