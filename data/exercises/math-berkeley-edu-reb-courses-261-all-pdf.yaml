- id: math-berkeley-edu-reb-courses-261-all-pdf#002
  text: '(Classical Groups, Projective Quotients, and Extensions) Define the classical Lie groups as subgroups
    of $\mathrm{GL}_n(\mathbb{R})$ or $\mathrm{GL}_n(\mathbb{C})$ preserving bilinear, quadratic, or Hermitian
    forms.  1. Define the special linear group $\mathrm{SL}_n(\mathbb{R}) = \ker(\det)$. 2. Define the
    projective general linear group $\mathrm{PGL}_n(\mathbb{R}) = \mathrm{GL}_n(\mathbb{R}) / Z(\mathrm{GL}_n(\mathbb{R}))$
    by quotienting out the center of scalar matrices. 3. Define the general symplectic group $\operatorname{GSp}_{2n}(\mathbb{R})$
    as the group of matrices scaling a symplectic form $\omega$ by a non-zero scalar. '
  hint: Projective groups act faithfully on projective space $\mathbb{P}^{n-1}$; central extensions enlarge
    the center, as seen in Spin double covers $\operatorname{Spin}(n) \twoheadrightarrow \mathrm{SO}(n)$
