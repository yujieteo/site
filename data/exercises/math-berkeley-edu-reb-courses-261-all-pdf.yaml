  text: '(Classification of Low-Dimensional Connected Lie Groups) Classify all connected real Lie groups
    up to dimension 3: 1. **Dimension 1:** The abelian groups $(\mathbb{R}, +)$ (simply connected) and
    the circle group $S^1 = \mathbb{R}/\mathbb{Z}$ (compact). 2. **Dimension 2:** The abelian groups $\mathbb{R}^2,
