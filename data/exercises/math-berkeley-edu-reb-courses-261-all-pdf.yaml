  text: '(The Iwasawa Decomposition: G = KAN) State the Iwasawa decomposition theorem for a connected
    semisimple Lie group $G$: there exist closed subgroups $K$ (compact), $A$ (abelian and isomorphic
    to $\mathbb{R}^r$), and $N$ (nilpotent/unipotent) such that the multiplication map $$K \times A \times
    N \xrightarrow{\sim} G$$ is a surjective diffeomorphism. For $G = \mathrm{SL}_n(\mathbb{R})$, identify
    $K = \mathrm{SO}(n)$, $A = \{ \operatorname{diag}(a_1, \dots, a_n) : a_i > 0, \prod a_i = 1 \}$, and
    $N = \{ (u_{ij}) : u_{ii} = 1, u_{ij} = 0 \text{ for } i > j \}$. '
  hint: Show that $G = KAN$ is the geometric matrix reformulation of the Gram–Schmidt orthonormalization
    process, and deduce that $\pi_1(G) \cong \pi_1(K)$
  locator: null
