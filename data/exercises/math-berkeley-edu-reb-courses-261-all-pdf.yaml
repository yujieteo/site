    Explain why $\mathrm{GL}_2(\mathbb{R})$ and any finite-dimensional real vector space under addition
    $(\mathbb{R}^n, +)$ serve as prototypical examples. '
  hint: Lie groups represent continuous, differentiable symmetries of geometric objects
