  text: '(Identity Components and Discrete Quotients) Let $G$ be a Lie group. Show that the connected
    component of the identity $G_{\text{conn}} = G_0$ is a connected, open, and closed normal subgroup,
    and that the quotient $G/G_{\text{conn}}$ is a discrete group fitting into the exact sequence $1 \to
    G_{\text{conn}} \to G \to G_{\text{discrete}} \to 1$. '
  hint: Connected components of topological groups are always cosets of the identity component
  locator: null
  sub_index: null
