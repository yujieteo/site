  text: '(The Heisenberg Group in Quantum Mechanics) Define the 3-dimensional continuous Heisenberg group
    and its Lie algebra $\mathfrak{h}_3 = \operatorname{span}\{X, Y, Z\}$ with commutation relations $[X,
    Y] = Z$ and $[X, Z] = [Y, Z] = 0$. 1. Realize the generators as quantum operators on $L^2(\mathbb{R})$:
    $X = x$ (position), $Y = \frac{d}{dx}$ (momentum), and $Z = 1$ (identity) via the Leibniz rule $[x,
    \frac{d}{dx}] = -1$. 2. State the Stone–von Neumann theorem and prove that $\mathfrak{h}_3$ admits
    no finite-dimensional unitary representations where $Z$ acts as the non-zero identity scalar $\operatorname{Id}$. '
  hint: For finite-dimensional matrices, the trace of a commutator $\operatorname{Tr}([X, Y]) = \operatorname{Tr}(XY
    - YX) = 0$, whereas $\operatorname{Tr}(Z) = \operatorname{Tr}(\operatorname{Id}) = n \ne 0$
