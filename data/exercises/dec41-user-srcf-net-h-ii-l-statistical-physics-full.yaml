- id: dec41-user-srcf-net-h-ii-l-statistical-physics-full#001
  text: What is the classification of statistics?
  hint: Maxwell-Boltzman statistics, distinguishable entities with no capacity limit. Example, numbered
    luggage in hotel lobby, any number of entities can occupy any state, every entity has unique identity.
    Fermi-Dirac, indistinguishable activity, strict exclusivity, example assigned seating in stadium.
    Bose-Einstein statistics i.e. identical, nocap limit, prefer to pile to exact same states
  locator: null
