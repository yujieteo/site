- id: dec41-user-srcf-net-h-ii-l-statistical-physics-full#001
  text: What is the classification of classical and quantum statistics?
  hint: Maxwell-Boltzmann (distinguishable, no occupancy limit), Fermi-Dirac (indistinguishable, Pauli
    exclusion with max occupancy 1), and Bose-Einstein (indistinguishable, no occupancy limit).
