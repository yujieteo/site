  text: How does one prove that heat flows from high temperature to low temperature?
  hint: The second law of thermodynamics requires $dS = (1/T_1 - 1/T_2) dE_1 \ge 0$, forcing $dE_1 > 0$
    when $T_2 > T_1$.
