- id: dec41-user-srcf-net-h-ii-l-statistical-physics-full#000
  text: What is the analogy for Bose-Einstein statistics for network links?
  hint: growth based on age or uniform potential is Bose-Einstein gas, critical phase means highly fit
    nodes grow fast, but share links, condensation phase means a single node captures all links. Keyword
    is Barbasi-Albert scale-free networks. Quantum bosons crowd to the same low energy state, new links.
