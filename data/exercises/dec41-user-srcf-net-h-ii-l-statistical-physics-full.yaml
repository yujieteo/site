- id: dec41-user-srcf-net-h-ii-l-statistical-physics-full#004
  text: What is the fundamental postulate of statistical mechanics?
  hint: An isolated system in thermodynamic equilibrium is equally likely to be found in any of its accessible
    microstates.
  locator: null
