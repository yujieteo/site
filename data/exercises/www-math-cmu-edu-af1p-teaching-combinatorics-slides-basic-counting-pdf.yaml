  text: How does Hoeffding's inequality bound the discrepancy in set system 2-colorings?
  hint: For a set system $\mathcal{F} = \{S_1, \dots, S_m\}$ on $n$ elements, color elements uniformly
    at random with $\chi(v) \in \{-1, +1\}$. For each set $S_j$, Hoeffding's inequality gives $\mathbb{P}(|\chi(S_j)|
    > t) \le 2 e^{-t^2 / (2|S_j|)} \le 2 e^{-t^2 / (2n)}$. Choosing $t = \sqrt{2n \ln(2m)}$ makes the
    union bound over all $m$ sets strictly less than 1, proving there exists a coloring with discrepancy
    $\mathrm{disc}(\mathcal{F}) \le \sqrt{2n \ln(2m)}$.
