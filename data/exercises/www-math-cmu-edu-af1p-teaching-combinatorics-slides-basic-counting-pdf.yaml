  text: How is the number of derangements $D_n$ (permutations with no fixed points) computed via PIE?
  hint: Let $A_i = \{\pi \in S_n \mid \pi(i) = i\}$; for any subset $S \subset [n]$ of size $k$, $|\bigcap_{i
    \in S} A_i| = (n-k)!$, so $D_n = \sum_{k=0}^n (-1)^k \binom{n}{k} (n-k)! = n! \sum_{k=0}^n \frac{(-1)^k}{k!}
    \approx \frac{n!}{e}$.
