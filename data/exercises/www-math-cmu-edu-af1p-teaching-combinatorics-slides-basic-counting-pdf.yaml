- id: www-math-cmu-edu-af1p-teaching-combinatorics-slides-basic-counting-pdf#025
  text: How is the tournament property $S_k$ (for every $k$ players, there is a player beating all $k$)
    proved to exist for large $n$?
  hint: Consider a random tournament on $n$ vertices where each directed edge is chosen with probability
    $1/2$. For a fixed $k$-subset $S$, the probability that a vertex $v \notin S$ beats all vertices in
    $S$ is $2^{-k}$; the probability that no such $v$ exists is $(1 - 2^{-k})^{n-k}$. By the union bound,
    $\mathbb{P}(\text{bad } S) \le \binom{n}{k} (1 - 2^{-k})^{n-k} < 1$ for $n > k^2 2^k \ln 2$, proving
    the existence of an $S_k$-tournament.
