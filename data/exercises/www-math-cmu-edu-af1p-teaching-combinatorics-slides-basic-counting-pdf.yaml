  text: How does the Andre reflection principle compute paths strictly below the diagonal and derive Catalan
    numbers?
  hint: Paths from $(0,0)$ to $(n,n)$ that do not cross the diagonal $y=x$ are computed by subtracting
    the "bad" paths that touch $y=x+1$; reflecting the path after its first contact with $y=x+1$ gives
    a bijection to paths from $(-1,1)$ to $(n,n)$, yielding $\binom{2n}{n} - \binom{2n}{n+1} = \frac{1}{n+1}\binom{2n}{n}
    = C_n$.
