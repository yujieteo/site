  text: How is Euler's totient function $\phi(n)$ derived via the Principle of Inclusion-Exclusion?
  hint: Let $n = p_1^{a_1} \cdots p_r^{a_r}$ and let $A_i = \{x \in [n] \mid p_i \mid x\}$; since $|A_i|
    = \frac{n}{p_i}$ and $|\bigcap_{i \in S} A_i| = \frac{n}{\prod_{i \in S} p_i}$, PIE gives $\phi(n)
    = n \sum_{S \subset [r]} \frac{(-1)^{|S|}}{\prod_{i \in S} p_i} = n \prod_{i=1}^r \left(1 - \frac{1}{p_i}\right)$.
  locator: null
