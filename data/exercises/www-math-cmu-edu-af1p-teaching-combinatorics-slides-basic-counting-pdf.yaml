  text: How is the optimal stopping threshold and success probability derived in the classical Secretary
    Problem?
  hint: Reject the first $r-1$ candidates and select the first subsequent candidate who is better than
    all previous ones. The probability of choosing the absolute best candidate is $P(r) = \frac{r-1}{n}
    \sum_{k=r}^n \frac{1}{k-1} \approx -\frac{r}{n} \ln\left(\frac{r}{n}\right)$; setting $x = r/n$ and
    maximizing $-x \ln x$ yields $x = 1/e \approx 0.368$ with optimal success probability $1/e$.
