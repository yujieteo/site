  text: Why do the number of even subsets and odd subsets of a non-empty finite set $X$ of size $n$ both
    equal $2^{n-1}$?
  hint: Pairing each subset $A$ with $A \oplus \{x_0\}$ for a fixed element $x_0 \in X$ defines a bijection
    reversing parity; algebraically, $\sum_{k=0}^n \binom{n}{k} (-1)^k = (1 - 1)^n = 0$.
