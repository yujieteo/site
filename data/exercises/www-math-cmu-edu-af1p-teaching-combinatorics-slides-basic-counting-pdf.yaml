  text: How is the Chernoff-Hoeffding Bound derived for sums of independent Rademacher variables?
  hint: Let $X = \sum_{i=1}^n X_i$ with independent $X_i \in \{-1, +1\}$. The moment generating function
    satisfies $\mathbb{E}[e^{\lambda X_i}] = \frac{e^\lambda + e^{-\lambda}}{2} = \cosh(\lambda) \le e^{\lambda^2/2}$.
    By independence, $\mathbb{E}[e^{\lambda X}] = \prod_{i=1}^n \mathbb{E}[e^{\lambda X_i}] \le e^{\lambda^2
    n / 2}$. Applying Markov's inequality gives $\mathbb{P}(X \ge t) = \mathbb{P}(e^{\lambda X} \ge e^{\lambda
    t}) \le e^{-\lambda t + \lambda^2 n / 2}$; setting $\lambda = \frac{t}{n}$ minimizes the exponent
    to yield $\mathbb{P}(X \ge t) \le e^{-t^2 / (2n)}$.
