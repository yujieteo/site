  text: How is the threshold for isolated vertices and connectivity determined in the Erdős-Rényi random
    graph $G(n, p)$?
  hint: Let $p = \frac{\ln n + c}{n}$. The number of isolated vertices $X = \sum_{v} \mathbf{1}_{\{\deg(v)=0\}}$
    has expectation $\mathbb{E}[X] = n(1-p)^{n-1} \sim n e^{-np} = e^{-c}$. The First Moment Method and
    Poisson approximation via Inclusion-Exclusion / Bonferroni inequalities show $\mathbb{P}(X = 0) \to
    e^{-e^{-c}}$, which is the exact threshold where connectivity appears.
