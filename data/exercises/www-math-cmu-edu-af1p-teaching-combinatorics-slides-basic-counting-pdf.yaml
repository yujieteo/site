  text: How does the count of injective mappings relate to the definition of the binomial coefficient
    $\binom{n}{k}$?
  hint: The number of injections from a $k$-element set to an $n$-element set is $(n)_k$; since each $k$-element
    subset corresponds to $k!$ distinct injections, $\binom{n}{k} = \frac{(n)_k}{k!} = \frac{n!}{k!(n-k)!}$.
