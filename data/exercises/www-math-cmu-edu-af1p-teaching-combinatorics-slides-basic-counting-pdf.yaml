  text: How is collision probability minimized in universal hashing?
  hint: A 2-universal hash family $\mathcal{H} = \{h \colon U \to [m]\}$ satisfies $\mathbb{P}_{h \in
    \mathcal{H}}(h(x) = h(y)) \le \frac{1}{m}$ for all $x \neq y$. For any subset $S \subset U$ of size
    $n$, the expected number of collisions is $\mathbb{E}[\text{collisions}] = \sum_{x \neq y} \mathbb{P}(h(x)=h(y))
    \le \binom{n}{2} \frac{1}{m} < \frac{n^2}{2m}$, so setting $m \ge n^2$ ensures a collision-free hash
    table with probability $> 1/2$.
