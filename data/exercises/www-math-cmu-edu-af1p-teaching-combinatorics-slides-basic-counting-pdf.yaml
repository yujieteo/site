  text: What is the Second Moment Method / Paley-Zygmund Inequality and how does it bound the non-vanishing
    of $X$?
  hint: For a non-negative random variable $X \ge 0$, $\mathbb{P}(X > 0) \ge \frac{\mathbb{E}[X]^2}{\mathbb{E}[X^2]}
    = \frac{\mathbb{E}[X]^2}{\mathrm{Var}(X) + \mathbb{E}[X]^2}$; equivalently, Chebyshev's inequality
    yields $\mathbb{P}(X = 0) \le \frac{\mathrm{Var}(X)}{\mathbb{E}[X]^2}$, so $\mathrm{Var}(X) = o(\mathbb{E}[X]^2)$
    implies $X > 0$ asymptotically almost surely.
