  text: How is the number of surjective functions from an $n$-element set to an $m$-element set counted
    via PIE?
  hint: Let $A_j = \{f \colon [n] \to [m] \mid j \notin \mathrm{im}(f)\}$; for any $S \subset [m]$ of
    size $k$, $|\bigcap_{j \in S} A_j| = (m-k)^n$, giving the surjection count $\mathrm{Surj}(n, m) =
    \sum_{k=0}^m (-1)^k \binom{m}{k} (m-k)^n = m! \, S(n, m)$, where $S(n, m)$ is the Stirling number
    of the second kind.
