  text: How is Erdős's lower bound on diagonal Ramsey numbers $R(k, k) > 2^{k/2}$ proved via the basic
    probabilistic method?
  hint: Color the edges of $K_n$ independently and uniformly at random with two colors (red/blue); the
    probability that a fixed $k$-clique is monochromatic is $2^{1-\binom{k}{2}}$. By the union bound,
    $\mathbb{P}(\text{monochromatic } K_k) \le \binom{n}{k} 2^{1-\binom{k}{2}} < 1$ whenever $n < 2^{k/2}$,
    implying there exists a 2-coloring with no monochromatic $K_k$.
