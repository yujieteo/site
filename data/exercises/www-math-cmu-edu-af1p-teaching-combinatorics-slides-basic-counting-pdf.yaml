  text: How does the Binomial Theorem $(1+x)^n = \sum_{k=0}^n \binom{n}{k} x^k$ yield summation and derivative
    identities?
  hint: Setting $x=1$ yields $\sum \binom{n}{k} = 2^n$; setting $x=-1$ yields the parity vanishing $\sum
    (-1)^k \binom{n}{k} = 0$; differentiating with respect to $x$ yields $n(1+x)^{n-1} = \sum k \binom{n}{k}
    x^{k-1}$, giving $\sum k \binom{n}{k} = n 2^{n-1}$ at $x=1$.
