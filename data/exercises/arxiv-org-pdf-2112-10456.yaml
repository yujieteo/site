  text: How does Grothendieck duality specialize to Poincaré and Serre dualities?
  hint: For a smooth morphism $f \colon X \to *$, relative purity computes $f^!\mathbf{1} \simeq \mathbf{1}(d)[2d]$;
    for $\ell$-adic coefficients, this yields $H^n(X, \mathbb{Q}_\ell)^\vee \cong H_c^{2d-n}(X, \mathbb{Q}_\ell(d))$
    (Poincaré duality), and for coherent sheaves on proper $X$, it yields $\mathrm{Ext}^i(\mathcal{F},
    \omega_X) \cong H^{n-i}(X, \mathcal{F})^\vee$ (Serre duality).
