- id: arxiv-org-pdf-2112-10456#005
  text: How are cohomology, compactly supported cohomology, Borel-Moore homology, and homology expressed
    in terms of the six operations on the tensor unit $\mathbf{1}$?
  hint: 'Let $p \colon X \to *$ be the structure map. (1) Cohomology: $C^*(X) = p_* p^*(\mathbf{1})$;
    (2) Compactly supported cohomology: $C_c^*(X) = p_! p^*(\mathbf{1})$; (3) Borel-Moore homology: $C_*^{\mathrm{BM}}(X)
    = p_* p^!(\mathbf{1})$; (4) Homology with compact supports: $C_*(X) = p_! p^!(\mathbf{1})$.'
  locator: null
