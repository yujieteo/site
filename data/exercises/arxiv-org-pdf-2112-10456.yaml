- id: arxiv-org-pdf-2112-10456#000
  text: How did Emmy Noether conceptualize Betti numbers in the development of homology?
  hint: Noether showed that Betti numbers are numeric shadows of the underlying homology groups $H_n(X)$,
    which are abelian groups measuring the difference between closed cycles and exact boundaries; homology
    is a strictly richer algebraic invariant that cannot be recovered from Betti numbers alone.
