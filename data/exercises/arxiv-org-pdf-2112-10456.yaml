  text: Why does cohomology possess a ring structure (cup product) while homology possesses a coalgebra
    structure?
  hint: The diagonal map $\Delta \colon X \to X \times X$ pulls back under the contravariant functor $p_*
    p^*$, yielding the product $C^*(X) \otimes C^*(X) \xrightarrow{\Delta^*} C^*(X)$ (cup product); conversely,
    homology is covariant under $\Delta_*$, which pushes forward classes to $C_*(X) \xrightarrow{\Delta_*}
    C_*(X) \otimes C_*(X)$, splitting classes apart into a coalgebra.
