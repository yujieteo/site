- id: arxiv-org-pdf-2112-10456#001
  text: How does the Weil zeta function of a variety over a finite field motivate cohomology theories
    in arithmetic geometry?
  hint: The zeta function $\zeta_X(T) = \exp\left(\sum_{n \ge 1} \frac{\#X(\mathbb{F}_{q^n})}{n} T^n\right)$
    packages point counts over all finite extensions; Weil's proof for curves and his conjectures for
    higher-dimensional varieties predicted that $\zeta_X(T)$ is a rational function whose zeroes and poles
    are governed by a well-behaved Weil cohomology theory ($\ell$-adic étale cohomology).
  locator: null
