- id: dec41-user-srcf-net-h-ib-e-optimisation#006
  text: "Why is the Lagrangian used to solve constrained maximisation? (Hint: Lagrangian sufficiency,\
    \ key step in the prove is to define the feasible set. Want to minimise f without restriction i.e.\
    \ no more further first order change, but we are constrained by forcing x to lie on path h(x) = b.\
    \ Need del f * dx = 0, del f is perpendicular to dx or parallel to normal to the path. Therefore,\
    \ one gets Lagrange multipliers i.e. you cannot move into other paths.)\t https://dec41.user.srcf.net/h/IB_M/linear_algebra/full"
