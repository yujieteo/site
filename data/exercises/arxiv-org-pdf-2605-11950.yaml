- id: arxiv-org-pdf-2605-11950#020
  text: How does one motivate the notion of class formations?
  hint: give a collection of generators for the cyclic group of  the second cohomology, one can then use
    the Tate-Nakayama to deduce the cup product induces an isomorphism in Tate cohomology. Reformulate
    it as a Galois category instead, one can then use Grothendieck-Galois theory and the theory of fibre
    functors. One also needs cocycle-level version of the data from the $H^2$.
