- id: arxiv-org-pdf-2605-11950#006
  text: Why use the definition condensed? How does one invent condensed sets?
  hint: Start with a set. Do not specify opens, specifies families of points that "condense" to form a
    compact Hausdorff space, since this is what you want. Using the fact that every compact Hausdorff
    space is a quotient of a profinite set by a profinite equivalence relation, you can explode these
    compact Hausdorff spaces into profinite sets
