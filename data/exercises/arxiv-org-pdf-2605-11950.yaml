- id: arxiv-org-pdf-2605-11950#021
  text: How does one associate Galois groupoids to Galois categories?
  hint: $2$-category of Galois categories where objects are Galois categories, $1$-morphisms are exact
    functors is a $(2,1)$-category identifying with the opposite whose objects are the profinite groups,
    morphisms are continuous morphisms. Now, use this topological category to be realised as the full
    subcategory of condensed anima spanned by the objects of the form $BG$, where $G$ is profinite group.
  locator:
