- id: arxiv-org-pdf-2605-11950#009
  text: Summarise Theorem 1.2 in the Weil-Moore anima paper
  hint: condensed anima $X_\mathbb{Q}$ exist such that $\pi_0 X_\mathbb{Q}$ as a condensed set is a point,
    $\pi_1 X_\mathbb{Q}$ as a condensed set is a Weil group of the rational numbers, $\pi_n X_\mathbb{Q}$
    as a condensed set for $n > 1$ is compact Hausdorff, and for any number field if $X_K \rightarrow
    X_\mathbb{Q}$ denotes the corresponding finite etale cover, then the higher cohomology groups vanish.
    This last property essentially is to force canonical isomorphisms to refine the Artin map.
  locator:
    kind: page
    value: '4'
    number: 4
