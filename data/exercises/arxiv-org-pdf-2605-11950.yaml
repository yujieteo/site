- id: arxiv-org-pdf-2605-11950#008
  text: What is the important point in the Weil group definition?
  hint: it must have an Artin map from the domain of Hecke characters $\mathbb{A}^\times_K / K^\times$
    to the absolute Galois group, this is phrased as a cohomology calculation. The first cohomology of
    the classifying space $BW_\mathbb{K}$ with its coefficients in a torus $\mathbb{R}/\mathbb{Z}$ is
    Pontryagin dual to idele class group $\mathbb{A}_K^*/K^*$. The higher cohomology groups are not to
    vanish. Add higher homotopy groups to make the abelisation better cvrrespond to idele class group
    of a global field$\mathbb{A}_K^*/K^*$. This Pontryagin duality is of course the starting point of
    doing harmonic analysis here.
  locator:
    kind: page
    value: '4'
    number: 4
  sub_index: 0
