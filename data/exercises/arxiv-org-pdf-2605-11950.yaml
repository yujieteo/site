- id: arxiv-org-pdf-2605-11950#016
  text: Summarise where does Galois cohomology appear?
  hint: (1) reformulation of the Dirichlet class number formula, Kato's generalised Iwasawa main conjecture.
    Reformulate Kato's conjecture as having trivialisations using the non-compactly supported cohomology
    of the Weil-Moore anima. Replace Galois representation with a Weil-Moore representation, for a $p$-adic,
    discrete coefficient ring it gives Galois representations, but one can try to find a "spectral decomposition"
    of the compactly supported cohomology of Shimura varieties.
