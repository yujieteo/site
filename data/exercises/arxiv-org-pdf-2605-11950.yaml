- id: arxiv-org-pdf-2605-11950#007
  text: What is an anima?
  hint: it is a homotopy type viewed as an object in the natural ambient infinity-category, Beilison describes
    set as static as unable to move around. Consider an anima $A$, with its underlying set $\pi_0 A$,
    the point is free to move around within its connected component. If we have a $CW-complex$, the anima
    is what remains when you remove the point-set incarnation.
