- id: zb260-user-srcf-net-notes-iii-alggrp-pdf#000
  text: How does one invent quasi-compact schemes?
  hint: Generalize quasi-compactness from topological spaces to schemes, requiring that every open cover
    has a finite subcover.
  locator: null
  sub_index: null
  search_text: how does one invent quasi-compact schemes? generalize quasi-compactness from topological
