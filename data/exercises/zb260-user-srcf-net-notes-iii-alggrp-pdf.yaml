- id: zb260-user-srcf-net-notes-iii-alggrp-pdf#007
  text: How does one invent cotangent spaces by base changing the Kähler differential $\Omega_{A/k} \otimes_A
    k$ for a local $k$-algebra $(A, \mathfrak{m})$?
  hint: Show that $\Omega_{A/k} \otimes_A A/\mathfrak{m} \cong \mathfrak{m}/\mathfrak{m}^2$ by establishing
    a surjection from $\mathfrak{m}/\mathfrak{m}^2 \to \Omega_{A/k} \otimes_A k$ using $\Omega_{k/k} =
    0$, and using the universal derivation $A \to \mathfrak{m}/\mathfrak{m}^2$.
  locator: null
  sub_index: null
