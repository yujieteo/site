- id: zb260-user-srcf-net-notes-iii-alggrp-pdf#001
  text: How does one invent quasi-separated schemes?
  hint: Require that the intersection of any two quasi-compact open subschemes is quasi-compact, or equivalently
    that the diagonal morphism is quasi-compact. Non-quasi-separated schemes arise by gluing infinite-dimensional
    affine spaces along non-quasi-compact subsets.
