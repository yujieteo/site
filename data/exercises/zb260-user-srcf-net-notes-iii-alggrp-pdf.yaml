- id: zb260-user-srcf-net-notes-iii-alggrp-pdf#004
  text: How does one invent Kähler differentials?
  hint: Impose the sum rule and Leibniz product rule taking values in a $B$-module $\Omega_{B/A}$. Construct
    this universally via the free $B$-module generated by $d(b)$ modulo the relations $d(a)=0$, $d(b_1+b_2)=db_1+db_2$,
    and $d(b_1 b_2)=b_1 db_2 + b_2 db_1$, establishing the natural isomorphism $\operatorname{Hom}_B(\Omega_{B/A},
    M) \cong \operatorname{Der}_A(B, M)$.
  locator: null
  sub_index: null
  search_text: how does one invent kähler differentials? impose the sum rule and leibniz product rule
    taking values in a $b$-module $\omega_{b/a}$. construct this universally via the free $b$-module generated
    by $d(b)$ modulo the relations $d(a)=0$, $d(b_1+b_2)=db_1+db_2$, and $d(b_1 b_2)=b_1 db_2 + b_2 db_1$,
    establishing the natural isomorphism $\operatorname{hom}_b(\omega_{b/a}, m) \cong \operatorname{der}_a(b,
    m)$.
- id: zb260-user-srcf-net-notes-iii-alggrp-pdf#005
  text: How does one prove that for $B' = B \otimes_A A'$, the Kähler differentials satisfy $\Omega_{B'/A'}
    \cong \Omega_{B/A} \otimes_B B'$ under base change?
  hint: Use the universal property of derivations and tensor products to establish the natural isomorphism
    immediately.
