- id: zb260-user-srcf-net-notes-iii-alggrp-pdf#006
  text: What is the geometric motivation for Kähler differentials?
  hint: On a smooth manifold $X$, the tangent space $T_x X$ is the space of $\mathbb{R}$-derivations on
    $C^\infty(X)$. Dualizing to cotangent vectors and generalizing algebraically yields Kähler differentials
    as algebraic cotangent modules.
  locator: null
  sub_index: null
