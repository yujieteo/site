- id: zb260-user-srcf-net-notes-iii-alggrp-pdf#006
  text: 'What is motivation for Kahler differentials? (Hint: take X smooth manifold, associate a tangent
    bundle, pullback to get tangent space for each point of X at x in X, define as R-linear maps D by
    derivations from C^\infty valued in R following chain rule, T_x X is collection of R-derivations,
    given C^\infty(X)-module by evaluation i.e. linear algebra over R, algebra this gets Kahler differentials'
  hint: null
