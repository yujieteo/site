- id: zb260-user-srcf-net-notes-iii-alggrp-pdf#004
  text: 'How does one invent Kahler differentials? (Hint: sum rule and product rule when valued in the
    B-module Omega_B/A, construct this using brute force on free B-module of classes [b] in B, once this
    exists this is universal, then can define using universal properties of chain rule and sum rule. One
    can then define A0derivation of B is a B-module M as an additive map valued to M with the Kahler differential
    structure, i.e. D(a) = 0, then chain rule for D(b_1 b_2)). One can also define it as Hom(Omega_B/A,
    M) -> Der_A(B,M) as isomorphism, extend from [b] to D(b), pick Gamma = 0 as derivation, factors through
    some psi Omega_B/A = O/Q by universa; property? Gives surjectivity, injectivity follows from db generating
    the Kahler differential. Basically one can define Kahler differentials through derivations'
  hint: null
  locator: null
  sub_index: null
  search_text: 'how does one invent kahler differentials? (hint: sum rule and product rule when valued
    in the b-module omega_b/a, construct this using brute force on free b-module of classes [b] in b,
    once this exists this is universal, then can define using universal properties of chain rule and sum
    rule. one can then define a0derivation of b is a b-module m as an additive map valued to m with the
    kahler differential structure, i.e. d(a) = 0, then chain rule for d(b_1 b_2)). one can also define
    it as hom(omega_b/a, m) -> der_a(b,m) as isomorphism, extend from [b] to d(b), pick gamma = 0 as derivation,
    factors through some psi omega_b/a = o/q by universa; property? gives surjectivity, injectivity follows
    from db generating the kahler differential. basically one can define kahler differentials through
    derivations'
