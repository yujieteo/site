- id: zb260-user-srcf-net-notes-iii-alggrp-pdf#003
  text: How does one invent Noetherian schemes?
  hint: Require a scheme to be locally Noetherian and quasi-compact, since the Noetherian property guarantees
    finiteness of affine coverings and ideal stabilization.
