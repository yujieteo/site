- id: arxiv-org-pdf-2510-17778v1#006
  text: 'Recap: define a Kahler differential'
  hint: $R$-derivation for a ring homomorphism from $R$ to $S$ so $S$ is an $R$-algebra, $M$ is an $S$-module,
    $R$-derivation is a map from $S$ to $M$ as an $S$-module satisfying the product rule. The module of
    $\Omega_{S/R}$ mimics the definition of differential forms, it is simply an $S$-module with a universal
    $R$-derivation.
