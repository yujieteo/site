- id: arxiv-org-pdf-2510-17778v1#003
  text: How is motivic homotopy theory related to quadratic forms?
  hint: one defines the Witt ring and Grothendieck-Witt ring as the group completion of the additive monoid
    of the semiring structured induced by the tensor product when one considers isomorphism classes of
    finite dimension non-degenerate symmetric bilinear forms over a field. With this Grothendieck-Witt
    ring. The rest of the details of the relation, I am not sure.
