- id: arxiv-org-pdf-2510-17778v1#002
  text: How does one use the topological space underlying complex algebraic varieties?
  hint: Consider real or complex embedding of our base field and consider the varieties over it. One can
    take functor of points with natural analytic topology and define its Betti homotopy type. This is
    a purely topological invariant of schemes of finite type. Now one must define a homotopy type telling
    us that the affine line should be contractible.
