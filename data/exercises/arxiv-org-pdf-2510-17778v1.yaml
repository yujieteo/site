- id: arxiv-org-pdf-2510-17778v1#005
  text: 'Recap: define a smooth scheme'
  hint: Finite type over $k$ and extend scalars to algebraic closure one gets a regular scheme where all
    local rings are regular local rings OR finite type over a field $k$, smooth with relative dimension
    $n$ if sheaf of Kahler differentials is locally free of rank $n$ and the morphism is flat.
