  text: What happens on the case of a conencted topological space?
  hint: Sheaf of sections of a finite dimensional vector bundle equipped with flat connection ona. bundle.
    This corresponds to the representations of the fundamental group on a typical stalk. On an analytic
    manifold or a variety. There is an equivalence of categories of non-singular coherent $D_X$-modules
    and local systems on $X$.
