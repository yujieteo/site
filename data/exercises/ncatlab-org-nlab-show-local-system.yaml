- id: ncatlab-org-nlab-show-local-system#004
  text: What is the notion of cohomology and local systems in abelian contexts?
  hint: It is a locally constant sheaf on a topological space. The stalks are finite dimensional vector
    space. REgarded as a sheaf with values in abelian groups, a linear local system serves as the coefficient
    for abelian sheaf cohomology. This is nothing but the intrinsic cohomology of a higher dimensional
    topos with ceofficients in the Eilenberg-Maclane object.
