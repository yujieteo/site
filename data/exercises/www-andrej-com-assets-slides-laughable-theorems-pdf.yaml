  text: 'State and prove Lawvere''s Fixed Point Theorem: if there exists a point-surjective morphism $e:
    A \to Y^A$ in a Cartesian closed category, then every endomorphism $f: Y \to Y$ has a fixed point
    $y \in Y$ such that $f(y) = y$. Deduce Cantor''s theorem, Russell''s paradox, and Gödel''s incompleteness
    theorem as corollaries'
