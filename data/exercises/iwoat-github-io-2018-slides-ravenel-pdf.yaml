  text: '(Fibrant and Cofibrant Replacements via Factorization) For any object $X \in \mathcal{M}$, use
    axiom MC5 to factor the unique maps $\emptyset \to X$ and $X \to *$: $$\emptyset \xrightarrow{\in
    \mathcal{C}\text{of}} QX \xrightarrow{\in \mathcal{W} \cap \mathcal{F}\text{ib}} X \quad \text{and}
    \quad X \xrightarrow{\in \mathcal{W} \cap \mathcal{C}\text{of}} RX \xrightarrow{\in \mathcal{F}\text{ib}}
    *.$$ (Hint: $QX$ is the cofibrant replacement (CW approximation) and $RX$ is the fibrant replacement;
    the homotopy category $\operatorname{Ho}(\mathcal{M}) = \mathcal{M}[\mathcal{W}^{-1}]$ has mapping
    sets $\operatorname{Hom}_{\operatorname{Ho}(\mathcal{M})}(X, Y) \cong \operatorname{Hom}_{\mathcal{M}}(QX,
    RY)/\sim_{\text{homotopy}}$)'
