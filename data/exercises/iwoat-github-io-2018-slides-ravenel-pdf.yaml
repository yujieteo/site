  text: '(Classical Spectra and Maps of Spectra) Define an ordinary spectrum $E$ as a sequence of pointed
    spaces (or pointed simplicial sets) $(E_n)_{n \ge 0}$ equipped with structure maps $\sigma_n: \Sigma
    E_n = S^1 \wedge E_n \to E_{n+1}$. 1. Define a strict map of spectra $f: E \to F$ as a family of pointed
    continuous maps $f_n: E_n \to F_n$ commuting with the structure maps: $f_{n+1} \circ \sigma_n^E =
    \sigma_n^F \circ (\operatorname{id}_{S^1} \wedge f_n)$. 2. Define a strict equivalence of spectra
    as a map $f$ where each level map $f_n: E_n \xrightarrow{\sim} F_n$ is a weak homotopy equivalence
    of spaces. (Hint: Structure maps specify how higher-dimensional cells suspend into the next level
    of the spectrum)'
