    category $\mathcal{C}$ with mapping objects $\operatorname{Map}_{\mathcal{C}}(X, Y) \in \mathcal{V}$
    and associative composition morphisms $\operatorname{Map}(Y, Z) \otimes \operatorname{Map}(X, Y) \to
    \operatorname{Map}(X, Z)$. 2. Explain what it means for $\mathcal{C}$ to be closed (enriched over
    itself), and give the standard examples: pointed topological spaces $\mathbf{Top}_*$ enriched over
    $\mathbf{Top}_*$, and simplicial sets $\mathbf{sSet}_*$ enriched over $\mathbf{sSet}_*$. (Hint: In
    a closed symmetric monoidal category, tensor products and internal homs satisfy the adjunction $\operatorname{Hom}_{\mathcal{V}}(X
    \otimes Y, Z) \cong \operatorname{Hom}_{\mathcal{V}}(X, [Y, Z]_{\mathcal{V}})$)'
