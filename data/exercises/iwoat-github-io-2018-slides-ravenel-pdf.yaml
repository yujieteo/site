  search_text: '(stable equivalences: homotopy groups vs. mapping telescopes) contrast the two classical
    definitions of a stable equivalence $f: e \to f$: 1. **homotopy groups:** $f$ induces an isomorphism
    on all stable homotopy groups $\pi_k(f): \pi_k(e) \xrightarrow{\sim} \pi_k(f)$, where $\pi_k(e) =
    \varinjlim_n \pi_{n+k}(e_n)$. 2. **spectrifying / spectrification functor:** the spectrification map
    $\lambda f: \lambda e \to \lambda f$ is a strict equivalence, where $(\lambda e)_n = \operatorname{hocolim}_k
    \omega^k e_{n+k}$ is the homotopy mapping telescope. (hint: explain why these two definitions coincide
    for classical cw-spectra but bifurcate in generalized diagram categories like symmetric spectra without
    extra fibrancy hypotheses)'
- id: iwoat-github-io-2018-slides-ravenel-pdf#002
  text: '(Axioms of Quillen Model Categories) State the five foundational axioms (MC1–MC5) of a Quillen
    model category $\mathcal{M}$ equipped with three distinguished classes of morphisms: weak equivalences
    ($\mathcal{W}$), fibrations ($\mathcal{F}\text{ib}$), and cofibrations ($\mathcal{C}\text{of}$): 1.
    **MC1 (Bicompleteness):** $\mathcal{M}$ has all small limits and colimits (products, coproducts, pullbacks,
    pushouts, initial object $\emptyset$, and terminal object $*$). 2. **MC2 (Two-out-of-Three):** If
    any two of $f, g, g \circ f$ are weak equivalences, so is the third. 3. **MC3 (Retracts):** If a morphism
    $f$ is a retract of a morphism $g$ and $g$ is a weak equivalence (resp. fibration, cofibration), then
    so is $f$. 4. **MC4 (Lifting Axiom):** Given a commutative square with $i \in \mathcal{C}\text{of}$
    and $p \in \mathcal{F}\text{ib}$: $$\begin{matrix} A & \xrightarrow{u} & X \\ i \downarrow & & \downarrow
    p \\ B & \xrightarrow{v} & Y \end{matrix}$$ a lift $h: B \to X$ ($h \circ i = u, p \circ h = v$) exists
    if either $i$ is a trivial cofibration ($i \in \mathcal{C}\text{of} \cap \mathcal{W}$) or $p$ is a
    trivial fibration ($p \in \mathcal{F}\text{ib} \cap \mathcal{W}$). 5. **MC5 (Functorial Factorization):**
    Every morphism $f: X \to Y$ factors functorially as $f = p \circ i$ where $i \in \mathcal{C}\text{of}
    \cap \mathcal{W}$ and $p \in \mathcal{F}\text{ib}$, and as $f = q \circ j$ where $j \in \mathcal{C}\text{of}$
    and $q \in \mathcal{F}\text{ib} \cap \mathcal{W}$. (Hint: Factorization is the model-categorical analogue
    of the first isomorphism theorem, replacing arbitrary objects with weakly equivalent fibrant-cofibrant
    replacements)'
  hint: null
