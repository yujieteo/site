  search_text: '(axioms of quillen model categories) state the five foundational axioms (mc1–mc5) of a
    quillen model category $\mathcal{m}$ equipped with three distinguished classes of morphisms: weak
    equivalences ($\mathcal{w}$), fibrations ($\mathcal{f}\text{ib}$), and cofibrations ($\mathcal{c}\text{of}$):
    1. **mc1 (bicompleteness):** $\mathcal{m}$ has all small limits and colimits (products, coproducts,
    pullbacks, pushouts, initial object $\emptyset$, and terminal object $*$). 2. **mc2 (two-out-of-three):**
    if any two of $f, g, g \circ f$ are weak equivalences, so is the third. 3. **mc3 (retracts):** if
    a morphism $f$ is a retract of a morphism $g$ and $g$ is a weak equivalence (resp. fibration, cofibration),
    then so is $f$. 4. **mc4 (lifting axiom):** given a commutative square with $i \in \mathcal{c}\text{of}$
    and $p \in \mathcal{f}\text{ib}$: $$\begin{matrix} a & \xrightarrow{u} & x \\ i \downarrow & & \downarrow
    p \\ b & \xrightarrow{v} & y \end{matrix}$$ a lift $h: b \to x$ ($h \circ i = u, p \circ h = v$) exists
    if either $i$ is a trivial cofibration ($i \in \mathcal{c}\text{of} \cap \mathcal{w}$) or $p$ is a
    trivial fibration ($p \in \mathcal{f}\text{ib} \cap \mathcal{w}$). 5. **mc5 (functorial factorization):**
    every morphism $f: x \to y$ factors functorially as $f = p \circ i$ where $i \in \mathcal{c}\text{of}
    \cap \mathcal{w}$ and $p \in \mathcal{f}\text{ib}$, and as $f = q \circ j$ where $j \in \mathcal{c}\text{of}$
    and $q \in \mathcal{f}\text{ib} \cap \mathcal{w}$. (hint: factorization is the model-categorical analogue
    of the first isomorphism theorem, replacing arbitrary objects with weakly equivalent fibrant-cofibrant
    replacements)'
- id: iwoat-github-io-2018-slides-ravenel-pdf#003
  text: '(Classical Model Structures on Top and sSet) In the category of compactly generated weakly Hausdorff
    topological spaces $\mathbf{Top}_*$ (or pointed simplicial sets $\mathbf{sSet}_*$): 1. Show that weak
    equivalences are maps inducing isomorphisms on all homotopy groups $\pi_*$. 2. Show that fibrations
    are Serre fibrations (possessing the right lifting property with respect to horn inclusions / disk
    inclusions). 3. Show that cofibrations are retracts of relative cell complexes (left lifting property
    with respect to trivial fibrations). (Hint: Every space in $\mathbf{Top}_*$ is fibrant ($\emptyset
    \to X \to *$ has $X \to *$ a fibration); cofibrant objects are precisely spaces that have the homotopy
    type of retracts of CW-complexes)'
