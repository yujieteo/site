  text: '(The Symmetric Indexing Category $J^\Sigma$ and Symmetric Spectra: Hovey-Shipley-Smith) Construct
    the symmetric indexing category $J^\Sigma$: 1. Objects are natural numbers $n \in \mathbb{N}_0$. 2.
    Morphism objects are $\Sigma_n$-equivariant wedges of spheres: $\operatorname{Map}_{J^\Sigma}(m, n)
    = (\Sigma_n)_+ \wedge_{\Sigma_{n-m}} S^{n-m}$ for $n \ge m$, and $*$ otherwise. 3. Show that $J^\Sigma$
    is a symmetric monoidal category enriched over $\mathbf{Top}_*$, where the symmetric group actions
    absorb the permutation signs of the smash product. 4. Define a symmetric spectrum as an enriched functor
    $E: J^\Sigma \to \mathbf{Top}_*$. (Hint: Symmetric spectra incorporate the symmetric group actions
    $\Sigma_n \curvearrowright E_n$ from the ground up, making the diagram category itself symmetric monoidal)'
