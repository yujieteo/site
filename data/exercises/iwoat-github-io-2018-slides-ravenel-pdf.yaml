- id: iwoat-github-io-2018-slides-ravenel-pdf#008
  text: '(The Naive Indexing Category $J^{\mathbb{N}}$ and Yoneda Spectra) Define the naive indexing category
    $J^{\mathbb{N}}$ for spectra: 1. Objects are natural numbers $n \in \mathbb{N}_0$. 2. Morphism objects
    are spheres: $\operatorname{Map}_{J^{\mathbb{N}}}(m, n) = S^{n-m}$ for $n \ge m$, and $*$ otherwise.
    3. Show that a classical spectrum $E$ is precisely a pointed enriched functor $E: J^{\mathbb{N}} \to
    \mathbf{Top}_*$, interpreting spectra as diagrams of pointed spaces. 4. Define the Yoneda representable
    spectrum $S^{-m} = \operatorname{Map}_{J^{\mathbb{N}}}(m, -)$ (where $S^{-0} = \mathbb{S}$ is the
    sphere spectrum, and $S^{-m}$ is the formal $m$-fold desuspension of the sphere). (Hint: While $\mathbf{Top}_*$
    is symmetric monoidal under $\wedge$, the indexing category $J^{\mathbb{N}}$ is monoidal under addition
    of integers but lacks a symmetric twist isomorphism, because the coordinate-swap map $\tau: S^1 \wedge
    S^1 \to S^1 \wedge S^1$ has degree $-1$)'
