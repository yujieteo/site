- id: iwoat-github-io-2018-slides-ravenel-pdf#011
  text: '(Day Convolution and the Symmetric Monoidal Smash Product) Let $(\mathcal{V}, \otimes, \mathbf{1})$
    be a closed symmetric monoidal category and let $\mathcal{J}$ be a small symmetric monoidal $\mathcal{V}$-category.
    1. Construct the Day convolution tensor product on the functor category $\operatorname{Fun}(\mathcal{J},
    \mathcal{V})$ via the left Kan extension along the monoidal product $\oplus: \mathcal{J} \times \mathcal{J}
    \to \mathcal{J}$: $$(F \otimes_{\text{Day}} G)(n) = \int^{p, q \in \mathcal{J}} \operatorname{Map}_{\mathcal{J}}(p
    \oplus q, n) \otimes F(p) \otimes G(q).$$ 2. Deduce that the category of symmetric spectra $\mathbf{Sp}^\Sigma
    = \operatorname{Fun}(J^\Sigma, \mathbf{Top}_*)$ inherits a strictly associative, commutative, and
    closed symmetric monoidal smash product $\wedge = \otimes_{\text{Day}}$ with unit the sphere spectrum
    $\mathbb{S} = \operatorname{Map}_{J^\Sigma}(0, -)$. (Hint: Day convolution on enriched functor categories
    solves the decades-old problem of defining a symmetric monoidal category of spectra before passing
    to the homotopy category)'
