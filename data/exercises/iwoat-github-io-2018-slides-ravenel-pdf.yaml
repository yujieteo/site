    structure. (hint: localizing enlarges weak equivalences, adds more trivial cofibrations, and produces
    fewer fibrant objects; the fibrant replacement functor becomes the localization functor $l_s$)'
- id: iwoat-github-io-2018-slides-ravenel-pdf#006
  text: '(Concrete Examples of Bousfield Localization: Slide 121) Describe the fibrant replacement functor
    $L_S X$ for standard choices of localizing classes $S$ on $\mathbf{Top}_*$: 1. **Postnikov Sections:**
    Let $S = \{S^n \to *\}$. The local objects are spaces with vanishing homotopy groups $\pi_k(X) = 0$
    for $k \ge n$, and the fibrant replacement is the $n$-th Postnikov section $P_n X = \tau_{\le n-1}
    X$. 2. **p-Adic / Homological Localization:** Let $S$ be the class of maps inducing isomorphisms on
    mod-$p$ homology $H_*(-; \mathbb{F}_p)$. For simply connected spaces, the fibrant replacement $L_{\mathbb{F}_p}
    X$ is the $p$-adic completion $X_p^{\wedge}$. 3. **Generalized Homology Localization:** Let $E$ be
    a generalized homology theory and let $S$ be the class of $E_*$-equivalences. The fibrant replacement
    is the Bousfield $E$-localization $L_E X$. (Hint: Whenever one needs to force homological equivalences
    into isomorphisms in homotopy theory, apply left Bousfield localization)'
  hint: null
  locator: null
