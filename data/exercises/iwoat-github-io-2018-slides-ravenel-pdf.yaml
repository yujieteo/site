- id: iwoat-github-io-2018-slides-ravenel-pdf#001
  text: '(Stable Equivalences: Homotopy Groups vs. Mapping Telescopes) Contrast the two classical definitions
    of a stable equivalence $f: E \to F$: 1. **Homotopy Groups:** $f$ induces an isomorphism on all stable
    homotopy groups $\pi_k(f): \pi_k(E) \xrightarrow{\sim} \pi_k(F)$, where $\pi_k(E) = \varinjlim_n \pi_{n+k}(E_n)$.
    2. **Spectrifying / Spectrification Functor:** The spectrification map $\Lambda f: \Lambda E \to \Lambda
    F$ is a strict equivalence, where $(\Lambda E)_n = \operatorname{hocolim}_k \Omega^k E_{n+k}$ is the
    homotopy mapping telescope. (Hint: Explain why these two definitions coincide for classical CW-spectra
    but bifurcate in generalized diagram categories like symmetric spectra without extra fibrancy hypotheses)'
  hint: null
