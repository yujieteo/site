- id: iwoat-github-io-2018-slides-ravenel-pdf#005
  text: '(Bousfield Localization of Model Categories) Formulate left Bousfield localization on a model
    category $\mathcal{M}$ with respect to a class of morphisms $S$: 1. **Enlarging Weak Equivalences:**
    Define the new weak equivalences ($S$-local equivalences) as maps $f: A \to B$ such that $\operatorname{Map}(B,
    Z) \xrightarrow{\sim} \operatorname{Map}(A, Z)$ is a weak equivalence for all $S$-local objects $Z$.
    2. **Cofibrations:** Keep the class of cofibrations unchanged: $\mathcal{C}\text{of}_{L_S \mathcal{M}}
    = \mathcal{C}\text{of}_{\mathcal{M}}$. 3. **Fibrations:** Define the new fibrations ($S$-local fibrations)
    as maps having the right lifting property with respect to trivial cofibrations in the localized model
    structure. (Hint: Localizing enlarges weak equivalences, adds more trivial cofibrations, and produces
    fewer fibrant objects; the fibrant replacement functor becomes the localization functor $L_S$)'
  hint: null
