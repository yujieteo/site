- id: arxiv-org-pdf-2510-26269#000
  text: What are the classical analogues of the six operations in Schapira's warm-up of ordinary functions?
  hint: The tensor product $\otimes$ corresponds to the pointwise product of functions $(f \cdot g)(x)
    = f(x)g(x)$; the pullback $f^*$ corresponds to precomposition $f^*(g) = g \circ f$; the compactly
    supported pushforward $f_!$ corresponds to integration along fibers $\int_{f^{-1}(y)} \phi(x) dx$.
