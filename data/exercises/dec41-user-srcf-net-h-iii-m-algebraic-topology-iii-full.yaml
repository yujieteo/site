- id: dec41-user-srcf-net-h-iii-m-algebraic-topology-iii-full#026
  text: How does one compute using Mayer-Vietoris?
  hint: compute cohomology on smaller subspaces, information is encoded in exacts sequence i.e. kernel
    of next map is equal to the image of previous map, sequence is exact if exact at each X_n, so using
    first isomorphism theorem, the 0 -> A -> B -> C -> 0 being exact means C is isomorphic to B/A, for
    the case of Mayer-Vietoris, inclusions of the intersection into A and B means there are homomorphisms
    such that the Mayer-Vietoris exact seqeunce is exact and natural i.e. f maps A union B to U union
    V such that f(A) is included in U and f(B) is included in B, then the chain map commutes from the
    sequence of A B to the sequence of U V, the Mayer-Vietoris sequence is homology of A cap B -> A oplus
    B -> A cup B, for nth homology of A cup B mapping to n-1 homology of A cap B.
  locator: null
  sub_index: null
