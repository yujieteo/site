- id: ncatlab-org-nlab-show-motivic-thom-spectrum#001
  text: How does one define the algebraic cobordism spectrum $MGL_S$?
  hint: colimit of the infinite suspension of the Thom space of the tautological vector bundle $V_n$ over
    the infinite Grassmannian of $n$-planes $Gr(n)$ as the colimit of smooth $S$-schemes as $k$ tends
    to infinity. This is used by Voevodsky in his proof of the Bloch-Kato conjecture and is the starting
    point of chromatic motivic homotopy theory.
  locator: null
  sub_index: null
