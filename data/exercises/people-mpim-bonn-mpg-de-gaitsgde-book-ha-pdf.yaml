  text: '(17, Page 32) How does replacing $\Delta^{\text{op}}$ with finite pointed sets yield symmetric
    monoidal categories? . (18, Page 38) What is the role of the Barr–Beck–Lurie theorem in higher algebra?
    (Hint: It characterizes when an $\infty$-category of modules over a monad is equivalent to the original
    category via monadic descent. More precisely, you do not need to check Cech-cocycles. The basic example
    is to prove the category of modules is equivalent to descent data for modules over $B$, for $A \rightarrow
    B$ to be a fiathfully flat ring map, formally one can consider the pullback and erxtension of scalars
    adjunction of categories of modules. Pushforward is forgetful or restriction, pullback is extension
    off scalars. Then one wants to show that $Mod(A)$ is equivalent to comodules over the comonad, show
    that the adjunction exists, the right adjoint is conservative i.e. maps of $B$-modules is equivalence
    iff maps of $A$-modules is equivalence using faithful flatness. Flatness ensure exactness, faithfulness
    means no nonzero module maps are sent to $0$. $Mod(B)$ and $f_*$ preserve totalisations of cosimplicial
    objects, to see Khan''s notes for a review of totalisation. Barr-Beck-Lurie is then used to prove
    this.)'
  hint: Symmetric monoidal categories correspond to operadic fibrations over the category of finite pointed
    sets $\operatorname{Fin}_*$
  locator: null
