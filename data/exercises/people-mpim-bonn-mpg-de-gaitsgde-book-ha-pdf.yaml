- id: people-mpim-bonn-mpg-de-gaitsgde-book-ha-pdf#000
  text: '(1, Page 3) Why does classical gluing of triangulated or derived categories fail, and how do
    limits of diagrams resolve this? (Hint: Gluing is a limit of a diagram requiring Mittag-Leffler conditions.
    Constructions defined strictly on chain complexes fail to glue canonically except up to homotopy,
    whereas in $\infty$-categories gluing is canonically defined via diagrams of affine schemes)'
