- id: amathew-wordpress-com-2010-11-22-the-cohomology-of-projective-space#004
  text: 'Exercise 18.3.D (Part 2 - Computation of $H^0$ for Non-Negative Exponents): Prove Theorem 18.1.2(a):
    $H^0(\mathbb{P}_A^n, \mathcal{O}_{\mathbb{P}_A^n}(m))$ is a free $A$-module with basis consisting
    of all degree-$m$ monomials in $x_0, \dots, x_n$, having rank $\binom{n+m}{n}$ for $m \ge 0$, and
    rank $0$ for $m < 0$'
  hint: When $\mathrm{NEG}(\vec{e}) = \emptyset$, all $e_i \ge 0$, so $\sum e_i = m \ge 0$; the condition
    $\emptyset \subseteq I$ holds for every non-empty index set $I$, making the subcomplex $\check{C}^\bullet(\vec{e})$
    isomorphic to the chain complex of an $n$-simplex $\Delta^n$ with coefficients in $A \cdot x^{\vec{e}}$,
    which has $H^0 \cong A \cdot x^{\vec{e}}$ and $H^i = 0$ for $i > 0$; counting non-negative solutions
    to $\sum e_i = m$ gives rank $\binom{n+m}{n}$.
  locator: null
