- id: amathew-wordpress-com-2010-11-22-the-cohomology-of-projective-space#008
  text: 'Exercise 18.1.A: Show that the six desired axiomatic properties uniquely determine the cohomology
    groups $H^i(X, \mathcal{F})$ for all quasicoherent sheaves on projective $A$-schemes'
  hint: Any coherent sheaf on a projective scheme $X \hookrightarrow \mathbb{P}_A^n$ admits a surjection
    from a finite direct sum of twisted line bundles $\mathcal{E}_0 = \bigoplus \mathcal{O}(-k_j) \twoheadrightarrow
    \mathcal{F}$; iterating this produces a resolution by split line bundles on $\mathbb{P}^n$, and the
    long exact sequence axiom combined with the known cohomology of $\mathcal{O}(d)$ and Grothendieck
    dimension vanishing determines $H^i(X, \mathcal{F})$ uniquely by induction on the homological degree.
  locator: null
  sub_index: null
