  text: 'Exercise 18.3.D (Part 1 - Multi-Grading Decomposition): Show that the Čech complex $\check{C}^\bullet(\mathcal{U},
    \mathcal{O}_{\mathbb{P}_A^n}(m))$ decomposes as a direct sum of independent 1-dimensional subcomplexes
    $\bigoplus_{\vec{e}, \sum e_i = m} \check{C}^\bullet(\vec{e})$ indexed by the exponent vectors $\vec{e}
    = (e_0, \dots, e_n) \in \mathbb{Z}^{n+1}$'
  hint: The Čech differential $d(s)_{i_0 \dots i_{p+1}} = \sum_{j=0}^{p+1} (-1)^j s_{i_0 \dots \widehat{i_j}
    \dots i_{p+1}}$ is $A$-linear and acts on each Laurent monomial $x^{\vec{e}}$ separately without mixing
    exponents, so the complex splits into the direct sum of subcomplexes $\check{C}^\bullet(\vec{e})$,
    where the term at stage $p$ has basis $\{x^{\vec{e}}\}$ for each subset $I = \{i_0, \dots, i_p\}$
    satisfying $\mathrm{NEG}(\vec{e}) \subseteq I$.
