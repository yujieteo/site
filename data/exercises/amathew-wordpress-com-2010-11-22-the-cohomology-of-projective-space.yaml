  text: 'Exercise 18.3.D (Part 5 - Serre Duality Perfect Pairing): Prove Theorem 18.1.2(d): the natural
    product pairing $H^0(\mathbb{P}_A^n, \mathcal{O}(m)) \times H^n(\mathbb{P}_A^n, \mathcal{O}(-n-1-m))
    \to H^n(\mathbb{P}_A^n, \mathcal{O}(-n-1)) \cong A$ is a perfect pairing of free $A$-modules for all
    $m \in \mathbb{Z}$'
  hint: Multiplying a basis monomial $x^{\vec{e}} \in H^0(\mathcal{O}(m))$ (all $e_i \ge 0$) with an inverse
    basis monomial $x^{\vec{a}} \in H^n(\mathcal{O}(-n-1-m))$ (all $a_i \le -1$) produces the canonical
    trace generator $x^{-\mathbf{1}} = \frac{1}{x_0 \cdots x_n} \in H^n(\mathcal{O}(-n-1))$ if and only
    if $e_i + a_i = -1$ for all $i$, which forces $a_i = -e_i - 1$; the pairing matrix in these monomial
    bases is the identity matrix, establishing an exact isomorphism $H^0(\mathbb{P}_A^n, \mathcal{O}(m))^\vee
    \cong H^n(\mathbb{P}_A^n, \mathcal{O}(-n-1-m))$.
  locator: null
