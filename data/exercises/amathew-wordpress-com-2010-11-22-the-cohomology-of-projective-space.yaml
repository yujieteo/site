  text: 'Exercise 18.3.D (Part 3 - Vanishing of Intermediate Cohomology): Prove Theorem 18.1.2(b): $H^i(\mathbb{P}_A^n,
    \mathcal{O}_{\mathbb{P}_A^n}(m)) = 0$ for all $0 < i < n$ and all $m \in \mathbb{Z}$'
  hint: Any monomial in an intermediate degree has $\emptyset \subsetneq \mathrm{NEG}(\vec{e}) \subsetneq
    \{0, 1, \dots, n\}$; choosing an index $k \notin \mathrm{NEG}(\vec{e})$ (where $e_k \ge 0$) defines
    the chain homotopy $h(s)_{i_0 \dots i_p} = s_{k i_0 \dots i_p}$ for $k \notin \{i_0, \dots, i_p\}$
    and $0$ otherwise, which satisfies $dh + hd = \mathrm{id}$, proving $\check{C}^\bullet(\vec{e})$ is
    contractible and all intermediate cohomology vanishes.
