  text: 'Exercise 18.3.C (Part 3 - Punctured Affine Space Identification): Show that the Čech complex
    $\check{C}^\bullet(\mathcal{U}, \mathcal{O}_{\mathbb{P}_A^n}(m))$ for the standard open cover $\mathcal{U}
    = \{U_0, \dots, U_n\}$ is canonically isomorphic to the degree-$m$ homogeneous piece of the Čech complex
    computing the cohomology of $\mathcal{O}_{\mathbb{A}_A^{n+1}}$ on the punctured affine space $\mathbb{A}_A^{n+1}
    \setminus \{0\}$'
  hint: Punctured affine space $\mathbb{A}_A^{n+1} \setminus \{0\}$ has standard affine open cover $\{D(x_i)\}_{i=0}^n$;
    on intersections, $\Gamma(D(x_{j_0} \cdots x_{j_p}), \mathcal{O}) = A[x_0, \dots, x_n]_{x_{j_0} \cdots
    x_{j_p}}$; taking the direct sum of degree-$m$ pieces across the Čech complex yields the exact terms
    and differentials of $\check{C}^\bullet(\mathcal{U}, \mathcal{O}_{\mathbb{P}^n}(m))$.
