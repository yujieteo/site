  text: 'Exercise 18.3.C (Part 2 - Sheaf Restrictions as Module Inclusions): Show that for an inclusion
    of index subsets $I \subset J$, the restriction homomorphism $\Gamma(U_I, \mathcal{O}_{\mathbb{P}_A^n}(m))
    \to \Gamma(U_J, \mathcal{O}_{\mathbb{P}_A^n}(m))$ corresponds to the canonical inclusion of Laurent
    polynomial submodules inside $A[x_0^{\pm 1}, \dots, x_n^{\pm 1}]_m$'
  hint: Since $U_J = D(\prod_{j \in J} x_j) \subset U_I = D(\prod_{i \in I} x_i)$ is an open localization,
    restricting a Laurent polynomial with poles supported inside $I$ places its poles inside the larger
    set $J$, mapping each monomial $x^{\vec{e}}$ identically to itself in the ambient Laurent ring.
