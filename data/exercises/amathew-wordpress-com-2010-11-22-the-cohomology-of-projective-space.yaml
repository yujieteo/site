  text: 'Lemma 45: Global sections of $O(m)$ are rpecisely degree $m$ polynomials'
  hint: $O(m)$ is sheaf associated with graded module of $n$ generators. Consider sections over $X_{x_i}$
    which are basic open affine subsets of projective space each isomorphic to the affine line over the
    ring A. The sections are isomorphic to $S(m)_(x_i)$ which are the graded part of the graded poly ring
    module in n generators. $S$ is the intersection of localisations, and make sense as graded ring, if
    it lies in $S(m)_(x_i)$, then it must lie in $S$ of degree $m$, so the global sections are basically
    $S = A[x_0, \cdots, x_n]$, which is in fact a RING.
