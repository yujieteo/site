  text: 'Exercise 18.3.D (Part 4 - Computation of Top Cohomology $H^n$): Prove Theorem 18.1.2(c): $H^n(\mathbb{P}_A^n,
    \mathcal{O}_{\mathbb{P}_A^n}(m))$ is a free $A$-module with basis corresponding to all inverse Laurent
    monomials $x_0^{e_0} \cdots x_n^{e_n}$ with all $e_i < 0$ and $\sum e_i = m$, having rank $\binom{-m-1}{n}$
    for $m \le -n-1$, and rank $0$ for $m \ge -n$'
  hint: When $\mathrm{NEG}(\vec{e}) = \{0, 1, \dots, n\}$, every $e_i \le -1$, so $m = \sum e_i \le -(n+1)$;
    the condition $\mathrm{NEG}(\vec{e}) \subseteq I$ forces $I = \{0, 1, \dots, n\}$, which occurs only
    at stage $p = n$, giving $\check{C}^p(\vec{e}) = 0$ for $p < n$ and $\check{C}^n(\vec{e}) = A \cdot
    x^{\vec{e}}$; substituting $e_i = -a_i - 1$ with $a_i \ge 0$ gives $\sum a_i = -m - n - 1$, yielding
    rank $\binom{n + (-m - n - 1)}{n} = \binom{-m-1}{n}$.
