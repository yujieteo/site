- id: dec41-user-srcf-net-h-iii-l-riemannian-geometry-full#005
  text: What is a bi-invariant metric on a Lie group?
  hint: A Riemannian metric on $G$ that is invariant under both left and right translations; exists on
    any compact Lie group by Haar averaging.
