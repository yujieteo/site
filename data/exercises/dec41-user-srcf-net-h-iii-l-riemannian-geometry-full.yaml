- id: dec41-user-srcf-net-h-iii-l-riemannian-geometry-full#002
  text: What is a Riemannian metric?
  hint: A smooth, symmetric, positive-definite $(0, 2)$-tensor field $g \in \Gamma(\operatorname{Sym}^2
    T^*M)$ defining an inner product on each tangent space $T_p M$.
  locator: null
  sub_index: null
  search_text: what is a riemannian metric? a smooth, symmetric, positive-definite $(0, 2)$-tensor field
    $g \in \gamma(\operatorname{sym}^2 t^*m)$ defining an inner product on each tangent space $t_p m$.
- id: dec41-user-srcf-net-h-iii-l-riemannian-geometry-full#003
  text: How does the Whitney embedding theorem provide an isometric immersion?
  hint: Any smooth $n$-manifold embeds into $\mathbb{R}^{2n}$; pulling back the Euclidean metric $g =
    F^* g_{\mathrm{Eucl}}$ induces a Riemannian metric on $M$.
  locator: null
