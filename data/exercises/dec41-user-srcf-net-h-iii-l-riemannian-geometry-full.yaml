- id: dec41-user-srcf-net-h-iii-l-riemannian-geometry-full#006
  text: What is the Levi-Civita connection?
  hint: The unique affine connection $\nabla$ on $(M, g)$ that is metric-compatible ($\nabla g = 0$) and
    torsion-free ($\nabla_X Y - \nabla_Y X = [X, Y]$).
  locator: null
  sub_index: null
