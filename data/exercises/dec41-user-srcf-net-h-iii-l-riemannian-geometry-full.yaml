  text: How does one write vector and tensor fields in local coordinates?
  hint: Express $X = \sum X^i \frac{\partial}{\partial x^i}$ and tensors $T = \sum T_{j_1 \dots j_l}^{i_1
    \dots i_k} \frac{\partial}{\partial x^{i_1}} \otimes \dots \otimes dx^{j_l}$.
