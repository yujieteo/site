- id: dec41-user-srcf-net-h-iii-l-riemannian-geometry-full#007
  text: How does one compute Christoffel symbols for the Levi-Civita connection?
  hint: $\Gamma_{ij}^k = \frac{1}{2} g^{kl} \left( \partial_i g_{jl} + \partial_j g_{il} - \partial_l
    g_{ij} \right)$.
