- id: dec41-user-srcf-net-h-iii-l-riemannian-geometry-full#004
  text: What is an isometry between Riemannian manifolds?
  hint: 'A diffeomorphism $f: (M, g) \to (N, h)$ preserving metrics via pullback: $f^* h = g$.'
