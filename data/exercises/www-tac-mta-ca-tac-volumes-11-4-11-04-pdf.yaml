    that $f_!$ is an enriched $\mathcal{b}$-module functor.
- id: www-tac-mta-ca-tac-volumes-11-4-11-04-pdf#015
  text: How does the Projection Formula allow moving target objects and computing Reynolds operators/Haar
    integrals?
  hint: It allows pullbacks of base objects $f^*Y$ to be factored outside the pushforward integration
    $f_!(f^*Y \otimes X) \cong Y \otimes f_!(X)$; for $X = \mathbf{1}$, $f_!(f^*Y) \cong Y \otimes f_!(\mathbf{1})$,
    which identifies the pushforward with a generalized Reynolds averaging operator / integration against
    the Haar measure $f_!(\mathbf{1})$.
  locator: null
