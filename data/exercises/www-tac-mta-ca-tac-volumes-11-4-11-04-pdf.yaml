    and its right adjoint $f_* \colon \mathcal{a} \to \mathcal{b}$ is lax monoidal with an adjunction
    $\mathrm{hom}_{\mathcal{a}}(f^*y, x) \cong \mathrm{hom}_{\mathcal{b}}(y, f_*x)$.
- id: www-tac-mta-ca-tac-volumes-11-4-11-04-pdf#006
  text: What is the categorical relationship between $(f^*, f_*, f_!, f^!)$ when $f$ is a proper morphism?
  hint: When $f$ is proper, the exceptional pushforward coincides with the ordinary pushforward ($f_!
    \cong f_*$); consequently, the exceptional pullback $f^!$ is the right adjoint to the right adjoint
    of pullback, $f^! \colon \mathcal{B} \to \mathcal{A}$ being right adjoint to $f_* \cong f_!$.
  locator: null
