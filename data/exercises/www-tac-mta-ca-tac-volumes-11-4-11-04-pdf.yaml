- id: www-tac-mta-ca-tac-volumes-11-4-11-04-pdf#014
  text: Why is the Projection Formula recognized categorically as Frobenius reciprocity?
  hint: The projection formula is the tensor-categorical generalization of classical Frobenius reciprocity
    $\mathrm{Ind}(V \otimes \mathrm{Res}(W)) \cong \mathrm{Ind}(V) \otimes W$ for representations; categorically,
    it states that $f_!$ is an enriched $\mathcal{B}$-module functor.
  locator: null
