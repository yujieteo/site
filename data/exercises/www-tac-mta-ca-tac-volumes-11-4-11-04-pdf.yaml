- id: www-tac-mta-ca-tac-volumes-11-4-11-04-pdf#013
  text: How does the dualizing object interact with the Chu construction and star-autonomous categories?
  hint: An intrinsic dualizing object $D \in \mathcal{A}$ defines a duality functor $\mathbb{D}(-) = \underline{\mathrm{Hom}}(-,
    D)$; the Chu construction formally completes a closed symmetric monoidal category into a $*$-autonomous
    category where the Wirthmüller and Grothendieck contexts become dual via $\mathbb{D} \circ f^* \cong
    f^! \circ \mathbb{D}$.
