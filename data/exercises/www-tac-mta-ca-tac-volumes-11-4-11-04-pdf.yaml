- id: www-tac-mta-ca-tac-volumes-11-4-11-04-pdf#004
  text: How do Neeman's techniques establish the formal nature of Verdier and Grothendieck isomorphisms?
  hint: Neeman proved that in triangulated and derived categories with Brown representability, the existence
    of right adjoints $f^!$ and their duality isomorphisms with twisted left adjoints are purely formal
    consequences of closed symmetric monoidal structures and compactly generated categories.
