- id: www-tac-mta-ca-tac-volumes-11-4-11-04-pdf#000
  text: Why is there a difference between pushforwards in sheaves which is right adjoint and preserve
    limits, and pushforwards in measures, which is left adjoint and preserves colimits?
  hint: Grothendieck/Verdier duality make it such that exceptional pushforward corresponds to be left
    adjoint and preserves colimit to extraordinary pullback in the derived category. However, in ordinary
    sheaves, pullbacks are evaluating points on sections and checked on sections so it is LEFT ADJOINT
    and preserves colimits. Pushforwards involve taking sections of opens in a sheaf. Sheafs are functional
    in nature, functionals are contravariant when one thinks about linear algebra, unlike measures which
    are covariant. Therefore, the six functor formalism works differently.
  locator: null
