- id: www-tac-mta-ca-tac-volumes-11-4-11-04-pdf#009
  text: What is the Wirthmüller context and how did it originate in equivariant topology?
  hint: Originating from Wirthmüller's theorem for compact Lie groups $G/H$, a **Wirthmüller context**
    is an adjoint triple $(f_! \dashv f^* \dashv f_*)$ where the strong symmetric monoidal pullback $f^*$
    has both a left adjoint $f_!$ and a right adjoint $f_*$, together with a natural twist isomorphism
    $f_!(X) \cong f_*(X \otimes D)$ for a dualizing object $D$.
  locator: null
  sub_index: null
