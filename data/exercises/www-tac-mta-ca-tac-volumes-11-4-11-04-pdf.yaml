- id: www-tac-mta-ca-tac-volumes-11-4-11-04-pdf#007
  text: What is the Grothendieck context versus the Verdier-Grothendieck context?
  hint: The **Grothendieck context** is an adjoint triple $(f^* \dashv f_* \dashv f^!)$ where $f_*$ has
    a right adjoint $f^!$ (modeling proper morphisms or global module duality); the **Verdier-Grothendieck
    context** includes the full four-functor setup $(f_! \dashv f^!)$ and $(f^* \dashv f_*)$ with an isomorphism
    $f_! \xrightarrow{\sim} f_*$ on proper subcategories.
