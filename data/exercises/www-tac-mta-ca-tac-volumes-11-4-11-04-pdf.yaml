- id: www-tac-mta-ca-tac-volumes-11-4-11-04-pdf#003
  text: Why is the right adjoint generally harder to understand than the left adjoint?
  hint: The left adjoint (e.g., free construction, scalar extension, pullback $f^*$, or extension-by-zero
    $j_!$) is explicitly defined by generators and preserves colimits; its right adjoint (e.g., coextension,
    pushforward $f_*$, or exceptional pullback $f^!$) is given abstractly via the adjoint functor theorem
    and requires deep descent/duality theorems to compute.
  locator: null
