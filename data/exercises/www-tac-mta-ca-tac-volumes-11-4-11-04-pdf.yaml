- id: www-tac-mta-ca-tac-volumes-11-4-11-04-pdf#001
  text: How does one think of the adjoint triple of the restriction of scalars?
  hint: extension of scalars is left adjoint i.e. tensor products preserve colimits. Firstly, one identifies
    algebra as the covariant context. Then, extension of scalars preserve sums is as per tensor hom adjunction.
    Pushforward extends it to more scalars. However, homs are also pushforwards that preserve limits.
    Integration is a functional, homs are functionals, and limits of homs are preserved. Resrtiction of
    scalars is a rare Frobenisu functor that preserves limits and colimits.
