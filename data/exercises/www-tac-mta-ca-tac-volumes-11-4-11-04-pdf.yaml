- id: www-tac-mta-ca-tac-volumes-11-4-11-04-pdf#011
  text: State Definition 4.6 of the Projection Formula in the abstract axiomatic context
  hint: In an adjoint setup $(f^* \dashv f_*)$, the **projection formula** is the assertion that the canonical
    morphism $\pi \colon f_!(X) \otimes_{\mathcal{B}} Y \xrightarrow{\sim} f_!(X \otimes_{\mathcal{A}}
    f^*Y)$ is a natural isomorphism for all $X \in \mathcal{A}$ and $Y \in \mathcal{B}$.
  locator: null
