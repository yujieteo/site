- id: www-tac-mta-ca-tac-volumes-11-4-11-04-pdf#002
  text: What is the formal categorical goal of Fausk-Hu-May in axiomatic six-functor formalisms?
  hint: To systematically isolate the formal categorical machinery of the projection formula and duality
    isomorphisms from specific geometric contexts, showing how right adjoints $f^!$ or $f_*$ can be identified
    as twists/shifts of left adjoints $f_!$ or $f^*$ via an intrinsic dualizing object.
  locator: null
