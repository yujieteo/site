- id: www-tac-mta-ca-tac-volumes-11-4-11-04-pdf#012
  text: When does a Wirthmüller context arise in algebra and representation theory?
  hint: When $f^* \colon \mathbf{Mod}_S \to \mathbf{Mod}_R$ is the restriction of scalars along a Frobenius
    algebra/finite flat map $\phi \colon R \to S$, where extension of scalars $f_!(-) = S \otimes_R -$
    is isomorphic to coextension of scalars $f_*(-) = \mathrm{Hom}_R(S, -)$ up to tensoring with the dualizing
    module $\omega_{S/R}$.
