    d)$ for a dualizing object $d$.
- id: www-tac-mta-ca-tac-volumes-11-4-11-04-pdf#010
  text: How does strong symmetric monoidality of $f^*$ yield the internal hom adjunction and projection
    maps?
  hint: Since $f^*$ commutes with $\otimes$, the $(f^* \dashv f_*)$ adjunction formally induces a natural
    morphism $\pi \colon f_*(X) \otimes Y \to f_*(X \otimes f^*Y)$ and a dual morphism on internal homs
    $f^* \underline{\mathrm{Hom}}_{\mathcal{B}}(Y, Z) \to \underline{\mathrm{Hom}}_{\mathcal{A}}(f^*Y,
    f^*Z)$ via the Barr-Beck/monad comparison apparatus.
  locator: null
