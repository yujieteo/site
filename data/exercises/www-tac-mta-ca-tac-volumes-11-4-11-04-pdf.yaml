- id: www-tac-mta-ca-tac-volumes-11-4-11-04-pdf#005
  text: How is the standard pullback-pushforward pair $(f^*, f_*)$ structured in a closed symmetric monoidal
    category?
  hint: Let $f \colon \mathcal{A} \to \mathcal{B}$ be a geometric morphism; the pullback functor $f^*
    \colon \mathcal{B} \to \mathcal{A}$ is strong symmetric monoidal ($f^*(Y \otimes_{\mathcal{B}} Z)
    \cong f^*Y \otimes_{\mathcal{A}} f^*Z$ and $f^*\mathbf{1}_{\mathcal{B}} \cong \mathbf{1}_{\mathcal{A}}$),
    and its right adjoint $f_* \colon \mathcal{A} \to \mathcal{B}$ is lax monoidal with an adjunction
    $\mathrm{Hom}_{\mathcal{A}}(f^*Y, X) \cong \mathrm{Hom}_{\mathcal{B}}(Y, f_*X)$.
  locator: null
  sub_index: null
