- id: www-tac-mta-ca-tac-volumes-11-4-11-04-pdf#008
  text: How do extension and coextension of scalars model $f_!$, $f^*$, and $f_*$ in module categories?
  hint: For a ring homomorphism $\phi \colon R \to S$, the forgetful/restriction functor is $f^*$; its
    left adjoint is extension of scalars $f_!(M) = S \otimes_R M$ (left adjoint/induction), and its right
    adjoint is coextension of scalars $f_*(M) = \mathrm{Hom}_R(S, M)$ (right adjoint/coinduction). Notice
    that here $f^*$ is generally not strong monoidal unless $S$ is flat/étale.
  locator: null
  sub_index: null
