- id: dec41-user-srcf-net-h-iii-l-algebras-full#007
  text: What is Maschke's theorem?
  hint: If $G$ is a finite group and the characteristic of $k$ does not divide $|G|$, then the group algebra
    $k[G]$ is semisimple.
  locator: null
  sub_index: null
