- id: dec41-user-srcf-net-h-iii-l-algebras-full#011
  text: What is the Weyl algebra?
  hint: The noncommutative Noetherian algebra generated by $X$ and $\partial / \partial X$ satisfying
    $[ \partial/\partial X, X ] = 1$.
