- id: dec41-user-srcf-net-h-iii-l-algebras-full#006
  text: What does the Artin-Wedderburn theorem state?
  hint: Every semisimple left-Artinian algebra is isomorphic to a finite direct sum of matrix rings over
    division algebras $\bigoplus_{i=1}^r M_{n_i}(D_i)$.
  locator: null
