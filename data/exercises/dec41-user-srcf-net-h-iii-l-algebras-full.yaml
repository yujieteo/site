  text: How can noncommutative Noetherian algebras be viewed as deformations of commutative algebras?
  hint: The first Weyl algebra $A_1$ deforms the polynomial ring $k[X, Y]$ by replacing $[X, Y] = 0$ with
    $[X, Y] = 1$.
