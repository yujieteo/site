  text: Why the definition of a $k$-algebra?
  hint: 'A $k$-vector space $A$ equipped with a bilinear associative multiplication map $m: A \otimes_k
    A \to A$ and a unit map $u: k \to A$.'
  locator: null
  sub_index: null
  search_text: 'why the definition of a $k$-algebra? a $k$-vector space $a$ equipped with a bilinear associative
    multiplication map $m: a \otimes_k a \to a$ and a unit map $u: k \to a$.'
