  text: '(Verdier Sequences and Verdier Quotients) Define a Verdier sequence in the $\infty$-category
    $\mathbf{Cat}_\infty^{\text{ex}}$ of small idempotent-complete stable $\infty$-categories: $$\mathcal{A}
    \hookrightarrow \mathcal{B} \twoheadrightarrow \mathcal{C}.$$ (Hint: A Verdier sequence is both a
    fiber and cofiber sequence in $\mathbf{Cat}_\infty^{\text{ex}}$; the quotient $\mathcal{C} \simeq
    \mathcal{B}/\mathcal{A}$ is obtained via Dwyer–Kan localization / Verdier localization at the morphisms
    whose cones lie in $\mathcal{A}$)'
