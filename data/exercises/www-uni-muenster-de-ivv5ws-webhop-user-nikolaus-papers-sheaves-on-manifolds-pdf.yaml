  text: '(Compact Assembly and Continuous Posets) Explain why a poset viewed as a category is compactly
    assembled if and only if it is a continuous poset / continuous domain. (Hint: In a continuous poset,
    every element is the directed supremum of elements that are "way below" it, mirroring how objects
    in a compactly assembled category are filtered colimits of compact morphisms)'
