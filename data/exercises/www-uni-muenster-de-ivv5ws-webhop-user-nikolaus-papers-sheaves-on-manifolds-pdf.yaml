- id: www-uni-muenster-de-ivv5ws-webhop-user-nikolaus-papers-sheaves-on-manifolds-pdf#012
  text: '(Cohomology with Compact Support and Borel-Moore Homology via Six Functors) Let $t: X \to \{*\}$
    be the unique terminal map. Express standard topological invariants in terms of the six operations
    on the tensor unit $\mathbf{1} = \mathbb{S} \in \operatorname{Shv}(\{*\}, \mathbf{Sp})$: 1. Ordinary
    cohomology: $H^*(X) \simeq t_* t^* \mathbf{1}$. 2. Cohomology with compact support: $H_c^*(X) \simeq
    t_! t^* \mathbf{1}$. 3. Locally finite (Borel–Moore) homology: $H_*^{\text{BM}}(X) \simeq t_* t^!
    \mathbf{1}$. 4. Standard homology: $H_*(X) \simeq t_! t^! \mathbf{1}$. (Hint: Use the adjunctions
    $(t^* \dashv t_*)$ and $(t_! \dashv t^!)$ together with the self-duality of $\operatorname{Shv}(X;
    \mathbf{Sp})$ to prove Poincaré duality $H_c^*(X)^\vee \cong H_*(X)$ and $H^*(X)^\vee \cong H_*^{\text{BM}}(X)$)'
  hint: null
