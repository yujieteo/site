  text: '(Connective vs. Non-Connective Algebraic K-Theory) Recall Quillen''s connective algebraic $K$-theory
    functor $K: \mathbf{Cat}_\infty^{\text{perf}} \to \mathbf{Sp}_{\ge 0}$. Why does connective $K$-theory
    fail to send Verdier sequences to fiber sequences of spectra? (Hint: The negative $K$-groups $K_{-n}$
    are non-trivial for non-regular schemes or non-smooth algebras; the Eilenberg swindle can kill positive
    $K$-theory on infinite-dimensional Calkin-type categories without vanishing homotopically)'
