  text: '(Compactly Assembled Infinity-Categories) Define what it means for a morphism $f: C \to D$ in
    an $\infty$-category to be compact, and define a compactly assembled $\infty$-category. (Hint: A morphism
    $f$ is compact if $\operatorname{Map}(D, -)$ maps filtered colimits along $f$ to colimits in spaces.
    An object $X$ is weakly/strongly compact if $\operatorname{id}_X$ satisfies the compact morphism condition;
    this generalizes compact generation to categories lacking enough compact objects, such as $\operatorname{Shv}(X;
    \mathcal{D}(\mathbb{Z}))$ for non-compact $X$)'
