    functors). (Hint: Explain how the Adjoint Functor Theorem ensures that any colimit-preserving functor
    between presentable categories is uniquely determined by its restriction to the subcategory of $\kappa$-compact
    generators via the Yoneda embedding, and discuss the Beck–Chevalley condition for commutative squares)'
