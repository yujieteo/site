  text: '(Pushforward, Pullback, and Global Sections) Let $f: Y \to \{*\}$ be the projection to a point.
    Show that $\operatorname{Shv}(\{*\}, \mathcal{D}(\mathbb{Z})) \simeq \mathcal{D}(\mathbb{Z})$. For
    $F \in \operatorname{Shv}(Y; \mathcal{D}(\mathbb{Z}))$, verify that the pushforward $f_* F \simeq
    F(Y)$ recovers global sections, and describe the pullback functor $f^*: \mathcal{D}(\mathbb{Z}) \to
    \operatorname{Shv}(Y; \mathcal{D}(\mathbb{Z}))$ assigning constant sheaves. (Hint: Formulate $f^*$
    and $f_*$ as an adjoint pair $(f^* \dashv f_*)$ on presentable stable $\infty$-categories)'
