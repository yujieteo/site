- id: www-uni-muenster-de-ivv5ws-webhop-user-nikolaus-papers-sheaves-on-manifolds-pdf#000
  text: '(Sheaves with Values in the Derived Category vs. Derived Category of Sheaves) Let $X$ be a locally
    compact Hausdorff space. Define the $\infty$-category $\operatorname{Shv}(X; \mathcal{D}(\mathbb{Z}))$
    as the $\infty$-category of functors $F: \operatorname{Open}(X)^{\text{op}} \to \mathcal{D}(\mathbb{Z})$
    satisfying descent: for any open cover $U \cup V$, the Mayer–Vietoris square is a pullback in $\mathcal{D}(\mathbb{Z})$,
    and more generally $F(\bigcup_i U_i) \xrightarrow{\sim} \lim_{I} F(U_i)$. (Hint: Contrast $\operatorname{Shv}(X;
    \mathcal{D}(\mathbb{Z}))$ with the ordinary derived category of sheaves of abelian groups $\mathcal{D}(\operatorname{Shv}(X,
    \mathbf{Ab}))$. Show that the latter is the Bousfield localization of $\operatorname{Shv}(X; \mathcal{D}(\mathbb{Z}))$
    at hypercovers, i.e. the $\infty$-category of hypersheaves, and that both coincide when $X$ is paracompact
    with finite covering dimension)'
