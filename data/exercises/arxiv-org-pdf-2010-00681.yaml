- id: arxiv-org-pdf-2010-00681#010
  text: What is the canonical model functor $\mathtt{Conc} \colon \mathbf{PrbAlg} \to \mathbf{CHPrb}$?
  hint: Defined by $\mathtt{Conc}(X) := \mathtt{Riesz}(L^\infty(X)_{\mathbf{uCC^*Alg}^\tau}) = \mathrm{Spec}(L^\infty(X))$;
    it assigns to every abstract probability algebra $X$ an extremally disconnected compact Hausdorff
    Stone probability space modeling $X$.
