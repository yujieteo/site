- id: arxiv-org-pdf-2010-00681#002
  text: How is Gelfand duality extended to locally compact Hausdorff (LCH) spaces and non-unital C*-algebras?
  hint: The functor $C_0 \colon \mathbf{LCH}_p \to \mathbf{CC^*Alg}_{nd}^{\mathrm{op}}$ (proper continuous
    maps and non-degenerate $*$-homomorphisms) is an equivalence; for non-proper continuous maps, morphisms
    map into the multiplier algebra $M(A)$.
