- id: arxiv-org-pdf-2010-00681#001
  text: How does the Gelfand duality operate between compact Hausdorff spaces and commutative C*-algebras?
  hint: The functor $C \colon \mathbf{CH} \to \mathbf{uCC^*Alg}^{\mathrm{op}}$ sending $X \mapsto C(X)$
    is an equivalence of categories, with quasi-inverse spectrum functor $\mathrm{Spec} \colon \mathbf{uCC^*Alg}^{\mathrm{op}}
    \to \mathbf{CH}$ sending $A \mapsto \mathrm{Hom}_{\mathbf{uCC^*Alg}}(A, \mathbb{C})$.
