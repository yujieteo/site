  text: What universal properties does the canonical model $\mathtt{Conc}(X)$ satisfy?
  hint: $\mathtt{Conc}(X)$ is an extremally disconnected Stone space satisfying the strong Lusin property
    (every bounded Baire-measurable function equals a unique continuous function almost everywhere) and
    acts as a universal concrete representative for $X$ analogous to the Stone-Čech compactification.
