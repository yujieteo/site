- id: arxiv-org-pdf-2010-00681#009
  text: How is the category of probability algebras dual to commutative tracial von Neumann algebras?
  hint: By probability duality, $\mathbf{PrbAlg}$ is equivalent to $(\mathbf{CvNAlg}^\tau)^{\mathrm{op}}$
    via the functor assigning $(\mathcal{B}, \mu)$ to its $L^\infty(\mathcal{B}, \mu)$ space equipped
    with the integral trace $\tau(f) = \int f\, d\mu$.
