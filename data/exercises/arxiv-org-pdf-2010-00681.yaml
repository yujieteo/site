- id: arxiv-org-pdf-2010-00681#000
  text: What is the primary objective of Jamneshan and Tao's framework for uncountable measure theory?
  hint: To develop measure theory, functional analysis, and ergodic theory without countability, separability,
    metrizability, or standard Borel/Lebesgue hypotheses, using category-theoretic dualities and canonical
    models.
