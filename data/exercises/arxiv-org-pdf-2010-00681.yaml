- id: arxiv-org-pdf-2010-00681#004
  text: Why does uncountable measure theory adopt a Baire-centric rather than Borel-centric philosophy?
  hint: In non-metrizable spaces, the Borel $\sigma$-algebra is too large and points/compact sets may
    fail to be $G_\delta$; the Baire $\sigma$-algebras $C_0\text{-}\mathrm{Baire}(X)$ and $C_b\text{-}\mathrm{Baire}(X)$
    are generated by continuous functions and interact naturally with functional analysis.
