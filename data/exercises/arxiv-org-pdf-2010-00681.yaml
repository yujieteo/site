- id: arxiv-org-pdf-2010-00681#009
  text: Why does one care about Radon measures?
  hint: The Riesz representation theorem allows one to start with a positive linear functional in the
    space of continuous compactly supported functions on $X$ and a locally compact Hausdorff space and
    guarantees that there is a Radon measure at least on it. The Radon measure is the probability measure
    for locally compact Hausdorff spaces.
