- id: arxiv-org-pdf-2010-00681#007
  text: Why does uncountable measure theory adopt a Baire-centric rather than Borel-centric philosophy?
  hint: In non-metrizable spaces, the Borel $\sigma$-algebra is too large and points/compact sets may
    fail to be $G_\delta$ and we do consider this when say one does integration theory or when considering
    the Baire category theorem where the intersection of countably many dense sets is a dense countable
    intersection of open sets; the Baire $\sigma$-algebras $C_0\text{-}\mathrm{Baire}(X)$ and $C_b\text{-}\mathrm{Baire}(X)$
    are generated by continuous functions and interact naturally with functional analysis. One needs a
    theorem for compact spaces to extend Baire measures to unique regular Borel measures. Baire sigma
    algebras as a property is preserved under product and will remain restricted to countably determined
    sets and will not have nonmeasurable topologies. See page 7 for all the tradeoffs.
  locator: null
