- id: arxiv-org-pdf-2010-00681#003
  text: What are the minimal and maximal compactifications of an LCH space in this categorical framework?
  hint: The Alexandroff one-point compactification $X^+$ is the minimal compactification corresponding
    to the unitization $A^+ = C_0(X) \oplus \mathbb{C}$, while the Stone-Čech compactification $\beta
    X$ is the maximal compactification corresponding to the multiplier algebra $M(C_0(X)) = C_b(X)$.
  locator: null
