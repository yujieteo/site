- id: arxiv-org-pdf-2010-00681#006
  text: What is $\tau$-additivity ($\tau$-smoothness) and why does it eliminate pathological measure behavior?
  hint: A measure $\mu$ is $\tau$-additive if $\mu(\bigcup U_\alpha) = \sup \mu(U_\alpha)$ for every upward-directed
    net of open sets; on Baire sets, $\tau$-smoothness corresponds to $\lim \lambda(f_\alpha) = 0$ for
    decreasing nets $f_\alpha \downarrow 0$, making Radon hypotheses automatic on compact spaces.
