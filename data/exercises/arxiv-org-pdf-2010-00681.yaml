  text: What is a strong Lusin property in relation to Baire sigma algebras?
  hint: Baire sigma algebras give that every continuous function is measurable. Now, the strong Lusin
    property guarantees uniqueness where every Baire-measurable functions equals to a unique measurable
    function almost everywhere. One gets a canonical representative under Stone-Cech compactification.
