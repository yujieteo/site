- id: arxiv-org-pdf-2010-00681#012
  text: How does the canonical model provide canonical disintegration of probability measures?
  hint: Given a morphism of probability algebras $T \colon Y \to X$, the functoriality of $\mathtt{Conc}$
    induces a unique continuous measure-preserving map $\pi \colon \mathtt{Conc}(X) \to \mathtt{Conc}(Y)$
    whose fiber measures $y \mapsto \mu_y$ provide a canonical, point-everywhere defined disintegration
    without exceptional null sets.
