- id: arxiv-org-pdf-2010-00681#013
  text: How does the Loomis-Sikorski theorem realize abstract $\sigma$-algebras as concrete quotients?
  hint: The Loomis-Sikorski functor $\mathtt{LS} = \mathtt{Meager} \circ \mathtt{Stone}$ represents any
    abstract $\sigma$-algebra $\mathcal{B}$ as the concrete quotient $\mathrm{Baire}(S(\mathcal{B})) /
    \mathcal{M}$, where $S(\mathcal{B})$ is the Stone space and $\mathcal{M}$ is the $\sigma$-ideal of
    meager Baire sets.
