- id: arxiv-org-pdf-2010-00681#015
  text: What is an abstract probability algebra and what is the abstraction functor?
  hint: A probability algebra is a pair $(\mathcal{B}, \mu)$ where $\mathcal{B}$ is a Dedekind $\sigma$-complete
    Boolean algebra and $\mu$ is a strictly positive, countably additive measure; the abstraction functor
    $\mathbf{Alg} \colon \mathbf{CncPrb} \to \mathbf{PrbAlg}$ quotients out the ideal of null sets $\Sigma_X
    / \mathcal{N}_\mu$.
