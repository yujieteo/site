- id: arxiv-org-pdf-2010-00681#008
  text: How is a Radon probability measure defined via inner regularity on an LCH space?
  hint: 'A probability measure $\mu$ on $C_0\text{-}\mathrm{Baire}(X)$ or $\mathrm{Borel}(X)$ is Radon
    if it is inner regular with respect to compact $G_\delta$ sets, meaning $\mu(E) = \sup \{ \mu(K) :
    K \subset E, K \text{ compact } G_\delta \}$. We need this definition of Radon measures to characterise
    the regularity properties of the measure we get from Riesz duality of locally compact Hausdorff spaces'
  locator: null
