- id: arxiv-org-pdf-2010-00681#014
  text: How does the Loomis-Sikorski theorem yield an abstract Kolmogorov Extension Theorem?
  hint: Combining Stone duality with the Riesz representation theorem on product Stone spaces allows projective
    systems of probability algebras to admit projective limits without requiring Polish or topological
    regularity assumptions.
