- id: arxiv-org-pdf-2010-00681#007
  text: How do Riesz dualities augment Gelfand dualities in the presence of measures and traces?
  hint: The Riesz representation theorem establishes an equivalence between categories of compact/LCH
    probability spaces $(\mathbf{CHPrb}, \mathbf{LCHPrb})$ with Radon measures and categories of tracial
    commutative $C^*$-algebras $(\mathbf{uCC^*Alg}^\tau, \mathbf{CC^*Alg}^\tau)$ equipped with faithful
    positive states/traces.
