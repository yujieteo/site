- id: arxiv-org-pdf-2010-00681#026
  text: How does the Baire Category Theorem provide a qualitative analogue of measure theory?
  hint: BCT implies that in LCH or completely metrizable spaces, meager sets (countable unions of nowhere
    dense sets) model "negligible/null sets" and comeager sets model "full measure sets", preserving the
    intuition that countable intersections of dense open sets remain as dense open subsets.
