  text: 'State the Snake Lemma: given a commutative diagram with exact rows in an abelian category, construct
    the natural connecting homomorphism $\delta: \ker(c) \to \operatorname{coker}(a)$ yielding the six-term
    exact sequence $0 \to \ker(a) \to \ker(b) \to \ker(c) \xrightarrow{\delta} \operatorname{coker}(a)
    \to \operatorname{coker}(b) \to \operatorname{coker}(c) \to 0$'
