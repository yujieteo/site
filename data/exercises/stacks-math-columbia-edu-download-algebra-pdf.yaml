- id: stacks-math-columbia-edu-download-algebra-pdf#000
  text: '(Notational Conventions for Contraction of Primes) Let $\phi: R \to S$ be a ring map and let
    $\mathfrak{q} \in \operatorname{Spec}(S)$ be a prime ideal. Explain the Stacks Project convention
    of writing the contraction $\phi^{-1}(\mathfrak{q})$ as $R \cap \mathfrak{q}$. '
  hint: This notation is standardly used even when $R$ is not a subring of $S$ and $\phi$ is not injective;
    ideals geometrically correspond to kernels of maps to integral domains
  locator: null
  sub_index: null
