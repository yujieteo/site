    Prove Lemma 10.5.2: if $\alpha: R^{\oplus n} \to M$ and $\beta: N \to M$ are $R$-module maps such
    that $\operatorname{im}(\alpha) \subseteq \operatorname{im}(\beta)$, then $\alpha$ lifts to a map
    $\gamma: R^{\oplus n} \to N$ such that $\alpha = \beta \circ \gamma$. '
  hint: Express the image of each standard basis element $e_i \in R^{\oplus n}$ as a linear combination
    over the generators of $N$
