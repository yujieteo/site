- id: stacks-math-columbia-edu-download-algebra-pdf#003
  text: '(Finiteness Conditions and Lemma 10.5.3) Prove Lemma 10.5.3: for a short exact sequence of $R$-modules
    $0 \to M_1 \to M_2 \to M_3 \to 0$, 1. If $M_2$ is finitely generated, then $M_3 \cong M_2/M_1$ is
    finitely generated. 2. If $M_1$ and $M_3$ are finitely generated, then $M_2$ is finitely generated.
    3. If $M_2$ is finitely presented and $M_1$ is finitely generated, then $M_3$ is finitely presented.
    4. If $M_1$ and $M_3$ are finitely presented, then $M_2$ is finitely presented. 5. If $M_2$ is finitely
    presented and $M_3$ is finitely generated, then $M_1$ is finitely generated. '
  hint: Use the Snake Lemma and presentations of modules to prove each clause
  locator: null
  sub_index: null
  search_text: '(finiteness conditions and lemma 10.5.3) prove lemma 10.5.3: for a short exact sequence
    of $r$-modules $0 \to m_1 \to m_2 \to m_3 \to 0$, 1. if $m_2$ is finitely generated, then $m_3 \cong
    m_2/m_1$ is finitely generated. 2. if $m_1$ and $m_3$ are finitely generated, then $m_2$ is finitely
    generated. 3. if $m_2$ is finitely presented and $m_1$ is finitely generated, then $m_3$ is finitely
    presented. 4. if $m_1$ and $m_3$ are finitely presented, then $m_2$ is finitely presented. 5. if $m_2$
