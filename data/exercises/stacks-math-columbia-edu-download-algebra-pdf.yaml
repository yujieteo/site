- id: stacks-math-columbia-edu-download-algebra-pdf#001
  text: '(The Snake Lemma and Connecting Homomorphisms) State the Snake Lemma for commutative diagrams
    of $R$-modules with exact rows: $$\begin{matrix} & M_1 & \xrightarrow{f_1} & M_2 & \xrightarrow{g_1}
    & M_3 & \to 0 \\ 0 \to & N_1 & \xrightarrow{f_2} & N_2 & \xrightarrow{g_2} & N_3 & \end{matrix}$$
    Prove that the connecting homomorphism $\delta: \ker(\gamma) \to \operatorname{coker}(\alpha)$ factors
    as $i'' \circ \beta \circ s''$, where $s''$ is a preimage lift from $M_3$ to $M_2$ via surjectivity
    (unique modulo $\ker(g_1) = \operatorname{im}(f_1)$), $\beta$ is the central vertical map, and $i''$
    is the projection into $\operatorname{coker}(\alpha)$. '
  hint: Show that $\beta(s'(z))$ maps to $0$ in $N_3$ and therefore lifts uniquely to $N_1$, proving that
    $\delta$ is well-defined, yields a 6-term exact sequence, and characterizes abelian categories as
    categories where the Snake Lemma holds
  locator: null
  sub_index: null
  search_text: '(the snake lemma and connecting homomorphisms) state the snake lemma for commutative diagrams
    of $r$-modules with exact rows: $$\begin{matrix} & m_1 & \xrightarrow{f_1} & m_2 & \xrightarrow{g_1}
    & m_3 & \to 0 \\ 0 \to & n_1 & \xrightarrow{f_2} & n_2 & \xrightarrow{g_2} & n_3 & \end{matrix}$$
    prove that the connecting homomorphism $\delta: \ker(\gamma) \to \operatorname{coker}(\alpha)$ factors
    as $i'' \circ \beta \circ s''$, where $s''$ is a preimage lift from $m_3$ to $m_2$ via surjectivity
    (unique modulo $\ker(g_1) = \operatorname{im}(f_1)$), $\beta$ is the central vertical map, and $i''$
    is the projection into $\operatorname{coker}(\alpha)$.  show that $\beta(s''(z))$ maps to $0$ in $n_3$
    and therefore lifts uniquely to $n_1$, proving that $\delta$ is well-defined, yields a 6-term exact
    sequence, and characterizes abelian categories as categories where the snake lemma holds'
