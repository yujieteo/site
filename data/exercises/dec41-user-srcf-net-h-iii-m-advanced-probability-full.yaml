- id: dec41-user-srcf-net-h-iii-m-advanced-probability-full#011
  text: How does one find the characterising property of conditional expectations?
  hint: reduce case of sigma algebra to all events G, the conditional expectation denoted Y is G-measurable
    and Y is integrable and one can have equality of linear combinations of expectations with indicators
    in each event G_a in all events G. To prove this one simply computes the expectation of Y, using monotone
    convergence twice to swap expectation and the sum using the definition of integration. Important point
    is conditional expectation given sigma algebra G
