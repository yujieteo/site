- id: dec41-user-srcf-net-h-iii-m-advanced-probability-full#000
  text: 'How does one invent the notion of sigma algebra? (Hint: need to eventually get Borel sigma algebra
    (this is needed for uniqueness) containing a topology, sigma algebra is the parameter space for a
    measure, it looks like sets or blobs, complement of blob is in sigma algebra, empty blob is in sigma
    algebra, arbitrary countable unions of blobs is in sigma algebra. The definition of measure is map
    assigning a real number to each part of a sigma algebra such that empty set has empty measure, countable
    unions of disjoint sets means one take sums of measures or countable additivity. Disjoint to prevent
    weirdness.) Important image is blob, complements of blobs and countable sums'
