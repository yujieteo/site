    by being $\mathcal{g}$-measurable, integrable, and satisfying $\mathbb{e}[y \mathbf{1}_g] = \mathbb{e}[x
    \mathbf{1}_g]$ for all $g \in \mathcal{g}$. prove this by computing expectations and using monotone
    convergence to swap expectation and infinite sums.
- id: dec41-user-srcf-net-h-iii-m-advanced-probability-full#012
  text: How does one prove the existence and uniqueness of conditional expectation?
  hint: Prove uniqueness up to measure zero via functional analysis on Hilbert spaces. For $X \in L^2$,
    define $Y$ as the orthogonal projection of $X$ onto the closed subspace $L^2(\mathcal{G})$, using
    $X - Y \perp L^2(\mathcal{G})$. Extend to non-negative $X \in \mathcal{m}\mathcal{E}_+$ using monotone
    convergence of $X \wedge n$ and indicator tests. Finally, for arbitrary $X \in L^1$, decompose $X
    = X^+ - X^-$ and use linearity.
  locator: null
