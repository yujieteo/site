- id: dec41-user-srcf-net-h-iii-m-advanced-probability-full#012
  text: How does one prove existence and uniqueness of conditional expectation?
  hint: need uniqueness up to measure 0, intuitively we know it exists and is unique up to measure 0.
    One uses functional analysis of Hilbert-space. This is a painful thing to prove, need some Hilbert
    space functional analysis stuff, for part 1, define Y to be orthogonal projection of X onto L^2(G),
    G is new sigma algebra, second apart, use X - Y orthogonal to L^2(G) by definition, use measure space
    is finite, indicator function of any measurable set is L^2. Now go to case where X in mE+, monotone
    convergence is needed to get the result, satisfy result, if X' >= X almost surely, Y' >= Y almost
    surely, then one chase indicator functions. Define Y_n as some expectation, pick it so Y_n increasing,
    again use monotone convergence, chase indicator limits and we are done by checking finiteness. For
    arbitrary X in L^1, wrote X = X+ - X- and define Y+- = Y+ - Y- or Hahn decomposition, uniqueness is
    clear
  locator: null
  sub_index: null
