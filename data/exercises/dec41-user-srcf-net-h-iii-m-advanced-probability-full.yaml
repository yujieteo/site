- id: dec41-user-srcf-net-h-iii-m-advanced-probability-full#007
  text: How does one invent and prove the dominated convergence theorem?
  hint: Let $f_n$ be a sequence in a measure space such that $f_n \to f$ almost everywhere. If there exists
    an integrable dominating function $g$ such that $|f_n| \le g$ almost everywhere, then $\lim \int f_n
    \, d\mu = \int f \, d\mu$. Prove this by applying Fatou's lemma to $g - f_n$ and $g + f_n$. The easiest
    intuition is a bounded envelope; domination acts as a compactness condition analogous to sequential
    weak compactness in $L^p$ spaces.
  locator: null
