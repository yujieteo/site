- id: dec41-user-srcf-net-h-iii-m-advanced-probability-full#007
  text: How does one invent and prove the dominated convergence theorem?
  hint: f_i in measurable space, f_i -> f almost everywhere, EXISTS dominating g integrable, |f_i| < g
    almost everywhere, then limit mu(f_n) converges, apply Fatou's lemma on g - f_n and g + f_n. The easiest
    way to see this is to think of a bounded envelope, domination looks like some form of compactness.
    Actually, it looks like sequential weak compactness in L^p space, so there probably are variants of
    dominated convergence theorem.
