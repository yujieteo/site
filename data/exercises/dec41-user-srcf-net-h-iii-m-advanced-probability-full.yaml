- id: dec41-user-srcf-net-h-iii-m-advanced-probability-full#013
  text: What key properties does one want to prove about conditional expectation?
  hint: Total expectation $\mathbb{E}[\mathbb{E}[X \mid \mathcal{G}]] = \mathbb{E}[X]$, positivity $X
    \ge 0 \implies \mathbb{E}[X \mid \mathcal{G}] \ge 0$, independence $\mathbb{E}[X \mid \mathcal{G}]
    = \mathbb{E}[X]$ if $X$ is independent of $\mathcal{G}$, linearity, monotone convergence, Fatou's
    lemma, dominated convergence theorem, Jensen's inequality, and the tower property $\mathbb{E}[\mathbb{E}[X
    \mid \mathcal{G}_2] \mid \mathcal{G}_1] = \mathbb{E}[X \mid \mathcal{G}_1]$ for $\mathcal{G}_1 \subseteq
    \mathcal{G}_2$.
