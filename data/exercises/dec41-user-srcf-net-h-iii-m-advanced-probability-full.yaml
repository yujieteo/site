- id: dec41-user-srcf-net-h-iii-m-advanced-probability-full#014
  text: How does one prove that for $X \in L^1$, the family of random variables $Y_\mathcal{G} = \mathbb{E}[X
    \mid \mathcal{G}]$ across all sub-$\sigma$-algebras $\mathcal{G} \subseteq \mathcal{F}$ is uniformly
    integrable?
  hint: Fix $\varepsilon > 0$. Apply Jensen's inequality to obtain $\mathbb{E}[|Y|] \le \mathbb{E}[|X|]$,
    then use Markov's inequality and the $\mathcal{G}$-measurability of $\mathbf{1}_{\{|Y| > \lambda\}}$
    to bound $\mathbb{E}[|Y| \mathbf{1}_{\{|Y| > \lambda\}}] = \mathbb{E}[|X| \mathbf{1}_{\{|Y| > \lambda\}}]
    < \varepsilon$ uniformly for sufficiently large $\lambda$.
