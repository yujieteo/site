- id: dec41-user-srcf-net-h-iii-m-advanced-probability-full#010
  text: How does one first encounter condition probability theory?
  hint: note the notation change, scale probability measure first, probability A and B happened, given
    B that happened, assume B happened that is why take intersection. Now allow B to vary, consider disjoint
    events in sigma-algebra, define linear combinations integrating to basis in sigma-algebra, think of
    blob being cut up into compartments, same event same compartment. Then each compartment has an indicator
    function to test against X, one takes linear combinations of countably infinitely many of these compartments
    which essentially are disjoint events
