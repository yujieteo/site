- id: dec41-user-srcf-net-h-iii-m-advanced-probability-full#000
  text: How does one invent the notion of a sigma-algebra?
  hint: Need to eventually obtain the Borel $\sigma$-algebra, which is needed for uniqueness when containing
    a topology. A $\sigma$-algebra serves as the parameter space for a measure; visualize it as sets or
    "blobs" where the complement of a blob is in the $\sigma$-algebra, the empty set is in the $\sigma$-algebra,
    and arbitrary countable unions of blobs are in the $\sigma$-algebra. A measure is a map assigning
    a non-negative extended real number to each set in a $\sigma$-algebra such that the empty set has
    measure zero and countable unions of disjoint sets satisfy countable additivity $\mu(\bigcup E_i)
    = \sum \mu(E_i)$. Disjointness prevents overlap. The key mental image is blobs, complements of blobs,
    and countable unions.
