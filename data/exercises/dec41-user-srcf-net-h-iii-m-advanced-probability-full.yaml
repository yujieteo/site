- id: dec41-user-srcf-net-h-iii-m-advanced-probability-full#010
  text: How does one first encounter conditional probability theory?
  hint: 'Note the notation change and scale the probability measure first: $P(A \mid B) = P(A \cap B)
    / P(B)$, assuming event $B$ has occurred by taking the intersection. Next, allow $B$ to vary across
    disjoint events in a partition, define linear combinations integrating against the partition elements,
    and think of the probability space as being partitioned into compartments. Testing against random
    variable $X$ across these countably many disjoint events yields the discrete conditional expectation.'
  locator: null
