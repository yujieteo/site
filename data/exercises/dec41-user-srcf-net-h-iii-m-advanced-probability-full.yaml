- id: dec41-user-srcf-net-h-iii-m-advanced-probability-full#002
  text: How does one invent the integral with respect to a measure?
  hint: Note that the existence of the integral is a theorem summarized by the monotone convergence theorem.
    Given a measure space, assign non-negative measurable functions to integrals that are linear and satisfy
    the monotone convergence theorem, meaning if a monotone increasing sequence of functions converges
    pointwise, then their integrals converge to the integral of the limit. Lastly, integrating against
    an indicator function $\mathbf{1}_A$ recovers the measure $\mu(A)$. The key intuition is linear, non-interacting
    decomposition into a basis similar to Fourier analysis.
  locator: null
