- id: dec41-user-srcf-net-h-iii-m-advanced-probability-full#011
  text: How does one find the characterizing property of conditional expectation?
  hint: Given a sub-$\sigma$-algebra $\mathcal{G}$, the conditional expectation $Y = \mathbb{E}[X \mid
    \mathcal{G}]$ is uniquely characterized by being $\mathcal{G}$-measurable, integrable, and satisfying
    $\mathbb{E}[Y \mathbf{1}_G] = \mathbb{E}[X \mathbf{1}_G]$ for all $G \in \mathcal{G}$. Prove this
    by computing expectations and using monotone convergence to swap expectation and infinite sums.
  locator: null
  sub_index: null
