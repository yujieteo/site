- id: dec41-user-srcf-net-h-iii-m-advanced-probability-full#005
  text: How does one invent the notion of Fatou's lemma?
  hint: 'If a sequence of non-negative functions is not monotone, one gets an inequality for the limit
    inferior: the integral of the limit inferior is less than or equal to the limit inferior of the integrals,
    i.e., $\int \liminf f_n \, d\mu \le \liminf \int f_n \, d\mu$. This is proven by applying the monotone
    convergence theorem to the sequence of infimums. The key image is visualizing expectation and the
    lower bound of the integral of a shifting wave or sine curve.'
  locator: null
