- id: dec41-user-srcf-net-h-iii-m-advanced-probability-full#002
  text: 'How does one invent the integral with respect to a measure? (Hint: note that the existence of
    this is a theorem, and is summarised by the monotone convergence theorem, measure space, assign positive
    measurable functions to be integrals that are linear i.e. noninteracting and has the monotone convergence
    theorem i.e. monotone sequences of functions that converge pointwise then limits converge. Lastly,
    integrating against the indicator yields back the same measurable function). Important image is Fourier
    analysis essentially of linear non-interacting integrals to basis'
