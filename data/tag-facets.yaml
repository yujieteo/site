# Facets for the homepage's resource filters. Every tag used by a record in
# data/resources/ must appear under exactly one facet; the build fails
# otherwise. Facets render in this order, each showing its eight most-used
# tags first. Notes use the classes in data/note-tags.json instead, and paper
# links use the tag vocabularies in scripts/paper_tags.py.
facets:
  - id: subject
    label: Subject
    tags: [mathematics, physics, engineering, energy, prices, trade, trade-logistics,
           shipping, freight, transport, mobility, labour, construction, housing,
           housing-prices, financial-stress, fiscal-cashflow, agriculture]
  - id: approach
    label: Approach
    tags: [systems, computational, architecture]
  - id: tool
    label: Tool
    tags: [lean]
  - id: region
    label: Region
    tags: [global, singapore, united-states, europe, united-kingdom, australia, japan]
