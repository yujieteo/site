<!doctype html>
<html lang="en"{{attrs}}>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<script>
// The reader's theme, before the first paint (see the theme dialog below).
try {
  const h = document.documentElement, m = localStorage.getItem("mode"), t = localStorage.getItem("theme");
  if (m === "light" || m === "dark") h.dataset.mode = m;
  if (t) h.dataset.theme = t;
} catch (e) {}
</script>
<title>{{title}}</title>
<style>{{style}}</style>
<header class="top"><a href="{{root}}index.html">Yu Jie</a><nav>
<a href="{{root}}notes/index.html">Notes</a><a href="{{root}}stories/index.html">Stories</a><a href="{{root}}play/index.html">Play</a>
<button type="button" class="search" aria-label="Search" aria-keyshortcuts="Control+K Meta+K"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.75" cy="6.75" r="4.75"/><path d="m10.25 10.25 4 4"/></svg></button>
<button type="button" class="mode" aria-label="Theme" title="Theme"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 0 0 11z"/></svg></button>
</nav></header>
<main>{{body}}</main>
<dialog class="find" aria-label="Search"><form method="dialog"><input type="search" name="q" placeholder="Search notes and stories" aria-label="Search" autocomplete="off" spellcheck="false">{{dot}}<ol></ol></form></dialog>
<dialog class="look" aria-label="Theme"><form method="dialog"><h2>Theme</h2><p class="muted">For every page, in this browser.</p><div class="fams">{{themes}}</div>
<div class="modes"><button type="button" value="auto">Auto</button><button type="button" value="light">Light</button><button type="button" value="dark">Dark</button></div></form></dialog>
<script id="index" type="application/json">{{index}}</script>
<script>
// Any dialog closes on a click on its backdrop.
document.querySelectorAll("dialog").forEach((d) => d.addEventListener("click", (e) => e.target === d && d.close()));
// Search: Ctrl K (⌘K on a Mac) or the header's icon. Every word must appear; the builder writes the index.
(() => {
  const $ = (s, r = document) => r.querySelector(s), d = $(".find"), q = $("input", d), ol = $("ol", d), icon = $(".search");
  const root = $(".top > a").getAttribute("href").replace(/index\.html$/, ""), all = JSON.parse($("#index").textContent);
  icon.title = `Search (${/Mac|iP/.test(navigator.platform) ? "⌘" : "Ctrl "}K)`;
  const show = () => {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    const hit = ([title, , text]) => words.every((w) => (title + " " + text).toLowerCase().includes(w));
    ol.replaceChildren(...all.filter(hit).slice(0, 12).map(([title, href, text]) => {
      const li = document.createElement("li");
      const a = li.appendChild(Object.assign(document.createElement("a"), { href: root + href, textContent: title }));
      if (text) a.appendChild(Object.assign(document.createElement("small"), { textContent: text.slice(0, 120) }));
      return li;
    }));
  };
  // The dot (drawn by the builder from engine::scene::face) wakes as the dialog opens. Its eyes follow the caret,
  // a focused hit or the pointer; it smiles at hits, frets at none, glows at a pick and sleeps when the dialog closes.
  const dot = $(".dot", d), calm = matchMedia("(prefers-reduced-motion: reduce)");
  let ctx;
  const be = (s) => { $(".on", dot).classList.remove("on"); $(`[data-s=${s}]`, dot).classList.add("on"); };
  const react = () => be(!q.value.trim() ? "look" : ol.children.length ? "hit" : "miss");
  const look = (x, y) => {
    const b = dot.getBoundingClientRect(), dx = x - b.x - b.width / 2, dy = y - b.y - b.height / 2, k = Math.max(Math.hypot(dx, dy), 3 * b.width);
    dot.style.setProperty("--gx", dx / k); dot.style.setProperty("--gy", dy / k);
  };
  const caret = () => {
    const s = getComputedStyle(q), b = q.getBoundingClientRect();
    (ctx ||= document.createElement("canvas").getContext("2d")).font = `${s.fontSize} ${s.fontFamily}`;
    const w = ctx.measureText(q.value.slice(0, q.selectionEnd ?? Infinity)).width - q.scrollLeft;
    look(b.x + parseFloat(s.paddingLeft) + Math.min(Math.max(w, 0), q.clientWidth), b.y + b.height / 2);
  };
  const wake = () => d.open && $("[data-s=sleep].on", dot) && (react(), caret());
  const open = () => { if (!d.open) d.showModal(); q.select(); show(); calm.matches ? wake() : setTimeout(wake, 180); };
  d.addEventListener("close", () => be("sleep"));
  d.addEventListener("pointermove", (e) => look(e.clientX, e.clientY));
  ol.addEventListener("focusin", (e) => { const b = e.target.getBoundingClientRect(); look(b.x + b.width / 3, b.y + b.height / 2); });
  ol.addEventListener("click", (e) => e.target.closest("a") && be("pick"));
  icon.addEventListener("click", open);
  addEventListener("keydown", (e) => {
    if (e.key.toLowerCase() !== "k" || !(e.metaKey || e.ctrlKey) || e.defaultPrevented) return;
    e.preventDefault();
    d.open ? d.close() : open();
  });
  q.addEventListener("input", show);
  q.addEventListener("input", () => { react(); caret(); });
  q.addEventListener("keydown", (e) => { if (e.key === "ArrowDown") { e.preventDefault(); $("a", ol)?.focus(); } });
  $("form", d).addEventListener("submit", () => { const a = $("a", ol); if (a) location.href = a.href; });
})();
// Theme: a family and light, dark or the device's (Auto), picked in the header's dialog and
// remembered for every page. Exports keep their own theme.
(() => {
  const h = document.documentElement, d = document.querySelector(".look"), fam = (b) => b.parentNode.className === "fams";
  const chosen = (b) => b.value === (fam(b) ? h.dataset.theme || "site" : h.dataset.mode || "auto");
  const show = () => d.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", chosen(b)));
  const set = (k, v) => {
    v ? (h.dataset[k] = v) : delete h.dataset[k];
    try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {}
    show();
  };
  document.querySelector(".mode").addEventListener("click", () => (show(), d.showModal()));
  d.addEventListener("click", (e) => {
    const b = e.target !== d && e.target.closest("button");
    if (b) fam(b) ? set("theme", b.value === "site" ? "" : b.value) : set("mode", b.value === "auto" ? "" : b.value);
  });
})();
</script>
{{script}}
