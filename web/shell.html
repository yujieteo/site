<!doctype html>
<html lang="en" data-theme="penumbra-light"{{attrs}}>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<script>
// The reader's theme, before the first paint (see the theme dialog below).
try {
  const h = document.documentElement, m = localStorage.getItem("mode"), t = localStorage.getItem("theme");
  const mode = t === "penumbra" && ["light", "dark", "dark-plus-plus"].includes(m) ? "penumbra-" + m : m;
  h.dataset.mode = {{modes}}.includes(mode) ? mode : "penumbra-light";
  h.dataset.theme = h.dataset.mode;
} catch (e) {}
</script>
<title>{{title}}</title>
<style>{{style}}</style>
<a class="skip" href="#main">Skip to content</a>
<header class="top"><a href="{{root}}index.html">Yu Jie</a><nav>
<a href="{{root}}stories/index.html">Stories</a><a href="{{root}}play/index.html">Play</a>
<button type="button" class="search" aria-label="Search" aria-keyshortcuts="Control+K Meta+K"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.75" cy="6.75" r="4.75"/><path d="m10.25 10.25 4 4"/></svg></button>
<button type="button" class="mode" aria-label="Theme" title="Theme"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 0 0 11z"/></svg></button>
</nav></header>
<main id="main" tabindex="-1">{{body}}</main>
<dialog class="find" aria-label="Search"><form method="dialog"><input type="search" name="q" placeholder="Search stories, play" aria-label="Search" autocomplete="off" spellcheck="false"><ol></ol><p hidden>No match. Try fewer or shorter words.</p></form></dialog>
<dialog class="look" aria-label="Theme"><form method="dialog"><h2>Theme</h2><p class="muted">For every page, in this browser.</p><div class="modes">{{themes}}</div><button class="x" aria-label="Close">×</button></form></dialog>
<script id="index" type="application/json">{{index}}</script>
<script>
// Any dialog closes on a click on its backdrop.
document.querySelectorAll("dialog").forEach((d) => d.addEventListener("click", (e) => e.target === d && d.close()));
// Search: Ctrl K (⌘K on a Mac) or the header's icon. Every word must appear; the builder writes the index.
(() => {
  const $ = (s, r = document) => r.querySelector(s), d = $(".find"), q = $("input", d), ol = $("ol", d), none = $("p", d), icon = $(".search");
  const root = $(".top > a").getAttribute("href").replace(/index\.html$/, ""), all = JSON.parse($("#index").textContent);
  icon.title = `Search (${/Mac|iP/.test(navigator.platform) ? "⌘" : "Ctrl "}K)`;
  const show = () => {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    const hit = ([title, , text]) => words.every((w) => (title + " " + text).toLowerCase().includes(w));
    ol.replaceChildren(...all.filter(hit).slice(0, 12).map(([title, href, text]) => {
      const li = document.createElement("li");
      const a = li.appendChild(Object.assign(document.createElement("a"), { href: /^https?:/.test(href) ? href : root + href, textContent: title }));
      if (text) a.appendChild(Object.assign(document.createElement("small"), { textContent: text.slice(0, 120) }));
      return li;
    }));
    none.hidden = !(words.length && !ol.children.length);
  };
  const open = () => { if (!d.open) d.showModal(); q.select(); show(); };
  icon.addEventListener("click", open);
  addEventListener("keydown", (e) => {
    if (e.key.toLowerCase() !== "k" || !(e.metaKey || e.ctrlKey) || e.defaultPrevented) return;
    e.preventDefault();
    d.open ? d.close() : open();
  });
  q.addEventListener("input", show);
  q.addEventListener("keydown", (e) => { if (e.key === "ArrowDown") { e.preventDefault(); $("a", ol)?.focus(); } });
  $("form", d).addEventListener("submit", () => { const a = $("a", ol); if (a) location.href = a.href; });
})();
// The explicit theme choice applies to every page in this browser.
(() => {
  const h = document.documentElement, d = document.querySelector(".look");
  const show = () => d.querySelectorAll("button[value]").forEach((b) => b.setAttribute("aria-pressed", b.value === (h.dataset.mode || "penumbra-light")));
  document.querySelector(".mode").addEventListener("click", () => (show(), d.showModal()));
  d.addEventListener("click", (e) => {
    const b = e.target.closest(".modes button");
    if (!b) return;
    h.dataset.mode = b.value; h.dataset.theme = b.value;
    try { localStorage.setItem("theme", b.value); localStorage.setItem("mode", b.value); } catch (e) {}
    show();
  });
})();
</script>
{{script}}
