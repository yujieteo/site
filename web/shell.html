<!doctype html>
<html lang="en"{{attrs}}>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try { const m = localStorage.getItem("mode"); if (m === "light" || m === "dark") document.documentElement.dataset.mode = m; } catch (e) {}</script>
<title>{{title}}</title>
<style>{{style}}</style>
<header class="top"><a href="{{root}}index.html">Yu Jie</a><nav><a href="{{root}}notes/index.html">Notes</a><a href="{{root}}stories/index.html">Stories</a><a href="{{root}}play/index.html">Play</a><button type="button" class="search" aria-label="Search" aria-keyshortcuts="Control+K Meta+K"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.75" cy="6.75" r="4.75"/><path d="m10.25 10.25 4 4"/></svg></button><button type="button" class="mode" aria-label="Dark mode" title="Light or dark"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 0 0 11z"/></svg></button></nav></header>
<main>{{body}}</main>
<dialog class="find" aria-label="Search"><form method="dialog"><input type="search" placeholder="Search notes and stories" aria-label="Search" autocomplete="off" spellcheck="false"><ol></ol></form></dialog>
<script id="index" type="application/json">{{index}}</script>
<script>
// Search: Ctrl K (⌘K on a Mac) or the header's icon. Every word must appear; the builder writes the index.
(() => {
  const $ = (s, r = document) => r.querySelector(s), d = $(".find"), q = $("input", d), ol = $("ol", d), icon = $(".search");
  const root = $(".top > a").getAttribute("href").replace(/index\.html$/, ""), all = JSON.parse($("#index").textContent);
  icon.title = `Search (${/Mac|iP/.test(navigator.platform) ? "⌘" : "Ctrl "}K)`;
  const show = () => {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean), hit = (e) => words.every((w) => (e[0] + " " + e[2]).toLowerCase().includes(w));
    ol.replaceChildren(...all.filter(hit).slice(0, 12).map(([title, href, text]) => {
      const li = document.createElement("li"), a = li.appendChild(Object.assign(document.createElement("a"), { href: root + href, textContent: title }));
      if (text) a.appendChild(Object.assign(document.createElement("small"), { textContent: text.slice(0, 120) }));
      return li;
    }));
  };
  const open = () => (d.open || d.showModal(), q.select(), show());
  icon.addEventListener("click", open);
  addEventListener("keydown", (e) => e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey) && !e.defaultPrevented && (e.preventDefault(), d.open ? d.close() : open()));
  q.addEventListener("input", show);
  q.addEventListener("keydown", (e) => e.key === "ArrowDown" && (e.preventDefault(), $("a", ol)?.focus()));
  $("form", d).addEventListener("submit", () => { const a = $("a", ol); if (a) location.href = a.href; });
  d.addEventListener("click", (e) => e.target === d && d.close());
})();
// Light or dark: the device's, until the header's button picks the other; the choice is remembered.
(() => {
  const b = document.querySelector(".mode"), h = document.documentElement, dev = matchMedia("(prefers-color-scheme: dark)");
  const own = () => (dev.matches ? "dark" : "light"), now = () => h.dataset.mode || own(), show = () => b.setAttribute("aria-pressed", now() === "dark");
  b.addEventListener("click", () => {
    const m = now() === "dark" ? "light" : "dark";
    m === own() ? delete h.dataset.mode : (h.dataset.mode = m);
    try { h.dataset.mode ? localStorage.setItem("mode", m) : localStorage.removeItem("mode"); } catch (e) {}
    show();
  });
  dev.addEventListener("change", show), show();
})();
</script>
{{script}}
